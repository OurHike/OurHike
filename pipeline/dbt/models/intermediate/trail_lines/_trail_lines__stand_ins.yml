version: 2

# DELETE AT MERGE, with the model it describes. int_trail_lines__coded_domains
# is tl-at's (stage 3 of #1793 — Rebuild the data platform as dlt → dbt: seven
# contracted marts, a monthly refresh, published docs, and lighter phone
# downloads), and its own YAML replaces this file. It is here so that
# int_trail_lines__blazes builds on the network branch before tl-at's model
# exists.
models:
  - name: int_trail_lines__coded_domains
    description: >
      STAND-IN with no rows: each ArcGIS coded domain a line source's blaze
      field decodes against, one row per code. tl-at's model of the same
      name and columns replaces it at merge.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_key, field_name, code]
    columns:
      - name: source_key
        description: The registry key of the line source.
      - name: field_name
        description: The blaze field, as sources.json spells it.
      - name: code
        description: One code of the field's domain.
      - name: label
        description: What the code decodes to.
