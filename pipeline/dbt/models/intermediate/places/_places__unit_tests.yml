  - name: places_a_park_cut_into_pieces_carries_the_same_miles_as_the_whole_polygon
    model: int_places__resolved
    description: >
      The park of places_a_park_carries_the_miles_of_published_line_inside_its_boundary,
      drawn with 17 points rather than 5, measured with places_piece_vertices
      at 5 so the polygon is halved into pieces (int_places__resolved's
      "MEMORY" note) and the line crossing it is measured piece by piece:
      the same 3.0 miles, centroid and box as the uncut park.
    # A dbt 2.0.6 unit test's vars are its overrides alone, so every var the
    # model reads is listed, as places_a_point_s_miles_are_bounded_by_places_trail_radius_miles lists them.
    overrides:
      vars:
        places_trail_radius_miles: 5.0
        trail_lines_network_named_trail_threshold_miles: 50.0
