version: 2

models:
  - name: base_nycparks__nyc_drinking_fountains
    data_tests:
      # Says how many rows the dedupe dropped. Each is an exact copy
      # (duplicates_are_exact on the raw table), so this only reports.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('nycparks', 'raw_nycparks__nyc_drinking_fountains')
          config:
            severity: warn
    description: >
      NYC Parks Drinking Fountains (outdoor types), every row, keyed and
      deduped. Nothing reads it yet: the stage-3 unions of #1793 do.
    columns:
      - name: poi_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          nyc_drinking_fountains, "system", gispropnum, the registry key first
          and then the columns measured unique for this layer.
        data_tests: [not_null, unique]
  - name: base_nycparks__nyc_park_polygons
