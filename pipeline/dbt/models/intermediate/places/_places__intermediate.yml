version: 2

# The places family's intermediates (stage 3 of #1793 — Rebuild the data
# platform as dlt → dbt: seven contracted marts, a monthly refresh, published
# docs, and lighter phone downloads): export_places.py's rules in SQL, PL01 to
# PL11 in pipeline/ELT.md's ledger, in the order build_output() applies them.
# Each model's header says which rule it holds and what it rests on.
models:
  - name: int_places__park_units
    description: >
      The parks places.json lists, one row per park unit: load_parks() in
      SQL. Only while oprhp_park_polygons may publish (PL01); every polygon
      made valid first (PL03); grouped by the unit field the registry entry
      declares, a polygon with no unit joining the one unit wearing its name,
      a unit named by the name most of its polygons wear (PL02).
    columns:
      - name: place_id
        description: "`oprhp_park_polygons:<unit>`, or `oprhp_park_polygons:<id>` for a polygon that stands alone."
        data_tests: [not_null, unique]
      - name: name
        description: The name most of the unit's polygons wear, the shortest on a tie, then the first in code-point order.
        data_tests: [not_null]
      - name: category
        description: The unit's commonest Category, null where none of its polygons carries one.
      - name: state
        description: The state the park layer's organization declares in sources.json, null where it declares none.
      - name: unit_order
        description: >
          The unit's place in load_parks()'s list, from 0: units with a unit
          id by their first polygon, then the polygons that stand alone. The
          first unit holding a point names the park it sits in.
        data_tests: [not_null, unique]
      - name: polygons
        description: How many of the layer's polygons make the unit.
      - name: park_wkt
        description: The union of the unit's polygons, each made valid, in lon/lat, as WKT text.
        data_tests: [not_null]
      - name: club
        description: The extract folder that lands the layer, nysparks.
      - name: source_key
        description: oprhp_park_polygons.
      - name: _loaded_at
        description: The latest load stamp among the unit's polygons.

  - name: int_places__waypoints
    description: >
      The published trailheads, parking and resupply points places.json takes
      its point places from (PL05): the points_of_interest mart's rows in
      poi_trailhead.geojson, poi_parking.geojson, poi_resupply.geojson and
      nearby_poi.geojson, with the lon and lat each file prints, as a phone
      parses them, and their place in load_point_places()'s reading order.
    columns:
      - name: poi_id
        description: The published POI id.
        data_tests: [not_null, unique]
      - name: poi_type
        description: "`trailhead`, `parking` or `resupply`."
      - name: source
        description: The POI's published `source`.
      - name: source_key
        description: The registry key that source is.
      - name: source_feature_id
        description: The POI's published `source_feature_id`, which a town's state is looked up by.
      - name: name
        description: The POI's published name, null where it has none.
      - name: lon
        description: The longitude the POI's file publishes, as a phone parses it.
      - name: lat
        description: The latitude the POI's file publishes, as a phone parses it.
      - name: waypoint_order
        description: >
          The row's place in load_point_places()'s list: the three
          poi_<type>.geojson files in trailhead, parking, resupply order,
          then nearby_poi.geojson, each in its record order.
        data_tests: [not_null, unique]
      - name: club
        description: The extract folder that landed the POI.
      - name: _loaded_at
        description: When the extract loaded the POI's source.

  - name: int_places__lines
    description: >
      The published lines places.json measures (PL06): the network's lines
      whose source may publish and the A.T.'s centerline, with the name each
      is summed under for the long trails (PL07). The A.T.'s side trails
      measure nothing, as today; the header says why that is a finding.
    columns:
      - name: trail_line_id
        description: The published line id.
        data_tests: [not_null, unique]
      - name: club
        description: The extract folder that landed the line.
      - name: source_key
        description: The line's registry key, published as its `source`.
        data_tests: [not_null]
      - name: _loaded_at
        description: When the extract loaded the line's source.
      - name: line_kind
        description: "`network`, or `centerline` for the A.T.'s line."
      - name: name
        description: The line's own name, as its file publishes it.
      - name: trail_name
        description: >
          The name the line is summed under for a long trail: the route the
          centerline's source owns for every centerline line, the line's own
          name otherwise.
      - name: geom_geojson
        description: The line a phone draws, as GeoJSON text in lon/lat.
        data_tests: [not_null]

  - name: int_places__point_places
    description: >
      The trailheads, parking areas and towns places.json lists, before
      anything is measured (PL05): published waypoints only, a town only
      from a layer the registry calls a town layer, named rows only, each
      published id once. Each carries a postal code only where its source or
      its organization states one (PL04).
    columns:
      - name: place_id
        description: The published waypoint id, which is also the place's id.
        data_tests: [not_null, unique]
      - name: poi_id
        description: The same id, published as `poiId`.
      - name: name
        description: The waypoint's published name, stripped.
      - name: kind
        description: "`trailhead`, `parking` or `town`."
        data_tests:
          - accepted_values:
              arguments:
                values: [trailhead, parking, town]
      - name: state
        description: >
          A town's state from ATC's Communities layer, read into a postal
          code, else the state the source's organization declares; null where
          neither says.
      - name: source
        description: The waypoint's published `source`.
      - name: lon
        description: The longitude the waypoint's file publishes, as a phone parses it.
      - name: lat
        description: The latitude the waypoint's file publishes, as a phone parses it.
      - name: waypoint_order
        description: The waypoint's place in load_point_places()'s list.
      - name: club
        description: The extract folder that landed the waypoint.
      - name: source_key
        description: The waypoint's registry key.
      - name: _loaded_at
        description: When the extract loaded the waypoint's source.

  - name: int_places__resolved
    description: >
      Every row places.json publishes, measured and in the file's order: the
      long trails (PL07), the miles of published line inside each park and
      within the radius of each waypoint (PL08), the park each waypoint sits
      in (PL09), a trailhead or parking area with no line near it dropped
      (PL10), and no miles anywhere when nothing was measured (PL11).
      Must-match numbers are JSON text, which the places mart casts back.
    config:
      # Logs each row holding text DuckDB could not store (macros/storable_text.sql).
      post_hook: "{{ log_broken_text(this, ['place_id', 'kind', 'source_key']) }}"
    data_tests:
      # Warns: dbt prints only a row count, so the model's post-hook logs
      # the rows, and int_places__final leaves them out (macros/storable_text.sql).
      - dbt_utils.expression_is_true:
          arguments:
            expression: "broken_text is null"
          config:
            severity: warn
    columns:
      - name: place_id
        description: The published `id`; null only on a row whose id DuckDB could not store (broken_text).
        data_tests:
          - not_null:
              config:
                where: "broken_text is null"
          - unique:
              config:
                where: "broken_text is null"
      - name: place_order
        description: The row's place in places.json, by kind, then name, then id.
        data_tests: [not_null, unique]
      - name: kind
        description: "`park`, `town`, `trailhead`, `parking` or `trail`."
      - name: name
        description: The published name.
      - name: poi_id
        description: The waypoint's published id, on a waypoint.
      - name: category
        description: A park's category.
      - name: state
        description: A postal code, where the source or its organization states one.
      - name: within_park
        description: The park a waypoint sits in, published as `within`.
      - name: lon
        description: The longitude, as JSON number text.
      - name: lat
        description: The latitude, as JSON number text.
      - name: bbox
        description: A park's or a trail's [west, south, east, north], as JSON text.
      - name: trail_metres
        description: The measured metres on the WGS84 ellipsoid (decision 97) the miles are rounded from, null when nothing was measured.
      - name: trail_miles
        description: The miles of published trail to a tenth, as JSON number text; null when nothing was measured.
      - name: trail_miles_measured
        description: Whether any published line was measured, the same on every row.
      - name: source
        description: The published `source`.
      - name: club
        description: The extract folder that landed the row.
      - name: source_key
        description: The row's registry key.
      - name: _loaded_at
        description: When the extract loaded the row's source.
      - name: broken_text
        description: >
          Each text column of the row that DuckDB could not store, as
          `column=` and the column's first 60 bytes in hex, joined with `; `;
          null on every row it could store (macros/storable_text.sql, after
          monthly runs 26 and 27). The column itself is null on such a row,
          and int_places__final leaves the place out.
  - name: int_places__final
    description: >
      The places mart's rows before their row dates (decision 57):
      what models/marts/places/places.sql held until then, every
      contracted column but _first_seen_at and _changed_at.
      int_places__history snapshots it, and the mart reads that snapshot.
    columns:
      - name: place_id
        description: The mart's key.
        data_tests: [not_null, unique]
