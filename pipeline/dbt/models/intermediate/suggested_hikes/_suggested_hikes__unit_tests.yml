          - {hike_number: 205, name: 'Hike 205', stated_miles: 4.0, route_type: 'Shuttle'}
          - {hike_number: 206, name: 'Hike 206', stated_miles: 4.0, route_type: 'Out and back'}
          - {hike_number: 207, name: 'Hike 207', stated_miles: 4.0, route_type: 'Circuit'}
          - {hike_number: 208, name: 'Hike 208', stated_miles: 4.0, route_type: ' Lollipop '}
          - {hike_number: 209, name: 'Hike 209', stated_miles: 3.0, route_type: 'Shuttle'}
          - {hike_number: 210, name: 'Hike 210', stated_miles: 4.0, route_type: 'Circuit'}
          - {hike_number: 211, name: 'Hike 211', stated_miles: 4.0, route_type: 'Circuit'}
          - {hike_number: 212, name: 'Hike 212', stated_miles: 0.0, route_type: 'Shuttle'}
          - {hike_number: 213, name: 'Hike 213', stated_miles: 4.0, route_type: 'Shuttle'}
    expect:
      rows:
        - {hike_number: 201, grade: 'strong', route_notes_json: '[]'}
        - {hike_number: 202, grade: 'fair', route_notes_json: '["the export states no length, so nothing independent confirms the track is this hike''s"]'}
        - {hike_number: 203, grade: 'fair', route_notes_json: '["the track measures 5.0 mi against the export''s stated 4.0 mi (+25%)"]'}
