  - name: int_suggested_hikes__highlights_resolves_what_resolve_resolves
    description: >
      SH12 and SH13: lib/highlights.py's resolve() and as_published(), every
      row in the file's order with the first rule it breaks in resolve()'s
      words. A leg's miles come from the published POIs and are ordered; an end
      with no published mile, both ends at one mile, a leg that is not a
      well-formed object, or any failing leg drops the whole row; the first row
      to carry an id claims it; the club is the first stretch whose half-open
      range holds the first leg's low end. From test_lib_highlights.py's
      resolving, refusal, club and shape cases;
      tests/test_dbt_suggested_hikes_parity.py runs resolve() over the same
      rows.
    model: int_suggested_hikes__highlights
    given:
      - input: ref('base_ourhike__highlights')
        rows:
          # test_takes_the_mile_range_from_the_published_pois; test_derives_the_club_rather_than_taking_the_file_s_word; test_names_its_basis_and_never_says_popular
          - {file_row: 0, highlight: '{"id":"mcafee-knob","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"park:1","to_poi":"summit:1"}]}'}
          # test_orders_the_ends_so_a_leg_never_runs_backwards
          - {file_row: 1, highlight: '{"id":"backwards","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"summit:1","to_poi":"park:1"}]}'}
          # test_drops_what_it_cannot_place: from_poi gone
          - {file_row: 2, highlight: '{"id":"from-gone","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"gone:9","to_poi":"summit:1"}]}'}
          # the same pytest: to_poi gone
          - {file_row: 3, highlight: '{"id":"to-gone","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"park:1","to_poi":"gone:9"}]}'}
          # the same pytest: no from_poi
          - {file_row: 4, highlight: '{"id":"no-from","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","to_poi":"summit:1"}]}'}
          # the same pytest: no trail
          - {file_row: 5, highlight: '{"id":"no-trail","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"from_poi":"park:1","to_poi":"summit:1"}]}'}
          # the same pytest: no legs
          - {file_row: 6, highlight: '{"id":"no-legs","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[]}'}
          # the same pytest: no name
          - {file_row: 7, highlight: '{"id":"no-name","name":"","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"park:1","to_poi":"summit:1"}]}'}
          # the same pytest: no id
          - {file_row: 8, highlight: '{"id":"","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"park:1","to_poi":"summit:1"}]}'}
          # test_one_bad_row_does_not_cost_the_rows_beside_it
          - {file_row: 9, highlight: '{"id":"wayah-bald","name":"Wayah Bald","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"park:1","to_poi":"summit:1"}]}'}
          # test_drops_a_poi_that_published_without_a_mile
          - {file_row: 10, highlight: '{"id":"no-mile","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"nomile:1","to_poi":"summit:1"}]}'}
          # test_keeps_mile_zero_which_is_springer_mountain
          - {file_row: 11, highlight: '{"id":"springer","name":"Springer Mountain","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"springer:0","to_poi":"springer:1"}]}'}
          # test_drops_a_walk_between_two_ends_at_the_same_mile
          - {file_row: 12, highlight: '{"id":"same-mile","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"park:1","to_poi":"twin:1"}]}'}
          # test_drops_the_second_of_two_rows_claiming_one_id
          - {file_row: 13, highlight: '{"id":"mcafee-knob","name":"A different walk","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"park:1","to_poi":"summit:1"}]}'}
          # test_publishes_nothing_of_a_highlight_whose_second_leg_fails
          - {file_row: 14, highlight: '{"id":"two-legs-one-bad","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"park:1","to_poi":"summit:1"},{"trail":"Falling Waters","from_poi":"summit:1","to_poi":"gone:9"}]}'}
          # test_a_mile_two_clubs_share_resolves_northbound
          - {file_row: 15, highlight: '{"id":"northbound","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"gap:77","to_poi":"gap:80"}]}'}
          # test_an_unattributed_mile_has_no_club_and_that_is_not_an_error
          - {file_row: 16, highlight: '{"id":"unattributed","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"mid:500","to_poi":"mid:505"}]}'}
          # a club whose acronym is not a string answers no club, and the next club is not asked
          - {file_row: 17, highlight: '{"id":"no-acronym","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"nullclub:1","to_poi":"nullclub:2"}]}'}
          # a leg that is not an object
          - {file_row: 18, highlight: '{"id":"leg-not-object","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":["park:1"]}'}
          # legs that are not a list
          - {file_row: 19, highlight: '{"id":"legs-not-list","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":"park:1"}'}
          # an id that is not a string
          - {file_row: 20, highlight: '{"id":5,"name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"park:1","to_poi":"summit:1"}]}'}
          # a name that is not a string
          - {file_row: 21, highlight: '{"id":"name-not-string","name":7,"note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"park:1","to_poi":"summit:1"}]}'}
          # no to_poi
          - {file_row: 22, highlight: '{"id":"no-to","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"park:1"}]}'}
          # an empty trail
          - {file_row: 23, highlight: '{"id":"empty-trail","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"","from_poi":"park:1","to_poi":"summit:1"}]}'}
          # each end to 2 decimals as round(x, 2) cuts it
          - {file_row: 24, highlight: '{"id":"two-decimals","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"round:1","to_poi":"round:2"}]}'}
          # no note, and a reviewed date that is not a string: both published as ''
          - {file_row: 25, highlight: '{"id":"bare-citation","name":"Bare Citation","reviewed":20260820,"legs":[{"trail":"AT","from_poi":"park:1","to_poi":"summit:1"}]}'}
          # the first row to carry an id claims it, even though it then fails
          - {file_row: 26, highlight: '{"id":"claimed","name":"","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"park:1","to_poi":"summit:1"}]}'}
          # so a second row with that id is a duplicate
          - {file_row: 27, highlight: '{"id":"claimed","name":"Claimed Walk","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"park:1","to_poi":"summit:1"}]}'}
          # two legs on two trails, the club read from the first
          - {file_row: 28, highlight: '{"id":"two-trails","name":"McAfee Knob","note":"The most photographed spot on the A.T.","reviewed":"2026-08-20","legs":[{"trail":"AT","from_poi":"park:1","to_poi":"summit:1"},{"trail":"Falling Waters","from_poi":"summit:1","to_poi":"round:2"}]}'}
      - input: ref('int_suggested_hikes__published_pois')
        rows:
          - {poi_id: 'park:1', mile: 705.6}
