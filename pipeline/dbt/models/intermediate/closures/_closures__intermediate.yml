  - name: int_closures__gate_holds_back_an_atc_file_whose_two_landings_disagree
    description: >
      reference/atc_updates.json lands twice, as its rows and whole, and a
      file whose two landings count different rows is two files, read in
      different runs: held back rather than published with a review date
      that belongs to the other.
    model: int_closures__gate
    given:
