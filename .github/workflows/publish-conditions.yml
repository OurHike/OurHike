# Publishes verified closures, verified reports and the ATC's own trail
# updates to R2, so reading any of them needs no running server.
#
# features/CONDITIONS_DELIVERY.md is the design; this is steps 1 and 3 of its
# order of work. The third artifact is features/ATC_TRAIL_UPDATES.md's, and
# it arrives by a different road: closures and reports are queried out of the
# database, while ATC's notices are baked from a file in git that a person
# reviewed (#460). Same bucket prefix, same daily clock, same publish step -
# and no credential, which is why the legs are gated separately below.
#
# HOURLY since 2026-08-15 (#720), where this used to be daily on the
# maintainer's "a closure can be latent by a day" from 2026-08-08. What
# changed is that the client now re-reads on the same clock, so the shorter
# cadence actually reaches a phone instead of only the bucket. The artifacts
# still carry their own `generated_at` and the client still renders it, so a
# hiker is told how old the answer is rather than left to assume - that was
# never a function of how often this ran.
#
# A THIRD LEG SINCE #720: this week's drought bands. It rides here rather
# than in its own workflow because it is the same shape of job - fetch
# something public, bake it into conditions/, publish - and because every
# writer of latest.json has to share the concurrency group below anyway.
# What it does NOT share is the cadence's justification: drought changes
# once a week, on a Thursday, and the hourly clock exists only so that
# Thursday is picked up within the hour. Both scripts are built to make that
# nearly free - see their steps.
#
# WHY THIS IS SAFE TO RUN BEFORE ANYTHING IS CONFIGURED. The reader
# credential is account work on Supabase, and it does not exist yet. Like
# migrate.yml's UA job, this skips with a warning rather than a red X when
# the secret is absent - a scheduled workflow that fails every night until
# someone does account work trains people to ignore it.
#
# WHY IT CANNOT PUBLISH AN EMPTY ARTIFACT. Row-level security is on for every
# table with no policies, and the backend only works because it connects as
# the owner. The reader is not the owner, so a missing GRANT or policy returns
# zero rows *without an error* - which, published, is a client holding a valid
# baseline that says the trail is clear. export_conditions.py asks the catalog
# whether its permissions are really in place and refuses to write anything if
# they are not, which is what makes a genuinely empty result trustworthy.
#
# NOT GATED ON AN ENVIRONMENT. There is nothing to approve: this reads
# verified rows a hiker could already fetch from `GET /closures` without an
# account, and writes them to a bucket. schema-drift.yml records the same
# reasoning for the same shape of job.
#
# ONE RUN PER DATA ENVIRONMENT (features/DATA_ENVIRONMENTS.md). Each reads its
# own database and writes its own prefix, so the two never meet: a test closure
# a UA moderator verified cannot reach a hiker's map, and production's verified
# rows are not what a tester rehearses moderation against. That isolation is
# real, and it is why the UA test closure below was never a production risk -
# but it is not a licence to leave invented rows in UA either, because a UA
# tester reading a map is reading a map. Maintainer decision 2026-09-09 took
# the work-projects samples out of the reviewed file this workflow bakes; the
# one invented row the repository cannot reach from here is
# `ua-test-closure-verified` in the UA conditions database, which is a DELETE
# a maintainer runs, not a step this workflow can take. The matrix jobs write
# disjoint keys, so they never race each other - but each still joins the
# publish-data group below, because the race that matters is with the other
# four workflows, over the shared latest.json (#645).
#
# The ATC leg is deliberately NOT split. Those notices are baked from a file in
# git that a person reviewed - there is no database behind them and no
# environment they could differ by - so both runs publish the same reviewed
# content into their own tree, which is what makes UA's copy a real rehearsal
# rather than an empty one.
#
# WHAT THIS CLOCK DOES TO THE REPOSITORY'S ACTIONS CACHE, which is why the
# three save keys below are content hashes rather than `github.run_id`.
#
# Count it off this file: 24 runs a day, two matrix legs each, three
# `actions/cache/save` steps per leg, under a key that cannot repeat.
#
# Measured on run #342, the scheduled run of 2026-09-09T00:35Z: the production
# leg's drought save reported "Sent 18640702 of 18640702 (100.0%)" and "Cache
# saved with key: drought-inputs-34295667889" - 18.6 MB compressed, once an
# hour, under a key nothing will ever ask for again. Not two: one entry exists
# per key, so the ua leg computing the identical key cannot add a second copy,
# and both save steps concluded success on that run, which is what says this
# is the design working as written rather than a failure nobody noticed.
#
# So three new entries a run, 72 a day, of which the drought one is
# 24 x 18.6 MB = about 450 MB a day. GitHub's per-repository cache is 10 GB
# and evicts least-recently-used, so this workflow alone fills the whole
# repository's allowance with itself in roughly three weeks - and it is
# already sharing that allowance. The obvious thing it walks out is
# publish-vector-data.yml's fetch-outputs entry, around 400 MB (#1311 measured
# 422 MB moving into the cache on run #88, 2026-09-08), whose comment at "Do
# not expect it to hit" blames GitHub's 7-day idle eviction for the misses it
# sees.
#
# THE HYPOTHESIS IS THAT THIS WORKFLOW IS WHAT ACTUALLY EVICTS IT, days before
# the 7-day rule could - and that is reasoned, not measured. It follows from
# the arithmetic above and GitHub's documented eviction policy, and it has
# never been checked against a cache listing. What would settle it: one
# `GET /repos/OurHike/OurHike/actions/caches`, recording every entry's size
# and `last_accessed_at`, taken before this change and again a week after. If
# the vector build's entry survives a week where it used to vanish in three
# days, the hypothesis was right; if it still vanishes, the eviction pressure
# is somewhere else and this change bought only the smaller cache bill.
#
# ONE LIMIT ON THAT HYPOTHESIS, narrower than the arithmetic makes it look and
# recorded because the arithmetic alone reads as proof. The vector build's own
# comment expects its publishes a month apart - "DATA_RELEASES.md puts
# releases on a monthly-ish cadence" - and on a monthly cadence the 7-day idle
# rule reaches that entry first no matter what this workflow does. The churn
# below can only be the deciding evictor while vector builds are days apart.
# They are at the moment: #1311 - The vector build went from 20 to 108 minutes
# in twelve days records twelve dispatches on 2026-09-08 alone. So the change
# is worth making and the hypothesis is worth settling, but neither predicts
# anything about a quiet month.
#
# WHAT A CONTENT HASH FIXES AND WHAT IT DOES NOT, because only one of the
# three is actually fixed:
#
#  - The drought entry is fixed, and it is the one carrying the bytes. Its key
#    hashes the dated USDM release and the centerline, neither of which moves
#    on an hourly clock, so every run after the week's first computes a key
#    that already exists, and an existing key is one entry however many jobs
#    write it. One entry per USDM release rather than 24 a day: about 450 MB a
#    day becomes about 19 MB a week.
#  - The ATC and NYNJTC entries are NOT fixed, and claiming otherwise would be
#    the confident wrong answer. Both fetchers stamp `fetched_at` - this run's
#    clock - into the payload they cache (`fetch_atc_updates.py:133` and
#    `fetch_nynjtc_alerts.py:212`, each inside that script's one
#    `CACHE_PATH.write_text`), so those files' bytes move hourly
#    whether or not ATC or NYNJTC posted anything, and a hash of moving bytes
#    moves too. They are small beside the drought entry, which is the only
#    reason this is tolerable rather than a blocker. What content addressing
#    does buy them is the hour a fetch fails: the restored copy is carried
#    forward unchanged, so the key it computes is the key that already holds
#    those bytes, and the save is refused as a duplicate - a warning in the
#    log and no second entry - instead of opening a fresh one. Stopping their
#    churn outright means keeping the fetch clock out of the cached payload,
#    which is a change to those two scripts and not to this file.
#
# CONSIDERED AND REJECTED, because the obvious way to make bytes stop moving
# is to stop stamping them. Every artifact here carries a `generated_at`, and
# there is no one line to delete: each exporter writes its own, in its own
# `build_document` - export_conditions.py, export_atc_updates.py,
# export_nynjtc_alerts.py, export_drought.py, with export_work_projects.py
# stamping inline. That stamp is exactly what makes an unchanged bake produce
# changed bytes. Two ways to stop it, both worse than the cache bill:
#
#  - Drop it. client/src/lib/publishedConditions.ts refuses a document with no
#    `generated_at` rather than defaulting one - "the one strict thing here" -
#    so the phone would fall back to whatever copy it kept and the hourly
#    publish would reach nobody at all.
#  - Freeze it, to the reviewed date or to the hour. conditionState.ts:134-136
#    turns the stamp into "Conditions as of 2h ago" / "3d ago", so a closure a
#    moderator verified this hour would tell a hiker it was days old.
#
# And publishing less often, the third version of the same trade, is the
# cadence the section above argues for. A cheaper cache is not worth a verified
# closure that reads as stale - or one that does not read at all.

name: Publish conditions

# Every writer of latest.json shares this group (publish-vector-data.yml,
# build-basemap.yml, build-dem.yml, build-raster.yml): publish() reads the
# manifest, uploads for as long as the artifacts take, and writes the merge
# last, so two concurrent publishes interleave and whichever writes last
# reverts the other's entries (#645). This workflow was the one writer
# outside the group - its header used to argue the matrix legs write
# disjoint keys, which was true and answered a different question.
#
# At the WORKFLOW level, not on the job, and that placement is load-bearing:
# concurrency groups coalesce rather than queue (one pending entrant; a newer
# pending run cancels the older), so a job-level group would let the ua leg's
# arrival cancel the production leg's pending slot whenever another publish
# held the group - production's closures silently a day older, with no red
# run. One run taking the group once means both legs publish or the whole
# run visibly waits/cancels together, and a cancelled daily run is healed by
# tomorrow's cron.
concurrency:
  group: publish-data
  cancel-in-progress: false

on:
  schedule:
    # :40 past every hour. Off the hour for the reason every cron in this
    # directory records - GitHub queues everything submitted at :00 behind
    # everyone else's - and clear of check-pending-approvals at :07 and :37.
    #
    # HOURLY RATHER THAN DAILY, which reverses the cadence recorded in this
    # file's header. That header quoted the maintainer, 2026-08-08: "a closure
    # can be latent by a day. we won't be adjusting minute by minute." The
    # call was revisited on 2026-08-15 and moved to hourly, which is neither
    # of those extremes: a closure a moderator verifies at lunchtime reaches a
    # hiker's phone the same afternoon, and nothing here polls minute by
    # minute.
    #
    # It only means anything because the client re-reads on the same clock.
    # Both condition reads used to run once per online transition, so an
    # hourly publish would have landed in the bucket and reached nobody -
    # client/src/lib/useConditions.ts's CONDITIONS_REFRESH_MS is the other
    # half of this number and the two are commented as a pair.
    - cron: "40 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Lines reach the log when printed, not when the step exits - see
# publish-vector-data.yml's own env block for the measurement (#1311). The
# same block-buffering hid every step's timing here too, on the one
# workflow that runs 48 times a day.
env:
  PYTHONUNBUFFERED: "1"

jobs:
  publish:
    name: Publish (${{ matrix.data_environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run per data environment, because this is the source where sharing
    # hurts most: closures and reports are baked from a *database*, so a single
    # bake would put whichever database it read in front of both audiences at
    # once (features/DATA_ENVIRONMENTS.md). UA moderating a test closure would
    # be a closure on a hiker's map, and a hiker's verified closure would be
    # what a tester was handed to rehearse against.
    #
    # fail-fast off, because the two are independent: UA's database being
    # unreachable is not a reason to leave production's safety data a day
    # older than it needs to be.
    strategy:
      fail-fast: false
      matrix:
        data_environment: [production, ua]
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Is there a database to read
        id: can
        # Before the checkout, so not in pipeline/ - migrate.yml's gate has
        # the reasoning for testing the secret this way rather than letting
        # the connection fail with something less legible.
        #
        # Both secrets are named literally rather than indexed by the matrix
        # value. GitHub's `a && b || c` yields `c` whenever `b` is empty, and
        # an unset production URL silently selecting UA's database is the one
        # mistake this whole job exists to make impossible -
        # .github/tests/test_repository_settings.py also reads these names as
        # text, so an indexed reference would leave the settings undeclared.
        working-directory: .
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_CONDITIONS_DATABASE_URL }}
          UA_URL: ${{ secrets.UA_CONDITIONS_DATABASE_URL }}
        run: |
          if [ "${{ matrix.data_environment }}" = "production" ]; then
            CONFIGURED="$PRODUCTION_URL"
          else
            CONFIGURED="$UA_URL"
          fi
          if [ -z "$CONFIGURED" ]; then
            echo "::warning::No ${{ matrix.data_environment }} conditions database is configured, so no closures or reports were published for it. The ATC trail-updates leg does not need one and still ran. See features/CONDITIONS_DELIVERY.md and #429."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # No longer gated on the database, because half this job no longer
      # needs one. ATC's Trail Updates are baked from a reviewed file in git
      # (features/ATC_TRAIL_UPDATES.md, #460) - no query, no credential - and
      # gating the checkout on a secret that leg never uses would have made
      # the ATC layer wait on Supabase account work it has nothing to do with.
      - uses: actions/checkout@v7

      # `cache: pip`, which the other four workflows that run publish.py all
      # set and this one did not - checked across the directory 2026-09-09 and
      # now checked on every run by
      # .github/tests/test_cache_keys_are_content_addressed.py. The install
      # below therefore reached PyPI for the whole of pipeline/requirements.txt
      # on all 48 jobs a day, where every other publisher pays it once per
      # change to that file. Measured on run #342, 2026-09-09: 13 s on the ua
      # leg and 16 s on production, so about eleven minutes of runner time a
      # day, most of which this line gives back.
      #
      # `cache-dependency-path` pins the key to the one requirements file this
      # job installs. Left off, setup-python hashes every requirements file in
      # the tree, so a backend or .github/tests pin nothing here installs would
      # move this key and throw the entry away.
      #
      # It also pulls the opposite way to the three caches below: this is one
      # small entry that 48 jobs a day RESTORE, and an entry read every half
      # hour is the last thing a least-recently-used policy evicts.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Before the database leg, and unconditionally. Writes nothing at all
      # while nobody has reviewed reference/atc_updates.json, and says so on
      # stdout rather than failing: "we have not looked yet" is a true
      # statement about this feature, and a red X for it would be noise on a
      # job that is working.
      #
      # STILL UNCONDITIONAL ON THE HOURLY CLOCK, and that is a deliberate
      # non-change (#720). This leg bakes a file a human reviewed and merged,
      # so its content moves when a pull request lands and at no other time -
      # twenty-four bakes a day produce twenty-four identical artifacts. The
      # case for leaving it alone anyway is that the alternative costs more
      # than it saves: it is a few seconds of CPU against a skip condition
      # that would have to know when the file last changed, and a wrong skip
      # here means ATC's notices silently stop republishing. Cheap and
      # obviously correct beats clever on the leg that carries closures.
      #
      # SINCE #963 THE SENTENCE ABOVE IS ONLY HALF TRUE, and the half that
      # changed is the point of the step below. The reviewed file still moves
      # only when a pull request lands, but the bake no longer publishes only
      # that file: anything ATC has posted SINCE the review, and that reads
      # unambiguously, now rides out on this same hourly clock. What used to
      # be twenty-four identical artifacts is now twenty-four chances to carry
      # a notice nobody has typed yet.

      # Reads ATC's own site into data/raw/, which export_atc_updates.py then
      # gates. Deliberately allowed to fail without failing the job: if ATC is
      # unreachable or has re-themed, the previous cache stays put and the
      # export below still publishes every reviewed row. The reviewed rows are
      # what a person stood behind; losing the automatic ones for an hour is a
      # bad hour, and losing a hiker's whole ATC layer to somebody else's
      # outage would be the larger failure. A red step says it happened.
      # WITHOUT THIS THE POLITENESS DESIGN DOES NOT EXIST. A runner is
      # ephemeral and pipeline/data/ is gitignored, so an uncached hourly job
      # starts empty every time and asks ATC for all ten listing pages AND all
      # 89 updates - 99 requests an hour, 2,376 a day, for data that moves a
      # few times a month. The cache is what turns that into ten requests an
      # hour plus one refresh per update per day. Same reasoning, and the same
      # shape, as the drought inputs further down this file.
      - name: Restore ATC's trail updates
        uses: actions/cache/restore@v6
        with:
          path: pipeline/data/raw/atc_updates.json
          key: atc-updates-${{ github.run_id }}
          restore-keys: atc-updates-

      - name: Fetch ATC's trail updates
        continue-on-error: true
        run: python fetch_atc_updates.py

      # `always()`, so an hour when ATC was unreachable still carries the
      # previous cache forward. Saving only on success would throw the cache
      # away exactly when it is doing the most good - the run that could not
      # refetch is the run that most needs the copy it already had.
      #
      # The `hashFiles(...) != ''` half of that condition is new, and what it
      # buys is smaller than the obvious story - "otherwise the empty hour
      # saves an empty entry, and the prefix restore then prefers it" - which
      # is not what the action does. Read out of actions/cache's own source,
      # 2026-09-09: `@actions/cache`'s `saveCache` throws "Path Validation
      # Error: Path(s) specified in the action for caching do(es) not exist,
      # hence no cache is being saved" when none of the paths resolve, and
      # cache/save's `saveImpl` catches every error into `core.warning`. So an
      # hour that restored nothing and fetched nothing has been logging a
      # yellow no-op, not storing a nothing. No empty entry was ever created
      # here, and saying otherwise would be this file arguing for its own
      # change with a mechanism nobody checked.
      #
      # What the guard prevents is a malformed KEY. hashFiles returns the
      # empty string when nothing matched (GitHub's expressions reference,
      # read 2026-09-09), so an unguarded content-addressed key evaluates to
      # `atc-updates-` exactly - character for character the prefix the
      # restore above searches on. A one-path step has nothing it could put
      # under that key, so here the guard turns a warning into an honest skip
      # and no more. The drought step below is the one that saves three paths
      # under a key hashed from two of them, and it carries the argument for
      # why the invariant is worth holding in all three places rather than
      # re-reasoned per step.
      #
      # The key is a content hash, for the header's reason. Read that section
      # before assuming this stops the hourly churn: it does not, because
      # fetch_atc_updates.py writes this run's clock into the file as
      # `fetched_at`, so these bytes move hourly even when ATC has posted
      # nothing. What it does stop is the failed hour saving a second copy of
      # a file it did not change.
      - name: Save ATC's trail updates
        if: always() && hashFiles('pipeline/data/raw/atc_updates.json') != ''
        uses: actions/cache/save@v6
        with:
          path: pipeline/data/raw/atc_updates.json
          key: atc-updates-${{ hashFiles('pipeline/data/raw/atc_updates.json') }}

      - name: Export the ATC's reviewed trail updates
        run: python export_atc_updates.py

      # NYNJTC'S TRAIL ALERTS (#1078, #940), on the same shape as the ATC leg
      # above because they answer the same question for a different steward:
      # 160 miles of the A.T. and the trails in most of the parks this build
      # now draws. What ships is tightly bounded and is sources.json's
      # `nynjtc_notices_licence` block rather than this file's decision - the
      # headline, the locality their own region and state tags give, their
      # `modified` date and the URL of their page, and NOT their body text.
      # export_nynjtc_alerts.py applies that split; nothing here widens it.
      #
      # WHY THIS IS BEING WIRED NOW AND NOT WHEN IT WAS WRITTEN. It was not
      # wired at all: the fetcher, the exporter, its tests and its place in
      # publish.py's conditions manifests all landed, the registry was marked
      # `reaches_hikers: true` on the maintainer's instruction, and no step
      # ever ran the script - so `conditions/nynjtc_alerts.json` was 404 on
      # production (measured 2026-08-27) while the ATC file beside it was 200.
      # That is #940's pattern for the fourth time, and
      # .github/tests/test_exporters_are_published.py is what found it and
      # what stops the fifth.
      #
      # The cache earns its place for the ATC leg's reason, at a smaller
      # scale: one request for the alerts plus one per place taxonomy, five in
      # the steady state, for data that moves a few times a month. The
      # exporter reads this cache, so a run that could not reach NYNJTC
      # publishes the previous copy rather than nothing.
      - name: Restore NYNJTC's trail alerts
        uses: actions/cache/restore@v6
        with:
          path: pipeline/data/raw/nynjtc_alerts.json
          key: nynjtc-alerts-${{ github.run_id }}
          restore-keys: nynjtc-alerts-

      # `continue-on-error`, like the ATC fetch: NYNJTC being unreachable is
      # weather, and it must not take the drought bands and the verified
      # conditions down with it. The fetcher already exits non-zero rather
      # than writing a payload it does not recognise, and leaves the previous
      # cache in place when it does.
      - name: Fetch NYNJTC's trail alerts
        continue-on-error: true
        run: python fetch_nynjtc_alerts.py

      # Same shape as the ATC save above, and the same two caveats. The guard
      # keeps a cold-and-failed hour from computing the bare `nynjtc-alerts-`
      # prefix as its key - read that step for why that is the honest
      # description of what it does and "stops an empty entry being saved" is
      # not. And the content hash does not stop this entry churning hourly,
      # because fetch_nynjtc_alerts.py stamps `fetched_at` into the payload
      # too. It re-fetches every alert every run
      # rather than planning which are due, the way the ATC fetcher does, so
      # every entry in the file carries the new clock and not just the
      # document's header - these bytes move on every successful hour without
      # exception.
      - name: Save NYNJTC's trail alerts
        if: always() && hashFiles('pipeline/data/raw/nynjtc_alerts.json') != ''
        uses: actions/cache/save@v6
        with:
          path: pipeline/data/raw/nynjtc_alerts.json
          key: nynjtc-alerts-${{ hashFiles('pipeline/data/raw/nynjtc_alerts.json') }}

      # Exits without writing when there is no cache to read - a first run on
      # a cold cache whose fetch failed - which publish.py reads as "this
      # release has no such artifact" rather than as a failure.
      - name: Export NYNJTC's trail alerts
        run: python export_nynjtc_alerts.py

      # The volunteer workdays (#760), from the same kind of reviewed file as
      # the ATC leg above, with the same refuse-unreviewed posture and now
      # the same environment-blindness: both legs publish the identical
      # reviewed content into their own tree. This step used to pass
      # $OURHIKE_DATA_ENV because the reviewed file's '[Sample]' rows
      # published to UA and dev only (maintainer decision 2026-08-20, on
      # #760); maintainer decision 2026-09-09 retired those rows, so there is
      # nothing for the environment to select between. Every environment
      # carries exactly what a real club has supplied, which today is an
      # empty list, published deliberately so the client's read path is live
      # before the first real row lands.
      - name: Export the reviewed volunteer work projects
        run: python export_work_projects.py

      # THE DROUGHT LEG (#720), and its whole design is about being cheap
      # enough to sit on an hourly clock without being rude to NDMC or to
      # this repository's Actions budget (#395).
      #
      # Two things make it nearly free on the 167 hours a week when nothing
      # has changed. `fetch_drought.py` knows the week's stamp before it
      # requests any body - that is why it takes the dated file rather than
      # usdm_current.json - so a release already in the restored cache costs
      # one existence check instead of a 27.6 MB download. And the export
      # below is skipped outright when the artifact already describes the
      # newest release on disk, which is the ordinary case for six days out
      # of seven.
      #
      # The cache carries the raw releases AND the centerline the clip needs.
      # Restoring rather than re-fetching the centerline matters most: it is
      # 12 MB from ATC's ArcGIS service, and pulling it hourly to clip a
      # weekly polygon set would be the same discourtesy the fetch skip
      # exists to avoid.
      - name: Restore the drought inputs
        id: drought-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            pipeline/data/raw/drought
            pipeline/data/raw/centerline.geojson
            pipeline/data/processed/conditions/drought.json
          key: drought-inputs-${{ github.run_id }}
          restore-keys: drought-inputs-

      - name: Fetch this week's drought release
        id: drought-fetch
        run: python fetch_drought.py

      # The centerline, only when the cache did not carry one. Its own step
      # rather than a line inside the export, so that a cold cache is visible
      # in the log as the thing that made a run slow.
      #
      # This was an inline python heredoc until #1295 - a second, untested
      # implementation of lib/arcgis.py's offset paging, on urllib with no
      # retry, carrying the stop-on-a-short-page bug that lib/arcgis.py's own
      # regression tests exist to prevent. fetch_centerline.py owns the query
      # shape now and the shared paginator owns the loop; the script's
      # docstring has the argument. Being a real file also makes this fetch
      # visible to scripts/pipeline_scopes.py, which reads a workflow's scope
      # off the <name>.py files it mentions and could not see a heredoc.
      - name: Fetch the centerline, if the cache did not have it
        run: |
          if [ ! -s data/raw/centerline.geojson ]; then
            python fetch_centerline.py
          else
            echo "Centerline restored from cache."
          fi

      # One command, and the skip lives inside it (#731).
      #
      # This step used to be an inline python that decided whether to call
      # export_drought.py at all, and skipping it meant no drought_manifest.json
      # was written - which meant publish.py had nothing to collect and the
      # bands were uploaded never, with every step green. The export owns the
      # decision now: it rebuilds only when USDM's week has moved, and it
      # rewrites the manifest on every run either way, because the manifest is
      # not a record of work done but the statement "this file is ready to
      # publish" - true on a skipped run too.
      #
      # Measured: 0.35 s when the week has not moved, ~43 s when it has.
      - name: Export the drought bands
        run: python export_drought.py

      # THE ENTRY THE HEADER'S ARITHMETIC IS ACTUALLY ABOUT: the 27.6 MB
      # release plus the 12 MB centerline, 18.6 MB of them compressed and sent
      # 24 times a day under a key that could not repeat (measured on run #342,
      # 2026-09-09). This is the one a content hash fixes outright, down to one
      # entry per USDM release.
      #
      # THE KEY HASHES THE INPUTS, NOT EVERYTHING THE PATH SAVES, and the
      # difference is deliberate. `data/raw/drought` is a dated release file
      # and `centerline.geojson` is refetched only when the cache did not
      # carry one, so both are byte-stable for a week at a time and a hash of
      # them is a name for "which week's inputs are these". The third path,
      # the built artifact, is not: it carries its own `generated_at` from the
      # wall clock of whichever run built it (export_drought.py's
      # `build_document`), so two cold runs in the same week would produce
      # different bytes from identical inputs and earn a second full entry for
      # nothing.
      #
      # It is still saved - it is what makes the hourly run cheap, because
      # export_drought.py skips the ~43 s rebuild when the artifact on disk
      # already names this week (its `already_published`). That skip is also
      # why hashing the artifact would not have been the hourly disaster it
      # looks like: the exporter rewrites the MANIFEST on every run but not the
      # artifact, so these bytes really do sit still for six days out of seven.
      # Run #342 is that measured rather than argued - "3 drought row(s),
      # generated 2026-09-03T21:55:22Z" on a run six days later, and publish.py
      # reporting `skipped ['conditions/drought.json']` because the hash still
      # matched what was in the bucket. Hashing the inputs is the stronger
      # choice rather than the rescue: the key then means what produced the
      # entry, not when.
      #
      # The guard is the ATC step's, and this is the step where it is more
      # than tidiness. hashFiles is empty only when neither INPUT is on disk -
      # but the third path is an OUTPUT, which could in principle be there
      # when they are not, so this is the one key that could carry a payload
      # under the bare `drought-inputs-` prefix the restore above searches on.
      # Nothing in today's scripts reaches that state (export_drought.py
      # cannot write the artifact without a release to read), so this is an
      # invariant held cheaply rather than a fix for something observed, and
      # it is worth holding because the thing that would break it is a fourth
      # path added by somebody reading the paths and not this comment.
      #
      # A run that produced one input and not the other still saves, and
      # self-heals - fetch_drought.py refetches a missing release, and the
      # centerline step above refetches a missing centerline.
      #
      # WHAT HASHING THE INPUTS COSTS, because the paragraph above says only
      # what it buys. One key per USDM week is one ENTRY per USDM week, and
      # `actions/cache/save` does not overwrite a key that exists - it warns
      # and returns (actions/cache's `saveImpl`, read 2026-09-09). So a week
      # whose first run saved before it had a good artifact - the export
      # failed, or the job died between the fetch and the export - pins an
      # artifact-less entry under that week's key, and every remaining hour of
      # that week pays the ~43 s rebuild it was meant to skip. Nothing a hiker
      # reads moves: export_drought.py decides from the artifact on disk
      # (`already_published`), never from the cache, so those hours rebuild and
      # publish the correct bands. It is runner time only, and it ends when
      # USDM's week does.
      - name: Save the drought inputs
        if: always() && hashFiles('pipeline/data/raw/drought/**', 'pipeline/data/raw/centerline.geojson') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            pipeline/data/raw/drought
            pipeline/data/raw/centerline.geojson
            pipeline/data/processed/conditions/drought.json
          key: drought-inputs-${{ hashFiles('pipeline/data/raw/drought/**', 'pipeline/data/raw/centerline.geojson') }}

      - name: Export verified conditions
        id: export
        if: steps.can.outputs.go == 'true'
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_CONDITIONS_DATABASE_URL }}
          UA_URL: ${{ secrets.UA_CONDITIONS_DATABASE_URL }}
        run: |
          if [ "${{ matrix.data_environment }}" = "production" ]; then
            export CONDITIONS_DATABASE_URL="$PRODUCTION_URL"
          else
            export CONDITIONS_DATABASE_URL="$UA_URL"
          fi
          python export_conditions.py

      # Printed before publishing, because "it read something" and "it
      # published something" are different facts and only the first one
      # explains an empty upload.
      #
      # Both manifests, and neither is required to exist: the conditions one
      # is absent until the database secret is configured, the ATC one until
      # somebody reviews the file. A run that produced neither prints nothing
      # here and "Nothing changed" below, which is the honest pair.
      - name: Say what was read
        run: |
          python -c "
          import json, pathlib
          for name in ('conditions_manifest.json', 'atc_updates_manifest.json', 'drought_manifest.json'):
              path = pathlib.Path('data/processed') / name
              if not path.exists():
                  continue
              for kind, entry in json.loads(path.read_text())['artifacts'].items():
                  reviewed = entry.get('reviewed_at')
                  when = f\", reviewed {reviewed}\" if reviewed else ''
                  print(f\"{entry['count']} {kind} row(s), generated {entry['generated_at']}{when}\")
          "

      - name: Publish to R2
        env:
          # The gate publish.py checks. Set only on this step, so every other
          # step here is structurally incapable of writing to the bucket -
          # publish-vector-data.yml sets it the same way for the same reason.
          R2_WRITE_ENABLED: "true"
          # And the one that decides where. This job's whole shape is one run
          # per environment, so the matrix value is the answer rather than an
          # input somebody picks (features/DATA_ENVIRONMENTS.md).
          OURHIKE_DATA_ENV: ${{ matrix.data_environment }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        # publish.py collects whatever data/processed/ holds, which in this
        # job is the conditions manifest and nothing else - a fresh checkout
        # has run no other export script. The manifest merge is additive, so
        # the trail artifacts already in latest.json survive untouched.
        run: python publish.py
