  - name: int_suggested_hikes__routed_ships_what_build_document_ships
    description: >
      SH05, SH06 and SH08: export_suggested_hikes.py's build_document() over
      the graded routes. A rejected or endless route ships nothing; a published
      track ships only where the phone's re-walk between its samples comes back
      within TRACK_REPRODUCTION_TOLERANCE of its own length, with the drift
      printed; a closed walk repeats its first end; a climb is absent where it
      was never priced, and rounded half to even where it was. From
      test_export_suggested_hikes.py's gate, walk and climb cases;
      tests/test_dbt_suggested_hikes_parity.py runs build_document() over the
      same rows, the step's re-walk standing in for track_ends()' snap and
      search.
    model: int_suggested_hikes__routed
    given:
      - input: ref('int_suggested_hikes__graded')
        rows:
          # test_a_closed_walk_repeats_its_first_end_so_the_phone_closes_it, with its climb half to even (90.5 to 90, 91.5 to 92)
          - {hike_number: 301, provenance: 'generated', grade: 'strong', route_notes_json: '[]', route_closed: true, route_miles: 5.1834, route_ends: '[[-74.3,41.62],[-74.29,41.625],[-74.285,41.63]]', walked_trails: '["Pine Meadow Trail (red)"]', climb_gain_ft: 90.5, climb_loss_ft: 91.5, rewalk_problem: null, rewalk_ends: null, rewalk_miles: null, rewalk_climb_gain_ft: null, rewalk_climb_loss_ft: null}
          # test_an_open_walk_does_not; test_climb_ships_when_the_route_was_priced_and_is_absent_when_it_was_not: never priced
          - {hike_number: 302, provenance: 'generated', grade: 'fair', route_notes_json: '["walks 1 of the 2 trails the description names"]', route_closed: false, route_miles: 3.0, route_ends: '[[-74.2,41.5],[-74.19,41.51]]', walked_trails: '["Trail 1 (red)"]', climb_gain_ft: null, climb_loss_ft: null, rewalk_problem: null, rewalk_ends: null, rewalk_miles: null, rewalk_climb_gain_ft: null, rewalk_climb_loss_ft: null}
          # a closed walk whose last end is already its first gets no second copy
          - {hike_number: 303, provenance: 'generated', grade: 'strong', route_notes_json: '[]', route_closed: true, route_miles: 2.0, route_ends: '[[-74.25,41.55],[-74.24,41.56],[-74.25,41.55]]', walked_trails: '["Trail 1 (red)"]', climb_gain_ft: 10.0, climb_loss_ft: 10.0, rewalk_problem: null, rewalk_ends: null, rewalk_miles: null, rewalk_climb_gain_ft: null, rewalk_climb_loss_ft: null}
          # test_a_rejected_route_ships_nothing_and_is_named_in_the_manifest (SH05)
          - {hike_number: 304, provenance: 'generated', grade: 'rejected', route_notes_json: '["walks 1 of the 3 trails the description names - it is not following the write-up"]', route_closed: true, route_miles: null, route_ends: '[]', walked_trails: '[]', climb_gain_ft: null, climb_loss_ft: null, rewalk_problem: null, rewalk_ends: null, rewalk_miles: null, rewalk_climb_gain_ft: null, rewalk_climb_loss_ft: null}
