version: 2

# The suggested_hikes family's unit tests, one per pytest behaviour the
# rules carry and at least one row per refusal branch, each row commented
# with the case it mirrors. tests/test_dbt_suggested_hikes_parity.py runs
# today's Python over these same rows and fails where the two disagree,
# outside the differences it lists as deliberate.
unit_tests:
  - name: int_suggested_hikes__hike_finder_lists_what_hike_problems_lists
    description: >
      SH02, a review aid and never a gate: lib/hikefinder.py's hike_problems(),
      check for check in its order and its words, from test_lib_hikefinder.py's
      two cases and one row per check, each a page missing only that, with the
      two boundaries `is None` draws (a Length of 0 and an Author of '' are
      stated).
    model: int_suggested_hikes__hike_finder
    given:
      - input: ref('base_nynjtc__nynjtc_hike_finder')
        rows:
          # test_problems_name_what_is_missing_and_a_complete_page_has_none: a complete page
          - {hike_number: 1, name: 'Hike 1', start_json: '{"lat":41.6,"lon":-74.3005,"label":"Parking location"}', description_json: '["Follow the red-blazed Pine Meadow Trail to the lake."]', stated_miles: 4.8, route_type: 'Circuit', features_json: '["Views"]', author: 'Daniel Chazin'}
          # the same pytest: a bare page, every problem in hike_problems()'s order
          - {hike_number: 2, name: 'Hike 2', start_json: null, description_json: '[]', stated_miles: null, route_type: null, features_json: '[]', author: null}
          # test_a_page_with_no_coordinate_parses_and_says_so_in_its_problems
          - {hike_number: 3, name: 'Hike 3', start_json: null, description_json: '["Follow the red-blazed Pine Meadow Trail to the lake."]', stated_miles: 4.8, route_type: 'Circuit', features_json: '["Views"]', author: 'Daniel Chazin'}
          # no Description card at all
          - {hike_number: 4, name: 'Hike 4', start_json: '{"lat":41.6,"lon":-74.3005,"label":"Parking location"}', description_json: null, stated_miles: 4.8, route_type: 'Circuit', features_json: '["Views"]', author: 'Daniel Chazin'}
          # an empty Description card
          - {hike_number: 5, name: 'Hike 5', start_json: '{"lat":41.6,"lon":-74.3005,"label":"Parking location"}', description_json: '[]', stated_miles: 4.8, route_type: 'Circuit', features_json: '["Views"]', author: 'Daniel Chazin'}
          # no stated Length
          - {hike_number: 6, name: 'Hike 6', start_json: '{"lat":41.6,"lon":-74.3005,"label":"Parking location"}', description_json: '["Follow the red-blazed Pine Meadow Trail to the lake."]', stated_miles: null, route_type: 'Circuit', features_json: '["Views"]', author: 'Daniel Chazin'}
          # a stated Length of 0 is a stated Length: `is None`
          - {hike_number: 7, name: 'Hike 7', start_json: '{"lat":41.6,"lon":-74.3005,"label":"Parking location"}', description_json: '["Follow the red-blazed Pine Meadow Trail to the lake."]', stated_miles: 0.0, route_type: 'Circuit', features_json: '["Views"]', author: 'Daniel Chazin'}
          # no Route Type
          - {hike_number: 8, name: 'Hike 8', start_json: '{"lat":41.6,"lon":-74.3005,"label":"Parking location"}', description_json: '["Follow the red-blazed Pine Meadow Trail to the lake."]', stated_miles: 4.8, route_type: null, features_json: '["Views"]', author: 'Daniel Chazin'}
          # no Features tags at all
          - {hike_number: 9, name: 'Hike 9', start_json: '{"lat":41.6,"lon":-74.3005,"label":"Parking location"}', description_json: '["Follow the red-blazed Pine Meadow Trail to the lake."]', stated_miles: 4.8, route_type: 'Circuit', features_json: null, author: 'Daniel Chazin'}
          # an empty Features list
          - {hike_number: 10, name: 'Hike 10', start_json: '{"lat":41.6,"lon":-74.3005,"label":"Parking location"}', description_json: '["Follow the red-blazed Pine Meadow Trail to the lake."]', stated_miles: 4.8, route_type: 'Circuit', features_json: '[]', author: 'Daniel Chazin'}
          # no Author
          - {hike_number: 11, name: 'Hike 11', start_json: '{"lat":41.6,"lon":-74.3005,"label":"Parking location"}', description_json: '["Follow the red-blazed Pine Meadow Trail to the lake."]', stated_miles: 4.8, route_type: 'Circuit', features_json: '["Views"]', author: null}
          # an Author of '' is an Author: `is None`
          - {hike_number: 12, name: 'Hike 12', start_json: '{"lat":41.6,"lon":-74.3005,"label":"Parking location"}', description_json: '["Follow the red-blazed Pine Meadow Trail to the lake."]', stated_miles: 4.8, route_type: 'Circuit', features_json: '["Views"]', author: ''}
      - input: ref('suggested_hike_difficulty_slugs')
        rows:
          - {difficulty_label: 'easy', difficulty_slug: 'easy'}
          - {difficulty_label: 'easy to moderate', difficulty_slug: 'easy-moderate'}
          - {difficulty_label: 'moderate', difficulty_slug: 'moderate'}
          - {difficulty_label: 'moderate to strenuous', difficulty_slug: 'moderate-strenuous'}
          - {difficulty_label: 'strenuous', difficulty_slug: 'strenuous'}
          - {difficulty_label: 'very strenuous', difficulty_slug: 'strenuous'}
    expect:
      rows:
        - {hike_number: 1, problems_json: '[]'}
        - {hike_number: 2, problems_json: '["no GPS coordinate on the page - a route has nowhere to start from","no Description card - nothing to build a route from and nothing to print","no stated Length to check a built route against","no Route Type, so whether the walk closes back on itself is unknown","no Features tags","no Author - nobody''s name to carry with the write-up"]'}
        - {hike_number: 3, problems_json: '["no GPS coordinate on the page - a route has nowhere to start from"]'}
        - {hike_number: 4, problems_json: '["no Description card - nothing to build a route from and nothing to print"]'}
        - {hike_number: 5, problems_json: '["no Description card - nothing to build a route from and nothing to print"]'}
        - {hike_number: 6, problems_json: '["no stated Length to check a built route against"]'}
        - {hike_number: 7, problems_json: '[]'}
        - {hike_number: 8, problems_json: '["no Route Type, so whether the walk closes back on itself is unknown"]'}
        - {hike_number: 9, problems_json: '["no Features tags"]'}
        - {hike_number: 10, problems_json: '["no Features tags"]'}
        - {hike_number: 11, problems_json: '["no Author - nobody''s name to carry with the write-up"]'}
        - {hike_number: 12, problems_json: '[]'}
  - name: int_suggested_hikes__hike_finder_slugs_what_difficulty_slug_slugs
    description: >
      SH07: export_suggested_hikes.py's difficulty_slug(), the label stripped
      as str.strip() strips and lowercased, looked up in the seed; no slot is
      no slug, never a guessed one, and the publisher's own word stays beside
      it. From test_export_suggested_hikes.py's three difficulty cases, one row
      per label.
    model: int_suggested_hikes__hike_finder
    given:
      - input: ref('base_nynjtc__nynjtc_hike_finder')
        rows:
          # test_the_publishers_difficulty_becomes_the_slug_the_client_holds
          - {hike_number: 21, name: 'Hike 21', difficulty: 'Easy'}
          # the same pytest: the export's own casing
          - {hike_number: 22, name: 'Hike 22', difficulty: 'Easy To Moderate'}
          # the same pytest
          - {hike_number: 23, name: 'Hike 23', difficulty: 'Moderate'}
          # the same pytest
          - {hike_number: 24, name: 'Hike 24', difficulty: 'Moderate To Strenuous'}
          # the same pytest
          - {hike_number: 25, name: 'Hike 25', difficulty: 'Strenuous'}
          # test_very_strenuous_takes_the_hardest_slug_there_is_and_keeps_its_own_word
          - {hike_number: 26, name: 'Hike 26', difficulty: 'Very Strenuous'}
          # test_a_difficulty_the_client_has_no_slot_for_is_absent_rather_than_guessed
          - {hike_number: 27, name: 'Hike 27', difficulty: 'Extreme'}
          # no Difficulty at all
          - {hike_number: 28, name: 'Hike 28', difficulty: null}
          # an empty Difficulty
          - {hike_number: 29, name: 'Hike 29', difficulty: ''}
          # str.strip() strips a no-break space too
          - {hike_number: 30, name: 'Hike 30', difficulty: ' Moderate '}
          # any case
          - {hike_number: 31, name: 'Hike 31', difficulty: 'EASY'}
      - input: ref('suggested_hike_difficulty_slugs')
        rows:
          - {difficulty_label: 'easy', difficulty_slug: 'easy'}
          - {difficulty_label: 'easy to moderate', difficulty_slug: 'easy-moderate'}
          - {difficulty_label: 'moderate', difficulty_slug: 'moderate'}
          - {difficulty_label: 'moderate to strenuous', difficulty_slug: 'moderate-strenuous'}
          - {difficulty_label: 'strenuous', difficulty_slug: 'strenuous'}
          - {difficulty_label: 'very strenuous', difficulty_slug: 'strenuous'}
    expect:
      rows:
        - {hike_number: 21, difficulty: 'Easy', difficulty_slug: 'easy'}
        - {hike_number: 22, difficulty: 'Easy To Moderate', difficulty_slug: 'easy-moderate'}
        - {hike_number: 23, difficulty: 'Moderate', difficulty_slug: 'moderate'}
        - {hike_number: 24, difficulty: 'Moderate To Strenuous', difficulty_slug: 'moderate-strenuous'}
        - {hike_number: 25, difficulty: 'Strenuous', difficulty_slug: 'strenuous'}
        - {hike_number: 26, difficulty: 'Very Strenuous', difficulty_slug: 'strenuous'}
        - {hike_number: 27, difficulty: 'Extreme', difficulty_slug: null}
        - {hike_number: 28, difficulty: null, difficulty_slug: null}
        - {hike_number: 29, difficulty: '', difficulty_slug: null}
        - {hike_number: 30, difficulty: ' Moderate ', difficulty_slug: 'moderate'}
        - {hike_number: 31, difficulty: 'EASY', difficulty_slug: 'easy'}
  - name: int_suggested_hikes__photos_confirms_what_confirmed_photos_confirms
    description: >
      SH09: a photograph only from the person-confirmed join, a row needing all
      three of hike, digest and credit, each read for its own truth; both
      spellings of the hike id join, the first confirmed row for a number wins,
      and a credit is printed as the page carried it, with 'Photo by ' where it
      did not say so. From test_export_suggested_hikes.py's photograph cases.
      Three rows are DELIBERATE, stricter than confirmed_photos() and
      photo_for() on purpose (tests/test_dbt_suggested_hikes_parity.py lists
      them): a credit of only whitespace or of true, which would ship an
      attribution naming nobody, and a digest with a trailing newline, which
      would ship a bucket key with a newline in it.
    model: int_suggested_hikes__photos
    given:
      - input: ref('base_nynjtc__nynjtc_hike_photos')
        rows:
          # test_the_sheets_bare_hike_number_joins_to_the_records_prefixed_id
          - {file_row: 0, photo: '{"hike_id":"50","digest":"ca978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb","credit":"Daniel Chazin"}'}
          # test_a_row_already_carrying_the_prefixed_id_joins_too
          - {file_row: 1, photo: '{"hike_id":"nynjtc_hike_finder:51","digest":"3e23e8160039594a33894f6564e1b1348bbd7a0088d42c4acb73eeaed59c009d","credit":"Jane Daniels"}'}
          # two rows confirm hike 52: the first in the file wins (setdefault)
          - {file_row: 2, photo: '{"hike_id":"52","digest":"2e7d2c03a9507ae265ecf5b5356885a53393a2029d241394997265a1a25aefc6","credit":"First Photographer"}'}
          # the second, in the other spelling, is not used
          - {file_row: 3, photo: '{"hike_id":"nynjtc_hike_finder:52","digest":"18ac3e7343f016890c510e93f935261169d9e3f565436429830faf0934f4f8e4","credit":"Second Photographer"}'}
          # no digest confirms nothing
          - {file_row: 4, photo: '{"hike_id":"53","credit":"Daniel Chazin"}'}
          # test_a_confirmed_row_naming_no_photographer_ships_no_photograph
          - {file_row: 5, photo: '{"hike_id":"54","digest":"3f79bb7b435b05321651daefd374cdc681dc06faa65e374e38337b88ca046dea"}'}
          # no hike confirms nothing
          - {file_row: 6, photo: '{"digest":"252f10c83610ebca1a059c0bae8255eba2f95be4d1d7bcfa89d7248a82d9f111","credit":"Daniel Chazin"}'}
          # test_a_credit_that_already_says_photo_by_is_not_given_it_twice
          - {file_row: 7, photo: '{"hike_id":"55","digest":"cd0aa9856147b6c5b4ff2b7dfee5da20aa38253099ef1b4a64aced233c9afe29","credit":"Photo by Daniel Chazin"}'}
          # nor one that says Photo:
          - {file_row: 8, photo: '{"hike_id":"56","digest":"aaa9402664f1a41f40ebbc52c9993eb66aeb366602958fdfaa283b71e64db123","credit":"Photo: Jane Daniels"}'}
          # the credit as the page carried it, stripped
          - {file_row: 9, photo: '{"hike_id":"57","digest":"de7d1b721a1e0632b7cf04edf5032c8ecffa9f9a08492152b926f1a5a7e765d7","credit":"  Daniel Chazin  "}'}
          # DELIBERATE: a credit of only whitespace, which photo_for() prints as 'Photo by ' with nobody after it
          - {file_row: 10, photo: '{"hike_id":"58","digest":"189f40034be7a199f1fa9891668ee3ab6049f82d38c68be70f596eab2e1857b7","credit":"   "}'}
          # a hike number written as a number
          - {file_row: 11, photo: '{"hike_id":59,"digest":"8254c329a92850f6d539dd376f4816ee2764517da5e0235514af433164480d7a","credit":"Daniel Chazin"}'}
          # a row that is not an object confirms nothing
          - {file_row: 12, photo: '"a note somebody left in the list"'}
          # a digest that is not a sha256: photo_key() raises, and the mart's test fails the build
          - {file_row: 13, photo: '{"hike_id":"60","digest":"not-a-digest","credit":"Daniel Chazin"}'}
          # an empty hike id confirms nothing
          - {file_row: 14, photo: '{"hike_id":"","digest":"acac86c0e609ca906f632b0e2dacccb2b77d22b0621f20ebece1a4835b93f6f0","credit":"Daniel Chazin"}'}
          # a credit of 0 is falsy and names nobody
          - {file_row: 15, photo: '{"hike_id":"61","digest":"62c66a7a5dd70c3146618063c344e531e6d4b59e379808443ce962b3abd63c5a","credit":0}'}
          # a credit that is a number is printed as one
          - {file_row: 16, photo: '{"hike_id":"62","digest":"1b16b1df538ba12dc3f97edbb85caa7050d46c148134290feba80f8236c83db9","credit":5}'}
          # any case of Photo by
          - {file_row: 17, photo: '{"hike_id":"63","digest":"65c74c15a686187bb6bbf9958f494fc6b80068034a659a9ad44991b08c58f2d2","credit":"PHOTO BY JANE DANIELS"}'}
          # DELIBERATE: a credit of true, which photo_for() prints as 'Photo by True'
          - {file_row: 18, photo: '{"hike_id":"64","digest":"148de9c5a7a44d19e56cd9ae1a554bf67847afb0c58f6e12fa29ac7ddfca9940","credit":true}'}
          # DELIBERATE: a digest with a trailing newline, which re.match's $ lets through
          - {file_row: 19, photo: '{"hike_id":"65","digest":"8e35c2cd3bf6641bdb0e2050b76932cbb2e6034a0ddacc1d9bea82a6ba57f7cf\n","credit":"Daniel Chazin"}'}
          # an uppercase digest is not the store's spelling
          - {file_row: 20, photo: '{"hike_id":"66","digest":"454349E422F05297191EAD13E21D3DB520E5ABEF52055E4964B82FB213F593A1","credit":"Daniel Chazin"}'}
          # a digest that is a number: photo_key() raises
          - {file_row: 21, photo: '{"hike_id":"67","digest":5,"credit":"Daniel Chazin"}'}
          # a hike id that is a list joins no hike
          - {file_row: 22, photo: '{"hike_id":[68],"digest":"043a718774c572bd8a25adbeb1bfcd5c0256ae11cecf9f9c3f925d0e52beaf89","credit":"Daniel Chazin"}'}
          # nor one that is a float
          - {file_row: 23, photo: '{"hike_id":69.0,"digest":"e3b98a4da31a127d4bde6e43033f66ba274cab0eb7eb1c70ec41402bf6273dd8","credit":"Daniel Chazin"}'}
    expect:
      rows:
        - {hike_key: '50', file_row: 0, digest_is_valid: true, photo_url: 'photos/ca978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb.jpg', photo_credit: 'Photo by Daniel Chazin', photo_licence: 'By permission of the New York-New Jersey Trail Conference'}
        - {hike_key: '51', file_row: 1, digest_is_valid: true, photo_url: 'photos/3e23e8160039594a33894f6564e1b1348bbd7a0088d42c4acb73eeaed59c009d.jpg', photo_credit: 'Photo by Jane Daniels', photo_licence: 'By permission of the New York-New Jersey Trail Conference'}
        - {hike_key: '52', file_row: 2, digest_is_valid: true, photo_url: 'photos/2e7d2c03a9507ae265ecf5b5356885a53393a2029d241394997265a1a25aefc6.jpg', photo_credit: 'Photo by First Photographer', photo_licence: 'By permission of the New York-New Jersey Trail Conference'}
        - {hike_key: '55', file_row: 7, digest_is_valid: true, photo_url: 'photos/cd0aa9856147b6c5b4ff2b7dfee5da20aa38253099ef1b4a64aced233c9afe29.jpg', photo_credit: 'Photo by Daniel Chazin', photo_licence: 'By permission of the New York-New Jersey Trail Conference'}
        - {hike_key: '56', file_row: 8, digest_is_valid: true, photo_url: 'photos/aaa9402664f1a41f40ebbc52c9993eb66aeb366602958fdfaa283b71e64db123.jpg', photo_credit: 'Photo: Jane Daniels', photo_licence: 'By permission of the New York-New Jersey Trail Conference'}
        - {hike_key: '57', file_row: 9, digest_is_valid: true, photo_url: 'photos/de7d1b721a1e0632b7cf04edf5032c8ecffa9f9a08492152b926f1a5a7e765d7.jpg', photo_credit: 'Photo by Daniel Chazin', photo_licence: 'By permission of the New York-New Jersey Trail Conference'}
        - {hike_key: '59', file_row: 11, digest_is_valid: true, photo_url: 'photos/8254c329a92850f6d539dd376f4816ee2764517da5e0235514af433164480d7a.jpg', photo_credit: 'Photo by Daniel Chazin', photo_licence: 'By permission of the New York-New Jersey Trail Conference'}
        - {hike_key: '60', file_row: 13, digest_is_valid: false, photo_url: 'photos/not-a-digest.jpg', photo_credit: 'Photo by Daniel Chazin', photo_licence: 'By permission of the New York-New Jersey Trail Conference'}
        - {hike_key: '62', file_row: 16, digest_is_valid: true, photo_url: 'photos/1b16b1df538ba12dc3f97edbb85caa7050d46c148134290feba80f8236c83db9.jpg', photo_credit: 'Photo by 5', photo_licence: 'By permission of the New York-New Jersey Trail Conference'}
        - {hike_key: '63', file_row: 17, digest_is_valid: true, photo_url: 'photos/65c74c15a686187bb6bbf9958f494fc6b80068034a659a9ad44991b08c58f2d2.jpg', photo_credit: 'PHOTO BY JANE DANIELS', photo_licence: 'By permission of the New York-New Jersey Trail Conference'}
        - {hike_key: '65', file_row: 19, digest_is_valid: false, photo_url: "photos/8e35c2cd3bf6641bdb0e2050b76932cbb2e6034a0ddacc1d9bea82a6ba57f7cf\n.jpg", photo_credit: 'Photo by Daniel Chazin', photo_licence: 'By permission of the New York-New Jersey Trail Conference'}
        - {hike_key: '66', file_row: 20, digest_is_valid: false, photo_url: 'photos/454349E422F05297191EAD13E21D3DB520E5ABEF52055E4964B82FB213F593A1.jpg', photo_credit: 'Photo by Daniel Chazin', photo_licence: 'By permission of the New York-New Jersey Trail Conference'}
        - {hike_key: '67', file_row: 21, digest_is_valid: false, photo_url: null, photo_credit: 'Photo by Daniel Chazin', photo_licence: 'By permission of the New York-New Jersey Trail Conference'}
  - name: int_suggested_hikes__graded_grades_a_generated_route_as_grade_grades
    description: >
      SH04: lib/hike_route_builder.py's _grade() over the step's measurements,
      check for check in its order: the share of named trails walked, the
      length against the stated one, a closed walk's retrace, and the parking's
      distance from the line, each band's edge on both sides, the worst check
      capping the grade. tests/test_dbt_suggested_hikes_parity.py runs _grade()
      over the same rows.
    model: int_suggested_hikes__graded
    given:
      - input: ref('stg_derived__formed_routes')
        rows:
          # a route every check passes
          - {hike_number: 101, provenance: 'generated', formed_problem: null, route_miles: 4.0, start_offset_m: 50.0, route_closed: true, retrace_ratio: 0.1, named_trails: '["Trail 1 (red)","Trail 2 (red)"]', walked_trails: '["Trail 1 (red)","Trail 2 (red)"]'}
          # the description names no trail this build draws
          - {hike_number: 102, provenance: 'generated', formed_problem: null, route_miles: 4.0, start_offset_m: 50.0, route_closed: true, retrace_ratio: 0.1, named_trails: '[]', walked_trails: '[]'}
          # walks 1 of 3 named trails, under TRAILS_FAIR 0.34
          - {hike_number: 103, provenance: 'generated', formed_problem: null, route_miles: 4.0, start_offset_m: 50.0, route_closed: true, retrace_ratio: 0.1, named_trails: '["Trail 1 (red)","Trail 2 (red)","Trail 3 (red)"]', walked_trails: '["Trail 1 (red)"]'}
          # 17 of 50 is exactly 0.34, not under it: fair
          - {hike_number: 104, provenance: 'generated', formed_problem: null, route_miles: 4.0, start_offset_m: 50.0, route_closed: true, retrace_ratio: 0.1, named_trails: '["Trail 1 (red)","Trail 2 (red)","Trail 3 (red)","Trail 4 (red)","Trail 5 (red)","Trail 6 (red)","Trail 7 (red)","Trail 8 (red)","Trail 9 (red)","Trail 10 (red)","Trail 11 (red)","Trail 12 (red)","Trail 13 (red)","Trail 14 (red)","Trail 15 (red)","Trail 16 (red)","Trail 17 (red)","Trail 18 (red)","Trail 19 (red)","Trail 20 (red)","Trail 21 (red)","Trail 22 (red)","Trail 23 (red)","Trail 24 (red)","Trail 25 (red)","Trail 26 (red)","Trail 27 (red)","Trail 28 (red)","Trail 29 (red)","Trail 30 (red)","Trail 31 (red)","Trail 32 (red)","Trail 33 (red)","Trail 34 (red)","Trail 35 (red)","Trail 36 (red)","Trail 37 (red)","Trail 38 (red)","Trail 39 (red)","Trail 40 (red)","Trail 41 (red)","Trail 42 (red)","Trail 43 (red)","Trail 44 (red)","Trail 45 (red)","Trail 46 (red)","Trail 47 (red)","Trail 48 (red)","Trail 49 (red)","Trail 50 (red)"]', walked_trails: '["Trail 1 (red)","Trail 2 (red)","Trail 3 (red)","Trail 4 (red)","Trail 5 (red)","Trail 6 (red)","Trail 7 (red)","Trail 8 (red)","Trail 9 (red)","Trail 10 (red)","Trail 11 (red)","Trail 12 (red)","Trail 13 (red)","Trail 14 (red)","Trail 15 (red)","Trail 16 (red)","Trail 17 (red)"]'}
          # walks 1 of 2, under TRAILS_GOOD 0.9
          - {hike_number: 105, provenance: 'generated', formed_problem: null, route_miles: 4.0, start_offset_m: 50.0, route_closed: true, retrace_ratio: 0.1, named_trails: '["Trail 1 (red)","Trail 2 (red)"]', walked_trails: '["Trail 1 (red)"]'}
          # 9 of 10 is exactly 0.9, not under it: clean
