version: 2

# The rules decision 54's live reads found a layer needs beyond its key
# (pipeline/ELT.md, "What wave 1's live reads found that phase C must
# honour"), one row per rule per layer, each quoting the evidence it rests on.
# A judgement somebody reviews row by row, so it is a seed and not a
# generated file: pipeline/make_dbt_staging.py stages the layers, and the
# type's intermediate reads this to apply the rule.
seeds:
  - name: layer_rules
    description: >
      One row per rule a registered layer carries beyond its key. For trail lines
      (int_trail_lines__club_lines): `historic_alignment` (the whole layer is an alignment, not
      tread: it never routes and never draws as a trail a hiker can walk) and `winter_trail` (the
      whole layer is seasonal and draws only with that said). For trail lines and points of
      interest: `drop_where` (its rows whose `field`, by dlt's name in the row's `properties`,
      equals `matches` are left out, such as the public roads a trail layer carries or a proposed
      trailhead). For points of interest only (int_points_of_interest__club_points), each matched
      case-insensitively: `drop_where_contains` (left out where the field's text contains
      `matches`, a status written into a name), `keep_only_where` (left out unless the field equals
      one of the layer's rows' `matches` for that field, such as USFWS's Public_Use), `drop_layer`
      (every row left out: a planning layer) and `not_water` (never typed water, on every row with
      no field, or where the field equals `matches`); GATC's water list's `drop_where_contains`
      row is read the same way by int_points_of_interest__gatc_water, which its records come
      through instead. For points of interest of any organization
      (int_points_of_interest__classified, decision 65): `plumbed_water` (a water row where the
      field equals `matches` is a tap or fountain whose shutoff season the layer does not record: it
      ships at low confidence with the season caution `water_caution` 'no_shutoff_season', and a
      layer typed per row by the poi_value_types seed, NY Parks', is typed water by it) and
      `open_in_winter` (where the field equals `matches`, the layer's own winter status says the tap
      is open in winter, so it carries no season caution). `evidence` says what the rule rests on,
      mostly the layer's own sources.json notes.
    config:
      column_types:
        source_key: varchar
        rule: varchar
        field: varchar
        matches: varchar
        evidence: varchar
    data_tests:
      # A row-level rule names its field and value; a layer-wide one names neither; not_water
      # may be either, never half of one.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              case
                  when rule in ('drop_where', 'drop_where_contains', 'keep_only_where', 'plumbed_water', 'open_in_winter')
                      then field is not null and matches is not null
                  when rule = 'not_water' then (field is null) = (matches is null)
                  else field is null and matches is null
              end
    columns:
      - name: source_key
        description: The layer's sources.json key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_registry__sources')
                field: source_key
      - name: rule
        description: historic_alignment, winter_trail, drop_where, drop_where_contains, keep_only_where, drop_layer, not_water, plumbed_water or open_in_winter.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - historic_alignment
                  - winter_trail
                  - drop_where
                  - drop_where_contains
                  - keep_only_where
                  - drop_layer
                  - not_water
                  - plumbed_water
                  - open_in_winter
      - name: field
        description: For a row-level rule, the row field it reads, by dlt's name; null for a layer-wide rule.
      - name: matches
        description: For a row-level rule, the field's value it matches; null for a layer-wide rule.
      - name: evidence
        description: What the rule rests on, quoted or cited.
        data_tests: [not_null]
