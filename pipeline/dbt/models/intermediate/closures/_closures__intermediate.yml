  - name: int_closures__gate_holds_back_each_file_no_notice_feeds_on_its_own
    description: >
      OurHike's reports with a coordinate that is not finite, an hour in
      which no NWS alert landed, and a reviewed work-projects file with a bad
      row each hold back their own file and nothing else, so the notice
      sources' files are still written.
    model: int_closures__gate
    given:
      - input: ref('int_closures__unioned')
        format: sql
        rows: |
          select 'atc_trail_updates' as source_key, cast([] as varchar[]) as problems
          union all
          select 'nynjtc_trail_alerts' as source_key, cast([] as varchar[]) as problems
          union all
          select 'ourhike_closures' as source_key, cast([] as varchar[]) as problems
      - input: ref('int_closures__atc_checked')
        format: sql
        rows: |
          select 0 as file_row
      - input: ref('base_atc__atc_updates')
        rows:
          - {atc_updates_document_key: d1, document_json: '{"reviewed_at": "2026-08-24", "updates": [{}]}'}
      - input: ref('int_sources__publication')
        rows:
          - {source_key: atc_trail_updates, may_publish: true}
          - {source_key: nynjtc_trail_alerts, may_publish: true}
          - {source_key: oprhp_trail_closures, may_publish: true}
          - {source_key: ourhike_closures, may_publish: true}
          - {source_key: ourhike_reports, may_publish: true}
          - {source_key: nws_alerts, may_publish: true}
          - {source_key: 'reference/work_projects.json', may_publish: true}
      - input: ref('base_ourhike__reports')
        format: sql
        rows: |
          select 'verified' as report_status, 'public' as visibility, cast('nan' as double) as lat, -74.0 as lon, cast(null as double) as mile
          union all
          select 'resolved' as report_status, 'public' as visibility, 41.0 as lat, -74.0 as lon, 10.5 as mile
          union all
          select 'verified' as report_status, 'private' as visibility, cast('inf' as double) as lat, -74.0 as lon, 1.0 as mile
      - input: ref('base_nws__alerts')
        format: sql
        rows: |
          select 'k1' as nws_alert_key where false
      - input: ref('int_closures__work_projects_checked')
        format: sql
        rows: |
          select cast(null as bigint) as row_position, true as is_reviewed, cast([] as varchar[]) as row_problems, cast([] as varchar[]) as duplicate_problems
          union all
          select 0 as row_position, cast(null as boolean) as is_reviewed, ['rows[0]: date is not a date'] as row_problems, cast([] as varchar[]) as duplicate_problems
      - input: ref('base_extract__runs')
        format: sql
        rows: |
          select '20261003T000000.000000Z' as run_id, 'raw_nynjtc__nynjtc_trail_alerts' as table_name, 'loaded' as outcome, cast(1 as bigint) as rows_loaded, cast(1 as bigint) as count_proof
    expect:
      rows:
        - {source_key: atc_trail_updates, rows_total: 1, rows_invalid: 0, passed: true, held_because: null, awaiting_review: false}
        - {source_key: nynjtc_trail_alerts, rows_total: 1, rows_invalid: 0, passed: true, held_because: null, awaiting_review: false}
        - {source_key: oprhp_trail_closures, rows_total: 0, rows_invalid: 0, passed: true, held_because: null, awaiting_review: false}
        - {source_key: ourhike_closures, rows_total: 1, rows_invalid: 0, passed: true, held_because: null, awaiting_review: false}
        - {source_key: ourhike_reports, rows_total: 2, rows_invalid: 1, passed: false, held_because: '1 row(s) carry a coordinate or a mile that is not a finite number, and JSON.parse on a phone rejects the whole document', awaiting_review: false}
        - {source_key: nws_alerts, rows_total: 0, rows_invalid: 0, passed: false, held_because: 'no NWS alert landed, so nothing says when NWS was asked', awaiting_review: false}
        - {source_key: 'reference/work_projects.json', rows_total: 1, rows_invalid: 0, passed: false, held_because: '1 problem(s) in reference/work_projects.json, the first: rows[0]: date is not a date', awaiting_review: false}

