version: 2

models:
  - name: pub_podcasts_episodes
    description: >
      Writes podcasts/episodes.json, the podcast list a phone reads, from the
      podcasts mart: one row, `source` and `episodes`, which the phone_file
      materialisation copies to processed_dir/podcasts_episodes.json as one
      JSON document. parity.py compares it with export_podcasts.py's file,
      record by record, in the dbt job.
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: source
        description: export_podcasts.py's literal, the reviewed file the list comes from.
        data_type: varchar
        data_tests: [not_null, unique]
      - name: episodes
        description: >
          The episodes in the file's order, each as lib/podcasts.py's
          as_published() writes one, `minutes` left out where null.
        data_type: json[]
  - name: pub_stewards
    description: >
      Writes stewards.json, "Where this map comes from" on the phone (#927),
      from the sources mart: one record per steward whose data reaches a
      hiker. parity.py compares it with export_sources.py's build_output().
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: stewards
        description: The steward records, by provider.
        data_type: json[]
        data_tests: [not_null, unique]
  - name: pub_registry
    description: >
      Writes registry.json, the org console's list of every registered
      source (#929), from the sources mart. parity.py compares it with
      export_sources.py's build_registry().
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: sources
        description: Every registered source, by provider and key.
        data_type: json[]
        data_tests: [not_null, unique]
      - name: organizations
        description: Every organization, by provider.
        data_type: json[]

exposures:
  - name: podcasts_episodes_json
    label: podcasts/episodes.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      The podcast episodes picked for hikes (#1683 — Offer podcast episodes
      picked for the hike, with a one-tap Spotify save and an in-app player),
      read by client/src/lib/podcasts.ts. A live key at the bucket root,
      outside every release folder (client/src/lib/dataRelease.ts's
      ROOT_SCOPED_PREFIXES), rewritten in place, so a bad upload is served
      until the next one. Uploaded by publish-podcasts.yml from
      export_podcasts.py's file until stage 4 of #1793 moves the upload to
      this writer's.
    depends_on:
      - ref('podcasts', v=1)
      - ref('pub_podcasts_episodes')
    config:
      meta:
        r2_keys: [podcasts/episodes.json]
        format: json
        # The lane that reads its source. A person's dispatch of
        # publish-podcasts.yml is what ships an edit today, on no schedule.
        cadence: monthly
  - name: stewards_json
    label: stewards.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      Whose data is on the phone, and on what terms (#927 — Say where the
      map comes from: one card per registered steward, with its own licence
      and its own donate line): the sources screen's list. Only stewards with a shipping source are on it,
      credits.ts's rule taken whole. Published in the release folder by
      publish-vector-data.yml from export_sources.py's file until stage 4 of
      #1793 moves it to this writer's.
    depends_on:
      - ref('sources', v=1)
      - ref('pub_stewards')
    config:
      meta:
        r2_keys: [stewards.json]
        format: json
        cadence: monthly
  - name: registry_json
    label: registry.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      Every registered source, shipping or not, for the org console (#929 —
      The org console: two seats over one registry, where approving a source
      opens a pull request and never changes a phone): an admin surface, not
      a hiker's. Published in the release folder by publish-vector-data.yml
      from export_sources.py's file until stage 4 of #1793.
    depends_on:
      - ref('sources', v=1)
      - ref('pub_registry')
    config:
      meta:
        r2_keys: [registry.json]
        format: json
        cadence: monthly
