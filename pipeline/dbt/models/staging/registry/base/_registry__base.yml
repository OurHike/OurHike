version: 2

models:
  - name: base_registry__sources
    data_tests:
      # Says how many rows the dedupe dropped, which for one file is none.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('registry', 'raw_registry__sources')
          config:
            severity: warn
    description: >
      pipeline/sources.json as its one row, keyed. The stg_registry__ models
      read its sources, blocks, organizations and marks out of it.
    columns:
      - name: registry_document_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          the file's name and its landed path.
        data_tests: [not_null, unique]
      - name: document_json
        description: The registry as written, as JSON.
        data_tests: [not_null]
  - name: base_registry__nynjtc_paper_maps
    data_tests:
      # Says how many rows the dedupe dropped, which for one file is none.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('registry', 'raw_registry__nynjtc_paper_maps')
          config:
            severity: warn
    description: >
      reference/nynjtc_paper_maps.json as its one row, keyed. Read by
      stg_registry__paper_maps.
    columns:
      - name: paper_map_table_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          the file's name and its landed path.
        data_tests: [not_null, unique]
      - name: file_path
        description: >
          The file's path under pipeline/, which a store block's `paper_maps`
          names to say this is its table.
        data_tests: [not_null]
      - name: document_json
        description: The table as written, as JSON.
        data_tests: [not_null]
