          - {history_row_key: h4, dbt_scd_id: s4, closure_id: 'club_withdrawn:1', source_key: club_withdrawn, dbt_valid_to: null, row_json: '{"title": "Fixture the registry holds back"}'}
          - {history_row_key: h5, dbt_scd_id: s5, closure_id: 'ourhike_closures:c1', source_key: ourhike_closures, dbt_valid_to: null, row_json: '{"title": null}'}
          - {history_row_key: h6, dbt_scd_id: s6, closure_id: 'feed_held:item-1', source_key: feed_held, dbt_valid_to: null, row_json: '{"title": "Fixture the window carries"}'}
      - input: ref('stg_row_history__warnings')
        rows:
          - {history_row_key: h7, dbt_scd_id: s7, warning_id: 'nynjtc_trail_alerts:fixture-detour', warning_kind: org_notice, source_key: nynjtc_trail_alerts, dbt_valid_to: null, row_json: '{"club": "nynjtc", "notice_kind": "nynjtc_trail_alert", "obstructs_trail": null, "review_state": "not_reviewed", "title": "Fixture detour", "locality": "Harriman State Park", "updated_at": "2026-09-29T12:00:00Z"}'}
          - {history_row_key: h8, dbt_scd_id: s8, warning_id: 'nws_alerts:x', warning_kind: nws_alert, source_key: nynjtc_trail_alerts, dbt_valid_to: null, row_json: '{"title": null}'}
      - input: ref('int_closures__gate')
        rows:
          - {source_key: atc_trail_updates, passed: false, may_publish: true}
          - {source_key: nynjtc_trail_alerts, passed: false, may_publish: true}
          - {source_key: club_passing, passed: true, may_publish: true}
          - {source_key: club_withdrawn, passed: false, may_publish: false}
          - {source_key: ourhike_closures, passed: false, may_publish: true}
          - {source_key: feed_held, passed: false, may_publish: true}
      - input: ref('notice_readers')
        rows:
