          # Rows sharing base_ncta__ncta_finger_lakes_trail's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'ncta_finger_lakes_trail'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
        description: >
          North Country Trail segments of the Finger Lakes Trail (NCTA, agol_flt)
          (sources.json `ncta_finger_lakes_trail`). Key: the geometry (every vertex at 6
          decimal places): 417 of 417, and no attribute column is unique (measured
          2026-10-03 over every row).
      - name: raw_ncta__ncta_kek_mileage_elev
        data_tests:
          # Rows sharing base_ncta__ncta_kek_mileage_elev's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'ncta_kek_mileage_elev'", "mile_point"]
        description: >
          Kekekabic Trail 0.10 mileage index, with elevations (NCTA) (sources.json
          `ncta_kek_mileage_elev`). Key: `mile_point`: unique on all 394 rows (the
