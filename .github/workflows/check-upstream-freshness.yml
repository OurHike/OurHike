# Asks, on a schedule, whether any upstream data has moved since the last
# publish. Flags what it finds. Publishes nothing, ever.
#
# Change detection was built and verified months before anything ran it:
# fetch_all.py compares each ATC layer's editingInfo.dataLastEditDate,
# fetch_opentrail.py uses If-None-Match/ETag, fetch_topo_quads.py uses S3
# Last-Modified, and check_freshness.py normalises all four. Nothing called
# any of it on a schedule, so an upstream edit was only ever noticed by
# someone running a script by hand.
#
# THE SEPARATION IS THE DESIGN (pipeline/DATA_RELEASES.md). This job holds no
# R2 credentials at all - not "chooses not to write", cannot. Its whole input
# is one public HTTPS GET of build_state.json, the same object a hiker's
# phone could read, so it is structurally incapable of changing anyone's map
# even if something went badly wrong inside it.
#
# It also does not fail on staleness. Upstream changing is the normal state
# between builds; a red X every run for a legitimately-edited ATC layer trains
# people to ignore the one signal that matters. The run fails only if the
# check itself broke.
#
# IT ALSO WATCHES THE MONTHLY LANE. refresh-reference.yml extracts and pins
# on the 3rd of each month and dispatches build-reference.yml, which builds
# from the pin and refreshes UA, and a monthly cron nobody has watched fire
# may not (pipeline/ELT.md, "The schedule: 05:15 UTC on the 3rd"). So when
# the extract behind the newest build on main that refreshed UA is more than
# 35 days old, the tracking issue carries a row saying so, and the remedy is
# a dispatch of refresh-reference.yml. Reading the run list and its jobs
# needs `actions: read` and nothing else; this job still cannot write to R2
# or start a run.

name: Check upstream freshness

on:
  schedule:
    # 07:20 UTC daily. DATA_RELEASES.md §1 specifies a daily check against a
    # weekly, deliberate build - the check is cheap (a few dozen metadata
    # requests) and the build is not, so noticing early costs nothing.
    # Off the hour because GitHub's scheduler queues everything submitted at
    # :00 behind everyone else's cron.
    - cron: "20 7 * * *"
  workflow_dispatch:
    inputs:
      state_url:
        description: "build_state.json to compare against. Defaults to the published one."
        type: string
        required: false

# Read the repo, write the one tracking issue. No packages, no deployments,
# and nothing that could reach R2.
permissions:
  contents: read
  issues: write
  # The run list of build-reference.yml, for the 35-day alarm. Read-only:
  # a workflow cannot be dispatched, cancelled or re-run with it.
  actions: read

# One at a time, and never cancel a run in flight: a half-finished check that
# got cancelled mid-way would leave the tracking issue describing a comparison
# that never completed.
concurrency:
  group: check-upstream-freshness
  cancel-in-progress: false

env:
  # The public bucket base, the same value the client is built with. A repo
  # variable rather than a secret on purpose - it is a public URL, and making
  # it a secret would only make this workflow harder to read.
  DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
  ISSUE_TITLE: "Upstream data freshness"
  ISSUE_LABEL: data-freshness

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve which state to compare against
        id: state
        env:
          OVERRIDE: ${{ inputs.state_url }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            echo "url=$OVERRIDE" >> "$GITHUB_OUTPUT"
          elif [ -n "$DATA_BASE_URL" ]; then
            echo "url=${DATA_BASE_URL%/}/build_state.json" >> "$GITHUB_OUTPUT"
          else
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      # --state is what makes this runnable here at all. check_freshness.py's
      # recorded side reads pipeline/data/raw/*, which is gitignored, so on a
      # fresh checkout it would report every source STALE for the trivial
      # reason that this runner has never fetched anything.
      #
      # --exit-zero is what makes the remaining exit codes meaningful. It
      # collapses "stale or unverifiable" (1) into success, because that is
      # news rather than an error, which leaves:
      #
      #   0  the check ran            <- verdict is in freshness.json
      #   2  nothing published yet    <- not a verdict at all; say so, pass
      #   *  the check itself broke   <- a real failure, and the only one
      #
      # Without that collapse a crashed run and a legitimately-edited ATC
      # layer would both exit 1, and the only way to keep the job green for
      # the second would be to swallow the first.
      # STATE_URL arrives via env, not ${{ }} inside the script: the value
      # can come verbatim from the workflow_dispatch input, and an expression
      # expansion is pasted into the shell as literal text before bash parses
      # it. pages.yml documents the same rule; there is no reason for these
      # two to differ.
      - name: Ask every upstream what it says now
        id: check
        if: steps.state.outputs.url != ''
        env:
          STATE_URL: ${{ steps.state.outputs.url }}
        run: |
          set +e
          python check_freshness.py \
            --state "$STATE_URL" \
            --json freshness.json \
            --exit-zero | tee freshness.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            0) ;;
            2) echo "no_state=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::check_freshness.py exited $status, which --exit-zero reserves for a crash."
              exit "$status"
              ;;
          esac

      # THE 35-DAY ALARM. 35 days is a 31-day month plus the worst lateness
      # measured on a weekly cron here (8.1 h, smoke-published.yml), rounded
      # up to a margin: @unvalidated until a year of monthly firings shows the
      # real spread (pipeline/ELT.md, "The schedule: 05:15 UTC on the 3rd").
      # The age runs from the extract behind the newest build on main that
      # refreshed UA: the instant its raw_run began, which build-reference.yml's
      # run-name writes into the run's title. Until the maintainer's choice B
      # (2026-10-08) split the lane, one run extracted and built, so its own
      # start was that instant; dating a build by its start now would let a
      # build from an old pin, dispatched by hand, clear the alarm while UA
      # serves that old pin's data. A title that names no
      # raw_run is `could not be checked`, never a fresh date. Before any
      # build has refreshed UA, the age runs from the workflow's own
      # `created_at`, so the alarm does not ring in the month after the merge
      # (that GitHub sets it when the file reaches the default branch is
      # @unvalidated; the first run after the merge shows the value). A
      # workflow that is not on the default branch at all says so and rings
      # nothing; an answer the API would not give is `could not be checked`,
      # which this job never rounds down to fine.
      #
      # REFRESHED UA, NOT GREEN (WF3 of the PR #1805 review). A run can
      # refresh UA and still conclude `failure`: monthly runs 16 and 17 did,
      # when one workflow still extracted and built and its last job failed
      # the run for a layer left out (decision 49), and a build-reference.yml
      # run does when a parity group fails after its confirm passed. So a run
      # counts when its job "Confirm UA serves what the build wrote" succeeded,
      # whatever the run concluded, and only a run of main counts: a pull
      # request branch's dispatch is not the monthly lane running. Up to 30
      # completed runs are read, newest first, with one job listing each
      # until one counts. build-data-release.yml's give-way asks whether one
      # counts the same way, and
      # .github/tests/test_monthly_refresh_counts_a_run_that_refreshed_ua.py
      # runs both scripts against a stand-in for the API.
      - name: Is the monthly refresh overdue
        id: monthly
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          MONTHLY_WORKFLOW: build-reference.yml
          MAX_AGE_DAYS: "35"
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          base = f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}/actions/workflows/{os.environ['MONTHLY_WORKFLOW']}"
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
          # An extract run's id, as extract/_run.py stamps it and build-reference.yml's run-name puts it in the title.
          RAW_RUN = re.compile(r"\b(\d{8}T\d{6}\.\d{6}Z)\b")

          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  return json.load(response)

          def stamp(text):
              return datetime.fromisoformat(text.replace("Z", "+00:00"))

          def refreshed_ua(run):
              """The run's confirm job passed: UA's latest.json names every phone file its build wrote."""
              jobs = get(f"{run['jobs_url']}?filter=all&per_page=100").get("jobs") or []
              return any(job.get("name") == "Confirm UA serves what the build wrote" and job.get("conclusion") == "success" for job in jobs)

          def extracted_at(run):
              """When the extract the run built from began, from the raw_run its title names; None for a title naming none."""
              found = RAW_RUN.search(run.get("display_title") or "")
              return datetime.strptime(found.group(1), "%Y%m%dT%H%M%S.%fZ").replace(tzinfo=timezone.utc) if found else None

          now, limit = datetime.now(timezone.utc), int(os.environ["MAX_AGE_DAYS"])
          answer = {"workflow": os.environ["MONTHLY_WORKFLOW"], "max_age_days": limit, "checked_at": now.strftime("%Y-%m-%dT%H:%M:%SZ")}
          workflow = None
          try:
              workflow = get(base)
              runs = get(f"{base}/runs?branch=main&status=completed&per_page=30").get("workflow_runs") or []
              last = next((run for run in runs if refreshed_ua(run)), None)
          except urllib.error.HTTPError as error:
              # Absent only when the workflow itself is not there; any other refusal is `unknown`, never fine.
              absent = workflow is None and error.code == 404
              answer.update(state="absent" if absent else "unknown", detail=f"the API answered {error.code}")
          except (urllib.error.URLError, TimeoutError, ValueError) as error:
              answer.update(state="unknown", detail=f"the API did not answer: {error}")
          else:
              since = extracted_at(last) if last else stamp(workflow["created_at"])
              if since is None:
                  answer.update(
                      state="unknown",
                      detail=f"{last['html_url']} refreshed UA, but its title names no raw_run, so how old its extract is is not known",
                      last_refresh=last["html_url"],
                      runs_read=len(runs),
                  )
              else:
                  age = (now - since).total_seconds() / 86400
                  answer.update(
                      since=since.strftime("%Y-%m-%dT%H:%M:%SZ"),
                      age_days=round(age, 1),
                      last_refresh=last["html_url"] if last else None,
                      runs_read=len(runs),
                      state="overdue" if age > limit else "ok",
                  )
          print(json.dumps(answer, indent=2))
          with open("monthly_refresh.json", "w") as handle:
              json.dump(answer, handle, indent=2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"state={answer['state']}\n")
              output.write(f"alarm={'true' if answer['state'] in ('overdue', 'unknown') else 'false'}\n")
          PY

      - name: Write the job summary
        if: always()
        env:
          STATE_URL: ${{ steps.state.outputs.url }}
          NO_STATE: ${{ steps.check.outputs.no_state }}
          MONTHLY_STATE: ${{ steps.monthly.outputs.state }}
        run: |
          {
            echo "## Upstream data freshness"
            echo
            if [ -z "$STATE_URL" ]; then
              echo "No \`DATA_BASE_URL\` repo variable is set, so there is nothing to compare against."
              echo "Set it to the public bucket base and this check arms itself."
            elif [ "$NO_STATE" = "true" ]; then
              echo "No \`build_state.json\` has been published yet at $STATE_URL."
              echo
              echo "This is not a verdict about the data - it is the absence of one."
              echo "Run **Publish vector data** once with \`publish\` ticked and this check arms itself."
            elif [ -f freshness.txt ]; then
              echo '```'
              cat freshness.txt
              echo '```'
            else
              echo "The check did not produce a report. See the step log above."
            fi
            echo
            echo "### The monthly refresh (refresh-reference.yml's extract, as build-reference.yml built it)"
            echo
            if [ -f monthly_refresh.json ]; then
              echo "State: \`${MONTHLY_STATE:-none}\`"
              echo
              echo '```'
              cat monthly_refresh.json
              echo '```'
            else
              echo "The 35-day check did not run. See the step log above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # For the build to read if it wants a head start on what to rebuild.
      # Short-lived: this is evidence for one run, not a data channel.
      - name: Upload the verdict
        if: steps.check.outputs.status != '' && steps.check.outputs.no_state != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: freshness-verdict
          path: pipeline/freshness.json
          retention-days: 14
          if-no-files-found: warn

      # ONE issue, updated in place - never a second issue, never a comment
      # per run. A daily job that opened an issue a day would produce exactly
      # the noise that makes people stop reading issues, and the thing being
      # tracked is a single ongoing state, not a stream of events.
      #
      # Closed automatically when everything returns to FRESH, so the issue
      # being open is itself the signal.
      # Also when only the monthly refresh is overdue, so a missing
      # build_state.json cannot hide it; with no verdict to read, the issue is
      # never closed from here, since nothing upstream was checked.
      - name: Open, update, or close the tracking issue
        if: >-
          !cancelled() && ((steps.check.outcome == 'success' && steps.check.outputs.status != '' && steps.check.outputs.no_state != 'true')
          || steps.monthly.outputs.alarm == 'true')
        uses: actions/github-script@v9
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERDICT_OK: ${{ steps.check.outcome == 'success' && steps.check.outputs.status != '' && steps.check.outputs.no_state != 'true' }}
        with:
          script: |
            const fs = require('fs')
            const trackingIssue = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/tracking-issue.js`)
            // A verdict counts only from a check that finished: a crash may leave half a file.
            const checked = process.env.VERDICT_OK === 'true' && fs.existsSync('pipeline/freshness.json')
            const verdict = checked ? JSON.parse(fs.readFileSync('pipeline/freshness.json', 'utf8')) : {}
            const monthly = fs.existsSync('pipeline/monthly_refresh.json')
              ? JSON.parse(fs.readFileSync('pipeline/monthly_refresh.json', 'utf8'))
              : {state: 'unknown', detail: 'the 35-day check wrote nothing'}
            const refreshAlarm = monthly.state === 'overdue' || monthly.state === 'unknown'

            const stale = verdict.needs_refetch ?? []
            const unknown = verdict.unknown ?? []
            // Sources nothing records on purpose (#1665 - topo quads while
            // build-raster.yml is off, #855). Named below the table so the
            // reason stays visible, but never a key: they cannot open or hold
            // this issue open, because no fetch could change their answer.
            const withdrawn = verdict.withdrawn ?? []
            const age = verdict.state_age_days

            await trackingIssue({github, context, core}, {
              label: process.env.ISSUE_LABEL,
              title: process.env.ISSUE_TITLE,
              checkedAt: verdict.checked_at ?? monthly.checked_at,
              keys: [...stale, ...unknown, ...(refreshAlarm ? [monthly.workflow] : [])],
              // Never all-clear from a run that compared nothing upstream.
              healthy: checked && stale.length === 0 && unknown.length === 0 && !refreshAlarm,
              allClear: `Everything upstream is unchanged again as of ${verdict.checked_at}. Closing.`,

              render: (firstSeen, cell) => {
                const row = (source, state) => {
                  const detail = (verdict.sources ?? []).find(s => s.source === source)
                  const changed = detail?.changed?.length ? ` — ${cell(detail.changed.join(', '))}` : ''
                  return `| \`${source}\` | ${state} | ${firstSeen[source]} | ${detail?.detail ? cell(detail.detail) : ''}${changed} |`
                }
                return [
                  `Compared against \`build_state.json\` captured ${verdict.state_captured_at ?? 'on an unrecorded date'}` +
                    (age === null || age === undefined ? '' : ` (${age} days ago)`) + '.',
                  '',
                  '| source | state | first seen | detail |',
                  '|---|---|---|---|',
                  ...stale.map(s => row(s, 'changed upstream')),
                  ...unknown.map(s => row(s, 'could not be checked')),
                  ...(refreshAlarm
                    ? [`| \`${monthly.workflow}\` | ${monthly.state === 'overdue' ? `monthly refresh overdue: ${monthly.age_days} days since ${monthly.since}, past ${monthly.max_age_days}` : 'monthly refresh could not be checked'} | ${firstSeen[monthly.workflow]} | ${cell(monthly.detail ?? (monthly.last_refresh ? `last refreshed UA: ${monthly.last_refresh}` : `none of the last ${monthly.runs_read} runs on main refreshed UA`))} |`]
                    : []),
                  '',
                  unknown.length
                    ? '`could not be checked` is not `fine`. A source nobody could verify is exactly how stale data survives, so it is listed rather than rounded down.'
                    : '',
                  '',
                  withdrawn.length
                    ? 'Not checked on purpose: ' + withdrawn.map(source => {
                        const detail = (verdict.sources ?? []).find(s => s.source === source)?.detail
                        return `\`${source}\`` + (detail ? ` - ${cell(detail)}` : '')
                      }).join('; ') + '.'
                    : '',
                  '',
                  'Changed data is not published data — this job holds no R2 credentials. Run **Publish vector data** to rebuild.',
                  refreshAlarm ? 'The monthly row clears when a build on main from an extract under 35 days old refreshes UA, which its job "Confirm UA serves what the build wrote" passing shows, even when another job turns that run red. **Refresh reference data** (refresh-reference.yml) extracts, pins and starts that build (build-reference.yml): dispatch it.' : '',
                  '',
                  `Last checked ${verdict.checked_at ?? monthly.checked_at} · [run](${process.env.RUN_URL})`,
                  '',
                  '---',
                  '_Generated by [Claude Code](https://claude.ai/code)_',
                ].join('\n')
              },
            })
