# GENERATED by pipeline/make_dbt_staging.py from sources.json
# and the extract's club folders; edit them or it, never this file.
version: 2

sources:
  - name: wi_dnr
    description: >
      The layers sources.json registers for the extract's wi_dnr/ folder
      (pipeline/extract/wi_dnr/) that pipeline/make_dbt_staging.py stages, landed as
      raw_wi_dnr__<key> and staged once each by a generated base model here. Descriptions
      transcribed from sources.json's titles and key notes.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      meta:
        cadence: monthly
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_wi_dnr__silvicast_podcast
        data_tests:
          # Rows sharing base_wi_dnr__silvicast_podcast's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'silvicast_podcast'", "guid"]
        description: >
          SilviCast (podcast feed, Wisconsin Forestry Center and Wisconsin DNR)
          (sources.json `silvicast_podcast`). Key: `guid`: present and unique on all 71
          items read 2026-10-04, the feed's own id for an episode, which a podcast app
          keys on too.
      - name: raw_wi_dnr__wdnr_managed_properties
        data_tests:
          # Rows sharing base_wi_dnr__wdnr_managed_properties's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'wdnr_managed_properties'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
        description: >
          DNR Managed Land Property Search Layer (sources.json `wdnr_managed_properties`).
          Key: the geometry (every vertex as the layer serves it): 1,978 of 1,978, no
          exact copies; the attribute pair (PROP_NAME, ACRES) is unique too (measured
          2026-10-03 by reading every row and every vertex as the extract reads the layer
          (f=geojson, outSR 4326), under lib/user_agent.py's USER_AGENT, robots.txt
          first). The geometry stands alone because it is the smallest key: phase C's base
          model keys and dedupes on it.
      - name: raw_wi_dnr__wdnr_wild_wisconsin_podcast
        data_tests:
          # Rows sharing base_wi_dnr__wdnr_wild_wisconsin_podcast's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'wdnr_wild_wisconsin_podcast'", "guid"]
        description: >
          Wild Wisconsin, Off the Record (podcast feed, Wisconsin DNR) (sources.json
          `wdnr_wild_wisconsin_podcast`). Key: `guid`: present and unique on all 59 items
          read 2026-10-04, the feed's own id for an episode, which a podcast app keys on
          too.
      - name: raw_wi_dnr__wi_dnr_hiking
        data_tests:
          # Rows sharing base_wi_dnr__wi_dnr_hiking's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'wi_dnr_hiking'", "link", "name"]
        description: >
          Wisconsin DNR property hiking pages
          (dnr.wisconsin.gov/topic/<kind>/<property>/recreation/hiking) (sources.json
          `wi_dnr_hiking`). Key: The property's hiking page and the trail's name (`link`,
          `name`): unique on all 170 rows read 2026-10-04. The name alone is not ('Blue
          trail' is in two parks, 'Ice Age National Scenic Trail' in more).
