version: 2

models:
  - name: pub_challenges
    description: >
      Writes challenges.json, the clubs' challenges a phone lists, from the
      challenges mart: one row, `source` and `challenges`, which the
      phone_file materialisation copies to processed_dir/challenges.json as
      one JSON document. parity.py compares it with export_challenges.py's
      build_output(), record by record, in the dbt job.
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: source
        description: export_challenges.py's literal, reference/challenges, where the judgement lives.
        data_type: varchar
        data_tests: [not_null, unique]
      - name: challenges
        description: >
          The challenges in the files' path order, each as build_output()
          writes one: the resolved record with org_name, org_short and
          org_domain beside it.
        data_type: json[]

exposures:
  - name: challenges_json
    label: challenges.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      The challenges clubs put on their own trails (#1780 — Let a club
      publish a challenge — places on its own trails that hikers opt into
      and tag at camp — starting with the ATC's A.T. Summer Bucket List),
      read by client/src/lib/challengeFeed.ts under config.ts's
      CHALLENGES_KEY. In the release folder, `@release optional`: a release
      with none reads as "no challenges yet". Published by
      publish-vector-data.yml from export_challenges.py's file (publish.py
      collects challenges_manifest.json) until stage 4 of #1793 — Rebuild
      the data platform as dlt → dbt: seven contracted marts, a monthly
      refresh, published docs, and lighter phone downloads moves the upload
      to this writer's.
    depends_on:
      - ref('challenges', v=1)
      - ref('pub_challenges')
    config:
      meta:
        r2_keys: [challenges.json]
        format: json
        # The reviewed files and the POI miles under them both move on the
        # monthly lane; publish-vector-data.yml ships them today on dispatch.
        cadence: monthly
        # The mart columns this file's writer reads, in Elementary's type words, which
        # exposure_schema_validity checks on the mart (decision 102). It can only because this is
        # the one phone file reading that mart: with more, Elementary 0.26.0 needs
        # context["render"], which dbt 2.0.6 lacks.
        referenced_columns:
          - {column_name: challenge_id, data_type: string}
          - {column_name: org, data_type: string}
          - {column_name: org_name, data_type: string}
          - {column_name: org_short, data_type: string}
          - {column_name: org_domain, data_type: string}
          - {column_name: trail, data_type: string}
          - {column_name: name, data_type: string}
          - {column_name: status, data_type: string}
          - {column_name: challenge_summary, data_type: string}
          - {column_name: window_opens, data_type: string}
          - {column_name: window_closes, data_type: string}
          - {column_name: finish_count, data_type: numeric}
          - {column_name: finish_label, data_type: string}
          - {column_name: reward_kind, data_type: string}
          - {column_name: reward_rules_url, data_type: string}
          - {column_name: reward_art, data_type: string}
          - {column_name: takes_entries, data_type: boolean}
          - {column_name: photo, data_type: string}
          - {column_name: reviewed, data_type: string}
          - {column_name: sections, data_type: other}
          - {column_name: items, data_type: other}
          - {column_name: list_position, data_type: numeric}
