    given:
      - input: ref('stg_row_history__closures')
        rows:
          - {history_row_key: h1, dbt_scd_id: s1, closure_id: 'feed_a:item-1', club: a, source_key: feed_a, notice_kind: club_feed_notices, obstructs_trail: true, review_state: org_published, title: 'Fixture Trail closed', dbt_valid_to: null, row_json: '{"starts_on": "2026-09-21", "ends_on": null}'}
