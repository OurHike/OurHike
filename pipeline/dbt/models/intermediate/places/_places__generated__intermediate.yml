# GENERATED by pipeline/make_dbt_staging.py from sources.json
# and the extract's club folders; edit them or it, never this file.
version: 2

models:
  - name: int_places__unioned
    description: >
      Every places row of the 83 registered ArcGIS layers pipeline/make_dbt_staging.py stages,
      unioned by name: one feature of a places layer: a park, a public land unit, a town, a
      section of trail. Each row carries its layer's registry key, the club folder that
      extracted it, the base model's key, the conformed columns below, its geometry as landed
      and its layer's own columns as `properties`. Unfiltered: whatever reads it keeps
      int_sources__publication's verdict.
    data_tests:
      # The lon/lat swap test, against the box each source's rows are held
      # to (macros/generated_regions.sql, read by
      # macros/lands_outside_its_region.sql).
      - lands_in_the_region_its_source_publishes_in:
          arguments:
            geometry: geom
    columns:
      - name: place_key
        description: The base model's key, carried; unique across the union because the registry key is its first input.
        data_tests: [not_null, unique]
      - name: source_key
        description: The layer's sources.json key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_registry__sources')
                field: source_key
      - name: club
        description: The extract folder that landed the row (trail_orgs.json's slug, `-` written `_`).
        data_tests: [not_null]
      - name: name
        description: >
          The layer's own name for the feature, from the registry's `name_field`, or its
          `name_constant` for a layer that names its one feature only in the registry;
          null where it has neither.
      - name: category
        description: >
          The layer's own category, from the registry's `category_field`; null where the
          registry names none.
      - name: geom
        description: The feature's geometry as the layer published it, in OGC:CRS84, with a Z where the layer's vertices carry one.
      - name: properties
        description: The base row's own columns, under dlt's names, as JSON, the geometry left out.
      - name: _loaded_at
        description: When the extract landed the row (dlt's load stamp).
