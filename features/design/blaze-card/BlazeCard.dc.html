<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Mono',monospace;color:#fdfaf2}
a{color:#96b98c}a:hover{color:#c7dabd}
.bc-tile{display:flex;align-items:center;justify-content:center;border-radius:3px;background:#284029;box-sizing:border-box}
.bc-tile svg{width:62%;height:62%;stroke:#96b98c;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bc-tile.done{background:#fdfaf2;box-shadow:0 1px 0 rgba(0,0,0,0.35)}
.bc-tile.done svg{stroke:#122016;stroke-width:2}
.bc-tile.mystery{background:transparent;border:1.5px dashed #47784b}
.bc-tile.mystery svg{stroke:#6b9463}
</style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 8px; background: #122016; padding: 2px; border-radius: 6px">
  <sc-for list="{{sections}}" as="s" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <sc-if value="{{labels}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 1px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #96b98c; line-height: 1">
          <span>{{s.name}}</span>
          <span style="color: #6b9463">{{s.count}}</span>
        </div>
      </sc-if>
      <div style="display: flex; flex-wrap: wrap; gap: {{gapPx}}">
        <sc-for list="{{s.tiles}}" as="t" hint-placeholder-count="10">
          <div class="bc-tile {{t.cls}}" style="width: {{tilePx}}; height: {{tallPx}}" title="{{t.title}}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d}}"></path></svg>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>

const SECTIONS=[["L","Learn about the A.T."],["E","Experience the A.T."],["P","Protect the A.T."],["M","Mystery items"]];
class Component extends DCLogic {
  renderVals() {
    const tile = this.props.tile ?? 30;
    const gap = this.props.gap ?? 5;
    const labels = this.props.labels ?? true;
    const done = new Set(Array.isArray(this.props.done) ? this.props.done : []);
    const sections = SECTIONS.map(([key, name]) => {
      const tiles = [];
      ITEMS.forEach((it, i) => {
        if (it[0] !== key) return;
        const isDone = done.has(i);
        tiles.push({
          cls: isDone ? 'done' : (it[1] === 'mystery' ? 'mystery' : ''),
          d: ICONS[it[1]] || ICONS.learn,
          title: it[2],
        });
      });
      return { name, count: String(tiles.length), tiles };
    });
    return {
      sections,
      labels,
      gapPx: gap + 'px',
      tilePx: tile + 'px',
      tallPx: Math.round(tile * 1.3) + 'px',
    };
  }
}
