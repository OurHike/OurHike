  - name: int_points_of_interest__in_corridor_asks_a_long_line_segment_by_segment
    description: >
      The ring asked of a line's segments keeps what the whole line keeps.
      With poi_network_ring_part_max_vertices at 2, every part longer than
      two vertices is probed segment by segment: a four-vertex zigzag, the
      three-vertex part of a MultiLineString beside its two-vertex part
      (probed whole), and a line whose first vertex repeats (a zero-length
      segment). Points 111-133 m from a first, middle and last segment and
      from the repeated vertex are kept; a point inside the zigzag's bounding
      box but 372 m from it, one between the MultiLineString's parts, and one
      167 m past the repeated vertex are not. One A.T.-family row is outside
      the corridor and kept by the ring alone.
      tests/test_dbt_points_of_interest_parity.py holds every row to
      clip_to_corridor() and clip_to_network(), which ask whole lines.
    model: int_points_of_interest__in_corridor
    overrides:
      # dbt 2.0.6 replaces the project's vars with these rather than merging
      # them, so every var the model reads is here; all but the first are
      # dbt_project.yml's own, which the parity test holds them to.
      vars:
        poi_network_ring_part_max_vertices: 2
        poi_network_ring_feet: 500
        poi_metres_per_foot: 0.3048
        poi_corridor_buffer_miles: 30
        mile_axis_metres_per_mile: 1609.344
        poi_network_ring_exempt_types: ['parking', 'trailhead']
    given:
      - input: ref('int_points_of_interest__publishable')
        rows:
          - {poi_key: 's-01', source_key: 'dec_lean_tos', phone_files: 'nearby_poi', poi_type: 'shelter', lon: -75.4985, lat: 42.005, boundary_source: null}
