    expect:
      rows:
        - {"place_id": "oprhp_park_polygons:127", "name": "Robert Moses", "category": null, "state": "NY", "unit_order": 0, "polygons": 1}
        - {"place_id": "oprhp_park_polygons:270", "name": "Robert Moses", "category": null, "state": "NY", "unit_order": 1, "polygons": 1}
