          geometry alone is 32,414: 297 rows share a shape with another, telling
          themselves apart by owner, purchase date and county (FIPS and its four
          population columns), the smallest such set of three; 2 rows have no geometry.
          Reasoned, not asked: one row per owner, purchase and county a parcel spans.
