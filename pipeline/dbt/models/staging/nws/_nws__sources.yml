version: 2

sources:
  - name: nws
    description: >
      The National Weather Service's active alerts, landed by the extract's
      _shared/nws/ folder (pipeline/extract/_shared/nws/alerts.py) from
      lib/nws_alerts.py's ALERTS_URL, every alert in the US, read whole every
      run. A federal work, public domain (17 U.S.C. 105), credited "National
      Weather Service" (export_weather_alerts.py's CREDIT).
    schema: raw
    config:
      # How long since the extract last read the alerts, from its run log
      # (macros/last_read_or_confirmed_at.sql), not `_loaded_at`: a run whose
      # read NWS refused moves neither, and an answer with no alerts lands no
      # row to carry a `_loaded_at`. A refusal is a warning on the hourly run
      # since decision 100 (the maintainer's poll of 2026-10-07), and red here
      # once NWS has gone unread for 24 hours, the notices' rule. The hourly
      # thresholds are generate_notice_models.py's FRESHNESS_HOURS, graded
      # there; tests/test_notice_source_freshness.py holds these to them.
      # publish-conditions.yml's freshness step selects `conditions_job`.
      loaded_at_query: "{{ last_read_or_confirmed_at(this) }}"
      tags: [conditions_job]
      meta:
        cadence: hourly
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: raw_nws__alerts
        data_tests:
          # Rows sharing base_nws__alerts's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'nws_alerts'", "id"]
        description: >
          Every active NWS alert, one row per message as /alerts/active
          serves it, Test messages and cancellations included: the relay in
          int_warnings__nws_relayed drops those (WN01). Its 30 properties are
          hinted (extract/_kinds.py's NWS_TEXT_PROPERTIES and
          NWS_JSON_PROPERTIES), so each column exists when null, and the
          times stay text with NWS's own offsets. Key: `id`, NWS's message id;
          an update is a new message (pipeline/ELT.md, "Stable upstream keys").
        columns:
          - name: id
            description: NWS's own message id, `urn:oid:...`.
            data_tests: [not_null]
