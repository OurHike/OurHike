version: 2

sources:
  - name: cfpa
    description: >
      The layers sources.json registers for the extract's cfpa/ folder
      (pipeline/extract/cfpa/) that pipeline/make_dbt_staging.py stages, landed as
      raw_cfpa__<key> and staged once each by a generated base model here. Descriptions
      transcribed from sources.json's titles and key notes.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      meta:
        cadence: monthly
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_cfpa__cfpa_overnight_sites
        data_tests:
          # Rows sharing base_cfpa__cfpa_overnight_sites's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'cfpa_overnight_sites'", "globalid"]
        description: >
          Blue-Blazed Hiking Trail overnight sites (CFPA's own layer) (sources.json
          `cfpa_overnight_sites`). Key: the registry's `id_field`; its row records no
          measurement of it.
      - name: raw_cfpa__cfpa_parking
        data_tests:
          # Rows sharing base_cfpa__cfpa_parking's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'cfpa_parking'", "globalid"]
        description: >
          Blue-Blazed Hiking Trail parking (CFPA's own layer) (sources.json
          `cfpa_parking`). Key: the registry's `id_field`; its row records no measurement
          of it.
