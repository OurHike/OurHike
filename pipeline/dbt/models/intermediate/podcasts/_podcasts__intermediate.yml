version: 2

models:
  - name: int_podcasts__checked
    description: >
      Every row of reference/podcast_episodes.json, read field by field and
      checked against lib/podcasts.py's rules in validate()'s order, with the
      first rule it breaks (`rule_id`, pipeline/ELT.md's PC numbers) and why
      (`problem`). Null in both means the row publishes.
    data_tests:
      # PC07, the gate: any row with a problem fails the build, so the
      # writers, which run only after every test has passed, write nothing.
      # export_podcasts.py's "a list that dropped a row is not uploaded".
      # dbt 2.0.6 reports only how many rows failed (it has no option to
      # print them, 2026-10-01), where export_podcasts.py printed each row
      # and why. To see them, from pipeline/dbt:
      #   dbt show --profiles-dir . --inline "select row_label, rule_id, problem
      #     from intermediate.int_podcasts__checked where problem is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "problem is null"
          config:
            severity: error
    columns:
      - name: episode_row_key
        description: base_podcasts__podcast_episodes's key, the file and the row's place in it.
        data_tests: [not_null, unique]
      - name: file_row
        description: The row's place in the file, from 0.
      - name: row_label
        description: The row as validate() names it in a message, "row N (spotify_id)".
      - name: spotify_id
        description: The row's spotify_id where it is a string, as written.
      - name: show_name
        description: The row's `show`, stripped, where it is a string. A DuckDB keyword, so renamed.
      - name: rule_id
        description: The first rule the row breaks, as numbered in pipeline/ELT.md's podcasts rule table. Null if it breaks none.
      - name: problem
        description: >
          Why, in validate()'s words, with any value rendered as JSON rather
          than as Python's repr. Null if the row publishes.

unit_tests:
  - name: int_podcasts__checked_finds_what_validate_finds
    description: >
      One row per branch of lib/podcasts.py's validate(), and the three
      places this model is deliberately stricter (rows 36, 37 and 39; row 33
      is an oddly spelt link host both accept). Each row's expected
      rule and problem are what validate() reports for it, with values
      rendered as JSON; tests/test_dbt_podcasts_parity.py runs validate()
      over these same rows and fails if the two disagree anywhere it does
      not list as deliberate. Rows 34 and 35 share an id: validate()
      remembers an id only once its row passes, so the second row is kept,
      not refused as a repeat.
    model: int_podcasts__checked
