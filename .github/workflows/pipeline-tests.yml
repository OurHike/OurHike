name: Pipeline tests

on:
  # `main` only. Matching every branch here would double every PR's CI:
  # pushing to a PR branch fires BOTH the push event and the pull_request
  # event for the same commit, running each job twice for an identical
  # result. The pull_request trigger below already covers branches.
  #
  # This run is still worth keeping for main itself - it is post-merge
  # validation against the real merge commit, which is exactly what caught
  # the flaky staleness boundary test in #32 (green on the PR, red on the
  # merge).
  push:
    branches: [main]
  # Deliberately NOT narrowed with `paths:`, even though that is the obvious
  # way to stop a docs-only PR running the pipeline suite. A workflow skipped
  # by a path filter reports no status at all, and a required check that
  # reports no status blocks the PR forever rather than passing it - the same
  # trap pr-issue-link.yml documents for job-level `if:`. The scoping happens
  # inside the job instead, where it can still finish green.
  pull_request:
    branches: [main]
  # The event a merge queue raises checks on. This has to be in place before
  # the queue is switched on rather than after: a required check that never
  # reports does not fail a queue entry, it hangs it until the queue times out
  # and ejects the pull request. BRANCHING.md holds the rest of the setup.
  #
  # Deliberately unfiltered, unlike the two triggers above. A queue entry's ref
  # is `refs/heads/gh-readonly-queue/main/pr-N-<sha>` rather than `main`, and
  # `merge_group`'s `branches:` filter is undocumented as to which of those two
  # it matches (github/docs#32879). A filter that guesses wrong costs the same
  # hang as no trigger at all, and there is nothing to scope anyway - a queue
  # is enabled per branch in the ruleset, and only `main` has one.
  merge_group:

# Narrower than the default token. `pull-requests: read` is what lets the
# scope step ask which files the pull request touches.
permissions:
  contents: read
  pull-requests: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    # For tests/test_export_conditions.py alone, and worth a service container
    # for one file: what it proves is that row-level security turns a missing
    # policy into ZERO ROWS rather than an error, which is the failure
    # export_conditions.py exists to catch and the one that would otherwise
    # publish an empty closures artifact. Those tests skip when no database is
    # reachable, so without this they would skip here - silently, and exactly
    # where the proof is worth having. Same image and credentials as
    # backend-tests.yml, which tracks the version Supabase runs.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ourhike
          POSTGRES_PASSWORD: ourhike
          POSTGRES_DB: ourhike_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # No `if:` on this job, and there should never be one - see the note on
      # the trigger above. The steps carry the condition instead, so a PR that
      # touches nothing under pipeline/ still reports success having done
      # nothing, and this can be made a required check without that becoming a
      # trap.
      #
      # Checkout is unconditional because the scope action lives in this
      # repository and has to be on disk before it can decide anything.
      - uses: actions/checkout@v7

      - id: scope
        uses: ./.github/actions/changed-paths
        with:
          # pipeline/ carries its own requirements and pyproject, and nothing
          # outside it is imported by the pipeline - checked, not assumed. The
          # workflow and the action are in the list so a change to the gate
          # itself still proves the suite it gates.
          #
          # The four client modules are here because
          # tests/test_published_key_contract.py READS them as text: every
          # published R2 key the app fetches is built from them, and a key
          # renamed there is a 404 on a mountain that nothing else in this
          # repository would notice. That rename arrives in a client-only pull
          # request, which is exactly the run a `pipeline/`-only scope would
          # skip. TESTING.md's rule, in the "Redundancy" section: **a suite's
          # scope list includes every file its tests read.**
          #
          # Four files rather than `client/src/lib/`, which is what this said
          # first: the directory is touched by most client work, and spending a
          # full pipeline run on it to catch drift in four rarely-edited
          # modules is a tax on the commonest kind of pull request here. The
          # narrow list is only honest while it is complete, so
          # tests/test_ci_scope.py reads this line back and fails if the
          # contract test starts reading a client file that is not on it.
          #
          # features/SPUR_TRAILS.md is here for the same rule and a different
          # test: test_export_spurs.py reads it to hold the doc and
          # export_spurs.py to the same destination partition (#501), and the
          # edit that breaks that agreement is a docs-only pull request.
          paths: >-
            pipeline/
            features/SPUR_TRAILS.md
            client/src/lib/blaze.ts
            client/src/lib/config.ts
            client/src/lib/hikingDetail.ts
            client/src/lib/packages.ts
            client/src/lib/mapSheets.ts
            client/src/lib/podcasts.ts
            client/src/lib/publishedConditions.ts
            .github/workflows/pipeline-tests.yml
            .github/actions/changed-paths/

      - uses: actions/setup-python@v7
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.14"
          # The pip cache every cold-path workflow already uses (#660) - the
          # two hot-path PR suites were the ones paying the cold install on
          # every push.
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pip install -r requirements-dev.txt

      # Take the spatial extension from PyPI instead of extensions.duckdb.org
      # (#321). `INSTALL spatial` is a live network fetch, and it is the one
      # standing exception to TESTING.md's "tests never touch the network" -
      # so an extension-repo outage reddens this suite for a reason that has
      # nothing to do with the change under test.
      #
      # The version is duckdb's OWN, asked of the interpreter rather than read
      # back out of the requirements file: extensions are ABI-locked to the
      # exact build, and the installed one is the only version that has to
      # match. Same script the web session hook runs, for the same reason.
      - name: Seed the duckdb spatial extension
        if: steps.scope.outputs.run == 'true'
        run: |
          pip install "duckdb-extension-spatial==$(python -c 'import duckdb; print(duckdb.__version__)')"
          python seed_spatial_extension.py

      - name: Lint
        if: steps.scope.outputs.run == 'true'
        run: python -m ruff check .

      - name: Check formatting
        if: steps.scope.outputs.run == 'true'
        run: python -m ruff format --check .

      - name: Run tests
        if: steps.scope.outputs.run == 'true'
        run: python -m pytest -v

  # The dbt transform layer (pipeline/DBT.md's CI plan, #100), on dbt v2:
  # the full `dbt` 2.0.6 distribution, one dbt version everywhere (#1793 —
  # Rebuild the data platform as dlt → dbt: seven contracted marts, a monthly
  # refresh, published docs, and lighter phone downloads; decision 32 chose it
  # over dbt-oss 2.0.5, which also ran every step of this job green and stays
  # the documented fallback - requirements-dbt.in says how). Its own job
  # rather than steps on `pytest`, because its dependency set
  # (requirements-dbt.txt) shares nothing with the pytest job's beyond
  # duckdb. Same no-`if:`-on-the-job rule as above, and the job id stays
  # `dbt`: it is a required check (.github/expected-protections.yml), and a
  # renamed required job hangs the merge queue (.github/workflows/README.md).
  #
  # The order is cheapest failure first: lint and `dbt parse` need no
  # warehouse, so a style slip or a YAML shape v2 refuses fails in seconds,
  # before fixtures are built.
  dbt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    # TELEMETRY OFF, by the opt-out dbt documents. The dbt Product Licensing
    # Agreement (§2.3) has dbt collect usage information, and v2 sends it to
    # p.vx.dbt.com on every invocation unless this is set (docs.getdbt.com,
    # "Anonymous usage stats" and "dbt v2 networking requirements"). It is the
    # documented switch and nothing more: §3.2 forbids disabling licence
    # validation or anything else that talks to dbt's services, so no other
    # switch is set here, ever. Measured 2026-10-01 through a proxy that logs
    # every host: without this, each dbt 2.0.6 command tried (parse, show)
    # opened p.vx.dbt.com; with it, parse, show and build opened none.
    # DO_NOT_TRACK=1, which the same docs page offers, still opened it, so it
    # is not used.
    env:
      DBT_ENGINE_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v7

      - id: scope
        uses: ./.github/actions/changed-paths
        with:
          # Narrower than the pytest job's list: this job builds the dbt
          # project off the warehouse fixture mode writes (extract/_fixtures.py,
          # the real extract over make_dbt_fixtures.py's files), and the paths
          # below are the rest of pipeline/ that reaches it. extract/, lib/ and
          # the six top-level modules are the extract's own imports, which
          # tests/test_extract_layout.py holds this list to; sources.json and
          # reference/trail_orgs.json are what a resource reads its URL and
          # its club from, and the rest of reference/ holds the reviewed
          # files fixture mode loads as they are. parity.py and the exporters
          # it runs (export_podcasts.py, export_sources.py, export_elevation.py)
          # are the parity step's; the same test holds the list to their
          # imports too. build_marts.py runs the build, and
          # step_dem_sampling.py is the Python step it runs between dbt
          # invocations (tests/test_build_marts.py holds this list to both).
          paths: >-
            pipeline/dbt/
            pipeline/extract/
            pipeline/lib/
            pipeline/.dlt/
            pipeline/reference/
            pipeline/parity.py
            pipeline/export_podcasts.py
            pipeline/export_sources.py
            pipeline/export_atc_updates.py
            pipeline/export_nynjtc_alerts.py
            pipeline/fetch_nynjtc_alerts.py
            pipeline/export_nearby_trails.py
            pipeline/export_trails.py
            pipeline/export_elevation.py
            pipeline/step_dem_sampling.py
            pipeline/build_marts.py
            pipeline/requirements.txt
            pipeline/export_spurs.py
            pipeline/export_club_sections.py
            pipeline/check_freshness.py
            pipeline/export_conditions.py
            pipeline/fetch_club_pdfs.py
            pipeline/fetch_elevation.py
            pipeline/fetch_hikefinder.py
            pipeline/fetch_opentrail.py
            pipeline/make_dbt_fixtures.py
            pipeline/sources.json
            pipeline/requirements-dbt.in
            pipeline/requirements-dbt.txt
            pipeline/requirements-extract.in
            pipeline/requirements-extract.txt
            pipeline/.sqlfluff
            .github/workflows/pipeline-tests.yml
            .github/actions/changed-paths/

      # Python 3.12, still. It used to be forced: dbt-core lagged the newest
      # CPython the pytest job runs. dbt v2 is not a Python program - its
      # wheel is a Rust binary tagged cp311-abi3, so any CPython >= 3.11
      # runs it (PyPI, read 2026-10-01). What still ties this job to 3.12 is
      # requirements-dbt.txt, which pip-compile resolved on 3.12; moving the
      # version means recompiling that file on the new one.
      - uses: actions/setup-python@v7
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements-dbt.txt
            pipeline/requirements-extract.txt

      # WHAT dbt FETCHES AT RUN TIME, CACHED. Neither v2 distribution ships a
      # database driver. On its first command dbt downloads the ADBC driver
      # for the profile's adapter from public.cdn.getdbt.com
      # (docs.getdbt.com, "dbt v2 networking requirements"), and its DuckDB
      # then installs spatial from extensions.duckdb.org. Measured 2026-10-01
      # from an empty HOME, dbt 2.0.6: libadbc_driver_duckdb-1.5.4.so,
      # 70,458,712 bytes, into ~/.cache/com.getdbt/adbc/, and the 1.5.4
      # spatial build, 80,848,518 bytes, into ~/.duckdb/extensions/v1.5.4/.
      #
      # Cached, because with both present dbt 2.0.6 parsed and built all 153
      # nodes with every outbound connection refused (measured the same day).
      # So a warm cache turns an outage of either host into nothing, which is
      # #321 — Pin the Python dependency sets and cache the DuckDB spatial
      # extension in CI's argument, and saves about 151 MB a run. It is not a
      # way around anything dbt does: the docs' own answer for an offline
      # machine is to pre-cache drivers (`dbt system install-drivers`, which
      # fetches all seven adapters' drivers, so not used here), and dbt still
      # makes its per-command call to public.cdn.getdbt.com either way
      # (measured: one connection per command with the driver already
      # cached; dbt-oss 2.0.5 made none. What it carries is not in the debug
      # log, and nothing here touches it).
      #
      # What a cache cannot do: a miss (the first run on a new requirements
      # hash, or an entry GitHub evicted) downloads both again. And the two
      # paths are what dbt wrote here, not a documented location: if a later
      # dbt moves them, this restores files nothing reads and the run
      # downloads as before - slower, never wrong. The key is the
      # requirements file, which pins dbt, and the driver comes with the dbt
      # version (its checksums ship inside the binary, per the same docs page).
      - name: Restore dbt's DuckDB driver and v2's spatial extension
        id: dbt-runtime
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/com.getdbt/adbc
            ~/.duckdb/extensions/v1.5.4
          key: dbt-v2-runtime-${{ runner.os }}-${{ hashFiles('pipeline/requirements-dbt.txt') }}

      # dbt 2.0.6 is a 3,291-byte sdist on PyPI whose build step downloads the
      # real wheel from public.cdn.getdbt.com/fs/wheels and checks its sha256
      # (requirements-dbt.in says more). So a cold install depends on dbt's
      # CDN as well as PyPI. pip keeps the wheel it built in its cache, which
      # the setup step above restores, so a warm run should not repeat the
      # download (Reasoned, from how pip caches wheels built from an sdist;
      # not yet watched on a runner).
      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pip install -r requirements-dbt.txt

      - name: dbt deps
        if: steps.scope.outputs.run == 'true'
        working-directory: pipeline/dbt
        run: dbt deps --profiles-dir .

      # The jinja templater (pipeline/.sqlfluff says why not the dbt one), so
      # this needs no warehouse. It does need the packages: dbt_utils' macros
      # render from dbt_packages/ (dbt/sqlfluff_libs/dbt_utils.py), so it runs
      # after deps. The enforced lint (decision 33): 0 violations, 3.8 s serial
      # on the 32 files of 2026-10-01.
      - name: sqlfluff lint
        if: steps.scope.outputs.run == 'true'
        run: sqlfluff lint dbt/models dbt/tests

      # The first dbt command after deps (parse needs the packages), and the
      # v2 gate: dbt-oss 2.0.5 refused this project's v1-shaped YAML with 64
      # errors until the YAML moved to v2's shape, and 2.0.6 parses the moved
      # YAML clean (both measured 2026-10-01). Parse needs no warehouse, so a
      # regression to the old shape fails here, in about a second, rather
      # than after the fixtures load.
      - name: dbt parse
        if: steps.scope.outputs.run == 'true'
        working-directory: pipeline/dbt
        run: dbt parse --profiles-dir .

      # dbt's own linter, beside SQLFluff and not instead of it (decision
      # 33). It reads pipeline/.sqlfluff but warns that it supports only
      # SQLFluff's `dbt` templater ("Continuing anyway"), and it misses some
      # of what SQLFluff reports: measured 2026-10-01 on dbt 2.0.6, it linted
      # the 32 files in 0.08 s and failed on a planted CP01 (keyword case) but
      # passed a planted LT01 (a space before a comma) that SQLFluff fails.
      # After deps and parse because it loads the whole project, and with no
      # dbt_packages/ it installs the packages itself.
      - name: dbt lint
        if: steps.scope.outputs.run == 'true'
        working-directory: pipeline/dbt
        run: dbt lint --profiles-dir .

      # FIXTURE MODE (pipeline/ELT.md, "Fixture mode"): the warehouse comes
      # from the extract itself, run over make_dbt_fixtures.py's files by
      # extract/_fixtures.py, so every staging model here reads a table dlt
      # wrote, as it will in production. Until stage 3 of #1793 it came from
      # load_raw.py's ST_Read, whose tables no extract run would ever write.
      #
      # ITS OWN VENV, because requirements-extract.txt and
      # requirements-dbt.txt cannot share one: click is 8.5.0 in the first
      # and 8.4.2 in the second (2026-10-01). The extract pins are the extract
      # jobs' own, so this is the dependency set the fixtures run under in
      # production too. No secret is in this job.
      #
      # No spatial seeding any more. It was for load_raw.py's ST_Read; the
      # extract reads no geometry, landing it as GeoJSON text, and dbt loads
      # its own spatial build through the cache step above.
      - name: Install the extract's own pins
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/extract"
          "$RUNNER_TEMP/extract/bin/pip" install -r requirements-extract.txt

      # THE PIPELINE'S OWN PINS, for today's exporters on the old side of
      # parity and for the Python steps (pipeline/ELT.md, "Python steps,
      # outside dbt"). Those import shapely, numpy, pyproj, requests and
      # rasterio, which neither requirements-dbt.txt nor
      # requirements-extract.txt carries, so they get requirements.txt in a
      # venv of their own, one for every family's lines. export_trails.py and
      # export_elevation.py run `INSTALL spatial`, so the venv's DuckDB gets
      # spatial from PyPI, as the pytest job's does, rather than from
      # extensions.duckdb.org on every run.
      - name: Install the pipeline's own pins (today's exporters, the Python steps)
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/pipeline"
          "$RUNNER_TEMP/pipeline/bin/pip" install --quiet -r requirements.txt
          "$RUNNER_TEMP/pipeline/bin/pip" install --quiet "duckdb-extension-spatial==$("$RUNNER_TEMP/pipeline/bin/python" -c 'import duckdb; print(duckdb.__version__)')"
          "$RUNNER_TEMP/pipeline/bin/python" seed_spatial_extension.py

      - name: Generate synthetic raw fixtures
        if: steps.scope.outputs.run == 'true'
        run: python make_dbt_fixtures.py

      - name: Load the warehouse through the extract (fixture mode)
        if: steps.scope.outputs.run == 'true'
        env:
          RUNTIME__DLTHUB_TELEMETRY: "false"
        run: >-
          "$RUNNER_TEMP/extract/bin/python" -m extract._fixtures
          --raw-dir data/raw --warehouse data/warehouse.duckdb

      # THE BUILD, in the order pipeline/build_marts.py owns (pipeline/ELT.md,
      # "Python steps, outside dbt"): the seeds; stage A, everything no Python
      # step reads back; each entry of build_marts.STEPS, then what its
      # derived table unblocks; and the pub_ writers LAST, once every test
      # above them has passed (ELT.md, "Publish (reverse ETL)"), because
      # `dbt build` tests a model after building it, so a writer built beside
      # its parents would write its file before a failing test upstream
      # stopped it. The writers write under data/processed/dbt/
      # (dbt_project.yml's processed_dir says why there), and nothing here
      # uploads anything. dbt is this job's own; the Python steps run on the
      # pipeline's pins, the venv the step above built. A new Python step is
      # an entry in build_marts.STEPS, never a step here.
      - name: dbt build, the Python steps and the pub_ writers (build_marts.py)
        if: steps.scope.outputs.run == 'true'
        run: python build_marts.py --fixtures --python "$RUNNER_TEMP/pipeline/bin/python"

      # Shadow-run parity (ELT.md, "How a rule moves"): each family the dbt
      # path writes, against today's exporter on the same input, record by
      # record. Each family here has files in git as its input (the podcast
      # list, the source registry), so CI holds the real data, not a
      # fixture. Fails on any difference.
      - name: Parity with today's exporters
        if: steps.scope.outputs.run == 'true'
        # EVERY LINE RUNS ON THE PIPELINE'S OWN PINS ($RUNNER_TEMP/pipeline,
        # built above), because the old side imports today's exporters:
        # export_atc_updates.py needs requests (through lib/atc_scrape.py),
        # export_conditions.py psycopg, and export_nearby_trails.py shapely,
        # pyproj and rasterio, none of which requirements-dbt.txt pins. The
        # job's own python failed the first conditions line on requests.
        run: |
          "$RUNNER_TEMP/pipeline/bin/python" parity.py podcasts --new data/processed/dbt/podcasts_episodes.json
          "$RUNNER_TEMP/pipeline/bin/python" parity.py stewards --new data/processed/dbt/stewards.json
          "$RUNNER_TEMP/pipeline/bin/python" parity.py registry --new data/processed/dbt/registry.json
          # The hourly conditions files. atc_updates reads
          # reference/atc_updates.json from git; the other three read the
          # answers under data/raw/conditions/ that fixture mode built the
          # warehouse from, since their upstreams are a website and a database.
          "$RUNNER_TEMP/pipeline/bin/python" parity.py atc_updates --new data/processed/dbt/conditions_atc_updates.json
          "$RUNNER_TEMP/pipeline/bin/python" parity.py nynjtc_alerts --new data/processed/dbt/conditions_nynjtc_alerts.json
          "$RUNNER_TEMP/pipeline/bin/python" parity.py closures --new data/processed/dbt/conditions_closures.json
          "$RUNNER_TEMP/pipeline/bin/python" parity.py reports --new data/processed/dbt/conditions_reports.json
          # The trail lines network, whose input is the fixture warehouse, not
          # a file in git.
          "$RUNNER_TEMP/pipeline/bin/python" parity.py nearby_trails --new data/processed/dbt/nearby_trails.geojson
          "$RUNNER_TEMP/pipeline/bin/python" parity.py network_overview --new data/processed/dbt/network_overview.geojson
          # The A.T.'s files, on the fixture's layers (ATC's are not in git); parity.py applies decision 8's 6 dp to the old side.
          "$RUNNER_TEMP/pipeline/bin/python" parity.py trails --new data/processed/dbt/trails.geojson
          "$RUNNER_TEMP/pipeline/bin/python" parity.py trail_miles --new data/processed/dbt/trail_miles.json
          "$RUNNER_TEMP/pipeline/bin/python" parity.py trails_overview --new data/processed/dbt/trails_overview.geojson
          "$RUNNER_TEMP/pipeline/bin/python" parity.py spurs --new data/processed/dbt/spurs.json
          "$RUNNER_TEMP/pipeline/bin/python" parity.py club_sections --new data/processed/dbt/club_sections.json
          # The elevation profile's input is a fixture, not a file in git: the
          # fixture centerline, markers and DEM tile make_dbt_fixtures.py wrote.
          # export_elevation.py reads the DEM through rasterio, so this runs on
          # the pipeline's own pins, the venv step_dem_sampling.py runs in.
          "$RUNNER_TEMP/pipeline/bin/python" parity.py elevation --new data/processed/dbt/elevation_profile.json --raw-dir data/raw

      - name: dbt source freshness
        if: steps.scope.outputs.run == 'true'
        working-directory: pipeline/dbt
        run: dbt source freshness --profiles-dir .

      # v2's docs are a directory, not v1's one file: index.html, an assets/
      # folder and the Parquet artifacts the page reads with DuckDB-WASM
      # (measured 2026-10-01 on dbt 2.0.6: 315 assets and 38 Parquet files,
      # 12,301,390 bytes; dbt-oss 2.0.5 wrote the same counts in 12,291,821
      # bytes). Written to target/docs, inside the gitignored target/, so
      # nothing here can be committed; .github/tests/test_no_committed_data.py
      # refuses any path under pipeline/dbt/target/ besides. The checks after
      # it fail the step when v2 stops writing one of the three parts. Nothing
      # publishes the site yet; the plan puts it at ourhike.org/data/.
      - name: dbt docs generate
        if: steps.scope.outputs.run == 'true'
        working-directory: pipeline/dbt
        run: |
          dbt docs generate --profiles-dir . --output-dir target/docs
          test -s target/docs/index.html || { echo "::error::no target/docs/index.html"; exit 1; }
          test -n "$(find target/docs/assets -type f -print -quit)" || { echo "::error::no target/docs/assets"; exit 1; }
          test -n "$(find target/docs -name '*.parquet' -print -quit)" || { echo "::error::no Parquet under target/docs"; exit 1; }
          echo "docs: $(find target/docs/assets -type f | wc -l) assets, $(find target/docs -name '*.parquet' | wc -l) Parquet files"

      # Separate from the data build so "did my data pass" and "does my
      # project follow conventions" stay independently readable (DBT.md).
      # ENFORCED: dbt_project.yml sets every evaluator test's severity from
      # this variable, so a finding fails the job. Set here rather than left
      # to the default so the step says what it does. A finding is fixed, or
      # excepted with a reason in dbt/seeds/dbt_project_evaluator_exceptions.csv.
      - name: dbt project evaluator
        if: steps.scope.outputs.run == 'true'
        working-directory: pipeline/dbt
        env:
          DBT_PROJECT_EVALUATOR_SEVERITY: error
        run: dbt build -s package:dbt_project_evaluator --profiles-dir .

      # Saved on a miss, and on a failed run too: the downloads happen on the
      # job's first dbt command, so a run that fails later still holds them
      # (test_cache_keys_are_content_addressed.py's rule for every save).
      - name: Save dbt's DuckDB driver and v2's spatial extension
        if: always() && steps.scope.outputs.run == 'true' && steps.dbt-runtime.outputs.cache-hit != 'true' && hashFiles('pipeline/requirements-dbt.txt') != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/com.getdbt/adbc
            ~/.duckdb/extensions/v1.5.4
          key: dbt-v2-runtime-${{ runner.os }}-${{ hashFiles('pipeline/requirements-dbt.txt') }}
