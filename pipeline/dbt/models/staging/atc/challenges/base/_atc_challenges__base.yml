version: 2

models:
  - name: base_atc__challenges_atc
    data_tests:
      # Says how many rows the dedupe dropped, which for a key unique by
      # construction is none.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('atc', 'raw_atc__challenges_atc')
          config:
            severity: warn
    description: >
      reference/challenges/atc/*.json, every file, keyed, each still the JSON
      its reviewer wrote. Read by stg_atc__challenges.
    columns:
      - name: challenge_file_key
        description: >
          The file's key (decision 40): dbt_utils.generate_surrogate_key over
          the folder's claim and the file's path.
        data_tests: [not_null, unique]
      - name: file_path
        description: The file's path, relative to pipeline/.
        data_tests: [not_null]
      - name: file_json
        description: The file as its reviewer wrote it, `_README` aside, as JSON; null for a file that does not parse.
      - name: file_json_text
        description: The same, as the text the extract landed.
      - name: parse_error
        description: Why the file did not parse as JSON, where it did not.
