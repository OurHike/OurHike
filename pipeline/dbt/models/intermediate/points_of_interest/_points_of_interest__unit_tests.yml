  - name: int_points_of_interest__trailheads_marks_like_mark_closed_trailheads
    description: >
      PO34 both ways, against the fixture warehouse's own ten A.T. side
      trails (make_dbt_fixtures.py; one has no geometry) and centerline,
      plus one more centerline piece: a trailhead 33 m from an open side
      trail and 44 m from a closed line is not marked; one whose two lines
      within 100 m are both closed is marked 100; one with no line within
      100 m is not; a line with no status reads open, and so do the A.T.'s
      centerline, `closed ` with a space and anything else that is not
      `closed` in some casing, which `CLOSED` is. A parking area, and an
      A.T.-family row, are not trailheads this marks.
      tests/test_dbt_points_of_interest_parity.py runs
      mark_closed_trailheads() against files written from these rows.
    model: int_points_of_interest__trailheads
    given:
      - input: ref('int_points_of_interest__identified')
        rows:
          - {poi_id: 'usfs_rec_sites:t-01', phone_files: 'nearby_poi', poi_type: 'trailhead', lon: -74.002, lat: 41.0058}
          - {poi_id: 'usfs_rec_sites:t-02', phone_files: 'nearby_poi', poi_type: 'trailhead', lon: -73.95, lat: 41.05}
          - {poi_id: 'usfs_rec_sites:t-03', phone_files: 'nearby_poi', poi_type: 'trailhead', lon: -73.9, lat: 41.1}
          - {poi_id: 'oprhp_facilities:t-04', phone_files: 'nearby_poi', poi_type: 'trailhead', lon: -73.85, lat: 41.15}
          - {poi_id: 'oprhp_facilities:t-05', phone_files: 'nearby_poi', poi_type: 'trailhead', lon: -73.8005, lat: 41.205}
          - {poi_id: 'usfs_rec_sites:t-06', phone_files: 'nearby_poi', poi_type: 'trailhead', lon: -73.75, lat: 41.25}
          - {poi_id: 'usfs_rec_sites:t-07', phone_files: 'nearby_poi', poi_type: 'trailhead', lon: -73.7, lat: 41.3}
