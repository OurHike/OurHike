[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S"]
# assert is how pytest checks; the tests' throwaway keys and tokens are not secrets.
per-file-ignores = { "tests/*" = ["S101", "S105", "S106"] }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are evaluated once, at definition, by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
