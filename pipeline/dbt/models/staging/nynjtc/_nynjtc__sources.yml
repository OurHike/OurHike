version: 2

sources:
  - name: nynjtc
    description: >
      NYNJTC's two trail extracts on their own ArcGIS org - the Long Path and
      the Highlands Trail - landed by the extract's nynjtc/ folder
      (pipeline/extract/nynjtc/trail_lines.py). These are the
      first non-A.T. TRAILS the warehouse has ever held, which is the whole
      point of Phase D (#100): a second trail's sources become new rows in
      the registry and new staging models here, not a parallel pipeline.
      Descriptions below are transcribed from sources.json's own measured
      notes, not authored here.
    schema: raw
    config:
      # When the extract last read each table or confirmed it unchanged, from
      # its run log, never `_loaded_at`: make_dbt_staging.py's
      # LOADED_AT_QUERY and MONTHLY_FRESHNESS_DAYS say why, and
      # tests/test_source_freshness.py holds every monthly source to them.
      loaded_at_query: "{{ last_read_or_confirmed_at(this) }}"
      freshness:
        warn_after: {count: 35, period: day}
        error_after: {count: 62, period: day}
    tables:
      - name: raw_nynjtc__nynjtc_long_path
        data_tests:
          # Rows sharing stg_nynjtc__long_path's key must be exact copies.
          - duplicates_are_exact:
              arguments:
                key_columns: ["'nynjtc_long_path'", "lp_section", "mileage"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks()), each with its two thresholds.
          - elementary.volume_anomalies:
              config:
                severity: error
                fail_calc: "{{ var('elementary_anomaly_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: error
                fail_calc: "{{ var('elementary_schema_change_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          NYNJTC Long Path (sources.json: discovered 2026-08-24). 43 polyline
          segments, measured live that day - the same count and field list
          the 2026-08-18 survey read. All 43 rows read Trail_Name 'Long
          Path', Maintainer 'NYNJTC' and Source 'NYNJTC'. NYNJTC updates the
          same service in place each season (the layer inside is named
          Long_Path_2025Sep), which is the property a registry URL wants.
        columns:
          - name: Blaze
            description: >
              A PLAIN STRING WITH NO CODED DOMAIN, reading the lowercase
              'aqua' on all 43 rows (measured 2026-08-24). No accepted_values
              test: the value is passed to reference/blaze_mapping.json's
              reviewed table rather than decoded, and a one-value domain test
              would break the first time NYNJTC blazes a second trail here.
          - name: Trail_Name
            description: The route name; 'Long Path' on all 43 rows.
      - name: raw_nynjtc__nynjtc_highlands_trail
        data_tests:
          # Rows sharing stg_nynjtc__highlands_trail's key must be exact copies.
          - duplicates_are_exact:
              arguments:
                key_columns: ["'nynjtc_highlands_trail'", "section_name"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks()), each with its two thresholds.
          - elementary.volume_anomalies:
              config:
                severity: error
                fail_calc: "{{ var('elementary_anomaly_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: error
                fail_calc: "{{ var('elementary_schema_change_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          NYNJTC Highlands Trail, NY and NJ sections (sources.json:
          discovered 2026-08-24). 12 section features, measured live that
          day. Section_Name is a per-section label ('NJ 2'..'NJ 9' among the
          sampled twelve). Its dataLastEditDate read 2025-12-04, eight months
          older than the Long Path's - which is what the survey meant by
          calling this layer thinner.

          THIS LAYER PUBLISHES NO BLAZE FIELD AT ALL. That absence is stated
          rather than filled: see stg_nynjtc__highlands_trail.
        columns:
          - name: Trail_Name
            description: "'Highlands' on all 12 rows."
      - name: raw_nynjtc__nynjtc_long_path_guide
        data_tests:
          # Rows sharing stg_nynjtc__long_path_guide's key must be exact copies.
          - duplicates_are_exact:
              arguments:
                key_columns: ["'nynjtc_long_path_guide'", "number"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks()), each with its two thresholds.
          - elementary.volume_anomalies:
              config:
                severity: error
                fail_calc: "{{ var('elementary_anomaly_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: error
                fail_calc: "{{ var('elementary_schema_change_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          NYNJTC's Long Path End-to-End Section Guide (sources.json's
          nynjtc_long_path_guide), landed by the guide_pages kind
          (pipeline/extract/nynjtc/points_of_interest.py): one row per
          section page as lib/nynjtc_long_path_guide.py's parse_section()
          reads it, its three blocks' mile-marked entries as JSON lists, and
          the page's sha256. 40 sections and 1,256 entries, read live
          2026-10-01. The entries keep the guide's prose in the raw store;
          what publishes is the facts build_records() makes of them.
        columns:
          - name: number
            description: The section's number, the Long Path layer's LP_Section.
            data_tests: [not_null]
          - name: description
            description: The Detailed Trail Description block's entries, as JSON.
