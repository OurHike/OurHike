  - name: int_closures__held_carried_keeps_when_carrying_began
    description: >
      A row the history saved while it was already carried keeps that
      `carried_since`, so the date says when OurHike stopped confirming the
      source, not when this build ran.
    model: int_closures__held_carried
    given:
      - input: ref('stg_row_history__closures')
        format: sql
        rows: |
          select
              cast(null as varchar) as closure_id,
              cast(null as varchar) as source_key,
              cast(null as timestamp) as dbt_valid_to,
              cast(null as json) as row_json
          where false
      - input: ref('stg_row_history__warnings')
        rows:
          - {history_row_key: h1, dbt_scd_id: s1, warning_id: 'club_held:1', warning_kind: org_notice, source_key: club_held, dbt_valid_to: null, row_json: '{"title": "Fixture carried two builds ago", "carried_since": "2026-10-04 08:00:00+00"}'}
      - input: ref('int_closures__gate')
        rows:
          - {source_key: club_held, passed: false, may_publish: true}
      - input: ref('notice_readers')
        rows:
          - {source_key: club_held, club: a, notice_type: warnings, reader: page_notice, listing: full, raw_table: raw_a__club_held, staged_by: stg_a__club_held}
      - input: ref('int_closures__window_carried')
        rows: []
    expect:
      rows:
        - {notice_id: 'club_held:1', title: 'Fixture carried two builds ago', carried_since: '2026-10-04 08:00:00+00'}

  - name: int_closures__held_carried_keeps_a_carried_notice_whose_own_end_has_passed_as_no_longer_closing
    description: >
      A notice past its own end date is kept, not dropped (the maintainer's
      frame A, 2026-10-10; int_closures__club_notices' rule 1), and rule 3
      reads a carried one again: an obstructing closure that ended two days
      ago stays carried although its source cannot be read, moves to the
      warnings mart and no longer closes the trail, not reviewed, as a fresh
      read of it would land; one that ended yesterday still closes it for the
      margin's day, in the closures mart, and one with no end stays as it
      was. The dates are relative to the build, so the margin is what is
      tested, not a fixed calendar.
    model: int_closures__held_carried
    given:
      - input: ref('stg_row_history__closures')
        format: sql
        rows: |
          select
              closure_id,
              'club_held' as source_key,
              cast(null as timestamp) as dbt_valid_to,
              json_object('title', closure_id, 'obstructs_trail', true, 'review_state', 'org_published', 'ends_on', cast(ends_on as varchar)) as row_json
          from (
              values
              ('club_held:ended_two_days_ago', cast(timezone('UTC', now()) as date) - 2),
              ('club_held:ended_yesterday', cast(timezone('UTC', now()) as date) - 1),
              ('club_held:no_end', cast(null as date))
          ) as saved (closure_id, ends_on)
      - input: ref('stg_row_history__warnings')
        format: sql
        rows: |
          select
              cast(null as varchar) as warning_id,
              cast(null as varchar) as warning_kind,
              cast(null as varchar) as source_key,
              cast(null as timestamp) as dbt_valid_to,
              cast(null as json) as row_json
          where false
      - input: ref('int_closures__gate')
        rows:
          - {source_key: club_held, passed: false, may_publish: true}
      - input: ref('notice_readers')
        rows:
          - {source_key: club_held, club: a, notice_type: closures, reader: arcgis_layer, listing: full, raw_table: raw_a__club_held, staged_by: stg_a__club_held}
      - input: ref('int_closures__window_carried')
        rows: []
    expect:
      rows:
        - {notice_id: 'club_held:ended_two_days_ago', mart: warnings, obstructs_trail: null, review_state: not_reviewed}
        - {notice_id: 'club_held:ended_yesterday', mart: closures, obstructs_trail: true, review_state: org_published}
        - {notice_id: 'club_held:no_end', mart: closures, obstructs_trail: true, review_state: org_published}

  - name: int_closures__held_carried_carries_a_notice_whose_own_start_is_still_ahead
    description: >
      A closure whose own start is a week or a month ahead is carried as it
      was saved, in the closures mart and still closing the trail, as a
      fresh read of it now publishes (the maintainer's frame B for wave 6's
      page 01, P3, 2026-10-11: shown now as upcoming, and closed by the
      phone from the day before its start). Before it, rule 1's start hold
      dropped such a carried row whose start was more than a day ahead. The
      dates are relative to the build, as the test above's are.
    model: int_closures__held_carried
    given:
      - input: ref('stg_row_history__closures')
        format: sql
        rows: |
          select
              closure_id,
              'club_held' as source_key,
              cast(null as timestamp) as dbt_valid_to,
              json_object('title', closure_id, 'obstructs_trail', true, 'review_state', 'org_published', 'starts_on', cast(starts_on as varchar)) as row_json
          from (
              values
              ('club_held:starts_in_a_week', cast(timezone('UTC', now()) as date) + 7),
              ('club_held:starts_in_a_month', cast(timezone('UTC', now()) as date) + 30)
          ) as saved (closure_id, starts_on)
      - input: ref('stg_row_history__warnings')
        format: sql
        rows: |
          select
              cast(null as varchar) as warning_id,
              cast(null as varchar) as warning_kind,
              cast(null as varchar) as source_key,
              cast(null as timestamp) as dbt_valid_to,
              cast(null as json) as row_json
          where false
      - input: ref('int_closures__gate')
        rows:
          - {source_key: club_held, passed: false, may_publish: true}
      - input: ref('notice_readers')
        rows:
          - {source_key: club_held, club: a, notice_type: closures, reader: arcgis_layer, listing: full, raw_table: raw_a__club_held, staged_by: stg_a__club_held}
      - input: ref('int_closures__window_carried')
        rows: []
    expect:
      rows:
        - {notice_id: 'club_held:starts_in_a_week', mart: closures, obstructs_trail: true, review_state: org_published}
        - {notice_id: 'club_held:starts_in_a_month', mart: closures, obstructs_trail: true, review_state: org_published}

  - name: int_closures__gate_holds_a_source_whose_row_leaks_its_wording_or_lands_outside_its_region
    description: >
      Decision 81 (the maintainer's poll, 2026-10-05: "Hold that source and
      publish the rest"): a club notice source with a row that holds its own
      wording in a published column, and one with a row outside the box it
      publishes in, are each held with that reason, the count and the first
      row, where until then either test failed the whole build. A clean club
      source beside them passes, and so do ATC, NYNJTC, OurHike and NWS's
      reports. An NWS alert outside its box holds NWS's own file the same way.
    model: int_closures__gate
    given:
      - input: ref('int_closures__unioned')
        format: sql
        rows: |
          select 'atc_trail_updates' as source_key, cast([] as varchar[]) as problems
          union all
          select 'nynjtc_trail_alerts', cast([] as varchar[])
          union all
          select 'ourhike_closures', cast([] as varchar[])
      - input: ref('int_closures__atc_checked')
        format: sql
        rows: |
          select 0 as file_row
      - input: ref('base_atc__atc_updates')
        rows:
          - {atc_updates_document_key: d1, document_json: '{"reviewed_at": "2026-08-24", "updates": [{}]}'}
      - input: ref('int_sources__publication')
        rows:
          - {source_key: atc_trail_updates, may_publish: true}
          - {source_key: nynjtc_trail_alerts, may_publish: true}
          - {source_key: oprhp_trail_closures, may_publish: true}
          - {source_key: ourhike_closures, may_publish: true}
          - {source_key: ourhike_reports, may_publish: true}
          - {source_key: nws_alerts, may_publish: true}
          - {source_key: 'reference/work_projects.json', may_publish: true}
          - {source_key: club_clean, may_publish: true}
          - {source_key: club_leaking, may_publish: true}
          - {source_key: club_outside, may_publish: true}
      - input: ref('base_ourhike__reports')
        rows: []
      - input: ref('base_nws__alerts')
        format: sql
        rows: |
          select 'k1' as nws_alert_key
      - input: ref('int_closures__work_projects_checked')
        format: sql
        rows: |
          select cast(null as bigint) as row_position, true as is_reviewed, cast([] as varchar[]) as row_problems, cast([] as varchar[]) as duplicate_problems
      - input: ref('base_extract__runs')
        format: sql
        rows: |
          select '20261003T000000.000000Z' as run_id, 'raw_nynjtc__nynjtc_trail_alerts' as table_name, 'loaded' as outcome, cast(1 as bigint) as rows_loaded, cast(1 as bigint) as count_proof
          union all
          select '20261003T000000.000000Z', 'raw_atc__atc_trail_updates', 'skipped', null, null
          union all
          select '20261003T000000.000000Z', 'raw_nysparks__oprhp_trail_closures', 'loaded', 0, 0
          union all
          select '20261003T000000.000000Z', 'raw_a__club_clean', 'loaded', 1, 1
          union all
          select '20261003T000000.000000Z', 'raw_a__club_leaking', 'loaded', 3, 3
          union all
          select '20261003T000000.000000Z', 'raw_a__club_outside', 'loaded', 2, 2
      - input: ref('notice_readers')
        rows:
          - {source_key: atc_trail_updates, club: atc, notice_type: closures, reader: reviewed_file, listing: full, raw_table: raw_atc__atc_trail_updates, staged_by: hand}
          - {source_key: nynjtc_trail_alerts, club: nynjtc, notice_type: closures, reader: wordpress_posts, listing: full, raw_table: raw_nynjtc__nynjtc_trail_alerts, staged_by: hand}
          - {source_key: oprhp_trail_closures, club: nysparks, notice_type: closures, reader: arcgis_layer, listing: full, raw_table: raw_nysparks__oprhp_trail_closures, staged_by: hand}
          - {source_key: club_clean, club: a, notice_type: closures, reader: arcgis_layer, listing: full, raw_table: raw_a__club_clean, staged_by: stg_a__club_clean}
          - {source_key: club_leaking, club: a, notice_type: warnings, reader: page_notice, listing: full, raw_table: raw_a__club_leaking, staged_by: stg_a__club_leaking}
          - {source_key: club_outside, club: a, notice_type: closures, reader: arcgis_layer, listing: full, raw_table: raw_a__club_outside, staged_by: stg_a__club_outside}
      - input: ref('stg_registry__sources')
        rows:
          - {source_key: atc_trail_updates}
          - {source_key: nynjtc_trail_alerts}
          - {source_key: oprhp_trail_closures}
          - {source_key: club_clean}
          - {source_key: club_leaking}
          - {source_key: club_outside}
      - input: ref('int_closures__club_notices')
        format: sql
        rows: |
          select 'club_clean' as source_key, cast(1 as bigint) as key_versions
          union all
          select 'club_leaking', 1
          union all
          select 'club_leaking', 1
          union all
          select 'club_leaking', 1
          union all
          select 'club_outside', 1
          union all
          select 'club_outside', 1
      - input: ref('int_closures__notice_tables')
        format: sql
        rows: |
          select source_key, raw_table, true as is_present
          from (
            values
            ('club_clean', 'raw_a__club_clean'),
            ('club_leaking', 'raw_a__club_leaking'),
            ('club_outside', 'raw_a__club_outside')
          ) as tables (source_key, raw_table)
      # Two leaking values in one row count as one row, and the first row is
      # the least id.
      - input: ref('int_warnings__wording_leaks')
        rows:
          - {source_key: club_leaking, row_id: 'club_leaking:9', column_name: title}
          - {source_key: club_leaking, row_id: 'club_leaking:2', column_name: title}
          - {source_key: club_leaking, row_id: 'club_leaking:2', column_name: category}
      - input: ref('int_closures__rows_outside_region')
        rows:
          - {source_key: club_outside, row_id: 'club_outside:1', region: eastern}
          - {source_key: nws_alerts, row_id: 'nws_alerts:urn:x', region: us_and_territories}
    expect:
      rows:
        - {source_key: atc_trail_updates, passed: true, held_because: null}
        - {source_key: nynjtc_trail_alerts, passed: true, held_because: null}
        - {source_key: oprhp_trail_closures, passed: true, held_because: null}
        - {source_key: ourhike_closures, passed: true, held_because: null}
        - {source_key: ourhike_reports, passed: true, held_because: null}
        - {source_key: nws_alerts, passed: false, held_because: '1 nws_alerts row(s) reach outside the us_and_territories box its source publishes in, the first nws_alerts:urn:x: a lon/lat swap, or a source registered without its region (macros/lands_outside_its_region.sql), so none of its rows is published'}
        - {source_key: 'reference/work_projects.json', passed: true, held_because: null}
        - {source_key: club_clean, rows_total: 1, passed: true, held_because: null}
        - {source_key: club_leaking, rows_total: 3, passed: false, held_because: '2 club_leaking row(s) hold the source''s own wording in a published column, the first club_leaking:2, so none of its rows is published (int_warnings__wording_leaks names each)'}
        - {source_key: club_outside, rows_total: 2, passed: false, held_because: '1 club_outside row(s) reach outside the eastern box its source publishes in, the first club_outside:1: a lon/lat swap, or a source registered without its region (macros/lands_outside_its_region.sql), so none of its rows is published'}

  - name: int_closures__trail_closure_areas_keeps_each_obstructing_club_area_as_its_source_drew_it
    model: int_closures__trail_closure_areas
    description: >
      The areas: a club's obstructing polygon is kept as drawn, and
      so is an obstructing club notice of the warnings mart; a polygon that
      does not obstruct, ATC's own (its band draws it), a line closure,
      OurHike's own closure (no notice source) and an NWS alert are not
      areas to cut. A geometry that is a polygon and a line keeps its polygon
      alone, as a MultiPolygon, and one whose GeoJSON will not read is left
      out rather than stopping the build.
    given:
      - input: ref('closures', v=1)
        format: sql
        rows: |
          select
              closure_id,
              source_key,
              cast(obstructs_trail as boolean) as obstructs_trail,
              cast(geom_geojson as varchar) as geom_geojson
          from (values
              ('club_area:1', 'club_area', true, '{"type":"Polygon","coordinates":[[[-73.975,41.032],[-73.965,41.032],[-73.965,41.04],[-73.975,41.04],[-73.975,41.032]]]}'),
              ('club_area:2', 'club_area', false, '{"type":"Polygon","coordinates":[[[-73.975,41.032],[-73.965,41.032],[-73.965,41.04],[-73.975,41.04],[-73.975,41.032]]]}'),
              ('club_area:3', 'club_area', true, '{"type":"LineString","coordinates":[[-73.97,41.03],[-73.97,41.035]]}'),
              ('club_area:4', 'club_area', true, '{"type":"GeometryCollection","geometries":[{"type":"Polygon","coordinates":[[[-74.205,41.205],[-74.195,41.205],[-74.195,41.21],[-74.205,41.21],[-74.205,41.205]]]},{"type":"LineString","coordinates":[[-74.3,41.3],[-74.31,41.31]]}]}'),
              ('club_area:5', 'club_area', true, '{"type":"Polygon","coordinates":[[[-74.0,41.0],[1]]]}'),
              ('atc_trail_updates:bridge', 'atc_trail_updates', true, '{"type":"Polygon","coordinates":[[[-73.975,41.032],[-73.965,41.032],[-73.965,41.04],[-73.975,41.04],[-73.975,41.032]]]}'),
              ('ourhike_closures:c1', 'ourhike_closures', true, '{"type":"Polygon","coordinates":[[[-73.975,41.032],[-73.965,41.032],[-73.965,41.04],[-73.975,41.04],[-73.975,41.032]]]}')
          ) as closures (closure_id, source_key, obstructs_trail, geom_geojson)
      - input: ref('warnings', v=1)
        format: sql
        rows: |
          select
              warning_id,
              warning_kind,
              source_key,
              cast(obstructs_trail as boolean) as obstructs_trail,
              cast(geom_geojson as varchar) as geom_geojson
          from (values
              ('club_warning:7', 'org_notice', 'club_warning', true, '{"type":"Polygon","coordinates":[[[-112.1,40.5],[-112.0,40.5],[-112.0,40.6],[-112.1,40.5]]]}'),
              ('nws_alerts:x', 'nws_alert', 'nws_alerts', true, '{"type":"Polygon","coordinates":[[[-112.1,40.5],[-112.0,40.5],[-112.0,40.6],[-112.1,40.5]]]}')
          ) as warnings (warning_id, warning_kind, source_key, obstructs_trail, geom_geojson)
      - input: ref('notice_readers')
        rows:
          - {source_key: club_area, club: a, notice_type: closures, reader: arcgis_layer, listing: full, raw_table: raw_a__club_area, staged_by: stg_a__club_area, steward_kind: club}
          - {source_key: club_warning, club: b, notice_type: warnings, reader: arcgis_layer, listing: full, raw_table: raw_b__club_warning, staged_by: stg_b__club_warning, steward_kind: agency}
          - {source_key: atc_trail_updates, club: atc, notice_type: closures, reader: reviewed_file, listing: full, raw_table: raw_atc__atc_trail_updates, staged_by: hand, steward_kind: club}
    expect:
      rows:
        - {notice_id: 'club_area:1', source_key: club_area, area_geojson: '{"type":"Polygon","coordinates":[[[-73.975,41.032],[-73.965,41.032],[-73.965,41.04],[-73.975,41.04],[-73.975,41.032]]]}'}
        - {notice_id: 'club_area:4', source_key: club_area, area_geojson: '{"type":"MultiPolygon","coordinates":[[[[-74.205,41.205],[-74.195,41.205],[-74.195,41.21],[-74.205,41.21],[-74.205,41.205]]]]}'}
        - {notice_id: 'club_warning:7', source_key: club_warning, area_geojson: '{"type":"Polygon","coordinates":[[[-112.1,40.5],[-112.0,40.5],[-112.0,40.6],[-112.1,40.5]]]}'}

  - name: int_closures__area_trail_cuts_keeps_only_the_stretches_inside_each_area
    model: int_closures__area_trail_cuts
    description: >
      The cut, int_trail_lines__network_area_closures' rule: a line
      half inside an area keeps only its inside half; a line wholly inside is
      kept whole, after it in line id order; a line outside adds nothing, and
      one that only touches a corner is no walkable section. Each area with a
      stretch is one MultiLineString, a single stretch included. Decision
      191: an area no line runs inside is shaded, its own outline its
      `shade_geojson`, and so is one whose only stretch, under a metre long,
      does not outlast the phone's 5 decimal places.
    given:
      - input: ref('int_closures__trail_closure_areas')
        rows:
          - {notice_id: 'club_area:1', area_geojson: '{"type":"Polygon","coordinates":[[[-73.975,41.032],[-73.965,41.032],[-73.965,41.04],[-73.975,41.04],[-73.975,41.032]]]}'}
          - {notice_id: 'club_area:2', area_geojson: '{"type":"Polygon","coordinates":[[[-71.3,44.199],[-71.296,44.199],[-71.296,44.206],[-71.3,44.206],[-71.3,44.199]]]}'}
          - {notice_id: 'club_area:3', area_geojson: '{"type":"Polygon","coordinates":[[[-74.258,41.195],[-74.242,41.195],[-74.242,41.215],[-74.258,41.215],[-74.258,41.195]]]}'}
      - input: ref('stg_derived__closure_trail_lines')
        format: sql
        rows: |
          select
              line_id,
              st_geomfromtext(wkt) as geom
          from (values
              ('b_wholly_inside', 'LINESTRING (-73.968 41.033, -73.968 41.038)'),
              ('a_half_inside', 'LINESTRING (-73.97 41.03, -73.97 41.035)'),
              ('outside', 'LINESTRING (-73.98 41.03, -73.98 41.035)'),
              ('corner_only', 'LINESTRING (-73.98 41.035, -73.975 41.04)'),
              ('far_away', 'LINESTRING (-74.0 41.0, -74.0 41.005)'),
              ('too_short', 'LINESTRING (-74.25 41.205, -74.250001 41.205)')
          ) as lines (line_id, wkt)
    expect:
      rows:
        - {notice_id: 'club_area:1', stretches: 2, stretches_geojson: '{"type":"MultiLineString","coordinates":[[[-73.97,41.032],[-73.97,41.035]],[[-73.968,41.033],[-73.968,41.038]]]}', shade_geojson: null}
        - {notice_id: 'club_area:2', stretches: 0, stretches_geojson: null, shade_geojson: '{"type":"Polygon","coordinates":[[[-71.3,44.206],[-71.296,44.206],[-71.296,44.199],[-71.3,44.199],[-71.3,44.206]]]}'}
        - {notice_id: 'club_area:3', stretches: 0, stretches_geojson: null, shade_geojson: '{"type":"Polygon","coordinates":[[[-74.258,41.215],[-74.242,41.215],[-74.242,41.195],[-74.258,41.195],[-74.258,41.215]]]}'}

  - name: int_closures__area_trail_cuts_leaves_a_trail_along_the_edge_open
    model: int_closures__area_trail_cuts
    description: >
      Rule 6 ("Only inside closes"): a stretch closes only if
      it reaches more than `area_closure_edge_m` (2 m) in from the area's
      outline. A trail weaving across the south edge, as a line rounded to 5
      decimal places does against an area that is not, leaves pieces about a
      metre inside, and a trail following the west edge 0.8 m inside lies
      wholly in the band: neither is crossed out, and the trail crossing the
      area still is. An area whose only trail runs along its edge has no
      stretch, so it is shaded.
    given:
      - input: ref('int_closures__trail_closure_areas')
        rows:
          - {notice_id: 'club_area:1', area_geojson: '{"type":"Polygon","coordinates":[[[-73.975,41.032],[-73.965,41.032],[-73.965,41.04],[-73.975,41.04],[-73.975,41.032]]]}'}
          - {notice_id: 'club_area:2', area_geojson: '{"type":"Polygon","coordinates":[[[-71.3,44.199],[-71.296,44.199],[-71.296,44.206],[-71.3,44.206],[-71.3,44.199]]]}'}
      - input: ref('stg_derived__closure_trail_lines')
        format: sql
        rows: |
          select
              line_id,
              st_geomfromtext(wkt) as geom
          from (values
              ('across', 'LINESTRING (-73.97 41.03, -73.97 41.035)'),
              ('weaving_on_the_south_edge', 'LINESTRING (-73.974 41.03201, -73.972 41.03199, -73.97 41.03201, -73.968 41.03199, -73.966 41.03201)'),
              ('along_the_west_edge', 'LINESTRING (-73.97499 41.034, -73.97499 41.038)'),
              ('along_the_east_edge', 'LINESTRING (-71.29601 44.2, -71.29601 44.205)')
          ) as lines (line_id, wkt)
    expect:
      rows:
        - {notice_id: 'club_area:1', stretches: 1, stretches_geojson: '{"type":"MultiLineString","coordinates":[[[-73.97,41.032],[-73.97,41.035]]]}', shade_geojson: null}
        - {notice_id: 'club_area:2', stretches: 0, stretches_geojson: null, shade_geojson: '{"type":"Polygon","coordinates":[[[-71.3,44.206],[-71.296,44.206],[-71.296,44.199],[-71.3,44.199],[-71.3,44.206]]]}'}

  - name: int_closures__area_trail_cuts_keeps_a_lone_stretch_as_a_multilinestring_of_one
    model: int_closures__area_trail_cuts
    description: >
      One line crossing an area keeps its inside part, and the area's row is
      a MultiLineString holding that one stretch, so the phone reads one type
      for every area.
    given:
      - input: ref('int_closures__trail_closure_areas')
        rows:
          - {notice_id: 'club_area:1', area_geojson: '{"type":"Polygon","coordinates":[[[-74.205,41.205],[-74.195,41.205],[-74.195,41.21],[-74.205,41.21],[-74.205,41.205]]]}'}
      - input: ref('stg_derived__closure_trail_lines')
        format: sql
        rows: |
          select 'across' as line_id, st_geomfromtext('LINESTRING (-74.21 41.207, -74.19 41.207)') as geom
    expect:
      rows:
        - {notice_id: 'club_area:1', stretches: 1, stretches_geojson: '{"type":"MultiLineString","coordinates":[[[-74.205,41.207],[-74.195,41.207]]]}', shade_geojson: null}

  - name: int_closures__area_trail_cuts_crosses_out_the_at_like_any_trail
    model: int_closures__area_trail_cuts
    description: >
      Decision 192 ("Yes, like any trail"): the A.T.'s own line, from the
      release's trails.geojson, is cut inside a club's area as the nearby
      line beside it is, each its own stretch in line id order, so the
      phone crosses out the A.T. where it runs inside the area.
    given:
      - input: ref('int_closures__trail_closure_areas')
        rows:
          - {notice_id: 'club_area:1', area_geojson: '{"type":"Polygon","coordinates":[[[-73.975,41.032],[-73.965,41.032],[-73.965,41.04],[-73.975,41.04],[-73.975,41.032]]]}'}
      - input: ref('stg_derived__closure_trail_lines')
        format: sql
        rows: |
          select
              line_id,
              st_geomfromtext(wkt) as geom
          from (values
              ('fixture-nearby:across', 'LINESTRING (-73.97 41.03, -73.97 41.035)'),
              ('centerline:chain:0', 'LINESTRING (-73.967 41.028, -73.967 41.045)')
          ) as lines (line_id, wkt)
    expect:
      rows:
        - {notice_id: 'club_area:1', stretches: 2, stretches_geojson: '{"type":"MultiLineString","coordinates":[[[-73.967,41.032],[-73.967,41.04]],[[-73.97,41.032],[-73.97,41.035]]]}', shade_geojson: null}

  - name: int_closures__area_trail_cuts_has_no_row_in_an_hour_with_no_lines
    model: int_closures__area_trail_cuts
    description: >
      An hour whose step read no lines (step_closure_trail_lines' empty
      table): nothing says which areas have a trail inside, so no area is
      cut and none is shaded, and pub_conditions_trail_closures leaves every
      area closure out that hour rather than shade one whose trails would
      have been crossed out.
    given:
      - input: ref('int_closures__trail_closure_areas')
        rows:
          - {notice_id: 'club_area:1', area_geojson: '{"type":"Polygon","coordinates":[[[-73.975,41.032],[-73.965,41.032],[-73.965,41.04],[-73.975,41.04],[-73.975,41.032]]]}'}
          - {notice_id: 'club_area:2', area_geojson: '{"type":"Polygon","coordinates":[[[-71.3,44.199],[-71.296,44.199],[-71.296,44.206],[-71.3,44.206],[-71.3,44.199]]]}'}
      - input: ref('stg_derived__closure_trail_lines')
        format: sql
        rows: |
          select
              cast(null as varchar) as line_id,
              st_geomfromtext('LINESTRING (0 0, 1 1)') as geom
          where false
    expect:
      rows: []

  - name: int_closures__area_trail_cuts_shades_an_area_as_its_source_drew_it
    model: int_closures__area_trail_cuts
    description: >
      The shade, in an hour that read lines (one far away): an
      area with a hole keeps the hole, so the hatch never covers the open
      ground inside it; a vertex under 10 m off a straight edge is
      simplified away, and the rest stay where the source put them, at 5
      decimal places, never grown; an area under a metre across comes out
      empty and has no row. The rings come back in GEOS's own order, the
      outline clockwise from its north-west corner and each hole the other
      way, as every area of conditions/notices.json does; MapLibre's tiler
      rewinds every ring it draws (geojson-vt's rewind()), so the phone
      shades either. Its `area_geojson` is the area exactly as given, that
      vertex and the rings' own order kept: the outline
      pub_conditions_trail_closures measures, never the shade.
    given:
      - input: ref('int_closures__trail_closure_areas')
        rows:
          - {notice_id: 'club_area:holed', area_geojson: '{"type":"Polygon","coordinates":[[[-112.1,40.5],[-112.05,40.50001],[-112.0,40.5],[-112.0,40.6],[-112.1,40.6],[-112.1,40.5]],[[-112.06,40.54],[-112.04,40.54],[-112.04,40.56],[-112.06,40.56],[-112.06,40.54]]]}'}
          - {notice_id: 'club_area:speck', area_geojson: '{"type":"Polygon","coordinates":[[[-112.5,40.5],[-112.499999,40.5],[-112.499999,40.500001],[-112.5,40.500001],[-112.5,40.5]]]}'}
      - input: ref('stg_derived__closure_trail_lines')
        format: sql
        rows: |
          select 'far_away' as line_id, st_geomfromtext('LINESTRING (-120 45, -120 45.01)') as geom
    expect:
      rows:
        - {notice_id: 'club_area:holed', stretches: 0, stretches_geojson: null, shade_geojson: '{"type":"Polygon","coordinates":[[[-112.1,40.6],[-112.0,40.6],[-112.0,40.5],[-112.1,40.5],[-112.1,40.6]],[[-112.04,40.54],[-112.04,40.56],[-112.06,40.56],[-112.06,40.54],[-112.04,40.54]]]}', area_geojson: '{"type":"Polygon","coordinates":[[[-112.1,40.5],[-112.05,40.50001],[-112.0,40.5],[-112.0,40.6],[-112.1,40.6],[-112.1,40.5]],[[-112.06,40.54],[-112.04,40.54],[-112.04,40.56],[-112.06,40.56],[-112.06,40.54]]]}'}

exposures:
  - name: step_closure_trail_lines
    label: step_closure_trail_lines.py
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      The Python step that lands, of the release's trail lines (its nearby
      trail lines and the A.T.'s own) prepare_closure_trail_lines.py read
      once per release, those whose bounding box meets an area closure's,
      or the first alone when none does (pipeline/step_closure_trail_lines.py),
      between the dbt invocation that builds int_closures__trail_closure_areas
      and the one that reads its answer back as
      source('derived', 'closure_trail_lines'). A step rather than a source
      because the lines are this project's own release, read from a file the
      hourly job restores, and filtered by the areas so the hourly warehouse
      holds only the lines it may cut (the step's docstring has the
      measurement). The cut itself is SQL, int_closures__area_trail_cuts.
      Shown here so the docs draw both halves of the step.
    depends_on:
      - ref('int_closures__trail_closure_areas')
    config:
      meta:
        writes: derived.closure_trail_lines
        cadence: hourly
