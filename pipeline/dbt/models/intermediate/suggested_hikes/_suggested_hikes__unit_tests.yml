  - name: int_suggested_hikes__highlights_names_a_row_that_is_not_an_object
    description: >
      resolve() does not survive a row that is not an object (entry.get
      raises), and neither does the build: this row's problem is 'not an
      object', which the model's error test fails on.
    model: int_suggested_hikes__highlights
    given:
      - input: ref('base_ourhike__highlights')
        rows:
          # a bare string in the list
          - {file_row: 0, highlight: '"McAfee Knob"'}
      - input: ref('int_suggested_hikes__published_pois')
        rows:
          - {poi_id: 'park:1', mile: 705.6}
          - {poi_id: 'summit:1', mile: 709.1}
      - input: ref('int_suggested_hikes__club_stretches')
        rows: []
    expect:
      rows:
        - {file_row: 0, highlight_id: '<no id>', problem: 'not an object', legs_json: null, club: null, record_json: null}
  - name: int_suggested_hikes__records_writes_what_record_for_and_split_record_write
    description: >
      SH10 and SH11: export_suggested_hikes.py's record_for(), split by
      split_record() into the shelf record and the detail, as JSON text in
      their key order. Absent, never empty: no photo, climb, publication or
      trackReproduction key where there is none, and no hikerNote at all; the
      card's author is the registry's steward and the publication's the page's,
      two authors kept apart. From test_export_suggested_hikes.py's record
      cases; tests/test_dbt_suggested_hikes_parity.py runs record_for() over
      the same rows.
