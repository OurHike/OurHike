# Runs every Elementary check of the hourly conditions lane over the
# warehouse one publish-conditions.yml run built, after that run has
# published, and puts the lane's data-quality file in place. The
# maintainer, 2026-10-08: "All of them, hourly. build a different workflow
# that kicks off after the actual build".
#
# WHY A WORKFLOW OF ITS OWN. The lane's 1,053 checks take about 7.2 to 10.6
# minutes on a runner (build_marts.py's docstring, "THE HOURLY LANE'S CHECKS
# RUN APART", Reasoned from the sandbox's times), and the whole hourly build
# step has 10 minutes, of which the build took 244.6 s on a
# runner (Measured: publish-conditions.yml run 593's UA leg, 2026-10-08),
# leaving about 5.9. Run here, after the publish, they can neither delay
# what a hiker downloads nor turn it red.
#
# STARTED BY publish-conditions.yml, never by a schedule. Its `checks` job
# runs once its legs have built and published, and dispatches this file on
# the same ref, with the legs that ran as `data_environment` and itself as
# `build_run`, the command that does it again printed in its summary:
#
#   gh workflow run check-conditions.yml --ref main -f data_environment=both -f build_run=<run id>
#
# The inputs match the placeholder PR #1827 - Add dispatch-only
# build-reference.yml, purge-person-fields.yml and check-conditions.yml
# placeholders to main puts on main, since GitHub takes a workflow_dispatch
# only for a workflow file the default branch holds. A dispatch by hand
# works while that build is still the newest its leg handed off (below).
#
# ONE LEG PER DATA ENVIRONMENT, as publish-conditions.yml runs them: the
# production leg only from main and only while production's hourly leg
# takes the dbt path, the UA leg always. Each leg:
#   1. takes the warehouse its build handed off (pipeline/hand_off.py), from
#      the leg's history store in the private raw store,
#      history/conditions_<leg>/checks/, only when that build ran on the
#      commit this run checked out: a push since the build makes the
#      branch's newest commit another one, and that hour is not checked.
#      Not an Actions artifact: an artifact of a public repository is
#      anyone's to download, and the warehouse holds every raw table the
#      leg read (hand_off.py says why);
#   2. runs `build_marts.py --lane hourly --checks-only`: Elementary's history
#      restored alone, from the save the build just made; Elementary's own
#      tables with the checks' switch; every check the lane has; each
#      source's freshness, on publish-conditions.yml's own freshness step's
#      selection (how long since the extract last read each
#      source or confirmed it unchanged, against its own limits), recorded
#      on the page and never turning this run red, since that step is the
#      one that does; the lane's data-quality file, counting
#      the build's results, the checks' and the freshness; and Elementary's
#      history saved back, so the next hour's checks learn from this one;
#   3. puts conditions/data_quality.json in place under the leg's prefix
#      (`publish.py --sidecar`): the one object it writes, page data for
#      ourhike.org/data/quality/, in no manifest's artifacts. It writes no
#      phone file, no latest.json and no release folder, so nothing here can
#      change what a hiker downloads.
#
# ONE WRITER OF THAT FILE AN HOUR: this one. The hourly build writes no
# data-quality file (build_marts.py, "THE DATA-QUALITY FILE IS WRITTEN
# LAST"), so the file always counts a build and its checks. A build that
# handed off nothing leaves the bucket's last copy, whose `built_at` says
# how old it is.
#
# EACH LEG HOLDS A CONCURRENCY GROUP OF ITS OWN, conditions-checks-<leg>,
# which no publisher holds (.github/tests/test_publish_concurrency.py).
# GitHub keeps one pending run per group and cancels it for a newer one, so a
# group shared with a publisher lets a checks run cancel a queued publish
# with nothing red (#1513 - A queued publish is silently cancelled when
# another one joins publish-data, and it looks like a green build). That is
# why this is not publish-data, and why it is no longer the
# conditions-history-<leg> group publish-conditions.yml's legs held with it:
# a checks run dispatched while a leg waited there cancelled that hour's
# publish, and the bake held publish-data all the while it waited (review of
# PR #1805, finding 3). With no shared group the checks and the next hourly
# build can overlap on the leg's history store, and two things keep that
# safe. row_history.py's "TWO WRITERS, ONE POINTER": a checks run whose save
# would land over a later build's leaves its hour out of Elementary's
# history, and a build saves over a checks run's save; each says so in a
# warning and neither goes red. And hand_off.py's take answers a later
# build's put landing mid-download as nothing to check, exit 4, not as a torn
# upload. Inside the group, a third checks run of one leg arriving while one
# runs and one waits cancels the waiting one: that hour is not checked, and
# conditions/data_quality.json keeps its last copy, whose built_at says how
# old it is. A dispatch by hand is safe whenever it is made.
#
# BUILD PLUS CHECKS FITS THE HOUR. The caps add to 46 minutes: the publish
# job's 16, its `checks` job's 5 and this job's 25, against
# the 60 between two hourly runs, so even a run whose every job ran to its
# cap leaves 14 (Reasoned from the caps; .github/tests/test_check_conditions.py
# holds the sum). A usual hour takes about 17 to 25 of them and leaves about
# 35, Reasoned: the publish job's 6 to 11 minutes (the 39 soak dispatches
# from run 617 to 676 took 378 to 636 s, Measured 2026-10-15), half a
# minute to dispatch, and this job's checks step (8.5 to
# 12 minutes, its comment below) with about a minute of setup (run 585's)
# and the take. On the fixtures in a sandbox the build took 202.8 s and its
# checks run 362.8 s (Measured 2026-10-09; build_marts.py's docstring). This
# job's step summaries settle a runner's.
#
# AND BESIDE THE CHECKS, THE SIX CONDITIONS FILES AGAINST TODAY'S EXPORTERS
# (the maintainer, 2026-10-10: "Compare every soak hour"). Each leg's `parity` job takes the comparison
# bundle its build handed off beside the warehouse: the answers that hour's
# extract received from NWS and OurHike's Postgres, the ATC and NYNJTC rows
# the build read, its weather squares and its exit, and the six files its
# writers wrote and the build published (pipeline/hourly_parity.py says what
# each family compares on, and why three of them cannot be fed that hour's
# answers). It serves them to today's exporters and runs parity.py's six
# families with --keys-only; its summary and its hourly-parity-<leg>
# artifact give the answer family by family, with counts.
#
# HERE, NOT IN publish-conditions.yml, because every job of that file holds
# publish-data until its run ends: a comparison there would keep the next
# publisher queued longer each hour, and a queued publisher is what a third
# entrant cancels with nothing red (#1513 - A queued publish is silently
# cancelled when another one joins publish-data, and it looks like a green
# build). A JOB OF ITS OWN
# beside `check`, not a step of it, so the checks keep every minute of their
# 25, a difference and a failed check each go red under their own name, and
# its 10-minute cap, under `check`'s beside it, leaves the sum above as it
# is. It holds no concurrency group: two runs of one leg take two builds'
# bundles and write nothing they share, and a group would let a third run
# cancel a waiting one, an hour not compared.
#
# RED ONLY FOR A DIFFERENCE nothing explains, or a comparison that crashed.
# An hour not compared (its input was not that hour's, its build held a
# writer back, or no bundle of this build on this commit came, as after a
# push since the build or on the exporters path) is a warning with its
# reason, and gate_report.py --hourly-dir counts that hour as a hole in the
# soak, never a pass. The bundle holds records, OurHike's reports among
# them, so it moves only through the private history store; the artifact
# holds keys and changed fields, never a record or a person field's value.
name: Check the hourly conditions build

# The build each run checked, in the run list.
run-name: Check the hourly conditions build of run ${{ inputs.build_run }}

on:
  # Dispatch only: publish-conditions.yml's `checks` job starts it, after
  # every leg of that run has built and published.
  workflow_dispatch:
    inputs:
      data_environment:
        description: "Which legs' builds to check: both (production and UA; from main only) or ua alone"
        type: choice
        options: [both, ua]
        default: both
      build_run:
        description: "The publish-conditions.yml run whose build these checks read"
        type: string
        required: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  # Both off, in every step, as publish-conditions.yml sets them: dlt's
  # telemetry (the dlt skill) and dbt's (the dbt skill, "Telemetry
  # off is the only switch").
  RUNTIME__DLTHUB_TELEMETRY: "false"
  DBT_ENGINE_SEND_ANONYMOUS_USAGE_STATS: "false"
  # The maintainer, 2026-10-15, "Red if none in 2.5 h":
  # a leg whose history store holds no warehouse, or no comparison bundle, put
  # in this many hours goes red; one hour without one is a warning. It is
  # gate_report.py's SOAK_MAX_GAP_HOURS, the soak's allowed gap
  # (.github/tests/test_check_conditions.py holds them equal), and each take
  # step says how it reads.
  MAX_AGE_HOURS: "2.5"

jobs:
  check:
    name: Check (${{ matrix.data_environment }})
    runs-on: ubuntu-latest
    # The header's sum: 25 of the hour's 60, beside the build's 16 and the
    # dispatch's 5. The checks step's own cap is 20 of them.
    timeout-minutes: 25
    # The header's "EACH LEG HOLDS A CONCURRENCY GROUP OF ITS OWN": one that
    # no publisher holds, so no checks run can cancel a queued publish.
    concurrency:
      group: conditions-checks-${{ matrix.data_environment }}
      cancel-in-progress: false
    # publish-conditions.yml's two locks on its production leg, here too: the
    # matrix leaves production out unless the ref is main and the dispatch
    # did not ask for UA alone, and the first step after the build_run's
    # refuses it from any other ref with bash's case-sensitive `=`.
    strategy:
      fail-fast: false
      matrix:
        data_environment: ${{ fromJSON((github.ref == 'refs/heads/main' && inputs.data_environment != 'ua') && '["production", "ua"]' || '["ua"]') }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      # THE BUILD_RUN IS A DISPATCHER'S TEXT, read through env and never
      # pasted into a script (.github/tests/test_run_steps_take_inputs_through_env.py),
      # and refused first unless it is a run id: GitHub's are digits alone.
      - name: Refuse a build_run that is not a run id
        working-directory: .
        env:
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          if [[ ! "$BUILD_RUN" =~ ^[0-9]+$ ]]; then
            printf -v shown '%q' "$BUILD_RUN"
            echo "::error title=Not a run id::build_run $shown is not a publish-conditions.yml run id, which is digits alone; nothing was checked."
            exit 1
          fi
          echo "build_run $BUILD_RUN has the shape of a run id."

      - name: Refuse a production leg from any ref but main
        working-directory: .
        env:
          LEG: ${{ matrix.data_environment }}
          REF: ${{ github.ref }}
        run: |
          if [ "$LEG" = "production" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=Production leg refused::$REF is not refs/heads/main, and only main writes production's conditions/. Nothing was checked or published for production."
            exit 1
          fi

      - uses: actions/checkout@v7

      # Production's hourly leg hands off a warehouse only on the dbt path,
      # which its line in publish-conditions.yml chooses, read here by its
      # text as extract-notices.yml reads it: `exporters` skips this leg with
      # a notice, `dbt` runs it, and anything else stops the leg red rather
      # than guessing. The UA leg always runs.
      - name: Check the production leg only while production's hourly leg is on the dbt path
        id: wanted
        working-directory: .
        env:
          LEG: ${{ matrix.data_environment }}
        run: |
          if [ "$LEG" != "production" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read_from=.github/workflows/publish-conditions.yml
          production=$(sed -n -E 's/^  PRODUCTION_PHONE_FILES: (exporters|dbt)$/\1/p' "$read_from")
          case "$production" in
            dbt)
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            exporters)
              echo "::notice title=Production checks skipped::$read_from's PRODUCTION_PHONE_FILES is exporters, so production's hourly leg builds no warehouse to check. Changing that line to dbt, the cutover, runs this leg from then on."
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error title=Production's phone files not read::$read_from has no single line '  PRODUCTION_PHONE_FILES: exporters' or '  PRODUCTION_PHONE_FILES: dbt', so whether production's hourly leg built a warehouse is not known. Nothing was checked for production."
              exit 1
              ;;
          esac

      # 3.12 for dbt and the extract, whose pins were compiled on it, as
      # publish-conditions.yml's dbt path sets them up; 3.14 after it for
      # build_marts.py and publish.py on requirements.txt.
      - uses: actions/setup-python@v7
        if: steps.wanted.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements-dbt.txt
            pipeline/requirements-extract.txt

      - uses: actions/setup-python@v7
        if: steps.wanted.outputs.run == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        if: steps.wanted.outputs.run == 'true'
        timeout-minutes: 3
        run: pip install -r requirements.txt

      - name: Name every secret this leg needs, and stop if one is missing
        if: steps.wanted.outputs.run == 'true'
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          R2_RAW_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          R2_RAW_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=()
          for name in R2_ENDPOINT_URL R2_RAW_BUCKET R2_RAW_ACCESS_KEY_ID R2_RAW_SECRET_ACCESS_KEY R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Secrets missing::${missing[*]} not set; nothing was checked."
            exit 1
          fi

      # publish-conditions.yml's dbt path restores both, under its keys, and
      # pipeline-tests.yml's dbt job explains them.
      - name: Restore dbt's DuckDB driver and v2's spatial extension
        id: dbt-runtime
        if: steps.wanted.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/com.getdbt/adbc
            ~/.duckdb/extensions/v1.5.4
          key: dbt-v2-runtime-${{ runner.os }}-${{ hashFiles('pipeline/requirements-dbt.txt') }}

      - name: Restore dbt's packages
        id: dbt-packages
        if: steps.wanted.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: pipeline/dbt/dbt_packages
          key: dbt-packages-${{ runner.os }}-${{ hashFiles('pipeline/dbt/packages.yml', 'pipeline/dbt/package-lock.yml') }}

      - name: Install the extract's and dbt's own pins
        if: steps.wanted.outputs.run == 'true'
        timeout-minutes: 4
        run: |
          python3.12 -m venv "$RUNNER_TEMP/extract"
          "$RUNNER_TEMP/extract/bin/pip" install --quiet --require-hashes -r requirements-extract.txt
          python3.12 -m venv "$RUNNER_TEMP/dbt"
          "$RUNNER_TEMP/dbt/bin/pip" install --quiet --require-hashes -r requirements-dbt-build.txt
          "$RUNNER_TEMP/dbt/bin/pip" install --quiet --require-hashes --no-build-isolation -r requirements-dbt.txt

      # The generators' output is never committed, and the
      # checks parse the project as the build did.
      - name: Generate the dbt models
        if: steps.wanted.outputs.run == 'true'
        timeout-minutes: 2
        run: '"$RUNNER_TEMP/extract/bin/python" generate_dbt.py'

      - name: dbt deps
        id: deps
        if: steps.wanted.outputs.run == 'true' && steps.dbt-packages.outputs.cache-hit != 'true'
        timeout-minutes: 2
        working-directory: pipeline/dbt
        run: '"$RUNNER_TEMP/dbt/bin/dbt" deps --profiles-dir .'

      # The packages' own files, hash-pinned: pipeline-tests.yml's
      # dbt job says why. Checked on a hit too, and before the save.
      - name: Check dbt's packages against their pinned hashes
        id: packages-pinned
        if: steps.wanted.outputs.run == 'true'
        run: python3 check_dbt_packages.py

      - name: Save dbt's packages
        if: always() && steps.deps.outcome == 'success' && steps.packages-pinned.outcome == 'success' && hashFiles('pipeline/dbt/packages.yml', 'pipeline/dbt/package-lock.yml') != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: pipeline/dbt/dbt_packages
          key: dbt-packages-${{ runner.os }}-${{ hashFiles('pipeline/dbt/packages.yml', 'pipeline/dbt/package-lock.yml') }}

      # hand_off.py's exit 4 is "nothing at the store is this run's": a
      # build that took the exporters path, failed before its hand-off, was
      # replaced by a later build's, or ran on another commit than this
      # checkout, which a push since the build makes the branch's newest
      # (hand_off.py, "THE CHECKS RUN THE BUILD'S OWN COMMIT, OR NONE").
      # Said, and the leg ends green with nothing checked; a store that
      # cannot be read, or a torn upload, is red.
      #
      # AND RED WHEN THE STORE HAS HAD NO WAREHOUSE FOR MAX_AGE_HOURS
      # (the maintainer, 2026-10-15, "Red if none in 2.5 h"): hand_off.py then exits 5 in place of 4, which ends the leg
      # here, red. One hour without one stays the warning above; this many
      # in a row is a soak that checks nothing, and its routine reads only
      # red or green (hand_off.py, "ONE HOUR WITHOUT ONE IS A WARNING, NONE IN
      # 2.5 HOURS IS RED", which says why that is the third such hour in a
      # row). MAX_AGE_HOURS is the workflow's, at the top of this file.
      #
      # Three minutes: checks runs 55 and 56 took 3,020,959,744 and
      # 3,055,300,608 bytes back in 37.33 s and 39.03 s, R2 and unpacking
      # together (Measured 2026-10-15, their logs).
      - name: Take the warehouse this leg's build handed off
        id: take
        if: steps.wanted.outputs.run == 'true'
        timeout-minutes: 3
        env:
          ENVIRONMENT: ${{ matrix.data_environment }}
          BUILD_RUN: ${{ inputs.build_run }}
          COMMIT: ${{ github.sha }}
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: auto
        run: |
          set +e
          "$RUNNER_TEMP/extract/bin/python" hand_off.py take --url "s3://$R2_RAW_BUCKET/history/conditions_$ENVIRONMENT" \
            --warehouse data/warehouse.duckdb --run "$BUILD_RUN" --commit "$COMMIT" --max-age-hours "$MAX_AGE_HOURS"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "taken=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 4 ]; then
            echo "::warning title=Nothing to check::build_run $BUILD_RUN left no warehouse in the $ENVIRONMENT leg's store for this checkout, so nothing was checked and conditions/data_quality.json keeps its last copy. Its build took the exporters path, failed before its hand-off, a later build's replaced it, or it ran on another commit than this one; hand_off.py's line above says which."
            echo "taken=false" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      # The checks run (build_marts.py's docstring, "THE HOURLY LANE'S CHECKS
      # RUN APART"), against the store the build restored from and saved to,
      # whose name the warehouse's build record must match. `degrade` as the
      # build's: a failure of Elementary's history still writes the file,
      # exit 5, and the last step turns the run red. Any other exit stops the
      # leg red before the publish: 1 when the file was not written.
      #
      # TWENTY MINUTES, Reasoned: the checks' 7.2 to 10.6 minutes on a
      # runner; Elementary's own tables with the checks' switch, about 58 s
      # (run 593's 31.8 s without it, times the 86 s against 47 s the
      # sandbox measured with and without it); the data-quality pass, 13.8 s
      # in run 593; and Elementary's history, restored in 1.45 s there and
      # saved in a few: 8.5 to 12 minutes in all. The sources' freshness
      # adds about what publish-conditions.yml's own freshness step takes, 11
      # s for 267 sources in a sandbox (its comment), and its end-of-run hook
      # writing one row a source; dropping the 597 learned
      # freshness checks took more than that away (0.32 to 0.35 s of CPU a
      # check, build_marts.py's docstring). The step's summary line settles
      # it. A source past its error limit never fails this step:
      # build_marts.py records the freshness run's exit and goes on.
      - name: Run every check of the hourly lane, and write the data-quality file
        id: checks
        if: steps.take.outputs.taken == 'true'
        timeout-minutes: 20
        env:
          ENVIRONMENT: ${{ matrix.data_environment }}
          # The environment switch, as the build read it (publish-conditions.yml):
          # each check's error is on this run's summary and the page, never its
          # exit, and the project renders as the build's did.
          OURHIKE_DATA_ENV: ${{ matrix.data_environment }}
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: auto
        run: |
          started=$SECONDS
          set +e
          python build_marts.py --lane hourly --checks-only --dbt "$RUNNER_TEMP/dbt/bin/dbt" \
            --history-url "s3://$R2_RAW_BUCKET/history/conditions_$ENVIRONMENT" \
            --history-python "$RUNNER_TEMP/extract/bin/python" --history-on-failure degrade
          status=$?
          set -e
          printf -- '- build_marts.py --lane hourly --checks-only (%s): %s s, exit %s\n\n' "$ENVIRONMENT" "$((SECONDS - started))" "$status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 5 ]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      # The one object this workflow writes: conditions/data_quality.json
      # under this leg's prefix, as publish() puts a sidecar, and nothing
      # else (publish.py's publish_sidecar() refuses any other key). No
      # publish-data, for the header's reason.
      - name: Put conditions/data_quality.json in place
        if: steps.checks.outcome == 'success'
        timeout-minutes: 2
        env:
          R2_WRITE_ENABLED: "true"
          OURHIKE_DATA_ENV: ${{ matrix.data_environment }}
          OURHIKE_PHONE_FILES: dbt
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python publish.py --sidecar conditions/data_quality.json

      # Last, after the file is in place: Elementary's history was not
      # restored or not saved (row_history.py's ::error above says which), so
      # this hour's checks saw no earlier build or join no later one's.
      - name: Fail the run if Elementary's history was held back
        if: steps.checks.outputs.partial == 'true'
        run: |
          echo "::error title=Elementary's history held back::The checks ran and conditions/data_quality.json was published, but Elementary's history was not restored or not saved; the checks step's log says which and why. Fix the store before the next hour."
          exit 1

      - name: Save dbt's DuckDB driver and v2's spatial extension
        if: always() && steps.wanted.outputs.run == 'true' && steps.dbt-runtime.outputs.cache-hit != 'true' && hashFiles('pipeline/requirements-dbt.txt') != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/com.getdbt/adbc
            ~/.duckdb/extensions/v1.5.4
          key: dbt-v2-runtime-${{ runner.os }}-${{ hashFiles('pipeline/requirements-dbt.txt') }}

  # The header's "AND BESIDE THE CHECKS": the six conditions files against
  # today's exporters, on the answers this leg's build read.
  parity:
    name: Compare with today's exporters (${{ matrix.data_environment }})
    runs-on: ubuntu-latest
    # The steps' caps, 3 + 2 + 3 minutes, and about a minute of checkout,
    # two Pythons and the upload, under `check`'s 25 beside it, so the
    # header's sum stands. On the fixtures the comparison took 3.4 s in a
    # shared sandbox, and 6.3 s at a load average of 46 on its 4 cores
    # (Measured 2026-10-10); a runner's, on real volumes, is @unvalidated
    # until this job's summary gives it.
    timeout-minutes: 10
    # `check`'s legs, by its rule and its two locks (held equal by
    # .github/tests/test_hourly_parity_job.py).
    strategy:
      fail-fast: false
      matrix:
        data_environment: ${{ fromJSON((github.ref == 'refs/heads/main' && inputs.data_environment != 'ua') && '["production", "ua"]' || '["ua"]') }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      # `check`'s first four steps, word for word (the same test holds them
      # so): the build_run refused unless it is a run id, the production leg
      # refused from any ref but main, and run only while production's
      # hourly leg is on the dbt path.
      - name: Refuse a build_run that is not a run id
        working-directory: .
        env:
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          if [[ ! "$BUILD_RUN" =~ ^[0-9]+$ ]]; then
            printf -v shown '%q' "$BUILD_RUN"
            echo "::error title=Not a run id::build_run $shown is not a publish-conditions.yml run id, which is digits alone; nothing was checked."
            exit 1
          fi
          echo "build_run $BUILD_RUN has the shape of a run id."

      - name: Refuse a production leg from any ref but main
        working-directory: .
        env:
          LEG: ${{ matrix.data_environment }}
          REF: ${{ github.ref }}
        run: |
          if [ "$LEG" = "production" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=Production leg refused::$REF is not refs/heads/main, and only main writes production's conditions/. Nothing was checked or published for production."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check the production leg only while production's hourly leg is on the dbt path
        id: wanted
        working-directory: .
        env:
          LEG: ${{ matrix.data_environment }}
        run: |
          if [ "$LEG" != "production" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read_from=.github/workflows/publish-conditions.yml
          production=$(sed -n -E 's/^  PRODUCTION_PHONE_FILES: (exporters|dbt)$/\1/p' "$read_from")
          case "$production" in
            dbt)
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            exporters)
              echo "::notice title=Production checks skipped::$read_from's PRODUCTION_PHONE_FILES is exporters, so production's hourly leg builds no warehouse to check. Changing that line to dbt, the cutover, runs this leg from then on."
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error title=Production's phone files not read::$read_from has no single line '  PRODUCTION_PHONE_FILES: exporters' or '  PRODUCTION_PHONE_FILES: dbt', so whether production's hourly leg built a warehouse is not known. Nothing was checked for production."
              exit 1
              ;;
          esac

      # 3.12 for the extract's venv: hand_off.py's take-bundle reads the
      # private store through s3fs, and the closures and reports old sides
      # import dlt, so pipeline-tests.yml's parity step runs those two on the
      # extract's venv too. 3.14 for parity.py and the other old sides, on
      # the pipeline's own pins.
      - uses: actions/setup-python@v7
        if: steps.wanted.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-extract.txt

      - uses: actions/setup-python@v7
        if: steps.wanted.outputs.run == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      # Soak run 624 installed requirements.txt in 10 s, and the extract's
      # and dbt's pins together in 21 s, both from the pip cache (Measured,
      # its step times, 2026-10-10); three minutes only bounds a download
      # that hangs.
      - name: Install the pipeline's and the extract's pins
        if: steps.wanted.outputs.run == 'true'
        timeout-minutes: 3
        run: |
          pip install -r requirements.txt
          python3.12 -m venv "$RUNNER_TEMP/extract"
          "$RUNNER_TEMP/extract/bin/pip" install --quiet --require-hashes -r requirements-extract.txt

      # This build's bundle and no other, as `check` takes its warehouse:
      # hand_off.py's take-bundle finds nothing for another run's or another
      # commit's (exit 4), as after a push since the build or on the
      # exporters path, and says which. Any failure here, a store that
      # cannot be read or this step's cap included, costs this hour its
      # comparison and nothing else: the compare step, which runs after a
      # failed take too, then says every family was not compared, and goes
      # red only for a difference. Except exit 5: the store has had no
      # bundle for MAX_AGE_HOURS, or holds none (the
      # maintainer, 2026-10-15, "Red if none in 2.5 h"), which the
      # last step turns red once this hour's comparison, every file not
      # compared, has been written and uploaded. MAX_AGE_HOURS is the
      # workflow's, at the top of this file.
      - name: Take the comparison bundle this leg's build handed off
        id: take
        if: steps.wanted.outputs.run == 'true'
        timeout-minutes: 2
        env:
          ENVIRONMENT: ${{ matrix.data_environment }}
          BUILD_RUN: ${{ inputs.build_run }}
          COMMIT: ${{ github.sha }}
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: auto
        run: |
          set +e
          "$RUNNER_TEMP/extract/bin/python" hand_off.py take-bundle --url "s3://$R2_RAW_BUCKET/history/conditions_$ENVIRONMENT" \
            --out data/hourly_parity/bundle --run "$BUILD_RUN" --commit "$COMMIT" --max-age-hours "$MAX_AGE_HOURS"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "taken=true" >> "$GITHUB_OUTPUT"
          else
            echo "taken=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$status" -eq 5 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # parity.py per family, --keys-only, on the bundle (hourly_parity.py
      # compare): exit 1 for a difference nothing explains or a comparison
      # that crashed, 0 otherwise, a family not compared included. Three
      # minutes, @unvalidated: on the fixtures the six took 3.4 s together,
      # 0.1 to 0.9 s each, most of it Python starting (Measured 2026-10-10 in
      # a shared sandbox); the summary's seconds column gives a runner's.
      #
      # EVERY HOUR WHOSE COMPARISON BEGINS LEAVES A run.json, so the gate can
      # tell it from an hour that never ran. `!cancelled()`: a bare `if:` carries an
      # implicit success(), so a take its cap stopped skipped
      # this step and the hour left nothing, which gate_report.py read as a
      # run that never came and the soak's 2.5-hour gap absorbed; now this
      # step runs, finds TAKEN empty, and says every family was not compared.
      # And hourly_parity.py writes run.json before its first family and
      # after each, so this step's own cap or a crash leaves the family it
      # was comparing `failed` and the rest not compared, which the upload
      # below keeps on a failure as on a success.
      - name: Compare the six conditions files with today's exporters
        id: compare
        if: ${{ !cancelled() && steps.wanted.outputs.run == 'true' }}
        timeout-minutes: 3
        env:
          LEG: ${{ matrix.data_environment }}
          BUILD_RUN: ${{ inputs.build_run }}
          COMMIT: ${{ github.sha }}
          TAKEN: ${{ steps.take.outputs.taken }}
        run: |
          missing=()
          if [ "$TAKEN" != "true" ]; then
            missing=(--missing "no bundle of build run $BUILD_RUN on this commit could be taken from the leg's history store; the take step's line says why")
          fi
          python hourly_parity.py compare --bundle data/hourly_parity/bundle --out data/hourly_parity/result \
            --summary "$GITHUB_STEP_SUMMARY" --extract-python "$RUNNER_TEMP/extract/bin/python" \
            --run "$BUILD_RUN" --commit "$COMMIT" --leg "$LEG" --compared-in "$GITHUB_RUN_ID" "${missing[@]}"

      # Keys and changed fields only, never a record (the header): what
      # gate_report.py --hourly-dir reads, one artifact per leg per run.
      # `overwrite`, so a re-run's attempt replaces the result it re-ran.
      - name: Upload this hour's comparison, keys and changed fields only
        if: ${{ !cancelled() && steps.wanted.outputs.run == 'true' && (steps.compare.outcome == 'success' || steps.compare.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: hourly-parity-${{ matrix.data_environment }}
          path: pipeline/data/hourly_parity/result/
          retention-days: 90
          if-no-files-found: error
          overwrite: true

      # Red, last, when the take found the store with no bundle
      # for MAX_AGE_HOURS, so the hour's not-compared result is written and
      # uploaded first and the soak's routine, which reads only red or green,
      # sees an hourly comparison that has stopped comparing.
      - name: Fail the comparison when no bundle has reached the store for MAX_AGE_HOURS
        if: ${{ !cancelled() && steps.wanted.outputs.run == 'true' && steps.take.outputs.stale == 'true' }}
        working-directory: .
        env:
          LEG: ${{ matrix.data_environment }}
        run: |
          echo "::error title=No comparison bundle in the store for over ${MAX_AGE_HOURS} h::The $LEG leg's history store holds no comparison bundle put in the last ${MAX_AGE_HOURS} hours (the take step's line says when the newest was put), so this hour, like those before it, compared nothing. This run is red so the soak shows it."
          exit 1
