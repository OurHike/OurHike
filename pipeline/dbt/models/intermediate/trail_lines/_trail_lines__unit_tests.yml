  - name: int_trail_lines__at_side_trails_hold_only_the_spurs_trails_geojson_draws
    description: >
      spurs.json is written from the side trails trails.geojson draws, so a
      spur with no drawn line (no geometry, or past the corridor) has no row
      here and no record in the file, where export_spurs.py writes every spur
      build_spur_records() returns. The phone reads `spurs[line.id]` for a line
      it drew (client/src/lib/lineDetail.ts), so that record could never be
      read. Keyed in trail_segment_key.
    model: int_trail_lines__at_side_trails
    given:
      - input: ref('int_trail_lines__at_simplified')
        rows:
          - {trail_segment_key: "sql::a_spur_trails_geojson_draws_keeps_its_record", trail_line_id: "side_trails:drawn", source_key: "side_trails", source_order: 4, source_row: 0, geom_wkt: "LINESTRING (-74.0 41.0, -74.0 41.003)"}
          - {trail_segment_key: "sql::a_side_trail_is_not_a_spur", trail_line_id: "side_trails:plain", source_key: "side_trails", source_order: 4, source_row: 2, geom_wkt: "LINESTRING (-74.0 41.0, -74.0 41.003)"}
      - input: ref('int_trail_lines__spurs')
        rows:
          - {trail_segment_key: "sql::a_spur_trails_geojson_draws_keeps_its_record", trail_line_id: "side_trails:drawn", type_code: "3", is_spur: true, length_ft: 385.0, junction_mile: 12.345, spur_record_json: "{\"destination_distance_m\":null,\"destination_poi_id\":null,\"junction_mile\":12.345,\"length_ft\":385.0,\"name\":\"Spur Trail\"}"}
          - {trail_segment_key: "sql::a_spur_with_no_drawn_line_writes_no_record", trail_line_id: "side_trails:undrawn", type_code: "3", is_spur: true, length_ft: 385.0, spur_record_json: "{\"destination_distance_m\":null,\"destination_poi_id\":null,\"junction_mile\":null,\"length_ft\":385.0,\"name\":\"Spur Trail\"}"}
          - {trail_segment_key: "sql::a_side_trail_is_not_a_spur", trail_line_id: "side_trails:plain", type_code: "0", is_spur: false, length_ft: 900.0}
    expect:
      rows:
        - {trail_segment_key: "sql::a_side_trail_is_not_a_spur", trail_line_id: "side_trails:plain", is_spur: false, spur_length_ft: null, spur_junction_mile: null, spur_record_json: null}
        - {trail_segment_key: "sql::a_spur_trails_geojson_draws_keeps_its_record", trail_line_id: "side_trails:drawn", is_spur: true, spur_length_ft: 385.0, spur_junction_mile: 12.345, spur_record_json: "{\"destination_distance_m\":null,\"destination_poi_id\":null,\"junction_mile\":12.345,\"length_ft\":385.0,\"name\":\"Spur Trail\"}"}

