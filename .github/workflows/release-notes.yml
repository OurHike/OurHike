# Generates a release notes draft and opens it as a pull request. RELEASING.md
# §7 is the design.
#
# The notes are DERIVED and then edited, never maintained. What makes that
# reliable here is a rule this repository already enforces for other reasons:
# `pr-issue-link.yml` fails any pull request that closes no issue, so every
# merged change between two tags carries a linked issue or an explicit
# `no-issue` label. That is a machine-readable changelog nobody had to remember
# to keep.
#
# What this produces is a draft with TODOs in it. The name, the historical figure
# and the paragraph that makes it a release rather than a diff are written by a
# human on top of it - that is the part worth a person's time, and the only part.
#
# This does not tag anything and does not release anything. It opens a pull
# request. Tagging is the maintainer's action (RELEASING.md §12), and the tag is
# what deploys production (pages.yml).

name: Draft release notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version being released, e.g. v1.2.0'
        required: true
      name:
        description: "Its landmark name, e.g. 'Fontana Dam' - RELEASING.md §5 has the order"
        required: true
      previous:
        description: 'The previous tag. Defaults to the most recent one.'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, and the tags with it: the generator walks
      # `<previous>..HEAD` and picks the previous tag itself when not told one,
      # so a shallow clone would silently produce notes covering one commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # What "already released" means for a workflow that only drafts notes is
      # that ITS OWN PRODUCT exists - re-drafting committed notes would fork
      # the record. It used to refuse on the TAG existing instead, with a
      # message about moving tags, which this workflow cannot do ("this does
      # not tag anything"). That refusal blocked the one recovery it exists
      # for: #860's incident, a tag pushed with no notes beside it, where
      # dispatching this workflow IS the prescribed remediation (#905).
      - name: Check the version has not already been released
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            v*.*.*) ;;
            *) echo "::error::'$VERSION' is not vMAJOR.MINOR.PATCH - see RELEASING.md §4."; exit 1 ;;
          esac
          shopt -s nullglob
          notes=(releases/"$VERSION"-*.md)
          if [ ${#notes[@]} -gt 0 ]; then
            echo "::error::$VERSION already has its notes (${notes[0]}). Re-drafting would fork the record - edit that file instead."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::warning::$VERSION is already tagged and has no notes - the #860 recovery case. The draft will describe exactly what the tag contains; nothing here moves the tag."
          fi

      - name: Generate the notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Through env, as the validation step above already models (#660):
          # dispatch inputs are free text, and `--name "${{ inputs.name }}"`
          # hands whatever it holds straight to bash.
          VERSION: ${{ inputs.version }}
          RELEASE_NAME: ${{ inputs.name }}
          PREVIOUS: ${{ inputs.previous }}
        run: |
          python .github/scripts/release_notes.py \
            --version "$VERSION" \
            --name "$RELEASE_NAME" \
            ${PREVIOUS:+--previous "$PREVIOUS"}

      # Both real dispatches (v1.3.0, v1.4.0) pushed this branch fine and then
      # went red on the POST below with a 403 - #1501. The push is this
      # step's real work and it always lands; opening the pull request is a
      # dashboard-gated nicety on top of it ("Allow GitHub Actions to create
      # and approve pull requests", unconfirmed - #1501 has the detail). So
      # the POST is no longer allowed to fail the job: its status is read by
      # hand instead of via `curl -f`, and a non-2xx falls back to printing
      # the branch's compare URL rather than coloring the run red for work
      # that already happened.
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          branch="release/$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add releases/
          git commit -m "Draft the $VERSION notes"
          git push -u origin "$branch"

          # The body is a file rather than a heredoc here: a heredoc terminator
          # cannot be indented, and every line of this script is inside an
          # indented YAML block. It is also prose, which is easier to edit in a
          # markdown file than inside a shell string.
          #
          # No `-f`: a refused POST must not exit non-zero here, or the status
          # below never gets read. `-w '\n%{http_code}'` appends the code as
          # its own trailing line, which `${response##*$'\n'}` /
          # `${response%$'\n'*}` split back apart below - safe even though the
          # response body is itself pretty-printed, multi-line JSON, since
          # both only look at the *last* newline in the string.
          request="$(jq -n \
            --arg title "Release notes: $VERSION — $NAME" \
            --arg head "$branch" \
            --rawfile body .github/scripts/release_pr_body.md \
            '{title: $title, head: $head, base: "main", body: $body, draft: true}')"
          response="$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pulls" -d "$request")"
          status="${response##*$'\n'}"
          payload="${response%$'\n'*}"

          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            number="$(jq -r '.number' <<<"$payload")"

            # Without this the pull request fails "PR has a linked issue",
            # which is correct of that check and wrong for this pull request
            # - so the label goes on in the same breath as the opening
            # rather than being left for somebody to discover from a red
            # check.
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$number/labels" \
              -d '{"labels":["no-issue"]}' > /dev/null

            {
              echo "### Notes drafted"
              echo
              echo "https://github.com/$REPO/pull/$number"
              echo
              echo "Edit the TODOs, merge, then tag \`$VERSION\` when the §8 gate is green."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Opening the pull request failed (HTTP $status). The branch pushed correctly; see the job summary for how to open it by hand."

            {
              echo "### Notes pushed, pull request not opened"
              echo
              echo "\`$branch\` is on \`$REPO\` with the drafted notes, but opening its pull request failed: the API answered HTTP $status. This is the #1501 failure mode - most likely \"Allow GitHub Actions to create and approve pull requests\" is off for this repository or organization."
              echo
              echo "https://github.com/$REPO/compare/main...$branch?expand=1"
              echo
              echo "Open that link to file the pull request by hand, add the \`no-issue\` label, then edit the TODOs, merge, and tag \`$VERSION\` when the §8 gate is green."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
