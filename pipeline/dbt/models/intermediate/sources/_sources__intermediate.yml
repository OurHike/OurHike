          - {restriction: 'no_reuse', pattern: '\bno part of\b[^.]*\bmay be (copied|reproduced)\b[^.]*', written_for: 'tpwd_davis_mountains_alerts', why: 'TPWD''s, IN.gov''s and WTA''s "No part of ... may be copied" or "reproduced" (decision 55)'}
