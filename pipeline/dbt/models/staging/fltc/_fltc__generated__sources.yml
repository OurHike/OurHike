# GENERATED by pipeline/make_dbt_staging.py from sources.json
# and the extract's club folders; edit them or it, never this file.
version: 2

sources:
  - name: fltc
    description: >
      The layers sources.json registers for the extract's fltc/ folder
      (pipeline/extract/fltc/) that pipeline/make_dbt_staging.py stages, landed as
      raw_fltc__<key> and staged once each by a generated base model here. Descriptions
      transcribed from sources.json's titles and key notes.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      meta:
        cadence: monthly
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_fltc__fltc_flt_main
        data_tests:
          # Rows sharing base_fltc__fltc_flt_main's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'fltc_flt_main'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
        description: >
          Finger Lakes Trail: thru trails, loops and spurs (FLTC) (sources.json
          `fltc_flt_main`). Key: the geometry (every vertex at 6 decimal places): 225 of
          225, and no attribute column is unique (measured 2026-10-03 over every row).
      - name: raw_fltc__fltc_map_sheet_index
        data_tests:
          # Rows sharing base_fltc__fltc_map_sheet_index's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'fltc_map_sheet_index'", "mapname"]
        description: >
          FLT Index Rectangles (map-sheet areas) (sources.json `fltc_map_sheet_index`).
          Key: `MapName` is unique and non-null on all 54 rows read 2026-10-03.
      - name: raw_fltc__fltc_non_flt_trails
        data_tests:
          # Rows sharing base_fltc__fltc_non_flt_trails's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'fltc_non_flt_trails'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
        description: >
          Non-FLT trails near the Finger Lakes Trail (FLTC) (sources.json
          `fltc_non_flt_trails`). Key: the geometry (every vertex at 6 decimal places):
          215 of 215, and no attribute column is unique (measured 2026-10-03 over every
          row).
      - name: raw_fltc__fltc_waypoints
        data_tests:
          # Rows sharing base_fltc__fltc_waypoints's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'fltc_waypoints'", "category", "mapname", "name"]
        description: >
          Finger Lakes Trail waypoints (FLTC's own layer) (sources.json `fltc_waypoints`).
          Key: (Category, MapName, Name): 1,789 of 1,789 (measured 2026-10-04 by reading
          every row and every vertex as the extract reads the layer (f=geojson, outSR
          4326), under lib/user_agent.py's USER_AGENT, robots.txt first). (Name, MapName),
          the pair the row's notes give as the natural key, is 1,788 on this read: one
          name repeats on one map sheet, in two categories. `ViewLink` is unique alone but
          is the object id in a URL (' https://fltmap.cc/waypoints/1004' on OBJECTID
          1004), which a reload would mint again; the geometry alone is 1,729 distinct
          (113 rows share a point).
