<!doctype html>
<html lang="en">
  <!-- Where Spotify sends a hiker back after "Connect Spotify" (#1683). Its
       own page rather than the app's, because the app reads `?error=` and
       `?code=` on its own URL as its own sign-in (src/lib/spotify.ts says
       why). Finishes the round trip, says whether the episode was saved, and
       links back. No map, no tab bar, no service worker of its own. -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>OurHike — Spotify</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f3e9;
        --fg: #2b2620;
        --fg-2: #5a5346;
        --brand: #355c3a;
        --on-brand: #fffdf7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171a15;
          --fg: #f2eee3;
          --fg-2: #cfc8b6;
          --brand: #96b98c;
          --on-brand: #122016;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 28rem;
        margin: 0 auto;
        padding: 3rem 1.25rem;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 1.5rem;
        line-height: 1.25;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--fg-2);
        margin: 0 0 1.5rem;
      }
      a {
        display: inline-block;
        margin: 0 0.5rem 0.75rem 0;
        padding: 0.7rem 1.2rem;
        border-radius: 999px;
        border: 1.5px solid var(--brand);
        color: var(--brand);
        font-weight: 600;
        text-decoration: none;
      }
      a#callback-back {
        background: var(--brand);
        color: var(--on-brand);
      }
    </style>
    <script type="module" crossorigin src="/app/assets/spotifyCallback-DQzErqfG.js"></script>
    <link rel="modulepreload" crossorigin href="/app/assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="modulepreload" crossorigin href="/app/assets/spotify-j5kG4qOU.js">
    <script>try{if(!/"onboardingCompleted":true/.test(localStorage.getItem('ourhike:launch')||'')){var l=document.createElement('link');l.rel="preload";l.as="fetch";l.crossOrigin="anonymous";l.href="https://data.ourhike.org/trails_overview.geojson";document.head.appendChild(l)}}catch(e){}</script>
  <link rel="manifest" href="/app/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/app/registerSW.js"></script></head>
  <body>
    <main>
      <h1 id="callback-heading">Connecting Spotify…</h1>
      <p id="callback-body">One moment.</p>
      <a id="callback-open" href="#" target="_blank" rel="noreferrer" hidden
        >Open it in Spotify ↗</a
      >
      <a id="callback-back" href="./">Back to OurHike</a>
    </main>
  </body>
</html>
