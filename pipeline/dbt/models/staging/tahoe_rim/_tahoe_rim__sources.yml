version: 2

sources:
  - name: tahoe_rim
    description: >
      TRTA's registered layers, landed by the extract's tahoe_rim/ folder
      (pipeline/extract/tahoe_rim/) as raw_tahoe_rim__<key>, and staged once
      each by a base model here. Descriptions transcribed from sources.json's
      titles.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_tahoe_rim__tahoe_rim_trail
        data_tests:
          # Rows sharing base_tahoe_rim__trail's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'tahoe_rim_trail'", "globalid"]
        description: >
          Tahoe Rim Trail (sources.json `tahoe_rim_trail`). Key: GlobalID
          unique on 132 live rows.
