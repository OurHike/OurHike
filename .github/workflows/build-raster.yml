# Builds the USGS topo raster background in CI and publishes it to R2.
#
# SWITCHED OFF FOR v2 (#855). Every dispatch stops at the `disabled` job below
# in a few seconds unless a maintainer ticks `run_despite_withdrawal`, and the
# app no longer offers the sheet this produces (client/src/lib/packages.ts).
#
# The reason is the shape described further down rather than anything wrong
# with the code: one render job per corridor cell - 51 of them, 150-minute
# timeout each - then a 300-minute assemble on a single runner. Read off the
# timeouts in this file, that is a ceiling of ~7,950 job-minutes against
# build-basemap.yml's single 180 and build-dem.yml's single 120, which makes
# this the most expensive workflow here by a factor no other job approaches.
# The maintainer's call on 2026-08-20 is that the sheet it produces is not yet
# good enough to be worth that. A judgement about the map, not a measurement
# of it - the measurement is the fan-out.
#
# NOTHING BELOW THIS BLOCK WAS TOUCHED, deliberately. The shape, the ownership
# argument, the disk reasoning - all of it is what makes the build runnable
# again, and none of it survives being reconstructed later from a diff.
# Deleting the `disabled` job is the whole of turning this back on.
#
# The other half of the map. publish-vector-data.yml handles trail lines and
# POIs in minutes; this handles ~14 GB of source imagery and needs a fan-out to
# do it, which is why they are separate workflows rather than one.
#
# They are also independently landable: publish.py merges rather than replaces
# the remote manifest, so publishing raster alone cannot orphan the vector
# artifacts already live, and vice versa.
#
# SHAPE, and why it has to be this one:
#
#   compute-cells   builds the corridor fresh and splits it into 1x1-degree
#                   cells, emitting cells.json
#   render          one job per cell, fetching the quads its OWNED tiles
#                   need and rendering them warp-once from native 2 m pixels
#                   (#191, render_cell_tiles.py): z11-14 tiles plus a 24 m
#                   overview per cell
#   assemble        every cell's tiles and overview back on one runner;
#                   assemble_raster.py verifies the receipts tile the
#                   corridor exactly, renders z0-10 from the overviews, and
#                   writes the four tier archives
#   publish         upload, on a runner that never held the intermediates
#
# The fan-out is not an optimisation. A hosted runner cannot hold the whole
# corridor's raw quads plus a working set, so per-cell is the only way this
# runs here at all - and fetch_topo_quads.py's whole-corridor path
# additionally reads data/spike/corridor.geojson, a stale artifact no fresh
# checkout has and which lib/corridor.py forbids trusting. Only its
# --metadata-only flag is CI-safe.
#
# Ownership is what lets the render shard where the old mosaic could not
# seam-free: every tile is written by exactly one cell (the one holding its
# centre), and that cell fetches every quad the tile's footprint touches -
# including the neighbour's - so cell borders cannot show.
#
# Start with max_cells set low. A first run at 51 cells costs an hour to find
# out something trivial was wrong.

name: Build raster background

on:
  workflow_dispatch:
    inputs:
      max_cells:
        description: "Cells to build (0 = all). Start small; assemble and publish are skipped unless this is 0."
        type: string
        default: "2"
      publish:
        description: "Upload to R2. Ignored unless max_cells is 0, since a partial corridor must never ship."
        type: boolean
        default: false
      data_environment:
        description: "Which environment's data this becomes. UA first; production is the promotion."
        type: choice
        options: [ua, production, dev]
        default: ua
      run_despite_withdrawal:
        description: "Run anyway. This build is switched off for v2 (#855); ticking this spends the fan-out deliberately."
        type: boolean
        default: false

concurrency:
  group: build-raster
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The switch (#855). Seconds, on one runner, before anything expensive can
  # start.
  #
  # A GATE RATHER THAN A DELETED TRIGGER, because the two fail differently and
  # only one of them fails usefully. Stripping `workflow_dispatch` would make
  # the button disappear, and a maintainer looking for a build that used to be
  # there would have to read git history to find out whether it was withdrawn
  # or broken. This says so, in the run log, with the issue number.
  #
  # It is `!inputs.x` rather than a comparison against a string: a
  # `type: boolean` dispatch input arrives as a real boolean, and `== 'false'`
  # against one is a subtle way to write a guard that never fires.
  #
  # The whole build hangs off this: compute-cells needs it, and everything
  # else needs compute-cells, so one failed step here skips all 51 render
  # jobs, the assemble and the publish.
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse the run
        if: ${{ !inputs.run_despite_withdrawal }}
        run: |
          echo "::error title=Raster build is switched off::The USGS raster sheet is withdrawn for v2 (#855) and this build does not run. It is the most expensive workflow here - 51 render jobs plus a 300-minute assemble - and the app no longer offers the sheet it produces. To run it anyway, dispatch again with 'run_despite_withdrawal' ticked."
          exit 1

      # Conditioned rather than left to run after a failed step. Both are true
      # here - a step after a failure is skipped anyway - but a reader should
      # not have to know that rule to see which of these two can happen.
      - name: Say that the switch was overridden
        if: ${{ inputs.run_despite_withdrawal }}
        run: |
          echo "::warning title=Running a withdrawn build::'run_despite_withdrawal' was ticked, so the fan-out below is going ahead. See #855 for why it is normally off."

  compute-cells:
    needs: disabled
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    outputs:
      matrix: ${{ steps.cells.outputs.matrix }}
      total: ${{ steps.cells.outputs.total }}
      partial: ${{ steps.cells.outputs.partial }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      # Reported rather than assumed. The runner's real disk is the number this
      # whole design turns on, and GitHub's published spec has not matched
      # observed free space - so it gets printed on every run instead of
      # remembered once.
      - name: Runner capacity
        run: |
          echo "disk:"; df -h / /mnt 2>/dev/null || df -h /
          echo "cpus: $(nproc)"
          echo "memory:"; free -g

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Warm the DuckDB spatial extension
        run: python -c "import duckdb; duckdb.connect().execute('INSTALL spatial; LOAD spatial;')"

      # centerline.geojson, which build_cells_manifest.py builds the corridor
      # from. fetch_all.py is the only producer.
      - name: Fetch ArcGIS sources
        run: python fetch_all.py

      # The quad inventory. --metadata-only is the sole CI-safe entry point
      # into fetch_topo_quads.py - see this file's header.
      - name: Fetch the quad metadata inventory
        run: python fetch_topo_quads.py --metadata-only

      - name: Build the cell manifest
        run: python build_cells_manifest.py

      - name: Plan the matrix
        id: cells
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          cells = json.loads(Path("data/raw/cells.json").read_text())["cells"]
          total = len(cells)

          requested = int(os.environ["MAX_CELLS"] or 0)
          count = total if requested <= 0 else min(requested, total)

          print(f"matrix={json.dumps([c['index'] for c in cells[:count]])}")
          print(f"total={total}")
          print(f"partial={'false' if count == total else 'true'}")
          PY
        env:
          MAX_CELLS: ${{ inputs.max_cells }}

      - name: Say what will run
        run: |
          echo "${{ steps.cells.outputs.total }} cells in the corridor."
          if [ "${{ steps.cells.outputs.partial }}" = "true" ]; then
            echo "::warning::Building a SUBSET. assemble and publish are skipped - a partial corridor must never ship."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: corridor-inputs
          path: |
            pipeline/data/raw/cells.json
            pipeline/data/raw/corridor.geojson
            pipeline/data/raw/centerline.geojson
          retention-days: 1
          if-no-files-found: error

  render:
    needs: compute-cells
    runs-on: ubuntu-latest
    # Native rendering is heavier per cell than the old 11 m mosaic was: the
    # same fetch, then thousands of per-tile warps instead of one merge.
    timeout-minutes: 150
    defaults:
      run:
        working-directory: pipeline
    strategy:
      # One bad cell should not cancel the other 50 - the point of a first run
      # is learning how many fail and why, not stopping at the first.
      fail-fast: false
      max-parallel: 10
      matrix:
        cell: ${{ fromJSON(needs.compute-cells.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Warm the DuckDB spatial extension
        run: python -c "import duckdb; duckdb.connect().execute('INSTALL spatial; LOAD spatial;')"

      - uses: actions/download-artifact@v4
        with:
          name: corridor-inputs
          path: pipeline/data/raw/

      - name: Fetch the quad metadata inventory
        run: python fetch_topo_quads.py --metadata-only

      - name: Render cell ${{ matrix.cell }} from native quads
        run: python render_cell_tiles.py --cell-index ${{ matrix.cell }}

      - name: Report what this cell cost
        if: always()
        run: |
          echo "disk after:"; df -h /
          du -sh data/raw/topo_quads_cell_* 2>/dev/null || true
          ls -la data/processed/raster_cells/ 2>/dev/null || true

      # Each cell's tiles+overview+receipt cross to assemble as one artifact.
      # Retention is minimal: intermediates that exist only to cross runners.
      - uses: actions/upload-artifact@v4
        with:
          name: raster-cell-${{ matrix.cell }}
          path: pipeline/data/processed/raster_cells/
          retention-days: 1
          if-no-files-found: error

  assemble:
    needs: [compute-cells, render]
    # A partial corridor must never become a PMTiles archive - it would look
    # like a complete map with holes in it, which is worse than no map.
    if: needs.compute-cells.outputs.partial == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Reclaims ~10-15 GB of preinstalled toolchains this job will never use.
      # Cheap insurance on the one step whose disk headroom is genuinely tight.
      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      # assemble_raster.py re-enumerates the corridor's tiles to verify the
      # receipts tile it exactly, so this job needs the raw inputs as well as
      # the rendered cells. Carried from compute-cells rather than re-fetched:
      # it is the same corridor the 51 cells were cut against, and re-running
      # fetch_all.py here could pick up an ArcGIS update mid-run and verify
      # against a centerline the tiles never saw.
      - uses: actions/download-artifact@v4
        with:
          name: corridor-inputs
          path: pipeline/data/raw/

      - uses: actions/download-artifact@v4
        with:
          pattern: raster-cell-*
          merge-multiple: true
          path: pipeline/data/processed/raster_cells/

      # Receipt/archive presence, overlap, and exact corridor coverage are
      # all verified inside assemble_raster.py - a lost render job fails here
      # loudly rather than shipping an archive with a hole.
      - name: Assemble the tier archives
        run: python assemble_raster.py

      - name: What was built
        run: ls -la data/processed/*.pmtiles && df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: pmtiles-archives
          path: pipeline/data/processed/*.pmtiles
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [compute-cells, assemble]
    if: inputs.publish && needs.compute-cells.outputs.partial == 'false'
    runs-on: ubuntu-latest
    environment: production
    # Every writer of latest.json shares this group (publish-vector-data.yml,
    # build-dem.yml, build-basemap.yml): publish() does a read-modify-write
    # of the manifest, and two concurrent publishes could interleave and
    # clobber each other's entries.
    concurrency:
      group: publish-data
      cancel-in-progress: false
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A separate job from assemble on purpose, and safe here where it would
      # not be for the vector half: publish.py builds background paths from
      # PROCESSED_DIR at publish time rather than reading a baked manifest, so
      # nothing depends on this being the runner that produced them. It needs
      # ~1.6 GB rather than assemble's ~7 GB.
      - uses: actions/download-artifact@v4
        with:
          name: pmtiles-archives
          path: pipeline/data/processed/

      - name: What will be published
        run: ls -la data/processed/*.pmtiles

      - name: Publish to R2
        env:
          R2_WRITE_ENABLED: "true"
          # Which environment's data this becomes. publish.py scopes every
          # key by it and refuses to run without one, so a build cannot reach
          # production's keys by omission (features/DATA_ENVIRONMENTS.md).
          OURHIKE_DATA_ENV: ${{ inputs.data_environment }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python publish.py
