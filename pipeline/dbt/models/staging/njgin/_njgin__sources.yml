version: 2

sources:
  - name: njgin
    description: >
      NJDEP's registered layers, landed by the extract's njgin/ folder
      (pipeline/extract/njgin/) as raw_njgin__<key>, and staged once each by a
      base model here. Descriptions transcribed from sources.json's titles.
    schema: raw
    config:
      # When the extract last read each table or confirmed it unchanged, from
      # its run log, never `_loaded_at` (decision 203): make_dbt_staging.py's
      # LOADED_AT_QUERY and MONTHLY_FRESHNESS_DAYS say why, and
      # tests/test_source_freshness.py holds every monthly source to them.
      loaded_at_query: "{{ last_read_or_confirmed_at(this) }}"
      freshness:
        warn_after: {count: 35, period: day}
        error_after: {count: 62, period: day}
    tables:
      - name: raw_njgin__nj_statewide_trails
        data_tests:
          # Rows sharing base_njgin__nj_statewide_trails's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'nj_statewide_trails'", "globalid"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks(), decision 102), each with its two thresholds (decision 204).
          - elementary.volume_anomalies:
              config:
                severity: error
                fail_calc: "{{ var('elementary_anomaly_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: error
                fail_calc: "{{ var('elementary_schema_change_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          Statewide Trails in New Jersey (NJ Geospatial Forum Trails Task
          Force, hosted by NJDEP) (sources.json `nj_statewide_trails`). Key:
          GLOBALID unique on 13,296 live rows.
      - name: raw_njgin__njdep_park_trails
        data_tests:
          # Rows sharing base_njgin__njdep_park_trails's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'njdep_park_trails'", "globalid"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks(), decision 102), each with its two thresholds (decision 204).
          - elementary.volume_anomalies:
              config:
                severity: error
                fail_calc: "{{ var('elementary_anomaly_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: error
                fail_calc: "{{ var('elementary_schema_change_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          NJ State Park Service Trails (NJDEP Bureau of GIS, Features/Land
          layer 63) (sources.json `njdep_park_trails`). Key: GLOBALID unique
          on 3,305 live rows.
