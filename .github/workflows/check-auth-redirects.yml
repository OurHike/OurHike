# Asks daily, as a browser would, whether a hiker can still finish signing in.
#
# Tier 3 of #431, tracked in #467. Manual-only until #488, which decided how it
# joins its scheduled siblings without becoming a second keepalive:
#
#   check-deployment.yml     daily 09:15   can a browser READ the data
#   check-deployed-app.yml   daily 09:30   does the APP draw a trail
#   this                     daily 09:45   can a browser FINISH a sign-in
#
# pipeline/check_auth_redirects.py has the mechanism in full - what it probes,
# why GET /auth/v1/verify rather than /auth/v1/authorize, and why the negative
# probes matter as much as the positive ones. This file is only the scheduling
# question.
#
# WHY THIS DOES NOT MAKE A SECOND KEEPALIVE. Supabase's own "Project Pausing"
# guide says a Free plan project stays awake on "a few user requests to the
# database each day", generated by "making API calls to your project" - not
# narrowly a direct Postgres connection. supabase-keepalive.yml's own comment
# already rules out /auth/v1/settings for the opposite reason: it answers from
# GoTrue's configuration without Postgres hearing about it. `GET
# /auth/v1/verify` is not that - GoTrue has to look the token up against its
# own `auth` schema tables to know it is junk, so this probe is real database
# activity too. That is what makes it safe to add as its own named entrant to
# .github/tests/test_supabase_keepalive_workflow.py's SCHEDULED_ROSTER, rather
# than something that has to fold into the keepalive to avoid becoming a
# second one - the roster's actual question, since #656, is "is every
# scheduled road into the project named and justified", not "is there only
# one".
#
# REPORTS BY TRACKING ISSUE, not by failing the run - the same reason its two
# daily siblings do (#431: alert on transitions, not on runs). #488 named this
# explicitly as the one thing not yet built: "a scheduled one needs the
# issue."

name: Check auth redirects

on:
  schedule:
    # 09:45 UTC daily - after check-deployed-app at 09:30, so if the app is
    # already broken this is not a second alarm for the same underlying cause.
    - cron: "45 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-auth-redirects
  cancel-in-progress: false

env:
  ISSUE_TITLE: "A hiker cannot finish signing in"
  ISSUE_LABEL: deployment-health

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # requests and PyYAML only - the script reads the same declaration tier 1
      # reads, with the same parser.
      - name: Install dependencies
        run: python -m pip install --quiet requests pyyaml

      # `shell: bash` for `-o pipefail` - see #514. set +e / PIPESTATUS rather
      # than trusting the pipe: the step's exit status is tee's under the
      # default shell (#655), and --exit-zero reserves non-zero for the check
      # itself crashing.
      - name: Ask whether a sign-in can still come back
        id: check
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          UA_SUPABASE_URL: ${{ vars.UA_SUPABASE_URL }}
          UA_SUPABASE_ANON_KEY: ${{ vars.UA_SUPABASE_ANON_KEY }}
        run: |
          set +e
          python check_auth_redirects.py \
            --json auth-redirects.json \
            --exit-zero | tee auth-redirects.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::check_auth_redirects.py exited $status, which --exit-zero reserves for a crash."
            exit "$status"
          fi

      - name: Write the job summary
        if: always()
        run: |
          {
            echo "## Auth redirects"
            echo
            if [ -f auth-redirects.txt ]; then
              echo '```'
              cat auth-redirects.txt
              echo '```'
            else
              echo "The check did not produce a report. See the step log above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Shares deployment-health's label with its two daily siblings - findable
      # together - and gets its own title so it does not overwrite either.
      - name: Open, update, or close the tracking issue
        uses: actions/github-script@v9
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs')
            const trackingIssue = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/tracking-issue.js`)
            const verdict = JSON.parse(fs.readFileSync('pipeline/auth-redirects.json', 'utf8'))

            const failed = verdict.failed ?? []
            const unreachable = verdict.unreachable ?? []
            const keyOf = report => `${report.check}:${report.project}:${report.origin}`

            await trackingIssue({github, context, core}, {
              label: process.env.ISSUE_LABEL,
              title: process.env.ISSUE_TITLE,
              checkedAt: verdict.checked_at,
              keys: failed.map(keyOf),
              healthy: failed.length === 0,
              allClear: `A sign-in can complete from every declared origin again, as of ${verdict.checked_at}. Closing.`,

              render: (firstSeen, cell) => [
                `**A hiker cannot finish signing in from at least one origin.** ${failed.length} check(s) failed.`,
                '',
                '| check | project | origin | first seen | detail |',
                '|---|---|---|---|---|',
                ...failed.map(f => `| \`${f.check}\` | ${f.project} | ${f.origin} | ${firstSeen[keyOf(f)]} | ${cell(f.detail)} |`),
                '',
                unreachable.length
                  ? `${unreachable.length} check(s) could not be made at all and are not counted as refusals - a flaky third party must not declare an outage.`
                  : '',
                '',
                `Last checked ${verdict.checked_at} · [run](${process.env.RUN_URL})`,
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            })
