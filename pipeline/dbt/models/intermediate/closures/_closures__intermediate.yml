version: 2

models:
  - name: int_closures__atc_checked
    description: >
      Every row of reference/atc_updates.json, read field by field and checked
      against lib/atc_updates.py's file_problems() in row_problems()'s order
      with every problem the row has in `problems`. An empty
      list means the row publishes; int_closures__gate holds ATC's whole file
      back on any problem, and reads the review from the file landed
      whole (base_atc__atc_updates).
    columns:
      - name: atc_update_row_key
        description: base_atc__atc_trail_updates's key, the file and the row's place in it.
        data_tests: [not_null, unique]
      - name: file_row
        description: The row's place in the file, from 0. The published order.
      - name: row_label
        description: The row as lib/atc_updates.py names it in a message, its atc_id or "update N".
      - name: atc_id
        description: ATC's slug for the update, where it is a string, as written.
      - name: title
        description: The update's headline as written, never stripped; null where it is not a string.
      - name: states
        description: The row's `states` as written, where it is a list, as JSON.
      - name: start_mile_text
        description: >
          The NOBO mile the update starts at, as the reviewer wrote the number
          Text, because dbt 2.0.6's unit tests compare a DOUBLE only to
          one decimal; int_closures__unioned casts it. A string such as "476.6"
          is null here and a problem, as it is "not a mile" to
          lib/atc_updates.py.
      - name: end_mile_text
        description: The NOBO mile it ends at, on the same terms.
      - name: obstructs_trail
        description: Whether a hiker is stopped from walking through, where the reviewer wrote a real boolean.
      - name: updated_at
        description: ATC's own last edit of the notice, as the reviewer wrote it.
      - name: problems
        description: Every problem with the row, each prefixed by its label, in row_problems()'s order, then CL04's repeat.
      - name: problem
        description: The same problems joined by " | ", or null where the row is fine.
      - name: published_row
        description: >
          The row as lib/atc_updates.py's published_rows() publishes it, each
          field's JSON as written plus source_key and review_state, for
          pub_conditions_atc_updates.

  - name: int_closures__atc_automatic
    description: >
      Every update ATC's trail-updates sitemap lists, as its page parsed
      (base_atc__atc_trail_updates_pages), judged by lib/atc_updates.py's
      auto_publish_refusal() in its order: `refusal` in the
      Python's words, null where the update publishes without a person. For
      those, the row auto_row() writes, with obstructs_trail forced false
      int_closures__unioned takes the rows that publish; the rest stay
      here for the job log, and `actionable` marks the ones
      propose_atc_updates.py proposes to a person.
    data_tests:
      # The rail on this whole path: an update nobody here has read never
      # draws a barrier across the trail.
      - dbt_utils.expression_is_true:
          name: an_automatic_atc_row_never_obstructs_the_trail
          arguments:
            expression: "not obstructs_trail"
      # A row that publishes carries the whole of auto_row()'s row.
      - dbt_utils.expression_is_true:
          name: an_automatic_atc_row_publishes_with_its_span_and_stamp
          arguments:
            expression: >
              start_mile_text is not null and end_mile_text is not null
              and updated_at is not null and published_row is not null
          config:
            where: "publishes"
    columns:
      - name: atc_trail_update_page_key
        description: base_atc__atc_trail_updates_pages's key, the registry key and ATC's slug.
        data_tests: [not_null, unique]
      - name: slug
        description: ATC's slug, which an automatic row publishes as `atc_id`.
        data_tests: [not_null, unique]
      - name: sitemap_row
        description: The update's place in the sitemap, from 0.
      - name: refusal
        description: >
          Why the update may not publish without a person, in
          auto_publish_refusal()'s words; null where it publishes.
      - name: publishes
        description: Whether the update publishes without a person, unreviewed.
        data_tests: [not_null]
      - name: actionable
        description: >
          Whether the refusal is one a person can act on: every reason but a
          reviewed slug and an update older than the review, the two that
          export_atc_updates.py's job log and propose_atc_updates.py leave out.
        data_tests: [not_null]
      - name: atc_id
        description: The slug, as an automatic row's id.
      - name: title
        description: ATC's headline, str.strip()'d as auto_row() strips it.
      - name: category
        description: ATC's category, one this build knows where the row publishes.
      - name: states
        description: The chip's states, as JSON.
      - name: start_mile_text
        description: >
          The NOBO mile the agreed reference starts at, as the parse read it,
          text (dbt 2.0.6's unit tests compare a DOUBLE only to one decimal);
          null where the update does not publish.
      - name: end_mile_text
        description: The NOBO mile it ends at, the start for a point; null where it does not publish.
      - name: obstructs_trail
        description: False, always, and read from nothing.
        data_tests: [not_null]
      - name: updated_at
        description: ATC's dateModified in UTC to the second, `...Z`, as _as_utc_stamp() writes it; null where it does not publish.
      - name: source_url
        description: The update's own page.
      - name: published_row
        description: >
          The row as auto_row() writes it, for pub_conditions_atc_updates, each
          mile the JSON number the parse read; null where it does not publish.

  - name: int_closures__nynjtc_checked
    description: >
      NYNJTC's Trail Alerts posts, read as lib/nynjtc_alerts.py's parse_alert()
      reads them and shaped as published_rows() publishes them,
      with why a post cannot be read in `problems`. int_closures__gate holds
      NYNJTC's file back on any problem, or on a category with no posts.
    # DECISION 208 (the maintainer's poll, 2026-10-15, "Hold at last good
    # copy"): these four tests are errors in every environment, as
    # int_closures__gate's are. pub_conditions_notices reads this model, and
    # so does int_closures__unioned, above the gate, so in production and UA
    # a failure here holds all nine pub_conditions_* files at their last good
    # copy (build_marts.py's failure_holds()) instead of publishing past it.
    # A post the gate holds NYNJTC for still has its key, and a notice_id
    # made from its slug or else its WordPress id, so that hold fails none
    # of them (Reasoned from int_closures__nynjtc_checked.sql). The one post
    # that would is one with no WordPress id and no slug of its own: its
    # notice_id is null, and every conditions file waits. Nobody has seen
    # one.
    columns:
      - name: trail_alert_key
        description: base_nynjtc__nynjtc_trail_alerts's key, the post's WordPress id.
        data_tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
      - name: notice_id
        description: >
          `nynjtc_trail_alerts:<slug>`, the published notice_id, or
          `nynjtc_trail_alerts:post-<id>` for a post with no readable slug or a
          slug another post shares.
        data_tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
      - name: slug
        description: The post's slug, stripped, as parse_alert() strips it.
      - name: title
        description: The title as _text_of() reads it, tags out and entities unescaped twice.
      - name: locality
        description: The regions, else the states, else the parks a post is tagged with, by name; empty where none.
      - name: source_url
        description: The post's link, as NYNJTC serves it.
      - name: modified_at
        description: NYNJTC's own last edit of the alert.
      - name: updated_at
        description: The same, as the published text, to the second with a Z.
      - name: problems
        description: Why the post cannot be read, each prefixed by its slug or id.
      - name: problem
        description: The same joined by " | ", or null where the post reads.
      - name: place_terms
        description: >
          The post's trail and park tags as a JSON list of `taxonomy:slug`
          (features/ORG_NOTICES.md section 4), trail tags first, each in the
          post's own order; null where it carries neither. Read by
          pub_conditions_notices for the `org_terms` place, which places
          nothing until a reviewed table maps a term to a feature.

  - name: int_closures__oprhp_areas
    description: >
      NYS Parks' temporary closed areas, one row per area with a geometry,
      its reason and place stripped and null where blank, and no dates
      (export_nearby_trails.py's load_closure_areas()).
    columns:
      - name: closure_key
        description: stg_oprhp__trail_closures's key.
        data_tests: [not_null, unique]
      - name: source_row
        description: >
          The area's place in the layer (stg_oprhp__trail_closures), which
          breaks apply_area_closures()' tie between two areas a trail
          overlaps equally: the first wins.
        data_tests: [not_null, unique]
      - name: closure_reason
        description: The layer's `Name`, its whole reason as prose, stripped.
      - name: closure_place
        description: The layer's `Descript`, where it is, stripped.
      - name: geom_geojson
        description: >
          The closed area in lon/lat, as GeoJSON text: a GEOMETRY column in a
          unit-tested model's output panics dbt 2.0.6, and contracted marts
          cannot hold one (the closures mart's geom_geojson says why).
        data_tests: [not_null]

  - name: int_closures__ourhike_checked
    description: >
      OurHike's moderator-verified closures, each with whether it blocks the
      trail (its status, read as client/src/lib/closureBanner.ts reads it) and
      a problem for a row that is not verified, or whose mile or
      coordinate is not a finite number.
    columns:
      - name: ourhike_closure_key
        description: base_ourhike__closures's key.
        data_tests: [not_null, unique]
      - name: obstructs_trail
        description: >
          True for `closed` and `reroute_available`, false for `open` (a
          reopened closure), null for a status the backend does not define.
      - name: problems
        description: Why the row cannot publish; empty where it can.

  - name: int_closures__unioned
    description: >
      Every notice, closed area and closure the closures and warnings marts
      are split from, one row each, by name, nothing filtered: ATC's reviewed
      Trail Updates, the updates ATC posted since that review which
      int_closures__atc_automatic publishes without a person (review_state
      `auto`, obstructs_trail false), NYNJTC's Trail Alerts, NYS Parks'
      temporary closed areas and OurHike's verified closures, each with
      `obstructs_trail`, `review_state` and its source's `problems`.
    columns:
      - name: notice_id
        description: >
          `<source key>:<the source's own id>`, unique across every source;
          the closures and warnings marts' key.
        data_tests: [not_null, unique]
      - name: source_key
        description: >
          The registry key, or the unregistered key int_sources__publication
          reads it under. The hand-written branches' four are held to their
          list; a club notice's is any notice source's (seeds/notice_readers.csv).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [atc_trail_updates, nynjtc_trail_alerts, oprhp_trail_closures, ourhike_closures]
              config:
                where: "not starts_with(notice_kind, 'club_')"
          - relationships:
              arguments:
                to: ref('notice_readers')
                field: source_key
              config:
                where: "starts_with(notice_kind, 'club_')"
      - name: review_state
        description: Who stands behind the row; `auto` for an ATC update nobody here has read, which its gate published.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [reviewed, not_reviewed, org_published, moderator_verified, auto]
      - name: obstructs_trail
        description: >
          Whether a hiker is stopped from walking through, as its source says;
          null where nobody has classified it (every NYNJTC alert).
      - name: problems
        description: Why the row cannot publish, from its source's checks; empty where it can.
        data_tests: [not_null]

  - name: int_closures__club_notices
    description: >
      Every generated club notice source's rows, read by the phase
      C rules (pipeline/ELT.md): one row per notice in the closures family's
      columns, each read by its own words against one vocabulary for every
      source (seeds/notice_words.csv; the model's header, rule
      2), with `obstructs_trail` true only where that reading closes the
      trail, its source files it under closures, its own dates do not
      contradict each other and its own end (its season's, where its own
      words state one) has not passed, whether or not its own start has
      come, and `held_because` set where the notice may not publish as
      current. Nothing is dropped here;
      the finals leave out a held row. Place is the source's own geometry,
      but for a point inside exactly one of its steward's own areas, which
      takes that area (rule 4, the maintainer's answer to Q3, poll of
      2026-10-11).
    columns:
      - name: notice_id
        description: "`<source key>:<the source's own id>`, unique across every source."
        data_tests: [not_null, unique]
      - name: notice_type
        description: closures or warnings, the club file that declares the source.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [closures, warnings]
      - name: obstructs_trail
        description: >
          True only where `reads_as` is `closes_trail`, the source files the
          notice under closures, nothing holds it, its own dates do not
          contradict each other (an end before its start, or a date before
          1900), and its own end date has not passed: a season's end where
          its own words state a season (rule 1). A start still ahead does not
          change it: the phone closes the trail from the day before
          `starts_on`. Null otherwise, never false: nobody here classified
          it.
        data_tests:
          - accepted_values:
              arguments:
                values: [true]
      - name: reads_as
        description: >
          What the notice's own words read as against seeds/notice_words.csv
          (rule 2, the first that holds): not_current, nothing_for_a_hiker
          (decision 165 made general), closes_trail, or notice. A hazard area
          reads notice (rule 6 reads its category).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [not_current, nothing_for_a_hiker, closes_trail, notice]
      - name: read_from
        description: >
          The field and the word that decided `reads_as` (`status 'open'`,
          `narrative 'motorized'`, `layer 'closures'` where the layer's own
          name spoke for a row whose words said nothing), a category's kind of
          notice with the title that agrees (`category 'closure' with its
          title 'closure'`), a site where a closed site read as a notice
          (`title 'campground', a site and not the trail`, `site_type
          'viewing scenery', a site and not the trail`), or a road where an
          area that names only a road read as one (`title 'road', an area that
          names only a road`); null for a notice no word decided.
      - name: held_because
        description: >
          Why the notice may not publish as current, in words for the job log:
          its own words say it is not current, or limit it to a use a hiker
          is not (both rule 2, the field and word named), its own category
          names no value its hazard source is listed for, or names one beside
          a word that negates it (rule 6, the word named), or its own order
          was rescinded. Never its own end date or its own start: both
          publish. Null where it may.
      - name: key_versions
        description: >
          How many different raw rows share the notice's key, counted by its
          base model before the dedupe; int_closures__gate holds a source with
          any over one (decision 40 allows only exact copies).
      - name: geom_geojson
        description: >
          The notice's place, in OGC:CRS84 as GeoJSON: the source's own
          geometry, or, for a point inside exactly one of its steward's own
          areas, that area's own outline (`placed_by` names it); null where
          the source gives none.
      - name: placed_by
        description: >
          The steward's own area a point lies inside and takes as its place,
          `<areas source key>:<area id>` (int_closures__steward_areas); null
          for every notice that keeps its own geometry, a point inside none
          or two or more areas among them.
      - name: updated_at
        description: The source's own edit stamp, ISO 8601 UTC, or null where it gives none; never the load time.

  - name: int_closures__steward_areas
    description: >
      The areas that may place a notice's point (int_closures__club_notices'
      rule 4; the maintainer's answer to Q3, poll of 2026-10-11): one row per
      notice source seeds/notice_steward_areas.csv links to a layer of its own
      steward's areas, and per area of that layer whose layer may publish,
      whose key one raw row holds, and which is a polygon. Each carries the
      area's own outline as GeoJSON text.
    columns:
      - name: steward_area_key
        description: The notice source and the area's key.
        data_tests: [not_null, unique]
      - name: source_key
        description: The notice source whose points the area may place.
        data_tests: [not_null]
      - name: areas_source_key
        description: The sources.json key of the layer the area belongs to.
        data_tests: [not_null]
      - name: area_id
        description: The area's own id in its layer (the layer's measured key, FDEP's SITE_NAME).
      - name: geom_geojson
        description: The area's own outline, as drawn, in OGC:CRS84 as GeoJSON.
        data_tests: [not_null]

  - name: int_closures__window_carried
    description: >
      A feed is a window, not a list (phase C): every notice of
      a `window` source (seeds/notice_readers.csv) that the previous build's
      closures or warnings mart held and this build's read no longer
      carries, with its last content, unless a person marked it lifted
      (seeds/notice_marks.csv). int_closures__final and int_warnings__final
      carry it, so the snapshot never closes it on absence alone.
    columns:
      - name: notice_id
        description: The notice, as the closures or warnings mart keys it.
        data_tests: [not_null, unique]
      - name: mart
        description: closures or warnings, the mart that held it.
        data_tests:
          - accepted_values:
              arguments:
                values: [closures, warnings]

  - name: int_closures__held_carried
    description: >
      A notice source int_closures__gate holds back keeps its last good rows
      (phase D): every row of such a source that the previous
      build's closures or warnings history held as current, with every
      column the mart had, and `carried_since`, the start of the first build
      that carried it. Only a source the extract declares a notice resource
      for, and only where int_sources__publication lets it publish: a
      publication hold is a decision, never a failed read. A notice
      int_closures__window_carried carries is left to it.
      int_closures__final and int_warnings__final add these rows back.
    columns:
      - name: notice_id
        description: The notice, as the closures or warnings mart keys it.
        data_tests: [not_null, unique]
      - name: mart
        description: closures or warnings, the mart that held it.
        data_tests:
          - accepted_values:
              arguments:
                values: [closures, warnings]
      - name: carried_since
        description: >
          When carrying began: the history's own value for a row carried
          before, otherwise this build's start.
        data_tests: [not_null]

  - name: int_closures__notice_tables
    description: >
      Whether each club notice source's raw table is in this warehouse
      the hourly warehouse can lack a notices table, and a
      generated base model reads an absent one as empty, so
      int_closures__gate holds such a source with this as its reason rather
      than passing it as having no notices. Read from DuckDB's own
      catalogue at build time.
    columns:
      - name: raw_table
        description: The raw table, one row each (seeds/notice_readers.csv).
        data_tests: [not_null, unique]
      - name: is_present
        description: Whether the table is in this warehouse's `raw` schema.
        data_tests: [not_null]

  - name: int_closures__rows_outside_region
    description: >
      The lon/lat swap test before the gate: one row per
      notice, alert or closed area of int_closures__unioned or
      int_warnings__unioned, not held as not current, whose geometry reaches
      outside the box its source publishes in
      (macros/lands_outside_its_region.sql). int_closures__gate holds each
      source with a row here, so the source carries its last good rows and
      every other source and file publishes.
    data_tests:
      # The gate holds the source, so the row never reaches a mart (decision
      # 81). `holds_a_source` makes build_marts.py print the rows and turn
      # the run red after the publish (its PARTIAL_EXIT). No severity of its
      # own: a warning in production and UA, which build on,
      # and an error in dev and CI, where no fixture row should land outside
      # its box. The marts' own region tests failed at error in production
      # until decision 81, and stopped every hourly file (soak runs 525 to
      # 527).
      - dbt_utils.expression_is_true:
          arguments:
            expression: "false"
          config:
            meta:
              holds_a_source: true
    columns:
      - name: row_id
        description: The row's notice_id, as the marts' key carries it.
        data_tests: [not_null, unique]
      - name: source_key
        description: The source int_closures__gate holds for it.
        data_tests: [not_null]
      - name: region
        description: The box source_region() holds the source to.
  - name: int_closures__gate
    description: >
      The per-source gate: one row per source a conditions file is written
      from, with `passed` and `held_because`, so one bad ATC row holds back
      ATC's file and nothing else (pipeline/ELT.md, "A whole-file gate becomes
      a per-source gate"). The marts keep only the notice sources that pass,
      and a source with a row int_warnings__wording_leaks or
      int_closures__rows_outside_region returns is held.
      Each pub_conditions_* writer names its row in `meta.gate` and selects no
      row while it is held, so the phone keeps its last file and every other
      file is written; publish.py then fails the run for each held file.
      ATC's review is read from the file landed whole, so an empty reviewed
      file passes and publishes `atc_updates: []`, as export_atc_updates.py
      does.
    data_tests:
      # Names every held source, and never stops a build for one of them:
      # publish.py names each held file and why, after the upload. Its two
      # thresholds: a warning for any held source, an error
      # once half the gate's sources are held, which is the extract or the
      # gate broken rather than a club's rows (tests/generic/rows_named.sql;
      # @unvalidated, half is the lead's pick). Measured: the fixture build of
      # 76e71a8d held 110 of its 326 sources, every one absent from the
      # fixture warehouse (34%), and UA's hourly page of 2026-10-15 04:38 UTC
      # showed this test passing. Decision 208 leaves it on the project's
      # switch (below).
      - rows_named:
          name: int_closures__gate_holds_no_source
          arguments:
            named: "not passed"
            error_share: 0.5
    # DECISION 208 (the maintainer's poll, 2026-10-15, "Hold at last good
    # copy"): every other test of this model is an error in every
    # environment, as the closures and warnings marts' are (dbt_project.yml,
    # the comment above `data_tests:`): the six below, and the singular tests
    # assert_a_notice_source_whose_raw_table_is_absent_is_held and
    # assert_every_notice_lands_in_exactly_one_of_closures_or_warnings. Seven
    # pub_conditions_* writers read this model and two read
    # pub_conditions_notices (tests/test_dbt_test_thresholds.py reads that
    # off the parse), so in production and UA a failure here holds all nine
    # files at their last good copy (build_marts.py's failure_holds()), where
    # the switch published what the gate had passed. Two keep the switch,
    # because a held source is what they report and at error one held
    # source would hold every file: int_closures__gate_holds_no_source above
    # and assert_every_held_notice_source_with_notices_has_rows_to_carry
    # (`holds_a_source`). A source the gate holds still has its
    # one row, and rows_invalid, may_publish, passed and awaiting_review are
    # each a count, a coalesce or a comparison that is never null (Reasoned
    # from int_closures__gate.sql), so holding one source fails none of the
    # six.
    columns:
      - name: source_key
        description: >
          The source: one row for every registered notice source
          seeds/notice_readers.csv names (phase C), held where
          its raw table is not in this warehouse or the run log never shows
          it being read, and one each for
          OurHike's closures and reports, NWS's alerts and
          reference/work_projects.json, which have no sources.json row.
        data_tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
      - name: rows_total
        description: >
          The source's rows: in int_closures__unioned for a notice source,
          else its public reports, landed alerts or work-project rows.
      - name: rows_invalid
        description: Its rows with a problem, or for reports a number that is not finite.
        data_tests:
          - not_null:
              config:
                severity: error
      - name: may_publish
        description: >
          int_sources__publication's answer for the source, false where it has
          no row. The marts join that model themselves; it is here so a writer
          reads one answer per source.
        data_tests:
          - not_null:
              config:
                severity: error
      - name: reviewed_at
        description: >
          ATC's `reviewed_at`, as written in the file landed whole, which
          pub_conditions_atc_updates publishes; null for every other source,
          which no person reviews as a file.
      - name: passed
        description: Whether its rows may reach the marts and its file may be written.
        data_tests:
          - not_null:
              config:
                severity: error
      - name: held_because
        description: Why not, in words for the job log; null where it passed.
      - name: awaiting_review
        description: >
          True only for ATC's file or reference/work_projects.json when nobody
          has reviewed it yet, the holds export_atc_updates.py and
          export_work_projects.py treat as no failure (each writes nothing and
          exits 0). The writer selects no row, as for any hold, and publish.py
          does not fail the run for this one.
        data_tests:
          - not_null:
              config:
                severity: error

  - name: int_closures__work_projects_checked
    description: >
      reference/work_projects.json's rows, each with its share of
      lib/work_projects.py's file_problems() in its words: its
      repeated id, then row_problems(), and the row as published_rows()
      writes it when it has neither. One more row, with no position, is the
      file's own: its review, as is_reviewed() reads it, and its own
      problems (`rows` not a list, the retired `ua_sample_rows`).
      pub_conditions_work_projects reads only this model, writes nothing for
      an unreviewed file, and fails while any row here has a problem.
    columns:
      - name: work_project_row_key
        description: The file and the row's place in it, or `file` for the file's own problems.
        data_tests: [not_null, unique]
      - name: row_position
        description: The row's place in `rows`, from 0, which is the published order; null on the file's own row.
      - name: work_project_id
        description: The row's `id`, where it is a string.
      - name: row_label
        description: How a problem names the row, as f"{row_id}" names it, `<no id>` without one.
      - name: duplicate_problems
        description: The repeated-id problem, where an earlier row has this string id.
      - name: row_problems
        description: row_problems()'s list for the row, in its order; the file's own problems on the file's row.
      - name: problem
        description: The row's problems, repeated id first, joined by " | "; null for a row with none.
      - name: published_row
        description: >
          The row as published_rows() writes it: as written, then each of
          status (`upcoming`), capacity, description, lat, lon and mile (null)
          it lacks; null for a row with a problem.
      - name: reviewed_at
        description: The file's `reviewed_at` where it is a string, as written; on the file's own row only.
      - name: is_reviewed
        description: >
          lib/work_projects.py's is_reviewed(): a string, not blank once
          stripped, whose first ten characters date.fromisoformat() reads,
          YYYY-MM-DD or YYYYMMDD (macro python_date_fromisoformat(), which
          reads no ISO week date); on the file's own row only.
  - name: int_closures__final
    description: >
      The closures mart's rows before their row dates:
      what models/marts/closures/closures.sql held until then, every
      contracted column but _first_seen_at and _changed_at.
      int_closures__history snapshots it, and the mart reads that snapshot.
    columns:
      - name: closure_id
        description: The mart's key.
        data_tests: [not_null, unique]
  - name: int_closures__notice_state_shapes
    description: >
      The shape of every state seeds/notice_states.csv names,
      from the Census Bureau's TIGER/Line file, simplified for a phone
      (Douglas-Peucker at `notice_state_simplify_tolerance_m` in the state's
      own equirectangular frame, 4 decimal places), with the margin the phone
      holds a route to (`notice_state_edge_margin_m`). The model's header has
      the measurement behind both, and
      assert_notice_state_shapes_stay_inside_their_edge_margin re-measures it
      every build. pub_conditions_notice_states writes it; no map draws it.
    columns:
      - name: state
        description: The two-letter USPS code, as the seed and notices.json's `states` name it.
        data_tests: [not_null, unique]
      - name: state_name
        description: The state's name, as the Census Bureau spells it.
        data_tests: [not_null]
      - name: frame
        description: The PROJ string of the state's equirectangular frame, which the simplification and the offset test both measure in.
      - name: phone_geometry
        description: The simplified shape as GeoJSON, rings wound as RFC 7946 asks of a writer.
        data_tests: [not_null]
      - name: edge_margin_m
        description: How far inside the shape a route vertex must be before the phone counts it as in the state.
        data_tests: [not_null]
  - name: int_closures__trail_closure_areas
    description: >
      Every club notice that closes an area, as its source drew it
      (S6): the closures mart's rows
      and the warnings mart's club notices of a notice source whose own
      `obstructs_trail` is true, ATC's excepted, whose geometry made valid
      has dimension 2, kept as its polygons alone, with its bounding box.
      step_closure_trail_lines lands the nearby trail lines whose box meets
      one, and int_closures__area_trail_cuts cuts them against it. Every
      area conditions/notices.json marks obstructing is a row here (the
      model's header says why). Its tests warn rather than fail: this builds
      in stage A, where a failure would stop every conditions file of the
      hour, and the marts' own keys already hold each id to one row. They
      stay at warn in every environment, a recorded exception (decision 197,
      the maintainer's "Keep warn, a recorded exception", and
      seeds/model_key_exceptions.csv), with the project's two thresholds
      declared; `stays_at_warn` keeps build_marts.py and the
      data-quality file from reporting them as errors.
    columns:
      - name: notice_id
        description: The notice's id, its mart row's closure_id or warning_id, as conditions/notices.json carries it.
        data_tests:
          - not_null:
              config:
                severity: warn
                meta:
                  stays_at_warn: decision 197
          - unique:
              config:
                severity: warn
                meta:
                  stays_at_warn: decision 197
      - name: source_key
        description: The notice's source, a row of seeds/notice_readers.csv.
      - name: xmin
        description: The area's least longitude, EPSG:4326.
      - name: ymin
        description: The area's least latitude.
      - name: xmax
        description: The area's greatest longitude.
      - name: ymax
        description: The area's greatest latitude.
      - name: area_geojson
        description: >
          The area as GeoJSON text in lon/lat, a Polygon or MultiPolygon: the
          mart's own geometry made valid, its polygons alone, never the 100 m
          grown outline conditions/notices.json carries.
  - name: int_closures__area_trail_cuts
    description: >
      What the map draws for each area closure: in an
      hour with trail lines to cut against, one row per area of
      int_closures__trail_closure_areas, holding either the stretches of the
      mapped trails inside it, or, where none runs inside, the area itself,
      which the phone shades, and on every row the area's own outline, which
      pub_conditions_trail_closures compares to draw once a closure two
      sources post. The lines are the release's
      (stg_derived__closure_trail_lines: its nearby trail lines and, since
      The A.T.'s own), cut by
      int_trail_lines__network_area_closures' rule and shaped for a phone at
      10 m and 5 decimal places by macros/notice_phone_geometry.sql, one
      MultiLineString per area; the area by the same macro ungrown. No row at
      all in an hour with no lines, when nothing says which areas have a
      trail inside, and none for an area whose cut or shape raised or whose
      shape comes out empty: pub_conditions_trail_closures leaves those out.
      Builds in what step_closure_trail_lines' table unblocks, so every GEOS
      operation is in TRY() and its tests warn: a failure here would stop
      every conditions file of the hour, where an area it cannot cut is only
      left out. Its consistency test names each row whose stretches and
      shade disagree, and is an error when every row does (decision 204,
      tests/generic/rows_named.sql); its key tests stay at warn, decision
      197's recorded exception.
    data_tests:
      - rows_named:
          name: int_closures__area_trail_cuts_draws_each_area_one_way
          arguments:
            named: "not ((stretches > 0) = (stretches_geojson is not null) and (stretches > 0) = (shade_geojson is null))"
    columns:
      - name: notice_id
        description: The area closure's notice_id.
        data_tests:
          - not_null:
              config:
                severity: warn
                meta:
                  stays_at_warn: decision 197
          - unique:
              config:
                severity: warn
                meta:
                  stays_at_warn: decision 197
      - name: stretches
        description: >
          How many stretches the MultiLineString holds; 0 for an area no
          mapped trail runs inside, which is shaded.
      - name: stretches_geojson
        description: >
          The stretches as one GeoJSON MultiLineString in lon/lat at 5 decimal
          places, each of two or more distinct vertices, by line id and then
          its place along the line; null where `stretches` is 0.
      - name: shade_geojson
        description: >
          Where `stretches` is 0, the area as its source drew it (never the
          100 m grown outline conditions/notices.json carries), simplified at
          10 m and cut to 5 decimal places, a GeoJSON Polygon or MultiPolygon
          in lon/lat with its holes: what the phone hatches, with no mark on
          its edge. Null where a trail runs inside.
      - name: area_geojson
        description: >
          The area as its source drew it, exactly as
          int_closures__trail_closure_areas gives it: a GeoJSON Polygon or
          MultiPolygon in lon/lat, neither simplified nor the 100 m grown
          outline conditions/notices.json carries. Carried through so that
          pub_conditions_trail_closures measures each area it draws against
          other sources' from this model alone (its header, "THE SAME
          CLOSURE FROM TWO SOURCES IS DRAWN ONCE"); reading the areas model
          beside this one is the rejoin dbt_project_evaluator's
          fct_rejoining_of_upstream_concepts fails.

unit_tests:
  - name: int_closures__notice_state_shapes_simplifies_only_the_states_the_seed_names
    model: int_closures__notice_state_shapes
    description: >
      An invented Utah-sized box, in its own frame (true scale at its southern
      edge, 37 N): a vertex about 55 m off the straight south edge is dropped
      at 250 m, and the 1.1 km jog in the north edge is kept, at 4 decimal
      places, the shell wound counterclockwise. The Colorado row is not named
      by the seed and is left out; the seed's OR and WA have no row and add
      nothing.
    given:
      - input: ref('notice_states')
        rows:
          - {source_key: blm_fire_restrictions_utah, states: UT, evidence: Fixture}
          - {source_key: blm_fire_restrictions_oregon_washington, states: OR WA, evidence: Fixture}
      - input: ref('stg_census__states')
        format: sql
        rows: |
          select
              state,
              state_name,
              st_geomfromgeojson(shape) as geom,
              cast('2026-10-01 00:00:00+00' as timestamptz) as _loaded_at
          from (values
              ('UT', 'Utah', '{"type":"Polygon","coordinates":[[[-114.05,37.0],[-111.55,37.0005],[-109.05,37.0],[-109.05,42.0],[-111.55,42.0],[-111.55,42.01],[-114.05,42.01],[-114.05,37.0]]]}'),
              ('CO', 'Colorado', '{"type":"Polygon","coordinates":[[[-109.05,37.0],[-102.04,37.0],[-102.04,41.0],[-109.05,41.0],[-109.05,37.0]]]}')
          ) as states (state, state_name, shape)
      - input: ref('int_sources__publication')
        rows:
          - {source_key: census_tiger_states, may_publish: true}
    expect:
      rows:
        - {state: UT, state_name: Utah, frame: '+proj=eqc +lat_ts=37.0 +lon_0=-111.551 +datum=NAD83 +units=m +no_defs', phone_geometry: '{"type":"Polygon","coordinates":[[[-114.05,37.0],[-109.05,37.0],[-109.05,42.0],[-111.55,42.0],[-111.55,42.01],[-114.05,42.01],[-114.05,37.0]]]}', edge_margin_m: 500.0}

  - name: int_closures__notice_state_shapes_holds_every_shape_while_tiger_may_not_publish
    model: int_closures__notice_state_shapes
    description: >
      TIGER's state shapes reach a phone only while int_sources__publication
      lets census_tiger_states publish, as every other phone file's rows do.
      Held back, the model has no row, so pub_conditions_notice_states writes
      nothing and the phone keeps its last file (`keep_last_file`).
    given:
      - input: ref('notice_states')
        rows:
          - {source_key: blm_fire_restrictions_utah, states: UT, evidence: Fixture}
      - input: ref('stg_census__states')
        format: sql
        rows: |
          select
              'UT' as state,
              'Utah' as state_name,
              st_geomfromgeojson('{"type":"Polygon","coordinates":[[[-114.05,37.0],[-109.05,37.0],[-109.05,42.0],[-114.05,42.0],[-114.05,37.0]]]}') as geom,
              cast('2026-10-01 00:00:00+00' as timestamptz) as _loaded_at
      - input: ref('int_sources__publication')
        rows:
          - {source_key: census_tiger_states, may_publish: false}
    expect:
      rows: []

  - name: int_closures__atc_checked_finds_what_file_problems_finds
    description: >
      One row per branch of lib/atc_updates.py's row_problems() and the file's
      repeat check, each named after the test in tests/test_lib_atc_updates.py
      it stands in for, plus two the extract's verbatim landing made
      checkable: a mile written "476.6" (row 25) and a misspelt
      `Obstructs_Trail` (row 26), both refused as the Python refuses them.
      Each expected problem is the Python's, with values rendered as JSON;
      tests/test_dbt_conditions_parity.py runs row_problems() over these same
      rows and fails where the two disagree, except row 36, a source_url with
      a leading space, and rows 39-42, links back into the app (decision 94:
      the app's own site, a link with no host, a sign-in token on another
      site, and the app's host in capitals with a trailing dot), which this
      model refuses on purpose. Rows 0, 1, 3, 7-12, 37 and 43 are fine: a real
      update, a point closure, the far end of the trail, the six categories
      only page ten ever showed, an upper-case scheme, and a query whose key
      only contains the letters of `code`.
