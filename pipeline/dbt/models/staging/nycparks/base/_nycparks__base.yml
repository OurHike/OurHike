version: 2

models:
  - name: base_nycparks__nyc_drinking_fountains
    data_tests:
      # Warns when the dedupe dropped any row, each an exact copy
      # (duplicates_are_exact on the raw table), and is an error once the
      # copies are half the raw table (the generic test's).
      - equal_rowcount_to_raw:
          arguments:
            compare_model: source('nycparks', 'raw_nycparks__nyc_drinking_fountains')
    description: >
      NYC Parks Drinking Fountains (outdoor types), every row, keyed and
      deduped. Nothing reads it yet: the stage-3 unions of #1793 do.
    columns:
      - name: poi_key
        description: >
          The row's key: dbt_utils.generate_surrogate_key over
          nyc_drinking_fountains, "system", gispropnum, the registry key first
          and then the columns measured unique for this layer.
        data_tests: [not_null, unique]
  - name: base_nycparks__nyc_park_polygons
    data_tests:
      # Warns when the dedupe dropped any row, each an exact copy
      # (duplicates_are_exact on the raw table), and is an error once the
      # copies are half the raw table (the generic test's).
      - equal_rowcount_to_raw:
          arguments:
            compare_model: source('nycparks', 'raw_nycparks__nyc_park_polygons')
    description: >
      NYC Parks Properties (park boundaries), every row, keyed and deduped.
      Nothing reads it yet: the stage-3 unions of #1793 do.
    columns:
      - name: park_key
        description: >
          The row's key: dbt_utils.generate_surrogate_key over
          nyc_park_polygons and gispropnum, the registry key first and then
          the column measured unique for this layer (2,061 of 2,061 live rows,
          2026-10-03).
        data_tests: [not_null, unique]
  - name: base_nycparks__nyc_parks_trails
    data_tests:
      # Warns when the dedupe dropped any row, each an exact copy
      # (duplicates_are_exact on the raw table), and is an error once the
      # copies are half the raw table (the generic test's).
      - equal_rowcount_to_raw:
          arguments:
            compare_model: source('nycparks', 'raw_nycparks__nyc_parks_trails')
    description: >
      NYC Parks Trails (five boroughs), every row, keyed and deduped. Nothing
      reads it yet: the stage-3 unions of #1793 do.
    columns:
      - name: trail_segment_key
        description: >
          The row's key: dbt_utils.generate_surrogate_key over
          nyc_parks_trails, geometry_key(geom), date_collected, the registry
          key first and then the columns measured unique for this layer.
        data_tests: [not_null, unique]
  - name: base_nycparks__nyc_public_restrooms
    data_tests:
      # Warns when the dedupe dropped any row, each an exact copy
      # (duplicates_are_exact on the raw table), and is an error once the
      # copies are half the raw table (the generic test's).
      - equal_rowcount_to_raw:
          arguments:
            compare_model: source('nycparks', 'raw_nycparks__nyc_public_restrooms')
    description: >
      NYC Public Restrooms (operational), every row, keyed and deduped.
      Nothing reads it yet: the stage-3 unions of #1793 do.
    columns:
      - name: poi_key
        description: >
          The row's key: dbt_utils.generate_surrogate_key over
          nyc_public_restrooms, geometry_key(geom), the registry key first and
          then the columns measured unique for this layer.
        data_tests: [not_null, unique]
