# GENERATED by pipeline/make_dbt_staging.py from sources.json
# and the extract's club folders; edit them or it, never this file.
version: 2

models:
  - name: int_podcasts__club_unioned
    description: >
      Every podcasts row of the 20 registered sources pipeline/make_dbt_staging.py stages for
      this type (decision 54 wave 3), unioned by name: one episode of a club's own podcast
      feed, or one item of NPS's audio list. Each row carries its source's registry key, the
      club folder that extracted it, the base model's key, the conformed columns below and its
      source's own columns, prose left out, as `properties`. No geometry: a row is placed,
      where it is placed at all, by its own fields in `properties`. Unfiltered: whatever reads
      it keeps int_sources__publication's verdict.
    columns:
      - name: episode_key
        description: The base model's key, carried; unique across the union because the registry key is its first input.
        data_tests: [not_null, unique]
      - name: source_key
        description: The layer's sources.json key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_registry__sources')
                field: source_key
      - name: club
        description: The extract folder that landed the row (trail_orgs.json's slug, `-` written `_`).
        data_tests: [not_null]
      - name: title
        description: >
          The episode's title as its feed or list states it.
      - name: published
        description: >
          The episode's publication date as its feed states it, unparsed (RSS pubDate);
          null for an NPS audio item, which states none.
      - name: link
        description: >
          The episode's own page, as its feed or list links it; null where it links none.
      - name: audio_url
        description: >
          The audio file's URL (an RSS enclosure, or NPS's first version), linked and
          never fetched.
      - name: properties
        description: The base row's own columns, under dlt's names, as JSON, its prose left out (decision 55).
      - name: _loaded_at
        description: When the extract landed the row (dlt's load stamp).
