    description: >
      export_trails.load_line_sources() (TL01), which no pytest of its own
      names: every registry entry with blaze metadata that is not another
      organization's layer, in the registry's order. A source with no kind is
      an arcgis_feature_layer; a new A.T. line source with no staging model is
      kept and flagged unstaged, which the accepted_values test on `staged`
