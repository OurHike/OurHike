# GENERATED by pipeline/make_dbt_staging.py from sources.json
# and the extract's club folders; edit them or it, never this file.
version: 2

models:
  - name: int_photos__club_unioned
    description: >
      Every photos row of the 1 registered sources pipeline/make_dbt_staging.py stages for
      this type (decision 54 wave 3), unioned by name: one photo's manifest row: its URL, its
      own credit and licence and its page, never its pixels. Each row carries its source's
      registry key, the club folder that extracted it, the base model's key, the conformed
      columns below and its source's own columns, prose left out, as `properties`. No
      geometry: a row is placed, where it is placed at all, by its own fields in `properties`.
      Unfiltered: whatever reads it keeps int_sources__publication's verdict.
    columns:
      - name: photo_key
        description: The base model's key, carried; unique across the union because the registry key is its first input.
        data_tests: [not_null, unique]
      - name: source_key
        description: The layer's sources.json key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_registry__sources')
                field: source_key
      - name: club
        description: The extract folder that landed the row (trail_orgs.json's slug, `-` written `_`).
        data_tests: [not_null]
      - name: title
        description: >
          The photo's title as its source states it.
      - name: image_url
        description: >
          The image file's URL, linked and never fetched (bytes never enter DuckDB,
          decision 4).
      - name: credit
        description: >
          The photo's own credit line, as its source states it for that photo.
      - name: licence
        description: >
          The photo's own licence or constraint, as its source states it for that photo
          (NPS's constraintsInfo.constraint): never a park's, an account's or a site's
          licence.
      - name: link
        description: >
          The photo's own page.
      - name: properties
        description: The base row's own columns, under dlt's names, as JSON, its prose left out (decision 55).
      - name: _loaded_at
        description: When the extract landed the row (dlt's load stamp).
