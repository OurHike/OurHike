version: 2

seeds:
  - name: poi_type_mapping
    description: >
      Source-system codes -> the one unified poi_type, transcribed from code
      this repository already trusts rather than authored here: the opentrail
      rows' labels are fetch_opentrail.py's ICON_LEGEND verbatim, their
      poi_type/confidence pairs are export_poi.py's OPENTRAIL_ICON_MAP (an
      icon that module deliberately does not map has an empty poi_type -
      see its module docstring for why 'c' and 't' stay unmapped and 's'
      means water), and the atc rows mirror export_poi.py's DIRECT_SOURCES
      - every layer that module publishes, plus bridges with an empty
      poi_type because the layer is POI-shaped and deliberately unpublished
      (#99 records the product call as open).
      pipeline/tests/test_dbt_seed_sync.py fails CI the moment this file
      and those Python constants drift apart (DBT.md's duplication-risk
      note).

      THE `dec` ROWS ARRIVED WITH PHASE D (#100) AND MIRROR A DIFFERENT
      AUTHORITY: sources.json itself. Six NYS DEC layers declare a
      layer-wide `poi_type` in the registry, and those six declarations are
      transcribed here verbatim; the confidence is not a fresh call either,
      it is what export_nearby_poi.py's `public_verdict()` returns for a
      layer with no `public_flag_sets_confidence` - and the sync test calls
      that function rather than restating its answer.

      WHY THERE ARE NO `oprhp`, `nynjtc` OR `mohonk` ROWS, since all three
      are staged and two of them do publish POIs. This seed maps a per-layer
      or per-code vocabulary to one poi_type. `oprhp_facilities` and
      `dec_backcountry_features` are typed PER ROW instead, through
      export_nearby_poi.py's OPRHP_SUB_ASSET_TYPES / DEC_ASSET_TYPES value
      maps, each with its own allowlist and its own NAMED_EXCLUSIONS - the
      water holdbacks among them. Copying those maps here would be a second
      home for a product decision that already has one, so the two layers
      appear in neither this seed nor `int_pois_unioned`. NYNJTC's and
      Mohonk's layers are trail lines and mint no POI at all.
    config:
      column_types:
        source_system: varchar
        code: varchar
        label: varchar
        poi_type: varchar
        confidence: varchar
    columns:
      - name: source_system
        description: Which fetcher's vocabulary the code belongs to.
        data_tests:
          - not_null
          - accepted_values:
              # WIDENED BY PHASE D (#100), and worth recording that it needed
              # widening: a two-value closed domain was the one place the
              # Phase A slice really had baked in "the A.T." where "a trail"
              # was meant. It is still a closed list on purpose - a
              # source_system nobody added a row for is a typo, not a new
              # organization - but adding one is now a one-line change here
              # rather than a re-think.
              values: ["atc", "opentrail", "dec"]
      - name: code
        description: >
          The raw value as upstream sends it - an opentrail `icon` letter,
          or an ATC layer key from sources.json.
        data_tests:
          - not_null
      - name: label
        description: The documented upstream meaning, transcribed not invented.
      - name: poi_type
        description: >
          The unified poi_type this code maps to. Empty means "deliberately
          unmapped" - the code is documented so an accepted_values test can
          hold the raw column to the full legend, but no POI is minted from
          it (lib/poi_schema.py's omit-don't-guess posture).
        data_tests:
          # lib/poi_schema.py's POI_TYPES verbatim - the full unified
          # vocabulary, not just the types this seed currently mints, so
          # a new mapping row only touches this file when the VOCABULARY
          # grows (which is a lib/poi_schema.py decision first).
          # tests/test_dbt_seed_sync.py holds the seed inside POI_TYPES
          # from the Python side.
          - accepted_values:
              values:
                - shelter
                - campsite
                - water
                - resupply
                - crossing
                - viewpoint
                - parking
                - privy
      - name: confidence
        description: >
          lib/poi_schema.py's CONFIDENCE_* tier for POIs minted from this
          code; empty exactly where poi_type is empty.
        data_tests:
          - accepted_values:
              values: ["high", "low"]
