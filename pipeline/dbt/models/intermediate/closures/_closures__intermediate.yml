version: 2

models:
  - name: int_closures__atc_checked
    description: >
      Every row of reference/atc_updates.json, read field by field and checked
      against lib/atc_updates.py's file_problems() in row_problems()'s order
      (CL01-CL06), with every problem the row has in `problems`. An empty
      list means the row publishes; int_closures__gate holds ATC's whole file
      back on any problem (CL05), and reads the review from the file landed
      whole (base_atc__atc_updates).
    columns:
      - name: atc_update_row_key
        description: base_atc__atc_trail_updates's key, the file and the row's place in it.
        data_tests: [not_null, unique]
      - name: file_row
        description: The row's place in the file, from 0. The published order.
      - name: row_label
        description: The row as lib/atc_updates.py names it in a message, its atc_id or "update N".
      - name: atc_id
        description: ATC's slug for the update, where it is a string, as written.
      - name: title
        description: The update's headline as written, never stripped; null where it is not a string.
      - name: states
        description: The row's `states` as written, where it is a list, as JSON.
      - name: start_mile_text
        description: >
          The NOBO mile the update starts at, as the reviewer wrote the number
          (CL01). Text, because dbt 2.0.6's unit tests compare a DOUBLE only to
          one decimal; int_closures__unioned casts it. A string such as "476.6"
          is null here and a problem, as it is "not a mile" to
          lib/atc_updates.py.
      - name: end_mile_text
        description: The NOBO mile it ends at, on the same terms.
      - name: obstructs_trail
        description: Whether a hiker is stopped from walking through, where the reviewer wrote a real boolean.
      - name: updated_at
        description: ATC's own last edit of the notice, as the reviewer wrote it.
      - name: problems
        description: Every problem with the row, each prefixed by its label, in row_problems()'s order, then CL04's repeat.
      - name: problem
        description: The same problems joined by " | ", or null where the row is fine.
      - name: published_row
        description: >
          The row as lib/atc_updates.py's published_rows() publishes it, each
          field's JSON as written plus source_key and review_state, for
          pub_conditions_atc_updates.

  - name: int_closures__atc_automatic
    description: >
      Every update ATC's trail-updates sitemap lists, as its page parsed
      (base_atc__atc_trail_updates_pages), judged by lib/atc_updates.py's
      auto_publish_refusal() in its order (CL07, CL08, CL10): `refusal` in the
      Python's words, null where the update publishes without a person. For
      those, the row auto_row() writes, with obstructs_trail forced false
      (CL09). int_closures__unioned takes the rows that publish; the rest stay
      here for the job log, and `actionable` marks the ones
      propose_atc_updates.py proposes to a person (CL12).
    data_tests:
      # CL09, the rail on this whole path: an update nobody here has read never
      # draws a barrier across the trail.
      - dbt_utils.expression_is_true:
          name: an_automatic_atc_row_never_obstructs_the_trail
          arguments:
            expression: "not obstructs_trail"
      # A row that publishes carries the whole of auto_row()'s row.
      - dbt_utils.expression_is_true:
          name: an_automatic_atc_row_publishes_with_its_span_and_stamp
          arguments:
            expression: >
              start_mile_text is not null and end_mile_text is not null
              and updated_at is not null and published_row is not null
          config:
            where: "publishes"
    columns:
      - name: atc_trail_update_page_key
        description: base_atc__atc_trail_updates_pages's key, the registry key and ATC's slug.
        data_tests: [not_null, unique]
      - name: slug
        description: ATC's slug, which an automatic row publishes as `atc_id`.
        data_tests: [not_null, unique]
      - name: sitemap_row
        description: The update's place in the sitemap, from 0.
      - name: refusal
        description: >
          Why the update may not publish without a person, in
          auto_publish_refusal()'s words; null where it publishes.
      - name: publishes
        description: Whether the update publishes without a person, unreviewed.
        data_tests: [not_null]
      - name: actionable
        description: >
          Whether the refusal is one a person can act on: every reason but a
          reviewed slug and an update older than the review, the two that
          export_atc_updates.py's job log and propose_atc_updates.py leave out.
        data_tests: [not_null]
      - name: atc_id
        description: The slug, as an automatic row's id.
      - name: title
        description: ATC's headline, str.strip()'d as auto_row() strips it.
      - name: category
        description: ATC's category, one this build knows where the row publishes.
      - name: states
        description: The chip's states, as JSON.
      - name: start_mile_text
        description: >
          The NOBO mile the agreed reference starts at, as the parse read it,
          text (dbt 2.0.6's unit tests compare a DOUBLE only to one decimal);
          null where the update does not publish.
      - name: end_mile_text
        description: The NOBO mile it ends at, the start for a point; null where it does not publish.
      - name: obstructs_trail
        description: False, always, and read from nothing (CL09).
        data_tests: [not_null]
      - name: updated_at
        description: ATC's dateModified in UTC to the second, `...Z`, as _as_utc_stamp() writes it; null where it does not publish.
      - name: source_url
        description: The update's own page.
      - name: published_row
        description: >
          The row as auto_row() writes it, for pub_conditions_atc_updates, each
          mile the JSON number the parse read; null where it does not publish.

  - name: int_closures__nynjtc_checked
    description: >
      NYNJTC's Trail Alerts posts, read as lib/nynjtc_alerts.py's parse_alert()
      reads them and shaped as published_rows() publishes them (WN05-WN08),
      with why a post cannot be read in `problems`. int_closures__gate holds
      NYNJTC's file back on any problem, or on a category with no posts.
    columns:
      - name: trail_alert_key
        description: base_nynjtc__nynjtc_trail_alerts's key, the post's WordPress id.
        data_tests: [not_null, unique]
      - name: notice_id
        description: >
          `nynjtc_trail_alerts:<slug>`, the published notice_id, or
          `nynjtc_trail_alerts:post-<id>` for a post with no readable slug or a
          slug another post shares.
        data_tests: [not_null, unique]
      - name: slug
        description: The post's slug, stripped, as parse_alert() strips it.
      - name: title
        description: The title as _text_of() reads it, tags out and entities unescaped twice.
      - name: locality
        description: The regions, else the states, else the parks a post is tagged with, by name; empty where none.
      - name: source_url
        description: The post's link, as NYNJTC serves it.
      - name: modified_at
        description: NYNJTC's own last edit of the alert.
      - name: updated_at
        description: The same, as the published text, to the second with a Z.
      - name: problems
        description: Why the post cannot be read, each prefixed by its slug or id.
      - name: problem
        description: The same joined by " | ", or null where the post reads.
      - name: place_terms
        description: >
          The post's trail and park tags as a JSON list of `taxonomy:slug`
          (features/ORG_NOTICES.md section 4), trail tags first, each in the
          post's own order; null where it carries neither. Read by
          pub_conditions_notices for the `org_terms` place, which places
          nothing until a reviewed table maps a term to a feature.

  - name: int_closures__oprhp_areas
    description: >
      NYS Parks' temporary closed areas, one row per area with a geometry,
      its reason and place stripped and null where blank, and no dates
      (export_nearby_trails.py's load_closure_areas(), CL13).
    columns:
      - name: closure_key
        description: stg_oprhp__trail_closures's key.
        data_tests: [not_null, unique]
      - name: source_row
        description: >
          The area's place in the layer (stg_oprhp__trail_closures), which
          breaks apply_area_closures()' tie between two areas a trail
          overlaps equally: the first wins.
        data_tests: [not_null, unique]
      - name: closure_reason
        description: The layer's `Name`, its whole reason as prose, stripped.
      - name: closure_place
        description: The layer's `Descript`, where it is, stripped.
      - name: geom_geojson
        description: >
          The closed area in lon/lat, as GeoJSON text: a GEOMETRY column in a
          unit-tested model's output panics dbt 2.0.6, and contracted marts
          cannot hold one (the closures mart's geom_geojson says why).
        data_tests: [not_null]

  - name: int_closures__ourhike_checked
    description: >
      OurHike's moderator-verified closures, each with whether it blocks the
      trail (its status, read as client/src/lib/closureBanner.ts reads it) and
      a problem for a row that is not verified (CL15), or whose mile or
      coordinate is not a finite number.
    columns:
      - name: ourhike_closure_key
        description: base_ourhike__closures's key.
        data_tests: [not_null, unique]
      - name: obstructs_trail
        description: >
          True for `closed` and `reroute_available`, false for `open` (a
          reopened closure), null for a status the backend does not define.
      - name: problems
        description: Why the row cannot publish; empty where it can.

  - name: int_closures__unioned
    description: >
      Every notice, closed area and closure the closures and warnings marts
      are split from, one row each, by name, nothing filtered: ATC's reviewed
      Trail Updates, the updates ATC posted since that review which
      int_closures__atc_automatic publishes without a person (review_state
      `auto`, obstructs_trail false), NYNJTC's Trail Alerts, NYS Parks'
      temporary closed areas and OurHike's verified closures, each with
      `obstructs_trail`, `review_state` and its source's `problems`.
    columns:
      - name: notice_id
        description: >
          `<source key>:<the source's own id>`, unique across every source;
          the closures and warnings marts' key.
        data_tests: [not_null, unique]
      - name: source_key
        description: >
          The registry key, or the unregistered key int_sources__publication
          reads it under. The hand-written branches' four are held to their
          list; a club notice's is any notice source's (seeds/notice_readers.csv).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [atc_trail_updates, nynjtc_trail_alerts, oprhp_trail_closures, ourhike_closures]
              config:
                where: "not starts_with(notice_kind, 'club_')"
          - relationships:
              arguments:
                to: ref('notice_readers')
                field: source_key
              config:
                where: "starts_with(notice_kind, 'club_')"
      - name: review_state
        description: Who stands behind the row; `auto` for an ATC update nobody here has read, which its gate published.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [reviewed, not_reviewed, org_published, moderator_verified, auto]
      - name: obstructs_trail
        description: >
          Whether a hiker is stopped from walking through, as its source says;
          null where nobody has classified it (every NYNJTC alert).
      - name: problems
        description: Why the row cannot publish, from its source's checks; empty where it can.
        data_tests: [not_null]

  - name: int_closures__club_notices
    description: >
      Every generated club notice source's rows, read by decision 53's phase
      C rules (pipeline/ELT.md): one row per notice in the closures family's
      columns, with `obstructs_trail` true only where the source's own status
      says closed and its own end has not passed, and `held_because` set where
      the notice may not publish as current. Nothing is dropped here; the
      finals leave out a held row. Place is the source's own geometry only.
    columns:
      - name: notice_id
        description: "`<source key>:<the source's own id>`, unique across every source."
        data_tests: [not_null, unique]
      - name: notice_type
        description: closures or warnings, the club file that declares the source.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [closures, warnings]
      - name: obstructs_trail
        description: >
          True only where the source files the notice under closures, its own
          status field holds a value notice_status_values reads as
          `closes_trail`, and its own end date has not passed. Null
          otherwise, never false: nobody here classified it.
        data_tests:
          - accepted_values:
              arguments:
                values: [true]
      - name: held_because
        description: >
          Why the notice may not publish as current, in words for the job log:
          its own end date has passed, its own order was rescinded, its own
          start has not come, or its own status says not current. Null where
          it may.
      - name: key_versions
        description: >
          How many different raw rows share the notice's key, counted by its
          base model before the dedupe; int_closures__gate holds a source with
          any over one (decision 40 allows only exact copies).
      - name: geom_geojson
        description: The source's own geometry, in OGC:CRS84 as GeoJSON, or null where it gives none.
      - name: updated_at
        description: The source's own edit stamp, ISO 8601 UTC, or null where it gives none; never the load time.

  - name: int_closures__window_carried
    description: >
      A feed is a window, not a list (decision 53, phase C): every notice of
      a `window` source (seeds/notice_readers.csv) that the previous build's
      closures or warnings mart held and this build's read no longer
      carries, with its last content, unless a person marked it lifted
      (seeds/notice_marks.csv). int_closures__final and int_warnings__final
      carry it, so the snapshot never closes it on absence alone.
    columns:
      - name: notice_id
        description: The notice, as the closures or warnings mart keys it.
        data_tests: [not_null, unique]
      - name: mart
        description: closures or warnings, the mart that held it.
        data_tests:
          - accepted_values:
              arguments:
                values: [closures, warnings]

  - name: int_closures__held_carried
    description: >
      A notice source int_closures__gate holds back keeps its last good rows
      (decision 53, phase D): every row of such a source that the previous
      build's closures or warnings history held as current, with every
      column the mart had, and `carried_since`, the start of the first build
      that carried it. Only a source the extract declares a notice resource
      for, and only where int_sources__publication lets it publish: a
      publication hold is a decision, never a failed read. A notice
      int_closures__window_carried carries is left to it.
      int_closures__final and int_warnings__final add these rows back.
    columns:
      - name: notice_id
        description: The notice, as the closures or warnings mart keys it.
        data_tests: [not_null, unique]
      - name: mart
        description: closures or warnings, the mart that held it.
        data_tests:
          - accepted_values:
              arguments:
                values: [closures, warnings]
      - name: carried_since
        description: >
          When carrying began: the history's own value for a row carried
          before, otherwise this build's start.
        data_tests: [not_null]

  - name: int_closures__notice_tables
    description: >
      Whether each club notice source's raw table is in this warehouse
      (decision 61): the hourly warehouse can lack a notices table, and a
      generated base model reads an absent one as empty, so
      int_closures__gate holds such a source with this as its reason rather
      than passing it as having no notices. Read from DuckDB's own
      catalogue at build time.
    columns:
      - name: raw_table
        description: The raw table, one row each (seeds/notice_readers.csv).
        data_tests: [not_null, unique]
      - name: is_present
        description: Whether the table is in this warehouse's `raw` schema.
        data_tests: [not_null]

  - name: int_closures__gate
    description: >
      The per-source gate: one row per source a conditions file is written
      from, with `passed` and `held_because`, so one bad ATC row holds back
      ATC's file and nothing else (pipeline/ELT.md, "A whole-file gate becomes
      a per-source gate"). The marts keep only the notice sources that pass.
      Each pub_conditions_* writer names its row in `meta.gate` and selects no
      row while it is held, so the phone keeps its last file and every other
      file is written; publish.py then fails the run for each held file.
      ATC's review is read from the file landed whole, so an empty reviewed
      file passes and publishes `atc_updates: []`, as export_atc_updates.py
      does.
    data_tests:
      # Warns, never fails: failing the build would hold back every source
      # for one. publish.py names each held file and why, after the upload.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "passed"
          config:
            severity: warn
    columns:
      - name: source_key
        description: >
          The source: one row for every registered notice source
          seeds/notice_readers.csv names (decision 53, phase C), held where
          its raw table is not in this warehouse or the run log never shows
          it being read, and one each for
          OurHike's closures and reports, NWS's alerts and
          reference/work_projects.json, which have no sources.json row.
        data_tests: [not_null, unique]
      - name: rows_total
        description: >
          The source's rows: in int_closures__unioned for a notice source,
          else its public reports, landed alerts or work-project rows.
      - name: rows_invalid
        description: Its rows with a problem, or for reports a number that is not finite.
        data_tests: [not_null]
      - name: may_publish
        description: >
          int_sources__publication's answer for the source, false where it has
          no row. The marts join that model themselves; it is here so a writer
          reads one answer per source.
        data_tests: [not_null]
      - name: reviewed_at
        description: >
          ATC's `reviewed_at`, as written in the file landed whole, which
          pub_conditions_atc_updates publishes; null for every other source,
          which no person reviews as a file.
      - name: passed
        description: Whether its rows may reach the marts and its file may be written.
        data_tests: [not_null]
      - name: held_because
        description: Why not, in words for the job log; null where it passed.
      - name: awaiting_review
        description: >
          True only for ATC's file or reference/work_projects.json when nobody
          has reviewed it yet, the holds export_atc_updates.py and
          export_work_projects.py treat as no failure (each writes nothing and
          exits 0). The writer selects no row, as for any hold, and publish.py
          does not fail the run for this one.
        data_tests: [not_null]

  - name: int_closures__work_projects_checked
    description: >
      reference/work_projects.json's rows, each with its share of
      lib/work_projects.py's file_problems() in its words (CL17): its
      repeated id, then row_problems(), and the row as published_rows()
      writes it when it has neither. One more row, with no position, is the
      file's own: its review, as is_reviewed() reads it, and its own
      problems (`rows` not a list, the retired `ua_sample_rows`).
      pub_conditions_work_projects reads only this model, writes nothing for
      an unreviewed file, and fails while any row here has a problem.
    columns:
      - name: work_project_row_key
        description: The file and the row's place in it, or `file` for the file's own problems.
        data_tests: [not_null, unique]
      - name: row_position
        description: The row's place in `rows`, from 0, which is the published order; null on the file's own row.
      - name: work_project_id
        description: The row's `id`, where it is a string.
      - name: row_label
        description: How a problem names the row, as f"{row_id}" names it, `<no id>` without one.
      - name: duplicate_problems
        description: The repeated-id problem, where an earlier row has this string id.
      - name: row_problems
        description: row_problems()'s list for the row, in its order; the file's own problems on the file's row.
      - name: problem
        description: The row's problems, repeated id first, joined by " | "; null for a row with none.
      - name: published_row
        description: >
          The row as published_rows() writes it: as written, then each of
          status (`upcoming`), capacity, description, lat, lon and mile (null)
          it lacks; null for a row with a problem.
      - name: reviewed_at
        description: The file's `reviewed_at` where it is a string, as written; on the file's own row only.
      - name: is_reviewed
        description: >
          lib/work_projects.py's is_reviewed(): a string, not blank once
          stripped, whose first ten characters date.fromisoformat() reads,
          YYYY-MM-DD or YYYYMMDD (macro python_date_fromisoformat(), which
          reads no ISO week date); on the file's own row only.
  - name: int_closures__final
    description: >
      The closures mart's rows before their row dates (decision 57):
      what models/marts/closures/closures.sql held until then, every
      contracted column but _first_seen_at and _changed_at.
      int_closures__history snapshots it, and the mart reads that snapshot.
    columns:
      - name: closure_id
        description: The mart's key.
        data_tests: [not_null, unique]
  - name: int_closures__notice_state_shapes
    description: >
      Decision 76: the shape of every state seeds/notice_states.csv names,
      from the Census Bureau's TIGER/Line file, simplified for a phone
      (Douglas-Peucker at `notice_state_simplify_tolerance_m` in the state's
      own equirectangular frame, 4 decimal places), with the margin the phone
      holds a route to (`notice_state_edge_margin_m`). The model's header has
      the measurement behind both, and
      assert_notice_state_shapes_stay_inside_their_edge_margin re-measures it
      every build. pub_conditions_notice_states writes it; no map draws it.
    columns:
      - name: state
        description: The two-letter USPS code, as the seed and notices.json's `states` name it.
        data_tests: [not_null, unique]
      - name: state_name
        description: The state's name, as the Census Bureau spells it.
        data_tests: [not_null]
      - name: frame
        description: The PROJ string of the state's equirectangular frame, which the simplification and the offset test both measure in.
      - name: phone_geometry
        description: The simplified shape as GeoJSON, rings wound as RFC 7946 asks of a writer.
        data_tests: [not_null]
      - name: edge_margin_m
        description: How far inside the shape a route vertex must be before the phone counts it as in the state.
        data_tests: [not_null]

unit_tests:
  - name: int_closures__notice_state_shapes_simplifies_only_the_states_the_seed_names
    model: int_closures__notice_state_shapes
    description: >
      An invented Utah-sized box, in its own frame (true scale at its southern
      edge, 37 N): a vertex about 55 m off the straight south edge is dropped
      at 250 m, and the 1.1 km jog in the north edge is kept, at 4 decimal
      places, the shell wound counterclockwise. The Colorado row is not named
      by the seed and is left out; the seed's OR and WA have no row and add
      nothing.
    given:
      - input: ref('notice_states')
        rows:
          - {source_key: blm_fire_restrictions_utah, states: UT, evidence: Fixture}
          - {source_key: blm_fire_restrictions_oregon_washington, states: OR WA, evidence: Fixture}
      - input: ref('stg_census__states')
        format: sql
        rows: |
          select
              state,
              state_name,
              st_geomfromgeojson(shape) as geom,
              cast('2026-10-01 00:00:00+00' as timestamptz) as _loaded_at
          from (values
              ('UT', 'Utah', '{"type":"Polygon","coordinates":[[[-114.05,37.0],[-111.55,37.0005],[-109.05,37.0],[-109.05,42.0],[-111.55,42.0],[-111.55,42.01],[-114.05,42.01],[-114.05,37.0]]]}'),
              ('CO', 'Colorado', '{"type":"Polygon","coordinates":[[[-109.05,37.0],[-102.04,37.0],[-102.04,41.0],[-109.05,41.0],[-109.05,37.0]]]}')
          ) as states (state, state_name, shape)
      - input: ref('int_sources__publication')
        rows:
          - {source_key: census_tiger_states, may_publish: true}
    expect:
      rows:
        - {state: UT, state_name: Utah, frame: '+proj=eqc +lat_ts=37.0 +lon_0=-111.551 +datum=NAD83 +units=m +no_defs', phone_geometry: '{"type":"Polygon","coordinates":[[[-114.05,37.0],[-109.05,37.0],[-109.05,42.0],[-111.55,42.0],[-111.55,42.01],[-114.05,42.01],[-114.05,37.0]]]}', edge_margin_m: 500.0}

  - name: int_closures__notice_state_shapes_holds_every_shape_while_tiger_may_not_publish
    model: int_closures__notice_state_shapes
    description: >
      TIGER's state shapes reach a phone only while int_sources__publication
      lets census_tiger_states publish, as every other phone file's rows do.
      Held back, the model has no row, so pub_conditions_notice_states writes
      nothing and the phone keeps its last file (`keep_last_file`).
    given:
      - input: ref('notice_states')
        rows:
          - {source_key: blm_fire_restrictions_utah, states: UT, evidence: Fixture}
      - input: ref('stg_census__states')
        format: sql
        rows: |
          select
              'UT' as state,
              'Utah' as state_name,
              st_geomfromgeojson('{"type":"Polygon","coordinates":[[[-114.05,37.0],[-109.05,37.0],[-109.05,42.0],[-114.05,42.0],[-114.05,37.0]]]}') as geom,
              cast('2026-10-01 00:00:00+00' as timestamptz) as _loaded_at
