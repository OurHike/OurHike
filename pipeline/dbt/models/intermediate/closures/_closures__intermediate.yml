  - name: int_closures__ourhike_checked_reads_status_as_closure_banner_does
    description: >
      OurHike's closure statuses, read as client/src/lib/closureBanner.ts
      reads them: closed and reroute_available block the trail, open (a
      reopened closure) does not, and a status the backend does not define is
      unknown. A row the query should never have landed, one not moderator-
      verified, is a problem (CL15, gate 4).
    model: int_closures__ourhike_checked
    given:
      - input: ref('base_ourhike__closures')
        rows:
          - {ourhike_closure_key: c1, closure_uuid: u1, closure_status: closed, moderation_status: verified}
          - {ourhike_closure_key: c2, closure_uuid: u2, closure_status: reroute_available, moderation_status: verified}
          - {ourhike_closure_key: c3, closure_uuid: u3, closure_status: open, moderation_status: verified}
          - {ourhike_closure_key: c4, closure_uuid: u4, closure_status: washed_out, moderation_status: verified}
          - {ourhike_closure_key: c5, closure_uuid: u5, closure_status: closed, moderation_status: submitted}
    expect:
      rows:
        - {closure_uuid: u1, obstructs_trail: true, problem: null}
        - {closure_uuid: u2, obstructs_trail: true, problem: null}
        - {closure_uuid: u3, obstructs_trail: false, problem: null}
        - {closure_uuid: u4, obstructs_trail: null, problem: null}
        - {closure_uuid: u5, obstructs_trail: true, problem: 'u5: moderation_status is submitted, and only a verified closure leaves the database'}

  - name: int_closures__ourhike_checked_refuses_a_number_json_cannot_carry
    description: >
      A mile or coordinate that is not a finite number is a problem, as
      write_document()'s allow_nan=False refuses it, so OurHike's closures
      are held back rather than published in a document a phone rejects.
    model: int_closures__ourhike_checked
    given:
      - input: ref('base_ourhike__closures')
        format: sql
        rows: |
          select 'c1' as ourhike_closure_key, 'u1' as closure_uuid, cast(null as timestamptz) as reported_at, 'at' as trail_id, 10.0 as start_mile_marker, 11.0 as end_mile_marker, 'flood' as reason_type, '' as note, 'closed' as closure_status, 'verified' as moderation_status, cast(null as timestamptz) as verified_at, cast(null as timestamptz) as closed_since, cast(null as timestamptz) as expected_reopen, cast(null as varchar) as reroute_url, 41.0 as start_lat, -74.0 as start_lon, cast(null as double) as end_lat, cast(null as double) as end_lon, cast(null as timestamptz) as _loaded_at
          union all
          select 'c2', 'u2', null, 'at', cast('nan' as double), 11.0, 'flood', '', 'closed', 'verified', null, null, null, null, 41.0, -74.0, null, null, null
          union all
          select 'c3', 'u3', null, 'at', 10.0, 11.0, 'flood', '', 'open', 'verified', null, null, null, null, 41.0, cast('-inf' as double), null, null, null
    expect:
      rows:
        - {closure_uuid: u1, problem: null}
        - {closure_uuid: u2, problem: 'u2: a mile or a coordinate is not a finite number, and JSON.parse on a phone rejects the whole document'}
        - {closure_uuid: u3, problem: 'u3: a mile or a coordinate is not a finite number, and JSON.parse on a phone rejects the whole document'}

  - name: int_closures__gate_holds_back_one_bad_atc_row_and_nothing_else
    description: >
      One bad ATC row holds back ATC's file and no other source's
      (pipeline/ELT.md's per-source gate), as export_atc_updates.py publishes
      nothing for a reviewed file with a bad row
      (test_a_reviewed_file_with_a_bad_row_publishes_nothing_and_fails) and
      leaves every other artifact alone. NYS Parks with no rows passes: an
      empty closures layer is a good week.
    model: int_closures__gate
    given:
      - input: ref('int_closures__unioned')
        format: sql
        rows: |
          select 'atc_trail_updates' as source_key, cast([] as varchar[]) as problems
          union all
          select 'atc_trail_updates' as source_key, ['a01: missing obstructs_trail'] as problems
          union all
          select 'nynjtc_trail_alerts' as source_key, cast([] as varchar[]) as problems
          union all
          select 'ourhike_closures' as source_key, cast([] as varchar[]) as problems
      - input: ref('int_closures__atc_checked')
        format: sql
        rows: |
          select 0 as file_row
          union all
          select 1 as file_row
      - input: ref('base_atc__atc_updates')
        rows:
          - {atc_updates_document_key: d1, document_json: '{"reviewed_at": "2026-08-24", "updates": [{}, {}]}'}
      - input: ref('int_sources__publication')
        rows:
          - {source_key: atc_trail_updates, may_publish: true}
          - {source_key: nynjtc_trail_alerts, may_publish: true}
          - {source_key: oprhp_trail_closures, may_publish: true}
          - {source_key: ourhike_closures, may_publish: true}
          - {source_key: ourhike_reports, may_publish: true}
          - {source_key: nws_alerts, may_publish: true}
          - {source_key: 'reference/work_projects.json', may_publish: true}
      - input: ref('base_ourhike__reports')
        rows: []
      - input: ref('base_nws__alerts')
        format: sql
        rows: |
          select 'k1' as nws_alert_key
      - input: ref('int_closures__work_projects_checked')
        format: sql
        rows: |
          select cast(null as bigint) as row_position, true as is_reviewed, cast([] as varchar[]) as row_problems, cast([] as varchar[]) as duplicate_problems
      - input: ref('base_extract__runs')
        format: sql
        rows: |
          select '20261003T000000.000000Z' as run_id, 'raw_nynjtc__nynjtc_trail_alerts' as table_name, 'loaded' as outcome, cast(1 as bigint) as rows_loaded, cast(1 as bigint) as count_proof
    expect:
      rows:
        - {source_key: atc_trail_updates, rows_total: 2, rows_invalid: 1, passed: false, held_because: '1 of 2 rows cannot publish, and a partial set of safety notices is worse than none'}
        - {source_key: nynjtc_trail_alerts, rows_total: 1, rows_invalid: 0, passed: true, held_because: null}
        - {source_key: oprhp_trail_closures, rows_total: 0, rows_invalid: 0, passed: true, held_because: null}
        - {source_key: ourhike_closures, rows_total: 1, rows_invalid: 0, passed: true, held_because: null}
        - {source_key: ourhike_reports, rows_total: 0, rows_invalid: 0, passed: true, held_because: null}
        - {source_key: nws_alerts, rows_total: 1, rows_invalid: 0, passed: true, held_because: null}
        - {source_key: 'reference/work_projects.json', rows_total: 0, rows_invalid: 0, passed: true, held_because: null}

