  - name: int_closures__club_notices_reads_a_hazard_category_by_its_code_its_label_or_its_words_and_never_beside_a_negating_word
    description: >
      Rule 6, one standard for every hazard source (the "apply
      standards across the orgs"), on rows modelled on the live read of
      2026-10-15. A category names its hazard where its own code, or its
      layer's label for the code (seeds/notice_category_labels.csv), is a
      listed value, compared as words: IATA stages Hunting_Reg's codes, so
      its 'Open', 'Permit' and 'Private' parcels are hunting areas by their
      labels and its 'Closed' ('No hunting') is held. A free-text category
      names it where it holds a listed value as whole words: NY Parks'
      'Big game deer hunting area.' holds 'Hunting area' and is drawn, its
      'Restricted Area/Safety Zone' and 'No Hunting' are held. A value that
      holds a listed one beside 'no', 'not', 'prohibited' or 'closed' is
      held, the word in the reason (wordings invented here: no live row
      says so), where a listed value read whole is the seed's own reading of
      it, USACE's 'Closed to Center-fire Rifles Only / ...' included.
      'Non-hunting area' and 'hunting areas' hold no 'hunting area', and a
      source listed for every row (BLM) keeps every row. Until 2026-10-15 a
      category had to equal a listed value, case and surrounding space
      aside, so the IATA and NY Parks hunting areas here were held. The
      hazard seed is mocked as the seed file is, the labels as rows of
      theirs (tests/test_dbt_closures_club_notices.py).
    model: int_closures__club_notices
    overrides:
      vars:
        # Overriding vars replaces them all in a unit test: rule 9's lead.
        notice_season_lead_days: 30
        notices_build_date: "2026-10-15"
    given:
      - input: ref('int_closures__club_notices_unioned')
