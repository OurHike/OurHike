# Publishes verified closures, verified reports and the ATC's own trail
# updates to R2, so reading any of them needs no running server.
#
# features/CONDITIONS_DELIVERY.md is the design; this is steps 1 and 3 of its
# order of work. The third artifact is features/ATC_TRAIL_UPDATES.md's, and
# it arrives by a different road: closures and reports are queried out of the
# database, while ATC's notices are baked from a file in git that a person
# reviewed (#460). Same bucket prefix, same daily clock, same publish step -
# and no credential, which is why the legs are gated separately below.
#
# TWO PATHS, ONE SWITCH PER DATA ENVIRONMENT (`PRODUCTION_PHONE_FILES` and
# `UA_PHONE_FILES` below), since #1793 — Rebuild the data platform as dlt →
# dbt: seven contracted marts, a monthly refresh, published docs, and
# lighter phone downloads. `exporters` is the bake this header describes,
# and what the schedule runs on the production leg. `dbt` is
# pipeline/ELT.md's hourly lane, and what the schedule runs on the UA leg:
# dlt extracts each leg's closures and warnings into the private raw store,
# dbt builds those marts and their pub_ writers, and publish.py publishes
# the writers' files. The exporters still write the files no dbt writer
# owns yet (drought, notes and disputes among them). ELT.md decisions 30
# and 46 soaked the dbt path on UA for three days of hourly dispatches
# before the merge, which is why a dispatch from any ref but main runs the
# UA leg alone, and decision 92 keeps UA on it from main.
#
# THE dbt PATH READS TWO STORES SINCE DECISION 61 (2026-10-04). This job's
# extract keeps the upstreams the bake published before decision 53 (NWS,
# OurHike's own rows, ATC, NYNJTC, OPRHP's closures and the work projects:
# extract/_run.py's HOURLY_JOB_TABLES), and every other club's and agency's
# notices are extract-notices.yml's, every 4 hours with up to an hour to
# read. Each hour this job adds that workflow's newest served copy to the
# warehouse before the build, so the closures and warnings marts carry every
# club's notices hourly, at the age that job last read them.
#
# HOURLY since 2026-08-15 (#720), where this used to be daily on the
# maintainer's "a closure can be latent by a day" from 2026-08-08. What
# changed is that the client now re-reads on the same clock, so the shorter
# cadence actually reaches a phone instead of only the bucket. The artifacts
# still carry their own `generated_at` and the client still renders it, so a
# hiker is told how old the answer is rather than left to assume - that was
# never a function of how often this ran.
#
# A THIRD LEG SINCE #720: this week's drought bands. It rides here rather
# than in its own workflow because it is the same shape of job - fetch
# something public, bake it into conditions/, publish - and because every
# writer of latest.json has to share the concurrency group below anyway.
# What it does NOT share is the cadence's justification: drought changes
# once a week, on a Thursday, and the hourly clock exists only so that
# Thursday is picked up within the hour. Both scripts are built to make that
# nearly free - see their steps.
#
# WHY THIS IS SAFE TO RUN BEFORE ANYTHING IS CONFIGURED. The reader
# credential is account work on Supabase, and it does not exist yet. Like
# migrate.yml's UA job, this skips with a warning rather than a red X when
# the secret is absent - a scheduled workflow that fails every night until
# someone does account work trains people to ignore it.
#
# WHY IT CANNOT PUBLISH AN EMPTY ARTIFACT. Row-level security is on for every
# table with no policies, and the backend only works because it connects as
# the owner. The reader is not the owner, so a missing GRANT or policy returns
# zero rows *without an error* - which, published, is a client holding a valid
# baseline that says the trail is clear. export_conditions.py asks the catalog
# whether its permissions are really in place and refuses to write anything if
# they are not, which is what makes a genuinely empty result trustworthy.
#
# NOT GATED ON AN ENVIRONMENT. There is nothing to approve: this reads
# verified rows a hiker could already fetch from `GET /closures` without an
# account, and writes them to a bucket. schema-drift.yml records the same
# reasoning for the same shape of job.
#
# ONE RUN PER DATA ENVIRONMENT (features/DATA_ENVIRONMENTS.md). Each reads its
# own database and writes its own prefix, so the two never meet: a test closure
# a UA moderator verified cannot reach a hiker's map, and production's verified
# rows are not what a tester rehearses moderation against. That isolation is
# real, and it is why the UA test closure below was never a production risk -
# but it is not a licence to leave invented rows in UA either, because a UA
# tester reading a map is reading a map. Maintainer decision 2026-09-09 took
# the work-projects samples out of the reviewed file this workflow bakes; the
# one invented row the repository cannot reach from here is
# `ua-test-closure-verified` in the UA conditions database, which is a DELETE
# a maintainer runs, not a step this workflow can take. The matrix jobs write
# disjoint keys, so they never race each other - but each still joins the
# publish-data group below, because the race that matters is with the other
# four workflows, over the shared latest.json (#645).
#
# The ATC leg is deliberately NOT split. Those notices are baked from a file in
# git that a person reviewed - there is no database behind them and no
# environment they could differ by - so both runs publish the same reviewed
# content into their own tree, which is what makes UA's copy a real rehearsal
# rather than an empty one.
#
# WHAT THIS CLOCK DOES TO THE REPOSITORY'S ACTIONS CACHE, which is why the
# three save keys below are content hashes rather than `github.run_id`.
#
# Count it off this file: 24 runs a day, two matrix legs each, three
# `actions/cache/save` steps per leg, under a key that cannot repeat.
#
# Measured on run #342, the scheduled run of 2026-09-09T00:35Z: the production
# leg's drought save reported "Sent 18640702 of 18640702 (100.0%)" and "Cache
# saved with key: drought-inputs-34295667889" - 18.6 MB compressed, once an
# hour, under a key nothing will ever ask for again. Not two: one entry exists
# per key, so the ua leg computing the identical key cannot add a second copy,
# and both save steps concluded success on that run, which is what says this
# is the design working as written rather than a failure nobody noticed.
#
# So three new entries a run, 72 a day, of which the drought one is
# 24 x 18.6 MB = about 450 MB a day. GitHub's per-repository cache is 10 GB
# and evicts least-recently-used, so this workflow alone fills the whole
# repository's allowance with itself in roughly three weeks - and it is
# already sharing that allowance. The obvious thing it walks out is
# publish-vector-data.yml's fetch-outputs entry, around 400 MB (#1311 measured
# 422 MB moving into the cache on run #88, 2026-09-08), whose comment at "Do
# not expect it to hit" blames GitHub's 7-day idle eviction for the misses it
# sees.
#
# THE HYPOTHESIS IS THAT THIS WORKFLOW IS WHAT ACTUALLY EVICTS IT, days before
# the 7-day rule could - and that is reasoned, not measured. It follows from
# the arithmetic above and GitHub's documented eviction policy, and it has
# never been checked against a cache listing. What would settle it: one
# `GET /repos/OurHike/OurHike/actions/caches`, recording every entry's size
# and `last_accessed_at`, taken before this change and again a week after. If
# the vector build's entry survives a week where it used to vanish in three
# days, the hypothesis was right; if it still vanishes, the eviction pressure
# is somewhere else and this change bought only the smaller cache bill.
#
# ONE LIMIT ON THAT HYPOTHESIS, narrower than the arithmetic makes it look and
# recorded because the arithmetic alone reads as proof. The vector build's own
# comment expects its publishes a month apart - "DATA_RELEASES.md puts
# releases on a monthly-ish cadence" - and on a monthly cadence the 7-day idle
# rule reaches that entry first no matter what this workflow does. The churn
# below can only be the deciding evictor while vector builds are days apart.
# They are at the moment: #1311 - The vector build went from 20 to 108 minutes
# in twelve days records twelve dispatches on 2026-09-08 alone. So the change
# is worth making and the hypothesis is worth settling, but neither predicts
# anything about a quiet month.
#
# WHAT A CONTENT HASH FIXES AND WHAT IT DOES NOT, because only one of the
# three is actually fixed:
#
#  - The drought entry is fixed, and it is the one carrying the bytes. Its key
#    hashes the dated USDM release and the centerline, neither of which moves
#    on an hourly clock, so every run after the week's first computes a key
#    that already exists, and an existing key is one entry however many jobs
#    write it. One entry per USDM release rather than 24 a day: about 450 MB a
#    day becomes about 19 MB a week.
#  - The ATC and NYNJTC entries are NOT fixed, and claiming otherwise would be
#    the confident wrong answer. Both fetchers stamp `fetched_at` - this run's
#    clock - into the payload they cache (`fetch_atc_updates.py:133` and
#    `fetch_nynjtc_alerts.py:212`, each inside that script's one
#    `CACHE_PATH.write_text`), so those files' bytes move hourly
#    whether or not ATC or NYNJTC posted anything, and a hash of moving bytes
#    moves too. They are small beside the drought entry, which is the only
#    reason this is tolerable rather than a blocker. What content addressing
#    does buy them is the hour a fetch fails: the restored copy is carried
#    forward unchanged, so the key it computes is the key that already holds
#    those bytes, and the save is refused as a duplicate - a warning in the
#    log and no second entry - instead of opening a fresh one. Stopping their
#    churn outright means keeping the fetch clock out of the cached payload,
#    which is a change to those two scripts and not to this file.
#
# CONSIDERED AND REJECTED, because the obvious way to make bytes stop moving
# is to stop stamping them. Every artifact here carries a `generated_at`, and
# there is no one line to delete: each exporter writes its own, in its own
# `build_document` - export_conditions.py, export_atc_updates.py,
# export_nynjtc_alerts.py, export_drought.py, with export_work_projects.py
# stamping inline. That stamp is exactly what makes an unchanged bake produce
# changed bytes. Two ways to stop it, both worse than the cache bill:
#
#  - Drop it. client/src/lib/publishedConditions.ts refuses a document with no
#    `generated_at` rather than defaulting one - "the one strict thing here" -
#    so the phone would fall back to whatever copy it kept and the hourly
#    publish would reach nobody at all.
#  - Freeze it, to the reviewed date or to the hour. conditionState.ts:134-136
#    turns the stamp into "Conditions as of 2h ago" / "3d ago", so a closure a
#    moderator verified this hour would tell a hiker it was days old.
#
# And publishing less often, the third version of the same trade, is the
# cadence the section above argues for. A cheaper cache is not worth a verified
# closure that reads as stale - or one that does not read at all.

name: Publish conditions

# Every writer of latest.json shares this group (publish-vector-data.yml,
# build-basemap.yml, build-dem.yml, build-raster.yml): publish() reads the
# manifest, uploads for as long as the artifacts take, and writes the merge
# last, so two concurrent publishes interleave and whichever writes last
# reverts the other's entries (#645). This workflow was the one writer
# outside the group - its header used to argue the matrix legs write
# disjoint keys, which was true and answered a different question.
#
# At the WORKFLOW level, not on the job, and that placement is load-bearing:
# concurrency groups coalesce rather than queue (one pending entrant; a newer
# pending run cancels the older), so a job-level group would let the ua leg's
# arrival cancel the production leg's pending slot whenever another publish
# held the group - production's closures silently a day older, with no red
# run. One run taking the group once means both legs publish or the whole
# run visibly waits/cancels together, and a cancelled daily run is healed by
# tomorrow's cron.
concurrency:
  group: publish-data
  cancel-in-progress: false

on:
  schedule:
    # :40 past every hour. Off the hour for the reason every cron in this
    # directory records - GitHub queues everything submitted at :00 behind
    # everyone else's - and clear of check-pending-approvals at :07 and :37.
    #
    # HOURLY RATHER THAN DAILY, which reverses the cadence recorded in this
    # file's header. That header quoted the maintainer, 2026-08-08: "a closure
    # can be latent by a day. we won't be adjusting minute by minute." The
    # call was revisited on 2026-08-15 and moved to hourly, which is neither
    # of those extremes: a closure a moderator verifies at lunchtime was meant
    # to reach a hiker's phone the same afternoon, and nothing here polls
    # minute by minute. The measurement below says the afternoon is not
    # promised - a verification just after a run can wait ~6 h - and the
    # maintainer accepted that rather than add an outside trigger (poll,
    # 2026-09-25, #1316).
    #
    # It only means anything because the client re-reads on the same clock.
    # Both condition reads used to run once per online transition, so an
    # hourly publish would have landed in the bucket and reached nobody -
    # client/src/lib/useConditions.ts's CONDITIONS_REFRESH_MS is the other
    # half of this number and the two are commented as a pair.
    #
    # MEASURED, NOT ASSUMED, AS OF 2026-09-25: this fires roughly every four
    # hours, not hourly. 40 scheduled runs, 2026-09-18 16:42Z to 2026-09-25
    # 08:10Z, all successful: min gap 2.1 h, median 4.0 h, mean 4.1 h, max
    # 6.3 h - about 5.7 runs/day against the 24 the cron declares. That max is
    # the "~6 h" above. Two earlier measurements agree: 2026-09-21, 30 runs
    # (#391-#419), mean 3h53m, max 5h45m; and 2026-09-09, mean 4.14h, 6.3/day
    # (**#1346 - Every cron in this repository fires about five times a day,
    # whatever it declares — including the conditions bake**), so this is a
    # stable platform behaviour, not a one-off. #1346 leaves
    # both the cause and what to do about it open; this line only keeps the
    # measured cadence beside the intended one, as that issue asks, so a
    # reader is not left inferring hourly delivery from the cron alone.
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      # `ua` runs the UA leg alone, for a dispatch that must not touch what
      # hikers read: the dbt path's three-day UA soak, dispatched from the
      # pull request's branch (pipeline/ELT.md, "The go/no-go gate"). `both`
      # is the schedule's behaviour, and means both legs only from main.
      data_environment:
        description: "Which legs to run: both (production and UA; from main only) or ua alone"
        type: choice
        options: [both, ua]
        default: both
      # Which of the header's TWO PATHS writes the phone files this run, and
      # this run only. `scheduled` is the schedule's behaviour: each leg on
      # its own line below (PRODUCTION_PHONE_FILES, UA_PHONE_FILES). `dbt`
      # runs the UA leg alone (the two locks below).
      phone_files:
        description: "Which pipeline writes the phone files, this run only: scheduled (each leg's own setting, as the schedule runs), exporters (today's bake) or dbt (dlt -> dbt, UA leg alone)"
        type: choice
        options: [scheduled, exporters, dbt]
        default: scheduled

permissions:
  contents: read

# Lines reach the log when printed, not when the step exits - see
# publish-vector-data.yml's own env block for the measurement (#1311). The
# same block-buffering hid every step's timing here too, on the one
# workflow that runs 48 times a day.
env:
  PYTHONUNBUFFERED: "1"
  # THE CUTOVER SWITCH, ONE LINE PER DATA ENVIRONMENT: which pipeline
  # writes that leg's phone files on every scheduled run, and on a dispatch
  # left at `phone_files: scheduled`. Decision 92 (the maintainer's poll,
  # 2026-10-06, answering pipeline/ELT.md's open question 4): "UA on dbt,
  # prod on exporters". So UA's leg keeps the dbt path its soak ran, now on
  # main's code, a further probation; production's keeps today's bake until
  # the cutover.
  #
  # The cutover is changing PRODUCTION_PHONE_FILES to `dbt`, and the
  # rollback is the reverse. That line is also extract-notices.yml's switch:
  # its production leg reads this line, by its text, and runs only while it
  # says `dbt`, since nothing else reads production's notices store (held
  # by .github/tests/test_notices_job.py). The dispatched-dbt lock below is
  # not part of the cutover: it keeps a dispatch's `phone_files: dbt` on UA
  # whatever these lines say.
  #
  # The job's "Choose which pipeline writes this leg's phone files" step
  # turns its leg's line, or the dispatch's own choice, into PHONE_FILES for
  # every later step, and refuses a value that is neither path; publish.py
  # reads PHONE_FILES as OURHIKE_PHONE_FILES and refuses one too.
  PRODUCTION_PHONE_FILES: exporters
  UA_PHONE_FILES: dbt
  # Both off, in every step: dlt's telemetry is on by default and sends to
  # telemetry.scalevector.ai from a job holding R2 keys (the dlt skill, rule
  # 3), and this is dbt's documented opt-out (the dbt skill, "Telemetry off
  # is the only switch").
  RUNTIME__DLTHUB_TELEMETRY: "false"
  DBT_ENGINE_SEND_ANONYMOUS_USAGE_STATS: "false"

jobs:
  publish:
    name: Publish (${{ matrix.data_environment }})
    runs-on: ubuntu-latest
    # 15 since decision 103 (pipeline/ELT.md): the dbt build step's own cap
    # rose from 6 to 10 minutes, and .github/tests/test_conditions_build_budget.py
    # holds that cap, the freshness step's and the slowest rest of the job
    # inside this one. client/src/lib/noticeSelection.ts's SAME_BUILD_MS is
    # this number by its own reasoning, and moved with it.
    timeout-minutes: 15
    # A SECOND GROUP, EACH LEG'S OWN, BESIDE THE WORKFLOW'S publish-data,
    # which still holds the whole run (a job's group is added to its
    # workflow's, never in place of it: Reasoned from GitHub's "Using
    # concurrency", where each is described on its own; @unvalidated until a
    # leg is seen waiting on it). check-conditions.yml's leg holds the same
    # group (decision 110): this leg restores and saves its history store,
    # history/conditions_<leg>, and the checks of the build before restore
    # and save Elementary's history in it too, each refusing to save over a
    # save it did not restore (row_history.py). So a leg whose last build's
    # checks are still running waits for them instead of racing their save.
    # The two legs' groups differ, so neither can cancel the other's pending
    # slot, which is what keeps publish-data at the workflow level above.
    concurrency:
      group: conditions-history-${{ matrix.data_environment }}
      cancel-in-progress: false
    # One run per data environment, because this is the source where sharing
    # hurts most: closures and reports are baked from a *database*, so a single
    # bake would put whichever database it read in front of both audiences at
    # once (features/DATA_ENVIRONMENTS.md). UA moderating a test closure would
    # be a closure on a hiker's map, and a hiker's verified closure would be
    # what a tester was handed to rehearse against.
    #
    # fail-fast off, because the two are independent: UA's database being
    # unreachable is not a reason to leave production's safety data a day
    # older than it needs to be.
    #
    # THE PRODUCTION LEG EXISTS ONLY FOR A RUN FROM MAIN. A dispatch runs
    # whichever ref it names, with that ref's copy of this file, and the
    # production leg writes the keys every hiker's phone reads within the
    # hour, with no release or review between (pipeline/ELT.md, "Why a
    # scheduled run cannot reach production": this bake is the one
    # exemption). So any other ref gets the UA leg alone, whatever
    # `data_environment` says, and so does main asking for `ua`. Two locks,
    # because GitHub's `==` ignores case and a branch called `Main` would
    # pass it: the matrix leaves the leg out, and the first step refuses it
    # with bash's case-sensitive comparison if it is ever there anyway. Both
    # are held by .github/tests/test_conditions_production_leg_needs_main.py.
    #
    # NOR FOR A DISPATCH THAT PICKS THE dbt PATH. It has soaked on UA only
    # (decision 30), and decision 92 keeps production on the exporters until
    # the cutover. So `phone_files: dbt` runs the UA leg alone, by the same
    # two locks. The schedule passes no input, so each of its legs takes its
    # own line above.
    strategy:
      fail-fast: false
      matrix:
        data_environment: ${{ fromJSON((github.ref == 'refs/heads/main' && inputs.data_environment != 'ua' && inputs.phone_files != 'dbt') && '["production", "ua"]' || '["ua"]') }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      # First, before the checkout and any step that reads a secret. When a
      # production leg was asked for and left out, the UA leg says so, so the
      # run is not read as having run both.
      - name: Refuse a production leg from any ref but main
        working-directory: .
        env:
          LEG: ${{ matrix.data_environment }}
          REF: ${{ github.ref }}
          ASKED: ${{ inputs.data_environment }}
        run: |
          if [ "$LEG" = "production" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=Production leg refused::$REF is not refs/heads/main, and only main publishes production's conditions/. Nothing was read or published for production."
            exit 1
          fi
          if [ "$LEG" = "ua" ] && [ "$REF" != "refs/heads/main" ] && [ "$ASKED" != "ua" ]; then
            echo "::notice title=UA leg only::$REF is not refs/heads/main, so the production leg was left out and this run publishes UA alone."
          fi

      # The second lock on the matrix's dbt rule, lowercased because GitHub's
      # `!=` ignores case. It reads the dispatch's own input, never a leg's
      # line, so a schedule is never refused here.
      - name: Refuse a production leg on a dispatched dbt path
        working-directory: .
        env:
          LEG: ${{ matrix.data_environment }}
          ASKED: ${{ inputs.data_environment }}
          ASKED_PHONE_FILES: ${{ inputs.phone_files }}
        run: |
          if [ "$LEG" = "production" ] && [ "${ASKED_PHONE_FILES,,}" = "dbt" ]; then
            echo "::error title=Production leg refused::phone_files=dbt was dispatched, and the dbt path has soaked on UA only (pipeline/ELT.md, decision 92). Nothing was read or published for production."
            exit 1
          fi
          if [ "$LEG" = "ua" ] && [ "${ASKED_PHONE_FILES,,}" = "dbt" ] && [ "$ASKED" != "ua" ]; then
            echo "::notice title=UA leg only::phone_files=dbt runs the UA leg alone, so production's conditions/ were left as they are."
          fi

      # THE SWITCH, READ FOR THIS LEG (decision 92). A dispatch's
      # `phone_files` wins for this run; `scheduled`, and a schedule, which
      # carries no inputs, take this leg's own line at the top of this file.
      # Written to $GITHUB_ENV as PHONE_FILES, which every later step's `if:`
      # and publish.py read, so it runs before any step branches on it. A
      # value that is neither path stops the leg here: otherwise every step of
      # both paths would skip and publish.py would refuse at the end.
      # .github/tests/test_conditions_phone_files_switch.py runs this script
      # for each leg.
      - name: Choose which pipeline writes this leg's phone files
        working-directory: .
        env:
          LEG: ${{ matrix.data_environment }}
          ASKED_PHONE_FILES: ${{ inputs.phone_files }}
        run: |
          case "$LEG" in
            production) line=PRODUCTION_PHONE_FILES ;;
            ua) line=UA_PHONE_FILES ;;
            *) line="" ;;
          esac
          chosen="${line:+${!line}}"
          from="$line"
          if [ -n "$ASKED_PHONE_FILES" ] && [ "$ASKED_PHONE_FILES" != "scheduled" ]; then
            chosen="$ASKED_PHONE_FILES"
            from="the dispatch's phone_files"
          fi
          if [ "$chosen" != "exporters" ] && [ "$chosen" != "dbt" ]; then
            echo "::error title=No phone files path::${from:-No line} names '$chosen' for the $LEG leg, which is neither exporters nor dbt. Nothing was read or published for $LEG."
            exit 1
          fi
          echo "PHONE_FILES=$chosen" >> "$GITHUB_ENV"
          echo "The $LEG leg's phone files come from $chosen ($from)."

      - name: Is there a database to read
        id: can
        # Before the checkout, so not in pipeline/ - migrate.yml's gate has
        # the reasoning for testing the secret this way rather than letting
        # the connection fail with something less legible.
        #
        # Both secrets are named literally rather than indexed by the matrix
        # value. GitHub's `a && b || c` yields `c` whenever `b` is empty, and
        # an unset production URL silently selecting UA's database is the one
        # mistake this whole job exists to make impossible -
        # .github/tests/test_repository_settings.py also reads these names as
        # text, so an indexed reference would leave the settings undeclared.
        working-directory: .
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_CONDITIONS_DATABASE_URL }}
          UA_URL: ${{ secrets.UA_CONDITIONS_DATABASE_URL }}
        run: |
          if [ "${{ matrix.data_environment }}" = "production" ]; then
            CONFIGURED="$PRODUCTION_URL"
          else
            CONFIGURED="$UA_URL"
          fi
          if [ -z "$CONFIGURED" ]; then
            echo "::warning::No ${{ matrix.data_environment }} conditions database is configured, so no closures or reports were published for it. The ATC trail-updates leg does not need one and still ran. See features/CONDITIONS_DELIVERY.md and #429."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # No longer gated on the database, because half this job no longer
      # needs one. ATC's Trail Updates are baked from a reviewed file in git
      # (features/ATC_TRAIL_UPDATES.md, #460) - no query, no credential - and
      # gating the checkout on a secret that leg never uses would have made
      # the ATC layer wait on Supabase account work it has nothing to do with.
      - uses: actions/checkout@v7

      # THE dbt PATH'S PYTHON. requirements-extract.txt and requirements-dbt.txt
      # are compiled for 3.12, as pipeline-tests.yml's dbt job installs them,
      # and need separate venvs (click 8.5.0 against 8.4.2; pipeline/ELT.md,
      # "Fixture mode"). Set up before 3.14 below, so `python` stays 3.14 for
      # today's bake and `python3.12` sits beside it.
      - uses: actions/setup-python@v7
        if: env.PHONE_FILES == 'dbt'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements-dbt.txt
            pipeline/requirements-extract.txt

      # `cache: pip`, which the other four workflows that run publish.py all
      # set and this one did not - checked across the directory 2026-09-09 and
      # now checked on every run by
      # .github/tests/test_cache_keys_are_content_addressed.py. The install
      # below therefore reached PyPI for the whole of pipeline/requirements.txt
      # on all 48 jobs a day, where every other publisher pays it once per
      # change to that file. Measured on run #342, 2026-09-09: 13 s on the ua
      # leg and 16 s on production, so about eleven minutes of runner time a
      # day, most of which this line gives back.
      #
      # `cache-dependency-path` pins the key to the one requirements file this
      # job installs. Left off, setup-python hashes every requirements file in
      # the tree, so a backend or .github/tests pin nothing here installs would
      # move this key and throw the entry away.
      #
      # It also pulls the opposite way to the three caches below: this is one
      # small entry that 48 jobs a day RESTORE, and an entry read every half
      # hour is the last thing a least-recently-used policy evicts.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # THE dbt PATH NEEDS THE RAW STORE AND THIS LEG'S DATABASE, and names
      # whichever is missing. The raw store's secrets are set: this step
      # passed on run 481, 2026-10-02 (ELT.md decision 43: one bucket,
      # `our-hike-raw`, one key, R2_ENDPOINT_URL reused). Today's bake skips
      # its database half with a warning when there is no database; the dbt
      # path reads OurHike's own closures as a source, so it fails here,
      # before reading anything.
      - name: Check the dbt path has its raw store and its database
        if: env.PHONE_FILES == 'dbt'
        env:
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          R2_RAW_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          R2_RAW_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          HAS_DATABASE: ${{ steps.can.outputs.go }}
        run: |
          missing=""
          for name in R2_RAW_BUCKET R2_RAW_ACCESS_KEY_ID R2_RAW_SECRET_ACCESS_KEY R2_ENDPOINT_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=The raw store is not configured::phone_files=dbt needs the repository secret(s)$missing. Nothing was extracted or published."
            exit 1
          fi
          if [ "$HAS_DATABASE" != "true" ]; then
            echo "::error title=No conditions database::phone_files=dbt reads this leg's own database for OurHike's closures and reports, and none is configured. Nothing was published."
            exit 1
          fi

      # dbt's ADBC driver and v2's spatial build, about 151 MB dbt otherwise
      # downloads on its first command. pipeline-tests.yml's dbt job measured
      # both and caches them under this key. Saved at the end on a miss.
      - name: Restore dbt's DuckDB driver and v2's spatial extension
        id: dbt-runtime
        if: env.PHONE_FILES == 'dbt'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/com.getdbt/adbc
            ~/.duckdb/extensions/v1.5.4
          key: dbt-v2-runtime-${{ runner.os }}-${{ hashFiles('pipeline/requirements-dbt.txt') }}

      # dbt's packages, so an hourly run does not need dbt Hub and
      # codeload.github.com up at its minute (ARCH-6 of the PR #1805 review).
      # pipeline-tests.yml's dbt job explains the key, why a hit skips deps,
      # and why only a deps that succeeded is saved.
      - name: Restore dbt's packages (dbt path)
        id: dbt-packages
        if: env.PHONE_FILES == 'dbt'
        uses: actions/cache/restore@v6
        with:
          path: pipeline/dbt/dbt_packages
          key: dbt-packages-${{ runner.os }}-${{ hashFiles('pipeline/dbt/packages.yml', 'pipeline/dbt/package-lock.yml') }}

      # Separate venvs for the extract and dbt, as CI's dbt job keeps them.
      # Timed into the summary: whether the installs fit beside the bake in
      # this job's cap is open in pipeline/ELT.md ("The hourly
      # lanes": "one timed run settles it").
      - name: Install the extract's and dbt's own pins (dbt path)
        if: env.PHONE_FILES == 'dbt'
        timeout-minutes: 4
        run: |
          started=$SECONDS
          python3.12 -m venv "$RUNNER_TEMP/extract"
          "$RUNNER_TEMP/extract/bin/pip" install --quiet -r requirements-extract.txt
          python3.12 -m venv "$RUNNER_TEMP/dbt"
          "$RUNNER_TEMP/dbt/bin/pip" install --quiet -r requirements-dbt.txt
          {
            echo "### The dbt path, ${{ matrix.data_environment }} leg"
            echo ""
            echo "- installing the extract's and dbt's pins: $((SECONDS - started)) s"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # The dbt generators' output, which is not committed (pipeline/ELT.md
      # decision 91), written before any dbt command reads the project, on
      # the extract's venv: the generators read its club folders, whose
      # modules import dlt. Measured 2026-10-06 in a sandbox: 2.7 to 3.7 s.
      # The two-minute cap only bounds a hang, @unvalidated: this summary
      # line over a few runs would settle it.
      - name: Generate the dbt models (dbt path)
        if: env.PHONE_FILES == 'dbt'
        timeout-minutes: 2
        run: |
          started=$SECONDS
          "$RUNNER_TEMP/extract/bin/python" generate_dbt.py
          printf -- '- generate_dbt.py: %s s\n\n' "$((SECONDS - started))" >> "$GITHUB_STEP_SUMMARY"

      # On a miss only. Soak run 538's deps took 330 ms ("Finished 'deps'
      # successfully [330ms]", 2026-10-05), so the cap only bounds a download
      # that hangs, and a hung deps fails the run either way, because nothing
      # builds without the packages. Two minutes is picked, @unvalidated: the
      # slowest miss over a few runs' summaries would settle it.
      - name: dbt deps (dbt path)
        id: deps
        if: env.PHONE_FILES == 'dbt' && steps.dbt-packages.outputs.cache-hit != 'true'
        timeout-minutes: 2
        working-directory: pipeline/dbt
        run: |
          started=$SECONDS
          "$RUNNER_TEMP/dbt/bin/dbt" deps --profiles-dir .
          printf -- '- dbt deps, on a cache miss: %s s\n\n' "$((SECONDS - started))" >> "$GITHUB_STEP_SUMMARY"

      - name: Save dbt's packages (dbt path)
        if: always() && env.PHONE_FILES == 'dbt' && steps.deps.outcome == 'success' && hashFiles('pipeline/dbt/packages.yml', 'pipeline/dbt/package-lock.yml') != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: pipeline/dbt/dbt_packages
          key: dbt-packages-${{ runner.os }}-${{ hashFiles('pipeline/dbt/packages.yml', 'pipeline/dbt/package-lock.yml') }}

      # Before the database leg, and unconditionally. Writes nothing at all
      # while nobody has reviewed reference/atc_updates.json, and says so on
      # stdout rather than failing: "we have not looked yet" is a true
      # statement about this feature, and a red X for it would be noise on a
      # job that is working.
      #
      # STILL UNCONDITIONAL ON THE HOURLY CLOCK, and that is a deliberate
      # non-change (#720). This leg bakes a file a human reviewed and merged,
      # so its content moves when a pull request lands and at no other time -
      # twenty-four bakes a day produce twenty-four identical artifacts. The
      # case for leaving it alone anyway is that the alternative costs more
      # than it saves: it is a few seconds of CPU against a skip condition
      # that would have to know when the file last changed, and a wrong skip
      # here means ATC's notices silently stop republishing. Cheap and
      # obviously correct beats clever on the leg that carries closures.
      #
      # SINCE #963 THE SENTENCE ABOVE IS ONLY HALF TRUE, and the half that
      # changed is the point of the step below. The reviewed file still moves
      # only when a pull request lands, but the bake no longer publishes only
      # that file: anything ATC has posted SINCE the review, and that reads
      # unambiguously, now rides out on this same hourly clock. What used to
      # be twenty-four identical artifacts is now twenty-four chances to carry
      # a notice nobody has typed yet.

      # Reads ATC's own site into data/raw/, which export_atc_updates.py then
      # gates. Deliberately allowed to fail without failing the job: if ATC is
      # unreachable or has re-themed, the previous cache stays put and the
      # export below still publishes every reviewed row. The reviewed rows are
      # what a person stood behind; losing the automatic ones for an hour is a
      # bad hour, and losing a hiker's whole ATC layer to somebody else's
      # outage would be the larger failure. A red step says it happened.
      # WITHOUT THIS THE POLITENESS DESIGN DOES NOT EXIST. A runner is
      # ephemeral and pipeline/data/ is gitignored, so an uncached hourly job
      # starts empty every time and asks ATC for all ten listing pages AND all
      # 89 updates - 99 requests an hour, 2,376 a day, for data that moves a
      # few times a month. The cache is what turns that into ten requests an
      # hour plus one refresh per update per day. Same reasoning, and the same
      # shape, as the drought inputs further down this file.
      #
      # TODAY'S BAKE ONLY, FROM HERE TO "Export NYNJTC's trail alerts". The
      # dbt path's extract reads ATC's reviewed file and NYNJTC's posts
      # itself, and publish.py takes conditions/atc_updates.json and
      # conditions/nynjtc_alerts.json from the dbt writers, so running these
      # too would ask both sites twice for files nobody publishes. But these
      # steps also keep warm the `atc-updates-` cache propose-atc-updates.yml
      # reads on main. Since decision 92 only the production leg runs them on
      # the schedule, and its cache is the same ATC site's, so moving
      # production to the dbt path must first give that workflow another
      # input.
      - name: Restore ATC's trail updates
        if: env.PHONE_FILES == 'exporters'
        uses: actions/cache/restore@v6
        with:
          path: pipeline/data/raw/atc_updates.json
          key: atc-updates-${{ github.run_id }}
          restore-keys: atc-updates-

      # A BUDGET OF ITS OWN, BECAUSE `continue-on-error` DOES NOT COVER SLOW
      # (#1318).
      #
      # The intent of the flag below is that ATC being unreachable or
      # re-themed still publishes every reviewed row. That held for a step
      # that FAILS and not for one that is merely slow: a slow ATC ate the
      # job's whole ten minutes, the job timeout cancelled the run, and every
      # step from `Export the ATC's reviewed trail updates` onward reported
      # `skipped`. Nothing published, for either environment, and the run's
      # conclusion was `cancelled` - a word that reads like somebody pressed a
      # button. Observed twice: runs 340 (18:57:14Z) and 343 (02:17:12Z),
      # both dying here on the same ten-minute signature.
      #
      # The retry ladder is larger than the container it runs in and is not
      # wrong to be. lib/http_retry.py is 3 attempts x 60 s of request timeout
      # plus its local backoff of (5, 30) = 215 s per request - AND that is a
      # floor, not a ceiling: `retry_after_seconds` honours a server's
      # `Retry-After` up to MAX_RETRY_AFTER_SECONDS = 120, so a host answering
      # 429 or 503 twice costs 180 s of request timeout plus 240 s of sleeping,
      # about 420 s for ONE request. lib/atc_scrape.py walks up to
      # MAX_LISTING_PAGES = 20 of them. Capping the STEP is what turns that
      # overrun back into a step failure, which the flag then absorbs exactly
      # as its comment has always claimed - cache carried forward, reviewed
      # rows exported, publish happens.
      #
      # So the four minutes below is NOT "the worst case, bounded" - a single
      # Retry-After-throttled request already exceeds it. It is the largest
      # budget that leaves the publish able to run, which is the property that
      # matters here: this step is `continue-on-error`, so reaching the cap
      # costs the ATC refresh and nothing else.
      #
      # FOUR MINUTES, SIZED FROM THE RUNS RATHER THAN PICKED. Measured on run
      # 381 (2026-09-14 21:02Z), the two matrix legs: this step took 1m43s
      # (production) and 1m38s (ua), the whole job 2m19s and 2m22s, and
      # everything after the last fetch - exports, the ledger line, the R2
      # upload - 6s and 8s. Four minutes is about 2.3x the observed fetch, so
      # a slow-but-working ATC still finishes, and it leaves the publish
      # roughly five minutes it needs under a minute of.
      #
      # THE FOUR CAPS HAVE TO FIT THE JOB, which is what sizes the other three
      # rather than each step's own worst case. The job budget was 10 minutes
      # when they were sized (15 since decision 103's build cap);
      # run 381 measured 32 s of set-up, checkout, Python and install before
      # the first fetch and 6-8 s of exports, ledger and R2 upload after the
      # last one. So the four ceilings may total about 8 minutes, and they do:
      # 4 + 1 + 2 + 1. ATC keeps the largest because it is the step that
      # actually overran, twice; the others sit far enough above their measured
      # cost (NYNJTC 3-4 s, drought 0-1 s warm) that reaching a cap means
      # something is wrong.
      #
      # If all four hit their ceilings, the old 10 minutes left the publish
      # almost nothing, the case no step timeout can fix; the job's 15 since
      # decision 103 leave it more (Reasoned from the sums above). What these
      # buy is the case that has happened: one slow upstream, bounded, with
      # the publish still reached.
      #
      # `@unvalidated` in one respect, stated rather than implied: nobody has
      # measured the DISTRIBUTION of this step, only these two runs and the
      # two that overran. If ATC routinely takes three minutes on some days,
      # four is tighter than it looks. What would settle it is the spread of
      # step 7's duration across a few weeks of runs, which the Actions API
      # answers and this change did not wait for.
      - name: Fetch ATC's trail updates
        if: env.PHONE_FILES == 'exporters'
        continue-on-error: true
        timeout-minutes: 4
        run: python fetch_atc_updates.py

      # `always()`, so an hour when ATC was unreachable still carries the
      # previous cache forward. Saving only on success would throw the cache
      # away exactly when it is doing the most good - the run that could not
      # refetch is the run that most needs the copy it already had.
      #
      # The `hashFiles(...) != ''` half of that condition is new, and what it
      # buys is smaller than the obvious story - "otherwise the empty hour
      # saves an empty entry, and the prefix restore then prefers it" - which
      # is not what the action does. Read out of actions/cache's own source,
      # 2026-09-09: `@actions/cache`'s `saveCache` throws "Path Validation
      # Error: Path(s) specified in the action for caching do(es) not exist,
      # hence no cache is being saved" when none of the paths resolve, and
      # cache/save's `saveImpl` catches every error into `core.warning`. So an
      # hour that restored nothing and fetched nothing has been logging a
      # yellow no-op, not storing a nothing. No empty entry was ever created
      # here, and saying otherwise would be this file arguing for its own
      # change with a mechanism nobody checked.
      #
      # What the guard prevents is a malformed KEY. hashFiles returns the
      # empty string when nothing matched (GitHub's expressions reference,
      # read 2026-09-09), so an unguarded content-addressed key evaluates to
      # `atc-updates-` exactly - character for character the prefix the
      # restore above searches on. A one-path step has nothing it could put
      # under that key, so here the guard turns a warning into an honest skip
      # and no more. The drought step below is the one that saves three paths
      # under a key hashed from two of them, and it carries the argument for
      # why the invariant is worth holding in all three places rather than
      # re-reasoned per step.
      #
      # The key is a content hash, for the header's reason. Read that section
      # before assuming this stops the hourly churn: it does not, because
      # fetch_atc_updates.py writes this run's clock into the file as
      # `fetched_at`, so these bytes move hourly even when ATC has posted
      # nothing. What it does stop is the failed hour saving a second copy of
      # a file it did not change.
      - name: Save ATC's trail updates
        if: always() && env.PHONE_FILES == 'exporters' && hashFiles('pipeline/data/raw/atc_updates.json') != ''
        uses: actions/cache/save@v6
        with:
          path: pipeline/data/raw/atc_updates.json
          key: atc-updates-${{ hashFiles('pipeline/data/raw/atc_updates.json') }}

      - name: Export the ATC's reviewed trail updates
        if: env.PHONE_FILES == 'exporters'
        run: python export_atc_updates.py

      # NYNJTC'S TRAIL ALERTS (#1078, #940), on the same shape as the ATC leg
      # above because they answer the same question for a different steward:
      # 160 miles of the A.T. and the trails in most of the parks this build
      # now draws. What ships is tightly bounded and is sources.json's
      # `nynjtc_notices_licence` block rather than this file's decision - the
      # headline, the locality their own region and state tags give, their
      # `modified` date and the URL of their page, and NOT their body text.
      # export_nynjtc_alerts.py applies that split; nothing here widens it.
      #
      # WHY THIS IS BEING WIRED NOW AND NOT WHEN IT WAS WRITTEN. It was not
      # wired at all: the fetcher, the exporter, its tests and its place in
      # publish.py's conditions manifests all landed, the registry was marked
      # `reaches_hikers: true` on the maintainer's instruction, and no step
      # ever ran the script - so `conditions/nynjtc_alerts.json` was 404 on
      # production (measured 2026-08-27) while the ATC file beside it was 200.
      # That is #940's pattern for the fourth time, and
      # .github/tests/test_exporters_are_published.py is what found it and
      # what stops the fifth.
      #
      # The cache earns its place for the ATC leg's reason, at a smaller
      # scale: one request for the alerts plus one per place taxonomy, five in
      # the steady state, for data that moves a few times a month. The
      # exporter reads this cache, so a run that could not reach NYNJTC
      # publishes the previous copy rather than nothing.
      - name: Restore NYNJTC's trail alerts
        if: env.PHONE_FILES == 'exporters'
        uses: actions/cache/restore@v6
        with:
          path: pipeline/data/raw/nynjtc_alerts.json
          key: nynjtc-alerts-${{ github.run_id }}
          restore-keys: nynjtc-alerts-

      # `continue-on-error`, like the ATC fetch: NYNJTC being unreachable is
      # weather, and it must not take the drought bands and the verified
      # conditions down with it. The fetcher already exits non-zero rather
      # than writing a payload it does not recognise, and leaves the previous
      # cache in place when it does.
      # One minute, on the ATC step's argument - this is the sibling with the
      # identical shape, and an unbounded `continue-on-error` fetch is the trap
      # whichever host is slow. Measured on run 381: 4s and 3s, so the ceiling
      # is about fifteen times the observed cost and will only ever be reached
      # by something going wrong. One rather than two because the four caps
      # have to fit the job budget - see the ATC step.
      - name: Fetch NYNJTC's trail alerts
        if: env.PHONE_FILES == 'exporters'
        continue-on-error: true
        timeout-minutes: 1
        run: python fetch_nynjtc_alerts.py

      # Same shape as the ATC save above, and the same two caveats. The guard
      # keeps a cold-and-failed hour from computing the bare `nynjtc-alerts-`
      # prefix as its key - read that step for why that is the honest
      # description of what it does and "stops an empty entry being saved" is
      # not. And the content hash does not stop this entry churning hourly,
      # because fetch_nynjtc_alerts.py stamps `fetched_at` into the payload
      # too. It re-fetches every alert every run
      # rather than planning which are due, the way the ATC fetcher does, so
      # every entry in the file carries the new clock and not just the
      # document's header - these bytes move on every successful hour without
      # exception.
      - name: Save NYNJTC's trail alerts
        if: always() && env.PHONE_FILES == 'exporters' && hashFiles('pipeline/data/raw/nynjtc_alerts.json') != ''
        uses: actions/cache/save@v6
        with:
          path: pipeline/data/raw/nynjtc_alerts.json
          key: nynjtc-alerts-${{ hashFiles('pipeline/data/raw/nynjtc_alerts.json') }}

      # Exits without writing when there is no cache to read - a first run on
      # a cold cache whose fetch failed - which publish.py reads as "this
      # release has no such artifact" rather than as a failure.
      - name: Export NYNJTC's trail alerts
        if: env.PHONE_FILES == 'exporters'
        run: python export_nynjtc_alerts.py

      # The volunteer workdays (#760), from the same kind of reviewed file as
      # the ATC leg above, with the same refuse-unreviewed posture and now
      # the same environment-blindness: both legs publish the identical
      # reviewed content into their own tree. This step used to pass
      # $OURHIKE_DATA_ENV because the reviewed file's '[Sample]' rows
      # published to UA and dev only (maintainer decision 2026-08-20, on
      # #760); maintainer decision 2026-09-09 retired those rows, so there is
      # nothing for the environment to select between. Every environment
      # carries exactly what a real club has supplied, which today is an
      # empty list, published deliberately so the client's read path is live
      # before the first real row lands.
      #
      # TODAY'S BAKE ONLY. The dbt path's extract lands the same reviewed file
      # (raw_ourhike__work_projects) and pub_conditions_work_projects writes
      # conditions/work_projects.json, which publish.py takes from that writer
      # and drops this script's entry for (review finding ARC-10 of PR #1805 —
      # dlt → dbt re-platform as one go/no-go change).
      - name: Export the reviewed volunteer work projects
        if: env.PHONE_FILES == 'exporters'
        run: python export_work_projects.py

      # THE DROUGHT LEG (#720), and its whole design is about being cheap
      # enough to sit on an hourly clock without being rude to NDMC or to
      # this repository's Actions budget (#395).
      #
      # Two things make it nearly free on the 167 hours a week when nothing
      # has changed. `fetch_drought.py` knows the week's stamp before it
      # requests any body - that is why it takes the dated file rather than
      # usdm_current.json - so a release already in the restored cache costs
      # one existence check instead of a 27.6 MB download. And the export
      # below is skipped outright when the artifact already describes the
      # newest release on disk, which is the ordinary case for six days out
      # of seven.
      #
      # The cache carries the raw releases AND the centerline the clip needs.
      # Restoring rather than re-fetching the centerline matters most: it is
      # 12 MB from ATC's ArcGIS service, and pulling it hourly to clip a
      # weekly polygon set would be the same discourtesy the fetch skip
      # exists to avoid.
      - name: Restore the drought inputs
        id: drought-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            pipeline/data/raw/drought
            pipeline/data/raw/centerline.geojson
            pipeline/data/processed/conditions/drought.json
          key: drought-inputs-${{ github.run_id }}
          restore-keys: drought-inputs-

      # A ceiling here buys something different from the two above, and the
      # difference is worth naming rather than letting the number imply a
      # rescue it cannot perform. #1318 calls the drought fetch an identical
      # shape to the ATC one; it is not, because it carries no
      # `continue-on-error`. A timeout on this step therefore fails the job
      # rather than being absorbed - the publish does not happen either way.
      # What it converts is `cancelled` with every step from here down
      # `skipped` into `failure` naming the step that hung, which is the
      # difference between a maintainer reading the Actions tab and guessing,
      # and reading it and knowing. Two minutes: measured at 0s and 1s on run
      # 381's warm cache, and this fetch pulls USDM's weekly shapefile when the
      # week has moved. Bounded by the job budget rather than by that fetch's
      # own worst case - see the ATC step.
      - name: Fetch this week's drought release
        id: drought-fetch
        timeout-minutes: 2
        run: python fetch_drought.py

      # The centerline, only when the cache did not carry one. Its own step
      # rather than a line inside the export, so that a cold cache is visible
      # in the log as the thing that made a run slow.
      #
      # This was an inline python heredoc until #1295 - a second, untested
      # implementation of lib/arcgis.py's offset paging, on urllib with no
      # retry, carrying the stop-on-a-short-page bug that lib/arcgis.py's own
      # regression tests exist to prevent. fetch_centerline.py owns the query
      # shape now and the shared paginator owns the loop; the script's
      # docstring has the argument. Being a real file also makes this fetch
      # visible to scripts/pipeline_scopes.py, which reads a workflow's scope
      # off the <name>.py files it mentions and could not see a heredoc.
      # One minute, on the drought step's argument (legibility, not rescue),
      # and this is the cap most obviously bounded by the job rather than by
      # the work: it is 0s whenever the restore carried a centerline, and an
      # ArcGIS offset-paged fetch of the whole corridor when it did not, which
      # a minute may well not cover. SAID PLAINLY rather than sized to look
      # generous - a cold-cache run needing longer than this had already lost,
      # since the four ceilings together fill the job budget and there is no
      # minute to give it. What the cap changes is that the log names this step
      # instead of the run reading `cancelled`.
      - name: Fetch the centerline, if the cache did not have it
        timeout-minutes: 1
        run: |
          if [ ! -s data/raw/centerline.geojson ]; then
            python fetch_centerline.py
          else
            echo "Centerline restored from cache."
          fi

      # One command, and the skip lives inside it (#731).
      #
      # This step used to be an inline python that decided whether to call
      # export_drought.py at all, and skipping it meant no drought_manifest.json
      # was written - which meant publish.py had nothing to collect and the
      # bands were uploaded never, with every step green. The export owns the
      # decision now: it rebuilds only when USDM's week has moved, and it
      # rewrites the manifest on every run either way, because the manifest is
      # not a record of work done but the statement "this file is ready to
      # publish" - true on a skipped run too.
      #
      # Measured: 0.35 s when the week has not moved, ~43 s when it has.
      - name: Export the drought bands
        run: python export_drought.py

      # THE ENTRY THE HEADER'S ARITHMETIC IS ACTUALLY ABOUT: the 27.6 MB
      # release plus the 12 MB centerline, 18.6 MB of them compressed and sent
      # 24 times a day under a key that could not repeat (measured on run #342,
      # 2026-09-09). This is the one a content hash fixes outright, down to one
      # entry per USDM release.
      #
      # THE KEY HASHES THE INPUTS, NOT EVERYTHING THE PATH SAVES, and the
      # difference is deliberate. `data/raw/drought` is a dated release file
      # and `centerline.geojson` is refetched only when the cache did not
      # carry one, so both are byte-stable for a week at a time and a hash of
      # them is a name for "which week's inputs are these". The third path,
      # the built artifact, is not: it carries its own `generated_at` from the
      # wall clock of whichever run built it (export_drought.py's
      # `build_document`), so two cold runs in the same week would produce
      # different bytes from identical inputs and earn a second full entry for
      # nothing.
      #
      # It is still saved - it is what makes the hourly run cheap, because
      # export_drought.py skips the ~43 s rebuild when the artifact on disk
      # already names this week (its `already_published`). That skip is also
      # why hashing the artifact would not have been the hourly disaster it
      # looks like: the exporter rewrites the MANIFEST on every run but not the
      # artifact, so these bytes really do sit still for six days out of seven.
      # Run #342 is that measured rather than argued - "3 drought row(s),
      # generated 2026-09-03T21:55:22Z" on a run six days later, and publish.py
      # reporting `skipped ['conditions/drought.json']` because the hash still
      # matched what was in the bucket. Hashing the inputs is the stronger
      # choice rather than the rescue: the key then means what produced the
      # entry, not when.
      #
      # The guard is the ATC step's, and this is the step where it is more
      # than tidiness. hashFiles is empty only when neither INPUT is on disk -
      # but the third path is an OUTPUT, which could in principle be there
      # when they are not, so this is the one key that could carry a payload
      # under the bare `drought-inputs-` prefix the restore above searches on.
      # Nothing in today's scripts reaches that state (export_drought.py
      # cannot write the artifact without a release to read), so this is an
      # invariant held cheaply rather than a fix for something observed, and
      # it is worth holding because the thing that would break it is a fourth
      # path added by somebody reading the paths and not this comment.
      #
      # A run that produced one input and not the other still saves, and
      # self-heals - fetch_drought.py refetches a missing release, and the
      # centerline step above refetches a missing centerline.
      #
      # WHAT HASHING THE INPUTS COSTS, because the paragraph above says only
      # what it buys. One key per USDM week is one ENTRY per USDM week, and
      # `actions/cache/save` does not overwrite a key that exists - it warns
      # and returns (actions/cache's `saveImpl`, read 2026-09-09). So a week
      # whose first run saved before it had a good artifact - the export
      # failed, or the job died between the fetch and the export - pins an
      # artifact-less entry under that week's key, and every remaining hour of
      # that week pays the ~43 s rebuild it was meant to skip. Nothing a hiker
      # reads moves: export_drought.py decides from the artifact on disk
      # (`already_published`), never from the cache, so those hours rebuild and
      # publish the correct bands. It is runner time only, and it ends when
      # USDM's week does.
      - name: Save the drought inputs
        if: always() && hashFiles('pipeline/data/raw/drought/**', 'pipeline/data/raw/centerline.geojson') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            pipeline/data/raw/drought
            pipeline/data/raw/centerline.geojson
            pipeline/data/processed/conditions/drought.json
          key: drought-inputs-${{ hashFiles('pipeline/data/raw/drought/**', 'pipeline/data/raw/centerline.geojson') }}

      # NWS'S ACTIVE ALERTS, MOVED HERE FROM publish-weather.yml (ELT.md
      # decision 28a, "One job owns `warnings`"): this job builds the warnings
      # mart, so it alone reads NWS; the weather job keeps the NBM forecast.
      # UA leg only: conditions/weather_alerts.json is UA's only today
      # (publish-weather.yml's "UA ONLY, BY DESIGN FOR NOW": nothing a hiker
      # runs reads it yet), and its squares are built from UA's trails.
      #
      # The squares are publish-weather.yml's: build_weather_squares.py
      # rebuilds them when UA's release moves and saves them under
      # `weather-squares-`. Restore only, because a save here would race the
      # weather job's. The four paths match that save exactly, because
      # actions/cache finds an entry by its paths as well as its key. How many
      # bytes the three grids add to every UA run is unmeasured; the first
      # run's restore log line says.
      - name: Restore the weather squares (UA leg)
        if: matrix.data_environment == 'ua'
        uses: actions/cache/restore@v6
        with:
          path: |
            pipeline/data/raw/weather/squares.json
            pipeline/data/raw/weather/urma_terrain.grb2
            pipeline/data/raw/weather/hrrr_height.grb2
            pipeline/data/raw/weather/hrrr_land.grb2
          key: weather-squares-${{ github.run_id }}
          restore-keys: weather-squares-

      # One request: NWS's whole active list, 2.6 MB at 2026-09-25 20:54 UTC
      # (export_weather_alerts.py's docstring), placed on the squares.
      # Measured "alerts under 1 s" on the weather job's runners
      # (publish-weather.yml, 2026-09-25/29), so the one-minute cap is about
      # sixty times the observed cost and fits this job's cap.
      # `continue-on-error` so NWS not answering never holds back the
      # closures: export_weather_alerts.py then writes nothing, and publish.py
      # carries the last weather_alerts.json forward with its own fetched_at.
      #
      # TODAY'S BAKE ONLY. On the dbt path the extract reads NWS's active list
      # itself (raw_nws__alerts) and pub_conditions_weather_alerts writes
      # conditions/weather_alerts.json, which publish.py takes from that writer
      # and drops this script's entry for, so running it there asked NWS a
      # second time each hour for nothing (ARC-10, as above). The squares'
      # restore above still runs on both: the dbt path's step_weather_squares
      # reads them.
      - name: Fetch NWS's active alerts and place them on trail squares (UA leg)
        if: matrix.data_environment == 'ua' && env.PHONE_FILES == 'exporters'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          if [ ! -s data/raw/weather/squares.json ]; then
            echo "::warning title=No weather squares::The weather job's squares cache did not restore, so no NWS alerts were placed this run and the last conditions/weather_alerts.json stands. publish-weather.yml rebuilds and saves the squares."
            exit 0
          fi
          python export_weather_alerts.py

      # THE dbt PATH, pipeline/ELT.md's hourly lane, in three steps: the
      # registry, this leg's upstreams, and the build.
      #
      # 1. THE REGISTRY, FROM THIS CHECKOUT. The closures and warnings marts
      # keep only rows whose source may publish (int_sources__publication,
      # which reads sources.json). ELT.md has each hourly leg defer to its
      # environment's monthly warehouse for that, and no monthly run has
      # stored one yet (refresh-reference.yml's "Store the warehouse"), so
      # the leg loads sources.json itself: git's copy at this commit, through
      # the monthly lane's own resource, into a store on this runner that
      # dies with it. Nothing of it reaches the raw store. It runs first
      # because the leg's load below replaces `_extract_runs` with its own
      # run log.
      - name: Load the source registry from this checkout (dbt path)
        if: env.PHONE_FILES == 'dbt'
        timeout-minutes: 1
        run: >-
          "$RUNNER_TEMP/extract/bin/python" -m extract._run --lane monthly
          --only raw_registry__sources --bucket-url "file://$RUNNER_TEMP/registry-store"
          --pipelines-dir "$RUNNER_TEMP/dlt" --warehouse data/warehouse.duckdb
          --summary "$GITHUB_STEP_SUMMARY"

      # 2. THIS LEG'S UPSTREAMS, THROUGH dlt, INTO THE RAW STORE: the twelve
      # tables decision 61 keeps hourly (extract/_run.py's HOURLY_JOB_TABLES):
      # OurHike's own rows from this leg's database, NWS, ATC's and NYNJTC's
      # notices (NYNJTC's terms when a day old), OPRHP's trail closures and
      # the work projects, through extract/_run.py's conditions_production or
      # conditions_ua leg, each its own dlt pipeline at
      # s3://<R2_RAW_BUCKET>/raw/dlt/<leg>/. Every table of those the leg has
      # committed then goes into the warehouse, and nothing else its store
      # kept (it still holds the 80 notice layers it read before decision 61,
      # frozen at the move); a table whose recorded load left no file is
      # refused, not read as "no closures". Every other club's notices come in
      # at step 2b.
      #
      # ONE UPSTREAM'S FAILURE IS ITS OWN (extract/_run.py's read_each). Each
      # is read separately within --read-seconds; one that fails, times out
      # or is refused by the run check is left out, its last committed table
      # standing, while the rest load. No host's Crawl-delay is shortened to
      # fit: ATC's is 10 s, so only trail-updates pages whose sitemap lastmod
      # moved are read, plus a few re-reads, and the rest carry over
      # (extract/_kinds.py's AtcTrailUpdatePages; about 12 pages fit the
      # budget, Reasoned). A read that runs out lands nothing, keeps what it
      # read for the next hour, and is annotated "not yet loaded" or
      # "incomplete" without failing the run, so a first run on an empty raw
      # store completes over about 8 hours. OurHike's own rows are the
      # exception and stop the leg, as export_conditions.py stops today's
      # bake. A refusal exits 3: this step records it, and a step after the
      # publish warns, never red since decisions 100 and 101; the freshness
      # step at the end turns red once a refused source has gone 24 hours
      # unread, NWS's alerts 2 hours. A
      # refused row whose sources.json says reaches_hikers false exits 0
      # instead (extract/_run.py's exit_status()). This leg takes on every table it
      # has never loaded in one run (NEW_TABLES_PER_LEG_RUN's None for the
      # conditions job): one left waiting would be absent from the warehouse
      # and fail the build below. The limit of 10 it had came from run 506,
      # which met 70 new layers at once, all of them the notices job's now.
      #
      # THE BUDGET: change checks end after 45 s (extract/_run.py's
      # LEG_CHECK_SECONDS), then 150 s of reading, inside the 6-minute step
      # below. Kept as they were, because decision 61 shrank this step's
      # work rather than its budget: this leg now reads 12 upstreams. Run 505
      # (37151246098, 2026-10-03), the last before the 70 notice layers came
      # on, took this step 70 s reading 13, and run 510 (37176072338,
      # 2026-10-04) 169 s for 89 resources, 20 of them read. Not cut back to
      # 4 minutes: ATC's trail-updates pages carry their reads to the end of
      # whatever budget is left (run 510 spent the whole 150 s), so 45 s of
      # checks and 150 s of reads can still take 3 m 15 s before the load
      # (Reasoned). The 12-table leg has been timed since: the 29 soak
      # dispatches from run 532 to 566 took this step 60 to 98 s (Measured
      # 2026-10-06 from the Actions API's step times), the figures a smaller
      # cap would be sized from.
      - name: Extract this leg's closures and warnings into the raw store (dbt path)
        id: extract
        if: env.PHONE_FILES == 'dbt'
        # 6, not 4: soak runs 506 and 512 each ran out of 4 minutes, one on its
        # load and one on a change check that waited 2 m 12 s for a host
        # refusing connections. The maintainer, 2026-10-04: "if this is going
        # to be too hard to keep fast, let's expand now". The job's cap still
        # holds: run 512 spent about 1 minute before this step and 40 s after.
        timeout-minutes: 6
        # EACH LEG IS HANDED ITS OWN DATABASE'S URL AND NO OTHER, as
        # CONDITIONS_DATABASE_URL, the one name the extract reads. Each secret
        # sits behind its own leg's test, so an unset one is an empty string
        # rather than the other leg's ("Is there a database to read" says why
        # that is the mistake to make impossible). Picking it in the script
        # and then `unset`-ting both names, as this step did, kept them from
        # the extract but not from this step's shell, whose /proc/<pid>/environ
        # the extract's python, its child, can read: production's URL was
        # there on every UA run (review finding SEC-7 of PR #1805 — dlt → dbt
        # re-platform as one go/no-go change).
        # .github/tests/test_conditions_extract_sees_one_database_url.py runs
        # this step per leg and reads every ancestor's environment.
        env:
          LEG: conditions_${{ matrix.data_environment }}
          CONDITIONS_DATABASE_URL: ${{ matrix.data_environment == 'production' && secrets.PRODUCTION_CONDITIONS_DATABASE_URL || matrix.data_environment == 'ua' && secrets.UA_CONDITIONS_DATABASE_URL || '' }}
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set +e
          "$RUNNER_TEMP/extract/bin/python" -m extract._run --lane "$LEG" --raw-bucket "$R2_RAW_BUCKET" \
            --read-seconds 150 --pipelines-dir "$RUNNER_TEMP/dlt" \
            --warehouse data/warehouse.duckdb --summary "$GITHUB_STEP_SUMMARY"
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      # 2b. EVERY OTHER CLUB'S NOTICES, FROM extract-notices.yml (decision
      # 61): its leg for this environment, notices_<env>, writes a served copy
      # after each run that commits (extract/_warehouse.py, "THE SERVED
      # COPY"), and this adds the newest one to the warehouse, read-only: its
      # tables of the notices job, and its run log rows beside this leg's in
      # `_extract_runs`. Never the notices store itself, because a notices
      # load committing while this reads would tear it.
      #
      # IT NEVER STOPS THE HOURLY PUBLISH. A copy that will not read is
      # retried, then the one before is read, the notices' last good rows
      # (`read=older`, exit 5). No copy at all is a warning (`read=none`,
      # exit 6) while the leg's first committed run is under 8 hours old,
      # and past that, or with no committed run at all, it is overdue
      # (`read=none` and `overdue=true`, exit 8: decision 96, the
      # maintainer's poll of 2026-10-06, "Red after 8 h, like stale").
      # Anything else (`read=unread`) builds without the notices store and
      # says so. In every case but `latest` the build below saves no row
      # history, so a notice missing from this build is never recorded as
      # removed, and `older`, `unread` and an overdue `none` turn the run
      # red at the end, after everything else has published.
      #
      # A NEWEST COPY OF ANY AGE IS STILL `latest`, AND ITS AGE IS SAID. The
      # log line gives how long before this read the copy's run began. Past
      # extract/_warehouse.py's SERVED_STALE_HOURS (8, twice the notices
      # cron's 4 hours, @unvalidated there) it exits 7: still `latest`, so
      # the build publishes and saves history as usual, and `stale=true`
      # turns the run red at the end, as the extract's exit 3 does. Whenever
      # a copy was read, --env-file puts OURHIKE_NOTICES_READ_AT, the instant
      # its run began, in $GITHUB_ENV, so build_marts.py's dbt commands below
      # inherit it.
      #
      # Two minutes, @unvalidated: the copy is one Parquet file per notices
      # table, read 8 at a time (LEG_READERS), and soak run 508 read 92 such
      # tables, 11,999 rows, from this store in about 55 s one at a time.
      - name: Add the notices legs' newest served copy to the warehouse (dbt path)
        id: notices
        if: env.PHONE_FILES == 'dbt'
        timeout-minutes: 2
        env:
          LEG: notices_${{ matrix.data_environment }}
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: auto
        run: |
          set +e
          "$RUNNER_TEMP/extract/bin/python" -m extract._warehouse add-served --lane "$LEG" --raw-bucket "$R2_RAW_BUCKET" \
            --pipelines-dir "$RUNNER_TEMP/dlt" --warehouse data/warehouse.duckdb --summary "$GITHUB_STEP_SUMMARY" \
            --env-file "$GITHUB_ENV"
          status=$?
          set -e
          case "$status" in
            0) served=latest ;;
            5) served=older ;;
            6) served=none ;;
            7)
              served=latest
              echo "stale=true" >> "$GITHUB_OUTPUT"
              ;;
            8)
              served=none
              echo "overdue=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              served=unread
              echo "::error title=Notices not read::$LEG's served copy could not be added (exit $status), so this build has no club notices beyond the hourly job's own. Everything else still builds and publishes."
              ;;
          esac
          echo "read=$served" >> "$GITHUB_OUTPUT"

      # 3. THE BUILD, in build_marts.py's order: the closures and warnings
      # marts with their tests, then their pub_ writers last, into
      # data/processed/dbt/. `--lane hourly` builds only the hourly nodes and
      # the monthly ones they read (the registry above), with
      # `--indirect-selection cautious` so no test on a monthly mart this
      # warehouse lacks is pulled in. The weather squares' step needs
      # squares.json (the UA leg, on a cache hit); otherwise `--without-step`
      # drops it and everything it unblocks, and
      # conditions/weather_alerts.json keeps its last file. Measured on the
      # fixtures 2026-10-02, a loaded 4-core sandbox: 56.8 s for the marts
      # and their 184 nodes, 21.5 s for the four writers.
      #
      # THE ROW HISTORY (pipeline/row_history.py): this leg's snapshots,
      # int_closures__history and int_warnings__history, are restored from
      # history/conditions_<leg>/ in the raw store's bucket before dbt runs,
      # and saved back only after the writers succeed. There is one prefix
      # per leg because each leg is its own pipeline. Both go through the
      # extract's venv, which has s3fs. The key is the raw store's own, as
      # the extract step above has it. Only the UA leg reaches this step
      # until the cutover: PRODUCTION_PHONE_FILES is `exporters`, and a
      # dispatched dbt path refuses a production leg (above).
      #
      # A FAILED RESTORE DOES NOT STOP THE PUBLISH (the maintainer, by poll,
      # 2026-10-03). This includes an empty prefix once row_history_stores.toml
      # lists the leg. `--history-on-failure degrade` then builds both marts
      # from their final intermediates with `_first_seen_at` and `_changed_at`
      # null (unknown, never "new") and saves nothing. build_marts.py exits
      # DEGRADED_EXIT, 4, which only that path returns. This step records it
      # as history_lost and carries on, so the files publish. The last step
      # below then turns the run red so the store gets fixed. Any other
      # failure stops here, as before.
      #
      # ONE SOURCE OR ONE WRITER NEVER STOPS THE REST (decision 81, the
      # maintainer's poll of 2026-10-05: "Hold that source and publish the
      # rest"; review finding ARCH-1 of PR #1805 — dlt → dbt re-platform as
      # one go/no-go change). Five of the soak's first ten runs published
      # nothing for anyone: 525 to 527 and 530 on a test of one source's
      # rows, and 531 on one writer after six others had written.
      # build_marts.py now exits PARTIAL_EXIT, 5, when part of the build was
      # held back and the rest finished: a source the gate held for its rows,
      # a per-source model that failed (its source then held), writers that
      # failed while the others wrote, each failed one's file removed, or a
      # table the extract withdrew (OurHike's field notes and disputes, when
      # the reader cannot see them), left out of every dbt build. This
      # step records it as `partial` and carries on, "Publish to R2" keeps a
      # failed writer's key at the bucket's last copy (OURHIKE_BUILD_PARTIAL)
      # and publishes every file that was written, and the last step below
      # turns the run red, as the extract's exit 3 does. 6 is both 4 and 5.
      #
      # `--no-history-save` when step 2b did not add the newest notices copy:
      # the history is restored and the build dates rows from it, but nothing
      # is saved, so a notice this build lacks is never closed in the history
      # (build_marts.py's docstring).
      #
      # SIX MINUTES, NOT FOUR, until decision 103 (WF5 of the PR #1805 review,
      # and ARCH-7's cap).
      # Measured from the API's step times for the UA leg's seven green soak
      # runs 529 to 539 (2026-10-04/05): this step took 83 to 182 s, and the
      # rest of the job 132 to 179 s. Run 538's 182 s was 6.5 s restoring the
      # row history, 9.4 s of seeds, 93 s of stage A, 12.8 s for the weather
      # squares and what they unblock, 45.8 s of writers and 14.6 s saving the
      # history. A step that hits its cap fails the job and skips "Publish to
      # R2", so every hourly file misses that hour, and 4 minutes left 58 s.
      # Six was about twice the slowest build, and a build at its full cap
      # plus run 536's 179 s outside it was 539 s, inside the job's 600.
      #
      # TEN MINUTES SINCE ELEMENTARY (decision 103; the maintainer,
      # 2026-10-08: "Boosting the budget to 10 mins should be fine, if you
      # think we can keep it that low"). build_marts.py now builds
      # Elementary's tables first and its end-of-run hook records each dbt
      # command (decision 102). On the fixtures in a sandbox the same day,
      # this lane's build took 128 s with Elementary and 68 s without (132 s
      # and 74 s on a second machine), about 33 s of it Elementary's tables
      # and 18 s the hook after stage A (Measured). CI's dbt job suggests a
      # runner pays 1.2 to 1.65 times what the sandbox did (pipeline/ELT.md,
      # "What step 1 measured"), so on the soak's slowest green build, 203 s,
      # this step is about 273 to 303 s: inside 6 minutes alone, but not with
      # a retry of stage A beside it (Reasoned from those sums; this step's
      # summary line on the first UA runs settles it). The job's cap rose to
      # 15 to hold this one.
      # .github/tests/test_conditions_build_budget.py holds both sums; the
      # headroom it asks for is @unvalidated, and a few weeks of this step's
      # summary line would show how fast the build grows.
      - name: Build the closures and warnings marts and their writers (dbt path)
        id: build
        if: env.PHONE_FILES == 'dbt'
        timeout-minutes: 10
        env:
          ENVIRONMENT: ${{ matrix.data_environment }}
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: auto
          NOTICES_READ: ${{ steps.notices.outputs.read }}
        run: |
          started=$SECONDS
          without=()
          if [ "$ENVIRONMENT" != "ua" ] || [ ! -s data/raw/weather/squares.json ]; then
            without=(--without-step step_weather_squares)
          fi
          history=()
          if [ "$NOTICES_READ" != "latest" ]; then
            history=(--no-history-save)
          fi
          set +e
          python build_marts.py --lane hourly --dbt "$RUNNER_TEMP/dbt/bin/dbt" "${without[@]}" "${history[@]}" \
            --history-url "s3://$R2_RAW_BUCKET/history/conditions_$ENVIRONMENT" \
            --history-python "$RUNNER_TEMP/extract/bin/python" --history-on-failure degrade
          status=$?
          set -e
          printf -- '- build_marts.py --lane hourly %s: %s s, exit %s\n\n' "${without[*]} ${history[*]}" "$((SECONDS - started))" "$status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 4 ]; then
            echo "history_lost=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 5 ]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 6 ]; then
            echo "history_lost=true" >> "$GITHUB_OUTPUT"
            echo "partial=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Export verified conditions
        id: export
        if: steps.can.outputs.go == 'true'
        # This leg's URL alone, by the extract step's expression and for its
        # reason: picked in the script from both, the other leg's URL sat in
        # the environment of the shell export_conditions.py runs under (found
        # by round-2 fix worker B of PR #1805, the extract step's SEC-7 again).
        # .github/tests/test_conditions_extract_sees_one_database_url.py runs
        # this step per leg too.
        env:
          CONDITIONS_DATABASE_URL: ${{ matrix.data_environment == 'production' && secrets.PRODUCTION_CONDITIONS_DATABASE_URL || matrix.data_environment == 'ua' && secrets.UA_CONDITIONS_DATABASE_URL || '' }}
        run: python export_conditions.py

      # Printed before publishing, because "it read something" and "it
      # published something" are different facts and only the first one
      # explains an empty upload.
      #
      # Both manifests, and neither is required to exist: the conditions one
      # is absent until the database secret is configured, the ATC one until
      # somebody reviews the file. A run that produced neither prints nothing
      # here and "Nothing changed" below, which is the honest pair.
      - name: Say what was read
        run: |
          python -c "
          import json, pathlib
          for name in ('conditions_manifest.json', 'atc_updates_manifest.json', 'drought_manifest.json'):
              path = pathlib.Path('data/processed') / name
              if not path.exists():
                  continue
              for kind, entry in json.loads(path.read_text())['artifacts'].items():
                  reviewed = entry.get('reviewed_at')
                  when = f\", reviewed {reviewed}\" if reviewed else ''
                  print(f\"{entry['count']} {kind} row(s), generated {entry['generated_at']}{when}\")
          "

      - name: Publish to R2
        id: publish
        env:
          # The gate publish.py checks. Set only on this step, so every other
          # step here is structurally incapable of writing to the bucket -
          # publish-vector-data.yml sets it the same way for the same reason.
          R2_WRITE_ENABLED: "true"
          # And the one that decides where. This job's whole shape is one run
          # per environment, so the matrix value is the answer rather than an
          # input somebody picks (features/DATA_ENVIRONMENTS.md).
          OURHIKE_DATA_ENV: ${{ matrix.data_environment }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # The cutover switch, as publish.py reads it ("THE CUTOVER SWITCH"
          # there): `dbt` takes each key a dbt exposure names from its
          # writer's file and drops the exporter's entry. Writers that did not
          # run in this job, every release-scoped one among them, are "kept":
          # nothing is written for them, as today's bake writes nothing
          # outside conditions/.
          OURHIKE_PHONE_FILES: ${{ env.PHONE_FILES }}
          # "true" when the build exited PARTIAL_EXIT: publish.py then keeps a
          # failed writer's key at the bucket's last copy, its file never
          # read, rather than refusing the whole publish (decision 81).
          OURHIKE_BUILD_PARTIAL: ${{ steps.build.outputs.partial }}
        # publish.py collects whatever data/processed/ holds, which in this
        # job is the conditions manifest and nothing else - a fresh checkout
        # has run no other export script. The manifest merge is additive, so
        # the trail artifacts already in latest.json survive untouched.
        #
        # On the dbt path a source int_closures__gate holds back writes no
        # file, so its last copy stays, and publish.py exits 1 after
        # uploading the rest, with an annotation naming the source and why.
        run: |
          started=$SECONDS
          python publish.py
          printf -- '- publish.py (OURHIKE_PHONE_FILES=%s): %s s\n\n' "$OURHIKE_PHONE_FILES" "$((SECONDS - started))" >> "$GITHUB_STEP_SUMMARY"

      # THE WAREHOUSE, HANDED TO THE CHECKS (decision 110; pipeline/hand_off.py):
      # every Elementary check of this lane runs in check-conditions.yml, which
      # the `checks` job below starts once every leg has got here, over this
      # build's warehouse. It goes to this leg's history store, beside the
      # history the build just saved, in the private raw store, overwriting the
      # last build's; never as an Actions artifact, which anyone could download
      # from a public repository (hand_off.py says why). After the publish,
      # never before it, so its upload cannot delay a hiker's files; whether
      # the publish went green or red, since publish.py exits 1 for a held
      # source after uploading everything else, the hour the checks matter
      # most. continue-on-error, so a failed hand-off never turns the publish
      # red: hand_off.py's ::error says why, and the checks of this run then
      # say they found nothing to check.
      #
      # ONE MINUTE, which the job's budget leaves
      # (.github/tests/test_conditions_build_budget.py), @unvalidated: the
      # warehouse's size over R2 decides it, and this step's log line gives
      # both. build_marts.py writes the build's record into the warehouse last
      # (its docstring, "THE HOURLY LANE'S CHECKS RUN APART"), so what crosses
      # is the whole of what the checks need.
      - name: Hand this build's warehouse to its checks (dbt path)
        if: ${{ !cancelled() && env.PHONE_FILES == 'dbt' && steps.build.outcome == 'success' && (steps.publish.outcome == 'success' || steps.publish.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          ENVIRONMENT: ${{ matrix.data_environment }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: auto
        run: >-
          "$RUNNER_TEMP/extract/bin/python" hand_off.py put
          --url "s3://$R2_RAW_BUCKET/history/conditions_$ENVIRONMENT"
          --warehouse data/warehouse.duckdb --run "$RUN" --attempt "$ATTEMPT"

      # A WARNING, NEVER RED: decision 100 (the maintainer's poll of
      # 2026-10-07, on round-2 finding ARC-5 of PR #1805 — dlt → dbt
      # re-platform as one go/no-go change: "Red after 24h. But this should be
      # Red in the data source freshness feature of dbt. Not blocking a
      # datasource pipeline"), which named the notices job, and decision 101
      # (the maintainer's poll of 2026-10-07: "Both, NWS red after 2 h"),
      # which brought this leg under it. Until them this step turned the run
      # red for one refused source, decision 30's soak counting "no failed
      # check". The source's last committed table stands, the extract step's
      # summary names it and why, and the step "Check the notice sources'
      # freshness, red after 24 hours unread (dbt path)" turns red once it has
      # gone 24 hours without a read or a confirmation that it is unchanged
      # (ATC's, NYNJTC's and OPRHP's notices and the reviewed files), or 2
      # hours for NWS's alerts, each tagged `conditions_job`. OurHike's own
      # rows still stop the leg, red at once.
      - name: Warn when a source was refused on its own (dbt path)
        if: steps.extract.outputs.partial == 'true'
        run: |
          echo "::warning title=A source was refused::This leg left at least one upstream out of its extract, and its last committed table stood in for it. The run summary names it and the reason; everything else was published. Its dbt source freshness, the last step, turns red once it has gone 24 hours unread, 2 hours for NWS's alerts."

      # Last for the same reason: what the build held back (decision 81) did
      # not hold back the files that were written, and the run still goes red
      # for it. The build step's log names each held source with its rows, or
      # each failed writer, whose key kept the bucket's last copy.
      - name: Fail the run if the build held a source or a writer back (dbt path)
        if: steps.build.outputs.partial == 'true'
        run: |
          echo "::error title=Part of the build held back::The build held back a source for its rows or its own failed model, a writer that failed, a table the extract withdrew, or Elementary's history, which failed to restore or save while the row history did not (decision 102), and published everything else. The build step's log names each one and why; a held source carries its last good rows and a failed writer's file keeps its last published copy."
          exit 1

      # Last for the same reason: the closures and warnings files published
      # with their row dates null, and the run still goes red, because the
      # history store needs fixing before the next run can date anything.
      # build_marts.py's own ::error above says which restore failed.
      - name: Fail the run if the row history was not restored (dbt path)
        if: steps.build.outputs.history_lost == 'true'
        env:
          ENVIRONMENT: ${{ matrix.data_environment }}
        run: |
          echo "::error title=Row history not restored::This leg's row history (history/conditions_$ENVIRONMENT/ in the raw store) could not be restored, so closures and warnings published with _first_seen_at and _changed_at null and nothing was saved. Fix the store; the next run that restores it dates rows again."
          exit 1

      # Last for the same reason: the closures and warnings files published
      # without the newest notices copy, and the run goes red so the notices
      # store or its copy gets looked at. Step 2b's summary says which copy
      # was read, if any, and why the newer ones were not. A store with no
      # copy is the step after this one's.
      - name: Fail the run if the notices legs' newest copy was not read (dbt path)
        if: steps.notices.outputs.read == 'older' || steps.notices.outputs.read == 'unread'
        env:
          NOTICES_READ: ${{ steps.notices.outputs.read }}
        run: |
          echo "::error title=Notices not current::The notices legs' newest served copy was not read ($NOTICES_READ), so this hour's closures and warnings marts hold older club notices or none. Everything else was published, and no row history was saved."
          exit 1

      # Last for the same reason: the newest notices copy was read and
      # published, and its run began more than 8 hours before this read
      # (extract/_warehouse.py's SERVED_STALE_HOURS). Step 2b's log line and
      # summary give its age. The row history was saved as on any newest
      # copy: no newer one exists for a notice to be missing from.
      - name: Fail the run if the notices legs' newest copy is over 8 hours old (dbt path)
        if: steps.notices.outputs.stale == 'true'
        run: |
          echo "::error title=Notices copy stale::The notices legs' newest served copy began its run more than 8 hours before this read, so this hour's club notices are at least that old. Everything was published and the row history saved. extract-notices.yml has written no copy since; look at its runs."
          exit 1

      # Last for the same reason, and decision 96's: the notices leg has no
      # served copy and has owed one for more than 8 hours, counted from its
      # first committed run (extract/_warehouse.py's SERVED_OVERDUE_EXIT), or
      # has never committed one. So this hour's closures and warnings
      # published with none of the notices job's club notices, as an `older`
      # copy's would with its last good ones, and the row history was not
      # saved (`--no-history-save` above). Before decision 96 that was green
      # however long it lasted (review finding PY-3 of PR #1805 — dlt → dbt
      # re-platform as one go/no-go change). Only a leg on the dbt path gets
      # here: on the exporters the read above is skipped and writes no
      # output, which is why production's leg, whose notices leg
      # extract-notices.yml skips until the cutover, is never red for it.
      - name: Fail the run if the notices leg has written no copy for over 8 hours (dbt path)
        if: steps.notices.outputs.overdue == 'true'
        env:
          LEG: notices_${{ matrix.data_environment }}
        run: |
          echo "::error title=No notices copy::$LEG has written no served copy for more than 8 hours, or has never committed a run, so this hour's closures and warnings hold none of its club notices. Everything else was published, and no row history was saved. Step 2b's summary says since when; look at extract-notices.yml's runs for this environment."
          exit 1

      # DECISION 100's RED, IN dbt's SOURCE FRESHNESS (the maintainer's poll of
      # 2026-10-07, on round-2 finding ARC-5 of PR #1805 — dlt → dbt
      # re-platform as one go/no-go change: "Red after 24h. But this should be
      # Red in the data source freshness feature of dbt. Not blocking a
      # datasource pipeline"). A notice source the extract could not read is a
      # warning on its extract run, its last committed table standing; this
      # turns the run red once one has gone 24 hours without being read or
      # confirmed unchanged (48 for a source read once a day). Each source is
      # measured from the run log in this build's warehouse
      # (macros/last_read_or_confirmed_at.sql), never from `_loaded_at`, which
      # a FRESH check leaves at the last load; the thresholds are
      # generate_notice_models.py's FRESHNESS_HOURS.
      #
      # LAST, AND NEVER IN THE WAY. After "Publish to R2", and after the build,
      # which saved the row history, so nothing this finds holds back a file or
      # a save; and after every other red step, because each of those is
      # skipped once a step before it fails, so `!cancelled()` lets this one
      # report whatever went red before it. It reads the warehouse alone.
      #
      # HERE, NOT IN extract-notices.yml. This is the one job that holds the
      # warehouse the phone files were written from, with this leg's run log
      # and the notices copy's side by side (extract/_warehouse.py's
      # add_served()), so it measures what hikers were sent this hour, through
      # whichever copy was read. The notices job installs the extract's pins
      # alone and builds no warehouse; and a notices job that stops running,
      # or stops serving copies, cannot report its own silence, while this
      # run then reads the last copy and turns red once its reads are 24
      # hours old.
      #
      # THE NOTICES JOB'S SOURCES ONLY WITH A COPY. `tag:notices_job` is
      # measured when step 2b read one (`latest` or `older`): without one this
      # warehouse holds none of their run log, every one would read as never
      # read, and that state is step 2b's to report (decision 96's 8 hours,
      # and the `unread` step above). `tag:conditions_job`, this leg's own
      # upstreams that it can refuse on its own, is measured every run.
      #
      # ONE MINUTE: 11 s for the 267 tagged sources on the fixture warehouse,
      # three runs alike (Measured 2026-10-07 in a sandbox), most of it dbt
      # parsing the project. @unvalidated on a runner, whose step time
      # settles it. .github/tests/test_conditions_build_budget.py holds it
      # inside the job's cap beside the build's, and
      # .github/tests/test_conditions_notice_freshness.py holds the rest.
      - name: Check the notice sources' freshness, red after 24 hours unread (dbt path)
        if: ${{ !cancelled() && env.PHONE_FILES == 'dbt' && steps.build.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: pipeline/dbt
        env:
          NOTICES_READ: ${{ steps.notices.outputs.read }}
        run: |
          selection=(tag:conditions_job)
          case "$NOTICES_READ" in
            latest | older)
              selection+=(tag:notices_job)
              ;;
            *)
              echo "::notice title=Notices job's sources not measured::This build read no notices copy ($NOTICES_READ), so its run log holds none of their reads, and step 2b's own steps report that. Only this leg's own upstreams were measured."
              ;;
          esac
          set +e
          "$RUNNER_TEMP/dbt/bin/dbt" source freshness --profiles-dir . --select "${selection[@]}"
          status=$?
          set -e
          if [ -f target/sources.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json
          results = json.load(open("target/sources.json"))["results"]
          late = sorted(
              (str(result.get("status", "")).lower(), result["unique_id"].removeprefix("source.ourhike."), result.get("max_loaded_at_time_ago_in_s"))
              for result in results
              if str(result.get("status", "")).lower() != "pass"
          )
          print("### Notice source freshness\n")
          print(f"{len(results)} sources measured: {sum(state != 'warn' for state, _, _ in late)} red, {sum(state == 'warn' for state, _, _ in late)} warned.\n")
          for state, name, seconds in late:
              if seconds is None:
                  print(f"- `{name}`: {state}, not measured")
              else:
                  print(f"- `{name}`: {state}, last read or confirmed unchanged {seconds / 3600:.1f} h ago")
          print()
          PY
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error title=A notice source has gone unread too long::At least one notice source has gone 24 hours (48 for a daily one) without the extract reading it or confirming it unchanged, or its freshness could not be measured. Everything was published and the row history saved; the run summary names each one, and its extract run's summary says why it was refused."
          fi
          exit "$status"

      - name: Save dbt's DuckDB driver and v2's spatial extension
        if: always() && env.PHONE_FILES == 'dbt' && steps.dbt-runtime.outputs.cache-hit != 'true' && hashFiles('pipeline/requirements-dbt.txt') != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/com.getdbt/adbc
            ~/.duckdb/extensions/v1.5.4
          key: dbt-v2-runtime-${{ runner.os }}-${{ hashFiles('pipeline/requirements-dbt.txt') }}

  # THE CHECKS OF THIS RUN'S BUILD ARE check-conditions.yml (decision 110,
  # the maintainer's poll of 2026-10-08: "All of them, hourly. build a
  # different workflow that kicks off after the actual build"), started
  # here once every leg has built and published, with the legs this run ran
  # and this run as `build_run`, on this run's ref. Each of its legs takes
  # the warehouse its leg handed off above, runs every Elementary check of
  # the lane and puts conditions/data_quality.json in place; one whose leg
  # handed off nothing (the exporters path, or a build that failed) says so
  # and checks nothing.
  #
  # THROUGH THE API'S workflow_dispatch, as refresh-reference.yml's
  # `dispatch` job starts build-reference.yml: the one event a GITHUB_TOKEN
  # may start a run with ("workflow_dispatch and repository_dispatch events
  # always create workflow runs", GitHub's docs, "Triggering a workflow from
  # a workflow", as that job quotes them), with `actions: write` on this job
  # alone, and every word of the command reaching the script through env.
  # GitHub takes it only for a file the default branch holds, which PR #1827
  # - Add dispatch-only build-reference.yml, purge-person-fields.yml and
  # check-conditions.yml placeholders to main is for; until that merges,
  # this job goes red with the publish already done.
  #
  # NEVER IN THE PUBLISH'S WAY: it runs after both legs, whatever they
  # concluded (`!cancelled()`), so a red leg still has the checks of the
  # other, and its failure can only colour this run once everything was
  # published. The summary keeps the command that starts the checks again.
  checks:
    name: Start the checks of this run's build (check-conditions.yml)
    needs: publish
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # LEGS is the matrix's own rule, so the checks run the legs this run
      # ran: both only from main, and neither for a dispatch asking for UA
      # alone nor for one picking the dbt path.
      # .github/tests/test_check_conditions.py evaluates both expressions for
      # every trigger, ref and input.
      - name: Dispatch check-conditions.yml on this ref, with this run as its build_run
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
          BUILD_RUN: ${{ github.run_id }}
          LEGS: ${{ (github.ref == 'refs/heads/main' && inputs.data_environment != 'ua' && inputs.phone_files != 'dbt') && 'both' || 'ua' }}
        run: |
          printf -v again 'gh workflow run check-conditions.yml --repo %q --ref %q -f %q -f %q' "$GITHUB_REPOSITORY" "$REF" "data_environment=$LEGS" "build_run=$BUILD_RUN"
          {
            echo "## The checks of this run's build"
            echo
            echo "check-conditions.yml runs every Elementary check of the hourly lane over each leg's warehouse and puts conditions/data_quality.json in place. To run them again on this build, while it is still the newest its leg handed off:"
            echo
            echo '```'
            echo "$again"
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$again"
          gh workflow run check-conditions.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" -f "data_environment=$LEGS" -f "build_run=$BUILD_RUN"
          echo "This run dispatched check-conditions.yml on \`$REF\` for the $LEGS leg(s)." >> "$GITHUB_STEP_SUMMARY"
