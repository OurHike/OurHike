# Recovers NYNJTC's lost hike photographs and write-ups from the Internet
# Archive, and proposes which photograph belongs to which hike (#1450).
#
# ON DEMAND ONLY, by instruction. There is no schedule and no push trigger,
# and that is the point rather than an omission: the source is a frozen
# capture of a site that has already changed, so a second run can only
# re-fetch what the first one got. This is a ONE-TIME recovery that happens to
# live in a workflow.
#
# WHY IT RUNS HERE RATHER THAN ON A LAPTOP. Two things only CI has:
#
#   - A DIFFERENT EGRESS ADDRESS. An agent sandbox earned web.archive.org's
#     rate limiter on 2026-09-15 (429s, then 503s, then the IP refused
#     outright) and could not read the archive at all for hours afterwards.
#   - HIKEFINDER_PASSWORD. The 385-hike export went behind a site password on
#     2026-09-15 (#1468) and the secret is injected into workflow runs, so the
#     hike side of the join is reachable here and nowhere else.
#
# NOTHING HERE PUBLISHES, and that is load-bearing rather than an oversight.
# It invokes no publisher, so scripts/pipeline_scopes.py keeps finding exactly
# five publishing paths and this does not quietly become a sixth.
#
# That sentence is deliberately phrased without naming the publisher's
# filename, and the reason is worth a line because the first draft got it
# wrong: the roster is derived by matching that literal name ANYWHERE in a
# workflow's text, comments included - a trade pipeline_scopes.py documents
# ("a filename that appears only in a comment counting"). A comment saying
# this workflow does not publish was therefore enough to classify it as one,
# and scripts/pipelines.sh duly told a reader to dispatch it with an input it
# does not have.
#
# What it produces is a REVIEW SHEET and the caches behind it, uploaded
# as artifacts for a person to work through. CONTRIBUTING.md reserves
# pipeline/reference/ for "a join that encodes judgement somebody reviews row
# by row", and the confirmed join belongs there, written by hand afterwards.
# Loading anything into R2 is a separate, deliberate act.
#
# IT IS SLOW ON PURPOSE. lib/wayback_rate.py caps every archive request at ten
# a minute across the whole process, retries included. At that rate the photo
# recovery is roughly 40 minutes and the write-ups - two requests each, a CDX
# lookup and a fetch - can run to a couple of hours. A recovery that finishes
# beats one that gets the runner's address refused, and this is paid once.

name: NYNJTC archive recovery

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Which part to run"
        type: choice
        default: index
        options:
          - index          # what /view/hike lists; a handful of requests
          - pages          # every write-up: the photo -> hike join
          - photos         # the 403 photographs themselves
          - match          # score the join, write the review sheet
          - everything     # all four, in order
          - probe          # two requests: what one write-up carries (#1497)
      limit:
        description: "Cap the number fetched (a trial run). Empty = no cap."
        type: string
        default: ""
      min_score:
        description: "What the review sheet puts above the fold. Ranks; decides nothing."
        type: string
        default: "2.5"
      probe_url:
        description: "Which write-up the probe stage reads. Ignored by every other stage."
        type: string
        default: "https://www.nynjtc.org/hike/claudius-smiths-rock"

# Never cancel a run in progress. These legs spend tens of minutes inside a
# rate limit, and a superseding dispatch that killed one would throw away
# archive goodwill that cannot be bought back quickly - the same argument
# shard-seam-spike.yml makes for its long builds, with a scarcer resource.
concurrency:
  group: nynjtc-archive-recovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    # Generous because the rate limit, not the work, sets the duration: 403
    # photographs at ten a minute is ~40 minutes, and the write-ups are two
    # requests apiece.
    timeout-minutes: 330
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # WHAT MAKES THE STAGES STAGES (#1497). Each dispatch gets a fresh
      # runner and pipeline/data/ is gitignored scratch that dies with it, so
      # without this `pages`, `photos` and `match` are not four steps of one
      # recovery - they are four runs that happen to share a filename, and
      # `match` reads a directory that does not exist.
      #
      # The first draft had no cache and no download, and the only combination
      # that worked was `everything`: about 890 requests for the write-ups plus
      # 403 for the images, re-fetched on one runner at a deliberate ten a
      # minute, so roughly two and a half hours. Paying that to work around a
      # missing step is the wrong trade twice - once for the hours, and once
      # for an archive that is donation-funded and already refused this
      # project's other egress address today.
      #
      # A cache rather than download-artifact because cross-run artifact
      # download needs the earlier run's id, which a person dispatching a
      # stage does not have and should not have to find. `restore-keys` takes
      # the most recent cache whose key starts with the prefix, and the
      # run-id suffix makes every run save a new one rather than hitting an
      # immutable key and silently keeping the old.
      # Restore and save are SEPARATE steps, and the first draft of this used a
      # single combined `actions/cache` keyed on the run id. That is the
      # pattern .github/tests/test_cache_keys_are_content_addressed.py exists
      # to refuse, and it refused this one: a key carrying the run id is
      # distinct by construction, so the step never overwrites an entry, it
      # only ever adds one - and GitHub's per-repository cache is 10 GB with
      # least-recently-used eviction, so a workflow saving under unrepeatable
      # keys spends the whole repository's cache on itself. That test has the
      # arithmetic from publish-conditions.yml, which is what made it a test
      # rather than a fix.
      #
      # A RESTORE may use the run-id idiom, and does: it stores nothing, and
      # `key` + `restore-keys` is the documented way to say "never hit
      # exactly, take the most recent match by prefix".
      - name: What earlier stages already fetched
        uses: actions/cache/restore@v4
        with:
          path: |
            pipeline/data/raw/wayback_hike_pages.json
            pipeline/data/raw/wayback_hike_photos.json
            pipeline/data/raw/poi_photos
          key: nynjtc-archive-recovery-data-${{ github.run_id }}
          restore-keys: |
            nynjtc-archive-recovery-data-

      # Said out loud, because "the cache was empty" and "the archive gave us
      # nothing" produce the same counts and mean opposite things - the same
      # argument the step below makes about the password.
      - name: What the cache handed over
        run: |
          for f in data/raw/wayback_hike_pages.json data/raw/wayback_hike_photos.json; do
            if [ -f "$f" ]; then
              echo "restored: $f ($(wc -c < "$f") bytes)"
            else
              echo "absent:   $f - this stage starts from nothing"
            fi
          done
          if [ -d data/raw/poi_photos ]; then
            echo "restored: data/raw/poi_photos ($(find data/raw/poi_photos -type f | wc -l) images)"
          else
            echo "absent:   data/raw/poi_photos"
          fi

      # Said out loud before anything runs, because "0 photographs" and "the
      # archive would not talk to us" look identical in a log and mean
      # opposite things.
      - name: What this run may reach
        run: |
          echo "stage:     ${{ inputs.stage }}"
          echo "limit:     ${{ inputs.limit || '(none)' }}"
          if [ -n "${HIKEFINDER_PASSWORD}" ]; then
            echo "export:    password present - the hike side of the join is reachable"
          else
            echo "export:    NO HIKEFINDER_PASSWORD - the match cannot run, and will say so"
          fi
        env:
          HIKEFINDER_PASSWORD: ${{ secrets.HIKEFINDER_PASSWORD }}

      # Two requests, and the only stage that answers a question rather than
      # fetching a corpus. The first full `pages` run found a coordinate in
      # none of 439 write-ups, which is either a fact about the corpus or a
      # regex that misses the shape these pages use - and zero out of 439 is
      # exactly what the second one looks like. It runs here because an agent
      # sandbox cannot reach web.archive.org at all.
      - name: The probe - what one write-up actually carries
        if: inputs.stage == 'probe'
        run: |
          set -o pipefail
          python -u fetch_wayback_hike_pages.py --probe "${{ inputs.probe_url }}" | tee probe.log

      - name: The index - what /view/hike lists
        if: inputs.stage == 'index' || inputs.stage == 'everything'
        run: |
          set -o pipefail
          python -u fetch_wayback_hike_pages.py --index-only | tee index.log

      - name: The write-ups - name, location, description, photo
        if: inputs.stage == 'pages' || inputs.stage == 'everything'
        run: |
          set -o pipefail
          python -u fetch_wayback_hike_pages.py \
            ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }} \
            | tee pages.log

      - name: The photographs
        if: inputs.stage == 'photos' || inputs.stage == 'everything'
        run: |
          set -o pipefail
          python -u fetch_wayback_hike_photos.py \
            ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }} \
            | tee photos.log

      # The hike side of the join. continue-on-error for the reason
      # expected-settings.yml gives about this secret: a missing password
      # costs the 385 day hikes and nothing else, and the matcher below says
      # so plainly rather than reporting an empty join as a finding.
      - name: The hike export (needs the site password)
        if: inputs.stage == 'match' || inputs.stage == 'everything'
        continue-on-error: true
        env:
          HIKEFINDER_PASSWORD: ${{ secrets.HIKEFINDER_PASSWORD }}
        run: |
          set -o pipefail
          python -u fetch_hikefinder.py | tee hikefinder.log

      - name: Propose the join, and write the sheet
        if: inputs.stage == 'match' || inputs.stage == 'everything'
        run: |
          set -o pipefail
          python -u match_wayback_hike_photos.py --min "${{ inputs.min_score || '2.5' }}" | tee match.log

      # What a person actually reads, rather than a link to a log they have to
      # open. The counts are the whole output of the earlier stages.
      - name: Summarise
        if: always()
        run: |
          {
            echo "## NYNJTC archive recovery - ${{ inputs.stage }}"
            echo
            for stage in probe index pages photos match; do
              if [ -f "$stage.log" ]; then
                echo "### $stage"
                echo '```'
                tail -25 "$stage.log"
                echo '```'
              fi
            done
            echo "### Nothing here shipped"
            echo "A confirmed join lives in \`pipeline/reference/nynjtc_hike_photos.json\`,"
            echo "written by a person working the review sheet in the artifact below."
          } >> "$GITHUB_STEP_SUMMARY"

      # THE IMAGES SHIP WITH THE SHEET, and the first draft's reasoning for
      # leaving them out was wrong (#1497). It said "a run that uploaded
      # hundreds of them would be paying to move bytes the next run would
      # re-derive" - true of the next RUN, and irrelevant to the only reader
      # this artifact has. write_sheet() renders
      # <img src="../raw/poi_photos/{digest}.jpg">, so without them a person
      # downloads an HTML file of broken image icons.
      #
      # That is not a cosmetic loss. The whole design of this join is that a
      # score is a claim about strings and whether a photograph is OF a hike
      # is a claim about the world, which only somebody looking at it can
      # settle - features/POI_PHOTOS.md's Asiatic dayflower passed every
      # automatic bar there was. A review sheet nobody can see the pictures in
      # is not a review sheet.
      #
      # MEASURED, run 35026550773 on 2026-09-15: 403 images, 46.1 MB. The
      # first draft of this comment guessed "20-40 KB each, so 10-15 MB" and
      # was out by a factor of three - the real average is ~114 KB. Still an
      # ordinary artifact, and now a number somebody can check. The paths
      # keep their pipeline/data/ shape so the sheet's relative src resolves
      # when the zip is unpacked. CONTRIBUTING.md's "data does not go in
      # commits" is about the repository and is untouched by this: an artifact
      # expires in 14 days and enters no tree.
      # Keyed on what is being saved, so a stage that fetched nothing computes
      # the same key as the entry it restored and the save is a no-op rather
      # than a new entry. The two manifests are the hash input rather than the
      # whole photo store: both are rewritten by the run that changes the
      # store, so they move exactly when it does, and hashing 403 files to
      # learn the same thing would be slower for nothing.
      #
      # The `if` is the other half of what the test asks for. hashFiles()
      # returns an empty string when none of its paths exist, so an `index` or
      # `probe` run - which fetch no corpus at all - would otherwise save the
      # bare prefix as a key and poison every later restore with an empty
      # entry.
      - name: Hand this on to the next stage
        if: hashFiles('pipeline/data/raw/wayback_hike_pages.json', 'pipeline/data/raw/wayback_hike_photos.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            pipeline/data/raw/wayback_hike_pages.json
            pipeline/data/raw/wayback_hike_photos.json
            pipeline/data/raw/poi_photos
          key: nynjtc-archive-recovery-data-${{ hashFiles('pipeline/data/raw/wayback_hike_pages.json', 'pipeline/data/raw/wayback_hike_photos.json') }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nynjtc-archive-recovery-${{ inputs.stage }}
          path: |
            pipeline/*.log
            pipeline/data/raw/wayback_hike_pages.json
            pipeline/data/raw/wayback_hike_photos.json
            pipeline/data/raw/poi_photos
            pipeline/data/processed/wayback_photo_review.html
            pipeline/data/processed/wayback_photo_matches.json
          retention-days: 14
          if-no-files-found: warn
