version: 2

sources:
  - name: ourhike
    description: >
      OurHike's own reviewed files that no single steward owns, landed by the
      extract's _shared/ourhike/ folder (pipeline/extract/_shared/ourhike/),
      and the size of OurHike's own database, read beside the conditions rows.
    schema: raw
    config:
      # When the extract last read each table or confirmed it unchanged, from
      # its run log, never `_loaded_at`: make_dbt_staging.py's
      # LOADED_AT_QUERY and MONTHLY_FRESHNESS_DAYS say why, and
      # tests/test_source_freshness.py holds every monthly source to them.
      loaded_at_query: "{{ last_read_or_confirmed_at(this) }}"
      meta:
        cadence: monthly
      freshness:
        warn_after: {count: 35, period: day}
        error_after: {count: 62, period: day}
    tables:
      - name: raw_ourhike__poi_identity
        data_tests:
          # Rows sharing base_ourhike__poi_identity's key must be exact copies.
          - duplicates_are_exact:
              arguments:
                key_columns: ["'reference/poi_identity.json'", "poi_id"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks()), each with its two thresholds.
          - elementary.volume_anomalies:
              config:
                severity: error
                fail_calc: "{{ var('elementary_anomaly_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: error
                fail_calc: "{{ var('elementary_schema_change_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          reference/poi_identity.json, the POI identity ledger
          (features/POI_IDENTITY.md): one row per POI ever published, 8,563
          on 2026-10-01, 5,412 of them retired. Generated by
          reconcile_poi_identity.py and reviewed into git; never re-mint,
          never reuse, never delete. Key: poi_id, the ledger's own map key.
        columns:
          - name: poi_id
            description: The published OurHike id. The ledger's map key, so unique by construction.
            data_tests: [not_null, unique]
      - name: raw_ourhike__blaze_mapping
        data_tests:
          # Rows sharing base_ourhike__blaze_mapping's key must be exact copies.
          - duplicates_are_exact:
              arguments:
                key_columns: ["'reference/blaze_mapping.json'", "_path"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks()), each with its two thresholds.
          - elementary.volume_anomalies:
              config:
                severity: error
                fail_calc: "{{ var('elementary_anomaly_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: error
                fail_calc: "{{ var('elementary_schema_change_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          reference/blaze_mapping.json, the reviewed blaze mapping (#782, features/NEARBY_TRAILS.md section 4): per-source tables of what a raw value is as paint, each row somebody's decision. One row, the whole document, verbatim.
      - name: raw_ourhike__trail_name_aliases
        data_tests:
          # Rows sharing base_ourhike__trail_name_aliases's key must be exact copies.
          - duplicates_are_exact:
              arguments:
                key_columns: ["'reference/trail_name_aliases.json'", "_path"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks()), each with its two thresholds.
          - elementary.volume_anomalies:
              config:
                severity: error
                fail_calc: "{{ var('elementary_anomaly_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: error
                fail_calc: "{{ var('elementary_schema_change_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          reference/trail_name_aliases.json, the reviewed trail-name aliases: each through route's names by publisher, with the rejected and removed candidates. One row, the whole document, verbatim.
      - name: raw_ourhike__work_projects
        data_tests:
          # Rows sharing base_ourhike__work_projects's key must be exact copies.
          - duplicates_are_exact:
              arguments:
                key_columns: ["'reference/work_projects.json'", "_path"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks()), each with its two thresholds.
          - elementary.volume_anomalies:
              config:
                severity: error
                fail_calc: "{{ var('elementary_anomaly_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: error
                fail_calc: "{{ var('elementary_schema_change_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        config:
          # Read on the hourly conditions lane (its folder file's TYPE is
          # closures), because a cancelled workday must clear with the next
          # bake. Its `_loaded_at` moves only when the file's bytes do,
          # so freshness reads the run log instead
          # (macros/last_read_or_confirmed_at.sql), where every run that finds
          # it unchanged writes `skipped`. A read the leg refuses on its own is
          # a warning on the hourly run (the maintainer's poll of 2026-10-07), and red here after 24 hours unread: the
          # thresholds are generate_notice_models.py's FRESHNESS_HOURS, graded
          # there, and tests/test_notice_source_freshness.py holds these to
          # them. publish-conditions.yml's freshness step selects
          # `conditions_job`.
          loaded_at_query: "{{ last_read_or_confirmed_at(this) }}"
          tags: [conditions_job]
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
          meta:
            cadence: hourly
        description: >
          reference/work_projects.json whole, as one row
          (extract/_shared/ourhike/work_projects.py, ReviewedFile's
          `verbatim` with no `rows_key`): the reviewed club workdays (#760),
          `rows` empty since the maintainer's decision of 2026-08-20 on #760,
          reviewed that day. Whole rather than a row per workday, so the
          table has its columns while `rows` is empty and the review and the
          retired `ua_sample_rows` key are read from the file itself.
        columns:
          - name: row_json
            description: The file as written, `_README` aside, as JSON text.
            data_tests: [not_null]
          - name: _path
            description: The file's path in the repository.
      - name: raw_ourhike__database_size
        data_tests:
          # Rows sharing base_ourhike__database_size's key must be exact copies.
          - duplicates_are_exact:
              arguments:
                key_columns: ["'ourhike_database_size'", "_dlt_load_id"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks()), each with its two thresholds.
          - elementary.volume_anomalies:
              config:
                severity: error
                fail_calc: "{{ var('elementary_anomaly_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: error
                fail_calc: "{{ var('elementary_schema_change_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        config:
          # Read on the hourly conditions legs, which alone hold the
          # database's URL (extract/_shared/ourhike/database_size.py, hourly
          # by override). A failed read stops nothing but itself
          # (extract/_kinds.py's DatabaseSize), so, as for work_projects
          # above, the leg's refusal is a warning on the hourly run, and red
          # here after 24 hours unread, measured from the run log: the
          # thresholds are generate_notice_models.py's FRESHNESS_HOURS, and
          # tests/test_notice_source_freshness.py holds these to them.
          # publish-conditions.yml's freshness step selects `conditions_job`.
          loaded_at_query: "{{ last_read_or_confirmed_at(this) }}"
          tags: [conditions_job]
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
          meta:
            cadence: hourly
        description: >
          The size of OurHike's own database in bytes, one row, as its last
          read measured it: pipeline/lib/database_size.py's
          DATABASE_SIZE_SQL, the sum of pg_database_size over every database
          the conditions reader may connect to, which is how Supabase counts a
          project's database size. No hiker's data. The data-quality page
          shows it in megabytes (tests/singular/assert_the_database_stays_under_its_plan.sql).
        columns:
          - name: database_bytes
            description: The sum, in bytes.
            data_tests: [not_null]
