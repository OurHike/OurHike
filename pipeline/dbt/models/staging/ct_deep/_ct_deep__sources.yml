version: 2

sources:
  - name: ct_deep
    description: >
      CT DEEP's registered layers, landed by the extract's ct_deep/ folder
      (pipeline/extract/ct_deep/) as raw_ct_deep__<key>, and staged once each
      by a base model here. Descriptions transcribed from sources.json's
      titles.
    schema: raw
    config:
      # When the extract last read each table or confirmed it unchanged, from
      # its run log, never `_loaded_at` (decision 203): make_dbt_staging.py's
      # LOADED_AT_QUERY and MONTHLY_FRESHNESS_DAYS say why, and
      # tests/test_source_freshness.py holds every monthly source to them.
      loaded_at_query: "{{ last_read_or_confirmed_at(this) }}"
      freshness:
        warn_after: {count: 35, period: day}
        error_after: {count: 62, period: day}
    tables:
      - name: raw_ct_deep__ct_deep_blue_blazed
        data_tests:
          # Rows sharing base_ct_deep__blue_blazed's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'ct_deep_blue_blazed'", "trailname", "par_name", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks(), decision 102), each with its two thresholds (decision 204).
          - elementary.volume_anomalies:
              config:
                severity: error
                fail_calc: "{{ var('elementary_anomaly_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: error
                fail_calc: "{{ var('elementary_schema_change_level') }}"
                warn_if: ">0"
                error_if: ">1"
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          Connecticut Blue-Blazed Hiking Trails (sources.json
          `ct_deep_blue_blazed`). Key: TrailName, Par_Name and geometry, 351
          of 351 live rows; TrailName with Par_Name alone is 350 of 351.
