  - name: pub_conditions_notices_keeps_its_last_file_while_a_source_held_with_notices_has_none_to_carry
    model: pub_conditions_notices
    description: >
      Review finding DBT-10, with decision 81's holds: a source the gate holds
      although this build read 2 rows of it, and of which the marts hold no
      row to carry (a cold start, or no build of this history ever passed it),
      would read as a club with no notices. So the writer selects no row and
      the phone keeps its last file whole, with the row history on.
    overrides:
      macros:
        python_run_stamp: "'2026-10-04T12:00:00Z'"
        when_row_history_is_off: ""
