# Asks whether Settings -> Rules, Settings -> Environments and the labels hold
# what RELEASING.md §8's gate table depends on.
#
# The companion to settings-manifest.yml and settings-configured.yml, which
# ask the same shape of question about Settings -> Secrets and variables. Both exist because a checkout cannot
# answer anything about the repository's own configuration, and both are aimed
# at the same failure: something set once, by hand, and later removed by
# somebody who had a good reason and no way to know what depended on it.
#
# WHY IT IS NOT ENOUGH TO JUST SET THEM. #375's complaint is that §8's gate is
# "a document rather than a mechanism". Making the settings is a human action -
# no API this repository can reach will do it. Verifying them is not, and a
# gate checked only on the day it was configured is the same document with a
# delay.
#
# READ-ONLY, AND NOTHING HERE IS SECRET. Unlike settings-configured.yml there is no
# value to be careful about: branch protection, environments and labels are
# configuration, not credentials, so this workflow prints what it found and the
# tests can quote it in a failure message. That is why the live half runs the
# comparison in the open rather than reducing anything to names first.
#
# TWO SYSTEMS PROTECT A BRANCH AND BOTH ARE READ (#685). Classic branch
# protection and rulesets are separate GitHub features with separate endpoints,
# and neither reports the other's rules. This workflow read only the classic
# one until #685, while `main` was protected by a ruleset - so it spent its
# whole life reporting the required checks as unconfigured, and two tests
# guarding the solo-maintainer lockouts passed by reading nothing at all.
#
# The ruleset read is `GET /repos/{owner}/{repo}/rules/branches/{branch}`,
# which returns the rules that actually apply to the branch already merged
# across every ruleset. It needs no PAT - measured at HTTP 200 with
# GITHUB_TOKEN - so the required checks are now verified on every run rather
# than only when PROTECTIONS_READ_TOKEN happens to be set.
#
# THE TOKEN IS STILL THE FRAGILE PART for the environments, and there are three
# outcomes rather than two.
#
#   no PROTECTIONS_READ_TOKEN   the labels, the ruleset and the required checks
#                               are checked; classic protection and the
#                               environments are reported as unseen, and the
#                               run is green. A declared absence, like an
#                               unconfigured UA database - not a fault, and not
#                               worth turning `main` red for something #375
#                               already tracks.
#   token present, read refused the PAT's scopes are wrong. Fails, naming what
#                               was refused.
#   nothing read at all         fails, because a protections check that goes
#                               green having read nothing answers the question
#                               wrongly rather than not at all. That is the
#                               PROTECTIONS_CHECK_LIVE guard, borrowed from
#                               settings-configured.yml, plus an assertion that
#                               the labels and the branch rules - both readable
#                               with GITHUB_TOKEN alone - really were.
#
# NOT ON pull_request, for the same reason settings-configured.yml is not: a
# fork's run gets no elevated token, so this would fail for every
# outside contributor for a reason none of them could fix. The half of the
# suite that reads only the checkout - which is the half that catches real
# drift - runs on every pull request through settings-manifest.yml,
# because both suites live in .github/tests and pytest collects them together.

name: Protections check

on:
  push:
    branches: [main]
  schedule:
    # Mondays, 07:45 UTC. Ten minutes behind settings-configured.yml so the two
    # never contend, and off the hour for the reason every cron here records:
    # GitHub queues everything submitted at :00 behind everyone else's.
    - cron: "45 7 * * 1"
  workflow_dispatch:

# THE PERMISSION THAT DOES NOT EXIST, and the reason this workflow reads two
# of its three sections with a different token.
#
# The first version of this file asked for `administration: read` here. That is
# not one of the keys GitHub accepts in a workflow `permissions:` block, and an
# unrecognised key does not warn - it makes the file invalid, so every run is a
# startup failure with **zero jobs**, named by its path because GitHub never
# got as far as reading `name:`. Three of those landed before anyone noticed,
# because a run with no jobs reports no failing check to look at.
#
# The consequence is larger than the typo. GITHUB_TOKEN has no scope for
# repository administration at all, so it can never read branch protection or
# the environments list - no permissions block would have worked. Those two
# need a fine-grained PAT with Administration: read, which is
# PROTECTIONS_READ_TOKEN below and is optional: without it this job checks the
# labels, says plainly which sections it could not see, and stays green rather
# than turning `main` red for a state that is known and declared.
permissions:
  contents: read
  # The labels list, which GITHUB_TOKEN can read.
  issues: read

jobs:
  configured:
    name: Protections are configured
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/tests

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Read in Python rather than inside the github-script step below.
      # `actions/github-script` provides @actions/* and Octokit and nothing
      # else - `require('js-yaml')` is not available to it - and the branch
      # this is all scoped to belongs in one place, which is the manifest.
      - name: Which branch the manifest is about
        id: manifest
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import yaml

          manifest = yaml.safe_load(pathlib.Path("../expected-protections.yml").read_text(encoding="utf-8"))
          print(f"branch={manifest['branch']}")
          PY

      # Each read is separate and each failure is named, so a policy that
      # withholds one permission does not look like the repository being
      # misconfigured in some other way.
      - name: Read how GitHub is configured
        id: read
        uses: actions/github-script@v9
        env:
          BRANCH: ${{ steps.manifest.outputs.branch }}
          HAS_ADMIN_TOKEN: ${{ secrets.PROTECTIONS_READ_TOKEN != '' }}
        with:
          # The PAT where there is one, GITHUB_TOKEN otherwise. Octokit is
          # built once, so the labels read below uses whichever arrived - both
          # tokens can read those.
          github-token: ${{ secrets.PROTECTIONS_READ_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const branch = process.env.BRANCH;
            const hasAdminToken = process.env.HAS_ADMIN_TOKEN === 'true';
            const failures = [];
            // Which questions this run was actually able to ask. The tests
            // read it, so a section nobody could see is reported as unseen
            // rather than as configured-correctly or as broken.
            const read = ['labels'];

            // TWO SYSTEMS PROTECT A BRANCH, AND THIS USED TO READ ONLY ONE
            // (#685). Classic branch protection and rulesets are separate
            // features with separate endpoints, and `getBranchProtection`
            // returns nothing about a rule that came from a ruleset. `main` is
            // protected by a ruleset, so every run reported the four - later
            // five - required checks as not configured while they were
            // configured the whole time.
            //
            // Worse than the false alarm: with nothing read, `strict` and the
            // approval count fell back to defaults that happen to be the
            // values the manifest wants, so two tests guarding the
            // solo-maintainer lockouts passed by reading nothing at all.
            // Hence `null` rather than a default below - a value nobody read
            // must not be able to satisfy an assertion.
            //
            // A repository can carry both systems, and GitHub applies the more
            // restrictive of the two, so the merge below is union for the
            // checks, OR for strict, and max for the approval count.
            let requiredChecks = null;
            let upToDate = null;
            let approvals = null;
            const ruleSources = [];

            const mergeChecks = names => {
              requiredChecks = [...new Set([...(requiredChecks ?? []), ...names])];
            };

            // The rules that actually apply to this branch, already merged
            // across every ruleset, each carrying the ruleset it came from -
            // so nothing here has to re-implement GitHub's condition matching
            // against ref-name patterns.
            //
            // NEEDS NO PAT, which is why it is tried first and unconditionally.
            // Measured: HTTP 200 with GITHUB_TOKEN for repository-level
            // rulesets. That takes branch protection out of the set of things
            // this workflow can only see when PROTECTIONS_READ_TOKEN happens
            // to be present - the environments below are still PAT-only.
            //
            // Called by path rather than through `github.rest.repos
            // .getBranchRules` deliberately: a named helper that is absent
            // from whichever Octokit github-script@v7 happens to bundle would
            // throw TypeError, land in the catch below, and be reported as a
            // refused read - which is the same shape of silent-wrong-answer
            // this whole issue is about. The path is stable and verified.
            try {
              const {data} = await github.request('GET /repos/{owner}/{repo}/rules/branches/{branch}', {
                owner: context.repo.owner, repo: context.repo.repo, branch,
              });
              for (const rule of data || []) {
                const parameters = rule.parameters || {};
                if (rule.type === 'required_status_checks') {
                  mergeChecks((parameters.required_status_checks || []).map(c => c.context));
                  upToDate = Boolean(upToDate) || Boolean(parameters.strict_required_status_checks_policy);
                } else if (rule.type === 'pull_request') {
                  approvals = Math.max(approvals ?? 0, parameters.required_approving_review_count || 0);
                }
                if (rule.ruleset_id && !ruleSources.includes(rule.ruleset_id)) {
                  ruleSources.push(rule.ruleset_id);
                }
              }
              // An empty list is a real answer - no ruleset touches this
              // branch - so the section counts as read either way. What must
              // not count as read is an error, handled below.
              requiredChecks = requiredChecks ?? [];
              upToDate = Boolean(upToDate);
              approvals = approvals ?? 0;
              read.push('branch_rules');
            } catch (error) {
              failures.push(`branch rules: ${error.status} ${error.message}`);
            }

            if (!hasAdminToken) {
              core.warning(
                'No PROTECTIONS_READ_TOKEN, so classic branch protection and the environments were not ' +
                'checked. GITHUB_TOKEN has no scope for repository administration - a fine-grained PAT ' +
                'with Administration: read is the only way to read them. The ruleset read above needs no ' +
                'PAT, so the required checks are still checked. See #375.'
              );
            } else try {
              const {data} = await github.rest.repos.getBranchProtection({
                owner: context.repo.owner, repo: context.repo.repo, branch,
              });
              const checks = data.required_status_checks;
              // `checks` is absent when the branch is protected but requires
              // no status checks, which is a real answer (an empty set) and
              // not a missing one.
              mergeChecks(checks ? (checks.checks || []).map(c => c.context) : []);
              upToDate = Boolean(upToDate) || (checks ? Boolean(checks.strict) : false);
              approvals = Math.max(approvals ?? 0, data.required_pull_request_reviews
                ? (data.required_pull_request_reviews.required_approving_review_count || 0)
                : 0);
              read.push('classic_branch_protection');
            } catch (error) {
              if (error.status === 404) {
                // Not an error to read - it is the answer. There is no CLASSIC
                // protection on this branch, which says nothing about whether
                // a ruleset protects it. Before #685 this was read as "no
                // protection at all", which is how a fully protected branch
                // reported as bare.
                mergeChecks([]);
                read.push('classic_branch_protection');
                core.info(`${branch} has no classic branch protection; rulesets are read separately above.`);
              } else {
                failures.push(`classic branch protection: ${error.status} ${error.message}`);
              }
            }

            // `branch_protection` is the name the manifest's tests ask for, and
            // it means "somebody answered the question", not "one particular
            // endpoint answered". Either source is enough; neither is not.
            if (read.includes('branch_rules') || read.includes('classic_branch_protection')) {
              read.push('branch_protection');
            }

            const environments = {};
            if (hasAdminToken) try {
              const {data} = await github.rest.repos.getAllEnvironments({
                owner: context.repo.owner, repo: context.repo.repo,
              });
              for (const environment of data.environments || []) {
                const rule = (environment.protection_rules || [])
                  .find(rule => rule.type === 'required_reviewers');
                environments[environment.name] = {
                  // `prevent_self_review` only exists on the rule, so an
                  // environment with no reviewers reports false rather than
                  // undefined - which is the safe value and also the truth:
                  // nothing is being prevented.
                  reviewers: rule ? (rule.reviewers || []).length : 0,
                  prevent_self_review: rule ? Boolean(rule.prevent_self_review) : false,
                };
              }
              read.push('environments');
            } catch (error) {
              failures.push(`environments: ${error.status} ${error.message}`);
            }

            let labels = [];
            try {
              labels = (await github.paginate(github.rest.issues.listLabelsForRepo, {
                owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
              })).map(label => label.name);
            } catch (error) {
              failures.push(`labels: ${error.status} ${error.message}`);
            }

            // A refused read is different from a read nobody attempted. The
            // absent-token case warned above and carried on; this is a token
            // that exists and was turned away, which means the PAT's scopes
            // are wrong and somebody has to look.
            if (failures.length) {
              core.setFailed(
                'A read was refused, so those sections were not checked. PROTECTIONS_READ_TOKEN needs a ' +
                'fine-grained PAT with Administration: read on this repository:\n  ' + failures.join('\n  ')
              );
              return;
            }

            core.info(`sections read: ${JSON.stringify(read)}`);
            core.info(`rulesets touching ${branch}: ${JSON.stringify(ruleSources)}`);
            core.info(`required checks on ${branch}: ${JSON.stringify(requiredChecks)}`);
            core.info(`strict (up to date): ${upToDate}`);
            core.info(`environments: ${JSON.stringify(environments)}`);
            core.info(`required approving reviews: ${approvals}`);
            // The three branch-protection values stay null when nothing was
            // read. The tests treat null as "unanswered" and fail rather than
            // comparing it, which is the #685 lesson: a default that happens
            // to equal the expected value is not evidence.
            core.setOutput('live', JSON.stringify({
              read,
              ruleset_ids: ruleSources,
              required_status_checks: requiredChecks,
              require_branches_up_to_date: upToDate,
              required_approving_review_count: approvals,
              environments,
              labels,
            }));

      - name: Check them against the manifest
        env:
          LIVE_PROTECTIONS: ${{ steps.read.outputs.live }}
          # The guard that turns a silent skip into a failure. Without it, an
          # empty LIVE_PROTECTIONS would skip every live test and pass.
          PROTECTIONS_CHECK_LIVE: "1"
        run: python -m pytest test_repository_protections.py -v
