version: 2

sources:
  - name: nc_mst
    description: >
      NC State Parks's registered layers, landed by the extract's nc_mst/
      folder (pipeline/extract/nc_mst/) as raw_nc_mst__<key>, and staged once
      each by a base model here. Descriptions transcribed from sources.json's
      titles.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_nc_mst__nc_mst_trail
        data_tests:
          # Rows sharing base_nc_mst__trail's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'nc_mst_trail'", "trailname", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks(), decision 102), each at warn.
          - elementary.volume_anomalies:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          Mountains-to-Sea Trail (NC state-published layer) (sources.json
          `nc_mst_trail`). Key: TRAILNAME and geometry, 328 of 328 live rows;
          Section with TRAILNAME is 126 of 328.
