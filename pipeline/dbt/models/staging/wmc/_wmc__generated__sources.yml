# GENERATED by pipeline/make_dbt_staging.py from sources.json
# and the extract's club folders; edit them or it, never this file.
version: 2

sources:
  - name: wmc
    description: >
      The layers sources.json registers for the extract's wmc/ folder (pipeline/extract/wmc/)
      that pipeline/make_dbt_staging.py stages, landed as raw_wmc__<key> and staged once each
      by a generated base model here. Descriptions transcribed from sources.json's titles and
      key notes.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      meta:
        cadence: monthly
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_wmc__wmc_hike_ratings
        config:
          # Read off a PDF, which the fixture warehouse never holds (Table.read_from_pdf):
          # its fct_sources_without_freshness row in dbt_project_evaluator_exceptions.csv says why.
          freshness: null
        data_tests:
          # Rows sharing base_wmc__wmc_hike_ratings's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'wmc_hike_ratings'", "name", "elevation_gain_text"]
        description: >
          Wasatch Mountain Club Hiking Trail Database (WMCHikesCopyToWeb.pdf)
          (sources.json `wmc_hike_ratings`). Key: The hike's name and its total ascent
          (`name`, `elevation_gain_text`): unique on all 157 rows read 2026-10-04. The
          name alone is not: 'SNAKE CREEK PASS FROM BRIGHTON LAKES TH.' is two rows, 1,344
          and 1,312 feet of ascent, and the table carries no id.
