  - name: int_closures__club_notices_keeps_an_ended_notice_without_closing_and_holds_back_what_its_status_says_is_not_current
    description: >
      The phase C rules on a club notice, one row each, its words
      read against the one vocabulary decision 190 made of the per-source
      seeds: a stated end date already past no longer holds the notice back
      (the maintainer's frame A, 2026-10-10: it stays, greyed on the phone
      by conditions/notices.json's current_until), and USFS R06's 'Active'
      fire closure or CDPR's 'Full Closure' beside it is never read as
      closed now; the same row before its end, or with none, closes the
      trail; a status that says not current (CDPR's OPEN) holds it; a
      partial closure is a notice; a rescinded order is held; a seasonal
      closure whose own start has not come publishes and closes the trail
      now, as one whose start has come does (the maintainer's frame B for
      wave 6's page 01, P3, 2026-10-11: the phone closes it from the day
      before its start); a notice its club files under warnings closes a
      trail where its own words do (rule 8: TDEC's 'closed');
      place is the source's own geometry or nothing, its
      locality its own words; the title's entities are read as Python's
      html.unescape reads them; the edit stamp is printed in UTC; a row with
      no id of its own is named by its key. A hazard area whose own
      category says the hazard is not there (IATA's 'No hunting') is held
      with its category in the reason, one whose category is listed
      (compared without case or surrounding space) is not, and a hazard
      source listed for every row (BAER) keeps every row.
      Wave 6's statuses read as the maintainer answered on 2026-10-11:
      Missouri's Archived alone is held (P1), its blank status shows and its
      Closed closes, even before its start; a Missouri trailhead's Open is
      held and its Closed, a site's, is a notice; Michigan's '-1' rows,
      whose own category is 'Motorized', are nothing for a hiker on both
      layers (P4) and its Temporarily Closed values close, compared without
      case or surrounding space; Florida's closed park closes (P5; with no
      steward's areas given here it keeps its own point, which the
      placement test below moves) and its open park is held; the Great
      Allegheny Passage's Hidden is held whatever its category says, as is
      its Cleared, and its Fully Obstructed closes (P6); NETT's bridges, a
      layer with no status field, close by their own words ('collapsed',
      P11), its layer's name 'NET_KML_DAMAGED_BRIDGES' saying no closure;
      VTrans's isActive 0 is held and its 1, titled 'Closure' as the live
      row is, closes by its title, its layer's name 'Notice Line' saying
      no closure (the poll of 2026-10-15). NGPC's Cowboy Trail sections (P7+P8 ship them): a
      Condition of 'Not Passable' or 'Impassable' closes the trail however
      Road_Status reads, its 'Open' included, because those words outrank a
      status (the Niobrara Bridge section), compared without case or
      surrounding space; its other Open sections are held and its Alt Route
      is a notice. Florida's closed campground, whose rows name the park and
      no campground, is a notice by its layer's own name, 'Campground
      Status' (a closed site is not a closed trail, the poll of
      2026-10-15), as the per-source seed left it; its day-use layer's name,
      'Day Use Status', names the park's own status and closes. The R06 rows and VTrans's 1 are placed, as their live
      rows are. The vocabulary and hazard seeds are mocked as the seed files
      are (tests/test_dbt_closures_club_notices.py).
    model: int_closures__club_notices
    given:
      - input: ref('int_closures__club_notices_unioned')
        rows:
          - {notice_key: 'k01', source_key: 'usfs_r06_fire_closure_lines', club: 'usfs', notice_type: 'closures', reader: 'arcgis_layer', listing: 'full', category: null, starts_at: null, ends_at: '2001-06-01 07:00:00+00', rescinded_at: null, source_edited_at: null, source_url: null, locality: null, geom_geojson: '{"type":"Point","coordinates":[-121.5,44.5]}', _loaded_at: '2026-10-03 00:00:00+00', source_id: 'g01', title: 'Fixture Fire Area Closure', status: 'Active'}
          - {notice_key: 'k02', source_key: 'usfs_r06_fire_closure_lines', club: 'usfs', notice_type: 'closures', reader: 'arcgis_layer', listing: 'full', category: null, starts_at: null, ends_at: '2999-12-31 07:00:00+00', rescinded_at: null, source_edited_at: null, source_url: null, locality: null, geom_geojson: '{"type":"Point","coordinates":[-121.5,44.5]}', _loaded_at: '2026-10-03 00:00:00+00', source_id: 'g02', title: 'Fixture Fire Area Closure', status: 'Active'}
          - {notice_key: 'k03', source_key: 'usfs_r06_fire_closure_lines', club: 'usfs', notice_type: 'closures', reader: 'arcgis_layer', listing: 'full', category: null, starts_at: null, ends_at: null, rescinded_at: null, source_edited_at: null, source_url: null, locality: null, geom_geojson: '{"type":"Point","coordinates":[-121.5,44.5]}', _loaded_at: '2026-10-03 00:00:00+00', source_id: 'g03', title: 'Fixture Fire Area Closure', status: 'Active'}
