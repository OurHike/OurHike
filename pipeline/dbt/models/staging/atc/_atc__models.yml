version: 2

models:
  - name: stg_atc__shelters
    data_tests:
      # Says how many rows the dedupe dropped. Each is an exact copy
      # (duplicates_are_exact on the raw table), so this only reports.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('atc', 'raw_atc__shelters')
          config:
            severity: warn
    description: >
      ATC shelters, renamed to the unified POI column shape. poi_type
      'shelter' at confidence 'high' - the same call export_poi.py's
      ATC_EXPORTS makes, sync-tested via the seed.
    columns:
      - name: poi_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          shelters, globalid,
          the registry key first and then the columns measured unique for
          this layer.
        data_tests: [not_null, unique]
      - name: source_id
        data_tests: [not_null, unique]
      - name: poi_type
        data_tests: [not_null]
