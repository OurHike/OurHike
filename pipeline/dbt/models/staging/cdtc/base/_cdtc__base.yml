version: 2

models:
  - name: base_cdtc__centerline
    data_tests:
      # Says how many rows the dedupe dropped. Each is an exact copy
      # (duplicates_are_exact on the raw table), so this only reports.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('cdtc', 'raw_cdtc__cdtc_centerline')
          config:
            severity: warn
    description: >
      Continental Divide National Scenic Trail (CDTC), every row, keyed and
      deduped. Nothing reads it yet: the stage-3 unions of #1793 do.
    columns:
      - name: trail_segment_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          cdtc_centerline, state, the registry key first and then the columns
          measured unique for this layer.
        data_tests: [not_null, unique]
