  - name: pub_conditions_notices_current_until_is_the_rows_own_end_date_first
    model: pub_conditions_notices
    description: >
      Rule 4's first clause, the maintainer's "End date first" (poll of
      2026-10-10): a notice with its own end date is current through that
      day, whatever else it says. Its edit date cannot move it either way:
      one edited 8 days after its end, and one whose edit is 21 months older
      than its end, both read their end. A duration its title states, from
      its own start, does not either.
