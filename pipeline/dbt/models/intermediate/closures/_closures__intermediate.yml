          - {history_row_key: h4, dbt_scd_id: s4, closure_id: 'feed_a:item-4', club: a, source_key: feed_a, notice_kind: club_feed_notices, obstructs_trail: true, review_state: org_published, title: 'Fixture marked lifted', dbt_valid_to: null}
          - {history_row_key: h5, dbt_scd_id: s5, closure_id: 'feed_a:item-5', club: a, source_key: feed_a, notice_kind: club_feed_notices, obstructs_trail: true, review_state: org_published, title: 'Fixture closed version', dbt_valid_to: '2026-10-01 00:00:00'}
      - input: ref('stg_row_history__warnings')
        rows:
          - {history_row_key: h6, dbt_scd_id: s6, warning_id: 'feed_a:item-6', warning_kind: org_notice, club: a, source_key: feed_a, notice_kind: club_feed_notices, obstructs_trail: null, review_state: not_reviewed, title: 'Fixture water carry', dbt_valid_to: null}
          - {history_row_key: h7, dbt_scd_id: s7, warning_id: 'nws_alerts:x', warning_kind: nws_alert, club: nws, source_key: feed_a, notice_kind: nws_alert, obstructs_trail: false, review_state: relayed, title: null, dbt_valid_to: null}
      - input: ref('notice_readers')
        rows:
          - {source_key: feed_a, club: a, notice_type: closures, reader: feed_notices, listing: window, raw_table: raw_a__feed_a, staged_by: stg_a__feed_a}
          - {source_key: layer_b, club: b, notice_type: closures, reader: arcgis_layer, listing: full, raw_table: raw_b__layer_b, staged_by: stg_b__layer_b}
      - input: ref('int_closures__unioned')
        format: sql
        rows: |
          select 'feed_a:item-2' as notice_id
      - input: ref('int_warnings__unioned')
        format: sql
        rows: |
          select 'nws_alerts:y' as notice_id
      - input: ref('notice_marks')
        rows:
          - {source_key: feed_a, notice_id: 'feed_a:item-4', mark: lifted, marked_on: '2026-10-02', reviewed_in: 'fixture pull request', why: 'Fixture: the club says it reopened'}
    expect:
      rows:
        - {mart: closures, notice_id: 'feed_a:item-1', title: 'Fixture Trail closed', obstructs_trail: true}
        - {mart: warnings, notice_id: 'feed_a:item-6', title: 'Fixture water carry', obstructs_trail: null}

  - name: int_closures__held_carried_keeps_the_last_good_rows_of_a_source_the_gate_holds
    description: >
      Decision 53's phase D: a source the gate holds this build keeps the
      rows the previous build's history held as current, every column read
      back out of the saved row, from either mart: ATC's with its A.T. miles,
      NYNJTC's from the warnings history. Nothing is carried for a source the
      gate passed (its fresh rows stand), for a version the history already
      closed (it was lifted before the hold), for a source the registry
      holds back (a decision, not a failed read), for OurHike's own closures
      (not a notice source), for a feed's notice the window carries already,
      or out of warnings for anything but an organization notice. Miles are
      compared as text, because a 2.0.6 unit test rounds a double to one
      decimal place (the dbt skill's contract traps).
