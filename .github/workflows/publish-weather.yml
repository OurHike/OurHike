# Publishes the NBM forecast for every trail square to UA's bucket, one file
# per 1-degree cell (#1056, features/WEATHER.md build step 1). The card is NBM
# only: HRRR's first-two-days temperature was scored in build step 2 and
# dropped by the maintainer on 2026-09-30, so only HRRR's land mask is still
# read, once per data release, by the squares step.
#
# NWS'S ALERTS LEFT THIS WORKFLOW FOR publish-conditions.yml (decision 28a,
# pipeline/ELT.md, "One job owns `warnings`"), under #1793 — Rebuild the data
# platform as dlt → dbt: seven contracted marts, a monthly refresh, published
# docs, and lighter phone downloads. That job builds the warnings mart, so it
# is the one job that reads NWS; its UA leg now runs export_weather_alerts.py
# on the squares this job saves. This job used to have two halves that never
# held each other back, NBM and NWS; the reason this stayed a workflow of its
# own (below) was always NBM's ~240 MB, and NWS is 160 KB and 0.49 s
# (Measured, 2026-10-01, ELT.md), so that reason never covered the alerts.
#
# THE SQUARES ARE STILL BUILT HERE, AND publish-conditions.yml READS THEM.
# build_weather_squares.py and its `weather-squares-` cache stay in this job,
# because NBM's bake needs them first; the conditions job restores the newest
# entry and never saves one. A change to the four cached paths below has to
# change that job's restore too, or it stops finding the entry.
#
# WHY ITS OWN WORKFLOW, AND NOT A LEG OF publish-conditions.yml. That job's
# ten minutes are already spent, deliberately: its header sizes four step
# ceilings to 4 + 1 + 2 + 1 minutes against 32 s of set-up and 6-8 s of
# publish, because a slow upstream there once ate the whole budget and
# cancelled every closure publish for both environments (#1318). Weather
# downloads ~240 MB a run (measured 2026-09-25: 315 files in 20 s here, then
# 19 s to bake), and putting that inside the closures job is putting a new
# way to be slow in front of the safety data.
#
# WHY TWO JOBS. Every writer of latest.json shares `publish-data`, and a
# group coalesces rather than queues - one pending entrant, and a newer one
# cancels it (publish-conditions.yml's header, #645). So the less time
# weather holds the group, the less often a closures bake finds it held. The
# `build` job downloads and bakes outside the group; only `publish` joins
# it, for as long as publish.py takes to upload ~440 small files. The same
# split publish-vector-data.yml made in #1265, for the same reason.
#
# UA ONLY, BY DESIGN FOR NOW. Nothing a hiker runs reads these files yet -
# the card is build step 3, the warnings line step 4 - so production would be
# publishing to nobody.
# UA carries no environment gate (#1330), which is why no `environment:` is
# set: a UA publish needs no approval, the same as publish-conditions.yml's
# UA leg. Production is a promotion and belongs to the release train.
#
# THE CLOCK IS GITHUB'S, AND IT IS NOT HOURLY. `55 * * * *` declares hourly
# because NBM runs a new cycle every hour (WEATHER.md §4); measured on the
# conditions bake, this scheduler actually fires about every 3 h 53 m
# (#1346), and the maintainer accepted that for weather on 2026-09-24. Every
# file carries the cycle it came from, so the card states the age rather
# than implying a freshness the clock never delivered. `:55` is a minute no
# other workflow here uses (.github/workflows/README.md's table).
name: Publish weather

on:
  schedule:
    - cron: "55 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build the forecast files
    runs-on: ubuntu-latest
    # Measured on runners 2026-09-25/29: squares 46-52 s when the release
    # changed (skipped otherwise), fetch 14-30 s, bake 15 s. Fifteen minutes
    # is room for a slow NOAA day, not a target.
    timeout-minutes: 15
    outputs:
      uploaded: ${{ steps.upload.outcome }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The squares under trail, and URMA's terrain, change with a data
      # release rather than with the forecast. build_weather_squares.py
      # rebuilds only when UA's release id differs from the one cached, so a
      # warm run spends one latest.json request here and nothing else.
      - name: Restore the trail squares
        uses: actions/cache/restore@v6
        with:
          path: |
            pipeline/data/raw/weather/squares.json
            pipeline/data/raw/weather/urma_terrain.grb2
            pipeline/data/raw/weather/hrrr_height.grb2
            pipeline/data/raw/weather/hrrr_land.grb2
          key: weather-squares-${{ github.run_id }}
          restore-keys: weather-squares-

      - name: Find the squares under UA's trails, and their NWS zones
        id: squares
        timeout-minutes: 8
        env:
          OURHIKE_DATA_ENV: ua
          DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
        run: python build_weather_squares.py

      - name: Save the trail squares
        if: always() && hashFiles('pipeline/data/raw/weather/squares.json', 'pipeline/data/raw/weather/urma_terrain.grb2', 'pipeline/data/raw/weather/hrrr_height.grb2', 'pipeline/data/raw/weather/hrrr_land.grb2') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            pipeline/data/raw/weather/squares.json
            pipeline/data/raw/weather/urma_terrain.grb2
            pipeline/data/raw/weather/hrrr_height.grb2
            pipeline/data/raw/weather/hrrr_land.grb2
          key: weather-squares-${{ hashFiles('pipeline/data/raw/weather/squares.json', 'pipeline/data/raw/weather/urma_terrain.grb2', 'pipeline/data/raw/weather/hrrr_height.grb2', 'pipeline/data/raw/weather/hrrr_land.grb2') }}

      - name: Fetch the newest complete NBM cycle
        id: fetch
        if: ${{ !cancelled() && steps.squares.outcome == 'success' }}
        timeout-minutes: 5
        run: python fetch_weather.py

      - name: Bake one file per trail cell
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: python export_weather.py

      # Whatever came back. export_weather.py writes its manifest last, after
      # its files, and not at all when it fails, so a manifest here is a bake
      # that worked.
      - name: Upload data for the publish job
        id: upload
        if: ${{ !cancelled() && hashFiles('pipeline/data/processed/*_manifest.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: weather-build-output
          path: pipeline/data/processed/
          retention-days: 1

      # THE RELEASE'S TRAIL LINES, FOR publish-conditions.yml'S CUT OF AREA
      # CLOSURES (pipeline/ELT.md's decisions 187 and 192, for
      # conditions/trail_closures.json; pipeline/prepare_closure_trail_lines.py
      # has the measurements): its nearby trail lines and the A.T.'s own. Like
      # the squares above, the lines change with a data release and not with
      # the hour, and this job already downloads the release's
      # nearby_trails.geojson and trails.geojson when the release moves, so it
      # prepares them once per release and caches them under the release's id;
      # the conditions job restores the newest entry and never saves one, as it
      # does the squares. The three path lists here and that job's restore
      # have to stay the same, or it stops finding the entry
      # (.github/tests/test_closure_trail_lines_cache.py holds them equal).
      #
      # THE KEY NAMES THE SCRIPT'S SCHEMA (`-v2-`), and so does that job's
      # restore-keys prefix, which matches the newest entry by prefix: an
      # entry written under an older schema (v1's held no A.T. line) can never
      # be restored for the cut. Bump both with SCHEMA, which the same test
      # holds them to.
      #
      # AFTER THE UPLOAD, so a slow or failed preparation never delays or
      # stops a forecast, and `continue-on-error` on the steps that can fail:
      # a run that cannot prepare the lines leaves the last release's entry
      # standing, which the conditions job goes on cutting against.
      # Most hours this is one latest.json request and one cache lookup that
      # downloads nothing (`lookup-only`), because the key names the release.
      # The hour the release moves it reads 141 MB of nearby trail lines and
      # 1.6 MB of the A.T.'s, reusing the squares step's copies when that step
      # just downloaded them, and
      # took 101.4 to 130.6 s in a shared 4-core sandbox (Measured
      # 2026-10-11), against the 46-52 s the squares step takes then; the
      # five-minute cap only bounds a hang. The key also hashes the script,
      # so a change to how the lines are written prepares the release again.
      - name: Name UA's current release, for the closure trail lines
        id: lines-release
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          OURHIKE_DATA_ENV: ua
          DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
        run: python prepare_closure_trail_lines.py --release-output "$GITHUB_OUTPUT"

      - name: Look for the release's closure trail lines
        id: lines-cache
        if: ${{ !cancelled() && steps.lines-release.outputs.release != '' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            pipeline/data/raw/closure_trail_lines/lines.parquet
            pipeline/data/raw/closure_trail_lines/release.json
          key: closure-trail-lines-v2-ua-${{ steps.lines-release.outputs.release }}-${{ hashFiles('pipeline/prepare_closure_trail_lines.py') }}
          lookup-only: true

      - name: Prepare the release's trail lines for the closures' cut
        id: lines
        if: ${{ !cancelled() && steps.lines-release.outputs.release != '' && steps.lines-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          OURHIKE_DATA_ENV: ua
          DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
        run: python prepare_closure_trail_lines.py --reuse-dir data/raw/weather/release

      - name: Save the release's closure trail lines
        if: always() && steps.lines.outcome == 'success' && steps.lines-release.outputs.release != '' && hashFiles('pipeline/prepare_closure_trail_lines.py') != '' && hashFiles('pipeline/data/raw/closure_trail_lines/release.json') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            pipeline/data/raw/closure_trail_lines/lines.parquet
            pipeline/data/raw/closure_trail_lines/release.json
          key: closure-trail-lines-v2-ua-${{ steps.lines-release.outputs.release }}-${{ hashFiles('pipeline/prepare_closure_trail_lines.py') }}

  publish:
    name: Publish (ua)
    needs: build
    # Runs when the build uploaded the forecast; skipped when it produced
    # nothing.
    if: ${{ !cancelled() && needs.build.outputs.uploaded == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-data
      cancel-in-progress: false
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Extracted to exactly where it was uploaded from - the upload names
      # one directory, so that directory is the archive's root (#1347,
      # .github/tests/test_artifact_handoff_paths.py).
      - uses: actions/download-artifact@v8
        with:
          name: weather-build-output
          path: pipeline/data/processed/

      - name: Publish to R2
        env:
          R2_WRITE_ENABLED: "true"
          OURHIKE_DATA_ENV: ua
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python publish.py

  # PRODUCTION'S TRAIL LINES, FOR publish-conditions.yml'S PRODUCTION LEG
  # (Q11, the maintainer's poll of 2026-10-15, "Now, in this
  # PR"). The build job above prepares UA's release alone, so the
  # conditions job's production leg found no entry and cut no area: once
  # production publishes conditions/trail_closures.json from dbt, every one
  # of its hours would leave every area closure out (#1811 — Fast follows
  # after PR #1805's dlt → dbt re-platform, section 5 of its comment of
  # 2026-10-14). This prepares production's current release the same way,
  # under `closure-trail-lines-v2-production-<release>-`, the prefix that
  # leg restores (.github/tests/test_closure_trail_lines_cache.py holds the
  # two to each other).
  #
  # A JOB OF ITS OWN, SO IT CAN NEVER DELAY OR STOP A FORECAST: the publish
  # job needs only `build`, and nothing here publishes. It reads
  # production's public latest.json and release files and writes an Actions
  # cache entry, nothing else, so it carries no secret and no environment
  # gate, as the build job's UA steps carry none. Production's latest.json
  # named no release on 2026-10-15 (read that evening), and then this
  # prepares nothing and says so; the first hour after a release reaches
  # production it downloads that release's two line files (141 MB and 1.6
  # MB on the wire for UA's 2026-10-10-2) and prepares them, in the 101.4 to
  # 130.6 s prepare_closure_trail_lines.py took for UA's (Measured
  # 2026-10-11), within the same five-minute cap. Every other hour it is one
  # latest.json request and one cache lookup.
  production-lines:
    name: Prepare production's trail lines for the closures' cut
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Name production's current release, for the closure trail lines
        id: lines-release
        continue-on-error: true
        timeout-minutes: 1
        env:
          OURHIKE_DATA_ENV: production
          DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
        run: python prepare_closure_trail_lines.py --release-output "$GITHUB_OUTPUT"

      - name: Look for the release's closure trail lines
        id: lines-cache
        if: ${{ !cancelled() && steps.lines-release.outputs.release != '' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            pipeline/data/raw/closure_trail_lines/lines.parquet
            pipeline/data/raw/closure_trail_lines/release.json
          key: closure-trail-lines-v2-production-${{ steps.lines-release.outputs.release }}-${{ hashFiles('pipeline/prepare_closure_trail_lines.py') }}
          lookup-only: true

      - name: Prepare the release's trail lines for the closures' cut
        id: lines
        if: ${{ !cancelled() && steps.lines-release.outputs.release != '' && steps.lines-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          OURHIKE_DATA_ENV: production
          DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
        run: python prepare_closure_trail_lines.py

      - name: Save the release's closure trail lines
        if: always() && steps.lines.outcome == 'success' && steps.lines-release.outputs.release != '' && hashFiles('pipeline/prepare_closure_trail_lines.py') != '' && hashFiles('pipeline/data/raw/closure_trail_lines/release.json') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            pipeline/data/raw/closure_trail_lines/lines.parquet
            pipeline/data/raw/closure_trail_lines/release.json
          key: closure-trail-lines-v2-production-${{ steps.lines-release.outputs.release }}-${{ hashFiles('pipeline/prepare_closure_trail_lines.py') }}
