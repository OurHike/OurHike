          - {restriction: 'permission', pattern: '\bwithout (the )?(prior )?(written )?permission\b', written_for: '', why: 'Copying conditional on asking first, which decision 55 answers for a notice''s facts and link'}
          - {restriction: 'permission', pattern: '\b(prior|express|explicit) written (permission|consent)\b', written_for: 'tpwd_davis_mountains_alerts', why: 'TPWD''s "without the prior written consent", Duluth''s "express written permission", DEC''s "explicit written permission": copying conditional on asking first (decision 55)'}
