      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('nycparks', 'raw_nycparks__nyc_park_polygons')
          config:
            severity: warn
    description: >
      NYC Parks Properties (park boundaries), every row, keyed and deduped.
      Nothing reads it yet: the stage-3 unions of #1793 do.
    columns:
