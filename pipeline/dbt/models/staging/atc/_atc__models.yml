            compare_model: source('atc', 'raw_atc__at_treadway')
          config:
            severity: warn
    description: >
      Built treadway segments with construction inventory.
    columns:
      - name: trail_segment_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          at_treadway, globalid,
          the registry key first and then the columns measured unique for
          this layer.
        data_tests: [not_null, unique]
      - name: source_id
        data_tests: [not_null, unique]
