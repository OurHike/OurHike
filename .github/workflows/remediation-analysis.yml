# Site Remediation's analysis: fetch ATC's Campsite Sustainability Index, score
# every site, and keep the result as two downloadable files (#1901,
# apps/remediation/PLAN.md §2g). Weekly re-scoring was the maintainer's choice by
# poll on 2026-10-27; the run is daily so that the open files of volunteer work
# (below) are a day old at most, and it fetches ATC's layers once a week: the
# fetched layers are cached under the ISO week, and a run that finds this
# week's re-scores them without asking ATC's hosts again.
#
# PUBLIC AND SIMPLE, by the maintainer's choice the same day: the scored files
# are plain public static files, locations included, because ATC already
# publishes the same locations in its own open layer. There is no bucket.
#
# Three jobs. `score` attaches the files to the run as the artifact
# `site-remediation-data`, writes the volunteer work beside them as open files
# (remediation_analysis/open_data.py, with the public anon key only), and builds
# the web app (apps/remediation/web/, #1904) with all of it in its data/ folder,
# holding no secret. `deploy`, on main, uploads that build to Cloudflare Pages,
# so the app and the analysis it shows are always one deployment and can never
# disagree; it needs the REMEDIATION_PAGES_PROJECT variable naming a Pages project
# that already exists (wrangler does not create one from CI), and until the
# maintainer creates it, skips the upload with a notice and is still green.
# `load-sites`, on main, loads the scored sites into the remediation schema, which
# every claim and every club's weights are checked against
# (apps/remediation/db/README.md); it needs REMEDIATION_SITES_DATABASE_URL and skips
# with a notice until that is set.

name: Site Remediation analysis

on:
  schedule:
    # Daily at 06:47 UTC, off the hour so it does not queue behind the
    # workflows that fire on it.
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remediation-analysis
  cancel-in-progress: false

jobs:
  score:
    name: Score the CSI sites
    runs-on: ubuntu-latest
    # Measured 2026-10-26: 51 s for the fetch and the scoring on a sandbox; the
    # app's install and build add about a minute more (not yet measured on a
    # runner). Fifteen minutes is room for a slow ArcGIS host's three retries
    # without letting a hung connection hold the job for GitHub's six-hour
    # default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/remediation/pipeline
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/remediation/pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The fetched layers, kept for the ISO week they were fetched in. They
      # hold the 2,411 user-created site locations, so they live in this
      # repository's Actions cache, which only its own workflows read, and
      # never in an artifact (fetch.py's docstring).
      - name: Name this week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: This week's fetched layers
        id: layers
        uses: actions/cache/restore@v6
        with:
          path: apps/remediation/pipeline/data/raw
          key: remediation-layers-${{ steps.week.outputs.week }}

      - name: Fetch and score
        if: steps.layers.outputs.cache-hit != 'true'
        run: python -m remediation_analysis.build --fetch

      # Saved once a week, under the week: a run on the same week finds it and
      # stores nothing. Only when all four layers are there, which fetch.py
      # writes each only once that layer is read in full, so a fetch that
      # failed part way never becomes the week's layers. always(), so a run
      # that fetched everything and then failed to score keeps the fetch
      # (.github/tests/test_cache_keys_are_content_addressed.py, #1522).
      - name: Keep this week's layers
        if: >-
          always() && steps.layers.outputs.cache-hit != 'true'
          && hashFiles('apps/remediation/pipeline/data/raw/csi.json') != ''
          && hashFiles('apps/remediation/pipeline/data/raw/parking.geojson') != ''
          && hashFiles('apps/remediation/pipeline/data/raw/padus.geojson') != ''
          && hashFiles('apps/remediation/pipeline/data/raw/centerline.geojson') != ''
        uses: actions/cache/save@v6
        with:
          path: apps/remediation/pipeline/data/raw
          key: remediation-layers-${{ steps.week.outputs.week }}

      - name: Score this week's layers again
        if: steps.layers.outputs.cache-hit == 'true'
        run: python -m remediation_analysis.build

      # The volunteer work as anyone can read it, as CSV and Parquet beside
      # the scored files. The anon key is public by design; with the
      # variables unset, or a project not yet serving the remediation schema,
      # this writes nothing and says so.
      - name: Export the open volunteer work
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: python -m remediation_analysis.open_data --out data/out/work

      # The two output files only; the raw layers stay on the runner, so the
      # archive's shape is just these two names at its root.
      - uses: actions/upload-artifact@v7
        with:
          name: site-remediation-data
          path: |
            apps/remediation/pipeline/data/out/summary.json
            apps/remediation/pipeline/data/out/sites.json
          if-no-files-found: error
          # Five weekly runs' worth: the newest is the one anybody wants.
          retention-days: 35

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/remediation/web/package-lock.json

      # Built on every run, so a dispatch on a branch shows the build works even
      # though only main deploys it. Supabase is OurHike's production project,
      # the one account across both apps that PLAN.md §3 plans, and it holds
      # the remediation schema (apps/remediation/db); its URL and anon key are public
      # by design (every browser client carries them). Unset, the app builds
      # with no accounts and says so.
      - name: Build the app with this run's analysis
        working-directory: apps/remediation/web
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          mkdir -p public/data
          cp ../pipeline/data/out/summary.json ../pipeline/data/out/sites.json public/data/
          if [ -d ../pipeline/data/out/work ]; then cp -r ../pipeline/data/out/work public/data/; fi
          npm run build
          ls -la dist dist/data

      - uses: actions/upload-artifact@v7
        with:
          name: site-remediation-site
          path: apps/remediation/web/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # THE CLOUDFLARE TOKEN'S JOB AND NOTHING ELSE'S, as pages.yml's docs-host job
  # says of its own: this installs and builds nothing. It downloads the site the
  # score job built and uploads it through the SHA-pinned wrangler-action. The
  # token is "Cloudflare Pages: Edit", which Cloudflare grants account-wide, so
  # it reaches OurHike's own Pages projects too; until 2026-10-27 it sat in the
  # job that ran pip install, the ArcGIS fetch, npm ci and vite build (the
  # adversarial review's finding 5).
  #
  # From main only, so a dispatch on a pull request's branch never replaces the
  # live app with unreviewed code. That condition lives in this file, which a
  # branch can edit; what would make it hold against an edited copy is a
  # GitHub environment that only main may deploy to, holding the token, which
  # is the maintainer's to create (PLAN.md §11).
  deploy:
    name: Deploy the app and its scores
    needs: score
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Decide whether to publish
        id: can
        env:
          PROJECT: ${{ vars.REMEDIATION_PAGES_PROJECT }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$PROJECT" ] || [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "::notice::Not publishing: set the REMEDIATION_PAGES_PROJECT variable to a Cloudflare Pages project that exists (the Cloudflare secrets are OurHike's preview pair). The scored files are in this run's artifact."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the site the score job built
        if: steps.can.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: site-remediation-site
          # Where the score job built it, as .github/tests/test_artifact_handoff_paths.py asks.
          path: apps/remediation/web/dist

      - name: Publish to Cloudflare Pages
        if: steps.can.outputs.publish == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.0.0 - SHA-pinned: this step holds the Cloudflare token (#660)
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy apps/remediation/web/dist
            --project-name=${{ vars.REMEDIATION_PAGES_PROJECT }}
            --branch=main
            --commit-dirty=true

  # The scored sites into the remediation schema: what every claim is checked
  # against (only a site whose action is restore or harden may be claimed) and
  # every club's weights. The login is a role that may call
  # remediation.load_sites() and nothing else (apps/remediation/db/README.md), and the
  # function refuses a load with fewer than half the sites it holds, so a
  # broken run cannot empty the list.
  load-sites:
    name: Load the sites into the remediation schema
    needs: score
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/remediation/db
    steps:
      - name: Decide whether to load
        id: can
        env:
          DATABASE_URL: ${{ secrets.REMEDIATION_SITES_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Not loading: set the REMEDIATION_SITES_DATABASE_URL secret to the remediation loader's login (apps/remediation/db/README.md). Until then no site can be claimed."
            echo "load=false" >> "$GITHUB_OUTPUT"
          else
            echo "load=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@v7
        if: steps.can.outputs.load == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        if: steps.can.outputs.load == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/remediation/db/requirements.txt

      # psycopg alone, hash-pinned: this job holds the loader's login, so it
      # installs nothing the load does not run.
      - name: Install dependencies
        if: steps.can.outputs.load == 'true'
        run: pip install --require-hashes -r requirements.txt

      - uses: actions/download-artifact@v8
        if: steps.can.outputs.load == 'true'
        with:
          name: site-remediation-data
          # Where the score job built it, as .github/tests/test_artifact_handoff_paths.py asks.
          path: apps/remediation/pipeline/data/out

      - name: Load
        if: steps.can.outputs.load == 'true'
        env:
          REMEDIATION_SITES_DATABASE_URL: ${{ secrets.REMEDIATION_SITES_DATABASE_URL }}
        run: python -m remediation_db.load_sites ../pipeline/data/out/sites.json
