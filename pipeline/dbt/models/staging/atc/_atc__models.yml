  - name: stg_atc__bridges
    data_tests:
      # Says how many rows the dedupe dropped. Each is an exact copy
      # (duplicates_are_exact on the raw table), so this only reports.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('atc', 'raw_atc__bridges')
          config:
            severity: warn
    description: >
      Bridges staged but NOT unioned into points_of_interest - the poi_type_mapping
      seed records the layer as deliberately-unmapped and #99 records the
      product call as open. No poi_type column at all, so a future union
      branch has to be a decision, not an accident.
    columns:
      - name: poi_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          bridges, globalid,
          the registry key first and then the columns measured unique for
          this layer.
        data_tests: [not_null, unique]
      - name: source_id
        data_tests: [not_null, unique]
  - name: stg_atc__centerline_segments
    data_tests:
      # Says how many rows the dedupe dropped. Each is an exact copy
      # (duplicates_are_exact on the raw table), so this only reports.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('atc', 'raw_atc__centerline')
          config:
            severity: warn
    description: >
      Per-segment centerline attributes (surface, status, club acronyms) and,
      since stage 3 of #1793, the segment's geometry, which the trail_lines
      family's mile axis and published lines read.
    columns:
      - name: trail_segment_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          centerline and the globalid, or the objectid where a row has no
          globalid, so rows without one never share a key.
        data_tests: [not_null, unique]
      - name: source_id
        description: The segment's GlobalID.
        data_tests:
          # WARN: the key falls back to OBJECTID, so a missing GlobalID is
          # reported rather than fatal.
          - not_null:
              config:
                severity: warn
          - unique
      - name: geom
        description: >
          The segment's line as ATC published it, full resolution, lon/lat
          (GeoJSON's order). Null where the feature carries no geometry.
      - name: source_row
        description: >
          The row's place in the raw table, which is the order the layer's
          pages served the features (the model's comment says why, and what
          is unmeasured). The axis merge and the chain merge read the
          segments in this order, as the Python reads the GeoJSON file.
  - name: stg_atc__side_trails
    data_tests:
      # Says how many rows the dedupe dropped. Each is an exact copy
      # (duplicates_are_exact on the raw table), so this only reports.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('atc', 'raw_atc__side_trails')
          config:
            severity: warn
    description: >
      Side-trail attributes including the raw Blaze vocabulary. No
      accepted_values on blaze on purpose - TRAIL_BLAZE_COLORS.md documents
      the dirt (empty values, "Unknown", "Gold"), and staging's job is to
      surface that domain, not legislate it.
    columns:
      - name: trail_segment_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          side_trails and the globalid, or the objectid where a row has no
          globalid, so rows without one never share a key.
        data_tests: [not_null, unique]
      - name: source_id
        description: The side trail's GlobalID.
        data_tests:
          # WARN: the key falls back to OBJECTID, so a missing GlobalID is
          # reported rather than fatal.
          - not_null:
              config:
                severity: warn
          - unique
      - name: objectid
        description: >
          The layer's OBJECTID, which ArcGIS also serves as the feature's own
          GeoJSON `id` (3,025 of 3,025 centerline and 1,197 of 1,197 side
          trail features, measured live 2026-10-02): lib/feature_id.py's
          second choice of id, after the GlobalID.
      - name: geom
        description: >
          The side trail's line as ATC published it, full resolution, lon/lat
          (GeoJSON's order). Null where the feature carries no geometry (one
          live feature, 2026-10-02).
      - name: source_row
        description: >
          The row's place in the raw table, the order the layer's pages served
          the features: the order trails.geojson lists the side trails in, and
          the index lib/feature_id.py's `generated-<index>` id uses.
  - name: stg_atc__club_sections
    data_tests:
      # Says how many rows the dedupe dropped. Each is an exact copy
      # (duplicates_are_exact on the raw table), so this only reports.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('atc', 'raw_atc__trail_club_sections')
          config:
            severity: warn
    description: >
      Club maintenance sections, with upstream's ACROYNM spelling corrected
      to club_acronym at the rename.
    columns:
      - name: club_section_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          trail_club_sections, globalid,
          the registry key first and then the columns measured unique for
          this layer.
        data_tests: [not_null, unique]
      - name: source_id
        data_tests: [not_null, unique]
  - name: stg_atc__half_mile_markers
    data_tests:
      # Says how many rows the dedupe dropped. Each is an exact copy
      # (duplicates_are_exact on the raw table), so this only reports.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('atc', 'raw_atc__half_mile_points_from_springer')
          config:
            severity: warn
    description: >
      ATC's half-mile scale - the calibration authority behind the mile
      axis (#652). source_id is Point_ID; the layer has no GlobalID.
    columns:
      - name: mile_marker_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          half_mile_points_from_springer, point_id,
          the registry key first and then the columns measured unique for
          this layer.
        data_tests: [not_null, unique]
      - name: source_id
        data_tests: [not_null, unique]
      - name: measure_mi
        data_tests: [not_null]
      - name: source_row
        description: >
          The row's place in the raw table, the order the layer's pages
          served the markers. int_trail_lines__mile_axis breaks a tie
          between two equally near markers on it.
  - name: stg_atc__treadway
