version: 2

models:
  - name: int_closures__atc_checked
    description: >
      Every row of reference/atc_updates.json, read field by field and checked
      against lib/atc_updates.py's file_problems() in row_problems()'s order
      (CL01-CL06), with every problem the row has in `problems`. An empty
      list means the row publishes; int_closures__gate holds ATC's whole file
      back on any problem (CL05), and reads the review from the file landed
      whole (base_atc__atc_updates).
    columns:
      - name: atc_update_row_key
        description: base_atc__atc_trail_updates's key, the file and the row's place in it.
        data_tests: [not_null, unique]
      - name: file_row
        description: The row's place in the file, from 0. The published order.
      - name: row_label
        description: The row as lib/atc_updates.py names it in a message, its atc_id or "update N".
      - name: atc_id
        description: ATC's slug for the update, where it is a string, as written.
      - name: title
        description: The update's headline as written, never stripped; null where it is not a string.
      - name: states
        description: The row's `states` as written, where it is a list, as JSON.
      - name: start_mile_text
        description: >
          The NOBO mile the update starts at, as the reviewer wrote the number
          (CL01). Text, because dbt 2.0.6's unit tests compare a DOUBLE only to
          one decimal; int_closures__unioned casts it. A string such as "476.6"
          is null here and a problem, as it is "not a mile" to
          lib/atc_updates.py.
      - name: end_mile_text
        description: The NOBO mile it ends at, on the same terms.
      - name: obstructs_trail
        description: Whether a hiker is stopped from walking through, where the reviewer wrote a real boolean.
      - name: updated_at
        description: ATC's own last edit of the notice, as the reviewer wrote it.
      - name: problems
        description: Every problem with the row, each prefixed by its label, in row_problems()'s order, then CL04's repeat.
      - name: problem
        description: The same problems joined by " | ", or null where the row is fine.
      - name: published_row
        description: >
          The row as lib/atc_updates.py's published_rows() publishes it, each
          field's JSON as written plus source_key and review_state, for
          pub_conditions_atc_updates.

  - name: int_closures__atc_automatic
    description: >
      Every update ATC's trail-updates sitemap lists, as its page parsed
      (base_atc__atc_trail_updates_pages), judged by lib/atc_updates.py's
      auto_publish_refusal() in its order (CL07, CL08, CL10): `refusal` in the
      Python's words, null where the update publishes without a person. For
      those, the row auto_row() writes, with obstructs_trail forced false
      (CL09). int_closures__unioned takes the rows that publish; the rest stay
      here for the job log, and `actionable` marks the ones
      propose_atc_updates.py proposes to a person (CL12).
    data_tests:
      # CL09, the rail on this whole path: an update nobody here has read never
      # draws a barrier across the trail.
      - dbt_utils.expression_is_true:
          name: an_automatic_atc_row_never_obstructs_the_trail
          arguments:
            expression: "not obstructs_trail"
      # A row that publishes carries the whole of auto_row()'s row.
      - dbt_utils.expression_is_true:
          name: an_automatic_atc_row_publishes_with_its_span_and_stamp
          arguments:
            expression: >
              start_mile_text is not null and end_mile_text is not null
              and updated_at is not null and published_row is not null
          config:
            where: "publishes"
    columns:
      - name: atc_trail_update_page_key
        description: base_atc__atc_trail_updates_pages's key, the registry key and ATC's slug.
        data_tests: [not_null, unique]
      - name: slug
        description: ATC's slug, which an automatic row publishes as `atc_id`.
        data_tests: [not_null, unique]
      - name: sitemap_row
        description: The update's place in the sitemap, from 0.
      - name: refusal
        description: >
          Why the update may not publish without a person, in
          auto_publish_refusal()'s words; null where it publishes.
      - name: publishes
        description: Whether the update publishes without a person, unreviewed.
        data_tests: [not_null]
      - name: actionable
        description: >
          Whether the refusal is one a person can act on: every reason but a
          reviewed slug and an update older than the review, the two that
          export_atc_updates.py's job log and propose_atc_updates.py leave out.
        data_tests: [not_null]
      - name: atc_id
        description: The slug, as an automatic row's id.
      - name: title
        description: ATC's headline, str.strip()'d as auto_row() strips it.
      - name: category
        description: ATC's category, one this build knows where the row publishes.
      - name: states
        description: The chip's states, as JSON.
      - name: start_mile_text
        description: >
          The NOBO mile the agreed reference starts at, as the parse read it,
          text (dbt 2.0.6's unit tests compare a DOUBLE only to one decimal);
          null where the update does not publish.
      - name: end_mile_text
        description: The NOBO mile it ends at, the start for a point; null where it does not publish.
      - name: obstructs_trail
        description: False, always, and read from nothing (CL09).
        data_tests: [not_null]
      - name: updated_at
        description: ATC's dateModified in UTC to the second, `...Z`, as _as_utc_stamp() writes it; null where it does not publish.
      - name: source_url
        description: The update's own page.
      - name: published_row
        description: >
          The row as auto_row() writes it, for pub_conditions_atc_updates, each
          mile the JSON number the parse read; null where it does not publish.

  - name: int_closures__nynjtc_checked
    description: >
      NYNJTC's Trail Alerts posts, read as lib/nynjtc_alerts.py's parse_alert()
      reads them and shaped as published_rows() publishes them (WN05-WN08),
      with why a post cannot be read in `problems`. int_closures__gate holds
      NYNJTC's file back on any problem, or on a category with no posts.
    columns:
      - name: trail_alert_key
        description: base_nynjtc__nynjtc_trail_alerts's key, the post's WordPress id.
        data_tests: [not_null, unique]
      - name: notice_id
        description: >
          `nynjtc_trail_alerts:<slug>`, the published notice_id, or
          `nynjtc_trail_alerts:post-<id>` for a post with no readable slug or a
          slug another post shares.
        data_tests: [not_null, unique]
      - name: slug
        description: The post's slug, stripped, as parse_alert() strips it.
      - name: title
        description: The title as _text_of() reads it, tags out and entities unescaped twice.
      - name: locality
        description: The regions, else the states, else the parks a post is tagged with, by name; empty where none.
      - name: source_url
        description: The post's link, as NYNJTC serves it.
      - name: modified_at
        description: NYNJTC's own last edit of the alert.
      - name: updated_at
        description: The same, as the published text, to the second with a Z.
      - name: problems
        description: Why the post cannot be read, each prefixed by its slug or id.
      - name: problem
        description: The same joined by " | ", or null where the post reads.

  - name: int_closures__oprhp_areas
    description: >
      NYS Parks' temporary closed areas, one row per area with a geometry,
      its reason and place stripped and null where blank, and no dates
      (export_nearby_trails.py's load_closure_areas(), CL13).
    columns:
      - name: closure_key
        description: stg_oprhp__trail_closures's key.
        data_tests: [not_null, unique]
      - name: closure_reason
        description: The layer's `Name`, its whole reason as prose, stripped.
      - name: closure_place
        description: The layer's `Descript`, where it is, stripped.
      - name: geom_geojson
        description: >
          The closed area in lon/lat, as GeoJSON text: a GEOMETRY column in a
          unit-tested model's output panics dbt 2.0.6, and contracted marts
          cannot hold one (the closures mart's geom_geojson says why).
        data_tests: [not_null]

  - name: int_closures__ourhike_checked
    description: >
      OurHike's moderator-verified closures, each with whether it blocks the
      trail (its status, read as client/src/lib/closureBanner.ts reads it) and
      a problem for a row that is not verified (CL15).
    columns:
      - name: ourhike_closure_key
        description: base_ourhike__closures's key.
        data_tests: [not_null, unique]
      - name: obstructs_trail
        description: >
          True for `closed` and `reroute_available`, false for `open` (a
          reopened closure), null for a status the backend does not define.
      - name: problems
        description: Why the row cannot publish; empty where it can.

  - name: int_closures__unioned
    description: >
      Every notice, closed area and closure the closures and warnings marts
      are split from, one row each, by name, nothing filtered: ATC's reviewed
      Trail Updates, the updates ATC posted since that review which
      int_closures__atc_automatic publishes without a person (review_state
      `auto`, obstructs_trail false), NYNJTC's Trail Alerts, NYS Parks'
      temporary closed areas and OurHike's verified closures, each with
      `obstructs_trail`, `review_state` and its source's `problems`.
    columns:
      - name: notice_id
        description: >
          `<source key>:<the source's own id>`, unique across every source;
          the closures and warnings marts' key.
        data_tests: [not_null, unique]
      - name: source_key
        description: The registry key, or the unregistered key int_sources__publication reads it under.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [atc_trail_updates, nynjtc_trail_alerts, oprhp_trail_closures, ourhike_closures]
      - name: review_state
        description: Who stands behind the row; `auto` for an ATC update nobody here has read, which its gate published.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [reviewed, not_reviewed, org_published, moderator_verified, auto]
      - name: obstructs_trail
        description: >
          Whether a hiker is stopped from walking through, as its source says;
          null where nobody has classified it (every NYNJTC alert).
      - name: problems
        description: Why the row cannot publish, from its source's checks; empty where it can.
        data_tests: [not_null]

  - name: int_closures__gate
    description: >
      The per-source gate: one row per notice source, `rows_invalid` and
      `passed`, so one bad ATC row holds back ATC's file and nothing else
      (pipeline/ELT.md, "A whole-file gate becomes a per-source gate"). The
      marts keep only passing sources, and each writer refuses to write a held
      source's file, so the phone keeps the last good one. ATC's review is
      read from the file landed whole, so an empty reviewed file passes and
      publishes `atc_updates: []`, as export_atc_updates.py does.
    data_tests:
      # Warns, never fails: failing the build would hold back every source
      # for one. dbt 2.0.6 reports only the count of held sources; to see
      # which and why, from pipeline/dbt:
      #   dbt show --profiles-dir . --inline "select source_key, held_because
      #     from intermediate.int_closures__gate where not passed"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "passed"
          config:
            severity: warn
    columns:
      - name: source_key
        description: The notice source, one row for each branch of int_closures__unioned.
        data_tests: [not_null, unique]
      - name: rows_total
        description: The source's rows in int_closures__unioned.
      - name: rows_invalid
        description: Its rows with a problem.
        data_tests: [not_null]
      - name: may_publish
        description: >
          int_sources__publication's answer for the source, false where it has
          no row. The marts join that model themselves; it is here so a writer
          reads one answer per source.
        data_tests: [not_null]
      - name: reviewed_at
        description: >
          ATC's `reviewed_at`, as written in the file landed whole, which
          pub_conditions_atc_updates publishes; null for every other source,
          which no person reviews as a file.
      - name: passed
        description: Whether its rows may reach the marts and its file may be written.
        data_tests: [not_null]
      - name: held_because
        description: Why not, in words for the job log; null where it passed.
      - name: awaiting_review
        description: >
          True only for ATC's file when nobody has reviewed it yet, the one
          hold export_atc_updates.py treats as no failure (it writes nothing
          and exits 0). pub_conditions_atc_updates then selects no row, and
          phone_file's `when_empty: keep_last_file` leaves the last good file
          and succeeds. Every other hold still fails the writer.
        data_tests: [not_null]

unit_tests:
  - name: int_closures__atc_checked_finds_what_file_problems_finds
    description: >
      One row per branch of lib/atc_updates.py's row_problems() and the file's
      repeat check, each named after the test in tests/test_lib_atc_updates.py
      it stands in for, plus two the extract's verbatim landing made
      checkable: a mile written "476.6" (row 25) and a misspelt
      `Obstructs_Trail` (row 26), both refused as the Python refuses them.
      Each expected problem is the Python's, with values rendered as JSON;
      tests/test_dbt_conditions_parity.py runs row_problems() over these same
      rows and fails where the two disagree, except row 36, a source_url with
      a leading space, which this model refuses on purpose. Rows 0, 1, 3, 7-12
      and 37 are fine: a real update, a point closure, the far end of the
      trail, the six categories only page ten ever showed, and an upper-case
      scheme.
    model: int_closures__atc_checked
    given:
      - input: ref('base_atc__atc_trail_updates')
        rows:
          - {atc_update_row_key: k00, file_row: 0, atc_update: '{"atc_id": "a00", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Closure", "states": ["VA"], "start_mile_marker": 476.6, "end_mile_marker": 485.8, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k01, file_row: 1, atc_update: '{"atc_id": "a01", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Closure", "states": ["VA"], "start_mile_marker": 1503.6, "end_mile_marker": 1503.6, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k02, file_row: 2, atc_update: '{"atc_id": "a02", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Closure", "states": ["VA"], "start_mile_marker": 15036.0, "end_mile_marker": 15036.0, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k03, file_row: 3, atc_update: '{"atc_id": "a03", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Closure", "states": ["VA"], "start_mile_marker": 2197.5, "end_mile_marker": 2197.5, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k04, file_row: 4, atc_update: '{"atc_id": "a04", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Closure", "states": ["VA"], "start_mile_marker": 485.8, "end_mile_marker": 476.6, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k05, file_row: 5, atc_update: '{"atc_id": "a05", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Closure", "states": ["VA"], "start_mile_marker": 476.6, "end_mile_marker": 485.8, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "javascript:alert(1)"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k06, file_row: 6, atc_update: '{"atc_id": "a06", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Emergency", "states": ["VA"], "start_mile_marker": 476.6, "end_mile_marker": 485.8, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k07, file_row: 7, atc_update: '{"atc_id": "a07", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Water", "states": ["VA"], "start_mile_marker": 476.6, "end_mile_marker": 485.8, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k08, file_row: 8, atc_update: '{"atc_id": "a08", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Relocation", "states": ["VA"], "start_mile_marker": 476.6, "end_mile_marker": 485.8, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k09, file_row: 9, atc_update: '{"atc_id": "a09", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Permits", "states": ["VA"], "start_mile_marker": 476.6, "end_mile_marker": 485.8, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k10, file_row: 10, atc_update: '{"atc_id": "a10", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Construction", "states": ["VA"], "start_mile_marker": 476.6, "end_mile_marker": 485.8, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k11, file_row: 11, atc_update: '{"atc_id": "a11", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Fire", "states": ["VA"], "start_mile_marker": 476.6, "end_mile_marker": 485.8, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k12, file_row: 12, atc_update: '{"atc_id": "a12", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Conservation", "states": ["VA"], "start_mile_marker": 476.6, "end_mile_marker": 485.8, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k13, file_row: 13, atc_update: '{"title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Closure", "states": ["VA"], "start_mile_marker": 476.6, "end_mile_marker": 485.8, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k14, file_row: 14, atc_update: '{"atc_id": "a14", "category": "Closure", "states": ["VA"], "start_mile_marker": 476.6, "end_mile_marker": 485.8, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k15, file_row: 15, atc_update: '{"atc_id": "a15", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "states": ["VA"], "start_mile_marker": 476.6, "end_mile_marker": 485.8, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k16, file_row: 16, atc_update: '{"atc_id": "a16", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Closure", "start_mile_marker": 476.6, "end_mile_marker": 485.8, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k17, file_row: 17, atc_update: '{"atc_id": "a17", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Closure", "states": ["VA"], "end_mile_marker": 485.8, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k18, file_row: 18, atc_update: '{"atc_id": "a18", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Closure", "states": ["VA"], "start_mile_marker": 476.6, "obstructs_trail": true, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
          - {atc_update_row_key: k19, file_row: 19, atc_update: '{"atc_id": "a19", "title": "SW Virginia: VA Creeper Trail Closure/Detour", "category": "Closure", "states": ["VA"], "start_mile_marker": 476.6, "end_mile_marker": 485.8, "updated_at": "2026-07-17T00:00:00Z", "source_url": "https://appalachiantrail.org/trail-updates/va-creeper/"}', reviewed_file: '{"reviewed_at": "2026-08-24"}'}
