version: 2

sources:
  - name: alaska_trails
    description: >
      Alaska Trails's registered layers, landed by the extract's
      alaska_trails/ folder (pipeline/extract/alaska_trails/) as
      raw_alaska_trails__<key>, and staged once each by a base model here.
      Descriptions transcribed from sources.json's titles.
    schema: raw
    config:
      # When the extract last read each table or confirmed it unchanged, from
      # its run log, never `_loaded_at` (decision 203): make_dbt_staging.py's
      # LOADED_AT_QUERY and MONTHLY_FRESHNESS_DAYS say why, and
      # tests/test_source_freshness.py holds every monthly source to them.
      loaded_at_query: "{{ last_read_or_confirmed_at(this) }}"
      freshness:
        warn_after: {count: 35, period: day}
        error_after: {count: 62, period: day}
    tables:
      - name: raw_alaska_trails__alaska_trails
        data_tests:
          # Rows sharing base_alaska_trails__alaska_trails's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'alaska_trails'", "trailname", "trailtype", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks(), decision 102), each at warn.
          - elementary.volume_anomalies:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          Alaska Trail Database (sources.json `alaska_trails`). Key:
          TrailName, TrailType and geometry, 1,595 of 1,595 live rows after 7
          exact copies; TrailType is null on 126, and without it one line
          carries two named trails.
