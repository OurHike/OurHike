  - name: int_trail_lines__network_overview_features_answer_what_write_overview_writes
    description: >
      write_overview()'s grouping (#1135, #1307; TL20): an open and a
      closed line of one blaze are two features, a through route's lines
      are one named feature marked `through_route`, everything else is
      haze carrying neither, coordinates are cut to three decimals, a
      vertex the cut lands on the one before it is not written, nor a part
      or a group the cut leaves as one point, and features come in
      sorted()'s order of their (source, name, blaze, status) tuples. Each
      row is a line that clears the floor and passes
      the seam's pass unchanged, so the expectations are write_overview()'s
      own file, which tests/test_dbt_trail_lines_network_parity.py
      rewrites from these rows.
