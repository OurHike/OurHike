# GENERATED by pipeline/make_dbt_staging.py from sources.json
# and the extract's club folders; edit them or it, never this file.
version: 2

models:
  - name: int_suggested_hikes__club_unioned
    description: >
      Every suggested hikes row of the 35 registered sources pipeline/make_dbt_staging.py
      stages for this type (decision 54 wave 3), unioned by name: one hike a club or NPS
      publishes: a WordPress write-up, a wiki trail or hike page, an NPS thing to do or tour.
      Each row carries its source's registry key, the club folder that extracted it, the base
      model's key, the conformed columns below and its source's own columns, prose left out,
      as `properties`. No geometry: a row is placed, where it is placed at all, by its own
      fields in `properties`. Unfiltered: whatever reads it keeps int_sources__publication's
      verdict.
    columns:
      - name: hike_key
        description: The base model's key, carried; unique across the union because the registry key is its first input.
        data_tests: [not_null, unique]
      - name: source_key
        description: The layer's sources.json key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_registry__sources')
                field: source_key
      - name: club
        description: The extract folder that landed the row (trail_orgs.json's slug, `-` written `_`).
        data_tests: [not_null]
      - name: name
        description: >
          The hike's name as its source titles it (WordPress's rendered title, a wiki
          page's title, NPS's title).
      - name: link
        description: >
          The page a hiker reads it on, as the source links it.
      - name: properties
        description: The base row's own columns, under dlt's names, as JSON, its prose left out (decision 55).
      - name: _loaded_at
        description: When the extract landed the row (dlt's load stamp).
