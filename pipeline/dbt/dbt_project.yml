# The dbt transform layer - the T of the ELT architecture DBT.md specifies
# (#100). The extract (pipeline/extract/, dlt) lands raw layers, and
# extract/_warehouse.py loads their committed files into data/warehouse.duckdb's
# `raw` schema; everything from there to a mart is owned by the models here.
name: ourhike
version: "1.0.0"
profile: ourhike

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: target
clean-targets: [target, dbt_packages]

models:
  ourhike:
    staging:
      # One source() in, light rename/cast only - views, per DBT.md's
      # conventions. The one sanctioned exception to "no joins in staging"
      # is stg_opentrail__waypoints's seed lookup, which the design names.
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      # Final, tested, documented - the only layer materialized as tables.
      +materialized: table
      +schema: marts
    publish:
      # The pub_ writers (pipeline/ELT.md, "Publish (reverse ETL)"): each
      # builds a table and copies it to a phone file under processed_dir
      # (macros/materializations/phone_file.sql). They run last, as their own
      # `--select path:models/publish` once every other test has passed,
      # because `dbt build` tests a model after building it, and a writer
      # would otherwise write its file before the tests upstream of it fail.
      +materialized: phone_file
      +schema: publish

seeds:
  ourhike:
    +schema: seeds
  # The evaluator ships an empty dbt_project_evaluator_exceptions seed of its
  # own, and its filter_exceptions() macro ignores every exception while that
  # copy is the one in the graph. Disabling it lets ref() land on ours,
  # seeds/dbt_project_evaluator_exceptions.csv; its entry in seeds/seeds.yml
  # says what a row must carry.
  dbt_project_evaluator:
    dbt_project_evaluator_exceptions:
      +enabled: false

# dbt_project_evaluator is ENFORCED: every finding fails the evaluator step
# in pipeline-tests.yml's `dbt` job, rather than warning (#1793 — Rebuild
# the data platform as dlt → dbt: seven contracted marts, a monthly refresh,
# published docs, and lighter phone downloads; the maintainer's words were
# "Enforce all standards in that tool"). A finding is fixed, or excepted by a
# row in the exceptions seed that says why. The env var is the evaluator's
# own documented switch, for a local survey of what would fail:
#   DBT_PROJECT_EVALUATOR_SEVERITY=warn dbt build -s package:dbt_project_evaluator
# Not a global --warn-error, which would also escalate dbt's deprecation
# warnings and every deliberate `warn`, such as source freshness.
data_tests:
  dbt_project_evaluator:
    +severity: "{{ env_var('DBT_PROJECT_EVALUATOR_SEVERITY', 'error') }}"

vars:
  # Where the pub_ writers write, relative to pipeline/dbt/. A folder of its
  # own under data/processed/ while each family's Python writer still runs:
  # export_sources.py writes data/processed/stewards.json and registry.json,
  # the names the writers use, and a dbt file written over one would leave
  # its manifest's sha256 describing the bytes it replaced. Shadow-run parity
  # wants the two copies anyway (pipeline/ELT.md, "How a rule moves"). Stage
  # 4 of #1793 points this at data/processed/ as each Python writer goes.
  # publish.py uploads by its manifests, never by a glob, so nothing here
  # reaches a bucket. scripts/test.sh points it at a temporary directory.
  processed_dir: "{{ env_var('OURHIKE_PROCESSED_DIR', '../data/processed/dbt') }}"

  # lib/podcasts.py's two scalar rules, read by int_podcasts__checked.
  # tests/test_dbt_podcasts_parity.py holds them to the Python constants
  # until stage 5 of #1793 deletes the Python, when these become the one home.
  podcast_spotify_id_pattern: "^[0-9A-Za-z]{22}$"
  podcast_max_at_mile: 2300

  # export_sources.py's two patterns for a paper-map row, read by
  # int_sources__paper_maps and held to the Python by
  # tests/test_dbt_sources_parity.py, as the podcast ones are.
  registry_product_handle_pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  registry_sheet_number_pattern: "^[0-9]{3}[A-Z]?$"

  # The closures and warnings family: lib/atc_updates.py's constants, read by
  # int_closures__atc_checked and held to the Python by
  # tests/test_dbt_conditions_parity.py until the Python is deleted. The
  # trail's own extent is ATC's half-mile marker layer, `Measure` 0.5 to
  # 2197.5 (measured 2026-08-09, lib/atc_updates.py). The categories are the
  # closed set ATC publishes, sorted, as the refusal message prints them.
  atc_trail_mile_min: 0.5
  atc_trail_mile_max: 2197.5
  atc_update_categories:
    - Alert
    - Animal
    - Closure
    - Conservation
    - Construction
    - Detour
    - Fire
    - Hiking Safety
    - Parking
    - Permits
    - Relocation
    - Water
  # The trail_lines network's constants (tl-net), read by the
  # int_trail_lines__network_* models and held to the Python's own by
  # tests/test_dbt_trail_lines_network_parity.py until stage 5 of #1793
  # deletes the Python: export_trails.py's DEFAULT_SIMPLIFY_TOLERANCE_M and
  # OVERVIEW_SIMPLIFY_TOLERANCE_M, lib/duplicates.py's two, and
  # export_nearby_trails.py's others under their own names. Each one's
  # evidence is beside it in the Python.
  trail_lines_network_navigation_tolerance_m: 1.0
  trail_lines_network_coordinate_decimals: 6
  trail_lines_network_duplicate_tolerance_m: 10.0
  trail_lines_network_duplicate_min_share: 0.5
  trail_lines_network_inside_boundary_min_fraction: 0.8
  trail_lines_network_overview_simplify_tolerance_m: 100.0
  trail_lines_network_chain_tolerance_m: 200.0
  trail_lines_network_named_trail_threshold_miles: 50.0
  trail_lines_network_overview_min_feature_m: 1873.7331444281513
  trail_lines_network_overview_seam_tolerance_m: 936.8665722140756
  trail_lines_network_overview_seam_decimals: 3

  # The challenges family (ch): lib/challenges.py's and export_challenges.py's
  # constants, read by the int_challenges__ models and held to the Python's
  # own by tests/test_dbt_challenges_parity.py until stage 5 of #1793 deletes
  # the Python. Lists keep the Python's order, because a refusal message
  # prints them in it.
  challenges_match_kinds:
    - place
    - places_all
    - poi_type
    - elevation_min_ft
    - section_walked
    - workday
    - self_report
  challenges_reward_kinds:
    - patch
    - postcard
    - sticker
    - drawing
  challenges_statuses:
    - draft
    - published
  # DEFAULT_RADIUS_M, the tag radius in metres from the POI when a match
  # gives none. @unvalidated: the handoff's examples (150 m for a named
  # place, 60 m for "any shelter"), not a measurement. For scale, measured
  # 2026-09-30 against release 2026-09-24-2: the median ATC shelter sits 63 m
  # from the centerline and the 75th percentile 140 m. What would settle
  # them is a phone that tags by distance, and tag prompts from real tracks
  # counting misses (too small) against side-trail junctions asked (too
  # large). Today only the radius check reads them; the phone tags by walked
  # miles (lib/challenges.py's DEFAULT_RADIUS_M says so).
  challenges_default_radius_m_place: 150
  challenges_default_radius_m_places_all: 150
  challenges_default_radius_m_poi_type: 60
  # MIN_RADIUS_M and MAX_RADIUS_M. Reasoned in the Python: below 10 m a
  # phone's fix error would decide the answer, above 2 km a place is a region.
  challenges_min_radius_m: 10
  challenges_max_radius_m: 2000
  # DEFAULT_MIN_FRACTION, the share of a walked section that counts as walking
  # it. @unvalidated: the handoff's example value; the walked share recorded
  # on real tracks of hikers who did walk a section would settle it.
  challenges_default_min_fraction: 0.9
  # ID_MAX_CHARS (the backend's, backend/app/core/trail_challenge.py) and
  # _ID's pattern, as the Python spells it.
  challenges_id_max_chars: 120
  challenges_id_pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  # export_challenges.py's _DOMAIN, for a publishers.json row's `domain`.
  challenges_domain_pattern: "^[a-z0-9-]+(?:\\.[a-z0-9-]+)+$"
  # lib/poi_schema.py's POI_TYPES: a `poi_type` match must name one that at
  # least one published POI carries.
  challenges_poi_types:
    - shelter
    - campsite
    - water
    - resupply
    - viewpoint
    - parking
    - privy
    - trailhead
  # The day mystery titles are sealed against (CH07): a title ships as
  # sealed_title through its reveal_on, and in the clear from the next day.
  # Unset, it is the build's UTC date, as export_challenges.main() defaults
  # `today`; a run that must reproduce a file sets it, `--vars
  # '{challenges_build_date: 2027-07-20}'`, and the unit tests set it.
  challenges_build_date: null

  dbt_project_evaluator:
    # The mart names the maintainer chose carry no dim_/fct_ prefix
    # ("do not keep the dim_ and fct_ prefixes in the marts folders. Just
    # use the names I provided"). The evaluator reads a model's prefix as
    # everything before its first underscore plus the underscore,
    # so these ten cover the eleven marts - trail_ is both trail_lines and
    # trail_network, and a name with no underscore (closures, warnings,
    # podcasts, challenges, elevation, places, sources) reads as itself
    # plus `_`. No `dim_`: the maintainer's review, 2026-10-01, "No dim_ !",
    # so today's POI mart, once dim_pois, is points_of_interest already, in
    # models/marts/points_of_interest/, and stage 3 rebuilds it in place.
    #
    # A prefix outranks a folder in the evaluator's typing, so a future
    # trail_* model outside models/marts/ is flagged by fct_model_directories
    # rather than slipping through - wanted. Measured 2026-10-01 with
    # evaluator 1.4.0, on dbt 2.0.6 and again on dbt-oss 2.0.5, against a
    # scratch copy holding one model for each of the eleven names under
    # models/marts/<name>/: no naming or directory finding for any of them.
    marts_prefixes:
      - trail_
      - points_
      - elevation_
      - closures_
      - warnings_
      - podcasts_
      - challenges_
      - places_
      - suggested_
      - sources_
    # The phone-file writers (models/publish/pub_<file>). pipeline/ELT.md
    # left open whether the evaluator accepts pub_ as it stands; it does not:
    # measured 2026-10-01 on dbt 2.0.6, fct_model_naming_conventions typed
    # pub_podcasts_episodes as `other` and wanted rpt_, the default's only
    # other prefix. rpt_ stays, for the reporting models ELT.md plans.
    other_prefixes:
      - rpt_
      - pub_

# dbt_utils has no DuckDB version of `deduplicate`, and its default joins the
# kept rows back with a NATURAL JOIN, where NULL never equals NULL: every row
# holding a null in any column disappears (measured 2026-10-01, DuckDB 1.5.5:
# of (1,'a',NULL), (2,'b','x'), (3,'b','x') deduplicated on the second
# column, it kept only (2,'b','x')). Every ATC staging model carries a null
# public_use. Dispatch is dbt_utils' own way for a project to supply an
# adapter's implementation, so models call `dbt_utils.deduplicate` and dbt
# finds macros/duckdb__deduplicate.sql here first. Measured on dbt 2.0.6, the
# same three rows came back as (1,'a',NULL), (2,'b','x').
dispatch:
  - macro_namespace: dbt_utils
    search_order: ["ourhike", "dbt_utils"]
