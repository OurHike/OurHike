  - name: int_points_of_interest__miles_reads_the_axis_like_attach_miles
    description: >
      PO11 and PO10 on three axis pieces in EPSG:5070 metres: piece 0 ends
      exactly where piece 1 begins, at the projection of (-74, 41). Read
      between two anchors, before the first and past the last (one mile per
      mile), on a piece with one anchor, 200 m off to the side, 2 km past
      the 1 km search (the fallback), and on the far piece. A point on the
      junction ties at distance 0 and is read on piece 1, the piece it does
      not end on. A point on another organization's trail (not_on_at) gets
