        - {source_key: ourhike_closures, may_publish: true, passed: true, held_because: null}
        - {source_key: ourhike_reports, may_publish: false, passed: false, held_because: 'int_sources__publication has no row for ourhike_reports, so nothing says it may publish'}
        - {source_key: nws_alerts, may_publish: false, passed: false, held_because: 'int_sources__publication has no row for nws_alerts, so nothing says it may publish'}
