  - name: int_trail_lines__network_published_cuts_what_rounded_geometry_cuts
    description: >
      The six-decimal cut nearby_trails.geojson carries (TL23), one row per
      case of tests/test_export_nearby_trails.py's that the cut answers:
      survey noise cut to six decimals, a line or part the cut would
      collapse kept whole at full precision, a negative zero, wandering
      lines. A coordinate exactly on a half rounds to even, as Python's
      round() does and DuckDB's round() does not. feature_order is
      registry order, then id. The expected GeoJSON is
      _rounded_geometry()'s, which tests/test_dbt_trail_lines_network_parity.py
      recomputes from these rows.
