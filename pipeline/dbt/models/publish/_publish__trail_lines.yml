version: 2

models:
  - name: pub_trails_geojson
    description: >
      Writes trails.geojson, the A.T.'s lines as the phone draws them, from
      the trail_lines mart's A.T. rows: one row, the FeatureCollection's
      `type`, `name` and `features`, which the phone_file materialisation
      copies to processed_dir/trails.geojson. Coordinates at 6 decimals
      (decision 8), where export_trails.py writes GDAL's digits. parity.py
      compares it with export_trails.py's file, feature by feature, after
      cutting the Python's coordinates to 6 decimals as
      export_nearby_trails._rounded_geometry does.
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: type
        description: Always FeatureCollection.
        data_type: varchar
        data_tests: [not_null, unique]
      - name: name
        description: "\"trails\", the layer name GDAL's GeoJSON driver writes for export_trails.py's table."
        data_type: varchar
      - name: features
        description: >
          The A.T.'s lines in feature_order, each a Feature with properties
          id, source, name and blaze_color and its geometry.
        data_type: json[]
  - name: pub_trail_miles
    description: >
      Writes trail_miles.json, the A.T. mile of every centerline vertex of
      trails.geojson (#1192 — A returning hiker's launch freezes for ten
      seconds while every waypoint is placed on the trail, on the main
      thread), from the trail_lines mart's chains, in
      export_trails.write_trail_miles()'s shape. trails_sha256 is the sha256
      of the trails.geojson bytes pub_trails_geojson wrote, read back from the
      file. parity.py compares the miles with export_trails.py's, vertex by
      vertex, and holds trails_sha256 to the hash of the dbt trails.geojson.
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: format
        description: The file format's version, 1, which client/src/lib/trailMiles.ts refuses anything but.
        data_type: integer
        data_tests: [not_null, unique]
      - name: trails_sha256
        description: >
          The sha256 of the trails.geojson these miles were measured on; the
          phone stores the miles only when it equals the published hash of
          the trails.geojson it verified (client/src/lib/trailData.ts).
        data_type: varchar
        data_tests: [not_null]
      - name: axis
        description: The axis the miles come off, export_trails.py's own literal.
        data_type: varchar
      - name: decimals
        description: The miles' decimals, trail_lines_mile_decimals (3).
        data_type: integer
      - name: feature_count
        description: How many chains carry miles.
        data_type: bigint
      - name: vertex_count
        description: How many vertices carry a mile, across every chain.
        data_type: bigint
      - name: miles
        description: Each chain's id to its vertex miles, in the chains' order.
        data_type: json
  - name: pub_trail_miles_v2
    description: >
      Writes v2/trail_miles.json (stage 6 of #1793): v1's trail_miles.json
      with each chain's vertex miles delta-coded in whole thousandths of a
      mile, from v2 of the trail_lines mart, to
      processed_dir/trail_miles_v2.json. trails_sha256 names the same
      trails.geojson v1's does. parity.py's trail_miles_v2 family decodes it
      and compares every vertex's mile with v1's file.
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: format
        description: >
          2. client/src/lib/trailMiles.ts reads format 1 as v1's `miles` and
          format 2 as these deltas, and anything else as no miles.
        data_type: integer
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: [2]
      - name: trails_sha256
        description: >
          The sha256 of the trails.geojson bytes pub_trails_geojson wrote,
          the line file both versions of trail_miles.json describe; the
          phone stores the miles only when it equals the published hash of
          the trails.geojson it verified (client/src/lib/trailData.ts).
        data_type: varchar
        data_tests: [not_null]
      - name: axis
        description: The axis the miles come off, export_trails.py's own literal, as v1 writes it.
        data_type: varchar
      - name: decimals
        description: The decimals v1's miles are rounded at, trail_lines_mile_decimals (3), which thousandths hold exactly.
        data_type: integer
      - name: feature_count
        description: How many chains carry miles.
        data_type: bigint
      - name: vertex_count
        description: How many vertices carry a mile, across every chain.
        data_type: bigint
      - name: milli_mile_deltas
        description: >
          Each chain's id to its vertex miles in whole thousandths of a mile,
          in the chains' order: the first vertex's as itself, every later
          one as its step from the vertex before, negative where the chain
          steps backwards.
        data_type: json
  - name: pub_trails_overview
    description: >
      Writes trails_overview.geojson, the corridor-view sketch of the
      centerline (PR #872 — Publish a corridor-view centerline, and ask for
      it before the app has booted), from int_trail_lines__at_overview, in
      export_trails.write_overview()'s shape: one Feature and one
      MultiLineString. parity.py compares it with export_trails.py's file.
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: type
        description: Always FeatureCollection.
        data_type: varchar
        data_tests: [not_null, unique]
      - name: features
        description: The one sketch Feature.
        data_type: json[]
  - name: pub_spurs
    description: >
      Writes spurs.json, what each spur leads to (#134 — The line-detail
      sheet that shows a spur's destination) and where it joins the A.T.
      (#136 — Publish the mile at which each spur joins the AT), from the
      trail_lines mart's spurs: one object keyed by side-trail id, keys
      sorted at both levels as export_spurs.py's json.dumps(sort_keys=True)
      sorts them, written verbatim by phone_file's json_document format.
      parity.py compares it with export_spurs.py's file, spur by spur.
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: document
        description: The whole file, as JSON.
        data_type: json
        data_tests: [not_null, unique]
  - name: pub_club_sections
    description: >
      Writes club_sections.json, which club maintains which stretch of the
      A.T., from int_trail_lines__club_sections, in
      export_club_sections.build_output()'s shape. `source_edited` is empty:
      the extract lands no layer edit date (the writer's header says what
      fills it). parity.py compares it with export_club_sections.py's file.
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: sources
        description: Which layer gives the attribution, the names and the miles.
        data_type: struct(attribution varchar, names varchar, miles varchar)
        data_tests: [not_null, unique]
      - name: source_edited
        description: Each layer's last edit day, where one is known; empty today.
        data_type: json
      - name: clubs
        description: The clubs, south to north.
        data_type: json[]
        data_tests: [not_null]
      - name: unattributed
        description: The stretches no club is named for, in mile order.
        data_type: json
        data_tests: [not_null]

exposures:
  - name: trails_geojson
    label: trails.geojson
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      The A.T.'s centerline chains, side trails and spurs, the lines every
      A.T. screen draws, held offline whole (tier (a), the safety core, in
      pipeline/ELT.md's "Four kinds of phone file"). Read by
      client/src/lib/trailData.ts, which hands it to MapLibre. Published by
      publish-vector-data.yml from export_trails.py's file until stage 4 of
      #1793 — Rebuild the data platform as dlt → dbt: seven contracted marts,
      a monthly refresh, published docs, and lighter phone downloads moves
      it to this writer's.
    depends_on:
      - ref('trail_lines', v=1)
      - ref('pub_trails_geojson')
    config:
      meta:
        r2_keys: [trails.geojson]
        format: geojson
        coordinate_decimals: 6
        offline_tier: safety_core
        # @unvalidated as a budget: ELT.md's "Before and after, first run"
        # measured 1,619,869 gzipped bytes for one release at 6 decimals,
        # which is a size, not a ceiling anyone chose.
        size_budget_bytes: 1619869
        cadence: monthly
  - name: trail_miles_json
    label: trail_miles.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      The mile of every centerline vertex of trails.geojson, so the phone
      stopped measuring the trail itself (#1192 — A returning hiker's launch
      freezes for ten seconds while every waypoint is placed on the trail,
      on the main thread), read by
      client/src/lib/trailMiles.ts beside trails.geojson. Optional on the
      phone: a mismatched or missing file means the phone measures the line
      itself. Published beside trails.geojson by publish-vector-data.yml
      until stage 4 of #1793 — Rebuild the data platform as dlt → dbt: seven contracted marts, a monthly refresh, published docs, and lighter phone downloads moves it to this writer's.
    depends_on:
      - ref('trail_lines', v=1)
      - ref('pub_trail_miles')
    config:
      meta:
        r2_keys: [trail_miles.json]
        format: json
        offline_tier: safety_core
        cadence: monthly
  - name: trail_miles_json_v2
    label: v2/trail_miles.json
    type: application
    maturity: low
    owner:
      name: OurHike
    description: >
      v2 of trail_miles.json (decision 44): the same mile for every
      centerline vertex of trails.geojson, delta-coded in whole thousandths
      of a mile, published beside v1 at v2/trail_miles.json under the release
      folder (stage 6 of #1793; pipeline/ELT.md, "Making the download
      smaller"). A phone reads it only once its build reads schema version
      v2 and channels.json names a v2 release; every other phone keeps
      reading v1's trail_miles.json, which is still written. Optional on the
      phone, as v1 is: a mismatched or missing file means the phone measures
      the line itself.
    depends_on:
      - ref('trail_lines', v=2)
      - ref('pub_trail_miles_v2')
    config:
      meta:
        r2_keys: [v2/trail_miles.json]
        format: json
        offline_tier: safety_core
        # @unvalidated as a budget: report 5's measured packing of release
        # 2026-09-24-2's miles on the wire (pipeline/ELT.md, "Before and
        # after, first run"), not a ceiling anyone chose.
        size_budget_bytes: 179522
        cadence: monthly
        # The mart columns this file's writer reads, in Elementary's type words, which
        # exposure_schema_validity checks on the mart (decision 102). It can only because this is
        # the one phone file reading that mart: with more, Elementary 0.26.0 needs
        # context["render"], which dbt 2.0.6 lacks.
        referenced_columns:
          - {column_name: trail_line_id, data_type: string}
          - {column_name: line_kind, data_type: string}
          - {column_name: feature_order, data_type: numeric}
          - {column_name: vertex_milli_miles, data_type: other}
  - name: trails_overview_geojson
    label: trails_overview.geojson
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      The corridor-view sketch of the centerline (PR #872 — Publish a
      corridor-view centerline, and ask for it before the app has booted),
      drawn at low zoom until the real line lands and dropped above the pin
      seam (client/src/map/style.ts). Published by publish-vector-data.yml
      from export_trails.py's file until stage 4 of #1793 — Rebuild the data platform as dlt → dbt: seven contracted marts, a monthly refresh, published docs, and lighter phone downloads moves it to this
      writer's.
    depends_on:
      - ref('pub_trails_overview')
    config:
      meta:
        r2_keys: [trails_overview.geojson]
        format: geojson
        coordinate_decimals: 4
        cadence: monthly
  - name: spurs_json
    label: spurs.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      Where each blue-blazed spur leads and where it joins the A.T.
      (features/SPUR_TRAILS.md), read by client/src/lib/lineDetail.ts for a
      tapped side trail. Optional on the phone: a release without it draws
      every spur and cannot say where one goes. Published by
      publish-vector-data.yml from export_spurs.py's file until stage 4 of
      #1793 — Rebuild the data platform as dlt → dbt: seven contracted marts, a monthly refresh, published docs, and lighter phone downloads moves it to this writer's.
    depends_on:
      - ref('trail_lines', v=1)
      - ref('pub_spurs')
    config:
      meta:
        r2_keys: [spurs.json]
        format: json
        cadence: monthly
  - name: club_sections_json
    label: club_sections.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      Which of the thirty clubs maintains which stretch of the A.T., and the
      miles no club is named for, read by client/src/lib/clubSections.ts for
      the corridor view and the waypoint card. Published by
      publish-vector-data.yml from export_club_sections.py's file until stage
      4 of #1793 — Rebuild the data platform as dlt → dbt: seven contracted
      marts, a monthly refresh, published docs, and lighter phone downloads
      moves it to this writer's.
    depends_on:
      - ref('pub_club_sections')
    config:
      meta:
        r2_keys: [club_sections.json]
        format: json
        cadence: monthly
