          - duplicates_are_exact:
              arguments:
                key_columns: ["'sbts_connected_community_trailheads'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
        description: >
          Connected Communities trailheads (SBTS's own planning layer) (sources.json
          `sbts_connected_community_trailheads`). Key: the geometry: 26 of 26 (measured
          2026-10-04 by reading every row and every vertex as the extract reads the layer
          (f=geojson, outSR 4326), under lib/user_agent.py's USER_AGENT, robots.txt
          first). `id_field` names the object id, which a reload mints again (decision
          40).
      - name: raw_sbts__sbts_dirt_magic_podcast
        data_tests:
          # Rows sharing base_sbts__sbts_dirt_magic_podcast's key must be exact copies (decision 40).
          - duplicates_are_exact:
