version: 2

models:
  - name: trail_network
    description: >
      The junction graph a day hike routes over, one row per edge: a piece
      of a maintained trail line between two junctions, carrying its parent
      line's id, source, name and blaze, in the order trail_graph.json lists
      the edges (pipeline/ELT.md, "The eleven marts"). Built from the
      trail_lines mart's network lines and the A.T.'s centerline and side
      trails, as build_trail_graph.py builds it from nearby_trails.geojson
      and trails.geojson today. trail_graph.json and
      trail_graph_geometry.json are written from it; cut_trail_graph.py cuts
      both into 1-degree cells.
    config:
      access: public
      contract:
        enforced: true
    data_tests:
      # Elementary's checks (decision 102; pipeline/ELT.md, "The checks, and
      # where each goes"), each at warn and run by build_marts.py after the
      # writers: the edges at each build; the edges per club and source, so
      # one club's network vanishing cannot hide inside the total; and each
      # column's null rate, the geometry left out. No
      # exposure_schema_validity: three phone files read this mart, and with
      # more than one Elementary 0.26.0 checks a column only through
      # context["render"], which dbt 2.0.6 does not have (the test errored,
      # measured 2026-10-08), so it could check nothing here.
      - elementary.volume_anomalies:
          config:
            severity: warn
            tags: [elementary_check]
            enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
      - elementary.dimension_anomalies:
          arguments:
            dimensions: [club, source_key]
          config:
            severity: warn
            tags: [elementary_check]
            enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
      - elementary.all_columns_anomalies:
          arguments:
            column_anomalies: [null_percent]
            exclude_regexp: "^(geom_geojson)$"
          config:
            severity: warn
            tags: [elementary_check]
            enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
      # ELT.md, "Geometry rules every mart obeys": the range, on what the
      # phone parses.
      - dbt_utils.expression_is_true:
          name: trail_network_edges_are_in_lon_lat
          arguments:
            expression: >
              st_xmin(st_geomfromgeojson(geom_geojson)) >= -180
              and st_xmax(st_geomfromgeojson(geom_geojson)) <= 180
              and st_ymin(st_geomfromgeojson(geom_geojson)) >= -90
              and st_ymax(st_geomfromgeojson(geom_geojson)) <= 90
      # The lon/lat swap test, which the range test above cannot be: a swapped
      # point is still inside +/-180 and +/-90. Its boxes and their evidence are
      # tests/generic/lands_in_the_region_its_source_publishes_in.sql's.
      - lands_in_the_region_its_source_publishes_in:
          name: trail_network_edges_land_in_the_region_their_source_publishes_in
          arguments:
            geometry: st_geomfromgeojson(geom_geojson)
      # An edge is a line with two or more vertices, never a point, so a
      # consumer can walk it from its first vertex to its last.
      - dbt_utils.expression_is_true:
          name: trail_network_edges_have_two_vertices
          arguments:
            expression: "json_array_length(json_extract(geom_geojson, '$.coordinates')) >= 2"
    columns:
      - name: edge_id
        description: >
          The edge's key: its parent line's trail_id, `#`, the part of that
          line it lies on and, after `.`, the piece along that part, each
          from 1 (`centerline:chain:12#1.3`). Global to a build: noding is
          global, so one changed line moves the pieces of every line it
          crosses.
        data_type: varchar
        constraints:
          - type: not_null
        data_tests: [not_null, unique]
      - name: edge_index
        description: >
          The edge's place in trail_graph.json's `edges` and in
          trail_graph_geometry.json, from 0; every companion file is aligned
          by it.
        data_type: integer
        constraints:
          - type: not_null
        data_tests: [not_null, unique]
      - name: club
        description: The extract folder that landed the parent line.
        data_type: varchar
        constraints:
          - type: not_null
      - name: source_key
        description: The parent line's registry key, published on the edge as `source`.
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('sources')
                field: source_key
      - name: _loaded_at
        description: When the parent line's source was loaded.
        data_type: timestamptz
        constraints:
          - type: not_null
      - name: trail_id
        description: The parent line's `id` in the trail_lines mart, published as `trail_id`.
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('trail_lines')
                field: trail_line_id
      - name: name
        description: The parent line's name; null where nothing names it.
        data_type: varchar
      - name: blaze_color
        description: The parent line's blaze, as the map paints it.
        data_type: varchar
      - name: from_node
        description: The published `from`, an index into trail_graph.json's `nodes` (int_trail_network__nodes).
        data_type: integer
        constraints:
          - type: not_null
      - name: to_node
        description: The published `to`, an index into trail_graph.json's `nodes`.
        data_type: integer
        constraints:
          - type: not_null
      - name: length_m
        description: >
          The piece's length in metres on the WGS84 ellipsoid (decision 90;
          EPSG:5070 metres before it), 2 decimals, measured on the 1 m
          navigation line the graph is noded from, as
          build_trail_graph.py measures it; never more than a few
          centimetres off the line the phone draws, and equal or shorter
          than the steward's full-resolution line (decision 8's
          full-resolution length is not built, ELT.md's TN07 row).
        data_type: double
        constraints:
          - type: not_null
      - name: geom_geojson
        description: >
          The edge's vertices as a GeoJSON LineString in lon/lat, from its
          `from` node to its `to` node; its `coordinates` are the edge's
          entry in trail_graph_geometry.json, 6 decimals.
        data_type: varchar
        constraints:
          - type: not_null
      - name: _first_seen_at
        description: "{{ doc('row_first_seen_at') }}"
        data_type: timestamptz
        data_tests:
          - not_null:
              config:
                # warn only on a leg build_marts.py built without its history,
                # where both dates are null and the run is red already.
                severity: "{{ 'warn' if env_var('OURHIKE_ROW_HISTORY', 'on') == 'off' else 'error' }}"
      - name: _changed_at
        description: "{{ doc('row_changed_at') }}"
        data_type: timestamptz
        data_tests:
          - not_null:
              config:
                severity: "{{ 'warn' if env_var('OURHIKE_ROW_HISTORY', 'on') == 'off' else 'error' }}"
