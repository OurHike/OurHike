          - {restriction: 'not_a_restriction', pattern: '\b(without|with no|no|any) (any )?(representation or )?(warranty|warranties|guarantees?)\b', written_for: 'nps_park_boundaries', why: 'A warranty disclaimer'}
          - {restriction: 'not_a_restriction', pattern: '\b(makes|make|gives|give|provide|provides) no (claims|warranty|warranties)\b', written_for: 'trta_special_management_areas', why: 'A warranty disclaimer'}
          - {restriction: 'not_a_restriction', pattern: '\b(shall|will|is|are) not (be )?(held )?(liable|responsible)\b|\bdisclaims\b|\bhold (\w+ ){0,6}harmless\b|\bindemnify\b|\bassumes? (no|the entire) (responsibility|risk)\b|\b(used and )?relied upon only at the user''s sole risk\b|\b(you are|user is) (solely )?responsible\b|\bsole remedy\b', written_for: 'nps_park_boundaries', why: 'A liability disclaimer: who answers for a misuse, not what use is allowed'}
          - {restriction: 'not_a_restriction', pattern: '\b(are|is) (neither|not) (legal documents|of survey quality|engineering quality drawings)( nor land surveys)?\b|\bnot (intended )?(to be used )?(for|as) (legal|engineering|survey(ing)?)( or (legal|engineering|survey(ing)?))? (purposes|documents)?\b|\bin no way intended for engineering or legal purposes\b|\bmay not have been prepared for or be suitable for\b|\b(are )?not intended to be used as such\b|\bmust not be used as such\b|\bnot to be used for describing actual or true property ownership\b|\bmay not have the necessary accuracy or completeness required\b|\brepresents only the approximate relative location\b', written_for: 'grsm_park_boundary_lines', why: 'An accuracy or fitness disclaimer: the data is not a survey, an engineering drawing or a legal document'}
          - {restriction: 'not_a_restriction', pattern: '\bfor (general )?(information(al)?|reference|geographic reference|display) purposes( only)?\b|\bfor the information and convenience of the public\b|\bas a public service\b', written_for: 'ugrc_municipal_boundaries', why: 'Says the data informs rather than certifies; restricts nothing about rendering it'}
          - {restriction: 'not_a_restriction', pattern: '\b(will|shall|should) (be )?(credit|cite|cited)\b|\bcredit/disclaimer\b|\bshould be cited as the data source\b', written_for: 'blm_public_lands_access_lines', why: 'A credit requirement: every source row carries its `attribution`, and the sources mart prints it'}
