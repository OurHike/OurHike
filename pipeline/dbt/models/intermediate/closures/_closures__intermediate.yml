  - name: int_closures__club_notices_keeps_a_notice_for_a_days_margin_either_side_of_its_own_dates
    description: >
      Rule 1's and rule 3's margins at their edges, on a build pinned to
      2026-10-05 (var notices_build_date), so that a margin cut or a
      comparison flipped goes red: an 'Active' closure (placed, as every
      R06 row is, so its fire closure layer's own name closes it) that
      ended yesterday still closes the trail, and one that ended the day
      before is kept but no longer closes it (rule 3; neither is held, rule 1 since the
      maintainer's frame A of 2026-10-10); a notice starting tomorrow, the
      day after, or next month publishes now with its own `starts_on`, and
      an 'Active' closure among them publishes `obstructs_trail` true, its
      start read by the phone (rule 1 since the maintainer's frame B of
      2026-10-11 for wave 6's page 01, P3); an order rescinded the day before
      yesterday or yesterday is held, and one rescinded today or tomorrow is
      not, the same day of margin an end date has. Every stated time is noon
      UTC, so each row's day is the same in every US zone.
    model: int_closures__club_notices
    overrides:
      vars:
        # Overriding vars replaces them all in a unit test: rule 9's lead.
        notice_season_lead_days: 30
        notices_build_date: "2026-10-05"
