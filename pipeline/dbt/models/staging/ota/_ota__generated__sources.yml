# GENERATED by pipeline/make_dbt_staging.py from sources.json
# and the extract's club folders; edit them or it, never this file.
version: 2

sources:
  - name: ota
    description: >
      The layers sources.json registers for the extract's ota/ folder (pipeline/extract/ota/)
      that pipeline/make_dbt_staging.py stages, landed as raw_ota__<key> and staged once each
      by a generated base model here. Descriptions transcribed from sources.json's titles and
      key notes.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      meta:
        cadence: monthly
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_ota__ota_sections
        data_tests:
          # Rows sharing base_ota__ota_sections's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'ota_sections'", "link"]
        description: >
          Ozark Trail Association Trail Directory sections (ozarktrail.com/trail-
          directory/) (sources.json `ota_sections`). Key: `link`, the section's page after
          its redirect: unique on all 14 rows read 2026-10-04, as are the names.
      - name: raw_ota__ota_trail_map
        data_tests:
          # Rows sharing base_ota__ota_trail_map's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'ota_trail_map'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
                row_id_columns: ["objectid", "objectid_1", "objectid_12", "oid", "esri_oid", "fid", "ogc_fid", "_dlt_id", "_socrata_id", "feature_index", "feature_id"]
        description: >
          Ozark Trail map: trail lines and trailheads (Ozark Trail Association's Google My
          Map) (sources.json `ota_trail_map`). Key: The geometry alone: unique on 161 of
          161 (measured 2026-10-04 on the live export). `name` is 158 of 161.
