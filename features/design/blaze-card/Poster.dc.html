<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share poster — my summer on the A.T.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700&amp;family=Public+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:'Public Sans',system-ui,sans-serif;color:#fdfaf2}
a{color:#c7dabd}a:hover{color:#fdfaf2}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; background: #122016; padding: 64px 72px 56px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative">

  <div style="display: flex; justify-content: space-between; align-items: flex-start">
    <div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: #96b98c">A.T. Summer Bucket List · 2027</div>
      <h1 style="margin: 10px 0 0; font-family: 'Bitter', Georgia, serif; font-weight: 700; font-size: 84px; line-height: 0.98; letter-spacing: -0.015em; color: #fdfaf2">My summer<br>on the A.T.</h1>
    </div>
    <div style="text-align: right">
      <div style="font-family: 'Bitter', Georgia, serif; font-weight: 700; font-size: 150px; line-height: 0.9; color: #d69a2d">27</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: #96b98c; margin-top: 8px">blazes earned · 5 states</div>
    </div>
  </div>

  <div style="display: flex; gap: 16px; align-items: stretch">
    <div style="flex: 0 0 500px; box-sizing: border-box; padding: 10px; border-radius: 18px; background: #0e1a12; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06)">
      <dc-import name="BlazeCard" tile="{{tile}}" gap="{{gap}}" done="{{done}}" labels="{{true}}" hint-size="480px,840px"></dc-import>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0">
      <div style="border-radius: 18px; background: #fffdf7; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.35)">
        <img src="./map-poster.svg" alt="Map of the eastern United States with the Appalachian Trail and this hiker's earned blazes along it" style="display: block; width: 420px; height: 470px">
      </div>
      <div style="border-radius: 18px; background: #0e1a12; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; letter-spacing: 0.14em; text-transform: uppercase; color: #96b98c">Where they happened</div>
        <dc-import name="StateStrip" size="{{stripSize}}" blazes="{{blazes}}" walked="{{walked}}" labels="{{true}}" hint-size="380px,80px"></dc-import>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; color: #d69a2d; letter-spacing: 0.04em; margin-top: auto">GA · VA · WV · MD · PA</div>
      </div>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; align-items: center; gap: 18px">
      <span style="display: inline-block; width: 22px; height: 58px; background: #fdfaf2; border-radius: 2px" aria-hidden="true"></span>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; color: #c7dabd; line-height: 1.5">Appalachian Trail Conservancy<br><span style="color: #96b98c">× OurHike</span></div>
    </div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; color: #d69a2d; letter-spacing: 0.04em">#ATBucketList27</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"painted":{"editor":"int","default":27,"min":0,"max":100,"section":"Card"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const n = this.props.painted ?? 27;
    const seed = [3, 7, 12, 31, 34, 38, 45, 62, 77, 80, 84, 91, 1, 19, 50, 55, 68, 73, 88, 96, 9, 24, 41, 59, 66, 15, 28, 47, 71, 93, 5, 36, 52, 61, 79];
    // Where the seeded hiker's blazes landed: five states, most of them in
    // Virginia, plus the stretches walked (mile intervals, the app's own record).
    const blazes = [
      { mile: 0.0, done: true }, { mile: 8.0, done: true }, { mile: 703.1, done: true }, { mile: 713.0, done: true },
      { mile: 714.9, done: true }, { mile: 714.9, done: true }, { mile: 719.6, done: true }, { mile: 720.3, done: true },
      { mile: 787.9, done: true }, { mile: 830.5, done: true }, { mile: 1026.5, done: true }, { mile: 1030.0, done: true },
      { mile: 1106.0, done: true }, { mile: 200.1, done: false }, { mile: 471.3, done: false }, { mile: 2045.9, done: false },
      { mile: 2080.0, done: false }, { mile: 2197.9, done: false },
    ];
    const walked = [[0, 12], [700, 725], [785, 790], [826, 834], [1024, 1032], [1100, 1110]];
    return { tile: 40, gap: 6, done: seed.slice(0, Math.min(n, seed.length)), stripSize: 28, blazes, walked };
  }
}
</script>
</body>
</html>
