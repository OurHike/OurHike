version: 2

sources:
  - name: opentrail
    description: >
      opentrail.org's community A.T. waypoints, landed by
      pipeline/extract/_shared/opentrail/at.py from fetch_opentrail.py's
      API_URL (a community API with documented ETag support, not an ArcGIS
      layer, and a non-registry input, so it has no sources.json row), with
      every user comment left out. Data-reuse terms are an open question tracked as #98;
      nothing here changes what ships, only where transforms live.
    schema: raw
    config:
      # When the extract last read each table or confirmed it unchanged, from
      # its run log, never `_loaded_at` (decision 203): make_dbt_staging.py's
      # LOADED_AT_QUERY and MONTHLY_FRESHNESS_DAYS say why, and
      # tests/test_source_freshness.py holds every monthly source to them.
      loaded_at_query: "{{ last_read_or_confirmed_at(this) }}"
      freshness:
        warn_after: {count: 35, period: day}
        error_after: {count: 62, period: day}
    tables:
      - name: raw_opentrail__at
        data_tests:
          # Rows sharing stg_opentrail__waypoints's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'opentrail_at'", "dbid"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks(), decision 102), each at warn.
          - elementary.volume_anomalies:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          One row per community waypoint. `icon` is the upstream type code;
          the documented legend lives in fetch_opentrail.py's ICON_LEGEND
          and is mirrored (sync-tested) into the poi_type_mapping seed.
        columns:
          - name: dbid
            description: opentrail's own integer waypoint id.
            data_tests: [not_null, unique]
          - name: title
            description: The waypoint's community-given title.
          - name: icon
            description: >
              Upstream type code. Held to the full documented legend so an
              undocumented code appearing upstream fails loudly instead of
              passing through unmapped (DBT.md's testing strategy).
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["c", "s", "o", "j", "w", "t", "r", "a"]
