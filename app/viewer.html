<!doctype html>
<html lang="en">
  <!-- The artifact viewer (issue #202): drop a built .pmtiles archive from a
       pipeline workflow run onto this page and see it rendered with the real
       hiking cartography. Ships with every PR preview at /viewer.html, so
       "does this look like a map you would navigate by" - the question
       features/MAP_OPTIONS.md says only a real screen can answer - is one
       artifact download away from any PR. Not part of the app a hiker sees:
       its own entry point, no service worker registration, no tab bar. -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OurHike — map artifact viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #viewer {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #viewer-bar {
        padding: 0.5rem 0.75rem;
        background: #355c3a;
        color: #f7f3e9;
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
      }
      #viewer-bar strong {
        font-size: 0.95rem;
      }
      #viewer-status {
        font-size: 0.85rem;
        opacity: 0.95;
      }
      #viewer-map {
        flex: 1;
      }
    </style>
    <script type="module" crossorigin src="/app/assets/viewer-D0JN-A_-.js"></script>
    <link rel="modulepreload" crossorigin href="/app/assets/protocol-CiV2A8kp.js">
    <link rel="modulepreload" crossorigin href="/app/assets/mapWorker-V2P4ViUM.js">
    <link rel="preload" as="fetch" crossorigin="anonymous" href="https://data.ourhike.org/trails_overview.geojson">
  <link rel="manifest" href="/app/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/app/registerSW.js"></script></head>
  <body>
    <div id="viewer">
      <header id="viewer-bar">
        <strong>OurHike artifact viewer</strong>
        <input id="viewer-files" type="file" accept=".pmtiles" multiple />
        <span id="viewer-status">
          Drop .pmtiles archives here — basemap, DEM, and raster sheets are recognised
          automatically.
        </span>
      </header>
      <div id="viewer-map"></div>
    </div>
  </body>
</html>
