# GENERATED by pipeline/make_dbt_staging.py from sources.json
# and the extract's club folders; edit them or it, never this file.
version: 2

sources:
  - name: bartram
    description: >
      The layers sources.json registers for the extract's bartram/ folder
      (pipeline/extract/bartram/) that pipeline/make_dbt_staging.py stages, landed as
      raw_bartram__<key> and staged once each by a generated base model here. Descriptions
      transcribed from sources.json's titles and key notes.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      meta:
        cadence: monthly
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_bartram__bartram_trail_map
        data_tests:
          # Rows sharing base_bartram__bartram_trail_map's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'bartram_trail_map'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))", "description"]
                row_id_columns: ["objectid", "fid", "ogc_fid", "_dlt_id", "_socrata_id", "feature_index", "feature_id"]
        description: >
          Bartram Trail: sites, markers, properties and routes (Bartram Trail Conference's
          Google My Map) (sources.json `bartram_trail_map`). Key: The geometry with
          `description`: unique on 245 of 245 (measured 2026-10-04 on the live export).
          The geometry alone is 210 of 245, because 35 'Markers' placemarks carry no
          geometry at all and differ only in their text.
      - name: raw_bartram__bartram_trail_markers_map
        data_tests:
          # Rows sharing base_bartram__bartram_trail_markers_map's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'bartram_trail_markers_map'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
                row_id_columns: ["objectid", "fid", "ogc_fid", "_dlt_id", "_socrata_id", "feature_index", "feature_id"]
        description: >
          Bartram Trail Markers (Bartram Trail Conference's Google My Map) (sources.json
          `bartram_trail_markers_map`). Key: The geometry alone: unique on 127 of 127
          (measured 2026-10-04 on the live export). `name` is 70 of 127.
      - name: raw_bartram__brbtc_section_trailheads
        data_tests:
          # Rows sharing base_bartram__brbtc_section_trailheads's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'brbtc_section_trailheads'", "section"]
        description: >
          Bartram Trail section trailheads (Blue Ridge Bartram Trail Conservancy's 13
          section pages) (sources.json `brbtc_section_trailheads`). Key: `section`, the
          page's own section number, 1 to 13: unique on 13 of 13 (measured 2026-10-04 on
          the live pages, parsed as extract/_pages_points.py parses them). `name` and the
          geometry are 13 of 13 too.
