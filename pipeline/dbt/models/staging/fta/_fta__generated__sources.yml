# GENERATED by pipeline/make_dbt_staging.py from sources.json
# and the extract's club folders; edit them or it, never this file.
version: 2

sources:
  - name: fta
    description: >
      The layers sources.json registers for the extract's fta/ folder (pipeline/extract/fta/)
      that pipeline/make_dbt_staging.py stages, landed as raw_fta__<key> and staged once each
      by a generated base model here. Descriptions transcribed from sources.json's titles and
      key notes.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      meta:
        cadence: monthly
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_fta__fta_campsites
        data_tests:
          # Rows sharing base_fta__fta_campsites's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'fta_campsites'", "globalid"]
        description: >
          Florida Trail campsites (FTA's own layer) (sources.json `fta_campsites`). Key:
          the registry's `id_field`; its row records no measurement of it.
      - name: raw_fta__fta_day_hikes
        data_tests:
          # Rows sharing base_fta__fta_day_hikes's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'fta_day_hikes'", "section", "name"]
        description: >
          FTA Day & Section Hike: Grab-and-Go and other trail hikes (floridatrail.org/day-
          hike/) (sources.json `fta_day_hikes`). Key: The map and the hike's name
          (`section`, `name`): unique on all 46 rows read 2026-10-04. The name alone is
          not: Big Oak Trail is on both maps.
      - name: raw_fta__fta_gateway_communities
        data_tests:
          # Rows sharing base_fta__fta_gateway_communities's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'fta_gateway_communities'", "globalid"]
        description: >
          Florida Trail gateway communities (sources.json `fta_gateway_communities`). Key:
          `GlobalID` is unique and non-null on all 17 rows read 2026-10-03.
      - name: raw_fta__fta_managed_conservation_areas
        data_tests:
          # Rows sharing base_fta__fta_managed_conservation_areas's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'fta_managed_conservation_areas'", "globalid"]
        description: >
          Managed Conservation Areas along the Florida Trail (sources.json
          `fta_managed_conservation_areas`). Key: `GlobalID` is unique and non-null on all
          103 rows read 2026-10-03.
      - name: raw_fta__fta_trailheads
        data_tests:
          # Rows sharing base_fta__fta_trailheads's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'fta_trailheads'", "globalid"]
        description: >
          Florida Trail trailheads (FTA's own layer) (sources.json `fta_trailheads`). Key:
          the registry's `id_field`; its row records no measurement of it.
