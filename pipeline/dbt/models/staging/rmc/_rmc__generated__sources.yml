# GENERATED by pipeline/make_dbt_staging.py from sources.json
# and the extract's club folders; edit them or it, never this file.
version: 2

sources:
  - name: rmc
    description: >
      The layers sources.json registers for the extract's rmc/ folder (pipeline/extract/rmc/)
      that pipeline/make_dbt_staging.py stages, landed as raw_rmc__<key> and staged once each
      by a generated base model here. Descriptions transcribed from sources.json's titles and
      key notes.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      meta:
        cadence: monthly
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_rmc__rmc_recommended_hikes
        data_tests:
          # Rows sharing base_rmc__rmc_recommended_hikes's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'rmc_recommended_hikes'", "section", "name"]
        description: >
          Randolph Mountain Club Recommended Hikes (Recommended-Hikes-1.pdf) (sources.json
          `rmc_recommended_hikes`). Key: The walk's group heading and its name (`section`,
          `name`): unique on all 47 rows read 2026-10-04, and the names alone are unique
          too; the pair is kept because a peak route is named by its trails, and the same
          trails climb more than one peak (Lowe's Path is Adams's route and the first leg
          of one of Jefferson's).
