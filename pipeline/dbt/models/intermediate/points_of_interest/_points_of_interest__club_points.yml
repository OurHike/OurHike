  - name: season_cautions_mark_a_plumbed_tap_unconfirmed_with_a_season_caution
    model: int_points_of_interest__cautioned
    description: >
      Decision 65 (the maintainer's poll of 2026-10-04): a tap or fountain whose layer records no
      shutoff season is shown as unconfirmed water with a season caution. NPS's 'Potable Water' and
      NY Parks' 'Water Spigot' carry 'no_shutoff_season' and go low whatever their layer rated them,
      matched trimmed and case-folded as every layer rule is; CPW's tap whose own winter status reads
      'Open' is still plumbed (and so still low) but carries no caution, while its 'Unknown' one does.
      A spring in the same layer, and a tap-shaped value on a row that is not water, pass through
      with their own confidence and no caution: every described row comes out.
    given:
      - input: ref('int_points_of_interest__described')
        rows:
          - {poi_id: 'nps_points_of_interest:g-1', source_key: 'nps_points_of_interest', poi_type: 'water', confidence: 'high', properties: '{"poitype": "Potable Water"}'}
          - {poi_id: 'nps_points_of_interest:g-2', source_key: 'nps_points_of_interest', poi_type: 'water', confidence: 'low', properties: '{"poitype": "Spring"}'}
          - {poi_id: 'oprhp_facilities:18', source_key: 'oprhp_facilities', poi_type: 'water', confidence: 'high', properties: '{"sub_asset": " water spigot "}'}
          - {poi_id: 'cpw_facilities:{C-1}', source_key: 'cpw_facilities', poi_type: 'water', confidence: 'high', properties: '{"d_fac_type": "Drinking Water", "d_winter_s": "Open"}'}
          - {poi_id: 'cpw_facilities:{C-2}', source_key: 'cpw_facilities', poi_type: 'water', confidence: 'high', properties: '{"d_fac_type": "Drinking Water", "d_winter_s": "Unknown"}'}
          - {poi_id: 'cpw_facilities:{C-3}', source_key: 'cpw_facilities', poi_type: 'privy', confidence: 'high', properties: '{"d_fac_type": "Drinking Water", "d_winter_s": "Unknown"}'}
      - input: ref('layer_rules')
        rows:
          - {source_key: 'nps_points_of_interest', rule: 'plumbed_water', field: 'poitype', matches: 'Potable Water', evidence: 'a tap'}
          - {source_key: 'oprhp_facilities', rule: 'plumbed_water', field: 'sub_asset', matches: 'Water Spigot', evidence: 'a spigot'}
          - {source_key: 'cpw_facilities', rule: 'plumbed_water', field: 'd_fac_type', matches: 'Drinking Water', evidence: 'a tap'}
          - {source_key: 'cpw_facilities', rule: 'open_in_winter', field: 'd_winter_s', matches: 'Open', evidence: 'open in winter'}
          - {source_key: 'nps_points_of_interest', rule: 'not_water', field: 'poitype', matches: 'Water Access', evidence: 'a boat launch'}
    expect:
      rows:
        - {poi_id: 'nps_points_of_interest:g-1', confidence: 'low', water_caution: 'no_shutoff_season'}
        - {poi_id: 'nps_points_of_interest:g-2', confidence: 'low', water_caution: null}
        - {poi_id: 'oprhp_facilities:18', confidence: 'low', water_caution: 'no_shutoff_season'}
        - {poi_id: 'cpw_facilities:{C-1}', confidence: 'low', water_caution: null}
        - {poi_id: 'cpw_facilities:{C-2}', confidence: 'low', water_caution: 'no_shutoff_season'}
        - {poi_id: 'cpw_facilities:{C-3}', confidence: 'high', water_caution: null}
