version: 2

models:
  - name: base_massgis__long_distance_trails
    data_tests:
      # Warns when the dedupe dropped any row, each an exact copy
      # (duplicates_are_exact on the raw table), and is an error once the
      # copies are half the raw table (the generic test's).
      - equal_rowcount_to_raw:
          arguments:
            compare_model: source('massgis', 'raw_massgis__massgis_long_distance_trails')
    description: >
      Massachusetts long-distance trails (MassGIS), every row, keyed and
      deduped. Nothing reads it yet: the stage-3 unions of #1793 do.
    columns:
      - name: trail_segment_key
        description: >
          The row's key: dbt_utils.generate_surrogate_key over
          massgis_long_distance_trails, globalid, the registry key first and
          then the columns measured unique for this layer.
        data_tests: [not_null, unique]
