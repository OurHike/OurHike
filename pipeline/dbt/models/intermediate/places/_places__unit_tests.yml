  - name: places_an_a_t_side_trail_measures_nothing_as_today
    model: int_places__lines
    description: >
      PL06 as export_places.py runs it today, which no case of
      tests/test_export_places.py states: load_lines() keeps
      shipped_line_source_keys() and the centerline, and side_trails is
      neither, so a side trail or spur in trails.geojson measures nothing. A
      finding, not a rule anyone wrote down (int_places__lines' header); pinned
      so that changing it is a decision.
    given:
      - input: ref('trail_lines')
        rows:
          - {"trail_line_id": "centerline:chain:0", "club": "atc", "source_key": "centerline", "_loaded_at": "2026-10-02 00:00:00+00", "line_kind": "centerline", "name": null, "geom_geojson": "{\"type\": \"LineString\", \"coordinates\": [[-74.0, 41.0], [-73.9616, 41.0]]}"}
          - {"trail_line_id": "side_trails:s1", "club": "atc", "source_key": "side_trails", "_loaded_at": "2026-10-02 00:00:00+00", "line_kind": "side_trail", "name": "Blue Blaze Spur", "geom_geojson": "{\"type\": \"LineString\", \"coordinates\": [[-74.0, 41.01447], [-73.9808, 41.01447]]}"}
          - {"trail_line_id": "side_trails:s2", "club": "atc", "source_key": "side_trails", "_loaded_at": "2026-10-02 00:00:00+00", "line_kind": "spur", "name": "To The Shelter", "geom_geojson": "{\"type\": \"LineString\", \"coordinates\": [[-74.0, 41.02894], [-73.9808, 41.02894]]}"}
      - input: ref('int_sources__publication')
        rows:
          - {"source_key": "centerline", "may_publish": true}
          - {"source_key": "side_trails", "may_publish": true}
      - input: ref('stg_registry__sources')
        rows:
          - {"source_key": "centerline", "file_row": 0, "provider": "ATC", "entry": "{\"key\": \"centerline\", \"provider\": \"ATC\", \"owns_route_names\": [\"Appalachian Trail\"]}"}
          - {"source_key": "side_trails", "file_row": 1, "provider": "ATC", "entry": "{\"key\": \"side_trails\", \"provider\": \"ATC\", \"blaze_field\": \"Blaze\"}"}
    expect:
      rows:
        - {"trail_line_id": "centerline:chain:0", "source_key": "centerline", "name": null, "trail_name": "Appalachian Trail"}
  - name: places_waypoints_are_the_four_files_load_point_places_reads_in_its_order
    model: int_places__waypoints
    description: >
      PL05's input, which no case of tests/test_export_places.py states because
      the Python reads files: load_point_places() reads poi_trailhead.geojson,
      poi_parking.geojson and poi_resupply.geojson in POINT_PLACE_KINDS order,
      each in record order, then nearby_poi.geojson, and never
      retired_poi.geojson or another type. A poi_<type>.geojson row's lon and
      lat are what GDAL prints (-73.99000000000001 is read back as -73.99) and
      a nearby_poi row's the double. dbt compares a DOUBLE to one decimal, so
      tests/test_dbt_places_parity.py holds the lon and lat below to GDAL
      exactly, writing these rows with export_poi.py's own write_poi_type().
    given:
