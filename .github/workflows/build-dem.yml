# Builds the offline DEM archive - the terrain half of the offline map
# program (pipeline/BASEMAP.md, issues #184/#186/#198), sibling to
# build-basemap.yml.
#
# Lighter than the basemap build despite fetching ~20k tiles: there is no
# Java and no big intermediates - tiles stream from the AWS Open Data bucket
# through quantize+re-encode straight into the archive, so peak disk is the
# output itself (measured 397.6 MB at z13, 1 m quantization; ~1.6x that at
# the 0.5 m default, per #186's banding check).
#
# Publishing is opt-in and twice-guarded, the same posture as
# publish-vector-data.yml and build-raster.yml: the `publish` input defaults
# to false, only the publish job holds R2 credentials, and it refuses any
# run that is not the canonical archive shape. This is today's flat-key
# publish mechanism (publish.py + latest.json) - DATA_RELEASES.md's
# immutable release folders remain the destination once that machinery
# exists, exactly as for every other artifact.
#
# The --limit guard is load-bearing, not decorative: the tile walk is driven
# by a region polygon, and a mis-drawn region would otherwise queue the
# planet. The tapered corridor at z0-13 is 8,658 tiles (measured, run
# 33065213666) where the uniform 30-mile one was ~21.8k; the default limit
# leaves room above either without permitting a runaway.

name: Build DEM archive

on:
  workflow_dispatch:
    inputs:
      max_zoom:
        description: "DEM pyramid depth (13 = source saturation; see export_dem.py)"
        type: string
        default: "13"
      quantize_step:
        description: "Vertical floor in meters (0.5 per #186's banding check; 1.0 bands under overzoom)"
        type: string
        default: "0.5"
      tile_limit:
        description: "Refuse to fetch more tiles than this"
        type: string
        default: "30000"
      variant:
        description: "canonical = dem.pmtiles; light = dem_light.pmtiles at a harder taper (#1088)"
        type: choice
        options: [canonical, light]
        default: canonical
      publish:
        description: "Upload to R2. Only canonical builds (z0-13, 0.5 m) are allowed through."
        type: boolean
        default: false
      data_environment:
        description: "Which environment's data this becomes. UA first; production is the promotion."
        type: choice
        options: [ua, production, dev]
        default: ua

concurrency:
  group: build-dem
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Runner capacity
        run: |
          echo "disk:"; df -h /
          echo "cpus: $(nproc)"
          echo "memory:"; free -g

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Warm the DuckDB spatial extension
        run: python -c "import duckdb; duckdb.connect().execute('INSTALL spatial; LOAD spatial;')"

      # centerline.geojson, which the corridor region is built from.
      - name: Fetch ArcGIS sources
        run: python fetch_all.py

      - name: Build the DEM archive
        run: |
          python export_dem.py \
            --variant "${{ inputs.variant }}" \
            --max-zoom "${{ inputs.max_zoom }}" \
            --quantize-step "${{ inputs.quantize_step }}" \
            --limit "${{ inputs.tile_limit }}"

      # The exporter tolerates a tile the source bucket lacks; shipping must
      # not. Runs on every build, not only publishing ones, so a measure run
      # that would have been refused says so while it is cheap to rerun.
      - name: Verify the archive is shippable
        run: |
          python check_dem_archive.py \
            --archive "data/processed/${{ inputs.variant == 'light' && 'dem_light.pmtiles' || 'dem.pmtiles' }}" \
            --max-zoom "${{ inputs.max_zoom }}"

      # To the log AND the summary: a number that exists only in a rendered
      # summary cannot be quoted by anything reading the logs later.
      - name: Measure
        # `shell: bash` for `-o pipefail`: `| tee` below would otherwise take
        # this step's exit status from `tee`, so a crashed measurement would
        # report success on a build that produced nothing (#514).
        shell: bash
        run: |
          ARCHIVE="data/processed/${{ inputs.variant == 'light' && 'dem_light.pmtiles' || 'dem.pmtiles' }}"
          python -c "
          import sys
          from pathlib import Path
          from export_basemap import report_archive
          report_archive(Path(sys.argv[1]))
          " "$ARCHIVE" | tee measure.txt
          {
            echo "## DEM build (${{ inputs.variant }}, quantize ${{ inputs.quantize_step }} m, z0-${{ inputs.max_zoom }})"
            echo '```'
            cat measure.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          df -h /

      # The DEM's 1-degree coverage cells (#1175) - and, via the shared
      # context archive, the context-zoom mechanism #552 notes the DEM never
      # had. Replaces the 50-mile stretch cut (#556), whose unit the
      # maintainer's #552 decision superseded on 2026-08-25; it needs neither
      # the centerline nor the half-mile markers the axis calibration read.
      #
      # CANONICAL ONLY, and this condition is load-bearing rather than a
      # saving: cut_cells writes `dem_cell_<name>.pmtiles` from the family
      # name, so a light build running it would overwrite the canonical cells
      # with light ones under the canonical keys - a quieter version of the
      # wrong-bytes-behind-the-right-name failure the publish gate below
      # exists to prevent. A light cell set needs its own family before it
      # can be cut at all.
      - name: Cut the coverage cells from the archive
        if: inputs.variant == 'canonical'
        run: |
          python cut_cells.py data/processed/dem.pmtiles \
            --family dem

      - uses: actions/upload-artifact@v4
        with:
          name: dem-archive-${{ inputs.variant }}
          path: |
            pipeline/data/processed/dem.pmtiles
            pipeline/data/processed/dem_light.pmtiles
            pipeline/data/processed/dem_cell_*.pmtiles
            pipeline/data/processed/dem_context.pmtiles
            pipeline/data/processed/dem_cells.json
            pipeline/data/processed/dem_cells_manifest.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: production
    # Every writer of latest.json shares this group: publish() does a
    # read-modify-write of the manifest, and two concurrent publishes could
    # interleave and clobber each other's entries.
    concurrency:
      group: publish-data
      cancel-in-progress: false
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      # The client's DEM packages declare a shape each (z0-13, 0.5 m quantize,
      # measured size). Publishing any other build would silently hand every
      # hiker a different archive than the one those numbers describe - a
      # spike stays a spike, so a non-canonical publish fails loudly rather
      # than being quietly skipped.
      #
      # THE VARIANT IS NOT CHECKED HERE and does not need to be: it is a
      # `choice` input, so only names export_dem.VARIANTS knows can be passed,
      # and each maps to its own published key. What this step still guards is
      # the two dimensions a hiker's advertised size depends on and which are
      # free-text - the pyramid depth and the quantize step - either of which
      # would put different bytes behind an unchanged key.
      #
      # What it deliberately does NOT check is the corridor taper, because the
      # archive declares its own (export_dem's `corridor_taper_miles` metadata)
      # and check_dem_archive.py in the build job has already held it to that.
      - name: Refuse a non-canonical shape
        if: inputs.max_zoom != '13' || inputs.quantize_step != '0.5'
        working-directory: .
        run: |
          echo "::error::publish is only for a canonical DEM (z0-13, 0.5 m quantize); this run built z0-${{ inputs.max_zoom }} at ${{ inputs.quantize_step }} m"
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A separate job from build on purpose, mirroring build-raster.yml:
      # publish.py hashes archives from PROCESSED_DIR at publish time rather
      # than reading a baked manifest, so nothing depends on this being the
      # runner that produced them - and the build job never holds a secret.
      - uses: actions/download-artifact@v4
        with:
          name: dem-archive-${{ inputs.variant }}
          path: pipeline/data/processed/

      - name: What will be published
        run: ls -la data/processed/

      - name: Publish to R2
        env:
          # The gate publish.py checks. Set only on this step, so every other
          # step in this workflow is structurally incapable of writing to the
          # bucket - see publish.py's writes_enabled().
          R2_WRITE_ENABLED: "true"
          # Which environment's data this becomes. publish.py scopes every
          # key by it and refuses to run without one, so a build cannot reach
          # production's keys by omission (features/DATA_ENVIRONMENTS.md).
          OURHIKE_DATA_ENV: ${{ inputs.data_environment }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python publish.py
