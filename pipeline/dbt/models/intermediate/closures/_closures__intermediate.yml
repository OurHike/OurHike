  - name: int_closures__work_projects_checked_refuses_the_files_own_problems
    description: >
      file_problems()'s two checks of the file itself, on one row with no
      work project: a `rows` that is not a list, and the retired
      `ua_sample_rows` (maintainer decision 2026-09-09), in that order.
    model: int_closures__work_projects_checked
    given:
      - input: ref('base_ourhike__work_projects')
        rows:
          - {work_projects_document_key: d1, document_json: '{"reviewed_at": "2026-10-02", "rows": {"w00": {"id": "nynjtc:2026-10-10-bear-mtn", "club_name": "NY-NJ Trail Conference", "title": "Bear Mountain trail day", "description": "Bring gloves; meet at the Inn lot.", "lat": 41.312, "lon": -73.9884, "mile": 1403.2, "starts_on": "2026-10-10", "ends_on": "2026-10-10", "status": "upcoming", "capacity": 12, "signup_mode": "contact", "signup_contact": "mailto:volunteers@example.org"}}, "ua_sample_rows": []}'}
    expect:
      rows:
        - {row_position: null, problem: 'rows must be a list (empty is fine - that is the file''s honest state today) | ua_sample_rows is retired (maintainer decision 2026-09-09): no invented workday may reach a hiker in ANY environment, so `rows` is the only list. Move a real club''s row into `rows`, or delete the key', published_row: null, is_reviewed: true}

