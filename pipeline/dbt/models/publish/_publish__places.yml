version: 2

# The places family's phone file (stage 3 of #1793 — Rebuild the data
# platform as dlt → dbt: seven contracted marts, a monthly refresh, published
# docs, and lighter phone downloads): places.json, which export_places.py
# writes today. parity.py compares the dbt-written file with the Python's.
models:
  - name: pub_places
    description: >
      Writes places.json from the places mart: one row, the whole document
      as JSON text, which the phone_file materialisation's json_document
      format copies to processed_dir/places.json verbatim. A record leaves
      out a field it has no value for, which COPY's JSON format cannot do.
      parity.py compares it with export_places.py's file record by record,
      keyed on `id`, in order.
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: places_document
        description: >
          places.json: `generated_at`, `trailRadiusMiles`,
          `trailMilesMeasured` and `places`, each record in _record()'s
          field order with its empty fields left out.
        data_type: varchar
        data_tests: [not_null, unique]

exposures:
  - name: places_json
    label: places.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      The places a hiker can name before anything is downloaded: parks,
      towns, trailheads, parking areas and the long trails, each with a
      point, a box where it has one, and the miles of published trail it
      holds. First run's "where do you hike?" step reads it
      (client/src/lib/places.ts, PLACES_KEY in client/src/lib/config.ts), and
      its answer becomes the map's fallback centre whenever GPS has no fix.
      Published in the release folder by publish-vector-data.yml from
      export_places.py's file until stage 4 of #1793 moves it to this
      writer's.
    depends_on:
      - ref('places')
      - ref('pub_places')
    config:
      meta:
        r2_keys: [places.json]
        format: json
        cadence: monthly

# The writer's unit tests, one per case of tests/test_export_places.py whose rule is the
# document's shape. tests/test_dbt_places_parity.py builds each expected document
# from the same rows with export_places.py's own _record().
unit_tests:
  - name: places_rows_carry_no_nulls_and_no_working_state
    model: pub_places
    description: >
      Mirrors
      tests/test_export_places.py::TestTheDocument::test_rows_carry_no_nulls_and_no_working_state.
    overrides:
      vars:
        places_trail_radius_miles: 5.0
      macros:
        python_run_stamp: "'2026-09-10T12:00:00Z'"
    given:
      - input: ref('places')
        format: sql
        rows: |
          select
              place_id,
              cast(place_order as bigint) as place_order,
              kind,
              name,
              poi_id,
              category,
              state,
              within_park,
              cast(lon as double) as lon,
              cast(lat as double) as lat,
              cast(bbox as double[]) as bbox,
              cast(trail_miles as double) as trail_miles,
              trail_miles_measured,
              source,
              club,
              source_key,
              cast(_loaded_at as timestamptz) as _loaded_at
          from (values
              ('oprhp_park_polygons:g1', 1, 'park', 'Pine State Park', null, 'State Park', 'NY', null, -73.9808, 41.01447, [-74.0, 41.0, -73.9616, 41.02894], 0.7, true, 'oprhp_park_polygons', 'nysparks', 'oprhp_park_polygons', '2026-10-02 00:00:00+00'),
              ('oprhp_facilities:7', 2, 'trailhead', 'Reeves Meadow', 'oprhp_facilities:7', null, 'NY', 'Pine State Park', -74.0, 41.0, null, 0.7, true, 'oprhp_facilities', 'nysparks', 'oprhp_facilities', '2026-10-02 00:00:00+00'),
              ('usfs_rec_sites:9', 3, 'parking', 'Lot With No State', 'usfs_rec_sites:9', null, null, null, -74.0, 41.0, null, 0.0, true, 'usfs_rec_sites', 'nysparks', 'usfs_rec_sites', '2026-10-02 00:00:00+00')
          ) as places (place_id, place_order, kind, name, poi_id, category, state, within_park, lon, lat, bbox, trail_miles, trail_miles_measured, source, club, source_key, _loaded_at)
      - input: ref('int_places__lines')
        rows:
          - {"trail_line_id": "oprhp_trails:anchor"}
    expect:
      rows:
        - {"places_document": "{\"generated_at\":\"2026-09-10T12:00:00Z\",\"trailRadiusMiles\":5.0,\"trailMilesMeasured\":true,\"places\":[{\"id\":\"oprhp_park_polygons:g1\",\"name\":\"Pine State Park\",\"kind\":\"park\",\"category\":\"State Park\",\"state\":\"NY\",\"lon\":-73.9808,\"lat\":41.01447,\"bbox\":[-74.0,41.0,-73.9616,41.02894],\"trailMiles\":0.7,\"source\":\"oprhp_park_polygons\"},{\"id\":\"oprhp_facilities:7\",\"poiId\":\"oprhp_facilities:7\",\"name\":\"Reeves Meadow\",\"kind\":\"trailhead\",\"state\":\"NY\",\"within\":\"Pine State Park\",\"lon\":-74.0,\"lat\":41.0,\"trailMiles\":0.7,\"source\":\"oprhp_facilities\"},{\"id\":\"usfs_rec_sites:9\",\"poiId\":\"usfs_rec_sites:9\",\"name\":\"Lot With No State\",\"kind\":\"parking\",\"lon\":-74.0,\"lat\":41.0,\"trailMiles\":0.0,\"source\":\"usfs_rec_sites\"}]}"}
  - name: places_the_radius_is_published_beside_the_figures_it_bounds
    model: pub_places
    description: >
      Mirrors
      tests/test_export_places.py::TestTheDocument::test_the_radius_is_published_beside_the_figures_it_bounds.
    overrides:
      vars:
        places_trail_radius_miles: 3.0
      macros:
        python_run_stamp: "'2026-09-10T12:00:00Z'"
    given:
      - input: ref('places')
        rows: []
      - input: ref('int_places__lines')
        rows: []
    expect:
      rows:
        - {"places_document": "{\"generated_at\":\"2026-09-10T12:00:00Z\",\"trailRadiusMiles\":3.0,\"trailMilesMeasured\":false,\"places\":[]}"}
  - name: places_a_missing_line_artifact_reads_as_no_lines_not_as_a_failure
    model: pub_places
    description: >
      Mirrors
      tests/test_export_places.py::TestNoLinesAtAll::test_a_missing_line_artifact_reads_as_no_lines_not_as_a_failure.
    overrides:
      vars:
        places_trail_radius_miles: 5.0
      macros:
        python_run_stamp: "'2026-09-10T12:00:00Z'"
    given:
      - input: ref('places')
        rows: []
      - input: ref('int_places__lines')
        rows: []
    expect:
      rows:
        - {"places_document": "{\"generated_at\":\"2026-09-10T12:00:00Z\",\"trailRadiusMiles\":5.0,\"trailMilesMeasured\":false,\"places\":[]}"}
