  - name: int_suggested_hikes__graded_checks_a_published_track_as_published_route_checks
    description: >
      published_route()'s checks over a published track: reported as fair,
      never rejected for its length, because the track is the publisher's own
      drawing; and a page that calls the walk a loop whose track does not
      close. tests/test_dbt_suggested_hikes_parity.py runs published_route()
      over the same rows.
    model: int_suggested_hikes__graded
    given:
      - input: ref('stg_derived__formed_routes')
        rows:
          # a track that agrees with the page
          - {hike_number: 201, provenance: 'published', formed_problem: null, route_miles: 4.0, route_closed: false, track_gap_m: 850.0}
          # no stated length: reported, never rejected
          - {hike_number: 202, provenance: 'published', formed_problem: null, route_miles: 4.0, route_closed: false, track_gap_m: 850.0}
          # 25% over, past LENGTH_GOOD 0.20
          - {hike_number: 203, provenance: 'published', formed_problem: null, route_miles: 5.0, route_closed: false, track_gap_m: 850.0}
          # exactly 20% over is not past it
          - {hike_number: 204, provenance: 'published', formed_problem: null, route_miles: 6.0, route_closed: false, track_gap_m: 850.0}
          # 50% over, past LENGTH_FAIR 0.40: the publisher's own two figures disagree
          - {hike_number: 205, provenance: 'published', formed_problem: null, route_miles: 6.0, route_closed: false, track_gap_m: 850.0}
          # a page that calls it a loop whose track does not close
          - {hike_number: 206, provenance: 'published', formed_problem: null, route_miles: 4.0, route_closed: false, track_gap_m: 812.4}
          # a loop whose track closes
          - {hike_number: 207, provenance: 'published', formed_problem: null, route_miles: 4.0, route_closed: true, track_gap_m: 12.0}
          # the route type is read stripped, and printed as the page wrote it
          - {hike_number: 208, provenance: 'published', formed_problem: null, route_miles: 4.0, route_closed: false, track_gap_m: 300.0}
          # 3.75 prints as 3.8, half to even
          - {hike_number: 209, provenance: 'published', formed_problem: null, route_miles: 3.75, route_closed: false, track_gap_m: 850.0}
          # both checks at once, in published_route()'s order
          - {hike_number: 210, provenance: 'published', formed_problem: null, route_miles: 6.0, route_closed: false, track_gap_m: 1500.0}
          # a GPX of fewer than two points is rejected, its one note measure_published()'s
          - {hike_number: 211, provenance: 'published', formed_problem: 'the published GPX holds fewer than two points, so it is not a route', route_miles: null, route_closed: null, track_gap_m: null}
          # a stated length of 0 is none
          - {hike_number: 212, provenance: 'published', formed_problem: null, route_miles: 4.0, route_closed: false, track_gap_m: 850.0}
          # an open route type is never told it should close
          - {hike_number: 213, provenance: 'published', formed_problem: null, route_miles: 4.0, route_closed: false, track_gap_m: 850.0}
      - input: ref('int_suggested_hikes__hike_finder')
        rows:
          - {hike_number: 201, name: 'Hike 201', stated_miles: 4.0, route_type: 'Shuttle'}
          - {hike_number: 202, name: 'Hike 202', stated_miles: null, route_type: 'Shuttle'}
