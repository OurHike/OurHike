version: 2

models:
  - name: base_nc_mst__trail
    data_tests:
      # Warns when the dedupe dropped any row, each an exact copy
      # (duplicates_are_exact on the raw table), and is an error once the
      # copies are half the raw table (decision 204, the generic test's).
      - equal_rowcount_to_raw:
          arguments:
            compare_model: source('nc_mst', 'raw_nc_mst__nc_mst_trail')
    description: >
      Mountains-to-Sea Trail (NC state-published layer), every row, keyed and
      deduped. Nothing reads it yet: the stage-3 unions of #1793 do.
    columns:
      - name: trail_segment_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          nc_mst_trail, trailname, geometry_key(geom), the registry key first
          and then the columns measured unique for this layer.
        data_tests: [not_null, unique]
