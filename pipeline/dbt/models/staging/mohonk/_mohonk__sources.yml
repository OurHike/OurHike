version: 2

sources:
  - name: mohonk
    description: >
      Mohonk Preserve's public trails-and-carriage-roads extract on their own
      ArcGIS org, landed by the extract's mohonk/ folder
      (pipeline/extract/mohonk/). Transcribed from sources.json's measured
      notes.
    schema: raw
    config:
      # When the extract last read each table or confirmed it unchanged, from
      # its run log, never `_loaded_at` (decision 203): make_dbt_staging.py's
      # LOADED_AT_QUERY and MONTHLY_FRESHNESS_DAYS say why, and
      # tests/test_source_freshness.py holds every monthly source to them.
      loaded_at_query: "{{ last_read_or_confirmed_at(this) }}"
      freshness:
        warn_after: {count: 35, period: day}
        error_after: {count: 62, period: day}
    tables:
      - name: raw_mohonk__mohonk_trails
        data_tests:
          # Rows sharing stg_mohonk__trails's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'mohonk_trails'", "globalid"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks(), decision 102), each at warn.
          - elementary.volume_anomalies:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          Mohonk Preserve Trails and Carriage Roads (sources.json: discovered
          2026-08-25). 304 polyline segments, measured live that day via
          returnCountOnly. ALREADY A FILTERED VIEW - the layer's own
          definitionQuery keeps only General_Classification 'Carriage Road'
          or 'Trail' with Manager 'Mohonk Preserve' - so this is Mohonk's
          curated public extract rather than their internal dataset.
          editingInfo.dataLastEditDate read 2026-08-24, the day before
          registration, while the AGOL item's own container metadata last
          changed 2025-07-28: a read of the item alone would have missed how
          current the layer is.
        columns:
          - name: Blaze
            description: >
              A genuine coded field, unlike NYNJTC's plain string and unlike
              the Highlands Trail's absent one. Values present on the fetched
              304 rows - not the domain's declared possibilities - are N/A
              124, Blue 61, Red 49, Other 33, Yellow 30, plus 7 rows with no
              value at all. No accepted_values test, for the same reason
              stg_atc__side_trails has none: the domain is the finding.
          - name: Name
            description: The segment's name as Mohonk publishes it.
