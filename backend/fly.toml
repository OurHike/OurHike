# Fly.io app config for the OurHike backend.
#
# `app` below is a placeholder - `fly launch`/`fly apps create` will need a
# real, globally-unique name chosen at deploy time; update this file to
# match once that's picked.
app = "ourhike-backend"
primary_region = "iad"  # US East (Ashburn, VA) - closest major Fly region to the AT's own GA-to-ME corridor

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  # Deliberately keeps at least one machine running rather than scaling to
  # zero: this is exactly the Render-free-tier "cold start after idle"
  # problem LAUNCH_CHECKLIST.md flagged as the reason to prefer Fly.io in
  # the first place - defeating it by also scaling to zero here would
  # undo that choice. Small, real ongoing cost (a shared-cpu-1x/256mb
  # machine, roughly a few dollars a month) traded for no surprise
  # latency on a safety-adjacent app. Revisit if that cost matters more
  # than the latency once there's real usage to weigh it against.
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[env]
  PORT = "8000"
