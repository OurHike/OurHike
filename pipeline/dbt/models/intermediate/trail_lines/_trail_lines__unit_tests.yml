version: 2

# tl-at's unit tests for the trail_lines family's A.T. models (stage 3 of
# #1793 — Rebuild the data platform as dlt → dbt: seven contracted marts, a
# monthly refresh, published docs, and lighter phone downloads). Each test
# names the pytest cases it holds the SQL to, one row per case where the
# model's rows are independent, keyed `<pytest file>::<case>`, and one test
# per case where they are not (a club's runs, a chain's number). Rows keyed
# `sql::` pin a behaviour no pytest names.
#
# THE EXPECTED ROWS ARE THE PYTHON'S. tests/test_dbt_trail_lines_parity.py
# runs today's functions (lib/feature_id.py, export_trails.py,
# lib/spurs.py, export_spurs.py, lib/club_sections.py,
# export_nearby_trails._rounded_geometry) over each test's given rows and
# fails where an expected row is not their answer; dbt then holds the SQL to
# the same rows. A dbt 2.0.6 unit test compares a DOUBLE only to one decimal
# place (int_trail_lines__mile_axis_calibration's header), so the figures
# that must agree exactly travel as WKT or JSON text.
unit_tests:
  - name: int_trail_lines__at_features_answers_what_resolve_feature_id_answers
    description: >
      lib/feature_id.resolve_feature_id() (TL05) and the line-only rule (TL04),
      one row per pytest case, keyed `<pytest file>::<case>` in
      trail_segment_key; rows keyed `sql::` pin a behaviour no pytest names.
      The OBJECTID stands in for the feature's GeoJSON `id`, which ArcGIS
      serves equal to it (stg_atc__side_trails says where that was measured),
      and the centerline takes no OBJECTID step: its segment ids are never
      published. tests/test_dbt_trail_lines_parity.py runs resolve_feature_id()
      over the same rows.
    model: int_trail_lines__at_features
    given:
      - input: ref('int_trail_lines__at_sources')
        rows:
          - {source_key: "centerline", file_row: 3}
          - {source_key: "side_trails", file_row: 4}
      - input: ref('int_trail_lines__blazes')
        rows:
          - {trail_segment_key: "test_export_trails::test_export_trails_keeps_a_multilinestring_feature_instead_of_silently_dropping_it", blaze_color: "White"}
          - {trail_segment_key: "sql::a_centerline_segment_with_no_globalid_takes_its_place_in_the_layer", blaze_color: "White"}
          - {trail_segment_key: "test_lib_feature_id::test_globalid_wins_when_present", blaze_color: "Blue"}
          - {trail_segment_key: "test_lib_feature_id::test_an_explicit_null_globalid_falls_back_to_the_features_own_id", blaze_color: "Blue"}
          - {trail_segment_key: "test_lib_feature_id::test_a_falsy_but_real_globalid_is_kept_verbatim", blaze_color: "Blue"}
          - {trail_segment_key: "test_lib_feature_id::test_both_absent_substitutes_a_positional_id_and_warns", blaze_color: "Blue"}
          - {trail_segment_key: "test_lib_feature_id::test_the_synthetic_id_is_unique_within_a_source", blaze_color: "Blue"}
          - {trail_segment_key: "test_export_trails::test_export_trails_falls_back_to_feature_id_when_global_id_is_explicitly_null", blaze_color: "Blue"}
          - {trail_segment_key: "test_export_trails::test_export_trails_substitutes_a_synthetic_id_and_warns_when_a_feature_has_no_global_id_or_top_level_id", blaze_color: "Blue"}
          - {trail_segment_key: "test_export_trails::test_export_trails_warns_and_skips_a_feature_with_missing_geometry", blaze_color: "Blue"}
          - {trail_segment_key: "test_export_spurs::test_a_null_global_id_resolves_to_the_same_id_on_both_sides", blaze_color: "Blue"}
          - {trail_segment_key: "sql::a_point_is_not_a_line", blaze_color: "Blue"}
      - input: ref('stg_atc__centerline_segments')
        rows:
          - {trail_segment_key: "test_export_trails::test_export_trails_keeps_a_multilinestring_feature_instead_of_silently_dropping_it", source_id: "c-multi", source_row: 0, name: "A.T.", geom: "MULTILINESTRING ((-74.0 41.0, -74.0 41.01), (-74.0 41.02, -74.0 41.03))"}
          - {trail_segment_key: "sql::a_centerline_segment_with_no_globalid_takes_its_place_in_the_layer", source_id: null, source_row: 1, name: "A.T.", geom: "LINESTRING (-74.0 41.0, -74.0 41.001)"}
      - input: ref('stg_atc__side_trails')
        rows:
          - {trail_segment_key: "test_lib_feature_id::test_globalid_wins_when_present", source_id: "abc-123", objectid: 7, source_row: 0, geom: "LINESTRING (-74.0 41.0, -74.0 41.001)"}
          - {trail_segment_key: "test_lib_feature_id::test_an_explicit_null_globalid_falls_back_to_the_features_own_id", source_id: null, objectid: 8, source_row: 1, geom: "LINESTRING (-74.0 41.0, -74.0 41.001)"}
          - {trail_segment_key: "test_lib_feature_id::test_a_falsy_but_real_globalid_is_kept_verbatim", source_id: "0", objectid: 9, source_row: 2, geom: "LINESTRING (-74.0 41.0, -74.0 41.001)"}
          - {trail_segment_key: "test_lib_feature_id::test_both_absent_substitutes_a_positional_id_and_warns", source_id: null, objectid: null, source_row: 41, geom: "LINESTRING (-74.0 41.0, -74.0 41.001)"}
          - {trail_segment_key: "test_lib_feature_id::test_the_synthetic_id_is_unique_within_a_source", source_id: null, objectid: null, source_row: 42, geom: "LINESTRING (-74.0 41.0, -74.0 41.001)"}
          - {trail_segment_key: "test_export_trails::test_export_trails_falls_back_to_feature_id_when_global_id_is_explicitly_null", source_id: null, objectid: 10, source_row: 3, geom: "LINESTRING (-74.0 41.0, -74.0 41.001)"}
          - {trail_segment_key: "test_export_trails::test_export_trails_substitutes_a_synthetic_id_and_warns_when_a_feature_has_no_global_id_or_top_level_id", source_id: null, objectid: null, source_row: 43, geom: "LINESTRING (-74.0 41.0, -74.0 41.001)"}
          - {trail_segment_key: "test_export_trails::test_export_trails_warns_and_skips_a_feature_with_missing_geometry", source_id: "s-no-line", objectid: 12, source_row: 4, geom: null}
          - {trail_segment_key: "test_export_spurs::test_a_null_global_id_resolves_to_the_same_id_on_both_sides", source_id: null, objectid: 11, source_row: 5, geom: "LINESTRING (-74.0 41.0, -74.0 41.001)"}
          - {trail_segment_key: "sql::a_point_is_not_a_line", source_id: "s-point", objectid: 13, source_row: 6, geom: "POINT (-74 41)"}
    expect:
      rows:
        - {trail_segment_key: "sql::a_centerline_segment_with_no_globalid_takes_its_place_in_the_layer", source_key: "centerline", source_order: 3, feature_id: "generated-1", trail_line_id: "centerline:generated-1", blaze_color: "White", has_line_geometry: true}
        - {trail_segment_key: "test_export_trails::test_export_trails_keeps_a_multilinestring_feature_instead_of_silently_dropping_it", source_key: "centerline", source_order: 3, feature_id: "c-multi", trail_line_id: "centerline:c-multi", blaze_color: "White", has_line_geometry: true}
        - {trail_segment_key: "sql::a_point_is_not_a_line", source_key: "side_trails", source_order: 4, feature_id: "s-point", trail_line_id: "side_trails:s-point", blaze_color: "Blue", has_line_geometry: false}
        - {trail_segment_key: "test_export_spurs::test_a_null_global_id_resolves_to_the_same_id_on_both_sides", source_key: "side_trails", source_order: 4, feature_id: "11", trail_line_id: "side_trails:11", blaze_color: "Blue", has_line_geometry: true}
        - {trail_segment_key: "test_export_trails::test_export_trails_falls_back_to_feature_id_when_global_id_is_explicitly_null", source_key: "side_trails", source_order: 4, feature_id: "10", trail_line_id: "side_trails:10", blaze_color: "Blue", has_line_geometry: true}
        - {trail_segment_key: "test_export_trails::test_export_trails_substitutes_a_synthetic_id_and_warns_when_a_feature_has_no_global_id_or_top_level_id", source_key: "side_trails", source_order: 4, feature_id: "generated-43", trail_line_id: "side_trails:generated-43", blaze_color: "Blue", has_line_geometry: true}
        - {trail_segment_key: "test_export_trails::test_export_trails_warns_and_skips_a_feature_with_missing_geometry", source_key: "side_trails", source_order: 4, feature_id: "s-no-line", trail_line_id: "side_trails:s-no-line", blaze_color: "Blue", has_line_geometry: false}
        - {trail_segment_key: "test_lib_feature_id::test_a_falsy_but_real_globalid_is_kept_verbatim", source_key: "side_trails", source_order: 4, feature_id: "0", trail_line_id: "side_trails:0", blaze_color: "Blue", has_line_geometry: true}
        - {trail_segment_key: "test_lib_feature_id::test_an_explicit_null_globalid_falls_back_to_the_features_own_id", source_key: "side_trails", source_order: 4, feature_id: "8", trail_line_id: "side_trails:8", blaze_color: "Blue", has_line_geometry: true}
        - {trail_segment_key: "test_lib_feature_id::test_both_absent_substitutes_a_positional_id_and_warns", source_key: "side_trails", source_order: 4, feature_id: "generated-41", trail_line_id: "side_trails:generated-41", blaze_color: "Blue", has_line_geometry: true}
        - {trail_segment_key: "test_lib_feature_id::test_globalid_wins_when_present", source_key: "side_trails", source_order: 4, feature_id: "abc-123", trail_line_id: "side_trails:abc-123", blaze_color: "Blue", has_line_geometry: true}
        - {trail_segment_key: "test_lib_feature_id::test_the_synthetic_id_is_unique_within_a_source", source_key: "side_trails", source_order: 4, feature_id: "generated-42", trail_line_id: "side_trails:generated-42", blaze_color: "Blue", has_line_geometry: true}

  - name: int_trail_lines__at_clipped_keeps_whole_what_touches_the_corridor
    description: >
      export_trails.clip_to_corridor() (TL14) against a one-degree box for a
      corridor: a line that touches it is kept whole, one that does not is
      dropped, and a feature with no line never reaches the clip. Keyed
      `<pytest file>::<case>` in trail_segment_key.
    model: int_trail_lines__at_clipped
    given:
      - input: ref('int_trail_lines__corridor')
        rows:
          - {source_key: "centerline", geom: "POLYGON ((-74.5 40.5, -73.5 40.5, -73.5 41.5, -74.5 41.5, -74.5 40.5))"}
      - input: ref('int_trail_lines__at_features')
        rows:
          - {trail_segment_key: "test_export_trails::test_export_trails_clips_a_line_feature_outside_the_corridor", trail_line_id: "side_trails:0", has_line_geometry: true, geom_wkt: "LINESTRING (-80.0 35.0, -80.0 35.01)"}
          - {trail_segment_key: "sql::a_line_inside_the_corridor_is_kept", trail_line_id: "side_trails:1", has_line_geometry: true, geom_wkt: "LINESTRING (-74.0 41.0, -74.0 41.01)"}
          - {trail_segment_key: "sql::a_line_crossing_the_corridor_edge_is_kept_whole", trail_line_id: "side_trails:2", has_line_geometry: true, geom_wkt: "LINESTRING (-73.6 41.0, -73.4 41.0, -73.2 41.1)"}
          - {trail_segment_key: "sql::a_multilinestring_with_one_part_inside_is_kept_whole", trail_line_id: "side_trails:3", has_line_geometry: true, geom_wkt: "MULTILINESTRING ((-80.0 35.0, -80.0 35.01), (-74.0 41.2, -74.0 41.21))"}
          - {trail_segment_key: "sql::a_feature_with_no_line_is_never_kept", trail_line_id: "side_trails:4", has_line_geometry: false, geom_wkt: "POINT (-74 41)"}
    expect:
      rows:
        - {trail_segment_key: "sql::a_line_crossing_the_corridor_edge_is_kept_whole", geom_wkt: "LINESTRING (-73.6 41.0, -73.4 41.0, -73.2 41.1)"}
        - {trail_segment_key: "sql::a_line_inside_the_corridor_is_kept", geom_wkt: "LINESTRING (-74.0 41.0, -74.0 41.01)"}
        - {trail_segment_key: "sql::a_multilinestring_with_one_part_inside_is_kept_whole", geom_wkt: "MULTILINESTRING ((-80.0 35.0, -80.0 35.01), (-74.0 41.2, -74.0 41.21))"}

  - name: int_trail_lines__at_simplified_answers_what_simplify_records_answers
    description: >
      export_trails.simplify_records() at the 1 m default (TL15), one row per
      pytest case of tests/test_simplify_trails.py the default tolerance can
      ask, keyed `<pytest file>::<case>` in trail_segment_key. The lines are
      that file's _dense_line(), shorter, and its predicate cases as lines.
      tests/test_dbt_trail_lines_parity.py runs simplify_records() over the
      same rows and compares every vertex to the bit.
