version: 2

models:
  - name: base_ourhike__poi_identity
    data_tests:
      # Warns if the dedupe drops any row, which for a key unique by
      # construction never happens.
      - equal_rowcount_to_raw:
          arguments:
            compare_model: source('ourhike', 'raw_ourhike__poi_identity')
    description: >
      The POI identity ledger, every POI ever published, retired ones
      included. Read by int_podcasts__checked, which holds a tagged POI to
      the ledger's name for it and refuses a retired one.
    columns:
      - name: poi_identity_key
        description: >
          The row's key: dbt_utils.generate_surrogate_key over
          the file's path and poi_id.
        data_tests: [not_null, unique]
      - name: poi_id
        description: The published OurHike id, never re-minted or reused.
        data_tests: [not_null, unique]
      - name: name
        description: The POI's name as it was last published.
      - name: first_seen
        description: The release that first published the POI, as the ledger writes it.
      - name: retired
        description: >
          The release that stopped publishing the POI, as the ledger writes
          it. Null while the POI is live.
      - name: superseded_by
        description: >
          The live POI a retired one was folded into, where reconciliation
          knows one. On no row on 2026-10-01.
  - name: base_ourhike__blaze_mapping
    data_tests:
      # Warns if the dedupe drops any row, which for one file never happens.
      - equal_rowcount_to_raw:
          arguments:
            compare_model: source('ourhike', 'raw_ourhike__blaze_mapping')
    description: >
      pipeline/reference/blaze_mapping.json as its one row, keyed: the per-source blaze tables (#782), read by the trail-line models.
    columns:
      - name: blaze_mapping_document_key
        description: >
          The row's key: dbt_utils.generate_surrogate_key over
          the file's name and its landed path.
        data_tests: [not_null, unique]
      - name: document_json
        description: The file as written, as JSON.
        data_tests: [not_null]
  - name: base_ourhike__trail_name_aliases
    data_tests:
      # Warns if the dedupe drops any row, which for one file never happens.
      - equal_rowcount_to_raw:
          arguments:
            compare_model: source('ourhike', 'raw_ourhike__trail_name_aliases')
    description: >
      pipeline/reference/trail_name_aliases.json as its one row, keyed: each through route's names by publisher, read by the network overview.
    columns:
      - name: trail_name_aliases_document_key
        description: >
          The row's key: dbt_utils.generate_surrogate_key over
          the file's name and its landed path.
        data_tests: [not_null, unique]
      - name: document_json
        description: The file as written, as JSON.
        data_tests: [not_null]
  - name: base_ourhike__work_projects
    data_tests:
      # Warns if the dedupe drops any row, which for one file never happens.
      - equal_rowcount_to_raw:
          arguments:
            compare_model: source('ourhike', 'raw_ourhike__work_projects')
    description: >
      pipeline/reference/work_projects.json as its one row, keyed: the
      reviewed club workdays (#760), read by int_closures__work_projects_checked
      whatever `rows` holds, since the review is the file's.
    columns:
      - name: work_projects_document_key
        description: >
          The row's key: dbt_utils.generate_surrogate_key over
          the file's name and its landed path.
        data_tests: [not_null, unique]
      - name: document_json
        description: The file as its reviewer wrote it, `_README` aside, as JSON.
        data_tests: [not_null]
  - name: base_ourhike__database_size
    data_tests:
      # Warns if the dedupe drops any row, which for one size never happens.
      - equal_rowcount_to_raw:
          arguments:
            compare_model: source('ourhike', 'raw_ourhike__database_size')
    description: >
      The size of OurHike's own database as its one row, keyed, in bytes and
      in whole megabytes, read by
      tests/singular/assert_the_database_stays_under_its_plan.sql. No row
      where the conditions leg has never landed the size.
    columns:
      - name: ourhike_database_size_key
        description: >
          The row's key: dbt_utils.generate_surrogate_key over
          `ourhike_database_size` and `_dlt_load_id`, the load that read it,
          since the table holds one row per read.
        data_tests: [not_null, unique]
      - name: database_bytes
        description: >
          The sum of pg_database_size over every database the conditions
          reader may connect to, in bytes (pipeline/lib/database_size.py).
        data_tests: [not_null]
      - name: database_mb
        description: >
          database_bytes in megabytes of 1,048,576 bytes, rounded down, so that
          400 is the backend's own 80% of its 500 MB `database_quota_mb` to the
          byte.
        data_tests: [not_null]
