          - {restriction: 'not_a_restriction', pattern: '\b(will|shall|should) (be )?(credit|cite|cited)\b|\bcredit/disclaimer\b|\bshould be cited as the data source\b', written_for: 'blm_public_lands_access_lines', why: 'A credit requirement: every source row carries its `attribution`, and the sources mart prints it'}
          - {restriction: 'not_a_restriction', pattern: '\blicensed under a Creative Commons Attribution( \d(\.\d)?)?( International)?( License)?\b|\bCC0\b|\bCC BY( \d(\.\d)?)?([ .,;|)]|$)', written_for: 'ugrc_municipal_boundaries', why: 'An open licence (CC0, CC BY): attribution only, which the row''s `attribution` carries. Never CC BY-SA, -ND or -NC, which the pattern stops short of so that their own rows below read them'}
          - {restriction: 'not_a_restriction', pattern: '\bdistribution map\b|\bprovided for distribution\b|\bData Distribution Agreement\b|\bdistributed subject to the following conditions( and restrictions)?\b|\bfree of Copyright or Trademark claims or other restrictions or limitations\b|\bsubject to the copyright of trademark laws\b|\bnot state-authorized or endorsed\b|\breference to any specific commercial products\b|\bnor shall the act of distribution constitute\b', written_for: 'nj_high_elevation_points', why: 'A title, a species map''s name, or a note on third-party rights or endorsement: not a bar on this use'}
          - {restriction: 'not_a_restriction', pattern: '\bnone( of [^:]*)? (found|read)\b[^"]*', written_for: 'usfs_r08_alabama_alerts', why: 'The inventory''s own account of finding no terms ("None found: only a privacy policy is linked", "None read for these pages beyond the federal public-domain reading in `licence`"): our words up to the next quotation, restricting nothing'}
