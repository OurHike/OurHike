          - duplicates_are_exact:
              arguments:
                key_columns: ["'sbts_maintained'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))", "forest"]
        description: >
          SBTS Maintained trails (Sierra Buttes Trail Stewardship) (sources.json
          `sbts_maintained`). Key: geometry with Forest: 565 of 565 (measured 2026-10-03).
          Geometry alone is 564; Forest is null on 6.
      - name: raw_sbts__sbts_trail_town_amenities
