version: 2

models:
  - name: base_azgeo__arizona_trail
    data_tests:
      # Warns when the dedupe dropped any row, each an exact copy
      # (duplicates_are_exact on the raw table), and is an error once the
      # copies are half the raw table (decision 204, the generic test's).
      - equal_rowcount_to_raw:
          arguments:
            compare_model: source('azgeo', 'raw_azgeo__azgeo_arizona_trail')
    description: >
      Arizona National Scenic Trail (AZGeo), every row, keyed and deduped.
      Nothing reads it yet: the stage-3 unions of #1793 do.
    columns:
      - name: trail_segment_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          azgeo_arizona_trail, globalid, the registry key first and then the
          columns measured unique for this layer.
        data_tests: [not_null, unique]
