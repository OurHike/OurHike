version: 2

sources:
  - name: pcta
    description: >
      PCTA's registered layers, landed by the extract's pcta/ folder
      (pipeline/extract/pcta/) as raw_pcta__<key>, and staged once each by a
      base model here. Descriptions transcribed from sources.json's titles.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_pcta__pcta_centerline
        data_tests:
          # Rows sharing base_pcta__centerline's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'pcta_centerline'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks(), decision 102), each at warn.
          - elementary.volume_anomalies:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          Pacific Crest National Scenic Trail (PCTA centerline) (sources.json
          `pcta_centerline`). Key: one live row, so the registry key alone is
          unique; the geometry is added because a key needs a column beside
          the registry key, and a one-row layer's shape is trivially unique.
