  - name: int_closures__club_notices_closes_by_a_status_no_word_reads_a_listed_trail_and_a_title_s_stated_start
    description: >
      The closures the review of 2026-10-15 found read as notices (its
      S1-1, S1-2, S1-4, S2-1 to S2-4), on rows modelled on the live read of
      that day or on the review's probes, on a build pinned to that day. A
      status no word of the vocabulary reads ('Hazard', a workflow's
      'Final', an empty one beside 'Final') says nothing, so the title
      closes, where 'Closure with Detour' still speaks; FLTC's 'previous
      closure' and 'Hiker Notice' stay notices. A flag's -1 leaves its 1
      closing and its 0 not current. A title names each thing it lists:
      'Trail & Parking Area Closure' closes, 'Trail Parking Lot Closed'
      and 'Luzerne Horse Trail Campground and Trailhead' are sites, and a
      'Nature Trl' typed 'Viewing Scenery' is a trail. A title's stated
      start closes from that day ('beginning 9/1' posted 2026-08-17 is
      2026-09-01, 'beginning 11/2' posted 2026-10-10 is 2026-11-02, and a
      forest order typed 'Safety Closure' whose title closes 'starting
      November 2' starts that day), one
      with no day ('Beginning Fall 2027') stays a notice, and a park's
      water systems are a site. IDPR-shaped narratives naming both uses,
      all users or the public close, and 'non-motorized use no longer
      prohibited' stays nothing for a hiker. 'until further notice', 'no
      detour' and 'emergency access only' qualify nothing where 'detour in
      place' does. PCTA's closures layer does not close its detour or its
      'PCT Reopened' line, and still closes 'Lionshead Fire'. The
      vocabulary is mocked as the seed files are
      (tests/test_dbt_closures_club_notices.py).
    model: int_closures__club_notices
    overrides:
      vars:
        # Overriding vars replaces them all in a unit test: rule 9's lead.
        notice_season_lead_days: 30
        notices_build_date: "2026-10-15"
