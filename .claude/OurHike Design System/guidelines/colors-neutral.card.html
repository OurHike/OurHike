<!-- @dsCard group="Colors" viewport="700x160" name="Neutrals" subtitle="Stone and paper neutrals for text and surfaces" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:160px;font-family:var(--font-body)">
<div style="flex:1;background:var(--stone-900);display:flex;align-items:flex-end;padding:10px;color:var(--paper-0);font-size:12px">stone-900</div>
<div style="flex:1;background:var(--stone-700);display:flex;align-items:flex-end;padding:10px;color:var(--paper-0);font-size:12px">stone-700</div>
<div style="flex:1;background:var(--stone-500);display:flex;align-items:flex-end;padding:10px;color:var(--paper-0);font-size:12px">stone-500</div>
<div style="flex:1;background:var(--stone-300);display:flex;align-items:flex-end;padding:10px;color:var(--stone-900);font-size:12px">stone-300</div>
<div style="flex:1;background:var(--stone-150);display:flex;align-items:flex-end;padding:10px;color:var(--stone-900);font-size:12px">stone-150</div>
<div style="flex:1;background:var(--paper-100);display:flex;align-items:flex-end;padding:10px;color:var(--stone-900);font-size:12px;border:1px solid var(--stone-150)">paper-100</div>
<div style="flex:1;background:var(--paper-0);display:flex;align-items:flex-end;padding:10px;color:var(--stone-900);font-size:12px;border:1px solid var(--stone-150)">paper-0</div>
</div>
