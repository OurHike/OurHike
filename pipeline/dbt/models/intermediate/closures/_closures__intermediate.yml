  - name: int_closures__club_notices_reads_decision_213s_rules_for_every_source
    description: >
      The rules (the maintainer's polls of 2026-10-15), each a
      reading for every source, on invented rows shaped like the live rows
      that motivated them, on a build pinned to 2026-10-15. Rule 1: a
      category that is 'Closure' alone closes a placed row, a line and a
      point, where an unplaced page and a category that names a kind
      ('Safety Closure') still need their title. Rule 2: a category's
      restriction word lets the title's unqualified closing word close the
      row, but not a site, not a partial closure and not beside another
      word ('Planned'). Rule 5: a layer named for closed areas makes its
      polygon titled for a road a closed area; a layer named for closures
      alone does not, and one named for reroutes draws the way around. Rule 8: a
      warnings-filed row whose own words close closes, unless its words
      name only a road ('all-lanes-closed'). An activity's closure
      ('Butterfly Collection Closure') closes no trail unless the row's
      narrative closes something too. Rule 13: a title's stated end is read, the later of it and
      the row's own; a passed one ends the closure; an order number is no
      range. Rule 14: an undated closed area of a full listing stands
      until lifted, and a dated one, a line and a feed's area do not. The
      words are mocked as the seed holds them
      Rule 21: a compiled layer's row names its issuer, by the label its
      layer's domain gives the code or as the row writes it
      (tests/test_dbt_closures_club_notices.py).
    model: int_closures__club_notices
    overrides:
      vars:
        notices_build_date: "2026-10-15"
        # Overriding vars replaces them all in a unit test: rule 9's lead, set past
        # every row's start so this test reads the other rules alone.
        notice_season_lead_days: 1000
    given:
      - input: ref('int_closures__club_notices_unioned')
        rows:
