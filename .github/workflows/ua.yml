# Deploys `main` to UA - the environment a release candidate sits in before it
# is tagged. RELEASING.md §3b is the design; this is the build.
#
# UA exists because production used to deploy from this same push. There was no
# state in which a change was built, integrated and reviewable but not yet being
# served to hikers, so every gate had to run before the merge and therefore
# tested something other than what people receive. `main` lands here now, and a
# `v*` tag deploys production (pages.yml).
#
# WHY A CLOUDFLARE HOSTNAME AND NOT A PATH ON THE PRODUCTION SITE
#
# IndexedDB is scoped to an origin, not to a path. UA served from
# /OurHike/ua/ on the production host would share one origin - and therefore one
# IndexedDB - with the installed app, so a UA build with a half-finished storage
# change could evict, overwrite or misread a hiker's 1.18 GB archive. Different
# service worker scopes would not prevent any of it. A separate path is the
# cheaper design and it is the wrong one.
#
# WHY THE EXISTING PREVIEW PROJECT AND NOT A NEW ONE
#
# `ua.<project>.pages.dev` is already covered by the wildcard entries the R2
# CORS policy and Supabase's redirect list both carry for previews -
# `https://*.<project>.pages.dev`. So UA adds no entry to either list, and
# LAUNCH_CHECKLIST.md already names those two as the same mistake waiting to
# happen twice. A new project would need both updated before UA could sign
# anyone in or download anything.
#
# UA IS LAID OUT LIKE PRODUCTION: THE SITE AT `/`, THE APP AT `/app/`
#
# pages.yml and pr-preview.yml both assemble `_site/` with the Astro site at
# the root, the app under `app/` built with `VITE_BASE_PATH: /app/`, and the
# dbt docs at `data/`. Until #1887 this uploaded `client/dist` alone, built
# for `/`, so UA was the one environment between a pull request and a tag
# that could not show a change to ourhike.org at all - its site paths
# answered with the app's shell, measured 2026-10-24 on /organizations/ -
# and the one serving the app at a path production does not. The maintainer
# chose this layout by poll, 2026-10-24, over a second alias that would have
# left UA's app at `/`, knowing what the move costs: the app's address is
# `/app/` now (retire_root_service_worker.js, below, keeps an old install's
# icon opening it, offline too), and Spotify's and UA Supabase's registered
# addresses move to `/app/` (RELEASING.md §3b).
#
# The assembly is the preview's, step for step, with three differences: the
# status page is pointed at UA's data as pages.yml points production's, since
# UA is meant to be checked; the CSP in `_headers` names UA's backend, which a
# preview has none of; and `sw.js` at the root, which only UA needs, because
# only UA ever served the app there.
#
# THE DOCS JOB RUNS ONLY WHERE UA CAN DEPLOY: a job-level `if:` cannot read
# secrets, so it reads the one setting it can, CLOUDFLARE_PAGES_PROJECT. With
# that unset the docs are skipped and the deploy job still runs, to say why it
# is skipping (below) - the promise this header makes, kept. A docs build that
# fails where UA can deploy stops the deploy, as it stops production's and a
# preview's: a broken /data/ is a defect to see, not to ship around.
#
# SETUP: the same Pages project and token as pr-preview.yml (LAUNCH_CHECKLIST.md
# 3a), plus the optional UA_* settings below. Until the Cloudflare settings
# exist this workflow says so and skips rather than failing every merge.

name: Deploy UA

on:
  push:
    branches: [main]
  # So UA can be rebuilt after a UA_* setting changes, with no commit.
  workflow_dispatch:

# One UA at a time, newest wins. Unlike the previews there is only ever one of
# these, so a shared group is right here where it would be wrong there.
concurrency:
  group: ua
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The dbt docs for /data/, built exactly as pr-preview.yml and pages.yml
  # build theirs: by .github/actions/dbt-docs-site, in a job that holds no
  # secret, handed to the deploy as an artifact.
  docs:
    name: Build the data docs
    if: vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the data docs
        id: docs
        uses: ./.github/actions/dbt-docs-site

      - name: Hand the docs to UA
        uses: actions/upload-artifact@v7
        with:
          name: data-docs
          path: ${{ steps.docs.outputs.dir }}
          retention-days: 1
          if-no-files-found: error

  ua:
    needs: docs
    # Skipped docs - no Pages project - still reach the step that says so.
    if: ${{ !cancelled() && needs.docs.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check whether this run can deploy
        id: can
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ] || [ -z "$PROJECT" ]; then
            echo "::warning::No Cloudflare Pages project is configured, so there is no UA deploy. See LAUNCH_CHECKLIST.md 3a."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.can.outputs.deploy == 'true'

      - uses: actions/setup-node@v7
        if: steps.can.outputs.deploy == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            site/package-lock.json

      - name: Install
        if: steps.can.outputs.deploy == 'true'
        working-directory: client
        run: npm ci

      # The site's own toolchain and build, exactly as pr-preview.yml has
      # them: no UA-specific configuration, because the site is static HTML
      # whose `/app/...` links are root-relative.
      - name: Install the site's toolchain
        if: steps.can.outputs.deploy == 'true'
        working-directory: site
        run: npm ci

      - name: Build the site
        if: steps.can.outputs.deploy == 'true'
        working-directory: site
        run: npm run build

      # UA points at its own published data: DATA_BASE_URL plus
      # `/environments/ua`, the prefix a UA publish writes to
      # (features/DATA_ENVIRONMENTS.md). Prefix-only, never a separate bucket
      # (RELEASING.md §14.2): one bucket means UA is served through the same
      # CORS policy, host and range machinery a phone uses, so what UA verifies
      # is delivered the way production is delivered.
      #
      # Computed here rather than read from a variable someone has to type
      # out: the value is entirely derivable from DATA_BASE_URL plus a fixed
      # suffix, so a second setting holding the same information was a manual
      # step for no reason - one more place this could drift from
      # features/DATA_ENVIRONMENTS.md's own formula, and one more thing
      # standing between a UA publish landing and UA actually reading it.
      # UA_DATA_BASE_URL still exists below as an explicit override, for
      # whoever needs UA to point somewhere other than its own environment -
      # production's raw data, or a different bucket entirely.
      #
      # Before the first UA publish this points at a prefix with nothing in
      # it, and UA 404s on every artifact rather than quietly serving
      # production's. That is deliberate: a UA that reads production's bytes
      # by default is a UA that looks like it is testing a publish and is
      # not, and a 404 says plainly that nothing has shipped to UA yet where
      # a silent fallback would not.
      - name: Resolve the data source
        if: steps.can.outputs.deploy == 'true'
        id: data
        env:
          UA_URL: ${{ vars.UA_DATA_BASE_URL }}
          FROM_VAR: ${{ vars.DATA_BASE_URL }}
          FROM_SECRET: ${{ secrets.DATA_BASE_URL }}
        run: |
          BASE="${FROM_VAR:-$FROM_SECRET}"
          if [ -n "$UA_URL" ]; then
            URL="$UA_URL"
            echo "Data source: $URL (UA_DATA_BASE_URL override)"
          elif [ -n "$BASE" ]; then
            URL="$BASE/environments/ua"
            echo "Data source: $URL (UA's own environment, computed from DATA_BASE_URL)"
          else
            URL=""
            echo "::warning::No data source is configured, so UA cannot download a map. See LAUNCH_CHECKLIST.md 1.5."
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # UA's own Supabase project where it exists, production's otherwise - and
      # it says which. RELEASING.md §3d records the fallback and its cost: UA
      # testers appear in production's user list. It is a fallback rather than
      # the design because a UA tester's account is disposable and a hiker's is
      # not.
      #
      # Sharing auth is survivable. Sharing the *database* is not, which is why
      # the API below is a separate decision from this one.
      - name: Resolve the Supabase project
        if: steps.can.outputs.deploy == 'true'
        id: supabase
        env:
          UA_URL: ${{ vars.UA_SUPABASE_URL }}
          UA_KEY: ${{ vars.UA_SUPABASE_ANON_KEY }}
          URL_FROM_VAR: ${{ vars.SUPABASE_URL }}
          URL_FROM_SECRET: ${{ secrets.SUPABASE_URL }}
          KEY_FROM_VAR: ${{ vars.SUPABASE_ANON_KEY }}
          KEY_FROM_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$UA_URL" ] && [ -n "$UA_KEY" ]; then
            URL="$UA_URL"
            KEY="$UA_KEY"
            echo "Supabase project: $URL (UA's own)"
          else
            URL="${URL_FROM_VAR:-$URL_FROM_SECRET}"
            KEY="${KEY_FROM_VAR:-$KEY_FROM_SECRET}"
            if [ -n "$URL" ]; then
              echo "::warning::UA_SUPABASE_URL/UA_SUPABASE_ANON_KEY are unset, so UA signs in against the production Supabase project. Testers will appear in production's user list - see RELEASING.md 3d."
            else
              echo "::warning::No Supabase project is configured, so UA cannot sign anyone in."
            fi
          fi
          {
            echo "url=$URL"
            echo "key=$KEY"
          } >> "$GITHUB_OUTPUT"

      # UA_API_BASE_URL only, and deliberately no fallback to API_BASE_URL.
      #
      # That variable names the production backend, and the production backend
      # writes the moderation queue a club works from. A UA build that could
      # send would file test reports into it - the same reasoning that keeps
      # pr-preview.yml from setting this at all, and the reason UA gets its own
      # backend and its own database rather than sharing production's.
      #
      # Unset is a supported state: reports queue in the outbox with their
      # authored timestamps, which is behaviour worth exercising anyway.
      - name: Resolve the backend
        if: steps.can.outputs.deploy == 'true'
        id: api
        env:
          UA_API: ${{ vars.UA_API_BASE_URL }}
        run: |
          if [ -z "$UA_API" ]; then
            echo "::notice::UA_API_BASE_URL is unset, so UA queues reports in the outbox instead of sending them. It never falls back to the production backend."
          else
            echo "Backend: $UA_API"
          fi
          echo "url=$UA_API" >> "$GITHUB_OUTPUT"

      - name: Build the app
        if: steps.can.outputs.deploy == 'true'
        working-directory: client
        env:
          # `/app/`, the path production serves the app at (pages.yml) and
          # every preview builds it for. It was `/` until #1887, with a
          # comment saying that was "also how production is served", which
          # stopped being true when #733 moved the app to ourhike.org/app/.
          VITE_BASE_PATH: /app/
          VITE_DATA_BASE_URL: ${{ steps.data.outputs.url }}
          VITE_SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.key }}
          VITE_API_BASE_URL: ${{ steps.api.outputs.url }}
          # The same Spotify app as production (#1683): one client id can
          # carry a redirect URI per origin, and UA's is registered beside
          # production's.
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: npm run build

      # The same proof pages.yml makes about production, for the same reason:
      # setting a variable and having it reach the bundle are different claims,
      # and the gap is invisible from outside.
      - name: Confirm the data source reached the bundle
        if: steps.can.outputs.deploy == 'true'
        working-directory: client
        env:
          DATA_URL: ${{ steps.data.outputs.url }}
        run: |
          if [ -z "$DATA_URL" ]; then
            echo "No data source configured - skipping the check."
            exit 0
          fi
          if grep -rqF -- "$DATA_URL" dist/assets/*.js; then
            echo "Data source is present in the built bundle."
          else
            echo "::error::A data source was set but is absent from the built bundle - UA would ship unable to download anything."
            exit 1
          fi

      # The same guard pages.yml carries, against UA's own base (#1333). This
      # is the half that makes one committed DATA_RELEASE safe across two data
      # environments: UA publishes independently, so its `releases/` tree
      # holds different ids - measured 2026-09-09, 31 against production's 14,
      # with 10 in common. Checking each base separately turns "the pin must
      # exist in both" into a red deploy rather than something to remember.
      # The pin is the compiled floor a first run reads when it cannot read
      # a channels.json entry (lib/dataRelease.ts).
      #
      # AND WHAT IT HOLDS MUST FIT A LAUNCH: check 22 on the manifest just
      # fetched (.github/scripts/check_launch_budget.py). Release 2026-10-03-2
      # resolved here and carried a network_overview.geojson over the launch
      # budget, so every UA phone declined it and its opening map drew the
      # A.T. alone (review 5528343443 on PR #1805). The step below weighs
      # the release the uploaded pointer names the same way.
      - name: Confirm the pinned data release exists
        if: steps.can.outputs.deploy == 'true'
        working-directory: client
        env:
          DATA_URL: ${{ steps.data.outputs.url }}
        run: |
          if [ -z "$DATA_URL" ]; then
            echo "No data source configured - skipping the check."
            exit 0
          fi
          release=$(sed -n "s/^export const DATA_RELEASE = '\\(.*\\)'$/\\1/p" src/lib/dataRelease.ts)
          if [ -z "$release" ]; then
            echo "::error::Could not read DATA_RELEASE out of client/src/lib/dataRelease.ts. It has been restructured, and this guard must be updated rather than left checking nothing."
            exit 1
          fi
          manifest="${DATA_URL%/}/releases/${release}/manifest.json"
          pinned="${RUNNER_TEMP:-/tmp}/pinned-manifest.json"
          if curl -fsS --retry 3 --max-time 30 -o "$pinned" "$manifest"; then
            echo "Pinned release ${release} resolves at ${DATA_URL%/}."
          else
            echo "::error::DATA_RELEASE is pinned to ${release}, but ${manifest} does not resolve. UA would deploy unable to fetch anything."
            exit 1
          fi
          python3 ../.github/scripts/check_launch_budget.py "$pinned" --release "$release"

      # THE POINTER, if one is uploaded at this build's base: the release a
      # phone of this build takes on its first launch, when it can read it,
      # and on every launch after (lib/dataRelease.ts, lib/dataChannel.ts).
      # It must resolve here and fit a launch, as the floor must above. The
      # bucket copy is the only copy (pipeline/channels.py moves it), so this
      # reads it at the base, never a file in this commit. A 404 passes with
      # a notice: phones then read the compiled DATA_RELEASE, checked above.
      # The environment comes off the base as the client reads it:
      # `.../environments/<name>`, else production.
      - name: Confirm the uploaded pointer's release exists
        if: steps.can.outputs.deploy == 'true'
        working-directory: client
        env:
          DATA_URL: ${{ steps.data.outputs.url }}
        run: |
          if [ -z "$DATA_URL" ]; then
            echo "No data source configured - skipping the check."
            exit 0
          fi
          schema=$(sed -n "s/^export const DATA_SCHEMA_VERSION = '\\(.*\\)'$/\\1/p" src/lib/dataRelease.ts)
          if [ -z "$schema" ]; then
            echo "::error::Could not read DATA_SCHEMA_VERSION out of client/src/lib/dataRelease.ts. It has been restructured, and this guard must be updated rather than left checking nothing."
            exit 1
          fi
          base="${DATA_URL%/}"
          environment=production
          case "$base" in */environments/*) environment="${base##*/environments/}" ;; esac
          uploaded="${RUNNER_TEMP:-/tmp}/uploaded-channels.json"
          code=$(curl -sS --retry 3 --max-time 30 -o "$uploaded" -w '%{http_code}' "${base}/channels.json") || code="no answer"
          case "$code" in
            200) ;;
            404)
              echo "::notice::No channels.json is uploaded at ${base}, so every phone of this build reads the compiled DATA_RELEASE, checked one step earlier, until ${environment}'s pointer is first moved (pipeline/channels.py)."
              exit 0 ;;
            *)
              echo "::error::${base}/channels.json answered ${code}, so this deploy cannot tell which release phones follow."
              exit 1 ;;
          esac
          # The entry is remote text, so it is printed only once it has a
          # release id's shape: this line is a workflow command.
          release=$(python3 -c 'import json, re, sys; entry = json.load(open(sys.argv[1]))[sys.argv[2]][sys.argv[3]]; assert re.fullmatch(r"\d{4}-\d{2}-\d{2}(-\d+)?", entry); print(entry)' "$uploaded" "$environment" "$schema" 2>/dev/null) || release=""
          if [ -z "$release" ]; then
            echo "::error::${base}/channels.json names no ${schema} release id for ${environment}, so phones of this build would ignore it. Move ${environment}'s pointer with pipeline/channels.py (RELEASING.md §10)."
            exit 1
          fi
          manifest="${base}/releases/${release}/manifest.json"
          pointed="${RUNNER_TEMP:-/tmp}/pointed-manifest.json"
          if curl -fsS --retry 3 --max-time 30 -o "$pointed" "$manifest"; then
            echo "The uploaded channels.json at ${base} points ${environment}'s ${schema} at ${release}, which resolves."
          else
            echo "::error::${base}/channels.json points ${environment}'s ${schema} at ${release}, but ${manifest} does not resolve. Phones would refuse it and stay on the release they hold."
            exit 1
          fi
          python3 ../.github/scripts/check_launch_budget.py "$pointed" --release "$release"

      - name: Fetch the data docs
        if: steps.can.outputs.deploy == 'true'
        uses: actions/download-artifact@v8
        with:
          name: data-docs
          path: ${{ runner.temp }}/data-docs

      # check_docs_site.py, in the assembly, reads the docs' Parquet files
      # with duckdb, at the pipeline's own pin - pr-preview.yml has the run
      # that failed without it.
      - uses: actions/setup-python@v7
        if: steps.can.outputs.deploy == 'true'
        with:
          python-version: "3.12"

      - name: Install the docs check's duckdb
        if: steps.can.outputs.deploy == 'true'
        run: python -m pip install --quiet "$(grep -m1 '^duckdb==' pipeline/requirements.txt)"

      # pr-preview.yml's "Assemble the preview" is the reference for every
      # line below that is not commented here, and its comments carry the
      # measurements: why 404.html and `_redirects` both, why `_headers` sits
      # at the root, why the docs are checked on the copy.
      - name: Assemble UA
        if: steps.can.outputs.deploy == 'true'
        env:
          VITE_DATA_BASE_URL: ${{ steps.data.outputs.url }}
          VITE_SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          VITE_API_BASE_URL: ${{ steps.api.outputs.url }}
          DOCS_DIR: ${{ runner.temp }}/data-docs
          DATA_URL: ${{ steps.data.outputs.url }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p _site/app
          cp -r site/dist/. _site/
          cp -r client/dist/. _site/app/
          cp client/public/favicon.svg _site/favicon.svg
          if [ -e _site/data ]; then
            strays=$(find _site/data -mindepth 1 -maxdepth 1 ! -name quality ! -name how -printf '%f ')
            if [ -n "$strays" ]; then
              echo "::error::site/dist holds data/${strays% } beside data/quality/ and data/how/, and data/ is the dbt docs' path. Move one of them."
              exit 1
            fi
          fi
          mkdir -p _site/data
          # Never empty: `cp -r "/." _site/data/` would copy the runner's root.
          : "${DOCS_DIR:?the docs step named no directory}"
          if [ -e "$DOCS_DIR/quality" ]; then
            echo "::error::The dbt docs hold a quality/ of their own, which is the data-quality page's path. Move one of them."
            exit 1
          fi
          if [ -e "$DOCS_DIR/how" ]; then
            echo "::error::The dbt docs hold a how/ of their own, which is the How the data is built page's path. Move one of them."
            exit 1
          fi
          cp -r "$DOCS_DIR"/. _site/data/
          python pipeline/check_docs_site.py _site/data --served
          printf '/app/*  /app/index.html  200\n' > _site/_redirects
          cp _site/app/index.html _site/404.html
          # UA's own, and the one file here no other build has: the script
          # the worker UA's root app registered before #1887 finds as its
          # update. It replaces that worker with a door to /app/, so an old
          # install's icon still opens the map, offline too. The file says
          # how, and what it leaves alone.
          cp .github/scripts/retire_root_service_worker.js _site/sw.js
          # /status/ pointed at UA's data, as pages.yml points production's:
          # UA is meant to be checked, where a preview's status page is left
          # saying it is unconfigured on purpose.
          if [ -n "$DATA_URL" ]; then
            python3 -c 'import os, pathlib; p = pathlib.Path("_site/status/index.html"); p.write_text(p.read_text().replace("__DATA_BASE_URL__", os.environ["DATA_URL"]))'
            echo "Status page points at $DATA_URL"
          else
            echo "::warning::No data source, so /status/ will say it is unconfigured rather than checking anything."
          fi
          python .github/scripts/configure_quality_page.py _site/data/quality/index.html
          node client/scripts/csp.mjs --headers > _site/_headers
          echo "Uploading $(find _site -type f | wc -l) files: $(find _site/app -type f | wc -l) of them the app, $(find _site/data -type f | wc -l) the dbt docs."

      - name: Publish UA
        id: deploy
        if: steps.can.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.0.0 - SHA-pinned: this step holds the Cloudflare token (#660)
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `ua` is what Cloudflare turns into the hostname, and it is a fixed
          # alias rather than a per-run one - the whole point is a URL that
          # volunteers can keep. It cannot collide with a preview: those are all
          # `pr-<n>`, and the cleanup action that removes them on close matches
          # that shape rather than every alias in the project.
          command: >-
            pages deploy _site
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=ua
            --commit-dirty=true

      # Cloudflare mints an alias lazily and its edge answers 522 for a minute
      # or two before it routes anywhere - see pr-preview.yml, where trusting
      # the upload rather than the URL cost the first person to click a link.
      # This only happens on the very first UA deploy, but that is exactly the
      # run whose failure would look like a broken design.
      - name: Wait for UA to answer
        if: steps.can.outputs.deploy == 'true'
        env:
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          IMMUTABLE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::The deploy reported no alias URL. This build is at $IMMUTABLE."
            exit 0
          fi
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "UA answered 200 on attempt $attempt: $URL"
              app="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "${URL%/}/app/" || echo 000)"
              if [ "$app" != "200" ]; then
                echo "::warning::The site answers, but ${URL%/}/app/ answered $app."
              fi
              exit 0
            fi
            echo "Attempt $attempt: $code. Waiting for the alias to route."
            sleep 5
          done
          echo "::warning::UA still answers something other than 200 after 30 attempts. This build is at $IMMUTABLE."

      - name: Say where UA is
        if: steps.can.outputs.deploy == 'true'
        env:
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          IMMUTABLE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### UA"
            echo
            echo "**${URL:-$IMMUTABLE}** - the site, as ourhike.org serves it"
            echo
            BASE="${URL:-$IMMUTABLE}"
            echo "**${BASE%/}/app/** - the app, as ourhike.org/app/ serves it"
            echo
            echo "Built from \`$GITHUB_SHA\`. This is what a release candidate looks like;"
            echo "production is whatever tag was last deployed (RELEASING.md §2)."
          } >> "$GITHUB_STEP_SUMMARY"
