          - {"park_polygon_key": "park-polygon-1", "source_row": 1, "globalid": "g2", "name": "Robert Moses", "masterareaid": 270, "category": null, "geom": "POLYGON ((-73.808 41.0, -73.76960000000001 41.0, -73.76960000000001 41.02894, -73.808 41.02894, -73.808 41.0))", "_loaded_at": "2026-10-02 00:00:00+00"}
      - input: ref('stg_registry__sources')
        rows:
          - {"source_key": "oprhp_park_polygons", "file_row": 0, "provider": "NYS OPRHP", "entry": "{\"key\": \"oprhp_park_polygons\", \"provider\": \"NYS OPRHP\", \"kind\": \"external_arcgis_layer\", \"name_field\": \"Name\", \"id_field\": \"GlobalID\", \"unit_field\": \"MasterAreaID\"}"}
      - input: ref('int_sources__publication')
        rows:
          - {"source_key": "oprhp_park_polygons", "may_publish": true}
      - input: ref('stg_registry__organizations')
        rows:
