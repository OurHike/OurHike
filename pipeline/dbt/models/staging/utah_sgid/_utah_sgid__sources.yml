version: 2

sources:
  - name: utah_sgid
    description: >
      Utah UGRC's registered layers, landed by the extract's utah_sgid/ folder
      (pipeline/extract/utah_sgid/) as raw_utah_sgid__<key>, and staged once
      each by a base model here. Descriptions transcribed from sources.json's
      titles.
    schema: raw
    config:
      # When the extract last read each table or confirmed it unchanged, from
      # its run log, never `_loaded_at` (decision 203): make_dbt_staging.py's
      # LOADED_AT_QUERY and MONTHLY_FRESHNESS_DAYS say why, and
      # tests/test_source_freshness.py holds every monthly source to them.
      loaded_at_query: "{{ last_read_or_confirmed_at(this) }}"
      freshness:
        warn_after: {count: 35, period: day}
        error_after: {count: 62, period: day}
    tables:
      - name: raw_utah_sgid__utah_sgid_trails
        data_tests:
          # Rows sharing base_utah_sgid__trails's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'utah_sgid_trails'", "unique_id"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks(), decision 102), each at warn.
          - elementary.volume_anomalies:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          Utah trails and pathways (SGID) (sources.json `utah_sgid_trails`).
          Key: Unique_ID unique on 48,132 of 48,132 live rows.
