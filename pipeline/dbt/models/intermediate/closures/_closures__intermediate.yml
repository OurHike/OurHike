          union all
          select '20261003T000000.000000Z', 'raw_nynjtc__nynjtc_trail_alerts', 'loaded', 0, 0
          union all
          select '20261003T010000.000000Z', 'raw_nynjtc__nynjtc_trail_alerts', 'skipped', null, null
          union all
          select '20261003T020000.000000Z', 'raw_ourhike__closures', 'loaded', 0, 3
