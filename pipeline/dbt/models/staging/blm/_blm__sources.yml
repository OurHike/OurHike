version: 2

sources:
  - name: blm
    description: >
      BLM's registered layers, landed by the extract's blm/ folder
      (pipeline/extract/blm/) as raw_blm__<key>, and staged once each by a
      base model here. Descriptions transcribed from sources.json's titles.
    schema: raw
    config:
      # When the extract last read each table or confirmed it unchanged, from
      # its run log, never `_loaded_at` (decision 203): make_dbt_staging.py's
      # LOADED_AT_QUERY and MONTHLY_FRESHNESS_DAYS say why, and
      # tests/test_source_freshness.py holds every monthly source to them.
      loaded_at_query: "{{ last_read_or_confirmed_at(this) }}"
      freshness:
        warn_after: {count: 35, period: day}
        error_after: {count: 62, period: day}
    tables:
      - name: raw_blm__blm_trails
        data_tests:
          # Rows sharing base_blm__trails's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'blm_trails'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))", "blm_miles", "route_plan_id", "def_fet2", "plan_season_rstrct_code", "route_prmry_nm"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks(), decision 102), each at warn.
          - elementary.volume_anomalies:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          BLM trails and routes (Natl GTLF public display) (sources.json
          `blm_trails`). Key: geometry plus five route columns, 19,530 of
          19,530 live rows after 2 exact copies. @unvalidated until BLM says
          whether rows sharing a shape are separate routes.
