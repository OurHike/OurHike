  - name: int_challenges__refusals_report_as_main_reports
    description: >
      test_export_challenges::TestMain::test_drops_are_reported_and_do_not_fail_the_run and
      test_lib_challenges::TestResolvingFiles::test_dropped_items_are_labelled_with_their_challenge:
      one of each refusal, as the upstream models give them for a sandbox of
      publishers.json rows, misplaced, dropped and resolved files and their
      items, reported in export_challenges.main()'s order and words.
    model: int_challenges__refusals
    given:
      - input: ref('int_challenges__publishers')
        rows:
          - {"publisher_position": 1, "org": "atc", "accepted": true, "problem": null}
          - {"publisher_position": 2, "org": "nobody", "accepted": false, "problem": "'nobody': not an organization in sources.json (looked for 'org:nobody')"}
      - input: ref('int_challenges__publisher_trails')
        rows:
          - {"publisher_trail_id": "1.1", "publisher_position": 1, "trail_position": 1, "org": "atc", "trail": "AT", "in_scope": true, "problem": null}
          - {"publisher_trail_id": "1.2", "publisher_position": 1, "trail_position": 2, "org": "atc", "trail": "LP", "in_scope": false, "problem": "atc: trail 'LP' is carried by no published POI"}
      - input: ref('int_challenges__resolved')
        rows:
          - {"challenge_file_key": "a", "list_position": 1, "report_label": "a-trail", "problem": "trail 'LP' is not one 'atc' publishes", "drop_step": 2, "reached_items": false}
          - {"challenge_file_key": "c", "list_position": 2, "report_label": "c-resolves", "problem": null, "drop_step": null, "reached_items": true}
          - {"challenge_file_key": "d", "list_position": 3, "report_label": "d-finish", "problem": "finish needs 1 items and only 0 resolved", "drop_step": 2, "reached_items": true}
          - {"challenge_file_key": "b", "list_position": 4, "report_label": "b-misplaced", "problem": "file is under nynjtc/ but its org is 'atc'", "drop_step": 1, "reached_items": false}
      - input: ref('int_challenges__items')
        rows:
          - {"item_key": "c:1", "challenge_file_key": "c", "item_position": 1, "report_label": "mcafee-knob", "problem": null}
          - {"item_key": "c:2", "challenge_file_key": "c", "item_position": 2, "report_label": "gone", "problem": "poi atc_viewpoints:gone is not in the published POIs"}
          - {"item_key": "d:1", "challenge_file_key": "d", "item_position": 1, "report_label": "gone", "problem": "poi atc_viewpoints:gone is not in the published POIs"}
    expect:
      rows:
        - {"refusal_order": 1, "report_line": "atc: trail 'LP' is carried by no published POI"}
        - {"refusal_order": 2, "report_line": "'nobody': not an organization in sources.json (looked for 'org:nobody')"}
        - {"refusal_order": 3, "report_line": "b-misplaced: file is under nynjtc/ but its org is 'atc'"}
        - {"refusal_order": 4, "report_line": "a-trail: trail 'LP' is not one 'atc' publishes"}
        - {"refusal_order": 5, "report_line": "d-finish: finish needs 1 items and only 0 resolved"}
        - {"refusal_order": 6, "report_line": "c-resolves / gone: poi atc_viewpoints:gone is not in the published POIs"}
        - {"refusal_order": 7, "report_line": "d-finish / gone: poi atc_viewpoints:gone is not in the published POIs"}
  - name: int_challenges__items_resolve_as_resolve_item_resolves
    description: >
      One challenge per pytest case of resolve_item(), resolve_match() and
      _place(), holding that case's items (test_lib_challenges.one_item()'s
      shape), against POIs and a centerline built so each distance the Python's
      stand-in distance functions stated is a real distance to a real chain.
