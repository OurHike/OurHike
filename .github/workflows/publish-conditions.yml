# Publishes verified closures, verified reports and the ATC's own trail
# updates to R2, so reading any of them needs no running server.
#
# features/CONDITIONS_DELIVERY.md is the design; this is steps 1 and 3 of its
# order of work. The third artifact is features/ATC_TRAIL_UPDATES.md's, and
# it arrives by a different road: closures and reports are queried out of the
# database, while ATC's notices are baked from a file in git that a person
# reviewed (#460). Same bucket prefix, same daily clock, same publish step -
# and no credential, which is why the two legs are gated separately below. Daily rather than continuous because that is the staleness the
# maintainer accepted (2026-08-08): "a closure can be latent by a day. we
# won't be adjusting minute by minute." The artifact carries its own
# `generated_at` and the client renders it, so a hiker is told how old the
# answer is rather than left to assume.
#
# WHY THIS IS SAFE TO RUN BEFORE ANYTHING IS CONFIGURED. The reader
# credential is account work on Supabase, and it does not exist yet. Like
# migrate.yml's UA job, this skips with a warning rather than a red X when
# the secret is absent - a scheduled workflow that fails every night until
# someone does account work trains people to ignore it.
#
# WHY IT CANNOT PUBLISH AN EMPTY ARTIFACT. Row-level security is on for every
# table with no policies, and the backend only works because it connects as
# the owner. The reader is not the owner, so a missing GRANT or policy returns
# zero rows *without an error* - which, published, is a client holding a valid
# baseline that says the trail is clear. export_conditions.py asks the catalog
# whether its permissions are really in place and refuses to write anything if
# they are not, which is what makes a genuinely empty result trustworthy.
#
# NOT GATED ON AN ENVIRONMENT. There is nothing to approve: this reads
# verified rows a hiker could already fetch from `GET /closures` without an
# account, and writes them to a bucket. schema-drift.yml records the same
# reasoning for the same shape of job.
#
# ONE RUN PER DATA ENVIRONMENT (features/DATA_ENVIRONMENTS.md). Each reads its
# own database and writes its own prefix, so the two never meet: a test closure
# a UA moderator verified cannot reach a hiker's map, and production's verified
# rows are not what a tester rehearses moderation against. The matrix jobs write
# disjoint keys, so they never race each other - but each still joins the
# publish-data group below, because the race that matters is with the other
# four workflows, over the shared latest.json (#645).
#
# The ATC leg is deliberately NOT split. Those notices are baked from a file in
# git that a person reviewed - there is no database behind them and no
# environment they could differ by - so both runs publish the same reviewed
# content into their own tree, which is what makes UA's copy a real rehearsal
# rather than an empty one.

name: Publish conditions

# Every writer of latest.json shares this group (publish-vector-data.yml,
# build-basemap.yml, build-dem.yml, build-raster.yml): publish() reads the
# manifest, uploads for as long as the artifacts take, and writes the merge
# last, so two concurrent publishes interleave and whichever writes last
# reverts the other's entries (#645). This workflow was the one writer
# outside the group - its header used to argue the matrix legs write
# disjoint keys, which was true and answered a different question.
#
# At the WORKFLOW level, not on the job, and that placement is load-bearing:
# concurrency groups coalesce rather than queue (one pending entrant; a newer
# pending run cancels the older), so a job-level group would let the ua leg's
# arrival cancel the production leg's pending slot whenever another publish
# held the group - production's closures silently a day older, with no red
# run. One run taking the group once means both legs publish or the whole
# run visibly waits/cancels together, and a cancelled daily run is healed by
# tomorrow's cron.
concurrency:
  group: publish-data
  cancel-in-progress: false

on:
  schedule:
    # 08:40 UTC daily. Off the hour, and clear of the other scheduled jobs -
    # check-upstream-freshness at 07:20, settings-configured at 07:35, schema-drift
    # at 08:10 - for the reason each of those records: GitHub queues
    # everything submitted at :00 together.
    - cron: "40 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish (${{ matrix.data_environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run per data environment, because this is the source where sharing
    # hurts most: closures and reports are baked from a *database*, so a single
    # bake would put whichever database it read in front of both audiences at
    # once (features/DATA_ENVIRONMENTS.md). UA moderating a test closure would
    # be a closure on a hiker's map, and a hiker's verified closure would be
    # what a tester was handed to rehearse against.
    #
    # fail-fast off, because the two are independent: UA's database being
    # unreachable is not a reason to leave production's safety data a day
    # older than it needs to be.
    strategy:
      fail-fast: false
      matrix:
        data_environment: [production, ua]
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Is there a database to read
        id: can
        # Before the checkout, so not in pipeline/ - migrate.yml's gate has
        # the reasoning for testing the secret this way rather than letting
        # the connection fail with something less legible.
        #
        # Both secrets are named literally rather than indexed by the matrix
        # value. GitHub's `a && b || c` yields `c` whenever `b` is empty, and
        # an unset production URL silently selecting UA's database is the one
        # mistake this whole job exists to make impossible -
        # .github/tests/test_repository_settings.py also reads these names as
        # text, so an indexed reference would leave the settings undeclared.
        working-directory: .
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_CONDITIONS_DATABASE_URL }}
          UA_URL: ${{ secrets.UA_CONDITIONS_DATABASE_URL }}
        run: |
          if [ "${{ matrix.data_environment }}" = "production" ]; then
            CONFIGURED="$PRODUCTION_URL"
          else
            CONFIGURED="$UA_URL"
          fi
          if [ -z "$CONFIGURED" ]; then
            echo "::warning::No ${{ matrix.data_environment }} conditions database is configured, so no closures or reports were published for it. The ATC trail-updates leg does not need one and still ran. See features/CONDITIONS_DELIVERY.md and #429."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # No longer gated on the database, because half this job no longer
      # needs one. ATC's Trail Updates are baked from a reviewed file in git
      # (features/ATC_TRAIL_UPDATES.md, #460) - no query, no credential - and
      # gating the checkout on a secret that leg never uses would have made
      # the ATC layer wait on Supabase account work it has nothing to do with.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Before the database leg, and unconditionally. Writes nothing at all
      # while nobody has reviewed reference/atc_updates.json, and says so on
      # stdout rather than failing: "we have not looked yet" is a true
      # statement about this feature, and a red X for it would be noise on a
      # job that is working.
      - name: Export the ATC's reviewed trail updates
        run: python export_atc_updates.py

      - name: Export verified conditions
        id: export
        if: steps.can.outputs.go == 'true'
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_CONDITIONS_DATABASE_URL }}
          UA_URL: ${{ secrets.UA_CONDITIONS_DATABASE_URL }}
        run: |
          if [ "${{ matrix.data_environment }}" = "production" ]; then
            export CONDITIONS_DATABASE_URL="$PRODUCTION_URL"
          else
            export CONDITIONS_DATABASE_URL="$UA_URL"
          fi
          python export_conditions.py

      # Printed before publishing, because "it read something" and "it
      # published something" are different facts and only the first one
      # explains an empty upload.
      #
      # Both manifests, and neither is required to exist: the conditions one
      # is absent until the database secret is configured, the ATC one until
      # somebody reviews the file. A run that produced neither prints nothing
      # here and "Nothing changed" below, which is the honest pair.
      - name: Say what was read
        run: |
          python -c "
          import json, pathlib
          for name in ('conditions_manifest.json', 'atc_updates_manifest.json'):
              path = pathlib.Path('data/processed') / name
              if not path.exists():
                  continue
              for kind, entry in json.loads(path.read_text())['artifacts'].items():
                  reviewed = entry.get('reviewed_at')
                  when = f\", reviewed {reviewed}\" if reviewed else ''
                  print(f\"{entry['count']} {kind} row(s), generated {entry['generated_at']}{when}\")
          "

      - name: Publish to R2
        env:
          # The gate publish.py checks. Set only on this step, so every other
          # step here is structurally incapable of writing to the bucket -
          # publish-vector-data.yml sets it the same way for the same reason.
          R2_WRITE_ENABLED: "true"
          # And the one that decides where. This job's whole shape is one run
          # per environment, so the matrix value is the answer rather than an
          # input somebody picks (features/DATA_ENVIRONMENTS.md).
          OURHIKE_DATA_ENV: ${{ matrix.data_environment }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        # publish.py collects whatever data/processed/ holds, which in this
        # job is the conditions manifest and nothing else - a fresh checkout
        # has run no other export script. The manifest merge is additive, so
        # the trail artifacts already in latest.json survive untouched.
        run: python publish.py
