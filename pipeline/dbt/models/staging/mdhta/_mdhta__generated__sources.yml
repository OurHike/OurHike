# GENERATED by pipeline/make_dbt_staging.py from sources.json
# and the extract's club folders; edit them or it, never this file.
version: 2

sources:
  - name: mdhta
    description: >
      The layers sources.json registers for the extract's mdhta/ folder
      (pipeline/extract/mdhta/) that pipeline/make_dbt_staging.py stages, landed as
      raw_mdhta__<key> and staged once each by a generated base model here. Descriptions
      transcribed from sources.json's titles and key notes.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      meta:
        cadence: monthly
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_mdhta__mdhta_trail_guide
        data_tests:
          # Rows sharing base_mdhta__mdhta_trail_guide's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'mdhta_trail_guide'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
                row_id_columns: ["objectid", "fid", "ogc_fid", "_dlt_id", "_socrata_id", "feature_index", "feature_id"]
        description: >
          Maah Daah Hey Trail and its connectors (the trail guide's 19 GeoJSON files, with
          elevation) (sources.json `mdhta_trail_guide`). Key: The geometry alone: unique
          on 22 of 22 across the 19 files (measured 2026-10-04). `name` is 20 of 22.
      - name: raw_mdhta__mdhta_trail_guide_points
        data_tests:
          # Rows sharing base_mdhta__mdhta_trail_guide_points's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'mdhta_trail_guide_points'", "link"]
        description: >
          Maah Daah Hey trail guide's points: trailheads, campgrounds, water cache boxes,
          river crossings (sources.json `mdhta_trail_guide_points`). Key: `link`, each
          point's own page on mdhta.com (its post permalink): unique on 50 of 50 (measured
          2026-10-04 on the live page, every anchor parsed as extract/_pages_points.py
          parses it). The geometry is 50 of 50 too, (`kind`, `name`) 50 of 50 and `slug`
          39 of 50, because a trailhead and a campground of one name share a slug.
