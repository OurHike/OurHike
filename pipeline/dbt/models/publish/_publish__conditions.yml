          select
              ourhike_report_key, report_uuid, report_type, poi_id,
              cast(lat as double) as lat,
              cast(lon as double) as lon,
              cast(mile as double) as mile,
              reporter_type,
              cast(reported_at as timestamptz) as reported_at,
              note,
              cast(follow_up as json) as follow_up,
              report_status, visibility, report_severity,
              cast(verified_at as timestamptz) as verified_at,
              cast(_loaded_at as timestamptz) as _loaded_at,
              _dlt_id
          from (values
              ('k1', 'r-public', 'water', null, 41.5, -74.25, null, 'hiker', '2026-10-08 15:00:00+00', 'Fixture spring flowing', null, 'verified', 'public', 'info', '2026-10-08 16:00:00+00', '2026-10-09 00:00:00+00', 'd1'),
              ('k2', 'r-moderators', 'safety', null, 41.6, -74.2, null, 'hiker', '2026-10-08 15:10:00+00', 'Fixture note for safety moderators', null, 'verified', 'internal_only', 'serious', '2026-10-08 16:10:00+00', '2026-10-09 00:00:00+00', 'd2'),
              ('k3', 'r-club', 'trail', null, 41.7, -74.15, null, 'hiker', '2026-10-08 15:20:00+00', 'Fixture note for the club', null, 'verified', 'club_only', 'info', '2026-10-08 16:20:00+00', '2026-10-09 00:00:00+00', 'd3'),
              ('k4', 'r-pending', 'water', null, 41.8, -74.1, null, 'hiker', '2026-10-08 15:30:00+00', 'Fixture report awaiting review', null, 'submitted', 'public', 'info', null, '2026-10-09 00:00:00+00', 'd4')
          ) as reports (ourhike_report_key, report_uuid, report_type, poi_id, lat, lon, mile, reporter_type, reported_at, note, follow_up, report_status, visibility, report_severity, verified_at, _loaded_at, _dlt_id)
      - input: ref('int_closures__gate')
        format: sql
        rows: |
          select 'ourhike_reports' as source_key, true as passed, true as may_publish
    expect:
      format: sql
      rows: |
        select
            '2026-10-09T12:00:00Z' as generated_at,
            [cast('{"id":"r-public","type":"water","poi_id":null,"lat":41.5,"lon":-74.25,"mile":null,"reporter_type":"hiker","timestamp":"2026-10-08T15:00:00Z","note":"Fixture spring flowing","follow_up":null,"status":"verified","visibility":"public","severity":"info","verified_at":"2026-10-08T16:00:00Z"}' as json)] as reports

exposures:
  - name: conditions_atc_updates_json
    label: conditions/atc_updates.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      ATC's own Trail Updates (#460 — Publish the ATC's own Trail Updates as
      a static artifact), read by client/src/lib/atcUpdates.ts through
      publishedConditions.ts's PUBLISHED_ATC_UPDATES_KEY: the reviewed rows,
      and the rows ATC posted since the review that its gate publishes
      unreviewed (#963 — Publish the mechanically unambiguous ATC updates
      hourly, without waiting for a person), which never obstruct the trail.
      Rewritten in place under conditions/, outside every release folder.
      Uploaded by publish-conditions.yml from export_atc_updates.py's file
      until stage 4 of #1793 moves the upload to this writer's.
    depends_on:
      - ref('closures', v=1)
      - ref('warnings', v=1)
      - ref('pub_conditions_atc_updates')
    config:
      meta:
        r2_keys: [conditions/atc_updates.json]
        format: json
        # publish-conditions.yml's cron, "40 * * * *", which fires about
        # five times a day (#1346).
        cadence: hourly

  - name: conditions_weather_alerts_json
    label: conditions/weather_alerts.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      Every active NWS alert that reaches a trail square (#1056), the offline
      fallback for a phone that cannot ask NWS itself for its square's zones,
      read by client/src/lib/weatherForecast.ts as WEATHER_ALERTS_KEY, which
      refuses a document whose `payload` is not weather_alerts or whose
      `schema` is not 1. Rewritten in place under
      conditions/, outside every release folder. Uploaded by
      publish-weather.yml from export_weather_alerts.py's file until stage 4
      of #1793 moves it to the conditions job (decision 28a) and the upload to
      this writer's.
    depends_on:
      - ref('warnings', v=1)
      - ref('pub_conditions_weather_alerts')
    config:
      meta:
        r2_keys: [conditions/weather_alerts.json]
        format: json
        # publish-weather.yml's cron, "55 * * * *", until decision 28a moves
        # the alerts to the conditions job's hourly lane.
        cadence: hourly

  - name: conditions_nynjtc_alerts_json
    label: conditions/nynjtc_alerts.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      NYNJTC's Trail Alerts, unplaced and unreviewed, read through
      publishedConditions.ts's PUBLISHED_NYNJTC_ALERTS_KEY. Uploaded by
      publish-conditions.yml from export_nynjtc_alerts.py's file until stage
      4 of #1793.
    depends_on:
      - ref('closures', v=1)
      - ref('warnings', v=1)
      - ref('pub_conditions_nynjtc_alerts')
    config:
      meta:
        r2_keys: [conditions/nynjtc_alerts.json]
        format: json
        cadence: hourly

  - name: conditions_notices_json
    label: conditions/notices.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      Every club's notices in one file (decision 53, phase D: one OrgNotice
      per club notice, decision 51's single notices file), read by
      client/src/lib/publishedConditions.ts as PUBLISHED_NOTICES_KEY and
      chosen for a hiker by client/src/lib/plannedNotices.ts, which shows
      the ones that touch a hike planned to start in the next 7 days
      (decision 66). Decision 67's hazard areas carry their geometry and draw
      where a downloaded trail crosses one. Rewritten in place under
      conditions/, outside every release folder. Published by the dbt path
      of publish-conditions.yml (publish.py with OURHIKE_PHONE_FILES=dbt);
      the exporters' path has no writer for it, so it is uploaded only where
      the dbt path runs.
    depends_on:
      - ref('closures', v=1)
      - ref('warnings', v=1)
      - ref('pub_conditions_notices')
    config:
      meta:
        r2_keys: [conditions/notices.json]
        format: json
        cadence: hourly

  - name: conditions_hazard_areas_json
    label: conditions/hazard_areas.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      Decision 67's hunting areas, shooting sites and burned areas (decision
      84): the hazard rows of conditions/notices.json in a file of their own,
      read by client/src/lib/publishedNotices.ts as
      PUBLISHED_HAZARD_AREAS_KEY at launch, whatever the hiker has planned,
      because decision 77 downloads notices.json only once a hike is
      planned. The map draws an area where a downloaded trail crosses one,
      and a tapped stretch inside it carries the area's advisory. Rewritten
      in place under conditions/, outside every release folder. Published by
      the dbt path of publish-conditions.yml (publish.py with
      OURHIKE_PHONE_FILES=dbt); the exporters' path has no writer for it,
      and a phone without it draws the areas from notices.json where that
      file has reached it, as before this file existed.
    depends_on:
      - ref('closures', v=1)
      - ref('warnings', v=1)
      - ref('pub_conditions_hazard_areas')
    config:
      meta:
        r2_keys: [conditions/hazard_areas.json]
        format: json
        cadence: hourly

  - name: conditions_trail_closures_json
    label: conditions/trail_closures.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      Every club closure for the map (decision 184:
      #1152 — Move OPRHP's temporary closures onto the conditions clock,
      where a safety layer belongs — in its shape C, for every club closure,
      drawn by decision 187): the obstructing rows of conditions/notices.json but
      ATC's, each with its `shape`, an area's place the trail stretches
      inside it, the A.T.'s included (decision 192), or, where none runs
      inside, the area itself (decision 191). Read at launch, whatever the
      hiker has planned, and drawn with the crossed-out mark
      (client/src/lib/closureStyle.ts): a line along its own line, an area's
      trails where they run inside it, a point as one cross; an area with
      no trail inside as a light hatch with no mark on its edge; each from
      the day before its start. Routes still go through them. Rewritten in place under conditions/, outside every
      release folder. Published by the dbt path of publish-conditions.yml
      (publish.py with OURHIKE_PHONE_FILES=dbt); the exporters' path has no
      writer for it, so a bucket the exporters publish answers 404.
    depends_on:
      - ref('closures', v=1)
      - ref('warnings', v=1)
      - ref('pub_conditions_trail_closures')
    config:
      meta:
        r2_keys: [conditions/trail_closures.json]
        format: json
        cadence: hourly

  - name: conditions_notice_states_json
    label: conditions/notice_states.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      The shape of every state a state-wide agency notice names (decision
      76), read by client/src/lib/publishedNotices.ts as
      PUBLISHED_NOTICE_STATES_KEY beside conditions/notices.json, for
      client/src/lib/plannedNotices.ts's one question of it: is a planned
      route inside this state? Never drawn. Its bytes hold between builds,
      so its ETag does too. A monthly node (its upstream is the Census
      Bureau's TIGER/Line file), so the monthly lane's dbt build
      (build-reference.yml) writes it; the exporters' path has no writer for
      it, and a phone without it shows no state-wide notice, as decision 68
      left them.
    depends_on:
      - ref('pub_conditions_notice_states')
    config:
      meta:
        r2_keys: [conditions/notice_states.json]
        format: json
        cadence: monthly

  - name: conditions_closures_json
    label: conditions/closures.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      OurHike's moderator-verified closures, the offline baseline of the live
      closures endpoint, read through publishedConditions.ts's
      PUBLISHED_CLOSURES_KEY. Uploaded by publish-conditions.yml from
      export_conditions.py's file until stage 4 of #1793.
    depends_on:
      - ref('closures', v=1)
      - ref('warnings', v=1)
      - ref('pub_conditions_closures')
    config:
      meta:
        r2_keys: [conditions/closures.json]
        format: json
        cadence: hourly

  - name: conditions_reports_json
    label: conditions/reports.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      Every verified or resolved public report, the offline baseline of the
      live reports endpoint, read through publishedConditions.ts's
      PUBLISHED_REPORTS_KEY. The serious ones are also in the warnings mart.
      Uploaded by publish-conditions.yml from export_conditions.py's file
      until stage 4 of #1793.
    depends_on:
      - ref('pub_conditions_reports')
    config:
      meta:
        r2_keys: [conditions/reports.json]
        format: json
        cadence: hourly

  # The two files below have no writer here, so each exposure names what
  # it reads and the Python that still writes it.
  - name: conditions_notes_json
    label: conditions/notes.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      Each POI's most recent visible field notes (WN11), read by
      client/src/lib/fieldNotes.ts. Baked by export_conditions.py as today;
      no mart owns field notes ("The eleven marts", what reaches a phone from
      no mart), so this reads the staging model of the query's own rows.
    depends_on:
      - ref('base_ourhike__notes')
    config:
      meta:
        r2_keys: [conditions/notes.json]
        format: json
        cadence: hourly

  - name: conditions_disputes_json
    label: conditions/disputes.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      The corroborated disputes, two or more accounts saying a POI is not
      there (WN11), read through publishedConditions.ts's
      PUBLISHED_DISPUTES_KEY. Baked by export_conditions.py as today, from
      no mart.
    depends_on:
      - ref('base_ourhike__disputes')
    config:
      meta:
        r2_keys: [conditions/disputes.json]
        format: json
        cadence: hourly

  - name: conditions_work_projects_json
    label: conditions/work_projects.json
    type: application
    maturity: medium
    owner:
      name: OurHike
    description: >
      The club workdays a hiker can see and join (#760), read through
      publishedConditions.ts's PUBLISHED_WORK_PROJECTS_KEY; workProjects.ts
      gives way to an out-of-date notice after 48 h. The first data in the
      app that expires, so rewritten in place under conditions/, outside
      every release folder, and never in an offline package: a cancelled
      workday clears with the next build (CL18). Uploaded by
      publish-conditions.yml from export_work_projects.py's file until stage
      4 of #1793 moves the upload to this writer's.
    depends_on:
      - ref('pub_conditions_work_projects')
    config:
      meta:
        r2_keys: [conditions/work_projects.json]
        format: json
        cadence: hourly

  # conditions/drought.json (WN12) has no exposure: its fetch is on hold
  # under #1804 — fetch_drought.py fetches droughtmonitor.unl.edu/data/, a
  # path the Drought Monitor's robots.txt disallows for every user agent.
