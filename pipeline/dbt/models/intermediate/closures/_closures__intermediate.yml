  - name: int_closures__club_notices_reads_a_title_s_yearless_start_day_in_the_year_nearest_the_row_s_own_date
    description: >
      A title's start day with no year takes the year that puts it nearest
      the row's own start or edit date, and the closure starts on the later
      of that day and the row's own start. 'beginning 9/1' posted
      2026-08-20 starts 2026-09-01; posted 2026-09-05 it is a closure
      already in force, so it starts on its own date, 2026-09-05, never a
      year later. Across the new year, 'beginning 1/5' posted 2025-12-20
      starts 2026-01-05, and 'beginning 12/28' posted 2026-01-03 is in
      force from its own date, 2026-01-03.
    model: int_closures__club_notices
    overrides:
      vars:
        # Overriding vars replaces them all in a unit test: rule 9's lead.
        notice_season_lead_days: 30
        notices_build_date: "2026-10-15"
    given:
      - input: ref('int_closures__club_notices_unioned')
        rows:
          - {notice_key: 'posted_after_the_day', source_key: 'iata_trail_conditions', club: 'iata', notice_type: 'closures', reader: 'arcgis_layer', listing: 'full', category: null, starts_at: '2026-09-05 00:00:00+00', ends_at: null, rescinded_at: null, source_edited_at: null, source_url: null, locality: null, geom_geojson: '{"type":"Point","coordinates":[-89.5,43.1]}', _loaded_at: '2026-10-15 00:00:00+00', source_id: 'posted_after_the_day', title: 'Hunting Closure beginning 9/1', status: 'yes', narrative: 'The Trail section between Fixture Rd. and Fixture Ln. is closed for private hunting.', site_type: null, season: null, layer_title: 'surveyPoint'}
          - {notice_key: 'posted_before_the_day', source_key: 'iata_trail_conditions', club: 'iata', notice_type: 'closures', reader: 'arcgis_layer', listing: 'full', category: null, starts_at: '2026-08-20 00:00:00+00', ends_at: null, rescinded_at: null, source_edited_at: null, source_url: null, locality: null, geom_geojson: '{"type":"Point","coordinates":[-89.5,43.1]}', _loaded_at: '2026-10-15 00:00:00+00', source_id: 'posted_before_the_day', title: 'Hunting Closure beginning 9/1', status: 'yes', narrative: 'The Trail section between Fixture Rd. and Fixture Ln. is closed for private hunting.', site_type: null, season: null, layer_title: 'surveyPoint'}
          - {notice_key: 'posted_before_new_year', source_key: 'iata_trail_conditions', club: 'iata', notice_type: 'closures', reader: 'arcgis_layer', listing: 'full', category: null, starts_at: '2025-12-20 00:00:00+00', ends_at: null, rescinded_at: null, source_edited_at: null, source_url: null, locality: null, geom_geojson: '{"type":"Point","coordinates":[-89.5,43.1]}', _loaded_at: '2026-10-15 00:00:00+00', source_id: 'posted_before_new_year', title: 'Hunting Closure beginning 1/5', status: 'yes', narrative: 'The Trail section between Fixture Rd. and Fixture Ln. is closed for private hunting.', site_type: null, season: null, layer_title: 'surveyPoint'}
          - {notice_key: 'posted_after_new_year', source_key: 'iata_trail_conditions', club: 'iata', notice_type: 'closures', reader: 'arcgis_layer', listing: 'full', category: null, starts_at: '2026-01-03 00:00:00+00', ends_at: null, rescinded_at: null, source_edited_at: null, source_url: null, locality: null, geom_geojson: '{"type":"Point","coordinates":[-89.5,43.1]}', _loaded_at: '2026-10-15 00:00:00+00', source_id: 'posted_after_new_year', title: 'Hunting Closure beginning 12/28', status: 'yes', narrative: 'The Trail section between Fixture Rd. and Fixture Ln. is closed for private hunting.', site_type: null, season: null, layer_title: 'surveyPoint'}
