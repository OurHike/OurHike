          - {source_key: club_ok, club: a, notice_type: warnings, reader: page_notice, listing: full, raw_table: raw_a__club_ok, staged_by: stg_a__club_ok, steward_kind: club}
          - {source_key: club_held, club: b, notice_type: closures, reader: arcgis_layer, listing: full, raw_table: raw_b__club_held, staged_by: stg_b__club_held, steward_kind: club}
      - input: ref('stg_registry__sources')
        rows:
          - {source_key: club_ok, provider: 'Fixture Club A', title: 'Fixture A notices'}
          - {source_key: club_held, provider: 'Fixture Club B', title: 'Fixture B closures'}
      - input: ref('notice_hazard_areas')
        rows: []
      - input: ref('notice_states')
        rows: []
      - input: ref('int_closures__nynjtc_checked')
        rows: []
      - input: ref('int_closures__gate')
        rows:
          - {source_key: club_ok, passed: true, may_publish: true, rows_total: 1}
          - {source_key: club_held, passed: false, may_publish: true, rows_total: 2}
      - input: ref('base_extract__runs')
        rows:
          - {table_name: raw_a__club_ok, outcome: loaded, checked_at: '2026-10-04 10:00:00+00'}
    expect:
      rows: []

  - name: pub_conditions_notices_writes_while_a_held_source_this_build_read_no_rows_of_has_none_to_carry
    model: pub_conditions_notices
    description: >
      The other half of DBT-10's rule: a held source this build read no rows
      of (its table absent, never loaded, or an empty read nothing proves),
      with nothing to carry, does not stop the file. With the history on, no
      file this history wrote carried a row of it either, and holding the
      file for it would stop every club's notices for as long as one source
      is never read (the writer's header).
    overrides:
      macros:
        python_run_stamp: "'2026-10-04T12:00:00Z'"
        when_row_history_is_off: ""
    given:
      - input: ref('closures', v=1)
        rows: []
      - input: ref('warnings', v=1)
        format: sql
        rows: |
          select
              'club_ok:1' as warning_id,
              'org_notice' as warning_kind,
              'a' as club,
              'club_ok' as source_key,
              cast(null as boolean) as obstructs_trail,
