  - name: int_closures__club_notices_reads_a_notice_by_its_own_words_against_one_vocabulary_for_every_source
    description: >
      Decision 190 (the maintainer's poll of 2026-10-14: "Do by their own
      words. But make this logic that applies everywhere."), rule 2 in
      order, on rows modelled on the live reads of 2026-10-14. IDPR's
      route orders close by their own words or their layer's own name, the
      one barring any use whose note calls the trail non-motorized among
      them, the one barring it on weekdays, and the 'partial' one whose
      segment is possibly closed; the three barring motorized use alone are
      nothing for a hiker, read in a narrative or written 'motorvehicles'.
      IDPR's areas: a closure type closes where its title says closure too,
      a public-use or human exclusion closes, a campground area whose order bars entry outright closes, a
      fire closure barring public entry closes beside an OHV ban (a broad
      bar beats a motorized word), an OHV or motorized-only restriction is
      nothing for a hiker, and a foot-only basin and a seasonal parking
      restriction stay notices. Precedence: a status saying not current
      beats a closing category; a word that outranks the status closes
      beside 'Open'; a blank status beside a source's stated ones, and a
      status of 0 on a scale rather than a flag, say nothing; a closed site
      is a notice and a closed trail of the same layer closes; a page's
      title is never read for a closure; Michigan's foot-travel status says
      closed beside a 'Motorized' category and closes, and its 'Temporarily
      Open Reroute' stays a notice; a closure with a detour is a notice; a
      layer's title that says alert or notice stops its layer's name, and
      one that says closed closes; CTSST's one-letter 'C' closes through
      notice_word_overrides. The maintainer's three fixes of 2026-10-15: a
      word-silent row closes by its layer's own name only where that name
      says closures ('TemporaryClosure' does, 'surveyPoint' does not); a
      closed site is a notice, by its type ('Campground Camping', or any
      type that names no trail, 'Viewing Scenery'), by its layer's name
      ('Campground Status') or by its title's last-named thing ('Trail
      Parking Lot'), unless its title or type names the trail ('Creek
      Trail #101', 'Day Hiking', 'Horse Camp Trail'), and IDPR's
      campground area whose order bars entry still closes; an area that
      names only a road is a notice ('Seasonal Road Closures on ...') where
      'Area and Road Closures' closes, and a line that names a road closes
      its own line. A category's 'closure' is the kind of notice:
      a forest order typed 'Safety Closure' closes where its title names
      closures, and stays a notice where it names an act ('Forest Wide -
      Alcohol') or a restriction, as does a trail club's 'Closure' alert
      titled by place alone. The vocabulary is mocked as the seed files are
      (tests/test_dbt_closures_club_notices.py).
    model: int_closures__club_notices
    given:
      - input: ref('int_closures__club_notices_unioned')
