version: 2

sources:
  - name: nps
    description: >
      NPS's registered layers, landed by the extract's nps/ folder
      (pipeline/extract/nps/) as raw_nps__<key>, and staged once each by a
      base model here. Descriptions transcribed from sources.json's titles.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_nps__nps_trails
        data_tests:
          # Rows sharing base_nps__trails's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'nps_trails'", "geometryid"]
        description: >
          Trails in National Park Service units (nationwide) (sources.json
          `nps_trails`). Key: GEOMETRYID unique on 31,484 of 31,484 live rows;
          the layer has no GlobalID.
