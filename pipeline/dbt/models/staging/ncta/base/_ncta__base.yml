version: 2

models:
  - name: base_ncta__trail
    data_tests:
      # Warns when the dedupe dropped any row, each an exact copy
      # (duplicates_are_exact on the raw table), and is an error once the
      # copies are half the raw table (decision 204, the generic test's).
      - equal_rowcount_to_raw:
          arguments:
            compare_model: source('ncta', 'raw_ncta__ncta_trail')
    description: >
      North Country National Scenic Trail (NCTA's own layer), every row, keyed
      and deduped. Nothing reads it yet: the stage-3 unions of #1793 do.
    columns:
      - name: trail_segment_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          ncta_trail, globalid, the registry key first and then the columns
          measured unique for this layer.
        data_tests: [not_null, unique]
