    description: >
      PO01, PO02, PO04, PO30, PO31, PO32 and PO37, and every refusal before
      the public flags: each ATC layer typed whole (the Communities at low),
      opentrail's `w` and `s` and an icon that publishes nothing (read before
      the geometry, as unify_all_sources() reads it), a row with no geometry,
      an id from the feature's own top-level id, DEC's sentinels as no name,
      the three typed layers' value maps folded and stripped, a named
      exclusion with its reason in the organization's own casing, a value no
      map knows, and a Point with no coordinates, no geometry and a line.
      tests/test_dbt_points_of_interest_parity.py runs unify_all_sources()
      over raw files written from the A.T. rows and build_records() on each
      other row, and holds every id, type, confidence, name and reason to
      them. The registry entries are sources.json's own, trimmed to the keys
      a rule reads.
