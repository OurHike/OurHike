          config:
            severity: warn
    description: >
      NYC Parks Trails (five boroughs), every row, keyed and deduped. Nothing
      reads it yet: the stage-3 unions of #1793 do.
    columns:
      - name: trail_segment_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          nyc_parks_trails, geometry_key(geom), date_collected, the registry
          key first and then the columns measured unique for this layer.
        data_tests: [not_null, unique]
  - name: base_nycparks__nyc_public_restrooms
