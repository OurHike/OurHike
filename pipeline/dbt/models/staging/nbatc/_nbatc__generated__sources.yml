# GENERATED by pipeline/make_dbt_staging.py from sources.json
# and the extract's club folders; edit them or it, never this file.
version: 2

sources:
  - name: nbatc
    description: >
      The layers sources.json registers for the extract's nbatc/ folder
      (pipeline/extract/nbatc/) that pipeline/make_dbt_staging.py stages, landed as
      raw_nbatc__<key> and staged once each by a generated base model here. Descriptions
      transcribed from sources.json's titles and key notes.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      meta:
        cadence: monthly
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_nbatc__nbatc_blue_blazer
        config:
          # Read off a PDF, which the fixture warehouse never holds (Table.read_from_pdf):
          # its fct_sources_without_freshness row in dbt_project_evaluator_exceptions.csv says why.
          freshness: null
        data_tests:
          # Rows sharing base_nbatc__nbatc_blue_blazer's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'nbatc_blue_blazer'", "number"]
        description: >
          NBATC Blue Blazer Program form (home.nbatc.org/pdfs/BlueBlazeTrailHike.pdf)
          (sources.json `nbatc_blue_blazer`). Key: `number`, the trail's place in the
          table: unique on all 20 rows read 2026-10-04, as are the names.
      - name: raw_nbatc__nbatc_shelters
        data_tests:
          # Rows sharing base_nbatc__nbatc_shelters's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'nbatc_shelters'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
                row_id_columns: ["objectid", "objectid_1", "objectid_12", "oid", "esri_oid", "fid", "ogc_fid", "_dlt_id", "_socrata_id", "feature_index", "feature_id"]
        description: >
          NBATC shelters (KML, 2013) (sources.json `nbatc_shelters`). Key: The geometry
          alone: unique on 12 of 12 (measured 2026-10-04). `name` is also unique.
      - name: raw_nbatc__nbatc_trail_features
        data_tests:
          # Rows sharing base_nbatc__nbatc_trail_features's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'nbatc_trail_features'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
                row_id_columns: ["objectid", "objectid_1", "objectid_12", "oid", "esri_oid", "fid", "ogc_fid", "_dlt_id", "_socrata_id", "feature_index", "feature_id"]
        description: >
          NBATC trail features: bridges, parking, summits and crossings (KMZ)
          (sources.json `nbatc_trail_features`). Key: The geometry alone: unique on 25 of
          25 (measured 2026-10-04). `name` is also unique.
      - name: raw_nbatc__nbatc_trail_info
        data_tests:
          # Rows sharing base_nbatc__nbatc_trail_info's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'nbatc_trail_info'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
                row_id_columns: ["objectid", "objectid_1", "objectid_12", "oid", "esri_oid", "fid", "ogc_fid", "_dlt_id", "_socrata_id", "feature_index", "feature_id"]
        description: >
          NBATC trail information points (KML, 2013) (sources.json `nbatc_trail_info`).
          Key: The geometry alone: unique on 12 of 12 (measured 2026-10-04). `name` is
          also unique.
      - name: raw_nbatc__nbatc_trails
        data_tests:
          # Rows sharing base_nbatc__nbatc_trails's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'nbatc_trails'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
                row_id_columns: ["objectid", "objectid_1", "objectid_12", "oid", "esri_oid", "fid", "ogc_fid", "_dlt_id", "_socrata_id", "feature_index", "feature_id"]
        description: >
          NBATC trails: the A.T. and side trails the club maintains (KML) (sources.json
          `nbatc_trails`). Key: The geometry alone: unique on 49 of 49 (measured
          2026-10-04). `name` is 48 of 49.
