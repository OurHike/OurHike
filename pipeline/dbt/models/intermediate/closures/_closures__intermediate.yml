  - name: int_closures__club_notices_holds_back_what_its_own_dates_and_status_say_is_not_current
    description: >
      Decision 53's phase C rules on a club notice, one row each: a stated
      end date already past holds the notice back with that reason, and
      USFS R06's 'Active' or CDPR's 'Full Closure' beside it is never read
      as closed now; the same status before its end, or with none, closes
      the trail; a status the source uses for not current (CDPR's OPEN)
      holds it; an unlisted status (Partial Closure) is a warning nobody
      reviewed; a rescinded order is held; a seasonal closure whose own start
      has not come is held, and closes once it has; a notice its club files under
      warnings never closes a trail; place is the source's own geometry or
      nothing, its locality its own words; the title's entities are read
      as Python's html.unescape reads them; the edit stamp is printed in
      UTC; a row with no id of its own is named by its key. A hazard area
      whose own category says the hazard is not there (IATA's 'No hunting')
      is held with its category in the reason, one whose category is listed
      (compared without case or surrounding space) is not, and a hazard
      source listed for every row (BAER) keeps every row (decision 67). The
      status and hazard seeds are mocked as the seed files are
      (tests/test_dbt_closures_club_notices.py).
    model: int_closures__club_notices
    given:
      - input: ref('int_closures__club_notices_unioned')
        rows:
          - {notice_key: 'k01', source_key: 'usfs_r06_fire_closure_lines', club: 'usfs', notice_type: 'closures', reader: 'arcgis_layer', listing: 'full', category: null, starts_at: null, ends_at: '2001-06-01 07:00:00+00', rescinded_at: null, source_edited_at: null, source_url: null, locality: null, geom_geojson: null, _loaded_at: '2026-10-03 00:00:00+00', source_id: 'g01', title: 'Fixture Fire Area Closure', status: 'Active'}
