version: 2

models:
  - name: base_wa_rco__trails
    data_tests:
      # Says how many rows the dedupe dropped. Each is an exact copy
      # (duplicates_are_exact on the raw table), so this only reports.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('wa_rco', 'raw_wa_rco__wa_rco_trails')
          config:
            severity: warn
    description: >
      Washington State Trails Database, every row, keyed and deduped. Nothing
      reads it yet: the stage-3 unions of #1793 do.
    columns:
      - name: trail_segment_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          wa_rco_trails, globalid, the registry key first and then the columns
          measured unique for this layer.
        data_tests: [not_null, unique]
