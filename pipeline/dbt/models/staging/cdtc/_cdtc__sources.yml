version: 2

sources:
  - name: cdtc
    description: >
      CDTC's registered layers, landed by the extract's cdtc/ folder
      (pipeline/extract/cdtc/) as raw_cdtc__<key>, and staged once each by a
      base model here. Descriptions transcribed from sources.json's titles.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_cdtc__cdtc_centerline
        data_tests:
          # Rows sharing base_cdtc__centerline's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'cdtc_centerline'", "state"]
        description: >
          Continental Divide National Scenic Trail (CDTC) (sources.json
          `cdtc_centerline`). Key: STATE, 8 of 8 live rows, one row per state.
