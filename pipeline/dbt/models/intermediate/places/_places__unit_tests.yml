version: 2

# The places family's unit tests (stage 3 of #1793 — Rebuild the data platform
# as dlt → dbt: seven contracted marts, a monthly refresh, published docs, and
# lighter phone downloads), one per case of tests/test_export_places.py, named
# for it, on the model where that case's rule now lives. Each expectation is
# what export_places.py answers on the same rows: tests/test_dbt_places_parity.py
# writes each test's given rows out as the files the exporter reads, runs it,
# and holds its answer to the rows below. Numbers a hiker reads (a point, a box,
# the miles) are JSON text here, because a dbt 2.0.6 unit test compares a
# DOUBLE only to one decimal place.
unit_tests:
  - name: places_a_park_is_one_row_however_many_polygons_the_layer_holds
    model: int_places__park_units
    description: >
      Mirrors
      tests/test_export_places.py::TestParks::test_a_park_is_one_row_however_many_polygons_the_layer_holds.
    given:
      - input: ref('base_oprhp__park_polygons')
        rows:
          - {"park_polygon_key": "park-polygon-0", "source_row": 0, "globalid": "g1", "name": "Hudson Highlands", "masterareaid": 127, "category": "State Park", "geom": "POLYGON ((-74.0 41.0, -73.9616 41.0, -73.9616 41.02894, -74.0 41.02894, -74.0 41.0))", "_loaded_at": "2026-10-02 00:00:00+00"}
          - {"park_polygon_key": "park-polygon-1", "source_row": 1, "globalid": "g2", "name": "Hudson Highlands", "masterareaid": 127, "category": "State Park", "geom": "POLYGON ((-73.9424 41.0, -73.90400000000001 41.0, -73.90400000000001 41.02894, -73.9424 41.02894, -73.9424 41.0))", "_loaded_at": "2026-10-02 00:00:00+00"}
      - input: ref('stg_registry__sources')
        rows:
          - {"source_key": "oprhp_park_polygons", "file_row": 0, "provider": "NYS OPRHP", "entry": "{\"key\": \"oprhp_park_polygons\", \"provider\": \"NYS OPRHP\", \"kind\": \"external_arcgis_layer\", \"name_field\": \"Name\", \"id_field\": \"GlobalID\", \"unit_field\": \"MasterAreaID\"}"}
      - input: ref('int_sources__publication')
        rows:
          - {"source_key": "oprhp_park_polygons", "may_publish": true}
      - input: ref('stg_registry__organizations')
        rows:
          - {"steward_id": "org:nysoprhp", "provider": "NYS OPRHP", "org_state": "NY"}
    expect:
      rows:
        - {"place_id": "oprhp_park_polygons:127", "name": "Hudson Highlands", "category": "State Park", "state": "NY", "unit_order": 0, "polygons": 2}
  - name: places_two_parks_sharing_a_name_stay_two_rows
    model: int_places__park_units
    description: >
