version: 2

models:
  - name: base_patc__patc_lands_compilation
    data_tests:
      # Says how many rows the dedupe dropped. Each is an exact copy
      # (duplicates_are_exact on the raw table), so this only reports.
      # A raw table that never landed passes (tests/generic/).
      - equal_rowcount_to_raw:
          arguments:
            compare_model: source('patc', 'raw_patc__patc_lands_compilation')
          config:
            severity: warn
    description: >
      PATC Lands Compilation (v1.0.0), every row, keyed and deduped (decision 40), the layer's
      own columns under dlt's names. Its sources.json row reads `reaches_hikers: false`, so
      int_sources__publication holds it back from every mart. int_places__unioned reads it
      through stg_patc__places.
    columns:
      - name: place_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          patc_lands_compilation, geometry_key('geom'), the registry key first and then
          the fields measured unique for this layer.
