# GENERATED by pipeline/make_dbt_staging.py from sources.json
# and the extract's club folders; edit them or it, never this file.
version: 2

sources:
  - name: ata
    description: >
      The layers sources.json registers for the extract's ata/ folder (pipeline/extract/ata/)
      that pipeline/make_dbt_staging.py stages, landed as raw_ata__<key> and staged once each
      by a generated base model here. Descriptions transcribed from sources.json's titles and
      key notes.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      meta:
        cadence: monthly
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_ata__ata_arizona_trail
        data_tests:
          # Rows sharing base_ata__ata_arizona_trail's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'ata_arizona_trail'", "globalid"]
        description: >
          Arizona National Scenic Trail, the trail's 44 passages (ATA) (sources.json
          `ata_arizona_trail`). Key: GlobalID: unique and non-null on all 44 rows
          (measured 2026-10-03 over every row's attributes).
      - name: raw_ata__ata_mountain_bike_passages
        data_tests:
          # Rows sharing base_ata__ata_mountain_bike_passages's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'ata_mountain_bike_passages'", "globalid"]
        description: >
          Arizona Trail passages for mountain bikes (ATA) (sources.json
          `ata_mountain_bike_passages`). Key: GlobalID: unique and non-null on all 50 rows
          (measured 2026-10-03 over every row's attributes).
      - name: raw_ata__ata_passages
        data_tests:
          # Rows sharing base_ata__ata_passages's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'ata_passages'", "link"]
        description: >
          Arizona Trail passages (aztrail.org/explore/passages/) (sources.json
          `ata_passages`). Key: `link`, the passage's own page: unique on all 44 rows read
          2026-10-04, as are the names ('Passage 1: Huachuca Mountains').
      - name: raw_ata__ata_water_cache_boxes
        config:
          # Read off a PDF, which the fixture warehouse never holds (Table.read_from_pdf):
          # its fct_sources_without_freshness row in dbt_project_evaluator_exceptions.csv says why.
          freshness: null
        data_tests:
          # Rows sharing base_ata__ata_water_cache_boxes's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'ata_water_cache_boxes'", "farout_waypoint"]
        description: >
          Arizona Trail Bear Box/Water Cache Locations (ATA's PDF) (sources.json
          `ata_water_cache_boxes`). Key: `farout_waypoint`, the FarOut waypoint the table
          names as closest to each box: unique on 22 of 22 (measured 2026-10-04 on the
          live PDF, parsed as extract/_pdf_points.py parses it). `name` and the geometry
          are 22 of 22 too.
