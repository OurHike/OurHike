  - name: int_trail_lines__at_published_cuts_every_coordinate_and_never_degenerates_a_line
    description: >
      Decision 8's 6-decimal cut of trails.geojson, which no A.T. pytest names,
      as export_nearby_trails._rounded_geometry cuts the network's: every
      coordinate rounded as Python's round() rounds it, near-half values
      included, and a line the cut would leave with a part of fewer than two
      distinct vertices kept whole at full precision. The chains come first in
      their numbering, then the side trails and spurs in the layer's order; a
      side trail carries no miles. Keyed in trail_line_id.
      tests/test_dbt_trail_lines_parity.py runs _rounded_geometry() over the
      same lines.
    model: int_trail_lines__at_published
    given:
      - input: ref('int_trail_lines__at_chain_miles')
        rows:
          - {trail_line_id: "centerline:chain:0", source_key: "centerline", club: "atc", chain_index: 0, name: null, blaze_color: "White", geom_wkt: "LINESTRING (-74.0000001234 41.0, -73.9 41.1)", vertex_miles_json: "[0.0,8.512]", monotonic_breaks: 0}
      - input: ref('int_trail_lines__at_side_trails')
        rows:
          - {trail_line_id: "side_trails:sql::every_coordinate_is_cut_to_six_decimals_as_round_cuts_it", source_key: "side_trails", club: "atc", source_order: 4, source_row: 0, blaze_color: "Blue", is_spur: false, geom_wkt: "LINESTRING (-74.12345678901 41.00000049999, -74.1234565 41.0000005, -74.9999995 41.9999994999)", spur_junction_mile: null}
          - {trail_line_id: "side_trails:sql::a_line_the_cut_would_collapse_keeps_full_precision", source_key: "side_trails", club: "atc", source_order: 4, source_row: 1, blaze_color: "Blue", is_spur: false, geom_wkt: "LINESTRING (-73.9950001 41.0040001, -73.9950002 41.0040002)", spur_junction_mile: null}
          - {trail_line_id: "side_trails:sql::a_multilinestring_with_one_collapsing_part_keeps_full_precision_whole", source_key: "side_trails", club: "atc", source_order: 4, source_row: 2, blaze_color: "Blue", is_spur: false, geom_wkt: "MULTILINESTRING ((-74.0 41.0, -74.01 41.01), (-73.9950001 41.0040001, -73.9950002 41.0040002))", spur_junction_mile: null}
          - {trail_line_id: "side_trails:sql::a_spur_is_published_as_a_spur", source_key: "side_trails", club: "atc", source_order: 4, source_row: 3, blaze_color: "Blue", is_spur: true, geom_wkt: "LINESTRING (-74.0 41.0, -74.0 41.003)", spur_junction_mile: 12.345}
          - {trail_line_id: "side_trails:test_export_trails::test_side_trails_get_no_miles", source_key: "side_trails", club: "atc", source_order: 4, source_row: 4, blaze_color: "Blue", is_spur: false, geom_wkt: "LINESTRING (-74.0 41.0, -74.003 41.0)", spur_junction_mile: null}
    expect:
