    description: >
      ATC's official A.T. Community towns, in stg_atc__shelters' shape. They
      publish as resupply at confidence 'low', a designation proxy rather
      than a verified store; that call is the poi_type_mapping seed's
      `communities` row, held to export_poi.py's DIRECT_SOURCES by
      tests/test_dbt_seed_sync.py.
    columns:
      - name: poi_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          communities, globalid,
          the registry key first and then the columns measured unique for
