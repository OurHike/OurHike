          - {source_key: club_unproven_empty}
          - {source_key: club_never_loaded}
          - {source_key: club_held_by_the_registry}
          - {source_key: club_never_run}
          - {source_key: club_table_absent}
      - input: ref('int_closures__club_notices')
        format: sql
        rows: |
          select 'club_with_rows' as source_key, cast(1 as bigint) as key_versions
          union all
          select 'club_with_rows', 1
          union all
          select 'club_with_conflicts', 2
          union all
