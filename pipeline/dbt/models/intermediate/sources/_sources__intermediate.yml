  - name: int_sources__publication_holds_words_no_decision_answers
    description: >
      Rule 5 (pipeline/ELT.md, "Who may publish"), one row per branch, each
      shipping by its own registry row so that rule 5 is what decides it:
      words that restrict nothing, disclaimers cut out before they are
      read, a restriction answered by a decision the row's licence names
      and the same words where it names none, an answer on the wrong
      basis, a condition no decision can answer, words no phrase
      explains (the backstop), a row the registry holds back, which
      still carries rule 5's verdict, the inventory's own narration of a
      terms read (never the source's words), and a club's copyright line
      that decision 55's facts and a link answer. The seeds are mocked as the seed
      files are (tests/test_dbt_publication_rule_five.py).
    model: int_sources__publication
    given:
      - input: ref('stg_registry__sources')
        rows:
          - {source_key: 'no_words', provider: 'A', kind: 'club_arcgis_layer', reaches_hikers: true, licence_basis: 'public_gis', entry: '{"licence": "decision 21a"}'}
          - {source_key: 'none_stated', provider: 'A', kind: 'club_arcgis_layer', reaches_hikers: true, licence_basis: 'public_gis', entry: '{"terms": "None stated: the item''s licenseInfo and accessInformation and the service''s copyrightText are all empty (read 2026-10-03).", "licence": "PUBLIC GIS (decision 21a)"}'}
          - {source_key: 'disclaimer_only', provider: 'A', kind: 'club_arcgis_layer', reaches_hikers: true, licence_basis: 'stated_by_org', entry: '{"terms": "The Fixture Service shall not be held liable for improper or incorrect use of the data. The Fixture Service gives no warranty, expressed or implied, as to the accuracy of these data. These data are not legal documents and are not intended to be used as such.", "licence": "Stated by the organization."}'}
          - {source_key: 'property_answered', provider: 'A', kind: 'club_arcgis_layer', reaches_hikers: true, licence_basis: 'public_gis', entry: '{"terms": "This wildlife distribution map is a product and property of Fixture Parks and Wildlife.", "licence": "PUBLIC GIS (decision 21a). Decision 37 extends the presumption over the item''s property statement."}'}
          - {source_key: 'property_unanswered', provider: 'A', kind: 'club_arcgis_layer', reaches_hikers: true, licence_basis: 'public_gis', entry: '{"terms": "This map is a product and property of Fixture Parks and Wildlife.", "licence": "Presumed reusable under decision 21(a)."}'}
          - {source_key: 'sale_on_a_notice', provider: 'A', kind: 'club_arcgis_layer', reaches_hikers: true, licence_basis: 'maintainer_authorisation', entry: '{"terms": "Any sale of this map or information on this map is prohibited except by written permission of Fixture County.", "licence": "MAINTAINER AUTHORISATION on decision 55 (facts and a link)."}'}
          - {source_key: 'sale_on_the_wrong_basis', provider: 'A', kind: 'club_arcgis_layer', reaches_hikers: true, licence_basis: 'stated_by_org', entry: '{"terms": "Any sale of this map or information on this map is prohibited except by written permission of Fixture County.", "licence": "Facts and a link under decision 55."}'}
          - {source_key: 'condition_cannot_be_met', provider: 'A', kind: 'club_arcgis_layer', reaches_hikers: true, licence_basis: 'public_gis', entry: '{"terms": "This line is not intended for trip planning.", "licence": "decisions 21a and 38"}'}
          - {source_key: 'condition_honoured', provider: 'A', kind: 'club_arcgis_layer', reaches_hikers: true, licence_basis: 'public_gis', entry: '{"terms": "Shared under CC BY-SA 4.0.", "licence": "PUBLIC GIS (decision 21a); the share-alike notice travels with derived files under decision 38."}'}
          - {source_key: 'words_no_phrase_explains', provider: 'A', kind: 'club_arcgis_layer', reaches_hikers: true, licence_basis: 'public_gis', entry: '{"terms": "For use by club members only.", "licence": "decision 21a"}'}
          - {source_key: 'public_domain_purposes', provider: 'A', kind: 'club_arcgis_layer', reaches_hikers: true, licence_basis: 'stated_by_org', entry: '{"terms": "These data should be used for administrative purposes only.", "licence": "PUBLIC DOMAIN, on 17 U.S.C. 105."}'}
          - {source_key: 'clearinghouse_redistribution', provider: 'D', kind: 'club_arcgis_layer', reaches_hikers: true, licence_basis: 'maintainer_clearinghouse', entry: '{"terms": "Secondary Distribution of the data is not allowed.", "licence": "Listed in the NYS GIS Clearinghouse, so decisions 20 and 22 publish it."}'}
          - {source_key: 'verbatim_words', provider: 'A', kind: 'club_arcgis_layer', reaches_hikers: true, licence_basis: 'public_gis', entry: '{"terms_verbatim": "Copyright Fixture Trust. All rights reserved.", "licence": "decision 21a"}'}
          - {source_key: 'narration_only', provider: 'A', kind: 'published_notices', reaches_hikers: true, licence_basis: 'maintainer_authorisation', entry: '{"terms": "None found: no terms page is linked from the post (footer scanned for terms, privacy, legal and copyright links: only Facebook).", "licence": "Facts and a link only, on decision 55"}'}
          - {source_key: 'copyright_on_a_notice', provider: 'A', kind: 'published_notices', reaches_hikers: true, licence_basis: 'maintainer_authorisation', entry: '{"terms": "The site footer: \"Copyright 2012 - Fixture Trail Association. All rights reserved.\" No terms page.", "licence": "MAINTAINER AUTHORISATION on decision 55 (facts and a link)"}'}
