      no `current_until`, and the phone never reads it as current. A start
      date alone bounds nothing, so a notice dated only by a fire's start
      has none either. The key is written null, never left out: a row
      without it reads as carrying no verdict, which only a file from
      before the field and decision 156's standing hazard areas say.
    overrides:
      macros:
        python_run_stamp: "'2026-10-10T12:00:00Z'"
        when_row_history_is_off: ""
    given:
      - input: ref('closures', v=1)
