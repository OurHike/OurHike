        - {"trail_line_id": "oprhp_trails:3", "length_m": 8046.72, "published_length_m": 8046.72}
  - name: int_trail_lines__network_overview_routes_answers_what_through_routes_answers
    description: >
      One run of rows per pytest case of the through-route rule (#1307,
      #1776; TL12, TL21): a trail of 50 miles or more in one row or in
      sections that meet is a through route; one name in two places, or
      two organizations sharing a name, is not; two spellings the alias
      table folds into one trail chain as one, under the trail's name. The
      100 m line is _simplified_part_by_part()'s, so a MultiLineString
      carrying a ring a few metres round is simplified everywhere but the
      ring. tests/test_dbt_trail_lines_network_parity.py runs
      _through_routes() over these rows with the same aliases.
    model: int_trail_lines__network_overview_routes
    given:
      - input: ref('int_trail_lines__network_navigation')
