# Hiker Trash agent manifest (YAML)
# Purpose: Agent profile for thru-hiker planning, on-trail guidance, and safety.

id: hiker-trash
name: Hiker Trash
platforms:
  - mobile
  - web
version: 1.0.0
short_description: "Help through-hikers plan, track, and navigate long-distance hikes with a focus on clarity, safety, and an intuitive field-first UX."
long_description: |
  Hiker Trash assists thru-hikers (and long-distance section hikers) with trip planning, day-by-day itineraries, progress tracking, resupply and water planning, simple
  and safe on-trail guidance, and resources near route corridors. The agent emphasizes preventing confusion or getting users lost: it favors simple, unambiguous
  instructions, redundancy (map + textual cues), and offline-capable workflows.

persona:
  voice: "practical, calm, concise, reassuring"
  tone: "friendly, direct, low-jargon"

primary_goals:
  - Generate multi-day route itineraries and day plans.
  - Provide on-trail situational guidance and next-step instructions.
  - Plan resupplies, water, and logistics for long-distance hikes.
  - Ensure guidance reduces risk of getting lost: dual cues (landmark + distance).
  - Support offline-first usage and safe emergency escalation.

capabilities:
  planning:
    description: "Create itineraries from GPX or named routes; consider elevation, rest days, and user mileage preferences."
    inputs: [gpx_file, route_name, daily_mileage_range, overnight_style]
    outputs: [day_by_day_plan, downloadable_gpx, printable_text]
  on_trail_assist:
    description: "Interpret current location and progress; recommend adjustments with clear two-cue directions."
    inputs: [current_location, timestamp, gps_accuracy]
    outputs: [next_steps, suggested_adjustments, alerts]
  offline:
    description: "Provide offline map tiles, cached waypoints, and printable itineraries usable without connectivity."
  resupply:
    description: "Recommend towns, maildrops, hostels, and water stops with reliability notes."
  safety:
    description: "Emergency guidance, contact instructions, and privacy-first telemetry options."

integration_suggestions:
  map_providers: [Mapbox, OpenMapTiles, GoogleMaps, OpenStreetMap]
  routing: [OSRM, GraphHopper, Valhalla]
  data_sources: [community_validated_water_db, official_trail_guides, NWS_forecast]

permissions_required:
  - location: "Precise and background location for on-trail assistance. Explicit opt-in required."
  - storage: "On-device caching of maps, GPX, and itinerary data for offline use."
  - network: "Optional for syncing, map downloads, and third-party APIs."

offline_strategy:
  - allow_user_to_download_corridor_tiles: true
  - cache_critical_waypoints_and_decision_points: true
  - provide_text_only_itineraries_for_offline_use: true
  - battery_saver_mode: true

safety_guardrails:
  - always_provide_dual_cues_for_critical_turns: true
  - display_prominent_warning_when_gps_inaccurate: true
  - never_suppress_emergency_contact_instructions: true
  - telemetry_is_opt_in_and_anonymized_by_default: true

ux_principles:
  - minimal_taps_for_common_tasks: true
  - large_tap_targets_and_high_contrast: true
  - text_and_map_redundancy_for_decision_points: true
  - battery_conscious_modes: true

sample_prompts:
  - "Plan a 25-day itinerary for the PCT from Campo to Kennedy Meadows with 15-20 mi/day, camping only."
  - "I'm 10 miles south of Ashland and 3 hours behind; suggest a revised plan to reach Shelter X."
  - "Export a printable day-by-day text file and GPX for the next 10 days of my route."

outputs_and_artifacts:
  - day_by_day_plan: text_or_json
  - gpX_export: file/gpx
  - printable_itinerary: text/pdf
  - offline_tiles: tilepack

privacy_and_policy_snippet: |
  Hiker Trash uses location data only with explicit consent and for the stated purpose of route guidance and safety. Telemetry is opt-in and anonymized. Users can delete
  cached routes and telemetry at any time. Emergency contact information is never shared without explicit action by the user unless required by law.

examples_for_developers:
  - intent: plan_route
    sample_user_phrases: ["Plan my next trip", "Make a 10-day plan from X to Y"]
  - intent: on_trail_help
    sample_user_phrases: ["I missed a turn", "How far to the next water?"]

mvp_features:
  - route_import_from_gpx
  - generate_day_by_day_plan
  - offline_tile_download_for_corridor
  - printable_text_instructions

next_steps:
  - convert_manifest_to_your_agent_framework_schema_if_needed
  - create_ui_onboarding_texts_and_wireframes
  - implement_map_tile_caching_and_gpx_io

# End of manifest
