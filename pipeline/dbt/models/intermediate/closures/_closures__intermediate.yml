          - {word: 'closed', read_in: 'status category title narrative layer', matches: 'words', reads_as: 'closes_trail', outranks_status: 'false', category_needs_title: 'false', why: 'The source''s own word that the trail, road or area is closed. It reads every notice_status_values value read as closing that holds it: ''Closed'', Michigan''s six and TDEC''s ''Temporarily Closed'' values, ''Closed Repairs'' and Florida''s eight ''Closed-<reason>'' values. 3,403 statuses and 385 titles in the live read; 2,999 of the statuses are USFS recreation sites''. In a layer''s own name too: Santa Clara County Parks'' ''Areas Closed to the Public'', Portland Parks'' ''Closed Assets'' (layer documents read 2026-10-15) Read in a narrative only to say whether a row whose title or category closes an activity also closes the trail (the activity closures): IATA''s ''is closed Sept. 1 - Jan. 5 for private hunting'''}
          - {word: 'closure', read_in: 'status category title narrative layer', matches: 'words', reads_as: 'closes_trail', outranks_status: 'false', category_needs_title: 'true', why: 'As ''closed'': ''Full Closure'' (King County, California State Parks) and ''Temporary Closure'' (USACE), their notice_status_values rows, and in the live read IDPR''s area types (''Area Closure'', ''Fire Area Closure''), USFS forest orders'' ''Safety Closure'' and ''Closure for Resource Protection'', Superior NF''s ''Closure Order''. Not ''closures'' outside a title, where it names a topic in a feed''s category (''Closures and NTH North''). In a category it names the kind of notice the source files the row as, not a state, so it closes the trail only where the row''s title holds a closing word too (category_needs_title): USFS''s forest orders are typed ''Safety Closure'', ''Closure for Resource Protection'' or ''Recreation Closure'' whatever they bar (''Forest Wide - Alcohol'', ''Reckless Driving''). In the live read 90 of R04''s 131 orders so typed, 7 of R03''s 38 and 165 of Superior''s 168 ''Closure Order'' points (159 of them untitled) name no closure in their titles, and stay notices. A category that is the word alone, ''Closure'' or ''Closed'', is no kind beside others but the row''s whole statement, so on a placed row it closes by itself (rule 1, the maintainer''s poll of 2026-10-15): CDTC''s 18 current ''Closure'' alerts, titled by place (''Camp Creek Fire''), close, where until then they stayed notices. In a layer''s own name it is what the layer holds, never a kind needing a title: Superior''s ''Closure_Point'', Region 6''s ''Region6FireClosureLine'', WSPRC''s ''TemporaryClosure'' (layer documents read 2026-10-15, a capital after a small letter read as a new word) Read in a narrative only to say whether a row whose title or category closes an activity also closes the trail (the activity closures): IATA''s ''is closed Sept. 1 - Jan. 5 for private hunting'''}
          - {word: 'closures', read_in: 'title layer', matches: 'words', reads_as: 'closes_trail', outranks_status: 'false', category_needs_title: 'false', why: 'The plural, in a title alone: a placed row''s headline naming its closures, which agrees with a category''s ''closure'' too: 9 of USFS R04''s orders in the live read, ''Big Cottonwood Trail Closures'' among them (the order its sources.json notes cite as in force), and R03''s ''Tonto Creek Crossing Road Closures''. A page, a feed item or a post is never placed, so a headline such as ''Current Trail Closures'' is read for no closure, and a category''s ''Closures'' names a feed''s topic (''Closures and NTH North''). In a layer''s own name too, where it names what the layer holds (the maintainer''s poll of 2026-10-15: a layer closes by its own name only if that name says so): IDPR''s ''Emergency Route Closures'', Yosemite''s ''Trail Closures (Yosemite)'', FLTC''s ''Closures_'' (layer documents read 2026-10-15)'}
          - {word: 'yes', read_in: 'status', matches: 'exact', reads_as: 'stands', outranks_status: 'false', category_needs_title: 'false', why: 'An on/off flag''s yes (CDTC''s Active, Wisconsin DNR''s Active_Flag, IATA''s posted: 140 rows in the live read): the row stands and says nothing of the trail, so where it is the whole status a closures layer''s own name speaks for the row'}
          - {word: 'restriction', read_in: 'status category title layer', matches: 'words', reads_as: 'not_a_closure', outranks_status: 'false', category_needs_title: 'true', why: 'As ''alert'': restrictions that are not closures stay notices, USFS forest orders'' ''Recreation Restriction'' and ''Fire Restriction - Stage 1'', IDPR''s ''Seasonal Area Restriction'' and ''Off-Route Restriction''. In a category it is the kind of order the source files the row as, as ''closure'' is (category_needs_title), so it never keeps the row''s title from speaking: a title''s unqualified closing word outranks it (rule 2, the maintainer''s poll of 2026-10-15). USFS R04''s ''Roaring River & William Pogue NRT Trail Closure'', typed ''Other Restriction'', closes, where until then it stayed a notice'}
          - {word: 'planned', read_in: 'status category title layer', matches: 'words', reads_as: 'not_a_closure', outranks_status: 'false', category_needs_title: 'false', why: 'As ''potential'''}
          - {word: 'partial', read_in: 'status category title layer', matches: 'words', reads_as: 'partly', outranks_status: 'false', category_needs_title: 'false', why: 'A closure that leaves part open: California State Parks'' ''Partial Closure'' (28 in the live read), read as a notice where its notice_status_values left it unread. In a title it says which part a line draws, so a closures layer''s row still closes (IDPR''s Porters Trail Partial Closure)'}
          - {word: 'boat launch', read_in: 'title category layer site_type', matches: 'words', reads_as: 'a_site_not_the_trail', outranks_status: 'false', category_needs_title: 'false', why: 'As ''campground'''}
          - {word: 'trail', read_in: 'title category site_type', matches: 'words', reads_as: 'names_a_trail', outranks_status: 'false', category_needs_title: 'false', why: 'A row that names a trail is about the trail (the maintainer''s poll of 2026-10-15: ''A USFS recreation row whose own name says trail keeps closing''): it outranks a site its category, type or layer name gives, and a site word in its title only where the site is named after it (''Horse Camp Trail'' is a trail, ''Trail Creek Trailhead'' a site), and it keeps an area that names a road a closure of more than the road'}
          - {word: 'road', read_in: 'title category', matches: 'words', reads_as: 'names_a_road', outranks_status: 'false', category_needs_title: 'false', why: 'A closure whose words name only roads closes the road, not the trails around it (the maintainer''s poll of 2026-10-15): an area that names a road and no area, trail or entry is a notice. USFS R04''s ''Seasonal Road Closures on the Evanston/Mt. View Ranger Districts'' and ''Forest Road Closure'' (live 2026-10-15); a line keeps closing its own road (IDPR''s road orders)'}
          - {word: 'area', read_in: 'title category layer', matches: 'words', reads_as: 'names_an_area', outranks_status: 'false', category_needs_title: 'false', why: 'An area word keeps an order that names a road a closure of the area too (''Area and Road Closures on the Heber-Kamas Ranger District'', USFS R04, live 2026-10-15; the maintainer''s poll of 2026-10-15). A layer''s own name counts as words of every row in it (rule 5, the maintainer''s poll of 2026-10-15): a polygon of Santa Clara''s ''Areas Closed to the Public'' titled ''Summit Road'' is a closed area, not a road, where until then it stayed a notice beside its 64 siblings'}
          - {word: 'areas', read_in: 'title category layer', matches: 'words', reads_as: 'names_an_area', outranks_status: 'false', category_needs_title: 'false', why: 'As ''area'''}
          - {word: 'impassable', read_in: 'status category title', matches: 'words', reads_as: 'closes_trail', outranks_status: 'true', category_needs_title: 'false', why: 'NGPC''s Condition ''Impassable'' (2 of 29): a section that cannot be passed closes the trail however its Road_Status reads, so it outranks a status read as not current; its notice_category_values row'}
          - {word: 'reroutes', read_in: 'status category title layer', matches: 'words', reads_as: 'a_way_around', outranks_status: 'false', category_needs_title: 'false', why: 'As ''reroute'', its plural: CDTC''s layer ''Reroutes'' (rule 5, a layer''s own name read as every row''s words), whose line ''Hopewell Lake Construction Closure'' is the way around the closure, not the closure, and which the rule 8 would otherwise cross out (UA''s notices.json of 2026-10-15 21:26 UTC)'}
          - {word: 'hunting', read_in: 'status category title layer', matches: 'words', reads_as: 'names_an_activity', outranks_status: 'false', category_needs_title: 'false', why: 'As ''collection''. IATA''s four ''Hunting Closure beginning …'' titles still close: their own narrative says the trail section ''is closed'' (int_closures__club_notices'' rule 2)'}
          - {word: 'collection', read_in: 'status category title layer', matches: 'words', reads_as: 'names_an_activity', outranks_status: 'false', category_needs_title: 'false', why: 'A closing word right after an activity closes the activity, not the trail (the maintainer''s poll of 2026-10-15, ''Activity closures don''t close''): USFS R04''s ''Spring Mountains National Recreation Area Butterfly Collection Closure Area'', typed ''Other Restriction'', bars collecting butterflies (UA''s notices.json of 2026-10-15 21:26 UTC)'}
          - {word: 'beginning', read_in: 'status category title layer', matches: 'words', reads_as: 'states_a_start', outranks_status: 'false', category_needs_title: 'false', why: 'A start stated only in words. It qualifies a closing word beside it, as ''potential'' does, unless a title states the day after it, which int_closures__club_notices reads (macros/notice_title_start_day.sql) as the day the closure starts: IATA''s ''Hunting Closure beginning 9/1'' and ''beginning 10/15'' (posted ''yes'', 4 rows read live 2026-10-15) close from that day, which the review of 2026-10-15 (S1-4) found read as notices for ever, and Wisconsin DNR''s ''… Closed (Beginning Fall 2027)'', with no day, stays a notice (25 titles of 9 sources hold one of the three words in the live read of 2026-10-15)'}
          - {word: 'lanes', read_in: 'status title category', matches: 'words', reads_as: 'names_a_road', outranks_status: 'false', category_needs_title: 'false', why: 'A road''s lanes: the Work Zone Data Exchange''s vehicle_impact (''all-lanes-closed'' on all 63 of NPS''s road events read 2026-10-15, ''some-lanes-closed'' on 4) says what is closed is a road''s traffic, so a warnings-filed row that names it is a road, not the trail (the rule 8 refined, the maintainer''s poll of 2026-10-15, ''Roads stay notices''). Read in a status too, where the feed says it'}
      - input: ref('notice_word_overrides')
        rows: []
      - input: ref('notice_hazard_areas')
        rows: []
      - input: ref('notice_category_labels')
        rows: []
      - input: ref('notice_issuers')
        rows:
          - {source_key: 'fixture_fire_orders', field: 'Agency', code: '2-USFS', label: 'US Forest Service', why: 'Invented, as the layer''s own domain would give it'}
          - {source_key: 'fixture_fire_orders', field: 'Agency', code: '3-BLM', label: 'Bureau of Land Management', why: 'Invented, as the layer''s own domain would give it'}
      - input: ref('int_closures__steward_areas')
        format: sql
