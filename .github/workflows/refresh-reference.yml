# The monthly lane: dlt extracts every monthly resource, dbt builds the
# warehouse and every mart, and the dbt writers' files are staged as a UA
# release. Designed in pipeline/ELT.md, "Workflows", for #1793 - Rebuild the
# data platform as dlt -> dbt: seven contracted marts, a monthly refresh,
# published docs, and lighter phone downloads.
#
# NOTHING HERE CAN REACH PRODUCTION (ELT.md, "Why a scheduled run cannot
# reach production"; .github/tests/test_refresh_reference.py holds it):
#   - No input names an environment, and both publish steps ("Publish to UA"
#     and "Put the podcast list in place on UA") set OURHIKE_DATA_ENV to the
#     literal `ua`. publish.py scopes every key it
#     writes by that value (lib/data_env.py).
#   - Phones follow channels.json (decision 44), which only the release
#     train uploads (`publish.py --channels`).
#   - Promotion is the release train's, built from this run's pinned inputs
#     (steps/raw_inputs/<raw_run>/), so what is promoted is what UA showed.
#
# FIVE JOBS, EACH HOLDING ONLY ITS OWN CREDENTIALS:
#   extract  R2_RAW_* and HIKEFINDER_PASSWORD, no public-bucket key. Lands
#            every monthly resource in the private raw store (`our-hike-raw`,
#            decision 43), checked before and after the load, plus the
#            as-landed copy the parity job reads, and OSM's fourteen
#            Geofabrik extracts as files at most once in 30 days (#1652).
#   build    R2_RAW_* only, writing only under steps/ and history/monthly/.
#            Scans the extracts for water, pins the raw inputs and the
#            scans, builds the warehouse and marts from the pin with the row
#            history restored and saved, hands files on.
#   publish  The public bucket's R2_* only: publish.py, OURHIKE_PHONE_FILES=dbt.
#   confirm  No credential. Fails unless UA's latest.json names every phone
#            file the build wrote.
#   parity   R2_RAW_* to read the pin; writes nothing. Today's exporters
#            against the dbt writers on the pinned inputs (decision 30).
#
# NOT HERE YET: `notes` (decision 14's note ageing), `verify`
# (verify-release.yml has no workflow_call), the cell and shard cutters
# (cut_cells.py and cut_trail_graph.py read the exporters' files, not
# data/processed/dbt/), and `maintain`, which waits for DuckLake (ELT.md
# stage 3).
name: Refresh reference data

on:
  schedule:
    # 05:15 UTC on the 3rd (ELT.md, "The schedule: 05:15 UTC on the 3rd"):
    # clear of the hourly slots (:07, :37, :40, :55) and of every daily or
    # weekly job in .github/workflows/README.md. Off the 1st only by analogy
    # with avoiding :00 (@unvalidated: GitHub's load by day of month is
    # unmeasured; scheduled runs' queue delays on the 1st against other days
    # would settle it). Schedules fire from main only. If the last run on main
    # whose "Confirm UA serves what the build wrote" job passed is over 35
    # days old, check-upstream-freshness.yml reports it in #478 - Upstream
    # data freshness, and a dispatch is the fallback.
    - cron: "15 5 3 * *"
  # No inputs, on purpose: the environment is not a choice here.
  workflow_dispatch:

# ONE RUN AT A TIME, because this workflow is the only writer of the raw
# store's monthly prefix and of the step cache under steps/ (ELT.md, "One
# catalog per lake, one writer"). The cost: GitHub keeps one pending run
# per group, so a dispatch made while another is queued replaces it
# without going red.
concurrency:
  group: raw-lake-monthly
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  # dlt's telemetry is on by default and would send from a job holding R2
  # write keys (the dlt skill, rule 3). Every job here inherits this.
  RUNTIME__DLTHUB_TELEMETRY: "false"
  # dbt's documented opt-out, and the only switch set (pipeline-tests.yml's
  # dbt job says why: the dbt Product Licensing Agreement, section 3.2).
  DBT_ENGINE_SEND_ANONYMOUS_USAGE_STATS: "false"

jobs:
  extract:
    name: Extract the monthly resources into the raw store
    runs-on: ubuntu-latest
    # Measured: the full extract took 1 h 48 m on run 37058045092 and 1 h 45 m
    # on 37081046157 (2026-10-02/03), of which Hike Finder's crawl delay is
    # about 64 min for its 386 requests (the dlt skill, "Terms are never routed
    # around"). 120 left 12 minutes, so the limit was 180. Decision 54's
    # layers took run 37182708502's extract step (run 13) to 161.5 min, about
    # 50 of it reading one layer at a time and about 103 normalizing in one
    # process (extract/_run.py's MONTHLY_NORMALIZE_WORKERS). The reads now run four
    # folders at a time and normalize on four processes, and each request ArcGIS
    # Online throttles may wait 450 s (lib/arcgis.py's THROTTLE_WAITS_SECONDS).
    # Monthly runs 18 to 22 (2026-10-04/05) took the extract step 105 to 127
    # minutes (the Actions API's step times, read 2026-10-06), so 240 keeps run
    # 13's figure with 78 minutes to spare and the slowest since with 113. Their
    # "Seconds:" lines, which split reading from normalizing, were not read.
    #
    # OSM'S EXTRACTS ADD TO IT ONCE IN 30 DAYS (#1652, extract/_geofabrik.py):
    # 3.44 GB from Geofabrik, which build-basemap.yml fetched in under 1.5 min
    # (run 30957719854: 12.5 min end to end, Planetiler about 11 of them), then
    # put into R2 (@unvalidated: the runner-to-R2 rate for a file this size is
    # unmeasured). The resource starts no download after 20 minutes
    # (DOWNLOAD_BUDGET_SECONDS), so its worst case is about 20 min plus one
    # extract's own transfer, say 30: 161.5 + 30 = 191.5 of the 240.
    timeout-minutes: 240
    outputs:
      raw_run: ${{ steps.extract.outputs.raw_run }}
      partial: ${{ steps.extract.outputs.partial }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-extract.txt

      # Stops here, naming each missing secret, rather than failing somewhere
      # inside dlt (ELT.md, "Secrets and buckets"). HIKEFINDER_PASSWORD only
      # warns: without it Hike Finder is read anonymously, and the resource's
      # listing guard refuses a locked export.
      - name: Name every secret this job needs, and stop if one is missing
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          R2_RAW_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          R2_RAW_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          HIKEFINDER_PASSWORD: ${{ secrets.HIKEFINDER_PASSWORD }}
        run: |
          missing=()
          for name in R2_ENDPOINT_URL R2_RAW_BUCKET R2_RAW_ACCESS_KEY_ID R2_RAW_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Raw store secrets missing::${missing[*]} not set; nothing was extracted (pipeline/ELT.md, Secrets and buckets)."
            exit 1
          fi
          if [ -z "$HIKEFINDER_PASSWORD" ]; then
            echo "::warning title=HIKEFINDER_PASSWORD is not set::NYNJTC's Hike Finder is read as an anonymous reader this run."
          fi

      # requirements-extract.txt alone: dlt and its 41 dependencies stay out
      # of every job that holds the public bucket's keys (CONTRIBUTING.md,
      # "Changing a Python dependency"; ELT.md's dlt configuration table).
      - name: Install the extract's own pins
        run: |
          python -m venv "$RUNNER_TEMP/extract"
          "$RUNNER_TEMP/extract/bin/pip" install --quiet -r requirements-extract.txt

      # extract/_run.py's after-run check failing exits 1 after the run log
      # is written, and nothing it loaded is read. A layer whose read fails,
      # or which the run check or dlt's schema contract refuses, is left out
      # on its own while the rest load (_run.py's ISOLATING_LANES): its last
      # committed table stands, and the run exits 3, which this step turns
      # into `partial` so the build reads what did load and the last job
      # still goes red. The step summary names each layer and why. --as-landed writes each ArcGIS, Socrata and opentrail layer
      # back out as today's fetcher's file, under as_landed/<load_id>/, for
      # the parity job. --cross-lane-inputs also reads the one hourly-lane
      # table a monthly node needs (_run.py's ALSO_READS). The run's id is
      # the raw_run every later job names.
      - name: Extract every monthly resource
        id: extract
        env:
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          # `auto` is R2's documented region. dlt has written R2 with it on
          # publish-conditions run 481 and on this lane's run 37081046157.
          DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: auto
          HIKEFINDER_PASSWORD: ${{ secrets.HIKEFINDER_PASSWORD }}
          # The NPS Data API's places and campgrounds (decision 54 waves 2
          # and 3, extract/_ogc.py's JsonFeatures). Unset, both tables are
          # withdrawn with a warning and the run stays green; their base models
          # read an absent table as no rows (dbt/macros/raw_or_empty.sql).
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: |
          set +e
          "$RUNNER_TEMP/extract/bin/python" -m extract._run --lane monthly \
            --bucket-url "s3://$R2_RAW_BUCKET/raw/dlt/monthly" \
            --as-landed --cross-lane-inputs --normalize-workers 4 \
            --report-json "$RUNNER_TEMP/extract_run.json" --summary "$GITHUB_STEP_SUMMARY"
          status=$?
          set -e
          raw_run=""
          if [ -f "$RUNNER_TEMP/extract_run.json" ]; then
            raw_run=$(python -c 'import json, sys; print(json.load(open(sys.argv[1])).get("run_id") or "")' "$RUNNER_TEMP/extract_run.json")
          fi
          echo "raw_run=$raw_run" >> "$GITHUB_OUTPUT"
          {
            echo "## Monthly extract"
            echo
            echo "raw_run: \`${raw_run:-none}\`, exit $status"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 3 ]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
            status=0
          fi
          exit "$status"

      - name: Keep the run's own report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-extract-report
          path: ${{ runner.temp }}/extract_run.json
          retention-days: 90
          if-no-files-found: warn

  build:
    name: Pin the raw inputs, build the warehouse and every mart
    needs: extract
    runs-on: ubuntu-latest
    # @unvalidated: the dbt build on real data is untimed (ELT.md, "Runtime").
    # The DEM index is 3m45s (publish-vector-data.yml, run #120) and the
    # profile's sampling 1m01s; the vector build's own timeout is 180 min.
    # Measured: the steps before build_marts.py took 31-43 min (runs
    # 37109384156, 37121837559, 37132427696 and 37182708502, the pin 27-38 of
    # them); build_marts.py has failed within 9 min on every run so far, so
    # its own share has never been timed.
    #
    # THE WATER SCANS ADD, ON A FIRST ATTEMPT (#1652), bounded from figures
    # this repository already holds rather than measured here:
    #   - the pull of 3.44 GB from R2: @unvalidated, 6 min at 10 MB/s;
    #   - fetch_osm_water.py's scan: under 15 min, the ~15 min
    #     publish-vector-data.yml's include_osm_water gives for download and
    #     scan together;
    #   - fetch_trail_water.py --derive: ~30 min, include_trail_water's own
    #     figure (21 NHD subregions, the OSM stream scan, EPQS);
    #   - step_osm_water_grade.py: Measured 21.3, 41.5 and 54.2 min on monthly
    #     runs 20, 21 and 22 (37296900535, 37323395441, and 37370582492's
    #     attempt 2; 2026-10-05/06), each grading the same 3,118 corridor
    #     points, 1,056 or 1,057 reachable, with no answer carried from an
    #     earlier attempt. Same input at 2.5x the time is EPQS's latency, not
    #     the work (Reasoned). This line used to reason ~13 min from the 207
    #     points of the 2026-08-18 census.
    # About 72 to 105 min in all, on top of 43: 115 to 148 min before dbt's
    # untimed share, which 240 leaves 92 to 125. The EPQS answers and the DEM
    # samples are now carried between attempts (the step "Restore the EPQS
    # answers and the DEM samples"), so a later attempt asks only what an
    # earlier one did not get answered (Reasoned: no attempt has run with them).
    timeout-minutes: 240
    defaults:
      run:
        working-directory: pipeline
    env:
      RAW_RUN: ${{ needs.extract.outputs.raw_run }}
      # The two answer caches publish-vector-data.yml carries in FETCH_OUTPUTS,
      # at the paths the code reads them from (fetch_trail_water.py's
      # ELEVATION_CACHE_PATH, export_elevation.py's SAMPLE_CACHE_PATH;
      # pipeline/tests/test_fetch_cache_paths.py holds them). One home for the
      # list the restore and the save below both read, as FETCH_OUTPUTS is
      # there: actions/cache finds an entry only by the same paths it was
      # saved with.
      ELEVATION_ANSWERS: |
        pipeline/data/raw/epqs_elevations.json
        pipeline/data/raw/elevation/samples.json
    steps:
      - uses: actions/checkout@v7

      # 3.12 for dbt, whose requirements-dbt.txt was compiled on it
      # (pipeline-tests.yml's dbt job); the extract and the pipeline's own
      # pins get venvs of their own, as there.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements-dbt.txt
            pipeline/requirements-extract.txt
            pipeline/requirements.txt

      - name: Name every secret this job needs, and stop if one is missing
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          R2_RAW_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          R2_RAW_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
        run: |
          missing=()
          for name in R2_ENDPOINT_URL R2_RAW_BUCKET R2_RAW_ACCESS_KEY_ID R2_RAW_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Raw store secrets missing::${missing[*]} not set; nothing was built."
            exit 1
          fi
          if [ -z "$RAW_RUN" ]; then
            echo "::error title=No raw_run::the extract job named no run, so there is nothing to pin."
            exit 1
          fi

      # pipeline-tests.yml's dbt job explains both paths and the key.
      - name: Restore dbt's DuckDB driver and v2's spatial extension
        id: dbt-runtime
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/com.getdbt/adbc
            ~/.duckdb/extensions/v1.5.4
          key: dbt-v2-runtime-${{ runner.os }}-${{ hashFiles('pipeline/requirements-dbt.txt') }}

      - name: Install dbt, the extract's pins and the pipeline's pins
        run: |
          pip install --quiet -r requirements-dbt.txt
          python -m venv "$RUNNER_TEMP/extract"
          "$RUNNER_TEMP/extract/bin/pip" install --quiet -r requirements-extract.txt
          python -m venv "$RUNNER_TEMP/pipeline"
          "$RUNNER_TEMP/pipeline/bin/pip" install --quiet -r requirements.txt
          "$RUNNER_TEMP/pipeline/bin/pip" install --quiet "duckdb-extension-spatial==$("$RUNNER_TEMP/pipeline/bin/python" -c 'import duckdb; print(duckdb.__version__)')"
          "$RUNNER_TEMP/pipeline/bin/python" seed_spatial_extension.py

      # The dbt generators' output, which is not committed (pipeline/ELT.md
      # decision 91), written before any dbt command reads the project, on
      # the extract's venv: the generators read its club folders, whose
      # modules import dlt.
      - name: Generate the dbt models (generate_dbt.py)
        run: '"$RUNNER_TEMP/extract/bin/python" generate_dbt.py'

      # dbt's packages: pipeline-tests.yml's dbt job explains the key, why a
      # hit skips deps, and why only a deps that succeeded is saved (ARCH-6 of
      # the PR #1805 review).
      - name: Restore dbt's packages
        id: dbt-packages
        uses: actions/cache/restore@v6
        with:
          path: pipeline/dbt/dbt_packages
          key: dbt-packages-${{ runner.os }}-${{ hashFiles('pipeline/dbt/packages.yml', 'pipeline/dbt/package-lock.yml') }}

      - name: dbt deps
        id: deps
        if: steps.dbt-packages.outputs.cache-hit != 'true'
        working-directory: pipeline/dbt
        run: dbt deps --profiles-dir .

      - name: Save dbt's packages
        if: always() && steps.deps.outcome == 'success' && hashFiles('pipeline/dbt/packages.yml', 'pipeline/dbt/package-lock.yml') != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: pipeline/dbt/dbt_packages
          key: dbt-packages-${{ runner.os }}-${{ hashFiles('pipeline/dbt/packages.yml', 'pipeline/dbt/package-lock.yml') }}

      # THE EPQS ANSWERS AND THE DEM SAMPLES, carried from one attempt to the
      # next (ARC-3 of PR #1805's second review). Without them every attempt
      # re-asked USGS EPQS about the same 3,118 corridor OSM water points, for
      # 21 to 54 min (the job's budget above), and an EPQS outage would leave
      # fewer than build_osm_water_reach.py's MIN_REACHABLE (40) points
      # reachable, so step_osm_water_grade.py would refuse and stop the month
      # (traced in the code, not seen: runs 20 to 22 failed later, out of
      # memory).
      #
      # WHEN A CACHED ANSWER MAY BE USED is the code's, as it is for the
      # vector build, and nothing here widens it:
      #   - fetch_trail_water.elevation_ft() keeps only an answered elevation.
      #     A null, or five failed tries, is never written, so the next
      #     attempt asks again rather than reading a cached unknown.
      #   - export_elevation.py's sample cache is thrown away whole when the
      #     tile index's edition marker moves, and never holds a sample from
      #     a cell whose edition the marker cannot pin (_load_sample_cache,
      #     _sources_with_no_pinned_edition). The index is this run's, from
      #     fetch_elevation.py or the pin, so samples taken against an index
      #     with another marker are not read.
      #   - No verdict is carried: step_osm_water_grade.py checkpoints into a
      #     temporary folder and grades every point again, from the answers.
      #
      # Before the pin's check, unlike every step down to the pin: a rerun
      # that builds from an existing pin still grades and samples. The key is
      # the idiom publish-vector-data.yml's "Restore fetched data" uses (never
      # hit exactly, take the newest entry by prefix); the save is keyed on
      # what it saves (.github/tests/test_cache_keys_are_content_addressed.py).
      #
      # NOT FROM ONE MONTH TO THE NEXT. GitHub evicts an entry nobody reads
      # for 7 days, so the 3rd's run starts cold unless an attempt ran in the
      # week before; this carries answers between attempts and close reruns,
      # the case runs 20 to 22 were. Carrying them across months needs the
      # raw store, which outlives the Actions cache (the pin's extras, as the
      # water scans are carried).
      - name: Restore the EPQS answers and the DEM samples
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ELEVATION_ANSWERS }}
          key: monthly-elevation-answers-${{ github.run_id }}
          restore-keys: monthly-elevation-answers-

      # THE PIN: a write-once copy of this run's raw inputs (ELT.md, "Storage
      # tiers", the raw_inputs row). A rerun builds from the first attempt's
      # pin, so every step down to the pin runs only when there is none.
      - name: Is this raw_run pinned already
        id: pinned
        env:
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: auto
        run: |
          if "$RUNNER_TEMP/extract/bin/python" -m extract._warehouse has-pin --lane monthly \
            --bucket-url "s3://$R2_RAW_BUCKET/raw/dlt/monthly" --steps-url "s3://$R2_RAW_BUCKET/steps" --raw-run "$RAW_RUN"; then
            echo "raw_run $RAW_RUN is already pinned; building from that pin."
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          else
            echo "pinned=false" >> "$GITHUB_OUTPUT"
          fi

      # The as-landed files come down first, because fetch_elevation.py
      # computes the DEM tile index from the A.T. corridor
      # (data/raw/centerline.geojson) and the network's cells
      # (data/processed/nearby_trails.geojson, which export_nearby_trails.py
      # writes first, as publish-vector-data.yml does; used for the cell list
      # only), and fetch_trail_water.py --derive reads ATC's shelters and
      # campsites from them. DEM tiles are read in place (decision 35), so the
      # pin freezes which tiles, not their bytes.
      - name: Today's fetchers' files for this raw_run, and the DEM tile index
        if: steps.pinned.outputs.pinned != 'true'
        env:
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: auto
        run: |
          "$RUNNER_TEMP/extract/bin/python" -m extract._warehouse as-landed --lane monthly \
            --bucket-url "s3://$R2_RAW_BUCKET/raw/dlt/monthly" --steps-url "s3://$R2_RAW_BUCKET/steps" --raw-run "$RAW_RUN" --raw-dir data/raw
          "$RUNNER_TEMP/pipeline/bin/python" export_nearby_trails.py
          "$RUNNER_TEMP/pipeline/bin/python" fetch_elevation.py

      # OSM'S WATER, FROM THE EXTRACTS THE RAW STORE KEEPS (#1652 - Download
      # OSM's Geofabrik extracts at most once a month, into a private raw
      # bucket that outlives the 7-day Actions cache; extract/_geofabrik.py).
      # Each copy the store's index names comes down into data/raw/osm/, held
      # to its sha256, and the last landed scans (the newest earlier pin's)
      # are put where the two scanners write, so each scan's own drop guard
      # compares against them and a refusal leaves them standing. A missing
      # or unreadable copy warns, and the build lands the last landed scans
      # rather than scanning a partial set; with none it says so here, in the
      # run summary, and publishes no OSM water, as before #1652.
      - name: OSM's Geofabrik extracts and the last landed water scans, from the raw store
        id: osm
        if: steps.pinned.outputs.pinned != 'true'
        env:
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: auto
        run: >-
          "$RUNNER_TEMP/extract/bin/python" -m extract._geofabrik pull --lane monthly
          --bucket-url "s3://$R2_RAW_BUCKET/raw/dlt/monthly" --steps-url "s3://$R2_RAW_BUCKET/steps"
          --raw-run "$RAW_RUN" --raw-dir data/raw
          --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"

      # The two scans today's publish runs behind include_osm_water and
      # include_trail_water, over the copies just pulled and nothing fetched:
      # fetch_osm_water.py finds every extract on disk, and --derive reads
      # ATC's sites from the as-landed copy and refuses a missing extract. NHD's
      # subregions and EPQS are read as always. A scan that refuses or fails
      # leaves the last landed one in place (the next step says which landed),
      # so this step never fails the build, and its own timeout is the bound
      # in the job's comment: ~15 + ~30 min, with 30 to spare.
      #
      # DISK: the 14 extracts are 3.44 GB (pipeline/BASEMAP.md, run
      # 30957719854), and fetch_trail_water.py holds one NHD subregion at a
      # time, its ~270 MB zip and the GeoPackage unpacked from it, each
      # deleted before the next (collect_streams). Even all of the "~5.7 GB of
      # USGS subregions" include_trail_water quotes, at once, beside the
      # extracts is 9.1 GB, inside the 14 GB GitHub documents for a hosted
      # runner's disk (and the 88 GB free BASEMAP.md measured on one). The
      # extracts are deleted here, before dbt and the warehouse need the disk.
      - name: Scan the extracts for water (fetch_osm_water.py, fetch_trail_water.py --derive)
        if: steps.pinned.outputs.pinned != 'true' && steps.osm.outputs.extracts == 'complete'
        timeout-minutes: 75
        continue-on-error: true
        run: |
          set +e
          "$RUNNER_TEMP/pipeline/bin/python" fetch_osm_water.py
          osm=$?
          "$RUNNER_TEMP/pipeline/bin/python" fetch_trail_water.py --derive
          site=$?
          set -e
          rm -f data/raw/osm/*-latest.osm.pbf
          if [ "$osm" -ne 0 ]; then
            echo "::warning title=OSM water scan refused or failed::fetch_osm_water.py exited $osm; the build lands the last landed points, if any"
          fi
          if [ "$site" -ne 0 ]; then
            echo "::warning title=Site water derivation refused or failed::fetch_trail_water.py --derive exited $site; the build lands the last landed site water, if any"
          fi

      - name: Say which water scans this build lands
        if: always() && steps.pinned.outputs.pinned == 'false'
        run: |
          rm -f data/raw/osm/*-latest.osm.pbf
          "$RUNNER_TEMP/extract/bin/python" -m extract._geofabrik landed --raw-dir data/raw --summary "$GITHUB_STEP_SUMMARY"

      # The tables, their as-landed files, the DEM index and the water scans,
      # at the paths extract/_geofabrik.py's SCANS names: not the scanners'
      # own, because parity.py's old side would find osm_water.geojson there
      # without the reach file export_poi.py refuses to run without.
      - name: Pin this run's raw inputs
        if: steps.pinned.outputs.pinned != 'true'
        env:
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: auto
        run: |
          store=(--lane monthly --bucket-url "s3://$R2_RAW_BUCKET/raw/dlt/monthly")
          pinned=(--steps-url "s3://$R2_RAW_BUCKET/steps" --raw-run "$RAW_RUN")
          extras=(--extra elevation/tile_index.json=data/raw/elevation/tile_index.json)
          if [ -f data/raw/osm_water.geojson ]; then
            extras+=(--extra derived/osm_water.geojson=data/raw/osm_water.geojson)
          fi
          if [ -f data/raw/trail_water.json ]; then
            extras+=(--extra derived/trail_water.json=data/raw/trail_water.json)
          fi
          "$RUNNER_TEMP/extract/bin/python" -m extract._warehouse pin "${store[@]}" "${pinned[@]}" "${extras[@]}"

      # From the pin alone, as the promotion will, and the pin's as-landed
      # files and DEM index replace whatever the step above left in data/raw.
      - name: Build the warehouse from the pin
        env:
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: auto
        run: >-
          "$RUNNER_TEMP/extract/bin/python" -m extract._warehouse load
          --lane monthly --bucket-url "s3://$R2_RAW_BUCKET/raw/dlt/monthly"
          --steps-url "s3://$R2_RAW_BUCKET/steps" --raw-run "$RAW_RUN"
          --warehouse data/warehouse.duckdb --raw-dir data/raw

      # --lane monthly leaves out every node an hourly or daily source
      # reaches, so UA's conditions/ files stay as the conditions lane wrote
      # them. The pub_ writers run last, so dbt's last manifest and run
      # results, which publish.py reads, are theirs. Its steps land the pin's
      # water scans, which the step above wrote under data/raw/derived/
      # (build_marts.py's lane_args for step_osm_water and step_site_water).
      #
      # THE ROW HISTORY (pipeline/row_history.py): build_marts.py restores
      # the snapshots from history/monthly/ in the raw store's bucket before
      # dbt runs, and saves them back only after the writers succeed, through
      # the extract's venv, which has s3fs. One prefix for this lane; each
      # conditions leg keeps its own. The key is the raw store's own, as for
      # the pin above, under the names dlt reads. A restore that fails, or an
      # empty prefix once row_history_stores.toml lists `monthly`, stops the
      # build before dbt runs, so no run silently dates every row as new.
      - name: dbt build, the Python steps and the pub_ writers (build_marts.py --lane monthly)
        env:
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: auto
        # THE MODELS TAGGED builds_alone BUILD ONE AT A TIME, everything else at
        # dbt's own thread count. Monthly run 20 (37296900535), the first live build
        # past stage A, failed at "what derived.poi_photos unblocks" when
        # int_places__resolved and int_trail_network__cuts built side by side: "Out
        # of Memory Error: failed to allocate data of size 16.0 MiB (12.5 GiB/12.4
        # GiB used)", DuckDB's default limit on this 16 GB runner (Measured
        # 2026-10-05). Both carry the tag, and build_marts.py splits each build
        # around it (its docstring, "A MODEL TAGGED `builds_alone`"). Alone was not
        # enough: monthly run 21 (37323395441) built each by itself and both ran
        # out again, so both queries were rewritten to hold less, and run 22
        # (37370582492) ran the first rewrite of the cuts out too (each model's
        # header says how it holds less now). Whether each fits in the limit is
        # @unvalidated until a monthly run passes that step.
        run: >-
          python build_marts.py --lane monthly --python "$RUNNER_TEMP/pipeline/bin/python"
          --history-url "s3://$R2_RAW_BUCKET/history/monthly" --history-python "$RUNNER_TEMP/extract/bin/python"

      # Also when build_marts.py failed: the answers an attempt paid for are
      # what the next attempt needs, whatever a later step made of them.
      # Keyed on the files, so an attempt that asked nothing new adds no entry,
      # and a rerun (same run_id) can still save what it added.
      - name: Save the EPQS answers and the DEM samples
        if: always() && hashFiles('pipeline/data/raw/epqs_elevations.json', 'pipeline/data/raw/elevation/samples.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ELEVATION_ANSWERS }}
          key: monthly-elevation-answers-${{ hashFiles('pipeline/data/raw/epqs_elevations.json', 'pipeline/data/raw/elevation/samples.json') }}

      - name: Save dbt's DuckDB driver and v2's spatial extension
        if: always() && steps.dbt-runtime.outputs.cache-hit != 'true' && hashFiles('pipeline/requirements-dbt.txt') != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/com.getdbt/adbc
            ~/.duckdb/extensions/v1.5.4
          key: dbt-v2-runtime-${{ runner.os }}-${{ hashFiles('pipeline/requirements-dbt.txt') }}

      # The warehouse beside the manifest that describes it, under ELT.md's
      # key (`steps/dbt_warehouse/<data_environment>/<raw_run>/`): what the
      # parity job reads, and what the hourly lane's --defer and the next
      # monthly build will. Write-once; a rerun keeps the first attempt's.
      - name: Store the warehouse and its manifest in the step cache
        env:
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: auto
        run: >-
          "$RUNNER_TEMP/extract/bin/python" -m extract._warehouse store
          --lane monthly --bucket-url "s3://$R2_RAW_BUCKET/raw/dlt/monthly"
          --steps-url "s3://$R2_RAW_BUCKET/steps" --key "dbt_warehouse/ua/$RAW_RUN"
          data/warehouse.duckdb dbt/target/manifest.json dbt/target/run_results.json

      # The publish, confirm and parity jobs' input. The least common
      # ancestor of these paths is pipeline/, which is where the downloads
      # extract them (.github/tests/test_artifact_handoff_paths.py).
      - name: Hand the phone files on
        uses: actions/upload-artifact@v4
        with:
          name: monthly-phone-files
          path: |
            pipeline/data/processed/dbt/
            pipeline/dbt/target/manifest.json
            pipeline/dbt/target/run_results.json
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Stage a release on UA from the dbt writers' files
    needs: build
    runs-on: ubuntu-latest
    # The literal `ua`, never an expression: an environment with no reviewer
    # (#1330 - A routine UA publish waits on the same production approval as
    # a real release). Nothing in this file can name production.
    environment: ua
    # Every writer of latest.json shares this group: publish() reads, changes
    # and rewrites it (.github/tests/test_publish_concurrency.py).
    concurrency:
      group: publish-data
      cancel-in-progress: false
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/download-artifact@v8
        with:
          name: monthly-phone-files
          path: pipeline/

      # OURHIKE_PHONE_FILES=dbt: each key a dbt exposure names comes from its
      # pub_ writer's file (publish.collect_dbt_phone_files). A writer that
      # did not run keeps the bucket's last good object, and keys no exposure
      # names carry forward from UA's latest.json. publish() stages a release
      # folder when a release-scoped file moved. A v2 file goes into that
      # folder only (publish.release_only()), and the hike details are cut
      # into one object per hike (publish.cut_suggested_hike_details()).
      - name: Publish to UA
        id: publish
        env:
          R2_WRITE_ENABLED: "true"
          OURHIKE_DATA_ENV: ua
          OURHIKE_PHONE_FILES: dbt
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python publish.py

      # podcasts/episodes.json is a live root key, outside every release
      # folder (export_podcasts.py's docstring, on #1683 — Offer podcast
      # episodes picked for the hike, with a one-tap Spotify save and an in-app
      # player; publish.py's LIVE_ROOT_PREFIXES), so it is uploaded on its own, to UA. Production's
      # podcast list stays a dispatch of publish-podcasts.yml.
      - name: Put the podcast list in place on UA
        env:
          R2_WRITE_ENABLED: "true"
          OURHIKE_DATA_ENV: ua
          OURHIKE_PHONE_FILES: dbt
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python publish.py --live podcasts/episodes.json

  confirm:
    name: Confirm UA serves what the build wrote
    needs: [build, publish]
    # Also when publish was cancelled or skipped, the case this job exists
    # for: #1513 - A queued publish is silently cancelled when another one
    # joins publish-data, and it looks like a green build.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/download-artifact@v8
        with:
          name: monthly-phone-files
          path: pipeline/

      # Public HTTPS GETs, no credential. Each phone file written this run
      # must be in UA's latest.json with the sha256 the build wrote, or, for
      # a v2 file, in the manifest of the release folder latest.json names,
      # the one place a v2 file is listed (publish.release_only()).
      # `generated_at` proves nothing: the conditions bake rewrites
      # latest.json too. publish.served_entries() reads both, and sends
      # lib/user_agent.py's USER_AGENT, without which data.ourhike.org
      # answered 403 (monthly run 29's confirm job, 37726904273).
      - name: Every written phone file is what UA's latest.json names
        env:
          DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
        run: |
          if [ -z "$DATA_BASE_URL" ]; then
            echo "::error title=No DATA_BASE_URL::there is no public URL to read UA's latest.json from, so nothing was confirmed."
            exit 1
          fi
          python - <<'PY'
          import os

          import publish

          written = publish.collect_dbt_phone_files().artifacts
          served, urls = publish.served_entries(os.environ["DATA_BASE_URL"], "ua", written)
          wrong = sorted(key for key, entry in written.items() if (served.get(key) or {}).get("sha256") != entry["sha256"])
          print(f"{len(written) - len(wrong)} of {len(written)} phone files the build wrote are what {' and '.join(urls)} name.")
          for key in wrong:
              print(f"::error title=Not on UA::{key}: the build wrote {written[key]['sha256']}, UA names {(served.get(key) or {}).get('sha256')}")
          raise SystemExit(1 if wrong else 0)
          PY

  parity:
    name: Parity with today's exporters, on the pinned inputs
    needs: [extract, build]
    runs-on: ubuntu-latest
    # @unvalidated: today's exporters on real data. export_nearby_trails.py
    # and export_poi.py are the long ones; the vector build's whole export
    # stage fits its 180-minute timeout.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: pipeline
    env:
      RAW_RUN: ${{ needs.extract.outputs.raw_run }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements-extract.txt
            pipeline/requirements.txt

      - name: Name every secret this job needs, and stop if one is missing
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          R2_RAW_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          R2_RAW_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
        run: |
          missing=()
          for name in R2_ENDPOINT_URL R2_RAW_BUCKET R2_RAW_ACCESS_KEY_ID R2_RAW_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Raw store secrets missing::${missing[*]} not set; the pin cannot be read."
            exit 1
          fi

      # Today's exporters import shapely, pyproj, rasterio and requests; the
      # pin is read through the extract's own pins.
      - name: Install the extract's pins and the pipeline's pins
        run: |
          python -m venv "$RUNNER_TEMP/extract"
          "$RUNNER_TEMP/extract/bin/pip" install --quiet -r requirements-extract.txt
          python -m venv "$RUNNER_TEMP/pipeline"
          "$RUNNER_TEMP/pipeline/bin/pip" install --quiet -r requirements.txt
          "$RUNNER_TEMP/pipeline/bin/pip" install --quiet "duckdb-extension-spatial==$("$RUNNER_TEMP/pipeline/bin/python" -c 'import duckdb; print(duckdb.__version__)')"
          "$RUNNER_TEMP/pipeline/bin/python" seed_spatial_extension.py

      - uses: actions/download-artifact@v8
        with:
          name: monthly-phone-files
          path: pipeline/

      # Both sides of parity read the same pin. The dbt side read the pinned
      # tables; today's exporters read the pinned as-landed files at their
      # fetchers' paths under data/raw/ (extract/_run.py says what that copy
      # is and is not), the warehouse the build stored (suggested_hikes
      # routes over its graph), and the reviewed files in git. A family whose
      # input no dlt table holds is recorded as not compared, never passing.
      - name: Today's fetchers' files and the built warehouse, from the pin
        env:
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.R2_RAW_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RAW_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: auto
        run: |
          store=(--lane monthly --bucket-url "s3://$R2_RAW_BUCKET/raw/dlt/monthly")
          "$RUNNER_TEMP/extract/bin/python" -m extract._warehouse load "${store[@]}" \
            --steps-url "s3://$R2_RAW_BUCKET/steps" --raw-run "$RAW_RUN" --raw-dir data/raw
          "$RUNNER_TEMP/extract/bin/python" -m extract._warehouse fetch "${store[@]}" \
            --steps-url "s3://$R2_RAW_BUCKET/steps" --key "dbt_warehouse/ua/$RAW_RUN" --out data warehouse.duckdb

      # DECISION 30's PARITY ON FROZEN INPUTS: one parity.py run per monthly
      # family, pipeline-tests.yml's parity families less the six hourly
      # conditions files. A difference is evidence for the gate, not a failure
      # of this lane, so the step fails only when no family could be compared.
      # Each family's output is kept as <family>.txt, and summary.json gives
      # each `match`, `differs` or `not_compared` (today's exporter could not
      # run: an input no pin holds, or a crash; the log has the traceback).
      # Results go to results/<family>.json for gate_report.py, which refuses
      # any other JSON there, so summary.json sits one level up.
      #
      # --keys-only: the artifact is public, and the old side runs on every
      # layer the pin holds, held-back sources included. So the log and the
      # results name each difference by key and changed fields, never with
      # either record. To see the records, rerun that family's parity.py line
      # without the flag, on this raw_run's pin, as the steps above set it up.
      - name: Parity with today's exporters
        env:
          PARITY_DIR: ${{ runner.temp }}/parity
        run: |
          mkdir -p "$PARITY_DIR"
          "$RUNNER_TEMP/pipeline/bin/python" - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          out = Path(os.environ["PARITY_DIR"])
          python = f"{os.environ['RUNNER_TEMP']}/pipeline/bin/python"
          report = ("--json-dir", str(out / "results"), "--keys-only")
          raw = ("--raw-dir", "data/raw")
          families = {
              "podcasts": ("podcasts_episodes.json", ()),
              "stewards": ("stewards.json", ()),
              "registry": ("registry.json", ()),
              "nearby_trails": ("nearby_trails.geojson", ()),
              "network_overview": ("network_overview.geojson", ()),
              "trails": ("trails.geojson", ()),
              "trail_miles": ("trail_miles.json", ()),
              "trails_overview": ("trails_overview.geojson", ()),
              "spurs": ("spurs.json", ()),
              "club_sections": ("club_sections.json", ()),
              "elevation": ("elevation_profile.json", raw),
              "trail_graph_elevation": ("trail_graph_elevation.json", raw),
              "trail_graph_profile": ("trail_graph_profile.json", raw),
              **{
                  f"poi_{kind}": (f"poi_{kind}.geojson", ())
                  for kind in ("shelter", "campsite", "water", "resupply", "viewpoint", "parking", "privy", "trailhead")
              },
              "nearby_poi": ("nearby_poi.geojson", ()),
              "retired_poi": ("retired_poi.geojson", ()),
              "suggested_hikes": ("suggested_hikes.json", raw),
              "suggested_hikes_detail": ("suggested_hikes_detail.json", raw),
              "highlights": ("highlights.json", raw),
              "places": ("places.json", ()),
              "challenges": ("challenges.json", ()),
              "trail_graph": ("trail_graph.json", ()),
              "trail_graph_geometry": ("trail_graph_geometry.json", ()),
              # Stage 6's v2 files, each against the v1 file this build wrote beside it.
              "elevation_v2": ("elevation_profile_v2.json", ()),
              "trail_miles_v2": ("trail_miles_v2.json", ()),
              **{
                  f"poi_{kind}_v2": (f"poi_{kind}_v2.geojson", ())
                  for kind in ("shelter", "campsite", "water", "resupply", "viewpoint", "parking", "privy", "trailhead")
              },
              "nearby_poi_v2": ("nearby_poi_v2.geojson", ()),
          }
          # parity.py's result_document() outcomes. A family with no results/<family>.json
          # crashed before parity.py's finish() wrote one, so it is not_compared too.
          statuses = {
              "no_differences": "match",
              "neither_writes": "match",
              "differences": "differs",
              "one_side_writes": "differs",
              "old_side_refused": "not_compared",
          }
          summary = {}
          for family, (name, extra) in families.items():
              argv = [python, "parity.py", family, "--new", f"data/processed/dbt/{name}", *extra, *report]
              done = subprocess.run(argv, capture_output=True, text=True)
              (out / f"{family}.txt").write_text(done.stdout + done.stderr)
              result = out / "results" / f"{family}.json"
              status = statuses[json.loads(result.read_text())["outcome"]] if result.exists() else "not_compared"
              summary[family] = {"status": status, "exit_code": done.returncode, "new": f"data/processed/dbt/{name}", "log": f"{family}.txt"}
              print(f"{family}: {status}")
          (out / "summary.json").write_text(json.dumps({"raw_run": os.environ["RAW_RUN"], "families": summary}, indent=2))
          counts = {status: sum(entry["status"] == status for entry in summary.values()) for status in ("match", "differs", "not_compared")}
          print(f"parity on raw_run {os.environ['RAW_RUN']}: {counts}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as page:
              page.write(f"## Parity on raw_run `{os.environ['RAW_RUN']}`\n\n| family | answer |\n|---|---|\n")
              page.writelines(f"| {family} | {entry['status']} |\n" for family, entry in summary.items())
          sys.exit(1 if counts["match"] + counts["differs"] == 0 else 0)
          PY

      # The gate's per-key report, from pipeline/gate_report.py (ELT.md: "every
      # existing R2 key comes out byte-equal, or is listed with a reviewed
      # reason"). With no parity result to read, the step warns rather than
      # inventing a report.
      - name: The gate's per-key report
        env:
          PARITY_DIR: ${{ runner.temp }}/parity
        run: |
          if [ -z "$(find "$PARITY_DIR/results" -name '*.json' -print -quit 2>/dev/null)" ]; then
            echo "::warning title=No parity results for the gate::parity.py wrote no --json-dir result, so gate_report.py has nothing to read."
          else
            "$RUNNER_TEMP/pipeline/bin/python" gate_report.py --parity-dir "$PARITY_DIR/results" --out "$PARITY_DIR/gate"
          fi

      - name: Keep the parity answers for the gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-parity
          path: ${{ runner.temp }}/parity/
          retention-days: 90
          if-no-files-found: warn

  # Last, so a layer refused on its own has not held back the ones that
  # loaded, and the run still goes red for it: decision 30's gate counts "no
  # failed check", and a refusal is one. The hourly legs only warn since
  # decisions 100 and 101, because publish-conditions.yml's dbt source
  # freshness turns a source red within a day; this lane runs no freshness
  # check on live data, so a red there would come a month or more late
  # (Reasoned), and this job keeps its red. The extract job's summary names
  # each layer and why.
  refused:
    name: Fail the run if a layer was refused on its own
    needs: [extract, build, publish, confirm, parity]
    if: always() && needs.extract.outputs.partial == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: |
          echo "::error title=A monthly layer was refused::The extract left at least one layer out, and its last committed table stood in for it. The extract job's summary names it and the reason; everything else loaded."
          exit 1
