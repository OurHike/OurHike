  - name: club_points_type_by_an_allowlist_and_drop_two_types_that_disagree
    model: int_points_of_interest__club_points
    description: >
      A POI type is an allowlist: a value nobody mapped gives no type, a layer-wide row types every
      row of its layer, the published id is `<source_key>:<source_id>` and a name is trimmed, and a
      row two mappings type differently (GMC's VISTA and TOWER flags, here made to disagree) is held
      back rather than given one of them.
    given:
      - input: ref('int_points_of_interest__club_unioned')
        rows:
          - {source_key: 'cdtc_parking', club: 'cdtc', poi_key: 'cp-1', name: '  Fixture Lot  ', category: 'Engineered parking area', source_id: 'cp-1', geom: 'POINT (-108 33)', properties: '{"prktype": "Engineered parking area"}'}
          - {source_key: 'cdtc_parking', club: 'cdtc', poi_key: 'cp-2', name: ' ', category: '<Null>', source_id: 'cp-2', geom: 'POINT (-108 33.01)', properties: '{"prktype": "<Null>"}'}
          - {source_key: 'utah_trailheads', club: 'utah_sgid', poi_key: 'ut-1', name: 'Fixture Trailhead', category: null, source_id: 'ut-1', geom: 'POINT (-111.7 40.6)', properties: '{"primaryname": "Fixture Trailhead"}'}
          - {source_key: 'gmc_viewpoints', club: 'gmc', poi_key: 'gv-1', name: 'Fixture Tower', category: '1', source_id: '{GV-1}', geom: 'POINT (-72.8 44.2)', properties: '{"vista": 1, "tower": 1}'}
      - input: ref('club_poi_types')
        rows:
          - {source_key: 'cdtc_parking', field: 'prktype', value: 'Engineered parking area', poi_type: 'parking', confidence: 'high', evidence: 'Engineered parking area'}
          - {source_key: 'utah_trailheads', field: null, value: null, poi_type: 'trailhead', confidence: 'high', evidence: 'every point'}
          - {source_key: 'gmc_viewpoints', field: 'vista', value: '1', poi_type: 'viewpoint', confidence: 'high', evidence: 'VISTA'}
          - {source_key: 'gmc_viewpoints', field: 'tower', value: '1', poi_type: 'shelter', confidence: 'high', evidence: 'made to disagree'}
      - input: ref('layer_rules')
        rows: []
    expect:
      rows:
        - {poi_key: 'cp-1', name: 'Fixture Lot', poi_type: 'parking', confidence: 'high', rule_drop_reason: null, derived_id: 'cdtc_parking:cp-1'}
        - {poi_key: 'cp-2', name: null, poi_type: null, confidence: null, rule_drop_reason: null, derived_id: 'cdtc_parking:cp-2'}
        - {poi_key: 'ut-1', name: 'Fixture Trailhead', poi_type: 'trailhead', confidence: 'high', rule_drop_reason: null, derived_id: 'utah_trailheads:ut-1'}
        - {poi_key: 'gv-1', name: 'Fixture Tower', poi_type: null, confidence: null, rule_drop_reason: 'two club_poi_types rows type it differently', derived_id: 'gmc_viewpoints:{GV-1}'}

  - name: club_points_publish_a_point_their_layer_lists_twice_once
    model: int_points_of_interest__club_points
    description: >
      A point listed twice is one point: PATC's Tuscarora pages list a section's end under both
      sections it joins, so of a layer's rows that share a name (trimmed and case-folded) and a fix,
      the first by poi_key ships and the others are held as a second listing. A rule holding the
      first back leaves its twin to ship. Another layer's point at the same fix, a same-named point
      a few metres off, and two nameless points at one fix are all left alone.
    given:
      - input: ref('int_points_of_interest__club_unioned')
        rows:
          - {source_key: 'patc_tuscarora_points', club: 'patc', poi_key: 'pt-1', name: 'Fixture Road', category: null, source_id: 'pt-1', geom: 'POINT (-77.9 39.9)', properties: '{"kind": "access", "section": "1"}'}
          - {source_key: 'patc_tuscarora_points', club: 'patc', poi_key: 'pt-2', name: 'fixture road ', category: null, source_id: 'pt-2', geom: 'POINT (-77.9 39.9)', properties: '{"kind": "access", "section": "2"}'}
          - {source_key: 'patc_tuscarora_points', club: 'patc', poi_key: 'pt-3', name: 'Fixture Road', category: null, source_id: 'pt-3', geom: 'POINT (-77.9 39.9001)', properties: '{"kind": "access", "section": "3"}'}
          - {source_key: 'patc_tuscarora_points', club: 'patc', poi_key: 'pt-4', name: null, category: null, source_id: 'pt-4', geom: 'POINT (-77.8 39.8)', properties: '{"kind": "access", "section": "4"}'}
          - {source_key: 'patc_tuscarora_points', club: 'patc', poi_key: 'pt-5', name: null, category: null, source_id: 'pt-5', geom: 'POINT (-77.8 39.8)', properties: '{"kind": "access", "section": "5"}'}
          - {source_key: 'patc_tuscarora_points', club: 'patc', poi_key: 'pt-6', name: 'Fixture Gap', category: null, source_id: 'pt-6', geom: 'POINT (-77.7 39.7)', properties: '{"kind": "access", "section": "6", "status": "closed"}'}
          - {source_key: 'patc_tuscarora_points', club: 'patc', poi_key: 'pt-7', name: 'Fixture Gap', category: null, source_id: 'pt-7', geom: 'POINT (-77.7 39.7)', properties: '{"kind": "access", "section": "7"}'}
          - {source_key: 'utah_trailheads', club: 'utah_sgid', poi_key: 'ut-1', name: 'Fixture Road', category: null, source_id: 'ut-1', geom: 'POINT (-77.9 39.9)', properties: '{"primaryname": "Fixture Road"}'}
      - input: ref('club_poi_types')
        rows:
          - {source_key: 'patc_tuscarora_points', field: 'kind', value: 'access', poi_type: 'trailhead', confidence: 'low', evidence: 'access'}
          - {source_key: 'utah_trailheads', field: null, value: null, poi_type: 'trailhead', confidence: 'high', evidence: 'every point'}
      - input: ref('layer_rules')
        rows:
          - {source_key: 'patc_tuscarora_points', rule: 'drop_where', field: 'status', matches: 'closed', evidence: 'made to hold one listing'}
    expect:
      rows:
        - {poi_key: 'pt-1', rule_drop_reason: null}
        - {poi_key: 'pt-2', rule_drop_reason: 'a second listing of a point its layer already lists'}
        - {poi_key: 'pt-3', rule_drop_reason: null}
        - {poi_key: 'pt-4', rule_drop_reason: null}
        - {poi_key: 'pt-5', rule_drop_reason: null}
        - {poi_key: 'pt-6', rule_drop_reason: 'layer_rules drop_where: status is closed'}
        - {poi_key: 'pt-7', rule_drop_reason: null}
        - {poi_key: 'ut-1', rule_drop_reason: null}

