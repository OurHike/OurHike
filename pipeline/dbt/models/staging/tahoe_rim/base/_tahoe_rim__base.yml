version: 2

models:
  - name: base_tahoe_rim__trail
    data_tests:
      # Says how many rows the dedupe dropped. Each is an exact copy
      # (duplicates_are_exact on the raw table), so this only reports.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('tahoe_rim', 'raw_tahoe_rim__tahoe_rim_trail')
          config:
            severity: warn
    description: >
      Tahoe Rim Trail, every row, keyed and deduped. Nothing reads it yet: the
      stage-3 unions of #1793 do.
    columns:
      - name: trail_segment_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          tahoe_rim_trail, globalid, the registry key first and then the
          columns measured unique for this layer.
        data_tests: [not_null, unique]
