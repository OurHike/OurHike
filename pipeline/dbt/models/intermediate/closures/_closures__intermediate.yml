  - name: int_closures__nynjtc_checked_reads_each_post_as_parse_alert_does
    description: >
      One post per branch of lib/nynjtc_alerts.py's parse_alert(),
      parse_terms(), locality_of() and published_rows(), after the tests in
      tests/test_lib_nynjtc_alerts.py and test_export_nynjtc_alerts.py: an
      entity-escaped title (n01, n02), a literal en dash (n03), an unknown
      term id dropped rather than faked (n04), locality preferring the region,
      then the state, then the park (n01, n02, n04), no tags at all (n03), and
      the four ways a post cannot be read (n10-n13). n05-n08 hold
      python_html_unescape() to html.unescape(): hex and decimal references,
      the Windows-1252 and U+FFFD replacements, a name without its semicolon,
      the double unescape _text_of() does, and an NBSP stripped as whitespace.
      tests/test_dbt_conditions_parity.py runs the Python over these rows and
      fails where the two disagree, except n09 (a named reference this model
      does not decode), n14 and n15 (one slug on two posts) and n16 (a title
      that is not a string), which it lists as deliberate.
    model: int_closures__nynjtc_checked
    given:
      - input: ref('base_nynjtc__nynjtc_trail_alerts')
