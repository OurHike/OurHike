  - name: pub_conditions_reports_writes_only_the_verified_public_reports
    model: pub_conditions_reports
    description: >
      The writer's own filter, the second after the extract's
      PUBLIC_REPORTS_SQL: a report the extract should never have landed is
      left out rather than published. Of a verified public report, a
      verified report for safety moderators (internal_only), a verified one
      for its club (club_only) and a public one still awaiting review
      (submitted), only the first is written. The fixtures hold public
      reports only (make_dbt_fixtures.py), so neither the build nor parity
      reaches this filter; the review of PR #1805 (dlt → dbt re-platform as
      one go/no-go change) found it untested on 2026-10-09.
    overrides:
      macros:
        python_run_stamp: "'2026-10-09T12:00:00Z'"
