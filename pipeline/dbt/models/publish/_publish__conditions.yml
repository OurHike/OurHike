        rows: |
          select
              warning_id,
              'org_notice' as warning_kind,
              'fixture' as club,
              'fixture_club' as source_key,
              cast(null as boolean) as obstructs_trail,
              'not_reviewed' as review_state,
              cast(title as varchar) as title,
              cast(null as varchar) as category,
              cast(null as json) as states,
              cast(null as varchar) as locality,
              cast(null as double) as mile_start,
              cast(null as double) as mile_end,
              cast(starts_on as date) as starts_on,
              cast(ends_on as date) as ends_on,
              cast(updated_at as varchar) as updated_at,
              cast(null as varchar) as source_url,
              cast(null as varchar) as geom_geojson,
              cast(null as timestamptz) as _first_seen_at,
              cast(null as timestamptz) as _changed_at,
              cast(null as timestamptz) as carried_since,
              cast(null as boolean) as stands_until_lifted,
              cast(null as varchar) as issuer
          from (values
              ('fixture_club:e1-last-second-of-a-utc-day', 'Fixture trail work', null, null, '2026-07-12T23:59:59Z'),
