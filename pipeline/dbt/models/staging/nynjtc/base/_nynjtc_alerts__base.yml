version: 2

models:
  - name: base_nynjtc__nynjtc_trail_alerts
    data_tests:
      # Warns when the dedupe dropped any row, each an exact copy
      # (duplicates_are_exact on the raw table), and is an error once the
      # copies are half the raw table (the generic test's).
      - equal_rowcount_to_raw:
          arguments:
            compare_model: source('nynjtc', 'raw_nynjtc__nynjtc_trail_alerts')
    description: >
      NYNJTC's Trail Alerts posts, keyed, with the fields a published row is
      built from and none of NYNJTC's body text. Read by
      int_closures__nynjtc_checked.
    columns:
      - name: trail_alert_key
        description: >
          The row's key: dbt_utils.generate_surrogate_key over
          `nynjtc_trail_alerts` and the post's WordPress id.
        data_tests: [not_null, unique]
      - name: slug
        description: The post's slug, which a published row's notice_id is built from.
      - name: title_json
        description: >
          The post's `title` as WordPress serves it, an object whose
          `rendered` member is the HTML, entities and tags still in.
      - name: modified_at
        description: >
          NYNJTC's own last edit of the alert, site-local time read as UTC
          (a known error of a few hours).
  - name: base_nynjtc__nynjtc_trail_alerts_terms
    data_tests:
      - equal_rowcount_to_raw:
          arguments:
            compare_model: source('nynjtc', 'raw_nynjtc__nynjtc_trail_alerts_terms')
    description: >
      NYNJTC's place terms, one row per term in each of the four taxonomies a
      post is tagged from. Read by int_closures__nynjtc_checked.
    columns:
      - name: place_term_key
        description: >
          The row's key: dbt_utils.generate_surrogate_key over
          `nynjtc_trail_alerts_terms`, the taxonomy and the term's id.
        data_tests: [not_null, unique]
      - name: taxonomy
        description: trail, park, region or state.
        data_tests:
          - accepted_values:
              arguments:
                values: [trail, park, region, state]
      - name: term_name
        description: The term's name as WordPress stores it, HTML-escaped.
