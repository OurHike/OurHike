version: 2

models:
  - name: places
    description: >
      Every place a hiker can name before anything is downloaded, one row
      each: the parks, towns, trailheads, parking areas and long trails
      first run's "where do you hike?" searches (places.json, written by
      pub_places). Every figure is the publisher's own word or a measurement
      over lines this build published, and `trail_miles` is null on every
      row when there were none to measure. Only rows whose source may
      publish (int_sources__publication).
    config:
      access: public
      contract:
        enforced: true
    data_tests:
      # Elementary's checks (decision 102; pipeline/ELT.md, "The checks, and
      # where each goes"), each at warn and run by build_marts.py after the
      # writers: the rows at each build; the rows per club and source, so one
      # club's places vanishing cannot hide inside the total; each column's
      # null rate (no geometry text and no long text here); and the columns
      # places.json reads, its exposure's referenced_columns, which Elementary
      # 0.26.0 can check on dbt 2.0.6 because one phone file reads this mart
      # (points_of_interest's comment says why more could not be).
      - elementary.volume_anomalies:
          config:
            severity: warn
            tags: [elementary_check]
            enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
      - elementary.dimension_anomalies:
          arguments:
            dimensions: [club, source_key]
          config:
            severity: warn
            tags: [elementary_check]
            enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
      - elementary.all_columns_anomalies:
          arguments:
            column_anomalies: [null_percent]
          config:
            severity: warn
            tags: [elementary_check]
            enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
      - elementary.exposure_schema_validity:
          config:
            severity: warn
            tags: [elementary_check]
            enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
      # PL11: miles exactly where something was measured. An unmeasured
      # place must never read as one holding no trail, so a measured run
      # gives every row a figure (0.0 included) and an unmeasured one none.
      - dbt_utils.expression_is_true:
          name: places_trail_miles_are_there_exactly_when_measured
          arguments:
            expression: "(trail_miles is null) = (not trail_miles_measured)"
          config:
            severity: error
      - dbt_utils.expression_is_true:
          name: places_trail_miles_are_never_negative
          arguments:
            expression: "trail_miles is null or trail_miles >= 0"
          config:
            severity: error
      # A park and a long trail carry the box a map fits; a waypoint does
      # not, and its point lies inside the box where there is one.
      - dbt_utils.expression_is_true:
          name: places_a_box_is_a_parks_or_a_trails_and_holds_its_point
          arguments:
            expression: >-
              (bbox is not null) = (kind in ('park', 'trail'))
              and (
                bbox is null
                or (
                  len(bbox) = 4
                  and bbox[1] <= lon and lon <= bbox[3]
                  and bbox[2] <= lat and lat <= bbox[4]
                )
              )
          config:
            severity: error
      # The published waypoint id rides on the waypoint kinds only (PL05),
      # the park a point sits in on a point only (PL09), and the publisher's
      # category on a park only. A trailhead and a parking area always carry
      # one, because they come from the published waypoints; a town carries
      # one where it is a waypoint, and none where it is a club places
      # layer's town (int_places__club_units), which is a place a hiker
      # names and not a waypoint the app opens.
      - dbt_utils.expression_is_true:
          name: places_a_waypoint_id_is_on_a_waypoint
          arguments:
            expression: >-
              (poi_id is null or kind in ('trailhead', 'parking', 'town'))
              and (poi_id is not null or kind not in ('trailhead', 'parking'))
          config:
            severity: error
      - dbt_utils.expression_is_true:
          name: places_within_is_on_a_point_and_category_on_a_park
          arguments:
            expression: >-
              (within_park is null or kind in ('trailhead', 'parking', 'town'))
              and (category is null or kind = 'park')
          config:
            severity: error
      - dbt_utils.unique_combination_of_columns:
          name: places_place_order_is_unique
          arguments:
            combination_of_columns: [place_order]
    columns:
      - name: place_id
        description: >
          The id places.json publishes: `oprhp_park_polygons:<unit>` for a
          park, or `oprhp_park_polygons:<GlobalID>` for one whose polygons
          carry no unit; the waypoint's own published id for a trailhead,
          parking area or town; `trail:<source>:<name>` for a long trail;
          `<source key>:<place key>` for a club places layer's park or town
          (int_places__club_units), its base model's key. A hiker keeps a
          place as their home, so none is ever generated from a row's
          position.
        data_type: varchar
        constraints:
          - type: not_null
        data_tests: [not_null, unique]
      - name: place_order
        description: >
          The row's place in places.json, from 1: by kind, then name, then
          id, in code-point order, for a stable diff.
        data_type: bigint
        constraints:
          - type: not_null
      - name: kind
        description: "`park`, `town`, `trailhead`, `parking` or `trail`."
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values: [park, town, trailhead, parking, trail]
      - name: name
        description: >
          The publisher's name, unaltered: a park's is the one most of its
          polygons wear, the shortest on a tie.
        data_type: varchar
        constraints:
          - type: not_null
      - name: poi_id
        description: >
          For a trailhead, parking area or town, the published waypoint's own
          id, so a pick here is a waypoint the app already holds.
        data_type: varchar
      - name: category
        description: A park's category in the publisher's own word ("State Park"), its polygons' commonest.
        data_type: varchar
      - name: state
        description: >
          A two-letter postal code, ONLY where the source says it or its
          organization declares one in sources.json, never guessed: ATC's
          Communities writes a word, which is read into a code, and a word
          that is not a state's name is absent (PL04).
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: [AL, AK, AZ, AR, CA, CO, CT, DE, DC, FL, GA, HI, ID, IL, IN, IA, KS, KY, LA, ME, MD, MA, MI, MN, MS, MO, MT, NE, NV, NH, NJ, NM, NY, NC, ND, OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY]
      - name: within_park
        description: The park a trailhead, parking area or town sits inside, by name (PL09), published as `within`.
        data_type: varchar
      - name: lon
        description: >
          The place's longitude: a park's centroid and a trail's box centre,
          each to 5 decimals; a waypoint's published point, uncut.
        data_type: double
        constraints:
          - type: not_null
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -180
                max_value: 180
      - name: lat
        description: The place's latitude, by the same rule as `lon`.
        data_type: double
        constraints:
          - type: not_null
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -90
                max_value: 90
      - name: bbox
        description: >
          [west, south, east, north] to 5 decimals, for a park and a long
          trail, so a map can fit the place rather than centre on a point
          inside it.
        data_type: double[]
      - name: trail_miles
        description: >
          MEASURED miles of published trail line, to a tenth, on the WGS84
          ellipsoid (decision 97): inside a park's boundary, within
          places_trail_radius_miles of a waypoint (@unvalidated,
          dbt_project.yml says what would settle it), or a long trail's own
          length. Null on every row when no line was published to measure
          against; absent means unknown, never zero.
        data_type: double
      - name: trail_miles_measured
        description: >
          Whether this build had any published line to measure against, the
          same on every row: places.json's `trailMilesMeasured`.
        data_type: boolean
        constraints:
          - type: not_null
      - name: source
        description: >
          The published `source`: oprhp_park_polygons for a park, the
          waypoint's id namespace (`atc_parking`, `oprhp_facilities`) for a
          waypoint, the line's registry key for a long trail.
        data_type: varchar
        constraints:
          - type: not_null
      - name: club
        description: The pipeline/extract/ folder that extracted the row.
        data_type: varchar
        constraints:
          - type: not_null
      - name: source_key
        description: The row's source, as int_sources__publication keys it.
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          # Its source may publish, not only exist: a plain relationships test
          # passes a row whose source is registered but held back.
          - dbt_utils.relationships_where:
              arguments:
                to: ref('int_sources__publication')
                field: source_key
                to_condition: may_publish
      - name: _loaded_at
        description: When the extract loaded the row's source; for a park or a trail, the latest of its parts'.
        data_type: timestamptz
        constraints:
          - type: not_null
      - name: _first_seen_at
        description: "{{ doc('row_first_seen_at') }}"
        data_type: timestamptz
        data_tests:
          - not_null:
              config:
                # warn only on a leg build_marts.py built without its history,
                # where both dates are null and the run is red already.
                severity: "{{ 'warn' if env_var('OURHIKE_ROW_HISTORY', 'on') == 'off' else 'error' }}"
      - name: _changed_at
        description: "{{ doc('row_changed_at') }}"
        data_type: timestamptz
        data_tests:
          - not_null:
              config:
                severity: "{{ 'warn' if env_var('OURHIKE_ROW_HISTORY', 'on') == 'off' else 'error' }}"
