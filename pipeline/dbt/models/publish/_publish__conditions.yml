  - name: pub_conditions_notices_current_until_is_then_its_edit_date_plus_90_days
    model: pub_conditions_notices
    description: >
      Rule 2's limit, 90 days for every source (var
      notice_freshness_limit_days): with no end date and no duration, the
      UTC day of its own edit stamp plus 90. Both sides of a UTC midnight:
      23:59:59 on 2026-07-12 gives 2026-10-10, and 00:00:00 on 2026-07-13
      gives 2026-10-11; a stamp written with an offset is read in UTC (22:00
      at -04:00 is 02:00 the next day). A stamp nothing can read is no date.
    overrides:
      macros:
        python_run_stamp: "'2026-10-10T12:00:00Z'"
        when_row_history_is_off: ""
    given:
      - input: ref('closures', v=1)
        rows: []
