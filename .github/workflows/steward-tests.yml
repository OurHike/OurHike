# Campsite Steward's analysis suite: apps/steward/pipeline/, the job that
# scores ATC's Campsite Sustainability Index sites (#1901, apps/steward/PLAN.md
# §2). Campsite Steward is a separate app kept in this repository, so this is a
# fourth test workflow beside the three OurHike ones, shaped like them:
# triggered on every pull request and scoped inside the job through
# .github/actions/changed-paths, so it always reports.
#
# Not a required check, and its job is not called `pytest`: branch protection
# matches checks by name, and `pytest` is pipeline-tests.yml's required check.
#
# Three jobs, one per part of the app: `steward` is the analysis job's Python
# suite, `steward-web` the web app in apps/steward/web/ (#1904), and
# `steward-api` the API in apps/steward/api/ (#1906), against a Postgres
# service as backend-tests.yml's suite is. No test suite touches the network
# (each conftest; the web tests run on the invented sites in src/fixtures.ts),
# and nothing here reads a secret or publishes anything. Publishing is
# steward-analysis.yml's.

name: Campsite Steward tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  steward:
    name: Campsite Steward analysis tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/steward/pipeline
    steps:
      - uses: actions/checkout@v7

      - id: scope
        uses: ./.github/actions/changed-paths
        with:
          # The suite imports nothing from outside apps/steward/pipeline/.
          # pipeline/requirements-dev.txt is listed because this suite's
          # requirements are compiled against it (requirements.in says why),
          # so a bump there can change what this one installs.
          paths: >-
            apps/steward/pipeline/
            pipeline/requirements-dev.txt
            .github/workflows/steward-tests.yml
            .github/actions/changed-paths/

      - uses: actions/setup-python@v7
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/steward/pipeline/requirements-dev.txt

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pip install -r requirements-dev.txt

      - name: Lint
        if: steps.scope.outputs.run == 'true'
        run: python -m ruff check .

      - name: Check formatting
        if: steps.scope.outputs.run == 'true'
        run: python -m ruff format --check .

      - name: Run tests
        if: steps.scope.outputs.run == 'true'
        run: python -m pytest -v

  steward-web:
    name: Campsite Steward web tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/steward/web
    steps:
      - uses: actions/checkout@v7

      - id: scope
        uses: ./.github/actions/changed-paths
        with:
          # The app imports nothing from outside apps/steward/web/: it reads
          # the analysis job's output at runtime, as files served beside it,
          # and its tests use src/fixtures.ts instead. src/types.ts names that
          # output's shape by hand, so a change to the job's output that
          # forgets the type is caught by neither suite; build.py is listed so
          # that such a change at least runs this one.
          paths: >-
            apps/steward/web/
            apps/steward/pipeline/steward_analysis/build.py
            .github/workflows/steward-tests.yml
            .github/actions/changed-paths/

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/steward/web/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Lint
        if: steps.scope.outputs.run == 'true'
        run: npm run lint

      - name: Check formatting
        if: steps.scope.outputs.run == 'true'
        run: npm run format:check

      - name: Typecheck
        if: steps.scope.outputs.run == 'true'
        run: npm run typecheck

      - name: Run tests
        if: steps.scope.outputs.run == 'true'
        run: npm test

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: npm run build

  steward-api:
    name: Campsite Steward API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/steward/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ourhike
          POSTGRES_PASSWORD: ourhike
          POSTGRES_DB: steward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      STEWARD_TEST_DATABASE_URL: postgresql+psycopg://ourhike:ourhike@localhost:5432/steward_test
    steps:
      - uses: actions/checkout@v7

      - id: scope
        uses: ./.github/actions/changed-paths
        with:
          # tests/test_weights.py reads the analysis job's rules.py, to hold the
          # API's weight names and defaults equal to the job's, so the rules
          # file is in scope. The requirements are compiled against backend's
          # and the pipeline's, as requirements.in and requirements-dev.in say.
          paths: >-
            apps/steward/api/
            apps/steward/pipeline/steward_analysis/rules.py
            apps/steward/pipeline/requirements-dev.txt
            backend/requirements-dev.txt
            .github/workflows/steward-tests.yml
            .github/actions/changed-paths/

      - uses: actions/setup-python@v7
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/steward/api/requirements-dev.txt

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pip install -r requirements-dev.txt

      - name: Lint
        if: steps.scope.outputs.run == 'true'
        run: python -m ruff check .

      - name: Check formatting
        if: steps.scope.outputs.run == 'true'
        run: python -m ruff format --check .

      - name: Run tests
        if: steps.scope.outputs.run == 'true'
        run: python -m pytest -v
