name: R2 credentials check

# Manual only, and deliberately separate from publish-vector-data.yml (the
# workflow that actually publishes; a comment here named a publish.yml that
# does not exist, #660) - this is a diagnostic tool for confirming the R2_*
# repository secrets are valid, not part of the regular test suite or the
# publish path. Read-only: it only calls head_bucket, so it never writes or
# lists bucket contents and is safe to run from any branch.
on:
  workflow_dispatch:

# The default token grants are wider than a diagnostic needs, and this job
# holds all four R2 secrets (#660).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        # The pipeline's own pin, not a bare `pip install boto3` (#660):
        # unpinned installs beside all four R2 secrets is the exact
        # scenario CONTRIBUTING.md pins requirements to prevent.
        run: pip install "$(grep '^boto3==' requirements.txt)"

      - name: Check R2 connectivity
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python check_r2_connection.py
