version: 2

# The closures and warnings family's phone files (pipeline/ELT.md, "Publish
# (reverse ETL)"): ten writers, and an exposure for each of the twelve
# files they and export_conditions.py's notes and disputes write. Each writer
# but pub_conditions_notices names its int_closures__gate row in `meta.gate`
# and selects no row while that source is held, so its last copy stays on the
# phone while the others are written, and publish.py fails the run
# afterwards. pub_conditions_notices spans every club, so a held club keeps
# its last good rows inside the file instead (decision 53, phase D), and it
# names no gate row; nor do pub_conditions_hazard_areas (decision 84) and
# pub_conditions_trail_closures (decisions 184 and 187),
# which keep that writer's rows as it wrote them. Only those three and
# pub_conditions_notice_states (decision 76's state shapes, a monthly node
# that reads no notice source, so no gate row) are new data with no
# exporter. None of them uploads
# anything: publish-conditions.yml and publish-weather.yml still upload the
# Python exporters' files until stage 4 of #1793 — Rebuild the data platform
# as dlt → dbt: seven contracted marts, a monthly refresh, published docs,
# and lighter phone downloads.

models:
  - name: pub_conditions_atc_updates
    description: >
      Writes conditions/atc_updates.json, ATC's reviewed Trail Updates and the
      ones ATC posted since the review that publish without a person, from
      the closures and warnings marts: one row, `generated_at`, the file's
      `reviewed_at` and `atc_updates`, which phone_file copies to
      processed_dir/conditions_atc_updates.json. Writes nothing while
      int_closures__gate holds ATC back, for a bad row, an unreviewed file or
      int_sources__publication.
      parity.py compares it with export_atc_updates.py's build_document().
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: generated_at
        description: When the run started, stamped as export_atc_updates.py's _stamp_utc() stamps.
        data_type: varchar
        data_tests: [not_null, unique]
      - name: reviewed_at
        description: The reviewed file's `reviewed_at`, as written.
        data_type: varchar
      - name: atc_updates
        description: >
          Every reviewed row in the file's order, each as lib/atc_updates.py's
          published_rows() writes it, then every automatic row in slug order,
          each as auto_row() writes it, with obstructs_trail false and
          review_state `unreviewed` (CL07-CL10, int_closures__atc_automatic).
        data_type: json[]

  - name: pub_conditions_weather_alerts
    description: >
      Writes conditions/weather_alerts.json, every relayed NWS alert that
      reaches a trail square, from the warnings mart's NWS rows placed by
      int_warnings__nws_placed (WN03): one document, written verbatim by
      phone_file's json_document format to
      processed_dir/conditions_weather_alerts.json. Writes nothing while
      int_closures__gate holds NWS back (int_sources__publication, or no
      alert landed to say when NWS was asked), and fails without exactly one
      weather squares document. parity.py compares it with
      export_weather_alerts.py's bake().
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: document
        description: >
          The file: payload, schema, source and credit, fetched_at,
          nws_updated, generated_at, the squares' release and zone_files,
          `alerts` in id order (NWS's words under bake()'s names, placed_by,
          squares) and unknown_zones.
        data_type: json
        data_tests: [not_null, unique]

  - name: pub_conditions_nynjtc_alerts
    description: >
      Writes conditions/nynjtc_alerts.json, NYNJTC's Trail Alerts, from the
      warnings mart (and the closures mart, which holds none of them today):
      one row, `generated_at` and `nynjtc_alerts`. Writes nothing while
      int_closures__gate holds NYNJTC back.
      parity.py compares it with export_nynjtc_alerts.py's build_document().
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: generated_at
        description: When the run started, stamped as export_nynjtc_alerts.py's _stamp_utc() stamps.
        data_type: varchar
        data_tests: [not_null, unique]
      - name: nynjtc_alerts
        description: Every alert by slug, each as lib/nynjtc_alerts.py's published_rows() writes it.
        data_type: json[]

  - name: pub_conditions_notices
    description: >
      Writes conditions/notices.json (decision 53, phase D), every club's
      notices in one file: one OrgNotice (features/ORG_NOTICES.md section 2)
      per row of a notice source (seeds/notice_readers.csv) in the closures
      and warnings marts, facts and a link only (decision 55), each with its
      place (ATC's A.T. miles, the source's own geometry shaped for a phone
      by decision 77, an area grown 100 m and simplified at 100 m and a line
      or point simplified at 10 m, NYNJTC's trail and park terms, or
      unplaced), decision
      67's `hazard` where it is a hunting area, shooting site or burned area,
      the club's own `updated_at` and OurHike's `checked_at` (the run log's
      latest read that loaded the source or found it unchanged), and the
      marts' row dates. A source int_closures__gate holds keeps its last good
      rows, which the marts carry with `carried_since`; in a build without
      the row history, while one is held, it writes nothing and the phone
      keeps its last file. No parity line: no exporter writes this file.
      conditions/atc_updates.json and conditions/nynjtc_alerts.json are
      written as before, by their own writers.
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: generated_at
        description: When the run started, stamped as every conditions writer stamps it.
        data_type: varchar
        data_tests: [not_null, unique]
      - name: notices
        description: >
          Every club notice, by source_key and then notice_id, each an object
          of exactly these keys: notice_id, source_key, club, provider,
          steward_kind, title, category, locality, place, hazard,
          obstructs_trail, starts_on, ends_on, updated_at, current_until,
          checked_at, first_seen_at, changed_at, carried_since, source_url
          and review_state, and `states` on the rows of a source
          seeds/notice_states.csv names (decision 76). `current_until` is the
          last day the notice reads as current, or null where it gives no
          date that bounds it (macros/notice_current_until.sql), and absent
          on decision 67's standing hazard areas, which never grey while
          their layer is served (decision 156). No other
          field of a source, its person fields or its prose among them, can
          reach it.
        data_type: json

  - name: pub_conditions_hazard_areas
    description: >
      Writes conditions/hazard_areas.json (decision 84): the notices of
      pub_conditions_notices that carry decision 67's `hazard`, each exactly
      as that writer wrote it, in its order, under its `generated_at`.
      Decision 77 has a phone download notices.json only once a hike is
      planned; the phone reads this file at launch whatever is planned, and
      draws hunting areas, shooting sites and burned areas from it. Writes
      nothing while that writer writes nothing (a build without the row
      history while a notice source is held), so the phone keeps its last
      copy; an empty list when no notice carries a hazard. No parity line:
      no exporter writes this file.
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: generated_at
        description: pub_conditions_notices' own `generated_at`, so the two files of one build carry one stamp.
        data_type: varchar
        data_tests: [not_null, unique]
      - name: notices
        description: >
          Every notice of conditions/notices.json whose `hazard` is not null,
          by source_key and then notice_id, each the same object of the same
          keys that file carries.
        data_type: json

  - name: pub_conditions_trail_closures
    description: >
      Writes conditions/trail_closures.json, every club closure for the map
      (decision 184: #1152's shape C for every club closure, drawn by
      decision 187 with the crossed-out mark): the notices
      of pub_conditions_notices whose `obstructs_trail` is true, ATC's
      excepted, each exactly as that writer wrote it, in its order, under its
      `generated_at`, with one key added, `shape` ("line", "area", "shade" or
      "point"), from the kind of the notice's own geometry. An "area"'s
      `place.geometry` is the MultiLineString of the mapped trail stretches
      inside it (int_closures__area_trail_cuts, the A.T.'s included since
      decision 192); a "shade" is an area no mapped trail runs inside, its
      `place.geometry` the area as its source drew it, which the phone
      hatches with no mark on its edge (decision 191). In an hour with no
      trail lines to cut against every area closure is left out, and so is a
      row with no geometry to draw; both stay in notices.json's list. Of two
      drawn areas of different sources that each cover at least 90% of the
      other (@unvalidated, the review of 2026-10-15's number), one closure
      posted twice, only the row edited first is drawn; the other stays in
      the list too. Only areas the cut has a row for compete, measured by
      the outline the cut carries, so an area drawn nowhere never hides a
      drawn copy. The phone reads it at launch, whatever is planned. Writes nothing while
      that writer writes nothing, so the phone keeps its last copy; an empty
      list when no club closes a trail. No parity line: no exporter writes
      this file.
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: generated_at
        description: pub_conditions_notices' own `generated_at`, so the files of one build carry one stamp.
        data_type: varchar
        data_tests: [not_null, unique]
      - name: closures
        description: >
          Every closure, by source_key and then notice_id, each the object of
          the same keys conditions/notices.json carries for it, then `shape`.
          A "line" or "point" row's `place` is that file's; an "area" row's is
          `{"kind": "geometry", "geometry": <MultiLineString>}`, the trail
          stretches inside the area at 5 decimal places; a "shade" row's is
          `{"kind": "geometry", "geometry": <Polygon or MultiPolygon>}`, the
          area as its source drew it, simplified at 10 m, at 5 decimal places.
        data_type: json

  - name: pub_conditions_notice_states
    description: >
      Writes conditions/notice_states.json (decision 76): the shape of every
      state a state-wide agency notice names, from
      int_closures__notice_state_shapes, each with its code, its name and
      the margin the phone holds a route to. The phone reads it beside
      conditions/notices.json and shows a state-wide notice to a hike
      planned inside one of its states that walks the agency's trails. A
      file of its own so its bytes hold between builds; `generated_at` is
      when the extract landed TIGER's file. Writes nothing while no shape is
      built, and the phone keeps its last file. No map draws a shape.
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: generated_at
        description: When the extract landed the Census Bureau's file, stamped as every conditions writer stamps a time.
        data_type: varchar
        data_tests: [not_null, unique]
      - name: states
        description: >
          One object per state, by code, of exactly these keys: state, name,
          edge_margin_m and geometry (GeoJSON, 4 decimal places).
        data_type: json

  - name: pub_conditions_closures
    description: >
      Writes conditions/closures.json, OurHike's moderator-verified closures,
      from the closures and warnings marts: one row, `generated_at` and
      `closures`. Writes nothing while int_closures__gate holds OurHike's
      closures back, for a row, a number that is not finite or
      int_sources__publication. parity.py compares it with
      export_conditions.py's read_closures() and build_document().
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: generated_at
        description: When the run started, stamped as export_conditions.py's _stamp_utc() stamps, and the same for conditions/reports.json.
        data_type: varchar
        data_tests: [not_null, unique]
      - name: closures
        description: Every verified closure, by start_mile_marker then id, each as PUBLIC_CLOSURES_SQL selects it.
        data_type: json[]

  - name: pub_conditions_reports
    description: >
      Writes conditions/reports.json, every verified or resolved public
      report whatever its severity, from base_ourhike__reports: one row,
      `generated_at` and `reports`. Writes nothing while int_closures__gate
      holds OurHike's reports back, for int_sources__publication or a number
      that is not finite. parity.py compares it with
      export_conditions.py's read_reports() and build_document().
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: generated_at
        description: When the run started, stamped as export_conditions.py's _stamp_utc() stamps, and the same for conditions/closures.json.
        data_type: varchar
        data_tests: [not_null, unique]
      - name: reports
        description: Every public report, by "timestamp" then id, each as PUBLIC_REPORTS_SQL selects it.
        data_type: json[]

  - name: pub_conditions_work_projects
    description: >
      Writes conditions/work_projects.json, the club workdays a hiker can see
      and join (#760), from int_closures__work_projects_checked: one row,
      `generated_at`, the file's `reviewed_at` and `work_projects`, which
      phone_file copies to processed_dir/conditions_work_projects.json.
      Writes nothing while int_closures__gate holds the file back:
      int_sources__publication does not let it publish, nobody reviewed it,
      or lib/work_projects.py's file_problems() would find a problem. No mart
      owns work projects. parity.py compares it with
      export_work_projects.py's main().
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: generated_at
        description: When the run started, stamped as export_work_projects.py's _stamp_utc() stamps.
        data_type: varchar
        data_tests: [not_null, unique]
      - name: reviewed_at
        description: The reviewed file's `reviewed_at`, as written.
        data_type: varchar
      - name: work_projects
        description: Every row of the file in its order, each as published_rows() writes it (CL17).
        data_type: json[]

unit_tests:
  - name: pub_conditions_notices_writes_one_orgnotice_per_club_notice
    model: pub_conditions_notices
    description: >
      Decision 53's phase D, with decisions 55 and 67: one OrgNotice per club
      notice in either mart, by source_key then notice_id, of exactly the
      documented keys. ATC's row is placed by its A.T. miles and named by its
      states; NYNJTC's carries its trail tags as `org_terms`; a burned area
      carries its own geometry and `hazard`, never obstructs the trail,
      whatever its row says, and carries no `current_until`, so it never
      greys while its layer is served (decision 156); OurHike's own closure and an NWS alert are not
      club notices. A source seeds/notice_states.csv names (decision 76)
      carries its states as `states`, last, and no other row carries the key. `checked_at` is the oldest of a source's tables' latest
      loaded or unchanged reads (ATC's two), null where a table has none
      (BAER), and on a carried row the latest such read before carrying
      began (a page notice, whose 09:00 read came after it). A refused read
      never counts.
    overrides:
      macros:
        python_run_stamp: "'2026-10-04T12:00:00Z'"
        # A build with its row history, whatever the environment running the
        # test says: the history-off case writes no file while a club is
        # held, and tests/test_dbt_notice_tables_absent_builds.py holds it.
        when_row_history_is_off: ""
    given:
      - input: ref('closures', v=1)
        format: sql
        rows: |
          select
              closure_id, club, source_key,
              cast(obstructs_trail as boolean) as obstructs_trail,
              review_state, title, category,
              cast(states as json) as states,
              locality,
              cast(closure_reason as varchar) as closure_reason,
              cast(closure_place as varchar) as closure_place,
              cast(mile_start as double) as mile_start,
              cast(mile_end as double) as mile_end,
              cast(starts_on as date) as starts_on,
              cast(ends_on as date) as ends_on,
              updated_at, source_url,
              cast(geom_geojson as varchar) as geom_geojson,
              cast(_first_seen_at as timestamptz) as _first_seen_at,
              cast(_changed_at as timestamptz) as _changed_at,
              cast(carried_since as timestamptz) as carried_since,
              cast(null as boolean) as stands_until_lifted,
              cast(null as varchar) as issuer
          from (values
              ('atc_trail_updates:bridge', 'atc', 'atc_trail_updates', true, 'reviewed', 'Fixture footbridge out', 'Closure', '["VT"]', null, null, null, 1650.5, 1650.5, null, null, '2026-09-30T12:00:00Z', 'https://appalachiantrail.org/fixture', null, '2026-10-01 00:00:00+00', '2026-10-02 00:00:00+00', null),
              ('ourhike_closures:c1', 'ourhike', 'ourhike_closures', true, 'moderator_verified', null, null, null, null, null, null, 10.0, 11.0, null, null, null, null, null, '2026-10-01 00:00:00+00', '2026-10-01 00:00:00+00', null)
          ) as closures (closure_id, club, source_key, obstructs_trail, review_state, title, category, states, locality, closure_reason, closure_place, mile_start, mile_end, starts_on, ends_on, updated_at, source_url, geom_geojson, _first_seen_at, _changed_at, carried_since)
      - input: ref('warnings', v=1)
        format: sql
        rows: |
          select
              warning_id, warning_kind, club, source_key,
              cast(obstructs_trail as boolean) as obstructs_trail,
              review_state, title, category,
              cast(states as json) as states,
              locality,
              cast(mile_start as double) as mile_start,
              cast(mile_end as double) as mile_end,
              cast(starts_on as date) as starts_on,
              cast(ends_on as date) as ends_on,
              updated_at, source_url,
              cast(geom_geojson as varchar) as geom_geojson,
              cast(_first_seen_at as timestamptz) as _first_seen_at,
              cast(_changed_at as timestamptz) as _changed_at,
              cast(carried_since as timestamptz) as carried_since,
              cast(null as boolean) as stands_until_lifted,
              cast(null as varchar) as issuer
          from (values
              ('nynjtc_trail_alerts:detour', 'org_notice', 'nynjtc', 'nynjtc_trail_alerts', null, 'not_reviewed', 'Fixture detour', null, null, 'Harriman-Bear Mountain', null, null, null, null, '2026-09-29T12:00:00Z', 'https://www.nynjtc.org/fixture', null, '2026-09-29 13:00:00+00', '2026-09-29 13:00:00+00', null),
              ('usfs_baer_assessments:1', 'org_notice', 'usfs', 'usfs_baer_assessments', true, 'not_reviewed', 'FIXTURE FIRE', null, null, 'Fixture National Forest', null, null, '2026-08-26', null, null, null, '{"type":"Point","coordinates":[-74.1,41.2]}', '2026-10-03 00:00:00+00', '2026-10-03 00:00:00+00', null),
              ('club_page:1', 'org_notice', 'a', 'club_page', null, 'not_reviewed', 'Fixture trail work', null, null, null, null, null, null, '2026-11-01', null, 'https://example.org/fixture', null, '2026-10-02 00:00:00+00', '2026-10-04 08:00:00+00', '2026-10-04 08:00:00+00'),
              ('nws_alerts:x', 'nws_alert', 'nws', 'nws_alerts', false, 'relayed', null, null, null, null, null, null, null, null, null, null, null, '2026-10-04 00:00:00+00', '2026-10-04 00:00:00+00', null)
          ) as warnings (warning_id, warning_kind, club, source_key, obstructs_trail, review_state, title, category, states, locality, mile_start, mile_end, starts_on, ends_on, updated_at, source_url, geom_geojson, _first_seen_at, _changed_at, carried_since)
      - input: ref('notice_readers')
        rows:
          - {source_key: atc_trail_updates, club: atc, notice_type: closures, reader: reviewed_file, listing: full, raw_table: raw_atc__atc_trail_updates, staged_by: hand, steward_kind: club}
          - {source_key: atc_trail_updates, club: atc, notice_type: closures, reader: atc_trail_update_pages, listing: full, raw_table: raw_atc__atc_trail_updates_pages, staged_by: hand, steward_kind: club}
          - {source_key: nynjtc_trail_alerts, club: nynjtc, notice_type: closures, reader: wordpress_posts, listing: full, raw_table: raw_nynjtc__nynjtc_trail_alerts, staged_by: hand, steward_kind: club}
          - {source_key: usfs_baer_assessments, club: usfs, notice_type: warnings, reader: arcgis_layer, listing: full, raw_table: raw_usfs__usfs_baer_assessments, staged_by: stg_usfs__usfs_baer_assessments, steward_kind: agency}
          - {source_key: club_page, club: a, notice_type: warnings, reader: page_notice, listing: full, raw_table: raw_a__club_page, staged_by: stg_a__club_page, steward_kind: club}
      - input: ref('stg_registry__sources')
        rows:
          - {source_key: atc_trail_updates, provider: ATC, title: 'ATC Trail Updates'}
          - {source_key: nynjtc_trail_alerts, provider: NYNJTC, title: 'NYNJTC Trail Alerts'}
          - {source_key: usfs_baer_assessments, provider: USFS, title: 'USFS BAER assessments'}
          - {source_key: club_page, provider: 'Fixture Club', title: 'Fixture Club trail conditions'}
      - input: ref('notice_hazard_areas')
        rows:
          - {source_key: usfs_baer_assessments, hazard: burned_area, category_value: '', why: 'Fixture'}
      - input: ref('notice_states')
        rows:
          - {source_key: usfs_baer_assessments, states: 'ID MT', evidence: 'Fixture'}
      - input: ref('int_closures__nynjtc_checked')
        rows:
          - {notice_id: 'nynjtc_trail_alerts:detour', place_terms: '["trail:appalachian-trail"]'}
      - input: ref('int_closures__gate')
        rows:
          - {source_key: atc_trail_updates, passed: true, may_publish: true}
          - {source_key: nynjtc_trail_alerts, passed: true, may_publish: true}
          - {source_key: usfs_baer_assessments, passed: true, may_publish: true}
          - {source_key: club_page, passed: false, may_publish: true}
      - input: ref('base_extract__runs')
        rows:
          - {table_name: raw_atc__atc_trail_updates, outcome: loaded, checked_at: '2026-10-04 10:00:00+00'}
          - {table_name: raw_atc__atc_trail_updates_pages, outcome: skipped, checked_at: '2026-10-04 11:00:00+00'}
          - {table_name: raw_atc__atc_trail_updates_pages, outcome: refused, checked_at: '2026-10-04 11:30:00+00'}
          - {table_name: raw_nynjtc__nynjtc_trail_alerts, outcome: loaded, checked_at: '2026-10-04 10:30:00+00'}
          - {table_name: raw_usfs__usfs_baer_assessments, outcome: refused, checked_at: '2026-10-04 10:00:00+00'}
          - {table_name: raw_a__club_page, outcome: loaded, checked_at: '2026-10-04 06:00:00+00'}
          - {table_name: raw_a__club_page, outcome: skipped, checked_at: '2026-10-04 09:00:00+00'}
    expect:
      rows:
