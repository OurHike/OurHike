version: 2

models:
  - name: stg_atc__shelters
    data_tests:
      # Says how many rows the dedupe dropped. Each is an exact copy
      # (duplicates_are_exact on the raw table), so this only reports.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: source('atc', 'raw_atc__shelters')
          config:
            severity: warn
    description: >
      ATC shelters, one row per shelter, keyed and deduplicated, with every
      upstream column the extract lands. Their poi_type ('shelter') and
      confidence ('high') are the poi_type_mapping seed's, joined in
      int_points_of_interest__classified: decision 40 keeps classification
      out of staging.
    columns:
      - name: poi_key
        description: >
          The row's key (decision 40): dbt_utils.generate_surrogate_key over
          shelters, globalid,
          the registry key first and then the columns measured unique for
          this layer.
        data_tests: [not_null, unique]
      - name: globalid
        description: ATC's GlobalID, the id export_poi.py publishes a shelter under.
        data_tests: [not_null, unique]
  - name: stg_atc__campsites
    data_tests:
