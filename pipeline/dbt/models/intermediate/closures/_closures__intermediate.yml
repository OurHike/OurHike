  - name: int_closures__gate_reads_its_sources_from_the_registry_and_the_run_log
    description: >
      Decision 53's phase C: every registered notice source gets a gate row
      without an edit here, and an unregistered key gets none (held back by
      the marts' inner join, never published unchecked). One whose table the
      run log never shows the extract loading (never run, or only ever
      `incomplete`) is held with that reason, ahead of any count. A generated club
      notice source with rows passes; one with none passes only where the
      latest load read the source's own count of zero; one whose table was
      never loaded (a leg's ten-a-run limit, or a withdrawn table, read as
      empty by notice_raw_table) is held; one with a key two different raw
      rows share is held, so its exactness test can warn without stopping
      every club's build; and one the registry holds back is held by
      int_sources__publication first. A raw table this warehouse does
      not hold (decision 61's hourly warehouse) holds its source with
      that reason even where the run log's latest load read a proven
      zero: absent says nothing, never "no notices". ATC's, NYNJTC's and NYS Parks'
      rows come from the same three inputs.
    model: int_closures__gate
    given:
      - input: ref('int_closures__unioned')
        format: sql
        rows: |
          select 'atc_trail_updates' as source_key, cast([] as varchar[]) as problems, 'atc_trail_update' as notice_kind
          union all
          select 'nynjtc_trail_alerts', cast([] as varchar[]), 'nynjtc_trail_alert'
          union all
          select 'ourhike_closures', cast([] as varchar[]), 'ourhike_closure'
          union all
          select 'club_with_rows', cast([] as varchar[]), 'club_arcgis_layer'
      - input: ref('int_closures__atc_checked')
        format: sql
        rows: |
          select 0 as file_row
      - input: ref('base_atc__atc_updates')
        rows:
          - {atc_updates_document_key: d1, document_json: '{"reviewed_at": "2026-08-24", "updates": [{}]}'}
      - input: ref('int_sources__publication')
        rows:
          - {source_key: atc_trail_updates, may_publish: true}
          - {source_key: nynjtc_trail_alerts, may_publish: true}
          - {source_key: oprhp_trail_closures, may_publish: true}
          - {source_key: ourhike_closures, may_publish: true}
          - {source_key: ourhike_reports, may_publish: true}
          - {source_key: nws_alerts, may_publish: true}
          - {source_key: 'reference/work_projects.json', may_publish: true}
          - {source_key: club_with_rows, may_publish: true}
          - {source_key: club_proven_empty, may_publish: true}
          - {source_key: club_unproven_empty, may_publish: true}
          - {source_key: club_never_loaded, may_publish: true}
          - {source_key: club_never_run, may_publish: true}
          - {source_key: club_table_absent, may_publish: true}
          - {source_key: club_with_conflicts, may_publish: true}
          - {source_key: club_held_by_the_registry, may_publish: false, publication_rule: held_back_by_the_registry}
      - input: ref('base_ourhike__reports')
        rows: []
      - input: ref('base_nws__alerts')
        format: sql
        rows: |
          select 'k1' as nws_alert_key
      - input: ref('int_closures__work_projects_checked')
        format: sql
        rows: |
          select cast(null as bigint) as row_position, true as is_reviewed, cast([] as varchar[]) as row_problems, cast([] as varchar[]) as duplicate_problems
      - input: ref('base_extract__runs')
        format: sql
        rows: |
          select '20261003T000000.000000Z' as run_id, 'raw_nynjtc__nynjtc_trail_alerts' as table_name, 'loaded' as outcome, cast(1 as bigint) as rows_loaded, cast(1 as bigint) as count_proof
          union all
          select '20261003T000000.000000Z', 'raw_atc__atc_trail_updates', 'skipped', null, null
          union all
          select '20261003T000000.000000Z', 'raw_nysparks__oprhp_trail_closures', 'loaded', 0, 0
          union all
          select '20261003T000000.000000Z', 'raw_a__club_with_rows', 'loaded', 2, 2
          union all
          select '20261003T000000.000000Z', 'raw_a__club_with_conflicts', 'loaded', 3, 3
          union all
          select '20261003T000000.000000Z', 'raw_a__club_table_absent', 'loaded', 0, 0
          union all
          select '20261002T000000.000000Z', 'raw_a__club_proven_empty', 'loaded', 3, 3
          union all
          select '20261003T000000.000000Z', 'raw_a__club_proven_empty', 'loaded', 0, 0
          union all
          select '20261003T000000.000000Z', 'raw_a__club_unproven_empty', 'loaded', 2, 2
          union all
          select '20261003T000000.000000Z', 'raw_a__club_never_loaded', 'incomplete', null, null
          union all
          select '20261003T000000.000000Z', 'raw_a__club_held_by_the_registry', 'loaded', 1, 1
          union all
          select '20261003T000000.000000Z', 'raw_a__club_not_registered', 'loaded', 1, 1
      - input: ref('notice_readers')
        rows:
          - {source_key: atc_trail_updates, club: atc, notice_type: closures, reader: reviewed_file, listing: full, raw_table: raw_atc__atc_trail_updates, staged_by: hand}
          - {source_key: nynjtc_trail_alerts, club: nynjtc, notice_type: closures, reader: wordpress_posts, listing: full, raw_table: raw_nynjtc__nynjtc_trail_alerts, staged_by: hand}
          - {source_key: oprhp_trail_closures, club: nysparks, notice_type: closures, reader: arcgis_layer, listing: full, raw_table: raw_nysparks__oprhp_trail_closures, staged_by: hand}
          - {source_key: club_with_rows, club: a, notice_type: closures, reader: arcgis_layer, listing: full, raw_table: raw_a__club_with_rows, staged_by: stg_a__club_with_rows}
          - {source_key: club_with_conflicts, club: a, notice_type: closures, reader: arcgis_layer, listing: full, raw_table: raw_a__club_with_conflicts, staged_by: stg_a__club_with_conflicts}
          - {source_key: club_proven_empty, club: a, notice_type: warnings, reader: arcgis_layer, listing: full, raw_table: raw_a__club_proven_empty, staged_by: stg_a__club_proven_empty}
          - {source_key: club_unproven_empty, club: a, notice_type: closures, reader: page_notice, listing: full, raw_table: raw_a__club_unproven_empty, staged_by: stg_a__club_unproven_empty}
          - {source_key: club_never_loaded, club: a, notice_type: closures, reader: feed_notices, listing: window, raw_table: raw_a__club_never_loaded, staged_by: stg_a__club_never_loaded}
          - {source_key: club_held_by_the_registry, club: a, notice_type: closures, reader: arcgis_layer, listing: full, raw_table: raw_a__club_held_by_the_registry, staged_by: stg_a__club_held_by_the_registry}
          - {source_key: club_not_registered, club: a, notice_type: closures, reader: arcgis_layer, listing: full, raw_table: raw_a__club_not_registered, staged_by: stg_a__club_not_registered}
          - {source_key: club_never_run, club: a, notice_type: closures, reader: arcgis_layer, listing: full, raw_table: raw_a__club_never_run, staged_by: stg_a__club_never_run}
          - {source_key: club_table_absent, club: a, notice_type: closures, reader: page_notice, listing: full, raw_table: raw_a__club_table_absent, staged_by: stg_a__club_table_absent}
      - input: ref('stg_registry__sources')
