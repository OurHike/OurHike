          - {edge_rank: 2, part_id: 'nynjtc_long_path:2#1', piece_index: 0, from_node: 1, to_node: 2, length_m: 831.37, dropped_as_a_loop: false, geom_m_wkt: 'LINESTRING (1805451.548120733 2237152.058364394, 1806260.9168392865 2237342.0820857477)'}
      - input: ref('int_trail_network__routable')
        rows:
