version: 2

unit_tests:
  # Each test is named for the build_trail_graph.py rule it holds, and most
  # for the tests/test_build_trail_graph.py case it ports (pipeline/ELT.md,
  # "Tests move with their rule"). tests/test_dbt_trail_network_parity.py
  # runs build_trail_graph's own functions over each test's given rows and
  # holds every expected row to the Python's answer: routable_lines() and
  # at_lines_of() for int_trail_network__routable, node_lines() for
  # int_trail_network__cuts, _node_id() for int_trail_network__node_lookups,
  # build_graph() for int_trail_network__raw_edges, _geographic_vertices()
  # for int_trail_network__edges.
  #
  # The fixtures sit at 41.25 N, -74.10, test_build_trail_graph.py's own
  # Harriman-ish ring point, and every metre figure in a description was
  # measured on the fixture with DuckDB 1.5.4 (dbt 2.0.6's engine) rather
  # than worked out from degrees. The raw_edges tests' pieces are written in
  # EPSG:5070 metres near its origin (23 N, -96), where the noding's metre is
  # not the ground's: their length_m is the geodesic on WGS84 (decision 90),
  # so a piece 100 m long in EPSG:5070 there reads 98.13 (pyproj,
  # 2026-10-06). A dbt 2.0.6 unit test compares a DOUBLE to
  # one decimal place only, so the points a cut lands on travel as WKT text
  # and the edge geometry as GeoJSON text, compared exactly, and the pytest
  # holds both to the Python's doubles.

  # ------------------------------------------------- the routable lines

  - name: int_trail_network__routable_refuses_a_closed_trail_in_any_case_or_padding
    description: >
      Ports test_a_closed_trail_is_never_routable_and_the_refusal_is_counted
      and test_closed_matching_ignores_case_and_padding_because_stewards_publish_both:
      the open line is the one routable part, and each of the four spellings
      of closed is refused and counted, never an edge. A router that paths
      down a trail NYS OPRHP marks closed is the failure this exists to
      prevent (TN01, a safety field).
    model: int_trail_network__routable
    given:
      - input: ref('trail_lines', v=1)
        rows:
          - {trail_line_id: 'oprhp_trails:1', source_key: oprhp_trails, line_kind: network, feature_order: 0, trail_status: open, geom_geojson: '{"type": "LineString", "coordinates": [[-74.1, 41.25], [-74.08, 41.25]]}'}
          - {trail_line_id: 'oprhp_trails:9', source_key: oprhp_trails, line_kind: network, feature_order: 1, trail_status: Closed, geom_geojson: '{"type": "LineString", "coordinates": [[-74.1, 41.26], [-74.08, 41.26]]}'}
          - {trail_line_id: 'oprhp_trails:10', source_key: oprhp_trails, line_kind: network, feature_order: 2, trail_status: closed, geom_geojson: '{"type": "LineString", "coordinates": [[-74.1, 41.27], [-74.08, 41.27]]}'}
          - {trail_line_id: 'oprhp_trails:11', source_key: oprhp_trails, line_kind: network, feature_order: 3, trail_status: CLOSED, geom_geojson: '{"type": "LineString", "coordinates": [[-74.1, 41.28], [-74.08, 41.28]]}'}
          - {trail_line_id: 'oprhp_trails:12', source_key: oprhp_trails, line_kind: network, feature_order: 4, trail_status: ' Closed ', geom_geojson: '{"type": "LineString", "coordinates": [[-74.1, 41.29], [-74.08, 41.29]]}'}
    expect:
      rows:
        - {part_id: 'oprhp_trails:1#1', part_order: 0, trail_id: 'oprhp_trails:1', refused_because: null, geom_wkt: 'LINESTRING (-74.1 41.25, -74.08 41.25)'}
        - {part_id: 'oprhp_trails:9#', part_order: null, trail_id: 'oprhp_trails:9', refused_because: closed, geom_wkt: null}
        - {part_id: 'oprhp_trails:10#', part_order: null, trail_id: 'oprhp_trails:10', refused_because: closed, geom_wkt: null}
        - {part_id: 'oprhp_trails:11#', part_order: null, trail_id: 'oprhp_trails:11', refused_because: closed, geom_wkt: null}
        - {part_id: 'oprhp_trails:12#', part_order: null, trail_id: 'oprhp_trails:12', refused_because: closed, geom_wkt: null}

  - name: int_trail_network__routable_refuses_what_is_not_a_line
    description: >
      Ports test_a_feature_with_no_geometry_is_counted_rather_than_crashing
      and test_a_polygon_is_refused_as_not_a_line: a line with no geometry
      and one whose LineString has no coordinates are each counted `empty`,
      a Polygon is counted `not_a_line`, and none of the three is an edge.
    model: int_trail_network__routable
    given:
      - input: ref('trail_lines', v=1)
        rows:
          - {trail_line_id: 'oprhp_trails:1', source_key: oprhp_trails, line_kind: network, feature_order: 0, trail_status: open, geom_geojson: null}
          - {trail_line_id: 'oprhp_trails:2', source_key: oprhp_trails, line_kind: network, feature_order: 1, trail_status: open, geom_geojson: '{"type": "LineString", "coordinates": []}'}
          - {trail_line_id: 'oprhp_trails:3', source_key: oprhp_trails, line_kind: network, feature_order: 2, trail_status: open, geom_geojson: '{"type": "Polygon", "coordinates": [[[-74.1, 41.25], [-74.09, 41.25], [-74.09, 41.26], [-74.1, 41.25]]]}'}
    expect:
      rows:
        - {part_id: 'oprhp_trails:1#', part_order: null, refused_because: empty}
        - {part_id: 'oprhp_trails:2#', part_order: null, refused_because: empty}
        - {part_id: 'oprhp_trails:3#', part_order: null, refused_because: not_a_line}

  - name: int_trail_network__routable_a_multilinestring_is_one_part_per_line
    description: >
      Ports test_a_multilinestring_becomes_one_routable_line_per_part: each
      part of a MultiLineString is routable on its own, in the line's order
      (NEARBY_TRAILS.md's Beaver Pond Campground has 34 disjoint parts), and
      the line after it is numbered after both.
    model: int_trail_network__routable
    given:
      - input: ref('trail_lines', v=1)
        rows:
          - {trail_line_id: 'oprhp_trails:1', source_key: oprhp_trails, line_kind: network, feature_order: 0, trail_status: open, geom_geojson: '{"type": "MultiLineString", "coordinates": [[[-74.1, 41.25], [-74.09, 41.25]], [[-74.1, 41.27], [-74.09, 41.27]]]}'}
          - {trail_line_id: 'oprhp_trails:2', source_key: oprhp_trails, line_kind: network, feature_order: 1, trail_status: open, geom_geojson: '{"type": "LineString", "coordinates": [[-74.1, 41.29], [-74.09, 41.29]]}'}
    expect:
      rows:
        - {part_id: 'oprhp_trails:1#1', part_order: 0, part_index: 1, trail_id: 'oprhp_trails:1', geom_wkt: 'LINESTRING (-74.1 41.25, -74.09 41.25)'}
        - {part_id: 'oprhp_trails:1#2', part_order: 1, part_index: 2, trail_id: 'oprhp_trails:1', geom_wkt: 'LINESTRING (-74.1 41.27, -74.09 41.27)'}
        - {part_id: 'oprhp_trails:2#1', part_order: 2, part_index: 1, trail_id: 'oprhp_trails:2', geom_wkt: 'LINESTRING (-74.1 41.29, -74.09 41.29)'}

  - name: int_trail_network__routable_the_at_routes_whole_after_the_network
    description: >
      load_at_lines() and build()'s merge (TN02, a safety field): the
      network's lines come first in their feature order, then the A.T.'s,
      kept to the sources in trail_network_at_sources (AT_GRAPH_SOURCES), so
      a line of any other trails.geojson source never becomes an edge.
      Without the A.T. here the graph refuses a tap on the widest line on
      the map with a sentence that is false there.
    model: int_trail_network__routable
    given:
      - input: ref('trail_lines', v=1)
        rows:
          - {trail_line_id: 'oprhp_trails:2', source_key: oprhp_trails, line_kind: network, feature_order: 1, trail_status: open, geom_geojson: '{"type": "LineString", "coordinates": [[-74.1, 41.26], [-74.09, 41.26]]}'}
          - {trail_line_id: 'centerline:1', source_key: centerline, line_kind: centerline, feature_order: 0, geom_geojson: '{"type": "LineString", "coordinates": [[-74.1, 41.27], [-74.09, 41.27]]}'}
          - {trail_line_id: 'side_trails:5', source_key: side_trails, line_kind: side_trail, feature_order: 1, geom_geojson: '{"type": "LineString", "coordinates": [[-74.1, 41.28], [-74.09, 41.28]]}'}
          - {trail_line_id: 'road_approaches:1', source_key: road_approaches, line_kind: side_trail, feature_order: 2, geom_geojson: '{"type": "LineString", "coordinates": [[-74.1, 41.29], [-74.09, 41.29]]}'}
          - {trail_line_id: 'oprhp_trails:1', source_key: oprhp_trails, line_kind: network, feature_order: 0, trail_status: open, geom_geojson: '{"type": "LineString", "coordinates": [[-74.1, 41.25], [-74.09, 41.25]]}'}
    expect:
      rows:
        - {part_id: 'oprhp_trails:1#1', part_order: 0, is_at: false, source_key: oprhp_trails, geom_wkt: 'LINESTRING (-74.1 41.25, -74.09 41.25)'}
        - {part_id: 'oprhp_trails:2#1', part_order: 1, is_at: false, source_key: oprhp_trails, geom_wkt: 'LINESTRING (-74.1 41.26, -74.09 41.26)'}
        - {part_id: 'centerline:1#1', part_order: 2, is_at: true, source_key: centerline, geom_wkt: 'LINESTRING (-74.1 41.27, -74.09 41.27)'}
        - {part_id: 'side_trails:5#1', part_order: 3, is_at: true, source_key: side_trails, geom_wkt: 'LINESTRING (-74.1 41.28, -74.09 41.28)'}

  # ---------------------------------------------------------- the cuts

  - name: int_trail_network__cuts_two_lines_that_cross_are_cut_once
    description: >
      Ports test_two_lines_that_cross_are_split_and_share_one_node: the
      east-west and north-south lines cross, so the pair is one `crossing`
      row, the lower part first, and no end of either is also joined (the
      Python `continue`s past a pair that crosses).
    model: int_trail_network__cuts
    given:
      - input: ref('int_trail_network__routable')
        rows:
          - {part_id: 'oprhp_trails:1#1', part_order: 0, refused_because: null, geom_wkt: 'LINESTRING (-74.1 41.25, -74.08 41.25)'}
          - {part_id: 'nynjtc_long_path:2#1', part_order: 1, refused_because: null, geom_wkt: 'LINESTRING (-74.09 41.24, -74.09 41.26)'}
    expect:
      rows:
        - {cut_key: 'crossing:oprhp_trails:1#1|nynjtc_long_path:2#1', cut_order: 0, cut_kind: crossing, line_part_id: 'oprhp_trails:1#1', other_part_id: 'nynjtc_long_path:2#1', end_side: null, end_point_wkt: null}

  - name: int_trail_network__cuts_lines_that_touch_at_a_shared_end_are_a_crossing
    description: >
      Ports test_lines_that_merely_touch_at_a_shared_end_make_one_node_and_no_split:
      a touch is an intersection with no tolerance, so the pair is a
      `crossing` (cut at the shared end, which cuts nothing) and never an
      `endpoint_join`.
    model: int_trail_network__cuts
    given:
      - input: ref('int_trail_network__routable')
        rows:
          - {part_id: 'oprhp_trails:1#1', part_order: 0, refused_because: null, geom_wkt: 'LINESTRING (-74.1 41.25, -74.09 41.25)'}
          - {part_id: 'oprhp_trails:2#1', part_order: 1, refused_because: null, geom_wkt: 'LINESTRING (-74.09 41.25, -74.08 41.25)'}
    expect:
      rows:
        - {cut_key: 'crossing:oprhp_trails:1#1|oprhp_trails:2#1', cut_order: 0, cut_kind: crossing, end_side: null}

  - name: int_trail_network__cuts_an_end_stopping_short_is_joined_within_the_tolerance
    description: >
      Ports test_an_end_stopping_short_of_another_line_is_joined_within_the_tolerance:
      the stub's north end stops 6.76 m short of the main line (measured in
      EPSG:5070), inside trail_network_endpoint_snap_m's 8 m, so it is one
      `endpoint_join`, carrying the end's point in EPSG:5070 metres. Its
      south end, a kilometre off, is not.
    model: int_trail_network__cuts
    given:
      - input: ref('int_trail_network__routable')
        rows:
          - {part_id: 'oprhp_trails:1#1', part_order: 0, refused_because: null, geom_wkt: 'LINESTRING (-74.1 41.25, -74.08 41.25)'}
          - {part_id: 'nynjtc_long_path:2#1', part_order: 1, refused_because: null, geom_wkt: 'LINESTRING (-74.09 41.24, -74.09 41.24994)'}
    expect:
      rows:
        - {cut_key: 'endpoint_join:nynjtc_long_path:2#1|oprhp_trails:1#1|end', cut_order: 0, cut_kind: endpoint_join, line_part_id: 'nynjtc_long_path:2#1', other_part_id: 'oprhp_trails:1#1', end_side: end, end_point_wkt: 'POINT (1805708.902606994 2236055.64823628)'}

  - name: int_trail_network__cuts_the_same_gap_is_left_open_at_zero_tolerance
    description: >
      Ports test_the_same_gap_is_left_open_when_the_tolerance_is_zero: the
      same 6.76 m gap with trail_network_endpoint_snap_m at 0 is no cut at
      all, so the stub stays its own island.
    model: int_trail_network__cuts
    # A dbt 2.0.6 unit test's vars are its overrides alone, so every var the
    # model reads is listed.
    overrides:
      vars:
        trail_network_endpoint_snap_m: 0.0
        trail_network_piece_segments: 256
    given:
      - input: ref('int_trail_network__routable')
        rows:
          - {part_id: 'oprhp_trails:1#1', part_order: 0, refused_because: null, geom_wkt: 'LINESTRING (-74.1 41.25, -74.08 41.25)'}
          - {part_id: 'nynjtc_long_path:2#1', part_order: 1, refused_because: null, geom_wkt: 'LINESTRING (-74.09 41.24, -74.09 41.24994)'}
    expect:
      rows: []

  - name: int_trail_network__cuts_parallel_trails_are_never_welded
    description: >
      Ports test_parallel_trails_are_not_welded_together_at_the_default_tolerance,
      the failure the endpoint-only rule exists to prevent: two trails
      running side by side 44.78 m apart (measured in EPSG:5070) for their
      whole length have envelopes that meet, and no end within 8 m of the
      other, so no cut joins them. #771 measured 48% of sampled A.T. points
      through Harriman within 150 m of a different marked trail.
    model: int_trail_network__cuts
    given:
      - input: ref('int_trail_network__routable')
        rows:
          - {part_id: 'oprhp_trails:1#1', part_order: 0, refused_because: null, geom_wkt: 'LINESTRING (-74.1 41.25, -74.08 41.25)'}
          - {part_id: 'nynjtc_long_path:2#1', part_order: 1, refused_because: null, geom_wkt: 'LINESTRING (-74.1 41.2504, -74.08 41.2504)'}
    expect:
      rows: []

  - name: int_trail_network__cuts_a_line_beside_another_is_never_joined
    description: >
      Ports test_a_line_running_beside_another_is_untouched_however_long_it_runs:
      only an end can be joined, never a line's interior, so a line whose
      whole 2.5 km runs 26.69 m beside a longer one, both its ends 26.69 m
      off it (measured in EPSG:5070), is no cut.
    model: int_trail_network__cuts
    given:
      - input: ref('int_trail_network__routable')
        rows:
          - {part_id: 'oprhp_trails:1#1', part_order: 0, refused_because: null, geom_wkt: 'LINESTRING (-74.1 41.25, -74.05 41.25)'}
          - {part_id: 'nynjtc_long_path:2#1', part_order: 1, refused_because: null, geom_wkt: 'LINESTRING (-74.09 41.25024, -74.06 41.25024)'}
    expect:
      rows: []

  - name: int_trail_network__cuts_lines_tested_a_segment_at_a_time_cut_as_whole_lines_do
    description: >
      int_trail_network__cuts' "ONE PIECE AT A TIME", with
      trail_network_piece_segments at 1, so every segment is its own piece:
      the five-vertex line is crossed inside its third segment, one
      `crossing`; the stub's end stops 6.76 m short of the line's vertex at
      -74.09, which two of its pieces share, and is one `endpoint_join`,
      never two. The same rows as the whole lines give (test_dbt_trail_network_parity.py
      holds them to node_lines()).
    model: int_trail_network__cuts
    # A dbt 2.0.6 unit test's vars are its overrides alone, so every var the
    # model reads is listed.
    overrides:
      vars:
        trail_network_endpoint_snap_m: 8.0
        trail_network_piece_segments: 1
    given:
      - input: ref('int_trail_network__routable')
        rows:
          - {part_id: 'oprhp_trails:1#1', part_order: 0, refused_because: null, geom_wkt: 'LINESTRING (-74.1 41.25, -74.095 41.25, -74.09 41.25, -74.085 41.25, -74.08 41.25)'}
          - {part_id: 'oprhp_trails:3#1', part_order: 1, refused_because: null, geom_wkt: 'LINESTRING (-74.0875 41.24, -74.0875 41.26)'}
          - {part_id: 'nynjtc_long_path:2#1', part_order: 2, refused_because: null, geom_wkt: 'LINESTRING (-74.09 41.24, -74.09 41.24994)'}
    expect:
      rows:
        - {cut_key: 'crossing:oprhp_trails:1#1|oprhp_trails:3#1', cut_order: 0, cut_kind: crossing, line_part_id: 'oprhp_trails:1#1', other_part_id: 'oprhp_trails:3#1', end_side: null, end_point_wkt: null}
        - {cut_key: 'endpoint_join:nynjtc_long_path:2#1|oprhp_trails:1#1|end', cut_order: 1, cut_kind: endpoint_join, line_part_id: 'nynjtc_long_path:2#1', other_part_id: 'oprhp_trails:1#1', end_side: end, end_point_wkt: 'POINT (1805708.902606994 2236055.64823628)'}

  # The piece arithmetic (int_trail_network__cuts, "ONE PIECE AT A TIME"):
  # a part of v vertices is cut into (v - 2) // K + 1 pieces of at most K
  # segments, K being trail_network_piece_segments. Every fixture part above
  # and in make_dbt_fixtures.py has at most 5 vertices against the default K
  # of 256, so these set K to 1 or 3 and put the crossing or the end where an
  # off-by-one in the count or the slice bounds would lose it: the last
  # segment, a vertex two pieces share, a loop's closing segment.

  - name: int_trail_network__cuts_a_crossing_in_a_parts_last_segment_is_found_a_segment_at_a_time
    description: >
      At trail_network_piece_segments 1 the four-vertex line is three pieces,
      and the north-south line crosses only the last of them, so a count one
      piece short loses the `crossing`. The stub's end stops short of the
      vertex at -74.098, which the line's second and third pieces share, and
      is one `endpoint_join`, never two.
    model: int_trail_network__cuts
    # A dbt 2.0.6 unit test's vars are its overrides alone, so every var the
    # model reads is listed.
    overrides:
      vars:
        trail_network_endpoint_snap_m: 8.0
        trail_network_piece_segments: 1
    given:
      - input: ref('int_trail_network__routable')
        rows:
          - {part_id: 'oprhp_trails:1#1', part_order: 0, refused_because: null, geom_wkt: 'LINESTRING (-74.1 41.25, -74.099 41.25, -74.098 41.25, -74.097 41.25)'}
          - {part_id: 'oprhp_trails:3#1', part_order: 1, refused_because: null, geom_wkt: 'LINESTRING (-74.0975 41.24, -74.0975 41.26)'}
          - {part_id: 'nynjtc_long_path:2#1', part_order: 2, refused_because: null, geom_wkt: 'LINESTRING (-74.098 41.24, -74.098 41.24994)'}
    expect:
      rows:
        - {cut_key: 'crossing:oprhp_trails:1#1|oprhp_trails:3#1', cut_order: 0, cut_kind: crossing, line_part_id: 'oprhp_trails:1#1', other_part_id: 'oprhp_trails:3#1', end_side: null, end_point_wkt: null}
        - {cut_key: 'endpoint_join:nynjtc_long_path:2#1|oprhp_trails:1#1|end', cut_order: 1, cut_kind: endpoint_join, line_part_id: 'nynjtc_long_path:2#1', other_part_id: 'oprhp_trails:1#1', end_side: end, end_point_wkt: 'POINT (1805061.3009402521 2235903.668919551)'}

  - name: int_trail_network__cuts_a_part_that_exactly_fills_one_piece_keeps_its_last_segment
    description: >
      The same lines at trail_network_piece_segments 3: four vertices are
      exactly one piece of three segments, so a slice that stops a vertex
      early loses the last segment and the `crossing` in it.
    model: int_trail_network__cuts
    overrides:
      vars:
        trail_network_endpoint_snap_m: 8.0
        trail_network_piece_segments: 3
    given:
      - input: ref('int_trail_network__routable')
        rows:
          - {part_id: 'oprhp_trails:1#1', part_order: 0, refused_because: null, geom_wkt: 'LINESTRING (-74.1 41.25, -74.099 41.25, -74.098 41.25, -74.097 41.25)'}
          - {part_id: 'oprhp_trails:3#1', part_order: 1, refused_because: null, geom_wkt: 'LINESTRING (-74.0975 41.24, -74.0975 41.26)'}
          - {part_id: 'nynjtc_long_path:2#1', part_order: 2, refused_because: null, geom_wkt: 'LINESTRING (-74.098 41.24, -74.098 41.24994)'}
    expect:
      rows:
        - {cut_key: 'crossing:oprhp_trails:1#1|oprhp_trails:3#1', cut_order: 0, cut_kind: crossing, line_part_id: 'oprhp_trails:1#1', other_part_id: 'oprhp_trails:3#1', end_side: null, end_point_wkt: null}
        - {cut_key: 'endpoint_join:nynjtc_long_path:2#1|oprhp_trails:1#1|end', cut_order: 1, cut_kind: endpoint_join, line_part_id: 'nynjtc_long_path:2#1', other_part_id: 'oprhp_trails:1#1', end_side: end, end_point_wkt: 'POINT (1805061.3009402521 2235903.668919551)'}

  - name: int_trail_network__cuts_a_part_one_vertex_past_a_full_piece_is_tested_on_its_second_piece
    description: >
      At trail_network_piece_segments 3 a five-vertex line is two pieces, the
      second a single segment, and the north-south line crosses only that
      segment, so a count that rounds two pieces down to one loses the
      `crossing`. The stub's end stops short of the vertex at -74.097, which
      the two pieces share, and is one `endpoint_join`.
    model: int_trail_network__cuts
    overrides:
      vars:
        trail_network_endpoint_snap_m: 8.0
        trail_network_piece_segments: 3
    given:
      - input: ref('int_trail_network__routable')
        rows:
          - {part_id: 'oprhp_trails:1#1', part_order: 0, refused_because: null, geom_wkt: 'LINESTRING (-74.1 41.25, -74.099 41.25, -74.098 41.25, -74.097 41.25, -74.096 41.25)'}
