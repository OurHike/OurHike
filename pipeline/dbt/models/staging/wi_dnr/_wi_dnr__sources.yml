version: 2

sources:
  - name: wi_dnr
    description: >
      Wisconsin DNR's registered layers, landed by the extract's wi_dnr/
      folder (pipeline/extract/wi_dnr/) as raw_wi_dnr__<key>, and staged once
      each by a base model here. Descriptions transcribed from sources.json's
      titles.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_wi_dnr__wi_ice_age_trail
        data_tests:
          # Rows sharing base_wi_dnr__wi_ice_age_trail's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'wi_ice_age_trail'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks(), decision 102), each at warn.
          - elementary.volume_anomalies:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          Ice Age National Scenic Trail in Wisconsin (WDNR) (sources.json
          `wi_ice_age_trail`). Key: one live row, so the registry key alone is
          unique; the geometry is added because a key needs a column beside
          the registry key, and a one-row layer's shape is trivially unique.
