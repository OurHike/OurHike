        description: >
          Trails near the North Country Trail (NCTA) (sources.json `ncta_nearby_trails`).
          Key: geometry with seg_name and updated: 2,243 of 2,243 (measured 2026-10-03).
          Geometry alone is 2,240; seg_name is null on 491 and updated on 538, so the key
