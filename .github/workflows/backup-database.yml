# Backs production's database up every night, encrypted, to a private bucket.
#
# #1908 - Back production's database up nightly to a private R2 bucket, because
# Supabase Free keeps no backups (supabase.com/pricing, read 2026-10-23). The
# maintainer chose this over Supabase Pro by poll on 2026-10-23, and on
# 2026-10-27 chose the four things below: a dedicated role with SELECT and
# BYPASSRLS, `age` encryption, 90 days kept, and this branch.
#
# WHAT A LOST DATABASE COSTS. publish-conditions.yml bakes the closures every
# hiker's phone reads from this database, so one that came back empty would
# publish "no closures" - which reads to a hiker as the trail being open, not
# as data being lost. Also every synced trip, preference, moderation decision
# and organization registry.
#
# THE ORDER IS THE POINT: dump, restore, compare, encrypt, upload. A dump is
# only uploaded once a throwaway Postgres 17 has restored it and every table
# came back holding exactly the rows `count(*)` found in it, counted in the
# snapshot pg_dump dumped - .github/scripts/backup_database.py says why that
# snapshot is shared. And it is encrypted before it leaves the runner: the
# job holds the public `age` recipient only, and the private key stays offline
# with the maintainer, so a leaked bucket token exposes ciphertext.
#
# THE CREDENTIALS ARE THIS JOB'S OWN. BACKUP_DATABASE_URL is the dedicated
# `ourhike_backup` role, through the session pooler on 5432 - not the migration
# owner, and not the transaction pooler, which pg_dump cannot use. The bucket
# is used for nothing else, and its token reaches nothing else: a dump holds
# people's data, so the set of keys that can read it should be one. Retention
# is the bucket's lifecycle rule (90 days), so this job never deletes, and a
# bucket lock rule stops the token deleting or overwriting a backup inside
# those 90 days (LAUNCH_CHECKLIST.md 5b, step 3, which also says what 90
# broken nights in a row do to the last good backup).
# LAUNCH_CHECKLIST.md 5b is how each is made.
#
# HOW IT ALARMS. Like check-deployment.yml, through one tracking issue: opening
# it notifies, updating it does not, and the all-clear closes it. It carries
# the same `deployment-health` label, so scripts/night_queue.py puts an open
# one at the head of the night-shift queue, and a title no other workflow
# uses, so tracking-issue.js - which finds an issue by label AND title - never
# confuses it with another monitor's. Each step that can stop a backup has
# its own row, so the issue blames the step that failed. Unlike
# check-deployment.yml, a configured backup that fails also turns the run
# red - the run listing is the one place a missing backup must never look
# like a present one. A dump big enough to threaten Supabase Free's egress
# quota opens the issue too, as a warning, and leaves the run green: the
# backup itself was taken.
# Missing settings open the issue too, saying production has no backup, which
# until they are set is simply true. They do not turn every night's run red:
# that would be the same news by email every day, which #431 rules out.

name: Back up the database

on:
  schedule:
    # 05:12 UTC daily: the middle of the night across the US, and off the
    # hour because GitHub queues everything submitted at :00. No other
    # schedule here uses minute 12, though several run near it, none sharing
    # anything this job holds: check-pending-approvals at :07 and :37 of
    # every hour (it reads the Actions API); refresh-reference at 05:15 on
    # the 3rd of each month (the raw store, not this bucket);
    # publish-conditions at :40 (production's database too, through its own
    # role); and publish-weather at :55.
    - cron: "12 5 * * *"
  workflow_dispatch:

# Read the repo, write the one tracking issue. The bucket and the database are
# reached through this job's own secrets, never the token.
permissions:
  contents: read
  issues: write

# One at a time, and never cancel a run in flight: a cancelled run could leave
# the tracking issue describing a backup that was half taken.
concurrency:
  group: backup-database
  cancel-in-progress: false

env:
  ISSUE_TITLE: "Nightly database backup"
  ISSUE_LABEL: deployment-health
  # The client tools that dump and restore. pg_dump refuses a server newer
  # than itself, production is Postgres 17, and the runner's own client is 16.
  PG_IMAGE: postgres:17

jobs:
  backup:
    runs-on: ubuntu-latest
    # A cap, not a measurement: nobody has timed a dump of production yet
    # (@unvalidated). The first run's log says how far under thirty minutes
    # the dump, the restore and the upload really are, and that is the number
    # to resize this from.
    timeout-minutes: 30

    # The throwaway database every dump is restored into before it counts. Its
    # password is not a secret: nothing reaches it from outside the job, and
    # it is destroyed with the job.
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      # First, before the checkout and every step that reads a secret. A
      # dispatch can name any branch, and this job hands production's database
      # credential to whatever code that branch holds - the lock migrate.yml
      # and publish-conditions.yml put on their production legs. A schedule
      # always runs from main. Through env, never interpolated: git allows
      # quotes and semicolons in a branch name. It stops a dispatch naming the
      # wrong ref; a branch that edits this file can still delete it, the same
      # limit migrate.yml's guard has, because repository secrets reach every
      # branch's runs.
      - name: Refuse any ref but main
        id: ref
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=Backup refused::$REF is not refs/heads/main, and only main's code may read production's database. Nothing was dumped, and the tracking issue was left alone."
            exit 1
          fi

      # Before the checkout, so no working directory: the rule
      # test_workflow_working_directory.py holds every workflow to.
      - name: Are the backup settings there
        id: can
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          missing=""
          for name in BACKUP_DATABASE_URL BACKUP_R2_BUCKET BACKUP_R2_ACCESS_KEY_ID BACKUP_R2_SECRET_ACCESS_KEY R2_ENDPOINT_URL BACKUP_AGE_RECIPIENT; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::No backup was taken: not set:$missing. See LAUNCH_CHECKLIST.md 5b."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.14"

      # Only the archives this job installs from: the runner's vendor
      # repositories are dropped first, so their outages cannot fail a backup
      # (test_apt_update_is_not_fatal.py, #1361).
      - name: Install age
        id: age
        if: steps.can.outputs.go == 'true'
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            ! -name 'ubuntu.sources' ! -name 'ubuntu.list' -print -delete
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version

      - name: Fetch the Postgres 17 client tools
        id: tools
        if: steps.can.outputs.go == 'true'
        run: docker pull --quiet "$PG_IMAGE"

      - name: Dump
        id: dump
        if: steps.can.outputs.go == 'true'
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: python .github/scripts/backup_database.py dump --workdir "$RUNNER_TEMP/backup" --pg-image "$PG_IMAGE"

      - name: Restore into the scratch database and compare
        id: verify
        if: steps.dump.outcome == 'success'
        run: >-
          python .github/scripts/backup_database.py verify --workdir "$RUNNER_TEMP/backup" --pg-image "$PG_IMAGE"
          --scratch-url "postgresql://postgres:scratch@localhost:5432/postgres"

      - name: Encrypt
        id: seal
        if: steps.verify.outcome == 'success'
        env:
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: python .github/scripts/backup_database.py seal --workdir "$RUNNER_TEMP/backup"

      # The AWS CLI the runner ships, pointed at R2 (region `auto`, which R2's
      # AWS CLI page says the SDK requires and R2 ignores). Checksums only
      # when an operation requires one, so the upload does not depend on R2
      # accepting the CRC headers newer AWS clients add by default: R2's S3
      # compatibility page lists those checksum types without saying which
      # operations take them (both pages read 2026-10-27). The object is then
      # read back whole and its SHA-256 compared with the sealed file's,
      # because "the command exited 0" and "the bucket holds these exact
      # bytes" are different facts, and only the second one is a backup. A
      # size check, which this replaced, passes a same-size corruption. R2's
      # pricing page says "There are no charges for egress bandwidth for any
      # storage class" (read 2026-10-29), so the read-back costs one Class B
      # operation a night and no transfer.
      - name: Upload
        id: upload
        if: steps.seal.outcome == 'success'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
          SEALED: ${{ steps.seal.outputs.file }}
          KEY: ${{ steps.seal.outputs.key }}
        run: |
          set -o pipefail
          aws s3 cp "$SEALED" "s3://$BUCKET/$KEY" --endpoint-url "$R2_ENDPOINT_URL" --only-show-errors
          sealed_sha=$(sha256sum "$SEALED" | cut -d ' ' -f 1)
          stored_sha=$(aws s3 cp "s3://$BUCKET/$KEY" - --endpoint-url "$R2_ENDPOINT_URL" --only-show-errors | sha256sum | cut -d ' ' -f 1)
          if [ "$sealed_sha" != "$stored_sha" ]; then
            echo "::error::The sealed file's SHA-256 is $sealed_sha and the copy read back from the bucket under $KEY hashes to $stored_sha."
            exit 1
          fi
          echo "Stored $KEY, $(stat -c %s "$SEALED") bytes, encrypted, SHA-256 $stored_sha read back from the bucket."

      # Every outcome of a run from main, and nothing from a refused ref: a
      # branch's run is not news about production's backup, and must not be
      # able to close the issue either.
      - name: Open, update, or close the tracking issue
        if: always() && steps.ref.outcome == 'success'
        uses: actions/github-script@v9
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GO: ${{ steps.can.outputs.go }}
          MISSING: ${{ steps.can.outputs.missing }}
          PYTHON: ${{ steps.python.outcome }}
          AGE: ${{ steps.age.outcome }}
          TOOLS: ${{ steps.tools.outcome }}
          DUMP: ${{ steps.dump.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          SEAL: ${{ steps.seal.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          KEY: ${{ steps.seal.outputs.key }}
          EGRESS_WARNING: ${{ steps.dump.outputs.egress_warning }}
        with:
          script: |
            const trackingIssue = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/tracking-issue.js`)
            const env = process.env
            const checkedAt = new Date().toISOString().slice(0, 10)

            // Every step that can stop a backup, in the order they run. The
            // first one that did not succeed is the finding; the ones after
            // it were skipped, and listing them would read as several faults.
            // A failed checkout is the one step with no row: without it this
            // script cannot load tracking-issue.js, and the red run says so.
            const stages = [
              ['settings', env.GO === 'true', `Not set: ${env.MISSING || 'unknown'}. Until they are, production has no backup at all.`],
              ['set up Python', env.PYTHON === 'success', 'actions/setup-python could not provide Python 3.14, so the backup script never ran. A GitHub outage is one cause; rerun the workflow first.'],
              ['install age', env.AGE === 'success', 'apt-get could not install age, so the job stopped before dumping anything it could not have encrypted. An Ubuntu archive outage is one cause; rerun the workflow first.'],
              ['fetch postgres:17', env.TOOLS === 'success', 'docker pull postgres:17 failed, so there were no Postgres 17 tools to dump with. Docker Hub being down or rate-limiting the runner is one cause; rerun the workflow first.'],
              ['dump', env.DUMP === 'success', 'The row count or pg_dump failed, or a table outside public holds rows the backup does not dump: the log says which. A role without BYPASSRLS makes the count refuse, which is the safe failure.'],
              ['restore check', env.VERIFY === 'success', 'The dump did not restore, or a table came back with a different number of rows than it held when it was dumped. The log has the table-by-table comparison.'],
              ['encrypt', env.SEAL === 'success', 'age did not seal the dump, or BACKUP_AGE_RECIPIENT is not an age public key.'],
              ['upload', env.UPLOAD === 'success', 'The encrypted dump did not reach the bucket, or the copy read back from it does not hash to what was sealed.'],
            ]
            const failed = stages.find(([, ok]) => !ok)
            // A warning rather than a failure: the backup was taken, and it is
            // taking one every night at this size that would cost the quota.
            const meaning = Object.fromEntries(failed ? [[failed[0], failed[2]]] : [])
            if (env.EGRESS_WARNING) meaning.egress = env.EGRESS_WARNING
            const keys = Object.keys(meaning)

            await trackingIssue({github, context, core}, {
              label: env.ISSUE_LABEL,
              title: env.ISSUE_TITLE,
              checkedAt,
              keys,
              healthy: keys.length === 0,
              allClear: `Production was backed up again on ${checkedAt}: \`${env.KEY}\`, restored and compared before it was encrypted and uploaded. Closing.`,
              render: (firstSeen, cell) => [
                failed
                  ? `**Production's database was not backed up on ${checkedAt}.** The last good backup is the newest object under \`postgres/\` in the backup bucket. The lifecycle rule deletes every backup 90 days after its upload, newer one or not, so if this stays open until that one is 90 days old, the bucket holds none.`
                  : `**Production was backed up on ${checkedAt}** (\`${env.KEY}\`), **and a dump this size every night threatens Supabase's egress quota.**`,
                '',
                '| stage | first seen | what it means |',
                '|---|---|---|',
                ...keys.map((key) => `| ${cell(key)} | ${firstSeen[key]} | ${cell(meaning[key])} |`),
                '',
                `[The run](${env.RUN_URL}). How to fix each stage, and how to restore: LAUNCH_CHECKLIST.md 5b.`,
              ].join('\n'),
            })

      - name: Fail the run when a configured backup was not taken
        if: steps.can.outputs.go == 'true' && steps.upload.outcome != 'success'
        run: |
          echo "::error::No backup was taken tonight. The tracking issue names the stage that failed."
          exit 1
