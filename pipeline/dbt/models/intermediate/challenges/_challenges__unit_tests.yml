version: 2

# The challenges family's unit tests, one row per pytest case of
# tests/test_lib_challenges.py and tests/test_export_challenges.py whose
# rule moved to SQL (pipeline/ELT.md, "Tests move with their rule"), each
# keyed by that case's id. Each row's expected values are today's Python's
# answer for it, except the rows tests/test_dbt_challenges_parity.py lists
# as deliberate; that test runs the Python over these same given rows and
# fails on any other difference.
unit_tests:
  - name: int_challenges__publishers_follow_publisher_scope
    description: >
      One publishers.json row per pytest case of export_challenges.py's
      publisher_scope() and publisher_domains(), each naming its case in a
      `_case` field neither reads, in one file, so a later row of an
      organization sees the earlier ones as the Python does.
    model: int_challenges__publishers
    given:
      - input: ref('base_ourhike__challenges_publishers')
        rows:
          - {"file_json": "{\"publishers\":[{\"_case\":\"test_export_challenges::TestPublisherDomain::test_every_challenge_carries_its_publishers_domain_lower_cased\",\"org\":\"atc\",\"trails\":[\"AT\"],\"why\":\"The A.T.'s route owner.\",\"domain\":\"AppalachianTrail.org\"},{\"_case\":\"test_export_challenges::TestPublisherScope::test_a_second_row_for_the_same_organization_is_refused\",\"org\":\"atc\",\"trails\":[\"LP\"],\"why\":\"again\"},{\"_case\":\"test_export_challenges::TestPublisherScope::test_an_organization_sources_json_does_not_register_is_refused\",\"org\":\"nobody\",\"trails\":[\"AT\"],\"why\":\"x\"},{\"_case\":\"test_export_challenges::TestPublisherScope::test_a_row_that_gives_no_reason_is_refused\",\"org\":\"nynjtc\",\"trails\":[\"LP\"]},{\"_case\":\"test_export_challenges::TestPublisherScope::test_an_organization_with_no_name_or_provider_to_publish_is_refused\",\"org\":\"noprov\",\"trails\":[\"AT\"],\"why\":\"x\",\"domain\":\"x.org\"},{\"_case\":\"test_export_challenges::TestPublisherDomain::test_a_row_with_no_domain_is_refused\",\"org\":\"gmc\",\"trails\":[\"LT\"],\"why\":\"x\"},{\"_case\":\"test_export_challenges::TestTheSavingDomain::test_a_refused_publisher_row_cannot_supply_the_domain[the refused row]\",\"org\":\"patc\",\"trails\":[\"AT\"],\"domain\":\"evil.example\"},{\"_case\":\"test_export_challenges::TestTheSavingDomain::test_a_refused_publisher_row_cannot_supply_the_domain[the real row]\",\"org\":\"patc\",\"trails\":[\"AT\"],\"why\":\"x\",\"domain\":\"patc.net\"},{\"_case\":\"test_export_challenges::publisher_scope::trails_that_are_not_a_list_are_refused\",\"org\":\"cmc\",\"trails\":\"AT\",\"why\":\"x\",\"domain\":\"carolinamtnclub.org\"},\"just a string\",{\"_case\":\"test_export_challenges::publisher_scope::a_why_of_only_spaces_is_no_why\",\"org\":\"smhc\",\"trails\":[\"AT\"],\"why\":\"  \",\"domain\":\"smhc.org\"},{\"_case\":\"test_export_challenges::publisher_scope::a_domain_that_is_not_a_domain_is_no_domain\",\"org\":\"gatc\",\"trails\":[\"AT\"],\"why\":\"x\",\"domain\":\"not a domain\"},{\"_case\":\"test_lib_challenges::TestScopedToThePublisher::test_a_malformed_org_drops_the_file_rather_than_crashing_the_job[publishers.json]\",\"org\":[\"atc\"],\"trails\":[\"AT\"],\"why\":\"x\"}]}", "_loaded_at": "2026-10-02 00:00:00+00"}
      - input: ref('stg_registry__organizations')
        rows:
          - {"steward_id": "org:atc", "provider": "ATC", "org_name": "Appalachian Trail Conservancy"}
          - {"steward_id": "org:nynjtc", "provider": "NYNJTC", "org_name": "New York-New Jersey Trail Conference"}
          - {"steward_id": "org:noprov", "provider": null, "org_name": "Appalachian Trail Conservancy"}
          - {"steward_id": "org:gmc", "provider": "GMC", "org_name": "Green Mountain Club"}
          - {"steward_id": "org:patc", "provider": "PATC", "org_name": "Potomac Appalachian Trail Club"}
          - {"steward_id": "org:cmc", "provider": "CMC", "org_name": "Carolina Mountain Club"}
          - {"steward_id": "org:smhc", "provider": "SMHC", "org_name": "Smoky Mountains Hiking Club"}
          - {"steward_id": "org:gatc", "provider": "GATC", "org_name": "Georgia Appalachian Trail Club"}
    expect:
      rows:
        - {"publisher_position": 1, "accepted": true, "problem": null, "org_domain": "appalachiantrail.org"}
        - {"publisher_position": 2, "accepted": false, "problem": "atc: listed twice - the first row stands", "org_domain": null}
        - {"publisher_position": 3, "accepted": false, "problem": "'nobody': not an organization in sources.json (looked for 'org:nobody')", "org_domain": null}
        - {"publisher_position": 4, "accepted": false, "problem": "nynjtc: the row gives no `why`", "org_domain": null}
        - {"publisher_position": 5, "accepted": false, "problem": "noprov: sources.json 'org:noprov' has no name or no provider to publish beside its challenges", "org_domain": null}
        - {"publisher_position": 6, "accepted": false, "problem": "gmc: the row gives no web `domain` (like appalachiantrail.org)", "org_domain": null}
        - {"publisher_position": 7, "accepted": false, "problem": "patc: the row gives no `why`", "org_domain": null}
        - {"publisher_position": 8, "accepted": true, "problem": null, "org_domain": "patc.net"}
        - {"publisher_position": 9, "accepted": false, "problem": "cmc: `trails` is not a list", "org_domain": null}
        - {"publisher_position": 10, "accepted": false, "problem": "a row is not an object: 'just a string'", "org_domain": null}
        - {"publisher_position": 11, "accepted": false, "problem": "smhc: the row gives no `why`", "org_domain": null}
        - {"publisher_position": 12, "accepted": false, "problem": "gatc: the row gives no web `domain` (like appalachiantrail.org)", "org_domain": null}
        - {"publisher_position": 13, "accepted": false, "problem": "['atc']: not an organization in sources.json (looked for 'org:['atc']')", "org_domain": null}
  - name: int_challenges__publisher_trails_keep_the_trails_a_published_poi_carries
    description: >
      publisher_scope()'s last step, one accepted row per pytest case: a
      trail no published POI carries is refused and the org keeps its row,
      and only the bad trail of a row is refused.
    model: int_challenges__publisher_trails
    given:
      - input: ref('int_challenges__publishers')
        rows:
          - {"publisher_position": 1, "org": "atc", "accepted": true, "trails_json": "[\"AT\",\"LP\"]"}
          - {"publisher_position": 2, "org": "nynjtc", "accepted": true, "trails_json": "[\"at\"]"}
          - {"publisher_position": 3, "org": "gmc", "accepted": true, "trails_json": "[7,\"LT\"]"}
      - input: ref('int_challenges__published_pois')
        rows:
          - {"poi_id": "p:AT", "trail_id": "AT"}
          - {"poi_id": "p:LT", "trail_id": "LT"}
    expect:
      rows:
        - {"publisher_trail_id": "1.1", "in_scope": true, "problem": null}
        - {"publisher_trail_id": "1.2", "in_scope": false, "problem": "atc: trail 'LP' is carried by no published POI"}
        - {"publisher_trail_id": "2.1", "in_scope": false, "problem": "nynjtc: trail 'at' is carried by no published POI"}
        - {"publisher_trail_id": "3.1", "in_scope": false, "problem": "gmc: trail 7 is carried by no published POI"}
        - {"publisher_trail_id": "3.2", "in_scope": true, "problem": null}
  - name: int_challenges__publisher_trails_refuse_every_trail_with_no_published_poi
    description: >
      test_export_challenges::TestPublisherScope::test_with_no_published_pois_every_trail_is_refused.
    model: int_challenges__publisher_trails
    given:
      - input: ref('int_challenges__publishers')
        rows:
          - {"publisher_position": 1, "org": "atc", "accepted": true, "trails_json": "[\"AT\"]"}
      - input: ref('int_challenges__published_pois')
        rows: []
    expect:
      rows:
        - {"publisher_trail_id": "1.1", "in_scope": false, "problem": "atc: trail 'AT' is carried by no published POI"}
