# GENERATED by pipeline/make_dbt_staging.py from sources.json
# and the extract's club folders; edit them or it, never this file.
version: 2

sources:
  - name: catamount
    description: >
      The layers sources.json registers for the extract's catamount/ folder
      (pipeline/extract/catamount/) that pipeline/make_dbt_staging.py stages, landed as
      raw_catamount__<key> and staged once each by a generated base model here. Descriptions
      transcribed from sources.json's titles and key notes.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      meta:
        cadence: monthly
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_catamount__catamount_access_points
        data_tests:
          # Rows sharing base_catamount__catamount_access_points's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'catamount_access_points'", "md5(st_astext(st_geomfromgeojson(cast(geometry as varchar))))"]
                row_id_columns: ["objectid", "objectid_1", "objectid_12", "oid", "esri_oid", "fid", "ogc_fid", "_dlt_id", "_socrata_id", "feature_index", "feature_id"]
        description: >
          Catamount Trail access points (the association's web map CSV) (sources.json
          `catamount_access_points`). Key: The geometry alone: unique on 80 of 80
          (measured 2026-10-04).
      - name: raw_catamount__catamount_backcountry_zones
        data_tests:
          # Rows sharing base_catamount__catamount_backcountry_zones's key must be exact copies (decision 40).
