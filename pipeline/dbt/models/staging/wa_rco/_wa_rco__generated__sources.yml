        description: >
          WA Public Lands Inventory 2019 (sources.json `wa_public_lands_inventory`). Key:
          the geometry with Land_Owner, Purchase_Date and FIPS: 32,563 of 32,563 after 30
          exact copies, which the base model's dedupe removes (measured 2026-10-03 by
          reading every row and every vertex as the extract reads the layer (f=geojson,
