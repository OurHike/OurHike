version: 2

# NYNJTC's Trail Alerts, in their own file beside _nynjtc__sources.yml, which
# declares the club's trail extracts under the same source name: dbt merges
# the tables of one source across files (dbt 2.0.6, parsed 2026-10-02), and
# each block's own config applies to its own tables.
sources:
  - name: nynjtc
    description: >
      NYNJTC's own layers and feeds, landed by the extract's nynjtc/ folder.
      This file holds its Trail Alerts (sources.json's `nynjtc_trail_alerts`),
      landed by nynjtc/closures.py, which warnings.py shares.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      meta:
        cadence: hourly
      freshness:
        # How recently the extract loaded the posts, which moves only when
        # NYNJTC's (id, modified) set does (WordpressPosts' change check), so
        # a quiet week reads as stale. @unvalidated: 7 days is the atc
        # source's inherited threshold, and what settles it is stage 5 of
        # #1793 — Rebuild the data platform as dlt → dbt: seven contracted
        # marts, a monthly refresh, published docs, and lighter phone
        # downloads reading _extract_runs.checked_at instead.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_nynjtc__nynjtc_trail_alerts
        data_tests:
          # Rows sharing base_nynjtc__nynjtc_trail_alerts's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'nynjtc_trail_alerts'", "id"]
        description: >
          The Trail Alerts category's posts as NYNJTC's WordPress REST API
          serves them, one row per post: 18 on 2026-10-01, the oldest from
          2024-01-11. Nested values stay one JSON column each (`title`,
          `content`, and the place-term id lists `trail`, `park`, `region`
          and `state`), and the fields that name a person never land
          (_kinds.py's WP_DROPPED). The body, `content`, is NYNJTC's writing
          and stays in the private raw store: nynjtc_notices_licence
          authorises the headline, locality, `modified` date and URL only.
          Key: the post's WordPress id.
        columns:
          - name: id
            description: The post's WordPress id.
            data_tests: [not_null]
      - name: raw_nynjtc__nynjtc_trail_alerts_terms
        data_tests:
          # Rows sharing base_nynjtc__nynjtc_trail_alerts_terms's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'nynjtc_trail_alerts_terms'", "taxonomy", "id"]
        config:
          meta:
            # Read once a day on the hourly lane: a renamed term moves no
            # post's `modified` (extract/_kinds.py's TERMS_CADENCE_REASON).
            cadence: daily
        description: >
          The four place taxonomies a post is tagged from (lib/nynjtc_alerts.py's
          PLACE_TAXONOMIES: trail, park, region, state), one row per term with
          its taxonomy: 45, 125, 13 and 3 terms on 2026-10-02. Names arrive
          HTML-escaped, `&amp;` once. Key: the taxonomy and the term's id.
        columns:
          - name: id
            description: The term's WordPress id, which a post's taxonomy list carries.
            data_tests: [not_null]
