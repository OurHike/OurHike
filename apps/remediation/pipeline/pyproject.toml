[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# pipeline/pyproject.toml's narrow set, for the reason given there: pyflakes,
# core pycodestyle errors and import sorting, not Ruff's ~800-rule default.
select = ["E4", "E7", "E9", "F", "I"]
