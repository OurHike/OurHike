  - name: pub_conditions_notices_simplifies_an_area_for_a_phone
    model: pub_conditions_notices
    description: >
      The geometry a phone needs (decision 77, the writer's header): a
      hunting parcel about 4 km by 1.1 km, with a vertex 3 m off its edge and
      two that lie on it, is grown 100 m outward and simplified at 100 m to
      four corners at 5 decimal places, the corners' curves cut by the
      simplifier, so a layer's survey detail does not ride to every phone.
      Every corner of the parcel is inside it
      (assert_a_notice_area_covers_every_vertex_of_its_source holds that for
      this parcel and the shapes that bite). The shell is wound
      counterclockwise, as RFC 7946 asks of a writer.
    overrides:
      macros:
        python_run_stamp: "'2026-10-04T12:00:00Z'"
        # A build with its row history, whatever the environment running the
        # test says: the history-off case writes no file while a club is
        # held, and tests/test_dbt_notice_tables_absent_builds.py holds it.
        when_row_history_is_off: ""
    given:
      - input: ref('closures', v=1)
        rows: []
      - input: ref('warnings', v=1)
        format: sql
        rows: |
          select
              'iata_lands_hunting_regs:1' as warning_id,
              'org_notice' as warning_kind,
              'iata' as club,
              'iata_lands_hunting_regs' as source_key,
              cast(null as boolean) as obstructs_trail,
              'not_reviewed' as review_state,
              'Fixture Hunting Parcel' as title,
              'Open for public hunting' as category,
              cast(null as json) as states,
              'Fixture' as locality,
              cast(null as double) as mile_start,
              cast(null as double) as mile_end,
              cast(null as date) as starts_on,
              cast(null as date) as ends_on,
              cast(null as varchar) as updated_at,
              cast(null as varchar) as source_url,
              '{"type":"Polygon","coordinates":[[[-89.5,44.5],[-89.4875,44.5],[-89.475,44.500027],[-89.4625,44.5],[-89.45,44.5],[-89.45,44.51],[-89.5,44.51],[-89.5,44.5]]]}' as geom_geojson,
              cast('2026-10-03 00:00:00+00' as timestamptz) as _first_seen_at,
              cast('2026-10-03 00:00:00+00' as timestamptz) as _changed_at,
              cast(null as timestamptz) as carried_since,
              cast(null as boolean) as stands_until_lifted,
              cast(null as varchar) as issuer
      - input: ref('notice_readers')
        rows:
          - {source_key: iata_lands_hunting_regs, club: iata, notice_type: warnings, reader: arcgis_layer, listing: full, raw_table: raw_iata__iata_lands_hunting_regs, staged_by: stg_iata__iata_lands_hunting_regs, steward_kind: club}
      - input: ref('stg_registry__sources')
        rows:
          - {source_key: iata_lands_hunting_regs, provider: IATA, title: 'Ice Age Trail Alliance lands hunting regulations'}
      - input: ref('notice_hazard_areas')
        rows:
          - {source_key: iata_lands_hunting_regs, hazard: hunting, category_value: 'Open for public hunting', why: 'Fixture'}
      - input: ref('notice_states')
        rows: []
      - input: ref('int_closures__nynjtc_checked')
        rows: []
      - input: ref('int_closures__gate')
        rows:
          - {source_key: iata_lands_hunting_regs, passed: true, may_publish: true}
      - input: ref('base_extract__runs')
        rows:
          - {table_name: raw_iata__iata_lands_hunting_regs, outcome: loaded, checked_at: '2026-10-04 10:00:00+00'}
    expect:
      rows:
        - {notices: '[{"notice_id":"iata_lands_hunting_regs:1","source_key":"iata_lands_hunting_regs","club":"iata","provider":"IATA","steward_kind":"club","title":"Fixture Hunting Parcel","category":"Open for public hunting","locality":"Fixture","place":{"kind":"geometry","geometry":{"type":"Polygon","coordinates":[[[-89.50126,44.5],[-89.44975,44.49911],[-89.44876,44.51018],[-89.50025,44.51089],[-89.50126,44.5]]]}},"hazard":"hunting","obstructs_trail":false,"starts_on":null,"ends_on":null,"updated_at":null,"checked_at":"2026-10-04T10:00:00Z","first_seen_at":"2026-10-03T00:00:00Z","changed_at":"2026-10-03T00:00:00Z","carried_since":null,"source_url":null,"review_state":"unreviewed"}]'}

