version: 2

sources:
  - name: azgeo
    description: >
      AZGeo's registered layers, landed by the extract's azgeo/ folder
      (pipeline/extract/azgeo/) as raw_azgeo__<key>, and staged once each by a
      base model here. Descriptions transcribed from sources.json's titles.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        # The extract's cadence, not the steward's. @unvalidated, the same
        # threshold and open question as _atc__sources.yml.
        warn_after: {count: 7, period: day}
    tables:
      - name: raw_azgeo__azgeo_arizona_trail
        data_tests:
          # Rows sharing base_azgeo__arizona_trail's key must be exact copies (decision 40).
          - duplicates_are_exact:
              arguments:
                key_columns: ["'azgeo_arizona_trail'", "globalid"]
          # Elementary's checks (make_dbt_staging.py's raw_table_checks(), decision 102), each at warn.
          - elementary.volume_anomalies:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
          - elementary.schema_changes:
              config:
                severity: warn
                tags: [elementary_check]
                enabled: "{{ env_var('OURHIKE_ELEMENTARY_CHECKS', 'false') == 'true' }}"
        description: >
          Arizona National Scenic Trail (AZGeo) (sources.json
          `azgeo_arizona_trail`). Key: GlobalID unique on 145 live rows.
