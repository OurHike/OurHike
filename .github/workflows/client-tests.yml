name: Client tests

on:
  # `main` only. Matching every branch here would double every PR's CI:
  # pushing to a PR branch fires BOTH the push event and the pull_request
  # event for the same commit, running each job twice for an identical
  # result. The pull_request trigger below already covers branches.
  #
  # This run is still worth keeping for main itself - it is post-merge
  # validation against the real merge commit, which is exactly what caught
  # the flaky staleness boundary test in #32 (green on the PR, red on the
  # merge).
  push:
    branches: [main]
  # Deliberately NOT narrowed with `paths:`, even though that is the obvious
  # way to stop a docs-only PR building the client. A workflow skipped by a
  # path filter reports no status at all, and a required check that reports
  # no status blocks the PR forever rather than passing it - the same trap
  # pr-issue-link.yml documents for job-level `if:`. The scoping happens
  # inside the job instead, where it can still finish green.
  pull_request:
    branches: [main]
  # The event a merge queue raises checks on. This has to be in place before
  # the queue is switched on rather than after: a required check that never
  # reports does not fail a queue entry, it hangs it until the queue times out
  # and ejects the pull request. BRANCHING.md holds the rest of the setup.
  #
  # Deliberately unfiltered, unlike the two triggers above. A queue entry's ref
  # is `refs/heads/gh-readonly-queue/main/pr-N-<sha>` rather than `main`, and
  # `merge_group`'s `branches:` filter is undocumented as to which of those two
  # it matches (github/docs#32879). A filter that guesses wrong costs the same
  # hang as no trigger at all, and there is nothing to scope anyway - a queue
  # is enabled per branch in the ruleset, and only `main` has one.
  merge_group:

# Narrower than the default token. `pull-requests: read` is what lets the
# scope step ask which files the pull request touches.
permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      # No `if:` on this job, and there should never be one - see the note on
      # the trigger above. The steps carry the condition instead, so a PR that
      # touches nothing under client/ still reports success having done
      # nothing, and this can be made a required check without that becoming a
      # trap.
      #
      # Checkout is unconditional because the scope action lives in this
      # repository and has to be on disk before it can decide anything.
      - uses: actions/checkout@v7

      - id: scope
        uses: ./.github/actions/changed-paths
        with:
          # client/ carries its own package.json and lockfile, and nothing
          # outside it is IMPORTED by the client - checked, not assumed.
          # The workflow and the action are in the list so a change to the
          # gate itself still proves the suite it gates.
          #
          # Imported is not the same as read, and the difference was a real
          # hole (TESTING.md's "Redundancy" audit, 2026-08-06). Three suites
          # read files outside client/ at runtime:
          #
          #   pipeline/reference/gain_vectors.json  lib/elevationGain.test.ts
          #   site/src/ (stylesheet, install page)  test/siteLayout.test.ts
          #   .github/ISSUE_TEMPLATE/*.yml          test/issueFormPrefill.test.ts
          #   pipeline/tests/fixtures/              lib/poiIdentity.contract.test.ts
          #
          # The fourth is #831's two-runtime resolver: the POI id resolver
          # exists once in Python and once in TypeScript, because neither
          # package can import the other, and one fixture file is the whole
          # of what holds them to the same answers. Editing a case has to
          # run both suites or the guard checks one implementation against
          # cases the other never saw.
          #
          # Scoped to client/ alone, a pull request editing the shared gain
          # vectors ran only the Python half of a drift guard whose whole
          # point is that both halves read the same file - and only the
          # unscoped run on `main` closed it, after the merge. The rule that
          # keeps this honest: **a suite's scope list includes every file its
          # tests read.**
          #
          # The issue forms joined that list with #626: Settings links into
          # them with fields prefilled, and GitHub matches a prefilled dropdown
          # by its option TEXT - so rewording a label there and nowhere else
          # breaks the links silently, and this is the run that says so.
          paths: client/ pipeline/reference/ pipeline/tests/fixtures/ site/ .github/ISSUE_TEMPLATE/ .github/workflows/client-tests.yml .github/actions/changed-paths/

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Lint
        if: steps.scope.outputs.run == 'true'
        run: npm run lint

      - name: Check formatting
        if: steps.scope.outputs.run == 'true'
        run: npm run format:check

      - name: Typecheck
        if: steps.scope.outputs.run == 'true'
        run: npm run typecheck

      - name: Run tests
        if: steps.scope.outputs.run == 'true'
        run: npm test

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: npm run build

  # The flow layer (features/FLOW_TESTING.md), which until now was written and
  # never run on a pull request: #1386 built the suite, the pull request
  # template asks which flows a change drives, and nothing checked either. A
  # test nobody runs is a comment with a longer syntax.
  #
  # ITS OWN JOB rather than a step in `test` above, for two reasons. It needs a
  # browser - two minutes of download the unit suite should not pay for - and
  # it is the slower half, so running the two in parallel keeps the wall clock
  # at the longer of them instead of the sum.
  #
  # The same scope gate, the same shape, and the same reason there is no `if:`
  # on the job: a required check that reports nothing blocks a pull request
  # forever. A docs-only change finishes this job green having done nothing.
  flow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - id: scope
        uses: ./.github/actions/changed-paths
        with:
          # Narrower than the unit suite's list on purpose: the flow layer
          # boots the built client and drives it, so it reads nothing outside
          # client/ at runtime - no gain vectors, no issue forms, no site
          # stylesheet. Its own workflow and the scope action are in the list
          # for the reason they are in that one, so a change to the gate still
          # proves the suite it gates.
          paths: client/ .github/workflows/client-tests.yml .github/actions/changed-paths/

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      # Chromium alone, and no `--with-deps`. The engine axis wants WebKit too
      # and deliberately does not have it yet - features/FLOW_TESTING.md's own
      # "Status: not yet run", which asks that whoever turns it on runs it
      # locally first rather than discovering the engine's differences as a red
      # pull request. The flag is refused by
      # .github/tests/test_apt_update_is_not_fatal.py, and the reason is worth
      # knowing rather than working around: it has Playwright shell out to apt
      # and propagate apt's exit 100, so an inconsistent upstream mirror fails a
      # required check for a download that needs no apt at all (#1361). This
      # runner already carries the shared libraries Chromium wants.
      - name: Install Chromium
        if: steps.scope.outputs.run == 'true'
        run: npx playwright install chromium

      # playwright.config.ts builds and serves the real bundle under CI rather
      # than running the dev server - "what CI shoots: same bytes it deploys",
      # screenshot.mjs's reasoning, applied to assertions.
      - name: Flow tests
        if: steps.scope.outputs.run == 'true'
        run: npx playwright test

      # Only on failure, and only for a fortnight: the report carries a trace
      # per failed test (`trace: 'retain-on-failure'`), which is how a failure
      # that reproduces only in CI gets diagnosed without guessing.
      - name: Keep the report when it fails
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flow-test-report
          path: client/playwright-report/
          retention-days: 14

  # The data-backed half of the flow layer (client/e2e/data/), which reads the
  # release lib/dataRelease.ts pins rather than driving a phone that has
  # downloaded nothing. It is what makes the builder, the route and the
  # waypoint screens drivable at all - #1387's gap - and the maintainer took
  # the decision to run it here on 2026-09-11 with its cost stated.
  #
  # ITS OWN JOB, WHICH IS THE POINT. A test that reads a bucket can go red
  # because the bucket did, and that failure is indistinguishable from a broken
  # build in a log. Keeping it apart means the hermetic tests in `flow`
  # answer "is the client broken" on their own, and this job answers a
  # different question that nobody has to untangle from theirs. The other two
  # things holding the flakiness down are in playwright.config.ts's FLOW_DATA
  # comment: the release is pinned and immutable, so the bytes cannot move
  # under a run without a reviewed commit, and a preflight fetch reports an
  # outage as an outage before any assertion runs.
  #
  # NOT REQUIRED, and should not be made so while it reads a network. A
  # required check that can go red for a reason outside the repository blocks
  # pull requests on somebody else's outage.
  flow-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - id: scope
        uses: ./.github/actions/changed-paths
        with:
          # The same list as `flow` above, plus the release pin: bumping
          # DATA_RELEASE changes which bytes this job reads, which is exactly
          # the change most worth re-running it for.
          paths: client/ .github/workflows/client-tests.yml .github/actions/changed-paths/

      # Where the data comes from, resolved the way every other workflow in
      # this repository resolves it (ua.yml's "Resolve the data source"): the
      # UA prefix of the configured bucket. UA rather than production because
      # that is what this branch's pin names, and because UA is where a
      # release lands first - a job that tested production would be testing
      # the release before this one.
      - id: data
        if: steps.scope.outputs.run == 'true'
        env:
          UA_URL: ${{ vars.UA_DATA_BASE_URL }}
          FROM_VAR: ${{ vars.DATA_BASE_URL }}
          FROM_SECRET: ${{ secrets.DATA_BASE_URL }}
        run: |
          BASE="${FROM_VAR:-$FROM_SECRET}"
          if [ -n "$UA_URL" ]; then
            URL="$UA_URL"
          elif [ -n "$BASE" ]; then
            URL="$BASE/environments/ua"
          else
            URL=""
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -z "$URL" ]; then
            echo "::notice::No data source is configured, so the data-backed flow tests have nothing to read and are skipped. See LAUNCH_CHECKLIST.md 1.5."
          else
            echo "Data source: $URL"
          fi

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.run == 'true' && steps.data.outputs.url != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true' && steps.data.outputs.url != ''
        run: npm ci

      # Chromium alone and no `--with-deps`, for the reason the `flow` job
      # gives above (#1361).
      - name: Install Chromium
        if: steps.scope.outputs.run == 'true' && steps.data.outputs.url != ''
        run: npx playwright install chromium

      # No proxy here, unlike the sandbox: a runner reaches the bucket itself,
      # and the build carries the real base URL so the app requests it the way
      # a deployed build does. scripts/data-proxy.mjs exists for the other
      # case and says so on itself.
      - name: Flow tests against the pinned release
        if: steps.scope.outputs.run == 'true' && steps.data.outputs.url != ''
        env:
          VITE_DATA_BASE_URL: ${{ steps.data.outputs.url }}
        run: npm run test:e2e:data

      - name: Keep the report when it fails
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flow-data-test-report
          path: client/playwright-report/
          retention-days: 14
