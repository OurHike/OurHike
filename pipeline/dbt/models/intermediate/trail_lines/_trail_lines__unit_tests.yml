  - name: int_trail_lines__at_chain_miles_read_a_shared_end_on_the_piece_it_begins
    description: >
      sql::a_vertex_where_one_piece_ends_and_the_next_begins_takes_the_next:
      the axis_mile macro's tie order, which no pytest names and STRtree leaves
      implementation-defined (@unvalidated, the macro's header). Piece 0 ends
      at mile 10.144 where piece 1 begins at 10.0, and the chain's first vertex
      stands on that point: it reads 10.0, the piece it does not end.
    model: int_trail_lines__at_chain_miles
    given:
      - input: ref('int_trail_lines__at_chains')
        rows:
          - {trail_line_id: "centerline:chain:0", chain_index: 0, geom_wkt: "LINESTRING (-74.0 41.0, -73.99415413240905 40.99901882207666)"}
      - input: ref('int_trail_lines__mile_axis')
        format: sql
        rows: |
          select 0::integer as piece_id, 0::integer as pre_calibration_order,
            st_geomfromtext('LINESTRING (1818414.0207331162 2210531.895375706, 1819414.0207331162 2210531.895375706)') as geom_5070, 1000.0::double as length_m,
            9.522628807762667::double as start_mile, 10.144::double as end_mile,
            [0.0, 0.621371192237334]::double[] as anchor_along_mi,
            [9.522628807762667, 10.144]::double[] as anchor_mile,
            2::integer as anchor_count, 2::integer as snapped_marker_count,
            false as reversed_by_markers
          union all
          select 1::integer as piece_id, 1::integer as pre_calibration_order,
            st_geomfromtext('LINESTRING (1819414.0207331162 2210531.895375706, 1820414.0207331162 2210541.895375706)') as geom_5070, 1000.0499987500625::double as length_m,
            10.0::double as start_mile, 10.62140226002027::double as end_mile,
            [0.0, 0.6214022600202707]::double[] as anchor_along_mi,
            [10.0, 10.62140226002027]::double[] as anchor_mile,
            2::integer as anchor_count, 2::integer as snapped_marker_count,
            false as reversed_by_markers
    expect:
      rows:
        - {trail_line_id: "centerline:chain:0", vertex_miles_json: "[10.0,10.311]", monotonic_breaks: 0}

