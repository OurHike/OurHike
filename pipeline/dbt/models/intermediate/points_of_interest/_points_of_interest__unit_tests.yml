version: 2

# The points_of_interest family's unit tests, one per rule that moved, each table-driven: one row per
# case of the Python test or function it is named after. tests/test_dbt_points_of_interest_parity.py
# runs today's Python over each test's given rows and holds every expected row to its answer.
#
# HOW EXACT A UNIT TEST IS HERE (dbt 2.0.6, the trail_lines family's measurement of 2026-10-02): a
# VARCHAR, integer or boolean column is compared exactly, a DOUBLE only after rounding to one decimal.
# So every column these hold is text, an integer or a boolean: the mile is its three-decimal text,
# water distances and capacities are integer feet and people, and `nearby` is its JSON text.
unit_tests:
  - name: int_points_of_interest__described_says_what_lib_poi_description_says
    description: >
      PO19 and PO20, one row per case of tests/test_lib_poi_description.py's
      describers and tests/test_lib_atc_notes.py's clean_note() (a note rides
      a shelter that states nothing else, so the sentence is "Shelter. ATC
      notes: ..." or nothing), plus edges those tests leave implicit, each
      named `edge_`. Every expected sentence is what export_poi.py's
      attach_descriptions() composes from the same ATC columns, which the
      warehouse holds lower-cased (dlt's sql_ci_v1):
      tests/test_dbt_points_of_interest_parity.py runs it over these rows.
    model: int_points_of_interest__described
    given:
      - input: ref('int_points_of_interest__enriched')
        rows:
          - {poi_id: 'atc:the_sentence_reads_as_a_sentence', poi_type: 'shelter', phone_files: 'poi_by_type', properties: '{"stories": 2, "exterior_m": "2", "chimneys": 1, "metal_fir": 1, "mortared": 0, "food_boxe": 0, "food_cabl": 0, "food_pole": 0, "deck_lengt": 24, "year_built": 1915}', capacity: 14}
          - {poi_id: 'atc:the_plain_case_says_only_what_atc_states', poi_type: 'shelter', phone_files: 'poi_by_type', properties: '{"stories": 1, "exterior_m": "5", "chimneys": 0, "metal_fir": 0, "mortared": 0, "food_boxe": 0, "food_cabl": 0, "food_pole": 0, "deck_lengt": 0, "year_built": 1954}', capacity: 6}
