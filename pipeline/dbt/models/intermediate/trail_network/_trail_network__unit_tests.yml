  # ---------------------------------------------------------- the edges

  - name: int_trail_network__raw_edges_a_weld_makes_the_stub_end_the_junction
    description: >
      The graph half of test_an_end_stopping_short_of_another_line_is_joined_within_the_tolerance:
      the weld merges the stub end's node (4) into the junction's (1),
      keeping the lower, so the stub's edge runs from its own start to the
      junction, which three edges now share. Nodes are numbered as the
      edges first reach them.
    model: int_trail_network__raw_edges
    given:
      - input: ref('int_trail_network__node_lookups')
        rows:
          - {seq: 0, lookup_kind: piece_start, part_id: 'main#1', piece_index: 0, piece_rank: 0, cut_key: null, x: 0.0, y: 0.0, status: makes, makes_node: true, node_raw: 0}
          - {seq: 1, lookup_kind: piece_end, part_id: 'main#1', piece_index: 0, piece_rank: 0, cut_key: null, x: 100.0, y: 0.0, status: makes, makes_node: true, node_raw: 1}
          - {seq: 2, lookup_kind: piece_start, part_id: 'main#1', piece_index: 1, piece_rank: 1, cut_key: null, x: 100.0, y: 0.0, status: finds, makes_node: false, node_raw: 1}
          - {seq: 3, lookup_kind: piece_end, part_id: 'main#1', piece_index: 1, piece_rank: 1, cut_key: null, x: 200.0, y: 0.0, status: makes, makes_node: true, node_raw: 2}
          - {seq: 4, lookup_kind: piece_start, part_id: 'stub#1', piece_index: 0, piece_rank: 2, cut_key: null, x: 100.0, y: -50.0, status: makes, makes_node: true, node_raw: 3}
          - {seq: 5, lookup_kind: piece_end, part_id: 'stub#1', piece_index: 0, piece_rank: 2, cut_key: null, x: 100.0, y: -5.0, status: makes, makes_node: true, node_raw: 4}
          - {seq: 6, lookup_kind: weld_end, part_id: null, piece_index: null, piece_rank: null, cut_key: 'endpoint_join:stub#1|main#1|end', x: 100.0, y: -5.0, status: finds, makes_node: false, node_raw: 4}
          - {seq: 7, lookup_kind: weld_landing, part_id: null, piece_index: null, piece_rank: null, cut_key: 'endpoint_join:stub#1|main#1|end', x: 100.0, y: 0.0, status: finds, makes_node: false, node_raw: 1}
      - input: ref('stg_derived__graph_pieces')
        format: sql
        rows: |
          select 'k0' as graph_piece_key, 'piece' as row_kind, 'main#1' as part_id, 0 as piece_index, 0 as piece_rank, cast(null as bigint) as weld_rank, cast(null as varchar) as cut_key, st_geomfromtext('LINESTRING (0 0, 100 0)') as geom, cast(null as timestamp) as loaded_at
          union all
          select 'k1' as graph_piece_key, 'piece' as row_kind, 'main#1' as part_id, 1 as piece_index, 1 as piece_rank, cast(null as bigint) as weld_rank, cast(null as varchar) as cut_key, st_geomfromtext('LINESTRING (100 0, 200 0)') as geom, cast(null as timestamp) as loaded_at
          union all
          select 'k2' as graph_piece_key, 'piece' as row_kind, 'stub#1' as part_id, 0 as piece_index, 2 as piece_rank, cast(null as bigint) as weld_rank, cast(null as varchar) as cut_key, st_geomfromtext('LINESTRING (100 -50, 100 -5)') as geom, cast(null as timestamp) as loaded_at
          union all
          select 'k3' as graph_piece_key, 'landing' as row_kind, 'main#1' as part_id, cast(null as bigint) as piece_index, cast(null as bigint) as piece_rank, 0 as weld_rank, 'endpoint_join:stub#1|main#1|end' as cut_key, st_geomfromtext('POINT (100 0)') as geom, cast(null as timestamp) as loaded_at
    expect:
      rows:
        - {edge_rank: 0, part_id: 'main#1', piece_index: 0, from_node: 0, to_node: 1, length_m: 98.13, dropped_as_a_loop: false}
        - {edge_rank: 1, part_id: 'main#1', piece_index: 1, from_node: 1, to_node: 2, length_m: 98.13, dropped_as_a_loop: false}
        - {edge_rank: 2, part_id: 'stub#1', piece_index: 0, from_node: 3, to_node: 1, length_m: 45.86, dropped_as_a_loop: false}

  - name: int_trail_network__raw_edges_a_loop_shorter_than_the_grid_is_noise
    description: >
      build_graph()'s first loop rule, in EPSG:5070 metres: a 341.42 m loop
      trail whose ends are one node is an edge from that node to itself
      (length_m 341.51, on the ellipsoid), while a 0.37 m speck whose ends
      are one node is float noise and never an edge, its node never
      numbered.
    model: int_trail_network__raw_edges
    given:
      - input: ref('int_trail_network__node_lookups')
        rows:
          - {seq: 0, lookup_kind: piece_start, part_id: 'loop#1', piece_index: 0, piece_rank: 0, x: 0.0, y: 0.0, status: makes, makes_node: true, node_raw: 0}
          - {seq: 1, lookup_kind: piece_end, part_id: 'loop#1', piece_index: 0, piece_rank: 0, x: 0.0, y: 0.0, status: finds, makes_node: false, node_raw: 0}
          - {seq: 2, lookup_kind: piece_start, part_id: 'speck#1', piece_index: 0, piece_rank: 1, x: 200.0, y: 0.0, status: makes, makes_node: true, node_raw: 1}
          - {seq: 3, lookup_kind: piece_end, part_id: 'speck#1', piece_index: 0, piece_rank: 1, x: 200.1, y: 0.0, status: finds, makes_node: false, node_raw: 1}
          - {seq: 4, lookup_kind: piece_start, part_id: 'line#1', piece_index: 0, piece_rank: 2, x: 300.0, y: 0.0, status: makes, makes_node: true, node_raw: 2}
          - {seq: 5, lookup_kind: piece_end, part_id: 'line#1', piece_index: 0, piece_rank: 2, x: 400.0, y: 0.0, status: makes, makes_node: true, node_raw: 3}
      - input: ref('stg_derived__graph_pieces')
        format: sql
        rows: |
          select 'k0' as graph_piece_key, 'piece' as row_kind, 'loop#1' as part_id, 0 as piece_index, 0 as piece_rank, cast(null as bigint) as weld_rank, cast(null as varchar) as cut_key, st_geomfromtext('LINESTRING (0 0, 100 0, 100 100, 0 0)') as geom, cast(null as timestamp) as loaded_at
          union all
          select 'k1' as graph_piece_key, 'piece' as row_kind, 'speck#1' as part_id, 0 as piece_index, 1 as piece_rank, cast(null as bigint) as weld_rank, cast(null as varchar) as cut_key, st_geomfromtext('LINESTRING (200 0, 200.2 0.1, 200.1 0)') as geom, cast(null as timestamp) as loaded_at
          union all
          select 'k2' as graph_piece_key, 'piece' as row_kind, 'line#1' as part_id, 0 as piece_index, 2 as piece_rank, cast(null as bigint) as weld_rank, cast(null as varchar) as cut_key, st_geomfromtext('LINESTRING (300 0, 400 0)') as geom, cast(null as timestamp) as loaded_at
    expect:
      rows:
        - {edge_rank: 0, part_id: 'loop#1', from_node: 0, to_node: 0, length_m: 341.51, dropped_as_a_loop: false}
        - {edge_rank: 1, part_id: 'line#1', from_node: 1, to_node: 2, length_m: 98.13, dropped_as_a_loop: false}

  - name: int_trail_network__raw_edges_a_piece_a_weld_closes_on_itself_is_dropped
    description: >
      build_graph()'s second loop rule, after the welds: the 0.45 m piece
      runs between two nodes, because its start found the west line's node
      0.45 m off and its end, 0.9 m from that node, made its own; then a
      weld merges its end's node into its start's, and a piece of at most
      0.5 m from a node to itself is dropped, keeping its place in the
      numbering.
    model: int_trail_network__raw_edges
    given:
      - input: ref('int_trail_network__node_lookups')
        rows:
          - {seq: 0, lookup_kind: piece_start, part_id: 'west#1', piece_index: 0, piece_rank: 0, x: 0.0, y: 0.0, status: makes, makes_node: true, node_raw: 0}
          - {seq: 1, lookup_kind: piece_end, part_id: 'west#1', piece_index: 0, piece_rank: 0, x: -50.0, y: 0.0, status: makes, makes_node: true, node_raw: 1}
          - {seq: 2, lookup_kind: piece_start, part_id: 'short#1', piece_index: 0, piece_rank: 1, x: 0.45, y: 0.0, status: finds, makes_node: false, node_raw: 0}
          - {seq: 3, lookup_kind: piece_end, part_id: 'short#1', piece_index: 0, piece_rank: 1, x: 0.9, y: 0.0, status: makes, makes_node: true, node_raw: 2}
          - {seq: 4, lookup_kind: weld_end, cut_key: 'endpoint_join:short#1|west#1|end', x: 0.9, y: 0.0, status: finds, makes_node: false, node_raw: 2}
          - {seq: 5, lookup_kind: weld_landing, cut_key: 'endpoint_join:short#1|west#1|end', x: 0.0, y: 0.0, status: finds, makes_node: false, node_raw: 0}
      - input: ref('stg_derived__graph_pieces')
        format: sql
        rows: |
          select 'k0' as graph_piece_key, 'piece' as row_kind, 'west#1' as part_id, 0 as piece_index, 0 as piece_rank, cast(null as bigint) as weld_rank, cast(null as varchar) as cut_key, st_geomfromtext('LINESTRING (0 0, -50 0)') as geom, cast(null as timestamp) as loaded_at
          union all
          select 'k1' as graph_piece_key, 'piece' as row_kind, 'short#1' as part_id, 0 as piece_index, 1 as piece_rank, cast(null as bigint) as weld_rank, cast(null as varchar) as cut_key, st_geomfromtext('LINESTRING (0.45 0, 0.9 0)') as geom, cast(null as timestamp) as loaded_at
    expect:
      rows:
        - {edge_rank: 0, part_id: 'west#1', from_node: 0, to_node: 1, dropped_as_a_loop: false}
        - {edge_rank: 1, part_id: 'short#1', from_node: 0, to_node: 0, dropped_as_a_loop: true}

  - name: int_trail_network__raw_edges_an_edges_length_is_its_wgs84_geodesic_in_alaska_and_the_lower_48
    description: >
      Decision 90 (the maintainer, 2026-10-06): length_m is measured on the
      WGS84 ellipsoid, not in EPSG:5070, which is equal-area for the lower 48
      only. Each piece is 1,000 m on the ellipsoid, placed with pyproj's
      Geod: north from Anchorage (-149.9, 61.2), and east from Harriman
      (-74.1, 41.25). In EPSG:5070 they read 887.73 m and 992.04 m (measured
      2026-10-06 with pyproj), which is what length_m was before. dbt
      compares a double to 0.1 m here, so
      tests/test_dbt_trail_network_parity.py also holds the macro this
      model measures with to pyproj's length, to the micrometre.
    model: int_trail_network__raw_edges
    given:
      - input: ref('int_trail_network__node_lookups')
        rows:
          - {seq: 0, lookup_kind: piece_start, part_id: 'anchorage#1', piece_index: 0, piece_rank: 0, x: -3092123.813090596, y: 5074612.8822446335, status: makes, makes_node: true, node_raw: 0}
          - {seq: 1, lookup_kind: piece_end, part_id: 'anchorage#1', piece_index: 0, piece_rank: 0, x: -3091646.883356627, y: 5075361.614071704, status: makes, makes_node: true, node_raw: 1}
          - {seq: 2, lookup_kind: piece_start, part_id: 'harriman#1', piece_index: 0, piece_rank: 1, x: 1804897.8642884493, y: 2235872.222025077, status: makes, makes_node: true, node_raw: 2}
          - {seq: 3, lookup_kind: piece_end, part_id: 'harriman#1', piece_index: 0, piece_rank: 1, x: 1805863.6823790444, y: 2236098.80899946, status: makes, makes_node: true, node_raw: 3}
      - input: ref('stg_derived__graph_pieces')
        format: sql
        rows: |
          select 'k0' as graph_piece_key, 'piece' as row_kind, 'anchorage#1' as part_id, 0 as piece_index, 0 as piece_rank, cast(null as bigint) as weld_rank, cast(null as varchar) as cut_key, st_geomfromtext('LINESTRING (-3092123.813090596 5074612.8822446335, -3091646.883356627 5075361.614071704)') as geom, cast(null as timestamp) as loaded_at
          union all
          select 'k1' as graph_piece_key, 'piece' as row_kind, 'harriman#1' as part_id, 0 as piece_index, 1 as piece_rank, cast(null as bigint) as weld_rank, cast(null as varchar) as cut_key, st_geomfromtext('LINESTRING (1804897.8642884493 2235872.222025077, 1805863.6823790444 2236098.80899946)') as geom, cast(null as timestamp) as loaded_at
    expect:
      rows:
        - {edge_rank: 0, part_id: 'anchorage#1', from_node: 0, to_node: 1, length_m: 1000.0, dropped_as_a_loop: false}
        - {edge_rank: 1, part_id: 'harriman#1', from_node: 2, to_node: 3, length_m: 1000.0, dropped_as_a_loop: false}

  - name: int_trail_network__edges_an_edge_is_its_piece_back_in_lon_lat
    description: >
      Ports test_every_edge_carries_its_pieces_own_vertices_in_walking_order:
      each kept edge's GeoJSON carries its piece's own vertices back in
      lon/lat at six decimals, the bend at the corner included, so a route
      is drawn on the trail and not as a chord across it. An edge compaction
      dropped is not an edge, and the ones after it close the gap, so
      edge_index stays trail_graph.json's position.
    model: int_trail_network__edges
    given:
      - input: ref('int_trail_network__raw_edges')
        rows:
          - {edge_rank: 0, part_id: 'oprhp_trails:1#1', piece_index: 0, from_node: 0, to_node: 1, length_m: 1641.45, dropped_as_a_loop: false, geom_m_wkt: 'LINESTRING (1804897.8642884493 2235872.222025077, 1805707.3676826158 2236062.1874913694, 1805451.548120733 2237152.058364394)'}
